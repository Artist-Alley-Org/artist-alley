# Docs site build verification.
#
# The artist-alley.org docs site is built from /site/ via Astro
# Starlight and deployed automatically by Cloudflare Pages on every
# push to `main` (production) and `dev` (preview). This workflow
# does NOT deploy — CF Pages owns that. It exists only to catch
# build breakage on PRs and feature branches BEFORE the dev/main
# push triggers CF Pages, so a bad docs change never lands on the
# live site.
#
# Only runs when paths under /site/ (or the API spec the prebuild
# step consumes) actually change — keeps the rest of the repo's
# CI fast.

name: Docs site

on:
  push:
    branches: [main, dev]
    paths:
      - "site/**"
      - "app/api/openapi.yaml"
      - "docs/adr/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "site/**"
      - "app/api/openapi.yaml"
      - "docs/adr/**"
      - ".github/workflows/docs.yml"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build site
    # PRs (possibly from forks) on github-hosted; trusted pushes on
    # the self-hosted runner.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","artist-alley"]') }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: site
        env:
          PUBLIC_SITE_URL: https://artist-alley.org
        run: pnpm run build

      - name: Confirm output exists
        run: |
          test -d site/dist || { echo "site/dist missing" >&2; exit 1; }
          echo "site/dist size: $(du -sh site/dist | cut -f1)"

      - name: Upload built site as a workflow artefact (debug only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: site/dist
          retention-days: 3
