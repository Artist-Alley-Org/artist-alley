# MDX hazard gate.
#
# Prose in synced-to-Astro docs paths (docs/adr/**, docs/install/**,
# docs/roadmap.md) that contains a bare `{[a-zA-Z_]`, or a bare `<`
# not followed by whitespace, outside inline code / fenced blocks /
# autolinks gets parsed as JSX by MDX and blows up the docs site
# build. Three outages hit us:
#
#   - PR #208 introduced `{up,down,undo,rate_limit,disabled}` in
#     feedback-loop docs and broke Cloudflare Pages for ~12h until
#     PR #213 landed the fix
#   - the same class of hazard flagged again mid-review of PR #213
#   - sprint 18b put `bounds A <= B` in ADR 0093 prose and killed
#     artist-alley-site's `Build verify` run 33286001571. The
#     scanner passed it: its rule was `<[a-zA-Z]`, which cannot
#     match `<=`. scripts/tests/check-mdx-hazards.test.sh now pins
#     that fail-before so the rule cannot quietly narrow again.
#
# This gate runs `scripts/check-mdx-hazards.sh` against the changed
# markdown files on every PR that touches `docs/**/*.md`. Faster
# than spinning up the full Astro build (which docs.yml already
# does when site/** changes) and catches the common case cheaply.
#
# See §4.20 of docs/v0_1_readiness.md.

name: MDX hazard check

on:
  pull_request:
    paths:
      - "docs/**/*.md"
      - "scripts/check-mdx-hazards.sh"
      - "scripts/tests/check-mdx-hazards.test.sh"
      - "scripts/tests/fixtures/mdx-hazards/**"
      - ".github/workflows/mdx-hazard-check.yml"

concurrency:
  group: mdx-hazard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Scan changed docs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          # Need the PR base ref locally to diff changed files.
          fetch-depth: 0

      - name: Scanner self-test
        # Runs on every trigger, not just when docs changed. A
        # scanner whose rule is wrong reports a clean corpus, so
        # "the corpus is clean" is not evidence the gate works; the
        # self-test is what proves it still distinguishes the
        # site-breaking prose from the safe prose.
        run: bash scripts/tests/check-mdx-hazards.test.sh

      - name: Enumerate changed markdown paths
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # Diff-only-changed .md files under docs/. The scanner
          # itself filters to synced-to-Astro paths, so passing
          # every changed .md is fine — non-synced files are
          # silently skipped.
          mapfile -t files < <(git diff --name-only --diff-filter=AM "$base...$head" -- 'docs/*.md' 'docs/**/*.md')
          printf '%s\n' "${files[@]}"
          {
            echo 'files<<EOF'
            printf '%s\n' "${files[@]}"
            echo 'EOF'
          } >>"$GITHUB_OUTPUT"

      - name: Run hazard scanner
        if: steps.changed.outputs.files != ''
        run: |
          # shellcheck disable=SC2046
          bash scripts/check-mdx-hazards.sh $(printf '%s\n' "${{ steps.changed.outputs.files }}" | tr '\n' ' ')

      - name: Nothing to scan
        if: steps.changed.outputs.files == ''
        run: echo 'No docs/*.md changes touched — nothing to scan.'
