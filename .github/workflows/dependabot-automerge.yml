# Auto-merge low-risk Dependabot bumps (#351).
#
# Dependabot opens weekly grouped minor-and-patch PRs per ecosystem
# (gomod /app, npm /web, github_actions) targeting dev. Nobody triages
# them, so green low-risk bumps sit and their transient failures read as
# noise. This lands them automatically once CI is green, and leaves
# major-version bumps for a human.
#
# Why this shape (not `gh pr merge --auto`):
#   GitHub's native auto-merge requires a PROTECTED branch with required
#   checks. dev has none, and adding protection would gate EVERY push to
#   dev — including the planning agent's direct doc/roadmap/ADR pushes —
#   behind PRs + required checks (admin-bypass or not, a repo-wide
#   behaviour change). This workflow is self-contained: no branch
#   protection, no repo-settings side effects.
#
# How it works (two triggers, one file):
#   1. `pull_request` triage — reads the update type with
#      dependabot/fetch-metadata and labels the PR: `automerge` for
#      minor+patch (incl. the grouped minor-and-patch PRs, where
#      fetch-metadata reports the HIGHEST bump in the group), or
#      `major-review` + a comment for major (never merged).
#   2. `workflow_run` merge — fires when a CI workflow finishes. Because
#      workflow_run is NOT a Dependabot-triggered event, its GITHUB_TOKEN
#      has normal write permissions (a Dependabot-triggered `pull_request`
#      token is read-only-by-default, which is why the merge can't live
#      there). It resolves the PR, and if it's an `automerge` candidate
#      AND every check on the head SHA is green, squash-merges + deletes
#      the branch. If other checks are still pending, it no-ops; the next
#      workflow to finish re-fires it, so the last-to-finish check drives
#      the merge.
#
# Where the 3D render chain gets validated on an auto-merged PR (#1049):
#   ON THE PR ITSELF, before this workflow merges anything — nowhere
#   after. This matters because the obvious assumption is wrong: the
#   merge below uses GITHUB_TOKEN, and GitHub does not trigger workflows
#   for pushes made with GITHUB_TOKEN (the recursion guard). So an
#   auto-merged PR produces NO push run on dev. Anything not verified on
#   the PR is not verified at all. #1035 (`three` 0.169 -> 0.185 in the
#   render worker) landed on dev in exactly that shape, with
#   scripts/threejs/smoke.mjs having run nowhere.
#
#   The fix is in ci.yml: its `render-chain` job makes the `docker-build`
#   job — which owns the smoke step — run on PRs that touch the chain,
#   using the path list in scripts/ci/render-chain-paths.txt. Because the
#   gate below already requires every check green, that is enough on its
#   own. The explicit assertion in the merge step is defence in depth
#   against the one thing "all green" cannot see: a check that was
#   SKIPPED. See the block in the automerge job.
#
#   Alternatives considered and rejected — see the #1049 PR body:
#   merging with a PAT (restores the push trigger, but hands a long-lived
#   broad-scope token write access on a repo whose dev branch has no
#   required checks — a large blast radius bought for a post-hoc signal),
#   and workflow_dispatch-ing the image build after merging (this one
#   does work — workflow_dispatch and repository_dispatch are the
#   documented exceptions to the GITHUB_TOKEN recursion guard — but it
#   only tells you dev is broken AFTER the bad commit is on dev, and it
#   burns a full CI run per bump to do it). Verifying before the merge
#   beats reporting after it.

name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_run:
    # Every workflow that produces a check on a Dependabot PR. When each
    # finishes it re-evaluates the merge gate; the gate itself checks
    # ALL checks, so listing the slow ones is enough to catch the last.
    # (MDX hazard check is path-filtered to docs/** and never runs on a
    # dependency bump, so it's not listed.)
    workflows: ["CI", "UI dogfood (standalone)"]
    types: [completed]

# Deny by default; each job opts into exactly what it needs.
permissions: {}

jobs:
  # ── Triage: label the PR by update type. Runs in the Dependabot
  # `pull_request` context, where fetch-metadata can read the bump.
  triage:
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # label + comment the PR
      issues: write          # create the labels if missing (labels API)
    steps:
      - name: Ensure the triage labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `gh pr edit --add-label` fails on a label that doesn't exist;
          # --force makes create idempotent (create-or-update).
          gh label create automerge --repo "$GITHUB_REPOSITORY" --force \
            --color 0e8a16 --description "Dependabot minor/patch — auto-merges on green CI"
          gh label create major-review --repo "$GITHUB_REPOSITORY" --force \
            --color b60205 --description "Dependabot major bump — needs manual review"

      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ github.token }}

      - name: Label minor + patch for auto-merge
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label automerge

      - name: Flag major for manual review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label major-review
          # Comment only on open/reopen, not on every synchronize push.
          if [ "${{ github.event.action }}" != "synchronize" ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body \
              "🛑 Major-version bump — left for manual review. Auto-merge covers minor + patch only."
          fi

  # ── Merge: fires on CI completion, with a normal write token.
  automerge:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # squash-merge + delete the branch
      pull-requests: write   # merge the PR
      checks: read           # gh pr checks — check runs
      statuses: read         # gh pr checks — commit statuses
    steps:
      - name: Resolve the PR + gate on labels and all-green checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # The PR whose head is the SHA this CI run tested. (Reliable
          # even when workflow_run.pull_requests is empty.)
          pr=$(gh api "/repos/${REPO}/commits/${HEAD_SHA}/pulls" \
                 --jq '[.[] | select(.state=="open")][0].number // empty')
          if [ -z "$pr" ]; then
            echo "No open PR for ${HEAD_SHA}; nothing to merge."
            exit 0
          fi
          echo "Resolved PR #${pr}"

          # Defence in depth: must be a Dependabot PR flagged for
          # auto-merge (minor/patch). Majors carry `major-review` only.
          info=$(gh pr view "$pr" --repo "$REPO" \
                   --json author,labels,state,isDraft)
          if [ "$(echo "$info" | jq -r '.author.login')" != "app/dependabot" ]; then
            echo "PR #${pr} is not a Dependabot PR; skipping."
            exit 0
          fi
          if [ "$(echo "$info" | jq -r '.state')" != "OPEN" ] \
             || [ "$(echo "$info" | jq -r '.isDraft')" = "true" ]; then
            echo "PR #${pr} not open/ready; skipping."
            exit 0
          fi
          if ! echo "$info" | jq -e '.labels[] | select(.name=="automerge")' >/dev/null; then
            echo "PR #${pr} not labelled automerge (major or untriaged); skipping."
            exit 0
          fi

          # Gate: every check on the PR must be green. `gh pr checks`
          # exits non-zero while any check is pending or failing — so a
          # still-running sibling workflow simply defers the merge to
          # whichever check finishes last.
          if ! gh pr checks "$pr" --repo "$REPO"; then
            echo "PR #${pr} still has pending or failing checks; deferring."
            exit 0
          fi

          # ── The 3D smoke gate must have RUN, not merely not-failed (#1049).
          #
          # `gh pr checks` above treats a SKIPPED check as passing, which
          # is right in general and wrong here: ci.yml's `docker-build`
          # job owns scripts/threejs/smoke.mjs, the one check that proves
          # 3D previews actually render, and it skips on any PR that
          # ci.yml's `render-chain` detector says is unrelated. If that
          # detector is ever wrong, the failure mode is silent — green
          # CI, auto-merge, no render validation anywhere. ADR 0068:
          # "a green CI that skipped a layer is not covered".
          #
          # So this re-derives the verdict independently, from the SAME
          # pattern file (scripts/ci/render-chain-paths.txt — one source
          # of truth, two readers) and asserts the check concluded
          # `success` when the PR touches the chain.
          #
          # Read from the BASE branch, never the PR head. This job holds
          # `contents: write`; taking its own merge policy from the branch
          # it is about to merge would let a PR exempt itself. (This is
          # also why nothing here checks out or executes PR code.)
          base=$(gh pr view "$pr" --repo "$REPO" --json baseRefName --jq '.baseRefName')
          patterns=$(gh api \
            "/repos/${REPO}/contents/scripts/ci/render-chain-paths.txt?ref=${base}" \
            --jq '.content' | base64 -d | sed 's/#.*//' | tr -d '\r' \
            | grep -v '^[[:space:]]*$' || true)
          if [ -z "$patterns" ]; then
            echo "::error title=Render-chain gate failed closed::scripts/ci/render-chain-paths.txt is unreadable on ${base}. Refusing to auto-merge PR #${pr}; merge it by hand after checking the 3D smoke."
            exit 1
          fi

          files=$(gh api "/repos/${REPO}/pulls/${pr}/files" --paginate --jq '.[].filename')
          touched=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            while IFS= read -r p; do
              [ -n "$p" ] || continue
              # Unquoted on purpose — $p is a glob from the pattern file.
              # shellcheck disable=SC2254
              case "$f" in
                $p) touched=true; echo "  render chain: ${f}  <-  ${p}" ;;
              esac
            done <<< "$patterns"
          done <<< "$files"

          if [ "$touched" = "true" ]; then
            smoke=$(gh api "/repos/${REPO}/commits/${HEAD_SHA}/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "Verify production image build")]
                    | sort_by(.started_at) | last | .conclusion // "missing"')
            if [ "$smoke" != "success" ]; then
              echo "::error title=3D smoke gate did not run::PR #${pr} touches the three.js render chain but 'Verify production image build' concluded '${smoke}' on ${HEAD_SHA}. Not auto-merging. Either ci.yml's render-chain detector disagrees with scripts/ci/render-chain-paths.txt, or the job was skipped — fix the wiring, or merge by hand after running the smoke against a locally built image."
              exit 1
            fi
            echo "3D smoke gate: success on ${HEAD_SHA}."
          else
            echo "PR #${pr} touches no render-chain path; 3D smoke not required."
          fi

          echo "All checks green — squash-merging PR #${pr}."
          gh pr merge "$pr" --repo "$REPO" --squash --delete-branch
