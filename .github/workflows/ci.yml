# PR + branch validation. Runs on every push to a long-lived branch
# (main, dev, feat/*) and on every PR targeting main or dev. PRs use
# `ubuntu-latest` so fork PRs can't run code on the self-hosted
# runner. Branch pushes are routed to the self-hosted runner for
# speed + Docker layer cache reuse.
#
# This is the merge-gate. Edge/release workflows assume CI was green.

name: CI

on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:
    branches: [main, dev]

# Cancel superseded runs on the same ref so a force-push doesn't burn
# minutes on the previous commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Pick the runner. PRs (which may originate from forks) use
  # github-hosted; trusted internal pushes use the self-hosted
  # runner labelled "artist-alley".
  pick-runner:
    name: Pick runner
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
          else
            echo 'runner=["self-hosted","artist-alley"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Lint + integration tests
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner) || needs.pick-runner.outputs.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # ---- Compose stack mirrors local dev so CI and
      # `./scripts/test.sh` exercise the same artifact (our php-fpm
      # image, our postgres init, our nginx config). Drift between CI
      # and local is the cause of half the "works on my machine" bugs
      # we'd otherwise hit.
      - name: Materialise .env for the stack
        # The self-hosted runner already runs the user's own services
        # on the default ports (postgres 5432, nginx 8080, vite 5173),
        # so the CI stack uses high ports for every host binding.
        run: |
          cp .env.example .env
          sed -i "s/^MYSQL_ROOT_PASSWORD=.*/MYSQL_ROOT_PASSWORD=ci_unused/" .env
          sed -i "s/^MYSQL_PASSWORD=.*/MYSQL_PASSWORD=ci_unused/" .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci_password/" .env
          {
            echo "POSTGRES_HOST_PORT=15452"
            echo "NGINX_HTTP_PORT=18188"
            echo "VITE_HOST_PORT=15173"
            echo "MINIO_API_PORT=19100"
            echo "MINIO_CONSOLE_PORT=19101"
          } >> .env

      - name: Sweep any leaked CI containers from previous runs
        # Self-hosted runners can leak containers if a previous job
        # was cancelled or timed out. Clear them so the new run boots
        # from a clean slate AND frees up the 15452 port if a stale
        # container is sitting on it.
        #
        # `compose down` only knows containers tied to the current
        # project's docker-compose.yml; an orphan container left over
        # from a previous workspace (with the same name but a stale
        # network ref) survives that and breaks the next `compose up`.
        # The `docker rm -f` pass catches those by name prefix.
        run: |
          docker compose down -v --remove-orphans || true
          stale=$(docker ps -aq --filter "name=^artist-alley-")
          if [ -n "$stale" ]; then
            docker rm -f $stale || true
          fi
          docker network prune -f || true

      - name: Build and start the stack
        # --profile web pulls in the Node/Vite container so the
        # svelte-check step below has something to exec into. Local
        # backend-only iterations omit it; CI needs the full surface.
        run: docker compose --profile web up -d --build

      - name: Wait for postgres to be ready
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U artist_alley -d artist_alley >/dev/null 2>&1; then
              echo "postgres ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "postgres never became ready" >&2
          docker compose logs postgres
          exit 1

      - name: PHP syntax check (every .php under include/, pages/, api/, batch/)
        run: |
          docker compose exec -T php bash -c '
            set -e
            fail=0
            for f in $(find include pages api batch -type f -name "*.php"); do
              if ! php -l "$f" > /dev/null 2>&1; then
                echo "::error file=$f::syntax error"
                php -l "$f" || true
                fail=1
              fi
            done
            exit $fail
          '

      - name: svelte-check (frontend type check)
        # Two-step:
        #   1. Generate src/lib/api/schema.d.ts directly on the runner
        #      host (gitignored, so a fresh checkout never has it).
        #      We avoid `docker compose exec` here — bind-mount perms
        #      between the host runner user and the in-image `node`
        #      user have been flaky and surface as 137 / EACCES.
        #      A one-shot container that runs as the runner host UID
        #      sidesteps both.
        #   2. Exec into the long-running web container for the actual
        #      svelte-check pass. Cap the V8 heap so tsserver can't be
        #      silently OOM-killed.
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${PWD}/web":/app \
            -v "${PWD}/app/api/openapi.yaml":/opt/openapi.yaml:ro \
            -w /app \
            artist-alley-web \
            npx --yes openapi-typescript /opt/openapi.yaml -o /app/src/lib/api/schema.d.ts
          docker compose exec -T -e NODE_OPTIONS='--max-old-space-size=4096' web sh -c 'cd /app && npm run check'

      - name: Run artist-alley integration tests (PHP + Go)
        run: ./scripts/test.sh

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose down -v --remove-orphans || true

  # ── Build the production image to confirm the multi-stage Dockerfile
  # still produces a clean amd64 artifact. Doesn't push anything —
  # publishing lives in edge.yml + release.yml. Self-hosted-only
  # because Docker buildx wants the daemon and the cache mounts.
  docker-build:
    name: Verify production image build
    needs: pick-runner
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, artist-alley]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: artist-alley:ci-${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the binary
        run: |
          docker run --rm --entrypoint /app/aa artist-alley:ci-${{ github.sha }} --version || \
          docker run --rm --entrypoint /app/aa artist-alley:ci-${{ github.sha }} -h || true
