# PR + branch validation. Runs on every push to a long-lived branch
# (main, dev) and on every PR targeting main or dev.
#
# Every job here is self-hosted `[self-hosted, artist-alley]`, on both
# pushes and PRs. This paragraph used to say "PRs use `ubuntu-latest`
# so fork PRs can't run code on the self-hosted runner" — that stopped
# being true when the runner rebalance made frontend-check and test
# unconditional, and #942 moved the last hosted job (codegen-drift)
# over too. Fork PRs get no CI here until a maintainer approves the
# run; see the note over codegen-drift for why we accepted that.
#
# This is the merge-gate. Edge/release workflows assume CI was green.
#
# # No feat/** push trigger — by design
#
# Push to feat/** previously triggered CI here AND the PR pulse below
# (via pull_request:synchronize) once the PR was open, producing two
# parallel runs per commit. The runs ended up in different
# concurrency groups (push: refs/heads/feat/X; PR: refs/pull/N/merge),
# so cancel-in-progress couldn't collapse them; one ran to success,
# the duplicate cancelled, GitHub showed the PR as "UNSTABLE" even
# though every real check passed.
#
# Dropping the feat/** push trigger means:
#   - First push to a brand-new feat/** branch with NO PR: no CI runs.
#     Open a draft PR for CI feedback before merging — that's the
#     standard pattern and matches our branch hygiene.
#   - Push to feat/** with an open PR: pull_request:synchronize runs
#     CI exactly once. No duplicates, no UNSTABLE flag.
#   - Workflow_dispatch remains available for manual runs.

name: CI

on:
  push:
    branches: [main, dev]
    # Skip CI on docs-only changes — no Go / TS / wire-format edit
    # means nothing CI cares about. Branch protection on dev/main
    # does NOT list any path-filtered check as required (single-
    # maintainer + agent-collaborator model per ADR 0046 ops note);
    # skipped workflows surface as "Skipped" not "Pending", so a
    # docs-only PR can merge without burning ~12 min of runner time.
    #
    # Be aware: **.md excludes ALL markdown including in-tree
    # README files (e.g. app/internal/foo/README.md). Today none
    # of those carry code or CI-relevant content; revisit this
    # filter if a README ever needs to gate CI.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'CHANGELOG.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'CHANGELOG.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  workflow_dispatch:

# Cancel superseded runs on the same SOURCE BRANCH so a force-push
# doesn't burn minutes on the previous commit — and so the push event
# and the pull_request event for the same tip collapse into ONE run
# (#491). Keying on github.ref split them: a push to dev is
# ref=refs/heads/dev while its open dev->main promotion PR is
# ref=refs/pull/N/merge, so the two ran in different groups and neither
# cancelled the other. github.head_ref is the PR's source branch (set
# only on pull_request); github.ref_name is the plain branch name on a
# push. So a push to dev (head_ref empty -> ref_name=dev) and the PR
# from dev (head_ref=dev) share one group, while a push to dev and an
# unrelated feat->dev PR stay distinct (dev vs the feature branch).
#
# ...and the TARGET branch is in the key too (#1043), which exempts
# exactly the case above from the collapse. #491 was right that two runs
# on one tip is waste; what it could not see is what the cancellation
# LEAVES BEHIND. Both events attach their check runs to the same commit,
# so the cancelled half puts a CANCELLED beside the SUCCESS under the
# required context (`Integration tests (full compose stack)`). GitHub
# does not resolve that to "latest wins", so mergeStateStatus goes
# BLOCKED and `gh pr merge` refuses a suite that genuinely passed. It
# cost ~14 min on the v0.9.0 promotion PR and again on v0.9.1 — and the
# two failed DIFFERENTLY, which is the tell:
#
#   v0.9.0 (b7df9f0d):    push run cancelled, PR run success.
#   v0.9.1 (af68039c):    BOTH first attempts cancelled — re-running the
#                         cancelled one re-enters the group and cancels
#                         the survivor.
#
# So no fix may assume a direction. Two candidates were rejected:
#   - `cancel-in-progress: ${{ github.base_ref != 'main' }}` is
#     direction-dependent by construction. cancel-in-progress is read
#     off the INCOMING run, so it stops the PR run cancelling the push
#     run and does nothing about the reverse — the v0.9.1 shape.
#   - dropping the `push: [dev]` trigger (what ui-pr.yml did for
#     feat/**) removes the second event entirely, but it also moves
#     when `dev` gets validated: a direct push to dev (doc/roadmap/ADR
#     pushes go straight there — see dependabot-automerge.yml on why dev
#     has no PR requirement) would then get no CI until the next
#     promotion PR. Trading a merge-gate hole for a merge-queue nuisance
#     is the wrong direction.
#
# Keying on base_ref costs one duplicate run per RELEASE and nothing
# else: the collapse #491 bought only ever engages when a promotion PR
# is open on the dev tip, and a plain push to dev with no PR has nothing
# to collapse with. Two SUCCESS check runs under one required context
# pass cleanly whether GitHub takes the latest or requires them all, so
# this fix holds under either model of the blocking behaviour.
#
# On a push, base_ref is empty -> the literal 'push'. So:
#   push to dev        -> ci-CI-dev-push
#   dev -> main PR     -> ci-CI-dev-main     (distinct: both survive)
#   feat/x -> dev PR   -> ci-CI-feat/x-dev   (unchanged; feat/** has no
#                                             push trigger to collide
#                                             with in the first place)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}-${{ github.base_ref || 'push' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Frontend type-check + production build. Pure Node work; uses
  # the self-hosted [artist-alley] runner to keep GitHub-hosted
  # minutes under the monthly quota (rebalance landed when the org
  # hit 90% of 3000-min during the encryption + 1.17 arcs).
  # Sidesteps the bind-mount / docker-from-docker EACCES + SIGKILL
  # issues we hit trying to run svelte-check inside the dev image —
  # this job spawns its own node toolchain, no compose stack.
  frontend-check:
    name: Frontend type-check + build
    runs-on: [self-hosted, artist-alley]
    timeout-minutes: 10
    # All node work runs inside `docker run node:22-alpine` rather
    # than via the workflow's `container:` directive. Why:
    #
    # `container:` makes GitHub Actions inject a node24_alpine
    # binary at /__e/node24_alpine for JS actions like
    # actions/checkout — github-hosted runners ship that binary;
    # our self-hosted runner doesn't, so the inject fails with
    # "stat /__e/node24_alpine/bin/node: no such file or directory"
    # before any user step runs.
    #
    # Doing the alpine work as per-step `docker run` keeps the
    # runner itself off alpine — actions/checkout uses the runner's
    # bare node like every other job — and the build tools (npm,
    # vite, rolldown) execute against musl inside the container,
    # matching the lockfile and dodging the gnu rolldown parser
    # regression.
    steps:
      - name: Clear stale git locks (persistent self-hosted workspace)
        run: find "${GITHUB_WORKSPACE}" -type f -name '*.lock' -path '*/.git/*' -delete 2>/dev/null || true

      - uses: actions/checkout@v7

      # Pre-pull once so subsequent steps don't each pay the
      # cold-start cost.
      - name: Pull alpine node image
        run: docker pull node:22-alpine

      - name: Install web deps (npm ci against committed lockfile)
        # npm 10 (alpine default) tolerates the lockfile not listing
        # every cross-platform optional binding; the lock was
        # generated on alpine so its musl-binding entry matches.
        # Sidesteps both the upstream gnu-rolldown parser bug AND
        # the npm 11 strictness mismatch we hit chasing this.
        run: |
          docker run --rm \
            -v "${PWD}":/work -w /work/web \
            node:22-alpine \
            sh -c 'npm ci --no-audit'

      - name: Generate API schema (TypeScript types from openapi.yaml)
        run: |
          docker run --rm \
            -v "${PWD}":/work -w /work/web \
            -e AA_OPENAPI_SPEC=../app/api/openapi.yaml \
            node:22-alpine \
            npm run generate:api

      - name: svelte-check
        run: |
          docker run --rm \
            -v "${PWD}":/work -w /work/web \
            -e NODE_OPTIONS=--max-old-space-size=4096 \
            node:22-alpine \
            npm run check

      - name: vitest (frontend unit tests)
        run: |
          docker run --rm \
            -v "${PWD}":/work -w /work/web \
            -e NODE_OPTIONS=--max-old-space-size=4096 \
            node:22-alpine \
            npm test

      - name: vite build (catches errors svelte-check can't)
        run: |
          docker run --rm \
            -v "${PWD}":/work -w /work/web \
            -e NODE_OPTIONS=--max-old-space-size=4096 \
            node:22-alpine \
            npm run build

  # ── Detect stale generated code. Re-runs sqlc + oapi-codegen +
  # openapi-typescript against the in-tree specs and `git diff`s the
  # result. Catches the common footgun of editing openapi.yaml or a
  # queries.sql file without committing the regenerated output.
  #
  # Self-hosted since #942. It was the last `ubuntu-latest` job in this
  # file, and during the 2026-08-06 Actions incident that made it the
  # only red X on an otherwise-green `dev`: `Set up job` — GitHub's own
  # provisioning, before a line of our code runs — went 2s -> 175s ->
  # 293s (failed there, zero of our steps ran) -> never started at all.
  # Our own steps took 13-22s throughout; the check was never broken.
  # A gate that cannot run is a lost signal, and a red X that is never
  # our fault trains us to ignore red.
  #
  # What we knowingly gave up, accepted rather than overlooked:
  #
  #   1. Fork PRs get no gate here. Forks cannot use self-hosted
  #      runners, so this check simply will not run on one. The repo is
  #      public with zero forks to date, and a fork PR gets manual
  #      review regardless. Owner's explicit call.
  #   2. The portability gate. `ubuntu-latest` was a vanilla box, so a
  #      green run also proved codegen reproduces off our own machines.
  #      Exposure is small — the job installs its own Go 1.26, its own
  #      Node 22, and a version-pinned oapi-codegen read out of
  #      scripts/generate.sh — but it is not zero. Nothing now proves
  #      the regen is independent of what is baked into the runner
  #      image; if that ever matters, restore a hosted twin rather than
  #      assuming this job still covers it.
  codegen-drift:
    name: Codegen drift check
    runs-on: [self-hosted, artist-alley]
    # 20, not the 10 it carried while hosted. The job's own work is
    # ~20 seconds and always has been; the budget is for the wait in
    # front of it. This file has no `needs:`, so a push to dev now
    # wants four CI slots plus edge.yml's against a pool that has been
    # measured making Integration queue eight minutes behind the image
    # build. 10 minutes of headroom over a 20-second job was generous
    # on a fresh hosted VM and is tight on a contended pool. Still far
    # short of the 30 the integration job needs, so a genuinely wedged
    # codegen run is still caught quickly.
    timeout-minutes: 20
    steps:
      # See infra/runner/README.md (#350) — the self-hosted workspace
      # persists across jobs, so a run killed mid-fetch can leave
      # .git/*.lock behind and break the NEXT job's checkout.
      - name: Clear stale git locks (persistent self-hosted workspace)
        run: find "${GITHUB_WORKSPACE}" -type f -name '*.lock' -path '*/.git/*' -delete 2>/dev/null || true

      # clean: true (the default) is load-bearing now that the
      # workspace is reused: checkout runs `git clean -ffdx` +
      # `git reset --hard HEAD` before fetching, so a generated file
      # left dirty by an earlier job cannot survive into the
      # `git status --porcelain` check at the bottom of this job and
      # be mistaken for either drift or the absence of it. Do not set
      # `clean: false` here.
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: app/go.sum

      # gofmt gate (#367). Runs before codegen so an unformatted commit
      # fails fast + points the author at the fix, rather than getting
      # buried behind the drift diff. gofmt is a static formatter — no
      # build, no modules — so it's near-instant. `gofmt -l` lists files
      # that AREN'T formatted; any output means the tree drifted and the
      # step fails. Land this gate on an already-clean tree (the gofmt
      # commit in this PR) so it starts green.
      - name: gofmt check
        working-directory: app
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean. Run 'gofmt -w ./...' in app/ and commit:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt: all files formatted"

      # 3D renderer parity across Dockerfiles — the successor to the
      # Blender pin-drift gate (#470, removed in #500 along with Blender).
      # The original failure it guarded still exists in the same shape:
      # the release image (root Dockerfile) and the local-compose image
      # (infra/docker/app/Dockerfile) declare their runtime stages
      # independently, and when they drift, prod ships with no working 3D
      # renderer while local compose is fine. The renderer is now Chromium
      # + the Node worker, so that is what has to be present in both.
      # Cheap, no build, runs on every PR incl. forks. The deeper check —
      # that the renderer actually renders — is the smoke in docker-build.
      - name: 3D renderer present in both Dockerfiles
        run: |
          for f in Dockerfile infra/docker/app/Dockerfile; do
            for needle in "chromium" "threejs-deps" "worker.mjs" "PUPPETEER_EXECUTABLE_PATH" \
                          "modelLoader.js" "defaultLighting.js"; do
              if ! grep -q "$needle" "$f"; then
                echo "::error::$f does not mention '$needle' — the three.js preview renderer is incomplete in this image. Both runtime stages must carry it (cf. #470). modelLoader.js / defaultLighting.js are the viewer modules render.html imports; without them the renderer 404s its own load path (#689)."
                exit 1
              fi
            done
          done
          # Match the things that INSTALL Blender, not the word itself —
          # both files still explain in comments why it is gone.
          if grep -qE 'BLENDER_VERSION|download\.blender\.org|/opt/blender|/app/blender' \
                 Dockerfile infra/docker/app/Dockerfile; then
            echo "::error::Blender is being installed into a base image again. It was removed in #500 (1.3 GB of a 3.64 GB image, zero callers) and returns as an opt-in converter plugin, #499 — not in the base image."
            exit 1
          fi
          echo "3D renderer (chromium + three.js worker) present in both Dockerfiles; no Blender."

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install codegen tools
        run: |
          docker pull sqlc/sqlc:latest
          # Pin oapi-codegen to the SAME version scripts/generate.sh uses,
          # sourced from that file so the two can't drift. `@latest` here
          # (the old value) is exactly what generate.sh's own comment
          # forbids: it silently tracked v2.7.2 -> v2.8.0 the day v2.8.0
          # shipped, and every PR started failing this drift check against
          # a locally-generated file that is not stale. The pin lives in
          # ONE place; CI reads it.
          ver=$(sed -n 's/^OAPI_CODEGEN_VERSION=//p' scripts/generate.sh)
          if [ -z "$ver" ]; then
            echo "::error::couldn't read OAPI_CODEGEN_VERSION from scripts/generate.sh"
            exit 1
          fi
          echo "oapi-codegen pinned to ${ver} (from scripts/generate.sh)"
          go install "github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@${ver}"

      - name: Regenerate Go specs (sqlc + oapi-codegen)
        run: |
          docker run --rm -v "${PWD}/app":/src -w /src sqlc/sqlc:latest generate
          (cd app/api && "$HOME/go/bin/oapi-codegen" -config oapi-codegen.yaml openapi.yaml)

      # The embedded site-text catalogue (#794) is a generated artifact
      # like openapi.gen.go — a copy of the frontend's en.json that the
      # override write API validates keys against. It has to be
      # regenerated HERE, not only in scripts/generate.sh: this job does
      # not call that script, so without this line editing en.json would
      # leave the server validating against a stale key set and the
      # porcelain check below would pass on it.
      - name: Regenerate embedded site-text catalogue
        run: cp web/src/lib/i18n/en.json app/internal/sitetext/catalogue.json

      - name: Regenerate frontend TypeScript schema
        # Use npx -y to fetch openapi-typescript on demand instead
        # of running npm install — the drift check only needs the
        # TS-from-yaml generator, not the full vite/rolldown
        # toolchain. Avoids the per-platform rolldown binding issue
        # that previously forced us to nuke the lockfile here.
        working-directory: web
        env:
          AA_OPENAPI_SPEC: ../app/api/openapi.yaml
        run: |
          npx -y openapi-typescript "$AA_OPENAPI_SPEC" -o src/lib/api/schema.d.ts

      - name: Fail if Go-generated files drifted
        # 1.22.I-f hardening: the prior check globbed
        # `app/internal/**/queries.sql.go|models.go|db.go` directly
        # as pathspecs, but `git diff -- '**'` does NOT recurse the
        # way shells do (each `**` matches one path segment without
        # the `:(glob)` magic prefix). PR #114's cross-package
        # models.go regen drift slipped through because the
        # double-star never reached `social/models.go`,
        # `users/models.go`, etc. — adding `was_encrypted` to
        # federation_outbox forces regen on every package's
        # models.go because sqlc emits a shared pgtype import
        # ordering signal there.
        #
        # Pivot to `git status --porcelain` instead. Codegen
        # outputs ALL land under app/internal/ (sqlc) or
        # app/internal/openapi/ (oapi-codegen); the frontend
        # schema.d.ts is gitignored + node_modules is gitignored.
        # Anything else dirty after the regen step is a drift.
        # `web/package-lock.json` is intentionally regenerated by
        # the lockfile-nuke above + filtered explicitly.
        run: |
          dirty=$(git status --porcelain \
                  -- 'app/internal/openapi/openapi.gen.go' \
                     'app/internal/' 'app/api/' \
                | grep -v -E '^\?\? .*\.(generated|gen)\.ts$' \
                | grep -v -E '\.cache/' \
                || true)
          if [ -n "$dirty" ]; then
            echo "::error::Generated Go code is stale. Run ./scripts/generate.sh and commit the result."
            echo "drifted files:"
            echo "$dirty"
            git diff -- 'app/internal/' 'app/api/' | head -200
            exit 1
          fi

  test:
    name: Integration tests (full compose stack)
    # Self-hosted unconditionally — the runner-rebalance landing
    # collapsed the prior pick-runner / fromJSON branching into
    # a single label. Same rationale as frontend-check: keep
    # GitHub-hosted minutes under the monthly quota.
    #
    # Fork-PR caveat: fork PRs won't run this on the self-hosted
    # runner; GitHub gates that via the "Approve first-time
    # contributors" setting.
    #
    # This comment used to end "...the codegen-drift job stays on
    # ubuntu-latest so a fork PR still gets at least the portability +
    # drift smoke gate." That is no longer true — #942 moved
    # codegen-drift to this same pool, so as of that change EVERY job
    # in this file is self-hosted and a fork PR gets no CI at all until
    # a maintainer approves it. Accepted deliberately: the repo has
    # zero forks and a fork PR is hand-reviewed anyway. The full
    # trade-off, including the portability coverage we gave up, is
    # written out over codegen-drift above.
    runs-on: [self-hosted, artist-alley]
    timeout-minutes: 30
    # No compose-stack concurrency group any more (#331). Each run gets
    # its own COMPOSE_PROJECT_NAME (isolated containers/network/volumes)
    # and the resources override drops every host port, so two runs on
    # the same commit — or across refs — no longer collide and don't
    # need to be serialised. The top-level workflow concurrency (per
    # ref) still cancels superseded runs of this workflow itself.
    env:
      # Per-run project name: isolates container names, the default
      # network, and named volumes from every other run on this
      # shared self-hosted runner. run_attempt keeps re-runs distinct.
      COMPOSE_PROJECT_NAME: aa-ci-${{ github.run_id }}-${{ github.run_attempt }}
      # Layer the CI resources override onto every `docker compose`
      # invocation — the workflow steps AND scripts/test.sh (which
      # calls bare `docker compose`) both inherit this. It drops host
      # ports and caps per-service memory.
      COMPOSE_FILE: docker-compose.yml:infra/docker/ci/docker-compose.resources.yml
      # Cap Go build + test parallelism so three stacks at once leave
      # CPU for everything else the shared runner hosts. The runner has
      # 125 GiB of RAM (~40 GiB free with its other workloads up), so
      # this is about cores, not memory — an earlier revision of this
      # comment claimed a "~24 GiB" budget, which was wrong by 5x and
      # was reasoned from during #886 (#887). Flows into the app image
      # build (via the override's build args) and into test.sh's golang
      # containers (forwarded with -e).
      GOFLAGS: -p=10
      GOMAXPROCS: 10

    steps:
      - name: Clear stale git locks (persistent self-hosted workspace)
        run: find "${GITHUB_WORKSPACE}" -type f -name '*.lock' -path '*/.git/*' -delete 2>/dev/null || true

      - uses: actions/checkout@v7

      # ---- Compose stack mirrors local dev so CI and
      # `./scripts/test.sh` exercise the same artifact (our app
      # binary, our postgres init, our nginx config). Drift between
      # CI and local is the cause of half the "works on my machine"
      # bugs we'd otherwise hit.
      - name: Materialise .env for the stack
        # No host-port pins needed any more (#331): the resources
        # override drops every published port, so the CI stack never
        # touches host ports (which is what used to collide with the
        # user's own services + between concurrent runs). Tests reach
        # postgres via `docker compose exec` and the app over the
        # compose network by DNS.
        #
        # AA_MASTER_KEY is required by docker-compose (the app needs
        # it to wrap the at-rest federation identity per ADR 0020).
        # We pin a deterministic test-only base64 32-byte key — the
        # CI DB is wiped at the end of every run, so it never
        # encrypts anything that needs to roll forward to prod.
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci_password/" .env
          echo "AA_MASTER_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" >> .env

      - name: Sweep this run's project
        # Drops anything from THIS run's project — a retried run re-uses
        # the same COMPOSE_PROJECT_NAME, so a previous attempt may have
        # left containers behind. `down` matches on the
        # com.docker.compose.project label, so it targets exactly what
        # this run created and can't reach a peer run's containers.
        #
        # This step used to also reap `name=^aa-ci-` containers in
        # exited/created/dead states, on the theory that a concurrent
        # run's stack is always "running" and therefore safe (#342).
        # `created` is a mid-flight state: with
        # `depends_on: condition: service_healthy` a container sits in
        # `created` for the whole dependency health-check. Run
        # 29550460998 lost its app container to a peer's reap inside an
        # 11-second window between `Created` and `Starting` — the wildcard
        # matched every run's containers, not just its own.
        #
        # Nothing replaces it, because nothing needs to: `down` above
        # already removes precisely what this run created, every workflow
        # runs it again under `if: always()`, and `docker ps -a --filter
        # name=aa-ci-` on the runner returns zero — nothing accumulates.
        # The reap only ever covered a hard-killed run (crash/OOM), which
        # is speculative; the races it caused were real. If a leak is ever
        # observed, the project name carries the run id, so a reaper can
        # ask the API whether that run is still in progress and reap only
        # if it isn't. Build that then, not now — and never with a
        # wildcard.
        #
        # `docker network prune -f` went with it: same race (a peer's
        # network is young and may momentarily have no running container
        # attached), and `down` already removes this run's own network.
        #
        # The teardown itself lives in the composite action so all six
        # cleanup sites stay identical (#599); it also reclaims the images
        # compose builds for this project, which a bare `down` +
        # `image prune -f` never could.
        uses: ./.github/actions/compose-cleanup

      - name: Build and start the stack
        # --scale web=0 because the Vite dev container fails with
        # EACCES on `/app/.svelte-kit` in CI — the bind-mount UID
        # doesn't match the container's app user. Backend tests
        # don't need the frontend; the prod build step (a separate
        # job) catches frontend regressions on its own.
        run: docker compose up -d --build --scale web=0

      - name: Wait for postgres to be ready
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U artist_alley -d artist_alley >/dev/null 2>&1; then
              echo "postgres ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "postgres never became ready" >&2
          docker compose logs postgres
          exit 1

      - name: Wait for app to finish migrations
        # Tests connect directly to the compose postgres but DO NOT
        # run migrations themselves — the app does that at boot.
        # Without this gate, a fast CI runner races the app and
        # tests see an empty schema (relation "user" does not exist).
        # Polling `goose_db_version` is the ground-truth signal that
        # goose.UpContext finished — cheaper + more direct than
        # waiting on an HTTP healthcheck.
        run: |
          target_version=$(ls app/internal/db/migrations/*.sql \
              | sed -E 's@.*/0*([0-9]+)_.*@\1@' | sort -n | tail -1)
          echo "target migration version: ${target_version}"
          for i in $(seq 1 60); do
            current=$(docker compose exec -T postgres \
                psql -U artist_alley -d artist_alley -tAc \
                "SELECT COALESCE(MAX(version_id), 0) FROM goose_db_version" \
                2>/dev/null || echo 0)
            if [ "${current}" = "${target_version}" ]; then
              echo "migrations at version ${current} after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "migrations never reached target ${target_version} (last seen: ${current})" >&2
          echo "--- postgres log ---"
          docker compose logs postgres --tail=40 || true
          echo "--- app log ---"
          docker compose logs app --tail=40 || true
          exit 1

      - name: Run artist-alley integration tests
        run: ./scripts/test.sh

      - name: Container logs on failure
        if: failure()
        # Shared action (#956) so "captured nothing" reds the step
        # instead of passing silently.
        uses: ./.github/actions/container-logs
        with:
          tail: "200"

      - name: Stop the stack
        # always(): a red run leaks exactly as much as a green one — both
        # built aa-ci-<run>-app and aa-ci-<run>-web.
        if: always()
        uses: ./.github/actions/compose-cleanup

  # ── Build the production image to confirm the multi-stage Dockerfile
  # still produces a clean amd64 artifact. Doesn't push anything —
  # publishing lives in edge.yml + release.yml. Self-hosted-only
  # because Docker buildx wants the daemon and the cache mounts.
  docker-build:
    name: Verify production image build
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, artist-alley]
    timeout-minutes: 20

    steps:
      - name: Clear stale git locks (persistent self-hosted workspace)
        run: find "${GITHUB_WORKSPACE}" -type f -name '*.lock' -path '*/.git/*' -delete 2>/dev/null || true

      - uses: actions/checkout@v7

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: artist-alley:ci-${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the binary
        run: |
          docker run --rm --entrypoint /app/aa artist-alley:ci-${{ github.sha }} --version || \
          docker run --rm --entrypoint /app/aa artist-alley:ci-${{ github.sha }} -h || true

      # Regression net for #470, carried over to the three.js renderer in
      # #500. The original bug: the release image (root Dockerfile) shipped
      # with no working 3D renderer because its runtime stage diverged from
      # infra/docker/app/Dockerfile — every 3D preview failed in prod while
      # local compose worked. Removing Blender did not remove that failure
      # mode, it only changed which pieces can go missing: Chromium's
      # dlopen deps, the node_modules copy, the importmap paths, the
      # /shared/ web modules render.html imports, a loader that moved in
      # three's addons. Every one of those fails at RENDER time, so a
      # green `docker build` proves none of them.
      #
      # scripts/threejs/smoke.mjs therefore drives the real chain — node →
      # puppeteer → Chromium/SwiftShader → render.html → modelLoader.js →
      # PNG frames on disk — once per format in threeJSExts. It asserts
      # the poster has non-transparent pixels (an empty render is what a
      # broken loader or a dead GL context looks like on disk) AND, since
      # #689, that materials were normalised and the textured fixtures came
      # out textured — flat white geometry passes an alpha check happily,
      # which is how a whole untextured catalogue shipped green.
      # Fixtures are synthesised at runtime, so there is still no committed
      # binary fixture and no dependency on the gitignored seed corpus.
      #
      # Runs in ONE docker run as the image's DEFAULT (non-root) user,
      # writing only to a container-internal path (/tmp) that user owns —
      # NOT a host bind-mount. On the self-hosted runner the container uid
      # can't write a bind-mounted dir even at chmod 777 (#494), and the
      # non-root render path is precisely what this proves, so we do NOT
      # add --user root.
      - name: Assert 3D preview smoke (three.js, amd64 release image)
        run: |
          set -euo pipefail
          IMG=artist-alley:ci-${{ github.sha }}

          echo "::group::blender must be absent (#500)"
          if docker run --rm --entrypoint sh "$IMG" -c 'command -v blender' >/dev/null 2>&1; then
            echo "::error::Blender is back in the release image. #500 removed it (1.3 GB of a 3.64 GB image, zero callers); it returns as an opt-in converter plugin, #499."
            exit 1
          fi
          echo "blender: absent, as intended"
          echo "::endgroup::"

          docker run --rm --entrypoint node "$IMG" /app/threejs/smoke.mjs

      - name: Reclaim the loaded production image
        # `load: true` above puts artist-alley:ci-<sha> into the shared
        # daemon's image store, and this job had NO cleanup at all — so
        # every push leaked one full release image (Go binary + Chromium +
        # Node, the largest single artifact CI produces). It is never
        # dangling (unique per-sha tag), so `docker image prune -f` in the
        # OTHER job could never have collected it either.
        #
        # Scope: the tag embeds this run's commit sha and no other
        # workflow builds that tag — edge.yml / release.yml push straight
        # from buildx without `load`, so they put nothing in the local
        # store. Removal is by tag and without -f: if a concurrent job
        # somehow holds the same image id under a different tag, this only
        # untags. always() so a failed 3D smoke doesn't leak it.
        if: always()
        run: |
          docker image rm "artist-alley:ci-${{ github.sha }}" || true
          docker image prune -f || true  # dangling only (shared daemon: never -a)
          docker builder prune -f --filter until=48h || true
