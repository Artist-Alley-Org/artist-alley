# PR + branch validation. Runs on every push to a long-lived branch
# (main, dev, feat/*) and on every PR targeting main or dev. PRs use
# `ubuntu-latest` so fork PRs can't run code on the self-hosted
# runner. Branch pushes are routed to the self-hosted runner for
# speed + Docker layer cache reuse.
#
# This is the merge-gate. Edge/release workflows assume CI was green.

name: CI

on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:
    branches: [main, dev]

# Cancel superseded runs on the same ref so a force-push doesn't burn
# minutes on the previous commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Frontend type-check + production build. Pure Node work, so
  # always runs on the GitHub-hosted ubuntu runner — no docker stack
  # needed. Splitting this out keeps the self-hosted runner focused
  # on integration tests that genuinely need the compose stack, and
  # sidesteps the bind-mount / docker-from-docker EACCES + SIGKILL
  # issues we hit trying to run svelte-check inside the dev image.
  frontend-check:
    name: Frontend type-check + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        # Our committed lockfile was generated inside the alpine web
        # container so it only pins @rolldown/binding-linux-x64-musl.
        # On an ubuntu runner (glibc), rolldown wants the gnu variant
        # and neither `npm ci` nor `npm install` will backfill it
        # because the lockfile says it's not in the tree.
        # Per https://github.com/npm/cli/issues/4828 the documented
        # fix is to nuke the lockfile before install so resolution
        # picks the right per-platform optional dep. We don't commit
        # the regenerated lockfile back.
        working-directory: web
        run: |
          rm -f package-lock.json
          npm install --no-audit

      - name: Generate API schema (TypeScript types from openapi.yaml)
        working-directory: web
        env:
          AA_OPENAPI_SPEC: ../app/api/openapi.yaml
        run: npm run generate:api

      - name: svelte-check
        working-directory: web
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run check

      - name: vitest (frontend unit tests)
        working-directory: web
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm test

      - name: vite build (catches errors svelte-check can't)
        working-directory: web
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

  # ── Detect stale generated code. Re-runs sqlc + oapi-codegen +
  # openapi-typescript against the in-tree specs and `git diff`s the
  # result. Catches the common footgun of editing openapi.yaml or a
  # queries.sql file without committing the regenerated output.
  codegen-drift:
    name: Codegen drift check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: app/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install codegen tools
        run: |
          docker pull sqlc/sqlc:latest
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@latest

      - name: Regenerate Go specs (sqlc + oapi-codegen)
        run: |
          docker run --rm -v "${PWD}/app":/src -w /src sqlc/sqlc:latest generate
          (cd app/api && "$HOME/go/bin/oapi-codegen" -config oapi-codegen.yaml openapi.yaml)

      - name: Regenerate frontend TypeScript schema
        # See frontend-check for why we drop the lockfile.
        working-directory: web
        env:
          AA_OPENAPI_SPEC: ../app/api/openapi.yaml
        run: |
          rm -f package-lock.json
          npm install --no-audit
          npm run generate:api

      - name: Fail if Go-generated files drifted
        # Scope the check to the actual codegen outputs. `schema.d.ts`
        # is gitignored (frontend-check exercises it via svelte-check
        # + vite build). `web/package-lock.json` is intentionally
        # regenerated by the rolldown lockfile-nuke above and is not
        # a "stale generated code" signal.
        run: |
          if ! git diff --exit-code \
              -- 'app/internal/openapi/openapi.gen.go' \
                 'app/internal/**/queries.sql.go' \
                 'app/internal/**/models.go' \
                 'app/internal/**/db.go'; then
            echo "::error::Generated Go code is stale. Run ./scripts/generate.sh and commit the result."
            exit 1
          fi

  # ── Pick the runner. PRs (which may originate from forks) use
  # github-hosted; trusted internal pushes use the self-hosted
  # runner labelled "artist-alley".
  pick-runner:
    name: Pick runner
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        # Emit a valid JSON literal in both branches so `fromJSON`
        # in the consumer job never throws. The PR branch used to
        # emit a bare `ubuntu-latest` string which fromJSON
        # rejected → the test job got silently skipped (with no
        # job entry in the run UI) instead of running on
        # ubuntu-latest as intended.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'runner="ubuntu-latest"' >> "$GITHUB_OUTPUT"
          else
            echo 'runner=["self-hosted","artist-alley"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Integration tests (full compose stack)
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner) }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # ---- Compose stack mirrors local dev so CI and
      # `./scripts/test.sh` exercise the same artifact (our app
      # binary, our postgres init, our nginx config). Drift between
      # CI and local is the cause of half the "works on my machine"
      # bugs we'd otherwise hit.
      - name: Materialise .env for the stack
        # The self-hosted runner already runs the user's own services
        # on the default ports (postgres 5432, nginx 8080, vite 5173),
        # so the CI stack uses high ports for every host binding.
        #
        # AA_MASTER_KEY is required by docker-compose (the app needs
        # it to wrap the at-rest federation identity per ADR 0020).
        # We pin a deterministic test-only base64 32-byte key — the
        # CI DB is wiped at the end of every run, so it never
        # encrypts anything that needs to roll forward to prod.
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci_password/" .env
          {
            echo "POSTGRES_HOST_PORT=15452"
            echo "NGINX_HTTP_PORT=18188"
            echo "VITE_HOST_PORT=15173"
            echo "MINIO_API_PORT=19100"
            echo "MINIO_CONSOLE_PORT=19101"
            echo "AA_MASTER_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          } >> .env

      - name: Sweep any leaked CI containers from previous runs
        # Self-hosted runners can leak containers if a previous job
        # was cancelled or timed out. Clear them so the new run boots
        # from a clean slate AND frees up the 15452 port if a stale
        # container is sitting on it.
        #
        # `compose down` only knows containers tied to the current
        # project's docker-compose.yml; an orphan container left over
        # from a previous workspace (with the same name but a stale
        # network ref) survives that and breaks the next `compose up`.
        # The `docker rm -f` pass catches those by name prefix.
        run: |
          docker compose down -v --remove-orphans || true
          stale=$(docker ps -aq --filter "name=^artist-alley-")
          if [ -n "$stale" ]; then
            docker rm -f $stale || true
          fi
          docker network prune -f || true

      - name: Build and start the stack
        # --scale web=0 because the Vite dev container fails with
        # EACCES on `/app/.svelte-kit` in CI — the bind-mount UID
        # doesn't match the container's app user. Backend tests
        # don't need the frontend; the prod build step (a separate
        # job) catches frontend regressions on its own.
        run: docker compose up -d --build --scale web=0

      - name: Wait for postgres to be ready
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U artist_alley -d artist_alley >/dev/null 2>&1; then
              echo "postgres ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "postgres never became ready" >&2
          docker compose logs postgres
          exit 1

      - name: Wait for app to finish migrations
        # Tests connect directly to the compose postgres but DO NOT
        # run migrations themselves — the app does that at boot.
        # Without this gate, a fast CI runner races the app and
        # tests see an empty schema (relation "user" does not exist).
        # Polling `goose_db_version` is the ground-truth signal that
        # goose.UpContext finished — cheaper + more direct than
        # waiting on an HTTP healthcheck.
        run: |
          target_version=$(ls app/internal/db/migrations/*.sql \
              | sed -E 's@.*/0*([0-9]+)_.*@\1@' | sort -n | tail -1)
          echo "target migration version: ${target_version}"
          for i in $(seq 1 60); do
            current=$(docker compose exec -T postgres \
                psql -U artist_alley -d artist_alley -tAc \
                "SELECT COALESCE(MAX(version_id), 0) FROM goose_db_version" \
                2>/dev/null || echo 0)
            if [ "${current}" = "${target_version}" ]; then
              echo "migrations at version ${current} after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "migrations never reached target ${target_version} (last seen: ${current})" >&2
          echo "--- postgres log ---"
          docker compose logs postgres --tail=40 || true
          echo "--- app log ---"
          docker compose logs app --tail=40 || true
          exit 1

      - name: Run artist-alley integration tests
        run: ./scripts/test.sh

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose down -v --remove-orphans || true

  # ── Build the production image to confirm the multi-stage Dockerfile
  # still produces a clean amd64 artifact. Doesn't push anything —
  # publishing lives in edge.yml + release.yml. Self-hosted-only
  # because Docker buildx wants the daemon and the cache mounts.
  docker-build:
    name: Verify production image build
    needs: pick-runner
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, artist-alley]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: artist-alley:ci-${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the binary
        run: |
          docker run --rm --entrypoint /app/aa artist-alley:ci-${{ github.sha }} --version || \
          docker run --rm --entrypoint /app/aa artist-alley:ci-${{ github.sha }} -h || true
