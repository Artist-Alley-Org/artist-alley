# Edge image build — runs on every push to `dev` that changes the
# application (docs-only pushes are skipped; see the paths-ignore
# block below). Publishes a linux/amd64 image (see the `platforms`
# note in the build step) tagged `:edge` (rolling) and
# `:edge-{short-sha}` (pinnable). The
# :edge tag is the "what's currently on dev" channel — never a stable
# release.
# `:latest` and `:vX.Y.Z` only come from version tags (see
# release.yml).
#
# Push targets BOTH registries when DOCKERHUB_TOKEN is set:
#   * ghcr.io/{owner}/artist-alley:edge
#   * docker.io/{DOCKERHUB_USERNAME}/artist-alley:edge
#
# Runs on GitHub-hosted `ubuntu-24.04` since #1514. ci.yml's
# `Verify production image build` job builds the same Dockerfile for
# linux/amd64 on that runner without pushing. History: this job ran
# on the self-hosted runner so the user's hardware drove the
# multi-arch build (arm64 cross-compile via Go's pure cross or buildx
# qemu, whichever was faster on their host).

name: Edge image

on:
  push:
    branches: [dev]
    # Docs-only pushes must not build an image. Two reasons, and the
    # second is the one that bit us (#1010):
    #
    #   1. A docs commit produces a byte-identical application image.
    #      The build is pure runner time for no new artefact.
    #   2. `concurrency: cancel-in-progress` groups every dev push
    #      together, so a close-out docs commit pushed minutes after a
    #      merge CANCELLED the edge build still running for the code
    #      commit ahead of it. Measured on dev 2026-08-10: 11 of 38
    #      runs cancelled, and the one genuine failure was a GHCR
    #      secondary-rate-limit 403 on push — the doubled push rate
    #      was itself the cause.
    #
    # ⚠️ CONSEQUENCE — do NOT "restore" this filter without reading
    # this: `:edge-{short-sha}` is now published only for commits that
    # change the application. A docs sha has no image, so
    # `git rev-parse dev` is not always a pullable tag. That is
    # deliberate and documented (docs/install/README.md tag fan-out,
    # RELEASING.md). `:edge` still always points at the newest built
    # application state. Need an image for a specific docs sha anyway?
    # Use workflow_dispatch from that ref rather than deleting this.
    #
    # Kept identical to ui-pr.yml / ci.yml so all three skip the same
    # set. Note **.md excludes in-tree READMEs too (see ci.yml's
    # comment block for that caveat).
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'CHANGELOG.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: edge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # Hardcoded lowercase: the org owner "Artist-Alley-Org" has capitals, but
  # OCI/Docker repository names must be lowercase. github.repository_owner
  # would produce an invalid tag. Update if the org is ever renamed.
  GHCR_IMAGE: ghcr.io/artist-alley-org/artist-alley

jobs:
  build:
    name: Build + push edge image
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      # Compute the full Docker Hub repo name (or empty string when
      # secret is unset → the publish step skips Docker Hub silently).
      - name: Resolve Docker Hub repo
        id: dh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "image=docker.io/${DOCKERHUB_USERNAME}/artist-alley" >> "$GITHUB_OUTPUT"
          else
            echo "image=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.dh.outputs.image != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compose tag list
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "${GHCR_IMAGE}:edge"
            echo "${GHCR_IMAGE}:edge-${{ steps.sha.outputs.short }}"
            if [ -n "${{ steps.dh.outputs.image }}" ]; then
              echo "${{ steps.dh.outputs.image }}:edge"
              echo "${{ steps.dh.outputs.image }}:edge-${{ steps.sha.outputs.short }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build + push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          # Edge publishes linux/amd64 only, by choice. The Dockerfile
          # can cross-compile arm64 today (its go-build stage installs
          # gcc-aarch64-linux-gnu and libwebp-dev:arm64 and selects
          # aarch64-linux-gnu-gcc for TARGETARCH=arm64), and release.yml
          # publishes linux/amd64,linux/arm64 with it. Enabling arm64
          # here is a separate decision. History, from when arm64 was
          # first disabled:
          # arm64 temporarily disabled. The chai2010/webp cgo
          # binding fails to cross-compile from amd64 host gcc to
          # arm64 (binutils can't emit aarch64 asm:
          # `gcc_arm64.S: Error: no such instruction stp x29,x30`),
          # AND QEMU emulation segfaults Go's mod-download path
          # under emulation (exit 139 on `go mod download`).
          # Proper fix is a matrix build with native arm64 runners
          # — GitHub offers ubuntu-24.04-arm for public repos; the
          # job would build each arch on its native runner and
          # combine via `docker buildx imagetools create`. Tracked
          # in roadmap as a follow-up; edge is amd64-only until then.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            BUILD_VERSION=edge-${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=edge-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=edge
          cache-to: type=gha,scope=edge,mode=max
          provenance: true
          sbom: true

      - name: Summary
        run: |
          {
            echo "### Edge image published"
            echo ""
            echo "**GHCR**"
            echo "- \`${GHCR_IMAGE}:edge\`"
            echo "- \`${GHCR_IMAGE}:edge-${{ steps.sha.outputs.short }}\`"
            if [ -n "${{ steps.dh.outputs.image }}" ]; then
              echo ""
              echo "**Docker Hub**"
              echo "- \`${{ steps.dh.outputs.image }}:edge\`"
              echo "- \`${{ steps.dh.outputs.image }}:edge-${{ steps.sha.outputs.short }}\`"
            fi
            echo ""
            echo "Pull: \`docker pull ${GHCR_IMAGE}:edge\`"
          } >> "$GITHUB_STEP_SUMMARY"
