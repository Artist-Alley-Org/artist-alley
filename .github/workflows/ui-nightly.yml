# UI dogfood — nightly federation run.
#
# Brings up the full dogfood stack (studio-a + studio-b via the
# dogfood compose profile), pairs them via pair.sh, then runs:
#   - the shell-scenario suite (scripts/dogfood/run-all.sh)
#   - the UI suite in `all` mode (scripts/dogfood/run-ui.sh all)
#
# Scheduled at 07:00 UTC daily; also dispatchable manually for
# federation-touching branches before merge.
#
# Self-hosted-only — the federation stack needs:
#   - mkcert installed + root CA in the host trust store
#   - /etc/hosts entry for studio-b.local
#   - sudo for the /etc/hosts edit
# These are pre-provisioned on the `artist-alley` self-hosted
# runner. up.sh validates the prereqs and bails with a clear
# error if they're missing.

name: UI dogfood (federation, nightly)

on:
  schedule:
    # 07:00 UTC daily. Reports show up just before US-PT workday.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch / tag / SHA to test"
        required: false
        default: "dev"

concurrency:
  group: ui-nightly-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui-federation:
    name: Playwright federation + shell scenarios
    runs-on: [self-hosted, artist-alley]
    # 60 min: build (~3 min) + parallel seed (~5.5 min) + pair
    # (~30s) + Vite cold-boot (~5 min) + shell scenarios + UI
    # `all` (133 standalone + 4 federation tests at ~2s each
    # under load) + teardown. Last run got cancelled at 45 min
    # halfway through the UI suite.
    timeout-minutes: 60
    # No compose-stack concurrency group (#342, extending #337): the
    # per-run COMPOSE_PROJECT_NAME + the resources override (host ports
    # dropped) isolate this run's containers, network, and volumes, so
    # it no longer clobbers — or is clobbered by — ui-pr / ci.yml. The
    # workflow-level concurrency (ui-nightly-*, above) still keeps two
    # nightlies from overlapping.
    env:
      # Per-run project name isolates the whole dual-stack (studio-a +
      # studio-b) from any other run on the shared self-hosted runner.
      COMPOSE_PROJECT_NAME: aa-ci-${{ github.run_id }}-${{ github.run_attempt }}
      # Dev images (dogfood dual-stack) + the resources override, which
      # drops every host port and caps per-service memory. No prod-image
      # override here (unlike ui-pr) — the federation UI needs the real
      # two-instance stack. Applied to every `docker compose` call.
      COMPOSE_FILE: docker-compose.yml:infra/docker/ci/docker-compose.resources.yml
      GOFLAGS: -p=10
      GOMAXPROCS: 10

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: scripts/dogfood/ui/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('scripts/dogfood/ui/package-lock.json') }}
          restore-keys: |
            ms-playwright-${{ runner.os }}-

      # No mkcert / /etc/hosts host-prereq check here — both are
      # neutralised at the workflow level:
      #   - TLS certs come from the runner template's /srv/runner-tls
      #     bind-mount (staged below into infra/docker/dogfood/certs/
      #     so up.sh's capability check skips the mkcert step).
      #   - studio-b.local resolves through the docker network alias
      #     on nginx-b (see docker-compose.yml) — works from any
      #     container attached to this run's ${COMPOSE_PROJECT_NAME}_default
      #     network, including the runner once we `docker network connect`.
      # See infra/runner/README.md for the runner-provisioning side.

      - name: Materialise .env for the stack
        # No host-port pins needed (#342): the resources override drops
        # every published port for both stacks, so nothing binds the
        # host and concurrent runs can't collide. Everything downstream
        # reaches the stack via docker DNS after the attach step —
        # including pair.sh's `https://studio-b.local:9443`, which is
        # docker-internal (nginx-b listens on 9443 inside the network).
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci_password/" .env
          echo "AA_MASTER_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" >> .env

      - name: Sweep this run's project + reap leaked CI containers
        # Drop THIS run's own project first (a retried run re-uses the
        # name) — with --profile dogfood so the profile-gated
        # app-b/nginx-b/postgres-b + their volumes go too. Then reap
        # only NON-running aa-ci-* containers so a concurrent run's
        # live dual-stack is never touched (#342, matches ci.yml).
        run: |
          docker compose --profile dogfood down -v --remove-orphans || true
          leaked=$(docker ps -aq \
            --filter "name=^aa-ci-" \
            --filter "status=exited" \
            --filter "status=created" \
            --filter "status=dead")
          if [ -n "$leaked" ]; then docker rm -f $leaked || true; fi
          docker network prune -f || true
          docker image prune -f || true  # dangling only (shared daemon: never -a)
          docker builder prune -f --filter until=48h || true  # sweep old buildkit cache (keeps ~2d for CI speed)

      - name: Sweep stale /etc/hosts entries from previous runs
        # Older up.sh versions wrote `127.0.0.1 studio-b.local`
        # into the runner's own /etc/hosts (the runner is root +
        # has its own filesystem). That entry is wrong inside the
        # runner — its 127.0.0.1 isn't where nginx-b lives — and
        # /etc/hosts takes precedence over docker DNS, so the bad
        # entry breaks `curl https://studio-b.local:9443` even
        # after we attach to the compose network. Strip the marker
        # block once per run so the runner falls through to docker
        # DNS cleanly.
        #
        # `sed -i` can't be used: docker manages /etc/hosts as a
        # bind-mount and `sed`'s atomic-rename strategy fails with
        # "Device or resource busy." Copy-back via temp file
        # instead — that overwrites the contents in place without
        # touching the inode.
        run: |
          tmp=$(mktemp)
          grep -v -E '(# artist-alley dogfood|studio-b\.local)' /etc/hosts > "$tmp" || true
          cat "$tmp" > /etc/hosts
          rm -f "$tmp"

      # The runner template bind-mounts /srv/runner-tls (on the host)
      # to /runner-tls inside the runner container — that directory
      # holds the pre-generated mkcert root CA + the studio-b.local
      # server cert + key. Copying them into the workspace's certs
      # dir before up.sh makes up.sh's capability check find them
      # and skip the mkcert step (which would otherwise fail —
      # mkcert isn't installed in the runner container).
      #
      # See infra/runner/README.md for the runner-provisioning side.
      - name: Stage TLS prereqs from the runner bind-mount
        run: |
          mkdir -p infra/docker/dogfood/certs
          if [ ! -d /runner-tls ]; then
            echo "::error::/runner-tls missing — runner template hasn't been re-applied with the TLS bundle bind-mount. See infra/runner/README.md."
            exit 1
          fi
          for f in studio-b.local.pem studio-b.local-key.pem mkcert-rootCA.pem; do
            cp -f "/runner-tls/$f" "infra/docker/dogfood/certs/$f"
          done

      - name: Bring up the full dogfood stack
        run: ./scripts/dogfood/up.sh

      # Same root cause that pushed ui-pr.yml self-hosted: the
      # runner runs inside its own docker container (`docker ps`
      # confirms `/.dockerenv` + a container-ID hostname), so
      # containers it brings up via the mounted docker.sock
      # publish their ports onto the *host* — the runner can't
      # reach them via `localhost`. Attaching the runner to the
      # compose network gives it docker DNS for `app`, `app-b`,
      # and the seed step reaches both stacks' containers.
      - name: Attach runner to the compose network
        run: |
          net="${COMPOSE_PROJECT_NAME}_default"
          docker network connect "$net" "$(hostname)" 2>/dev/null \
            || docker network connect "$net" "$(cat /etc/hostname)"

      # Seeds users + teams + assets + posts + federation rows from the
      # upstream dataset. Without this, the federation tests assert
      # against empty result sets and fail for missing-data reasons that
      # mask any real regression they're meant to catch.
      #
      # Both sites in parallel because each seed run saturates its own
      # postgres independently. The [a] / [b] prefix on each output line
      # keeps the interleaved parallel output readable in the run log.
      - name: Seed both sites in parallel via aa seed
        env:
          # HOST daemon paths, NOT the runner's /datasets bind mount:
          # `docker compose run -v` resolves the source on the host
          # daemon (the runner template maps this same host dir to
          # /datasets inside the runner).
          SITE_A_PATH: /mnt/remotes/192.168.69.145_Archives/datasets/artist_alley/site_a
          SITE_B_PATH: /mnt/remotes/192.168.69.145_Archives/datasets/artist_alley/site_b
        run: |
          # `aa seed` (#321) writes straight to each stack's postgres +
          # storage volume via a one-off `compose run` off that stack's
          # app image — no HTTP, no login. site_a → app, site_b → app-b
          # (dogfood-profiled). Each exits non-zero on any phase
          # failure, which fails this step.
          #
          # --limit-per-extension 3 shrinks each stack from ~970/~1270
          # assets down to ~45/~60, cascade-filtering posts. Keeps
          # coverage of every distinct file_extension + enough entries
          # to exercise pagination, but cuts seed wall time to well
          # under a minute. Full fidelity is only useful for manual
          # human-review runs; CI / dogfood just need coverage.
          ( docker compose run --rm --no-deps \
              -v "$SITE_A_PATH:/seed/site:ro" \
              -v "$PWD/seed/profiles:/seed/profiles:ro" \
              app seed --limit-per-extension 3 --site /seed/site --catalogue /seed/profiles \
              2>&1 | sed 's/^/[a] /' ) &
          PID_A=$!

          ( docker compose --profile dogfood run --rm --no-deps \
              -v "$SITE_B_PATH:/seed/site:ro" \
              -v "$PWD/seed/profiles:/seed/profiles:ro" \
              app-b seed --limit-per-extension 3 --site /seed/site --catalogue /seed/profiles \
              2>&1 | sed 's/^/[b] /' ) &
          PID_B=$!

          wait $PID_A; A_RC=$?
          wait $PID_B; B_RC=$?
          if [ $A_RC -ne 0 ] || [ $B_RC -ne 0 ]; then
            echo "::error::seed failed (site_a=$A_RC site_b=$B_RC)"
            exit 1
          fi

      - name: Seed diagnostic on failure
        if: failure()
        run: |
          for svc in postgres postgres-b; do
            echo "=== $svc ==="
            docker compose exec -T "$svc" psql -U artist_alley -d artist_alley -tAc \
              "SELECT 'users', count(*) FROM \"user\"
               UNION ALL SELECT 'assets', count(*) FROM assets
               UNION ALL SELECT 'posts', count(*) FROM posts;" 2>&1 || echo "($svc unreachable)"
          done

      - name: Pair studio-a + studio-b
        # Pair waits for both health endpoints + sets site.base_url
        # on both sides + registers each as a peer of the other.
        #
        # STUDIO_A_HOST + STUDIO_B_HOST point at docker DNS
        # endpoints, NOT the runner's localhost:
        #   - nginx is the dev nginx's network alias; its upstream
        #     is `app:8080` (the Go server). Same /api/v1 prefix
        #     pair.sh uses for /api/v1/auth/login etc.
        #   - studio-b.local is the network alias on nginx-b
        #     (declared in docker-compose.yml). nginx-b listens
        #     on :9443 inside the network; pair.sh's curl -sk
        #     skips cert verify so the studio-b.local cert chain
        #     doesn't have to be trusted by the runner.
        env:
          STUDIO_A_HOST: http://nginx:80
          STUDIO_B_HOST: https://studio-b.local:9443
        run: ./scripts/dogfood/pair.sh

      - name: Wait for Vite dev server (studio-a SPA)
        # The dev `app` container has no embed_web build, so it
        # serves the SPA via Vite (web container, port 5173 on the
        # docker network — `vite.aa` alias). Vite cold-boot
        # re-optimises dep bundles into the anonymous node_modules
        # volume; observed wall time 6m04s on this runner.
        # Wait 10 min for headroom — same number ui-pr.yml settled
        # on before we abandoned Vite there. Success path exits
        # early on first 200; only slow paths use the budget.
        run: |
          for i in $(seq 1 300); do
            if curl -fsS -o /dev/null "http://vite.aa:5173/"; then
              echo "Vite ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "Vite never became ready" >&2
          docker compose logs web --tail=80 || true
          exit 1

      - name: Install Playwright + browsers
        working-directory: scripts/dogfood/ui
        run: |
          npm install --no-audit
          npx playwright install --with-deps chromium

      - name: Run shell-scenario suite
        # Wire-level dogfood: synthetic outbox injection, sub-1s
        # dispatch contract, inbox row presence. Outputs a JSON
        # report under scripts/dogfood/.dogfood-runs/<ts>/.
        #
        # Same docker-DNS URLs as the pair step (the scenarios'
        # lib.sh reads STUDIO_A_HOST + STUDIO_B_HOST).
        env:
          STUDIO_A_HOST: http://nginx:80
          STUDIO_B_HOST: https://studio-b.local:9443
        run: ./scripts/dogfood/run-all.sh

      - name: Run UI suite (all projects)
        env:
          CI: "1"
          # vite.aa is the dotted alias on the `web` (Vite) service
          # (declared in docker-compose.yml). Dev's nginx routes /
          # to app:8080, but the dev app has no embed_web build so
          # the SPA only lives behind Vite — STUDIO_A_HOST has to
          # point there directly. studio-b stays on its nginx-b
          # alias; the embedded build is what ships.
          STUDIO_A_HOST: http://vite.aa:5173
          STUDIO_B_HOST: https://studio-b.local:9443
        run: ./scripts/dogfood/run-ui.sh all

      - name: Upload Playwright report
        # Always upload on a nightly run so the report is browsable
        # even on green — we want the operator to be able to glance
        # at flakes / slow tests trending.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pw-report-federation-${{ github.run_id }}
          path: |
            scripts/dogfood/ui/.pw-report/
            scripts/dogfood/ui/.pw-results/
            apply-state-*.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload shell-scenario reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shell-scenario-reports-${{ github.run_id }}
          path: scripts/dogfood/.dogfood-runs/
          retention-days: 30
          if-no-files-found: ignore

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=300

      - name: Detach runner from the compose network
        if: always()
        # Don't leave stale network attachments on the runner
        # container across runs — a force-cancelled run otherwise
        # leaves the next workflow attached to a network its
        # containers no longer belong to.
        run: |
          docker network disconnect "${COMPOSE_PROJECT_NAME}_default" "$(hostname)" 2>/dev/null || true

      - name: Stop the stack
        if: always()
        # See "Sweep leaked CI containers" above for why both
        # invocations are needed — the dogfood-profile down picks
        # up app-b/nginx-b/postgres-b + their volumes; the bare
        # one catches everything else.
        run: |
          docker compose --profile dogfood down -v --remove-orphans || true
          docker compose down -v --remove-orphans || true
