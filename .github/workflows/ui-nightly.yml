# UI dogfood — nightly federation run.
#
# Brings up the full dogfood stack (studio-a + studio-b via the
# dogfood compose profile), pairs them via pair.sh, then runs:
#   - the shell-scenario suite (scripts/dogfood/run-all.sh)
#   - the UI suite in `all` mode (scripts/dogfood/run-ui.sh all)
#
# Scheduled at 07:00 UTC daily; also dispatchable manually for
# federation-touching branches before merge.
#
# GitHub-hosted (#1514, ADR 0100). Everything the self-hosted runner
# had pre-provisioned is now created per run on the hosted VM:
#   - seed data: both public datasets at the tag pinned in
#     seed/contracts/ci-datasets.v1.json, downloaded and verified
#     against the pinned release.json (scripts/ci/public-datasets.sh),
#     replacing the SEED_SITE_A_PATH / SEED_SITE_B_PATH host mounts;
#   - TLS: a throwaway CA + studio-b.local cert
#     (scripts/ci/ephemeral-studio-b-tls.sh), replacing /runner-tls;
#   - reachability: the hosted override publishes app, nginx and
#     nginx-b on loopback at their in-network port numbers, and the
#     VM's /etc/hosts maps their names to 127.0.0.1, replacing the
#     `docker network connect` of the runner container. Every URL
#     below therefore means the same thing from the runner and from
#     the containers (docker-compose.hosted.yml has the table).
# Federation semantics are unchanged: the apps still dial each other
# by Docker DNS at http://nginx and https://studio-b.local:9443, and
# studio-a still verifies studio-b's chain through the dogfood
# override's CA mount.

name: UI dogfood (federation, nightly)

on:
  schedule:
    # 07:00 UTC daily. Reports show up just before US-PT workday.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      ref:
        # Empty by default so it falls through to github.ref — i.e. the
        # ref you dispatched from. This kills the #370 footgun: the old
        # `default: "dev"` meant `gh workflow run --ref feat/x` (no
        # -f ref) ran feat/x's WORKFLOW FILE but checked out DEV's CODE,
        # a silent wrong-answer generator. With "" the no-arg dispatch
        # tests the branch you dispatched from; pass a value only to test
        # a DIFFERENT ref than the one carrying the workflow file.
        #
        # Schedule is unaffected: it has no inputs, so this default never
        # applied to it — a scheduled run resolves github.ref to the
        # default branch (main) and tests main, exactly as before.
        description: "Branch / tag / SHA to test (default: the ref you dispatch from)"
        required: false
        default: ""

concurrency:
  group: ui-nightly-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui-federation:
    name: Playwright federation + shell scenarios
    # Standard GitHub-hosted runner: 4 CPU, 16 GiB RAM, 14 GiB SSD.
    runs-on: ubuntu-24.04
    # 90, up from the self-hosted 60 (whose own headroom was already
    # thin: a run once got cancelled at 45 min halfway through the UI
    # suite). A cold hosted VM builds TWO images (studio-a's prod image
    # and studio-b's dev image) on 4 cores and downloads both datasets
    # before the seed, pair, shell scenarios, render drain and UI `all`.
    # An estimate until hosted runs are measured.
    timeout-minutes: 90
    env:
      # One project per run; keeps compose-cleanup's scoping intact.
      COMPOSE_PROJECT_NAME: aa-ci-${{ github.run_id }}-${{ github.run_attempt }}
      # Prod-image override (same as ui-pr) + the resources override
      # (drops every inherited host port, caps per-service memory) + the
      # hosted override (publishes app / nginx / nginx-b on loopback at
      # their in-network ports; caps app-b lower, see that file).
      # scripts/dogfood/up.sh appends the dogfood override to this for
      # the studio-b half (#363), giving studio-a the prod image AND
      # the CA mount. Applied to every `docker compose` call.
      #
      # studio-a runs the prod image so the SPA is embedded in the Go
      # binary and there's no Vite container (#365). studio-b stays on
      # the dev image: nothing browses it — both Playwright projects
      # point baseURL at STUDIO_A_HOST, and the federation project
      # reads studio-b *through studio-a's session* — so app-b only
      # ever serves /api/v1 + /federation, which the dev image does.
      COMPOSE_FILE: docker-compose.yml:infra/docker/ci/docker-compose.ci.yml:infra/docker/ci/docker-compose.resources.yml:infra/docker/ci/docker-compose.hosted.yml
      # Two apps share a 16 GiB VM here. studio-a gets the base stack's
      # 8g ceiling (resources.yml would otherwise give it 10g); studio-b
      # gets 4g from the hosted override. Ceilings, not reservations.
      AA_APP_MEM_LIMIT: 8g
      # Matched to the hosted runner's 4 CPUs (was 10 on the big box).
      GOFLAGS: -p=4
      GOMAXPROCS: 4

    steps:
      - uses: actions/checkout@v7
        with:
          # inputs.ref is "" unless explicitly overridden, so this
          # resolves to github.ref — the dispatched ref on
          # workflow_dispatch, the default branch (main) on schedule.
          # See the `ref` input above (#370).
          ref: ${{ github.event.inputs.ref || github.ref }}
          # Nothing after checkout needs git auth.
          persist-credentials: false

      # Ordered by disk phase, exactly as ui-pr.yml (read its comments and
      # seed/scripts/ci_capacity.py): build both images, prune this job's
      # build cache, THEN fetch, seed, release. This predicts the whole
      # job's peak (two images, two stacks, both datasets) from the
      # measured footprints and fails in the first minute if it cannot fit.
      - name: Capacity preflight (whole job, before the build)
        run: ./scripts/ci/public-datasets.sh preflight ui-nightly

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: scripts/dogfood/ui/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('scripts/dogfood/ui/package-lock.json') }}
          restore-keys: |
            ms-playwright-${{ runner.os }}-

      - name: Materialise .env for the stack
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci_password/" .env
          echo "AA_MASTER_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" >> .env

      - name: Sweep this run's project
        # Label-scoped to THIS run's own project (a retried run re-uses
        # the name) — with --profile dogfood so the profile-gated
        # app-b/nginx-b/postgres-b + their volumes go too. The cross-run
        # `name=^aa-ci-` reap + `network prune` that used to follow are
        # gone (#371) — `created` is a mid-flight state, so the reap
        # deleted peer runs' containers. See ci.yml for the full
        # reasoning.
        #
        # Shared teardown (#599): the image prune + the 48h buildkit sweep
        # that used to be inline here now live in the composite action —
        # unchanged, just shared with ci.yml / ui-pr.yml, which had no
        # builder sweep at all. It additionally reclaims aa-ci-<run>-app.
        # app-b keeps its explicit artist-alley-app:latest tag, which
        # `--rmi local` and the <project>-* glob both leave alone.
        uses: ./.github/actions/compose-cleanup
        with:
          profiles: --profile dogfood

      # The runner and the Docker daemon share this VM: the hosted
      # override publishes app / nginx / nginx-b on 127.0.0.1 at the same
      # ports they listen on inside the network, and these names map to
      # 127.0.0.1 here, so the runner's URLs (below) reach the same
      # services, with the same Host header, as the containers' Docker
      # DNS does. Containers keep their own resolver and never see this
      # file. Before up.sh on purpose: its studio-b.local resolution
      # check then passes instead of warning. The ports must be free
      # before compose binds them.
      - name: Map the stack's names to the published loopback ports
        run: |
          for p in 80 8080 9443; do
            if ss -Hltn "sport = :${p}" | grep -q .; then
              echo "::error::port ${p} is already in use on this runner; docker-compose.hosted.yml needs it"
              ss -Hltnp "sport = :${p}" || true
              exit 1
            fi
          done
          echo "127.0.0.1 app.aa nginx studio-b.local" | sudo tee -a /etc/hosts >/dev/null
          getent hosts app.aa nginx studio-b.local

      # A throwaway CA + studio-b.local cert, in the three files and
      # names up.sh's "certs already provisioned" path looks for, so it
      # skips mkcert (not installed on hosted runners). The CA key is
      # destroyed by the script; see its header for what goes where.
      - name: Provision ephemeral studio-b.local TLS
        run: ./scripts/ci/ephemeral-studio-b-tls.sh infra/docker/dogfood/certs

      - name: Bring up the full dogfood stack
        run: ./scripts/dogfood/up.sh

      # Same as ui-pr.yml: nothing after up.sh builds (its second `up` is
      # --force-recreate without --build, and `compose run` reuses the
      # images), so this job's own BuildKit cache (measured ~6 GB of the
      # two cold builds) is dead weight. Build cache only, on a VM that is
      # discarded after the job; compose-cleanup prunes it at the end too.
      - name: Reclaim this job's build cache
        run: |
          df -B1M / | tail -1 | sed 's/^/before: /'
          docker builder prune -af
          df -B1M / | tail -1 | sed 's/^/after:  /'

      # The binding check on MEASURED free space, then the fetches: site_b
      # first (3 MB), then site_a (2.4 GB). Same helper and pins as ui-pr.yml.
      - name: Capacity check + dataset root
        run: ./scripts/ci/public-datasets.sh prepare ui-nightly

      - name: Fetch + verify the pinned public datasets
        run: |
          ./scripts/ci/public-datasets.sh fetch site_b
          ./scripts/ci/public-datasets.sh fetch site_a

      # Seeds users + teams + assets + posts + federation rows from the
      # upstream dataset. Without this, the federation tests assert
      # against empty result sets and fail for missing-data reasons that
      # mask any real regression they're meant to catch.
      #
      # Both sites in parallel because each seed run saturates its own
      # postgres independently. The [a] / [b] prefix on each output line
      # keeps the interleaved parallel output readable in the run log.
      - name: Seed both sites in parallel via aa seed
        run: |
          # The verified public site roots from the fetch step. On a
          # hosted VM the daemon and the runner see the same paths, so
          # these are the bind sources as-is.
          SITE_A_PATH="${AA_CI_DATASET_ROOT:?the dataset prepare step did not run}/sites/site_a"
          SITE_B_PATH="${AA_CI_DATASET_ROOT}/sites/site_b"

          # `aa seed` (#321) writes straight to each stack's postgres +
          # storage volume via a one-off `compose run` off that stack's
          # app image — no HTTP, no login. site_a → app, site_b → app-b
          # (dogfood-profiled). Each exits non-zero on any phase
          # failure, which fails this step.
          #
          # The two stacks are seeded under DIFFERENT contracts (#771,
          # ADR 0080's 2026-10-02 amendment), because they have
          # different readers.
          #
          # site_a -> studio-a: `--profile ci`, the same coverage-selected
          # fixture ui-pr.yml seeds. Every Playwright project (setup,
          # standalone, federation) targets STUDIO_A_HOST, so this is the
          # stack whose catalogue the suite asserts on, and the profile's
          # requiredDims floor (app/internal/seed/coverage.go) fails the
          # seed when the catalogue cannot supply a declared class.
          # Measured against the live site_a: 87/863 posts, 163/2006
          # assets, 539 MiB, 131/131 dimensions. The old
          # `--limit-per-extension 3` shrink kept 44 assets, 32 posts and
          # 11 owners, too thin for three standalone specs (a second
          # contributor page, a third feed page, a search term that spans
          # two result kinds).
          #
          # site_b -> studio-b: `--limit-per-extension 3`, no coverage
          # floor. Nothing reads studio-b's seeded catalogue: the
          # federation specs read studio-a and need only the paired peer,
          # and the shell scenarios create every studio-b row they read
          # (uploads, assets, posts) or query federation, key, inbox,
          # like and audit tables and the admin user. site_b also cannot
          # supply two required classes (asset.mature=true,
          # companions=gltf), so `--profile ci` would refuse it. If a test
          # ever starts reading studio-b's seeded content, that change
          # adds a peer coverage floor in the same PR.
          #
          # The two shrinks are never combined on one command: the seeder
          # refuses `--profile ci` together with `--limit-per-extension`.
          #
          # site_b is now the PUBLIC replacement peer (503 assets, 200
          # posts), not the old private corpus the SEED_SITE_B_PATH
          # secret pointed at. The command is unchanged.
          #
          # Precondition, not a skip (#1040): a missing site root fails
          # here and names itself, instead of reaching docker as
          # `-v ":/seed/site:ro"` (`invalid spec: empty section between
          # colons`). A nightly that quietly skipped its seed would be a
          # lost signal.
          for p in "$SITE_A_PATH" "$SITE_B_PATH"; do
            if [ ! -f "${p}/SHA256SUMS" ] || [ ! -f "${p}/MANIFEST.json" ]; then
              echo "::error title=Seed dataset missing::${p} is not a verified site root; the fetch step must have failed"
              exit 1
            fi
          done

          # --fixtures on BOTH: the nightly runs `all`, which includes
          # the standalone project, and its databases are fresh — so
          # without the seeded substrate six specs pay the one-time
          # create cost here too (#1270). site_b's command is unchanged
          # by #771 and keeps it; no current spec or scenario reads a
          # fixture principal or plate on studio-b, so it is not a
          # coverage claim.
          ( docker compose run --rm --no-deps \
              -v "$SITE_A_PATH:/seed/site:ro" \
              -v "$PWD/seed/profiles:/seed/profiles:ro" \
              app seed --profile ci --site /seed/site --catalogue /seed/profiles \
              --fixtures \
              2>&1 | sed 's/^/[a] /' ) &
          PID_A=$!

          ( docker compose --profile dogfood run --rm --no-deps \
              -v "$SITE_B_PATH:/seed/site:ro" \
              -v "$PWD/seed/profiles:/seed/profiles:ro" \
              app-b seed --limit-per-extension 3 --site /seed/site --catalogue /seed/profiles \
              --fixtures \
              2>&1 | sed 's/^/[b] /' ) &
          PID_B=$!

          wait $PID_A; A_RC=$?
          wait $PID_B; B_RC=$?
          if [ $A_RC -ne 0 ] || [ $B_RC -ne 0 ]; then
            echo "::error::seed failed (site_a=$A_RC site_b=$B_RC)"
            exit 1
          fi

      # Both seeds copied what they selected into their storage volumes;
      # nothing after this reads the datasets, so give the ~2.5 GB back
      # before two render queues and Playwright need the disk.
      - name: Release the dataset copies
        run: ./scripts/ci/public-datasets.sh release

      - name: Seed diagnostic on failure
        if: failure()
        # Row counts alone left #886 unanswerable: postgres dies mid-seed
        # (`unexpected EOF`, then WAL replay on the next connection) and a
        # re-run on the same commit passes, so the evidence has to come off
        # the failing run. The shared action adds container state, cgroup
        # oom counters and the postmaster's own crash lines around the
        # counts. --profile dogfood so postgres-b is visible at all.
        uses: ./.github/actions/seed-forensics
        with:
          services: postgres postgres-b
          profiles: --profile dogfood

      - name: Pair studio-a + studio-b
        # Pair waits for both health endpoints + sets site.base_url
        # on both sides + registers each as a peer of the other.
        #
        # STUDIO_A_HOST + STUDIO_B_HOST are the same service names the
        # containers use. From this runner they resolve through the
        # VM's /etc/hosts to the loopback ports the hosted override
        # publishes at the same numbers (see "Map the stack's names"):
        #   - nginx is the dev nginx (port 80); its upstream is
        #     `app:8080` (the Go server). Same /api/v1 prefix pair.sh
        #     uses for /api/v1/auth/login etc.
        #   - studio-b.local is nginx-b (port 9443). pair.sh's curl -sk
        #     skips cert verify, as before, so the runner does not have
        #     to trust the ephemeral CA.
        # The peer URLs pair.sh registers (http://nginx and
        # https://studio-b.local:9443) are what the apps dial over
        # Docker DNS, so federation traffic is unchanged.
        env:
          STUDIO_A_HOST: http://nginx:80
          STUDIO_B_HOST: https://studio-b.local:9443
        run: ./scripts/dogfood/pair.sh

      - name: Install Playwright + browsers
        working-directory: scripts/dogfood/ui
        run: |
          npm install --no-audit
          npx playwright install --with-deps chromium

      - name: Run shell-scenario suite
        # Wire-level dogfood: synthetic outbox injection, sub-1s
        # dispatch contract, inbox row presence. Outputs a JSON
        # report under scripts/dogfood/.dogfood-runs/<ts>/.
        #
        # Same URLs as the pair step (the scenarios' lib.sh reads
        # STUDIO_A_HOST + STUDIO_B_HOST).
        env:
          STUDIO_A_HOST: http://nginx:80
          STUDIO_B_HOST: https://studio-b.local:9443
        run: ./scripts/dogfood/run-all.sh

      # Let studio-a's render queue drain before the UI suite (#771).
      #
      # The same gate as ui-pr.yml's "Wait for the preview render queue
      # to drain" (#768, #777, #877): read its comment for the full
      # reasoning. In short, `aa seed` only ENQUEUES preview jobs, a
      # short coverage seed leaves the render tail running when the
      # suite starts, and that tail once starved the app badly enough
      # to fail setup's health probe. The body below is ui-pr's, byte
      # for byte, plus the studio-b diagnostic lines:
      #
      #   - the same NAMED list of gated preview kinds; preview.3d stays
      #     ungated (no spec reads 3D output, and it is the slowest kind);
      #   - the same 480s bound, and expiry FAILS the step with the
      #     outstanding count and slowest job;
      #   - studio-a only (postgres), because every Playwright project
      #     targets studio-a. studio-b's queue is printed, never gated.
      #
      # Placed after the shell-scenario step on purpose: the scenarios
      # take ~25s and the workers drain throughout them, so this wait
      # only pays for the tail they did not already cover.
      - name: Wait for the preview render queue to drain
        env:
          DRAIN_TIMEOUT_SECONDS: "480"
        run: |
          q() {
            docker compose exec -T postgres psql -U artist_alley \
              -d artist_alley -tAc "$1" 2>/dev/null || echo ""
          }
          # The preview kinds this gate waits on. Every per-asset render
          # kind EXCEPT preview.3d — see the note above for why 3D is
          # out and what earns a place in here.
          gated_kinds="'preview.raster','preview.gif','preview.vector',
                       'preview.psd','preview.eps','preview.pdf',
                       'preview.comic','preview.ebook','preview.text',
                       'preview.font','preview.archive','preview.audio',
                       'preview.video','preview.video.poster',
                       'preview.thumbhash_backfill'"
          pending="status IN ('pending','running') AND type IN (${gated_kinds})"
          ungated="status IN ('pending','running') AND type LIKE 'preview.%'
                     AND type NOT IN (${gated_kinds})"
          outstanding="SELECT count(*) FROM jobs WHERE ${pending};"
          breakdown="SELECT '  ' || type || ' ' || status || ' x' || count(*)
                       FROM jobs WHERE ${pending} GROUP BY type, status ORDER BY 1;"
          # Same shape, over the kinds we deliberately do NOT wait for,
          # so the log still shows the whole preview queue (#877).
          skipped="SELECT '  (not gated) ' || type || ' ' || status || ' x' || count(*)
                     FROM jobs WHERE ${ungated} GROUP BY type, status ORDER BY 1;"

          # studio-b: DIAGNOSTIC ONLY, never gating (#771). No UI test
          # reads studio-b, so its render tail cannot make a spec read an
          # unrendered asset; it is printed because both stacks render on
          # the same runner and a busy peer is useful context when a
          # drain is slow.
          qb() {
            docker compose --profile dogfood exec -T postgres-b psql -U artist_alley \
              -d artist_alley -tAc "$1" 2>/dev/null || echo ""
          }
          b_queue="SELECT '  (studio-b, not gated) ' || type || ' ' || status || ' x' || count(*)
                     FROM jobs WHERE status IN ('pending','running') AND type LIKE 'preview.%'
                     GROUP BY type, status ORDER BY 1;"
          b_total="SELECT count(*) FROM jobs WHERE status IN ('pending','running')
                     AND type LIKE 'preview.%';"
          b_report() {
            echo "studio-b preview queue ($1): $(qb "$b_total") job(s) outstanding (diagnostic, not gated)"
            qb "$b_queue"
          }

          start=$(date +%s)
          echo "preview queue after seed: $(q "$outstanding") gated job(s) outstanding"
          q "$breakdown"
          q "$skipped"
          b_report "at drain start"

          while :; do
            left=$(q "$outstanding")
            elapsed=$(( $(date +%s) - start ))
            if [ "${left:-1}" = "0" ]; then
              echo "preview queue drained after ${elapsed}s"
              break
            fi
            if [ "${elapsed}" -ge "${DRAIN_TIMEOUT_SECONDS}" ]; then
              slowest=$(q "SELECT type || ' ' ||
                                  round(extract(epoch from (now() - started_at))::numeric, 1) || 's'
                             FROM jobs WHERE ${pending} AND started_at IS NOT NULL
                             ORDER BY (now() - started_at) DESC LIMIT 1;")
              echo "::error::preview queue did not drain: ${left} gated job(s) outstanding" \
                   "after ${elapsed}s (cap ${DRAIN_TIMEOUT_SECONDS}s; slowest: ${slowest:-none})"
              q "$breakdown"
              q "$skipped"
              b_report "at studio-a drain expiry"
              exit 1
            fi
            sleep 5
          done

          # Slowest finished jobs, so the log says what the wait bought
          # even on a clean drain.
          q "SELECT '  slowest: ' || type || ' ' ||
                    round(extract(epoch from (finished_at - started_at))::numeric, 1) || 's'
               FROM jobs WHERE finished_at IS NOT NULL
               ORDER BY (finished_at - started_at) DESC LIMIT 5;"
          b_report "when studio-a drained"

      - name: Run UI suite (all projects)
        env:
          CI: "1"
          # app.aa is the dotted alias on the prod `app` service
          # (infra/docker/ci/docker-compose.ci.yml) — the same target
          # ui-pr drives, now that both suites test the embedded build.
          # Dotted because Chromium's dotless-host policy auto-upgrades
          # `http://app:8080` to HTTPS and fails with
          # ERR_SSL_PROTOCOL_ERROR.
          #
          # No readiness wait needed before this step: the SPA is
          # embedded in the Go binary, so the /healthz gate pair.sh
          # already clears means the SPA is being served too. That was
          # never true of Vite — a healthy `app` said nothing about
          # whether a separate dev server had finished booting, which
          # is why this step used to need a 10-minute preamble.
          STUDIO_A_HOST: http://app.aa:8080
          STUDIO_B_HOST: https://studio-b.local:9443
        run: ./scripts/dogfood/run-ui.sh all

      # ⚠️ include-hidden-files + if-no-files-found are BOTH load-bearing
      # here; #956 is the run where getting either wrong cost four
      # triage passes.
      #
      # `include-hidden-files` defaults to FALSE in upload-artifact@v4,
      # and every path below is dot-prefixed. The exclusion is applied
      # while globbing, so a hidden ROOT matches nothing at all — the
      # step then reports "No files were found with the provided path"
      # and, under `if-no-files-found: ignore`, exits 0 in one second.
      # On run 31160803362 that is exactly what happened: run-ui.sh had
      # just printed `HTML report: …/scripts/dogfood/ui/.pw-report/
      # index.html`, so the report demonstrably existed on disk, and
      # `GET /actions/runs/31160803362/artifacts` still returned
      # total_count: 0 for a 209-test run that failed.
      #
      # `if-no-files-found: error` is the half that keeps it from
      # happening again silently. A green "uploaded nothing" is not a
      # neutral outcome on a nightly — it is the evidence for the next
      # failure, quietly not collected, and it reads as coverage in the
      # steps list. If these paths are ever empty again the step says so
      # in the run that produced them, not three passes into triage.
      - name: Upload Playwright report
        # Always upload on a nightly run so the report is browsable
        # even on green — we want the operator to be able to glance
        # at flakes / slow tests trending.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pw-report-federation-${{ github.run_id }}
          # `apply-state-*.json` is gone: nothing writes it. Playwright's
          # storageState goes to .pw-results/admin-state.json
          # (helpers/auth.ts ADMIN_STATE_PATH), so the glob has always
          # matched zero files. Harmless under `ignore`; under `error` a
          # pattern that can never match is a booby trap for the next
          # reader.
          #
          # admin-state.json is Playwright's storageState — it holds the
          # suite's live admin session cookie. It has no diagnostic
          # value and it is not going in a 30-day artifact that anyone
          # with repo read can download. The stack it authenticates
          # against is a per-run container that no longer exists by the
          # time the artifact does, so this is hygiene rather than an
          # incident; it is excluded because the upload only started
          # working in this commit, and shipping a credential is not a
          # thing to start doing.
          path: |
            scripts/dogfood/ui/.pw-report/
            scripts/dogfood/ui/.pw-results/
            !scripts/dogfood/ui/.pw-results/admin-state.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

      - name: Upload shell-scenario reports
        # run-all.sh mkdir -p's scripts/dogfood/.dogfood-runs/<ts>/ before
        # it runs a single scenario, so on any run that reached the shell
        # suite this is populated. `error` therefore only fires when the
        # job died BEFORE the suite — in which case "there are no
        # scenario reports" is itself the thing worth saying out loud.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-scenario-reports-${{ github.run_id }}
          path: scripts/dogfood/.dogfood-runs/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

      - name: Container logs on failure
        if: failure()
        # --profile dogfood: without it a bare `docker compose logs`
        # cannot see the profile-gated studio-b half, and on run
        # 31160803362 it dumped app / nginx / postgres and ZERO lines
        # from app-b / nginx-b / postgres-b — on a workflow whose entire
        # subject is the pair of them.
        uses: ./.github/actions/container-logs
        with:
          profiles: --profile dogfood
          tail: "300"

      - name: Stop the stack
        if: always()
        # Both invocations are needed: the dogfood-profile down picks
        # up app-b/nginx-b/postgres-b + their volumes; the bare one
        # catches everything else. This always() teardown is what makes
        # the cross-run reap unnecessary (#371) — each run removes
        # exactly its own label-scoped project. The composite action
        # keeps both invocations when `profiles` is set (#599) and adds
        # the image reclaim this step was missing entirely.
        uses: ./.github/actions/compose-cleanup
        with:
          profiles: --profile dogfood

      - name: Release the dataset copies (always)
        # Idempotent; covers a run that failed or was cancelled before
        # the post-seed release. The VM is discarded afterwards anyway.
        if: always()
        run: ./scripts/ci/public-datasets.sh release

      - name: Alert Discord on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Best-effort: alerting must never mask the real failure state.
        run: |
          [ -n "$WEBHOOK" ] || { echo "DISCORD_WEBHOOK_ALERTS not set; skipping"; exit 0; }
          payload=$(jq -n --arg url "$RUN_URL" '{
            embeds: [{
              title: "Nightly dogfood run FAILED",
              url: $url,
              description: "One or more scenarios failed — run link above. If ALL scenarios failed at once, suspect the transient peer-loss flake and re-run once before digging.",
              color: 15548997
            }]
          }')
          curl -sf -H "Content-Type: application/json" -d "$payload" "$WEBHOOK" \
            || echo "::warning::Discord alert failed"
