# TEMPORARY — verification probe for #1010. Deleted before this PR
# is reviewed. Mirrors edge.yml's push trigger AND its concurrency
# group exactly, but on this feature branch with a no-op job, so both
# the path filter and the cancel-in-progress behaviour can be verified
# by `gh run list` without publishing an image or occupying the
# self-hosted runner.
name: zz probe

on:
  push:
    branches: [fix/edge-docs-paths-ignore]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'CHANGELOG.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'

concurrency:
  group: zz-probe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    name: Probe fired
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "probe fired for ${GITHUB_SHA}"
      # Stand in for edge.yml's multi-minute image build so a later
      # push can be observed cancelling (or not cancelling) this run.
      - run: sleep 150
