# Release workflow — fires on `v*` tags pushed to main. Produces:
#
#   1. GitHub Release page with auto-generated notes (via `gh release
#      create --generate-notes`, categorized by .github/release.yml)
#   2. Docker buildx → multi-arch images for linux/amd64,linux/arm64,
#      pushed to BOTH ghcr.io and Docker Hub with the tag fan-out
#      :vX.Y.Z, :vX.Y, :vX, :latest — with provenance + SBOM
#   3. Sigstore/cosign keyless signing of every published image
#
# Docker is the sole distribution channel for v0.1.0. See #238 for
# the goreleaser CGO_ENABLED=0 vs mscrnt/webp conflict that motivated
# the Docker-only trim; binary / .deb / .rpm / Homebrew paths are
# deferred post-v0.1.0.
#
# All steps run on the self-hosted runner. The release-from-tag flow
# is gated on the tag pattern, so accidental pushes can't trigger it.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0). Must already exist."
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # GitHub Release upload
  packages: write   # GHCR push
  id-token: write   # Sigstore keyless signing (OIDC)

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/artist-alley

jobs:
  release-notes:
    name: GitHub Release + auto-generated notes
    runs-on: [self-hosted, artist-alley]
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.value }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            git checkout "${{ inputs.tag }}"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          # Prerelease if the tag has a `-` suffix (e.g. -rc, -beta).
          extra_flags=""
          case "$TAG" in
            *-*) extra_flags="--prerelease" ;;
          esac
          # If a prior tag exists, seed --notes-start-tag; otherwise
          # GitHub uses the repo genesis (first-release case).
          if prev=$(git describe --tags --abbrev=0 "$TAG"^ 2>/dev/null); then
            extra_flags="$extra_flags --notes-start-tag $prev"
          fi
          gh release create "$TAG" \
            --title "artist-alley $TAG" \
            --generate-notes \
            $extra_flags

  docker:
    name: Docker — multi-arch image (GHCR + Docker Hub)
    needs: release-notes
    runs-on: [self-hosted, artist-alley]
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-notes.outputs.tag }}
          fetch-depth: 0

      - name: Resolve Docker Hub repo
        id: dh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "image=docker.io/${DOCKERHUB_USERNAME}/artist-alley" >> "$GITHUB_OUTPUT"
          else
            echo "image=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.dh.outputs.image != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ steps.dh.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(needs.release-notes.outputs.tag, '-') }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release-notes.outputs.tag }}

      - name: Build + push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ needs.release-notes.outputs.tag }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign images (keyless via Sigstore OIDC)
        env:
          COSIGN_EXPERIMENTAL: "true"
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            ref="${tag%:*}@${DIGEST}"
            echo "Signing $ref"
            cosign sign --yes "$ref"
          done

      - name: Summary
        run: |
          {
            echo "### Release ${{ needs.release-notes.outputs.tag }} published"
            echo ""
            echo "**Docker images** (multi-arch: linux/amd64,linux/arm64):"
            echo ""
            for tag in ${{ steps.meta.outputs.tags }}; do
              echo "- \`${tag}\`"
            done
            echo ""
            echo "Signed via cosign (Sigstore keyless / OIDC). Provenance + SBOM attached."
            echo ""
            echo "See the [Release notes](https://github.com/${{ github.repository }}/releases/tag/${{ needs.release-notes.outputs.tag }})."
          } >> "$GITHUB_STEP_SUMMARY"
