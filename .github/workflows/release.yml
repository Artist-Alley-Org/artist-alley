# Release workflow — fires on `v*` tags pushed to main. Produces the
# full matrix:
#
#   1. SvelteKit bundle (npm run build) → embedded into static_assets/
#   2. GoReleaser → static binaries, .tar.gz/.zip archives, .deb +
#      .rpm packages, Homebrew formula, SHA256SUMS, SBOM,
#      GitHub Release with auto-changelog
#   3. Docker buildx → multi-arch images for linux/amd64,linux/arm64,
#      pushed to BOTH ghcr.io and Docker Hub with the tag fan-out
#      :vX.Y.Z, :vX.Y, :vX, :latest
#   4. Sigstore/cosign keyless signing of every published image
#
# All steps run on the self-hosted runner. The release-from-tag flow
# is gated on the tag pattern, so accidental pushes can't trigger it.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0). Must already exist."
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # GitHub Release upload
  packages: write   # GHCR push
  id-token: write   # Sigstore keyless signing (OIDC)

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/artist-alley

jobs:
  goreleaser:
    name: GoReleaser — binaries, deb, rpm, brew
    runs-on: [self-hosted, artist-alley]
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.tag.outputs.value }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            git checkout "${{ inputs.tag }}"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache: true
          cache-dependency-path: app/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build SvelteKit bundle
        env:
          AA_OPENAPI_SPEC: ${{ github.workspace }}/app/api/openapi.yaml
        run: |
          cd web
          # `npm ci` sporadically fails to install platform-specific
          # optional native bindings (rolldown, esbuild) on CI runners
          # — see npm/cli#4828. Fall back to a clean `npm install` on
          # failure, which forces optional-dep re-resolution.
          if ! npm ci --no-audit --no-fund; then
            echo "npm ci failed; retrying with clean install (npm/cli#4828 workaround)"
            rm -rf node_modules package-lock.json
            npm install --no-audit --no-fund
          fi
          npm run build

      - name: Stage bundle into Go embed dir
        run: |
          rm -rf app/internal/http/static_assets
          mkdir -p app/internal/http/static_assets
          cp -r web/build/. app/internal/http/static_assets/
          touch app/internal/http/static_assets/.embed-placeholder

      - name: Install Syft (SBOM)
        uses: anchore/sbom-action/download-syft@v0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || '' }}

  docker:
    name: Docker — multi-arch image (GHCR + Docker Hub)
    needs: goreleaser
    runs-on: [self-hosted, artist-alley]
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.goreleaser.outputs.tag }}
          fetch-depth: 0

      - name: Resolve Docker Hub repo
        id: dh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "image=docker.io/${DOCKERHUB_USERNAME}/artist-alley" >> "$GITHUB_OUTPUT"
          else
            echo "image=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.dh.outputs.image != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ steps.dh.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(needs.goreleaser.outputs.tag, '-') }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.goreleaser.outputs.tag }}

      - name: Build + push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ needs.goreleaser.outputs.tag }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign images (keyless via Sigstore OIDC)
        env:
          COSIGN_EXPERIMENTAL: "true"
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            ref="${tag%:*}@${DIGEST}"
            echo "Signing $ref"
            cosign sign --yes "$ref"
          done

      - name: Summary
        run: |
          {
            echo "### Release ${{ needs.goreleaser.outputs.tag }} published"
            echo ""
            echo "**Docker images** (multi-arch: linux/amd64,linux/arm64):"
            echo ""
            for tag in ${{ steps.meta.outputs.tags }}; do
              echo "- \`${tag}\`"
            done
            echo ""
            echo "Signed via cosign (Sigstore keyless / OIDC)."
            echo ""
            echo "**Binaries, .deb, .rpm, Homebrew**: see the [Release notes](https://github.com/${{ github.repository }}/releases/tag/${{ needs.goreleaser.outputs.tag }})."
          } >> "$GITHUB_STEP_SUMMARY"
