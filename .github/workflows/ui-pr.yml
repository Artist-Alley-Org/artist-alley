# UI dogfood — fast PR / branch validation.
#
# Runs the Playwright `standalone` project against the dev stack on
# every PR + every push to a long-lived branch. Brings up just
# studio-a (no studio-b / no pair.sh / no mkcert) so the cycle is
# ~4-6 minutes end-to-end.
#
# Federation tests run in ui-nightly.yml — they need the dogfood
# compose profile + mkcert + /etc/hosts which is too much setup for
# a PR-blocking workflow.
#
# Pairs with ci.yml: ci.yml gates Go + frontend correctness; this
# workflow gates the UI surface (navigation, forms, admin pages
# render against the live API).

name: UI dogfood (standalone)

on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ui-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # PRs from forks can't run on the self-hosted runner. Trusted
  # internal pushes route there for speed + warm Docker layer cache.
  # Mirror of ci.yml's pick-runner job.
  pick-runner:
    name: Pick runner
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'runner="ubuntu-latest"' >> "$GITHUB_OUTPUT"
          else
            echo 'runner=["self-hosted","artist-alley"]' >> "$GITHUB_OUTPUT"
          fi

  ui-standalone:
    name: Playwright standalone
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner) }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: scripts/dogfood/ui/package-lock.json

      # Playwright's Chromium download is ~150 MB. Cache it across
      # runs so we only re-fetch when Playwright bumps.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('scripts/dogfood/ui/package-lock.json') }}
          restore-keys: |
            ms-playwright-${{ runner.os }}-

      # Materialise .env the same shape as ci.yml's `test` job — high
      # ports so the runner's local services don't collide. UID + GID
      # left at default 1000 so the heavy `app` image (Blender +
      # ffmpeg + ImageMagick etc.) stays cache-warm across PR runs —
      # changing them invalidates the entire app build layer chain.
      - name: Materialise .env for the stack
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci_password/" .env
          {
            echo "POSTGRES_HOST_PORT=15452"
            echo "NGINX_HTTP_PORT=18188"
            echo "VITE_HOST_PORT=15173"
            echo "MINIO_API_PORT=19100"
            echo "MINIO_CONSOLE_PORT=19101"
            echo "AA_MASTER_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          } >> .env

      - name: Sweep leaked CI containers
        run: |
          docker compose down -v --remove-orphans || true
          stale=$(docker ps -aq --filter "name=^artist-alley-")
          if [ -n "$stale" ]; then docker rm -f $stale || true; fi
          docker network prune -f || true

      # The `web` (Vite) container's in-image `node` user is UID
      # 1000 (default ARG). On a github-hosted runner the workspace
      # is owned by user `runner` (UID 1001 or similar), so the
      # bind-mounted ./web/ tree is unwritable to the container's
      # user → Vite crashes with EACCES on `/app/.svelte-kit` and
      # the SPA never serves. Chowning ./web/ to 1000 lets the
      # container write its generated dirs. Workspace is recycled
      # between jobs so the ownership flip has no follow-on effect.
      - name: Allow the web container to write its bind-mount
        run: sudo chown -R 1000:1000 web

      - name: Bring up the full stack (including web)
        run: docker compose up -d --build

      - name: Wait for postgres to be ready
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U artist_alley -d artist_alley >/dev/null 2>&1; then
              echo "postgres ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "postgres never became ready" >&2
          docker compose logs postgres
          exit 1

      - name: Wait for app to finish migrations
        # Polls goose_db_version because the app runs migrations at
        # boot. Same gate ci.yml uses for the integration suite.
        run: |
          target_version=$(ls app/internal/db/migrations/*.sql \
              | sed -E 's@.*/0*([0-9]+)_.*@\1@' | sort -n | tail -1)
          for i in $(seq 1 60); do
            current=$(docker compose exec -T postgres \
                psql -U artist_alley -d artist_alley -tAc \
                "SELECT COALESCE(MAX(version_id), 0) FROM goose_db_version" \
                2>/dev/null || echo 0)
            if [ "${current}" = "${target_version}" ]; then
              echo "migrations at version ${current} after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "migrations never reached target ${target_version}" >&2
          docker compose logs app --tail=40 || true
          exit 1

      - name: Wait for the Vite SPA to respond
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null "http://127.0.0.1:15173/"; then
              echo "Vite ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "Vite never became ready" >&2
          docker compose logs web --tail=80 || true
          exit 1

      - name: Install Playwright + browsers
        working-directory: scripts/dogfood/ui
        run: |
          npm install --no-audit
          npx playwright install --with-deps chromium

      - name: Run UI standalone suite
        env:
          STUDIO_A_HOST: http://127.0.0.1:15173
          CI: "1"
        run: ./scripts/dogfood/run-ui.sh standalone

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pw-report-standalone-${{ github.run_id }}
          path: |
            scripts/dogfood/ui/.pw-report/
            scripts/dogfood/ui/.pw-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose down -v --remove-orphans || true
