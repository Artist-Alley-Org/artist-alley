# UI dogfood — fast PR / branch validation.
#
# Runs the Playwright `standalone` project against the dev stack on
# every PR + every push to a long-lived branch. Brings up just
# studio-a (no studio-b / no pair.sh / no mkcert) so the cycle is
# ~4-6 minutes end-to-end.
#
# Federation tests run in ui-nightly.yml — they need the dogfood
# compose profile + mkcert + /etc/hosts which is too much setup for
# a PR-blocking workflow.
#
# Pairs with ci.yml: ci.yml gates Go + frontend correctness; this
# workflow gates the UI surface (navigation, forms, admin pages
# render against the live API).

name: UI dogfood (standalone)

on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ui-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # PRs from forks can't run on the self-hosted runner. Trusted
  # internal pushes route there for speed + warm Docker layer cache.
  # Mirror of ci.yml's pick-runner job.
  pick-runner:
    name: Pick runner
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'runner="ubuntu-latest"' >> "$GITHUB_OUTPUT"
          else
            echo 'runner=["self-hosted","artist-alley"]' >> "$GITHUB_OUTPUT"
          fi

  ui-standalone:
    name: Playwright standalone
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner) }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            web/package-lock.json
            scripts/dogfood/ui/package-lock.json

      # Playwright's Chromium download is ~150 MB. Cache it across
      # runs so we only re-fetch when Playwright bumps.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('scripts/dogfood/ui/package-lock.json') }}
          restore-keys: |
            ms-playwright-${{ runner.os }}-

      # Materialise .env the same shape as ci.yml's `test` job — high
      # ports so the runner's local services don't collide.
      - name: Materialise .env for the stack
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci_password/" .env
          {
            echo "POSTGRES_HOST_PORT=15452"
            echo "NGINX_HTTP_PORT=18188"
            echo "VITE_HOST_PORT=15173"
            echo "MINIO_API_PORT=19100"
            echo "MINIO_CONSOLE_PORT=19101"
            echo "AA_MASTER_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          } >> .env

      - name: Sweep leaked CI containers
        run: |
          docker compose down -v --remove-orphans || true
          stale=$(docker ps -aq --filter "name=^artist-alley-")
          if [ -n "$stale" ]; then docker rm -f $stale || true; fi
          docker network prune -f || true

      # The `web` (Vite) compose service fails in CI with EACCES on
      # `/app/.svelte-kit` — the bind-mount UID doesn't match the
      # container's app user. Same constraint ci.yml's `test` job
      # works around with `--scale web=0`. We do the same here, but
      # then run Vite directly on the runner so the Playwright
      # tests still have a SPA to talk to. Vite proxies /api/* to
      # the docker'd nginx port (NGINX_HTTP_PORT=18188), same
      # convention as local dev — just with the proxy target swapped
      # from `http://nginx:80` to `http://localhost:18188`.
      - name: Bring up the backend stack (no `web` container)
        run: docker compose up -d --build --scale web=0

      - name: Wait for postgres to be ready
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U artist_alley -d artist_alley >/dev/null 2>&1; then
              echo "postgres ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "postgres never became ready" >&2
          docker compose logs postgres
          exit 1

      - name: Wait for app to finish migrations
        # Same gate as ci.yml — polls goose_db_version because the
        # app runs migrations at boot and tests need the schema
        # before they hit the API.
        run: |
          target_version=$(ls app/internal/db/migrations/*.sql \
              | sed -E 's@.*/0*([0-9]+)_.*@\1@' | sort -n | tail -1)
          for i in $(seq 1 60); do
            current=$(docker compose exec -T postgres \
                psql -U artist_alley -d artist_alley -tAc \
                "SELECT COALESCE(MAX(version_id), 0) FROM goose_db_version" \
                2>/dev/null || echo 0)
            if [ "${current}" = "${target_version}" ]; then
              echo "migrations at version ${current} after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "migrations never reached target ${target_version}" >&2
          docker compose logs app --tail=40 || true
          exit 1

      # Install the SvelteKit frontend deps + generate the TypeScript
      # API schema. Same rolldown lockfile-nuke as ci.yml/frontend-check
      # because the committed lockfile only pins the musl rolldown
      # binding and an ubuntu (glibc) runner needs the gnu one.
      - name: Install web deps + generate API schema
        working-directory: web
        env:
          AA_OPENAPI_SPEC: ../app/api/openapi.yaml
        run: |
          rm -f package-lock.json
          npm install --no-audit
          npm run generate:api

      - name: Start Vite on the runner
        # Background process; we wait for /healthz on it next. The
        # AA_API_PROXY_TARGET override points Vite's API proxy at
        # the host-exposed nginx port instead of the in-network
        # nginx:80 hostname.
        #
        # NOTE: target is 127.0.0.1 explicitly, NOT `localhost`.
        # Node 22+ DNS prefers IPv6 (::1) which docker port-bindings
        # don't listen on by default — every proxy call would 502
        # with ECONNREFUSED. Forcing IPv4 keeps the runner-→ docker
        # bridge stable.
        working-directory: web
        env:
          AA_API_PROXY_TARGET: http://127.0.0.1:18188
        run: |
          nohup npm run dev -- --port 15173 --host 0.0.0.0 \
              > "${GITHUB_WORKSPACE}/vite.log" 2>&1 &
          echo $! > "${GITHUB_WORKSPACE}/vite.pid"

      - name: Wait for Vite to respond
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null "http://localhost:15173/"; then
              echo "Vite ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "Vite never became ready" >&2
          tail -80 "${GITHUB_WORKSPACE}/vite.log" || true
          exit 1

      - name: Install Playwright + browsers
        working-directory: scripts/dogfood/ui
        run: |
          npm install --no-audit
          npx playwright install --with-deps chromium

      - name: Run UI standalone suite
        env:
          STUDIO_A_HOST: http://localhost:15173
          CI: "1"
        run: ./scripts/dogfood/run-ui.sh standalone

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pw-report-standalone-${{ github.run_id }}
          path: |
            scripts/dogfood/ui/.pw-report/
            scripts/dogfood/ui/.pw-results/
            vite.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop Vite
        if: always()
        run: |
          if [ -f "${GITHUB_WORKSPACE}/vite.pid" ]; then
            kill "$(cat "${GITHUB_WORKSPACE}/vite.pid")" 2>/dev/null || true
          fi

      - name: Stop the stack
        if: always()
        run: docker compose down -v --remove-orphans || true
