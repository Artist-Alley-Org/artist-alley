# UI dogfood — fast PR / branch validation.
#
# Runs the Playwright `standalone` project against the production
# artifact on every PR + every push to a long-lived branch.
#
# Self-hosted only because:
#   1. The `site_a` seed dataset lives at
#      /mnt/blackbox_archives/datasets/artist_alley/site_a on the
#      runner's mount. ~30 of the 133 standalone tests walk seeded
#      posts / users / federation rows; without the dataset they
#      fail on empty result sets, not on the regression they're
#      meant to catch.
#   2. Standard docker on the self-hosted runner publishes ports
#      normally.
#
# We test the PROD image, not the dev `vite dev` stack, because:
#   1. Vite cold-boot in a fresh container runs the full dep
#      optimizer (~600 Svelte modules across two passes against
#      an empty .vite/deps/ cache) and consistently takes ~5
#      minutes wall before the dev server binds. Six prior
#      iterations of "wait longer for Vite" lost the race within
#      a second or two of the cap each time.
#   2. The prod image embeds the pre-built SPA via go:embed; the
#      Go binary serves both the SPA and the API on one port
#      with no dep-optimization step. Container ready in seconds.
#   3. The artifact tested is what ships. Catches embed_web-only
#      bugs the dev path would skip.
#   4. Single hop. No nginx + Vite proxy chain to debug when a
#      test fails.
#
# Federation tests run in ui-nightly.yml — they additionally need
# the dogfood compose profile + mkcert + /etc/hosts + pair.sh.
#
# Pairs with ci.yml: ci.yml gates Go + frontend correctness; this
# workflow gates the UI surface (navigation, forms, admin pages
# render against the live API + seeded data).
#
# Fork-PR caveat: fork PRs won't run this workflow because trusted
# runners aren't available to them. The status reports as
# "workflow skipped" — explicit, not silent.

name: UI dogfood (standalone)

on:
  # No feat/** push trigger — see ci.yml's comment block for the
  # rationale. tl;dr push + pull_request:synchronize used to fire
  # twice per commit, landed in different concurrency groups, and
  # the cancelled duplicate tripped PR mergeStateStatus=UNSTABLE.
  push:
    branches: [main, dev]
    # Same docs-only-skip rationale as ci.yml — see the comment
    # block there for the branch-protection note + the **.md
    # caveat.
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '**.md'
      - 'CHANGELOG.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '**.md'
      - 'CHANGELOG.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ui-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui-standalone:
    name: Playwright standalone
    runs-on: [self-hosted, artist-alley]
    timeout-minutes: 20
    # See ui-nightly.yml for the rationale — shared compose stack
    # on the self-hosted runner; two workflows racing on the same
    # project name clobber each other. cancel-in-progress: false
    # so a #N-merge push waits for a running ui-nightly to drain
    # rather than killing it mid-scenario.
    concurrency:
      group: artist-alley-compose-stack
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: scripts/dogfood/ui/package-lock.json

      # Playwright's Chromium download is ~150 MB. Cache it across
      # runs so we only re-fetch when Playwright bumps.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('scripts/dogfood/ui/package-lock.json') }}
          restore-keys: |
            ms-playwright-${{ runner.os }}-

      # Remap to high ports — the self-hosted runner has the user's
      # local dev stack (or another postgres) bound on the defaults.
      # NGINX_HTTP_PORT also doubles as the prod-image app's host
      # port: the CI override maps app:8080 → host:${NGINX_HTTP_PORT}.
      - name: Materialise .env for the stack
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci_password/" .env
          {
            echo "POSTGRES_HOST_PORT=15452"
            echo "NGINX_HTTP_PORT=18188"
            echo "MINIO_API_PORT=19100"
            echo "MINIO_CONSOLE_PORT=19101"
            echo "AA_MASTER_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          } >> .env

      - name: Sweep leaked CI containers
        run: |
          docker compose down -v --remove-orphans || true
          stale=$(docker ps -aq --filter "name=^artist-alley-")
          if [ -n "$stale" ]; then docker rm -f $stale || true; fi
          docker network prune -f || true

      # Replace the dev `app` service with the production image
      # (built from the root Dockerfile with `-tags embed_web`).
      # Only `app` + `postgres` are started — the prod image serves
      # the SPA + API itself, so nginx + the web (Vite) container
      # aren't needed.
      - name: Build + start the prod stack
        run: |
          docker compose \
            -f docker-compose.yml \
            -f infra/docker/ci/docker-compose.ci.yml \
            up -d --build app postgres

      # The self-hosted runner runs inside its own docker
      # container with the docker socket mounted, so containers it
      # CREATES publish their ports onto the *host*'s localhost —
      # the runner container itself can't reach `localhost:18188`.
      # Solution: attach the runner container to the compose
      # network so it can reach the app via docker DNS (`app:8080`)
      # without any port-publish gymnastics.
      - name: Attach runner to the compose network
        run: |
          docker network connect artist-alley_default "$(hostname)" || \
            docker network connect artist-alley_default "$(cat /etc/hostname)"

      - name: Wait for postgres to be ready
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U artist_alley -d artist_alley >/dev/null 2>&1; then
              echo "postgres ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "postgres never became ready" >&2
          docker compose logs postgres
          exit 1

      - name: Wait for app to finish migrations + serve the SPA
        # Polls goose_db_version (migrations are run by the app at
        # boot) + then a GET /healthz round-trip via docker DNS.
        # The embedded SPA returns 200 on /healthz once the Go
        # server is fully up.
        run: |
          target_version=$(ls app/internal/db/migrations/*.sql \
              | sed -E 's@.*/0*([0-9]+)_.*@\1@' | sort -n | tail -1)
          for i in $(seq 1 60); do
            current=$(docker compose exec -T postgres \
                psql -U artist_alley -d artist_alley -tAc \
                "SELECT COALESCE(MAX(version_id), 0) FROM goose_db_version" \
                2>/dev/null || echo 0)
            if [ "${current}" = "${target_version}" ]; then
              echo "migrations at version ${current} after ${i} attempts"
              break
            fi
            sleep 2
          done
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null "http://app:8080/healthz"; then
              echo "app SPA ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "app SPA never became ready" >&2
          docker compose logs app --tail=80 || true
          exit 1

      # apply.py is the gold-standard idempotent loader. First run
      # seeds users + teams + assets + posts + federation rows;
      # re-runs are no-ops via stable UUIDs derived from the source
      # files. --strict-verify fails the step if the per-phase
      # verify-pass finds >10% divergence between expected and
      # actual counts — surfaces a corrupted dataset / network
      # blip BEFORE the test step rather than as 30 mysterious
      # red tests.
      - name: Seed site_a via apply.py
        env:
          # Runner is on the compose network — reach the app via
          # docker DNS, not the host-published port. Same shape as
          # the dev `web` service points its proxy at
          # `http://nginx:80` in the source.
          #
          # /api/v1 in the base because apply.py's `_do` does
          # `urljoin(self.api_base + "/", path)` and the seed paths
          # are `/auth/login`, `/users`, etc. without a version
          # prefix — Go's chi router mounts every API surface
          # under /api/v1/, so api_base has to include it.
          AA_API_BASE: http://app:8080/api/v1
          # /datasets is the read-only mount added to the runner
          # container template (Unraid Docker tab → AristAlley-
          # Github-Actions-Runner → BLACKBOX datasets). Source on
          # the host: /mnt/remotes/192.168.69.145_Archives/datasets.
          SITE_A_PATH: /datasets/artist_alley/site_a
        run: |
          python3 -m pip install --user --quiet kagglehub requests || true
          python3 seed/scripts/apply.py \
            --site "$SITE_A_PATH" \
            --catalogue seed/profiles \
            --api "$AA_API_BASE" \
            --workers 16 \
            --strict-verify

      - name: Apply state diagnostic on failure
        if: failure()
        run: |
          ls -la apply-state-*.json 2>/dev/null || echo "no state file"
          for f in apply-state-*.json; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            jq '.phases_completed, {users: (.users|length), assets: (.assets|length), posts: (.posts|length)}' \
              "$f" 2>/dev/null || cat "$f"
          done

      - name: Install Playwright + browsers
        working-directory: scripts/dogfood/ui
        run: |
          npm install --no-audit
          npx playwright install --with-deps chromium

      - name: Run UI standalone suite
        env:
          # Playwright drives Chromium which auto-upgrades dotless
          # hostnames to HTTPS — `http://app:8080` fails with
          # ERR_SSL_PROTOCOL_ERROR. The CI compose override adds
          # `app.aa` as a network alias so the SPA URL has a TLD.
          STUDIO_A_HOST: http://app.aa:8080
          CI: "1"
        run: ./scripts/dogfood/run-ui.sh standalone

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pw-report-standalone-${{ github.run_id }}
          path: |
            scripts/dogfood/ui/.pw-report/
            scripts/dogfood/ui/.pw-results/
            apply-state-*.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Detach runner from the compose network
        if: always()
        # Don't leave stale network attachments on the runner
        # container across runs (matters for the next workflow if
        # this run was force-cancelled).
        run: |
          docker network disconnect artist-alley_default "$(hostname)" 2>/dev/null || true

      - name: Stop the stack
        if: always()
        run: docker compose down -v --remove-orphans || true
