# UI dogfood — fast PR / branch validation.
#
# Runs the Playwright `standalone` project against the production
# artifact on every PR + every push to a long-lived branch.
#
# We test the PROD image, not the dev compose's `vite dev` stack.
# Reasons:
#   1. Cold-start Vite on a github-hosted runner takes ~6 min
#      (empty .vite/deps/ → full re-optimization of ~600 Svelte
#      modules across two passes). The prod image embeds the
#      pre-built SPA via go:embed; the Go binary serves both the
#      SPA and the API on :8080 with no dep-optimization step.
#   2. The artifact tested is what ships. Catches embed_web-only
#      bugs the dev path would skip.
#   3. Single hop. No nginx + Vite proxy chain to debug when a
#      test fails.
#
# Federation tests run in ui-nightly.yml — they need the dogfood
# compose profile + mkcert + /etc/hosts which is too much setup
# for a PR-blocking workflow.
#
# Pairs with ci.yml: ci.yml gates Go + frontend correctness; this
# workflow gates the UI surface (navigation, forms, admin pages
# render against the live API).

name: UI dogfood (standalone)

on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ui-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # PRs from forks can't run on the self-hosted runner. Trusted
  # internal pushes route there for speed + warm Docker layer cache.
  # Mirror of ci.yml's pick-runner job.
  pick-runner:
    name: Pick runner
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'runner="ubuntu-latest"' >> "$GITHUB_OUTPUT"
          else
            echo 'runner=["self-hosted","artist-alley"]' >> "$GITHUB_OUTPUT"
          fi

  ui-standalone:
    name: Playwright standalone
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner) }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: scripts/dogfood/ui/package-lock.json

      # Playwright's Chromium download is ~150 MB. Cache it across
      # runs so we only re-fetch when Playwright bumps.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('scripts/dogfood/ui/package-lock.json') }}
          restore-keys: |
            ms-playwright-${{ runner.os }}-

      # Note: NOT using setup-buildx-action. Earlier runs showed
      # buildx-built images getting port-mapping config that the
      # local docker engine didn't actually publish on the host
      # (docker compose ps reported 0.0.0.0:15173 → 8080 but
      # `ss -ltnp` showed no listener and curl from the runner
      # got Connection refused). The classic builder is plenty
      # for one-image, one-Dockerfile builds.

      # Materialise .env the same shape as ci.yml's `test` job —
      # high ports so the runner's local services don't collide.
      # VITE_HOST_PORT is what the CI override compose binds the
      # app's :8080 to on the host.
      - name: Materialise .env for the stack
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci_password/" .env
          {
            echo "POSTGRES_HOST_PORT=15452"
            echo "VITE_HOST_PORT=15173"
            echo "AA_MASTER_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          } >> .env

      - name: Sweep leaked CI containers
        run: |
          docker compose down -v --remove-orphans || true
          stale=$(docker ps -aq --filter "name=^artist-alley-")
          if [ -n "$stale" ]; then docker rm -f $stale || true; fi
          docker network prune -f || true

      # Replace the dev `app` service with the production image
      # (built from the root Dockerfile with `-tags embed_web`).
      # Only `app` + `postgres` are started — the prod image serves
      # the SPA + API itself, so nginx + the web (Vite) container
      # aren't needed and aren't named here.
      - name: Build + start the prod stack
        run: |
          docker compose \
            -f docker-compose.yml \
            -f infra/docker/ci/docker-compose.ci.yml \
            up -d --build app postgres

      - name: Print stack state (diagnostic)
        run: |
          echo "=== docker compose ps ==="
          docker compose -f docker-compose.yml -f infra/docker/ci/docker-compose.ci.yml ps
          echo
          echo "=== ss -ltnp ==="
          ss -ltnp 2>/dev/null | head -20
          echo
          echo "=== docker port app ==="
          docker port artist-alley-app-1 || true
          echo
          echo "=== iptables nat OUTPUT chain (DOCKER target) ==="
          sudo iptables -t nat -L OUTPUT -n -v 2>/dev/null | head -10
          echo
          echo "=== curl from inside container ==="
          docker compose -f docker-compose.yml -f infra/docker/ci/docker-compose.ci.yml exec -T app sh -c 'curl -fsS -o /dev/null -w "in-container :8080 → %{http_code}\n" http://127.0.0.1:8080/healthz' || true
          echo
          echo "=== curl from host on the published port ==="
          curl -sS -o /dev/null -w "host :15173 → http_code=%{http_code}\n" --max-time 5 http://127.0.0.1:15173/healthz || echo "(curl exit $?)"
          echo
          echo "=== app container IP from docker network ==="
          docker inspect artist-alley-app-1 -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' || true

      - name: Wait for postgres to be ready
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U artist_alley -d artist_alley >/dev/null 2>&1; then
              echo "postgres ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "postgres never became ready" >&2
          docker compose logs postgres
          exit 1

      - name: Wait for app to finish migrations + serve the SPA
        # Polls goose_db_version + a GET / round-trip. The embedded
        # SPA returns 200 + HTML once the Go server is fully up,
        # which is the signal Playwright will look for too.
        run: |
          target_version=$(ls app/internal/db/migrations/*.sql \
              | sed -E 's@.*/0*([0-9]+)_.*@\1@' | sort -n | tail -1)
          for i in $(seq 1 60); do
            current=$(docker compose exec -T postgres \
                psql -U artist_alley -d artist_alley -tAc \
                "SELECT COALESCE(MAX(version_id), 0) FROM goose_db_version" \
                2>/dev/null || echo 0)
            if [ "${current}" = "${target_version}" ]; then
              echo "migrations at version ${current} after ${i} attempts"
              break
            fi
            sleep 2
          done
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://127.0.0.1:15173/healthz"; then
              echo "app SPA ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "app SPA never became ready" >&2
          docker compose logs app --tail=80 || true
          exit 1

      - name: Install Playwright + browsers
        working-directory: scripts/dogfood/ui
        run: |
          npm install --no-audit
          npx playwright install --with-deps chromium

      - name: Run UI standalone suite
        env:
          STUDIO_A_HOST: http://127.0.0.1:15173
          CI: "1"
        run: ./scripts/dogfood/run-ui.sh standalone

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pw-report-standalone-${{ github.run_id }}
          path: |
            scripts/dogfood/ui/.pw-report/
            scripts/dogfood/ui/.pw-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose down -v --remove-orphans || true
