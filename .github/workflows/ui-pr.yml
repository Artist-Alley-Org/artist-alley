# UI dogfood — fast PR / branch validation.
#
# Runs the Playwright `standalone` project against the production
# artifact on every PR + every push to a long-lived branch.
#
# Self-hosted only because:
#   1. The `site_a` seed dataset lives at
#      the seed dataset mount on the
#      runner's mount. ~30 of the 133 standalone tests walk seeded
#      posts / users / federation rows; without the dataset they
#      fail on empty result sets, not on the regression they're
#      meant to catch.
#   2. Standard docker on the self-hosted runner publishes ports
#      normally.
#
# We test the PROD image, not the dev `vite dev` stack, because:
#   1. Vite cold-boot in a fresh container runs the full dep
#      optimizer (~600 Svelte modules across two passes against
#      an empty .vite/deps/ cache) and consistently takes ~5
#      minutes wall before the dev server binds. Six prior
#      iterations of "wait longer for Vite" lost the race within
#      a second or two of the cap each time.
#   2. The prod image embeds the pre-built SPA via go:embed; the
#      Go binary serves both the SPA and the API on one port
#      with no dep-optimization step. Container ready in seconds.
#   3. The artifact tested is what ships. Catches embed_web-only
#      bugs the dev path would skip.
#   4. Single hop. No nginx + Vite proxy chain to debug when a
#      test fails.
#
# Federation tests run in ui-nightly.yml — they additionally need
# the dogfood compose profile + mkcert + /etc/hosts + pair.sh.
#
# Pairs with ci.yml: ci.yml gates Go + frontend correctness; this
# workflow gates the UI surface (navigation, forms, admin pages
# render against the live API + seeded data).
#
# Fork-PR caveat: fork PRs won't run this workflow because trusted
# runners aren't available to them. The status reports as
# "workflow skipped" — explicit, not silent.
#
# Seed-secret caveat (#1040): the whole suite depends on the site_a
# dataset, whose HOST path comes from the `SEED_SITE_A_PATH` secret.
# GitHub withholds *repository* secrets from Dependabot-triggered
# workflow runs, so on a Dependabot PR the variable resolved empty and
# `-v ":/seed/site:ro"` made docker bail with `invalid spec: empty
# section between colons` — a red X that describes a symptom, names
# nothing, and could never go green no matter what the bump contained.
# The `seed-preflight` job below turns that into an explicit SKIP.
# Populating the same value in the *Dependabot* secret store
# (Settings → Secrets and variables → Dependabot) makes these runs
# execute for real instead of skipping.

name: UI dogfood (standalone)

on:
  # No feat/** push trigger — see ci.yml's comment block for the
  # rationale. tl;dr push + pull_request:synchronize used to fire
  # twice per commit, landed in different concurrency groups, and
  # the cancelled duplicate tripped PR mergeStateStatus=UNSTABLE.
  push:
    branches: [main, dev]
    # Same docs-only-skip rationale as ci.yml — see the comment
    # block there for the branch-protection note + the **.md
    # caveat.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'CHANGELOG.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'CHANGELOG.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  workflow_dispatch:

# Key on the SOURCE BRANCH, not the raw ref, so a dev/main tip's push
# event and its open promotion PR collapse into one run instead of two
# (#491). A push to dev has head_ref empty -> ref_name=dev; a PR from
# dev has head_ref=dev -> same group. A push to dev and an unrelated
# feat->dev PR still differ (dev vs the feature branch), so they don't
# cancel each other. cancel-in-progress stays on.
#
# The TARGET branch is part of the key too (#1043) — see ci.yml's
# concurrency block for the full reasoning. Short version: on a
# dev -> main promotion PR the collapse above cancels one of the two
# runs, and the cancelled run leaves a CANCELLED check run beside the
# SUCCESS on the very same commit. Keeping main-targeting PRs in their
# own group costs one extra run per release and buys a clean verdict.
concurrency:
  group: ui-pr-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}-${{ github.base_ref || 'push' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Can this run see the seed dataset at all? (#1040)
  #
  # ~30 of the 133 standalone tests walk seeded rows, and the seed step
  # mounts a HOST path that only exists in the `SEED_SITE_A_PATH`
  # secret. Runs that GitHub withholds secrets from — Dependabot-
  # triggered runs, and forks if they ever get a trusted runner — can
  # never satisfy that, so the honest verdict for them is "skipped",
  # not "failed".
  #
  # This has to be its own job: the `secrets` context is available to a
  # step's `if`/`env` but NOT to `jobs.<id>.if`, so the only way to make
  # a whole job conditional on a secret being present is to have another
  # job read it and publish a plain output. Gating the ~20 steps of
  # ui-standalone individually would be the alternative, and it would
  # end with a GREEN check that ran no tests — strictly worse than a
  # skip, because green is a claim.
  #
  # Skipped jobs report success to branch protection and count as
  # "skipping" (not failing) to `gh pr checks`, so the dependabot
  # auto-merge gate treats this correctly without changes.
  seed-preflight:
    name: Seed dataset preflight
    runs-on: [self-hosted, artist-alley]
    timeout-minutes: 5
    outputs:
      available: ${{ steps.probe.outputs.available }}
    steps:
      - name: Probe for the seed dataset path
        id: probe
        env:
          # Empty on any run GitHub withholds repository secrets from.
          # Never echoed — only its emptiness is published.
          SITE_A_PATH: ${{ secrets.SEED_SITE_A_PATH }}
        run: |
          if [ -n "${SITE_A_PATH}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "SEED_SITE_A_PATH is set for this run — the UI suite will run."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=UI suite skipped::SEED_SITE_A_PATH is empty for this run, so the site_a dataset cannot be mounted and the standalone suite would assert against an empty database. GitHub withholds repository secrets from Dependabot-triggered runs and from forks; add the same value under Settings -> Secrets and variables -> Dependabot to make these runs execute for real."
          fi

  ui-standalone:
    name: Playwright standalone
    runs-on: [self-hosted, artist-alley]
    needs: seed-preflight
    # Skip rather than fail when the dataset is unreachable — see the
    # seed-preflight job above.
    if: needs.seed-preflight.outputs.available == 'true'
    timeout-minutes: 20
    # No compose-stack concurrency group (#342, extending #337): each
    # run gets its own COMPOSE_PROJECT_NAME + the resources override
    # drops every host port, so this workflow no longer collides with
    # ui-nightly / ci.yml or a second run of itself, and doesn't need
    # to serialise. Workflow-level concurrency (per ref, above) still
    # cancels superseded runs of this workflow.
    env:
      # Per-run project name isolates container names, the default
      # network, and named volumes on the shared self-hosted runner.
      COMPOSE_PROJECT_NAME: aa-ci-${{ github.run_id }}-${{ github.run_attempt }}
      # Layer the prod-image override + the resources override onto
      # every `docker compose` call (steps + bare invocations). The
      # resources override drops host ports (!reset) and caps memory.
      COMPOSE_FILE: docker-compose.yml:infra/docker/ci/docker-compose.ci.yml:infra/docker/ci/docker-compose.resources.yml
      GOFLAGS: -p=10
      GOMAXPROCS: 10

    steps:
      - name: Clear stale git locks (persistent self-hosted workspace)
        run: find "${GITHUB_WORKSPACE}" -type f -name '*.lock' -path '*/.git/*' -delete 2>/dev/null || true

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: scripts/dogfood/ui/package-lock.json

      # Playwright's Chromium download is ~150 MB. Cache it across
      # runs so we only re-fetch when Playwright bumps.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('scripts/dogfood/ui/package-lock.json') }}
          restore-keys: |
            ms-playwright-${{ runner.os }}-

      # No host-port pins needed (#342): the resources override drops
      # every published port, so nothing binds the host and concurrent
      # runs can't collide. The runner reaches the app over the compose
      # network by DNS (see the attach step below).
      - name: Materialise .env for the stack
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci_password/" .env
          echo "AA_MASTER_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" >> .env

      - name: Sweep this run's project
        # Label-scoped to this run's own project (retries re-use the
        # name). The cross-run `name=^aa-ci-` reap + `network prune` that
        # used to follow are gone (#371) — `created` is a mid-flight
        # state, so the reap deleted peer runs' containers. See ci.yml
        # for the full reasoning.
        #
        # Shared teardown (#599) — also reclaims the image compose builds
        # for this project. This workflow builds ONE (aa-ci-<run>-app, the
        # prod image); `web` is parked in the inert `vite` profile by
        # docker-compose.ci.yml, so no aa-ci-<run>-web exists here.
        uses: ./.github/actions/compose-cleanup

      # Replace the dev `app` service with the production image
      # (built from the root Dockerfile with `-tags embed_web`).
      # Only `app` + `postgres` are started — the prod image serves
      # the SPA + API itself, so nginx + the web (Vite) container
      # aren't needed.
      - name: Build + start the prod stack
        # Compose files come from COMPOSE_FILE (job env) — prod-image
        # override + resources override, both applied.
        run: docker compose up -d --build app postgres

      # The self-hosted runner runs inside its own docker
      # container with the docker socket mounted, so containers it
      # CREATES publish their ports onto the *host*'s localhost —
      # the runner container itself can't reach `localhost:18188`.
      # Solution: attach the runner container to the compose
      # network so it can reach the app via docker DNS (`app:8080`)
      # without any port-publish gymnastics.
      - name: Attach runner to the compose network
        # Per-run project → per-run network name (#342).
        run: |
          net="${COMPOSE_PROJECT_NAME}_default"
          docker network connect "$net" "$(hostname)" || \
            docker network connect "$net" "$(cat /etc/hostname)"

      - name: Wait for postgres to be ready
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U artist_alley -d artist_alley >/dev/null 2>&1; then
              echo "postgres ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "postgres never became ready" >&2
          docker compose logs postgres
          exit 1

      - name: Wait for app to finish migrations + serve the SPA
        # Polls goose_db_version (migrations are run by the app at
        # boot) + then a GET /healthz round-trip via docker DNS.
        # The embedded SPA returns 200 on /healthz once the Go
        # server is fully up.
        run: |
          target_version=$(ls app/internal/db/migrations/*.sql \
              | sed -E 's@.*/0*([0-9]+)_.*@\1@' | sort -n | tail -1)
          for i in $(seq 1 60); do
            current=$(docker compose exec -T postgres \
                psql -U artist_alley -d artist_alley -tAc \
                "SELECT COALESCE(MAX(version_id), 0) FROM goose_db_version" \
                2>/dev/null || echo 0)
            if [ "${current}" = "${target_version}" ]; then
              echo "migrations at version ${current} after ${i} attempts"
              break
            fi
            sleep 2
          done
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null "http://app:8080/healthz"; then
              echo "app SPA ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "app SPA never became ready" >&2
          docker compose logs app --tail=80 || true
          exit 1

      # `aa seed` is the native DB-direct loader (#321): it writes
      # straight to postgres + the storage volume via the app's own
      # service layer — no HTTP, no admin login. Run as a one-off
      # `compose run` container off the same app image, so it shares
      # the app's DB creds, storage volume, and network; the running
      # app then serves the seeded bytes. It exits non-zero on any
      # phase failure, which fails this step (replacing apply.py's
      # --strict-verify gate). The dataset + catalogue are mounted
      # in per-run; --no-deps because postgres is already up.
      #
      # --profile ci selects a COVERAGE-complete subset instead of the
      # whole catalogue (#768): greedy set-cover over posts plus a depth
      # floor, ~148 of 1,947 assets, holding every file extension, every
      # collection that has content, and every relation class the specs
      # assert on (companions, typed fields, tags, comments, multi-asset
      # posts). The full seed cost ~14 minutes of this 20-minute job to
      # feed a 3-minute suite, and its 6-minute run-to-run spread is what
      # timed `dev` out at 20m1s. Measured locally on identical hardware
      # and storage, fresh volumes for each run: 145s full → 30s ci.
      #
      # The demo keeps the full seed — see scripts/dogfood and the
      # aa-demo runbook. This profile is a CI-only shrink.
      #
      # It FAILS the step if the mounted catalogue cannot supply a
      # required coverage class, rather than seeding a fixture the suite
      # then passes against without exercising it (ADR 0068; #750/#753).
      - name: Seed site_a via aa seed
        env:
          # HOST daemon path, NOT the runner's /datasets bind mount.
          # `docker compose run -v` resolves the source on the host
          # docker daemon, which sees the dataset here; the runner
          # template maps this same host dir to /datasets *inside* the
          # runner, but the daemon needs the real host path. ($PWD for
          # the catalogue works because the runner's _work dir is
          # bind-mounted at an identical host path.)
          SITE_A_PATH: ${{ secrets.SEED_SITE_A_PATH }}
        run: |
          # Unreachable while seed-preflight gates this job, and kept
          # anyway: an empty path used to reach docker as
          # `-v ":/seed/site:ro"` and come back as `invalid spec: empty
          # section between colons`, which names neither the variable
          # nor the secret behind it and cost real time to trace (#1040).
          if [ -z "${SITE_A_PATH}" ]; then
            echo "::error title=Seed dataset path missing::SITE_A_PATH is empty — it comes from the SEED_SITE_A_PATH secret, which GitHub withholds from Dependabot-triggered runs and forks. Set it under Settings -> Secrets and variables -> Actions (and -> Dependabot for dependency PRs)."
            exit 1
          fi
          docker compose run --rm --no-deps \
            -v "$SITE_A_PATH:/seed/site:ro" \
            -v "$PWD/seed/profiles:/seed/profiles:ro" \
            app seed --site /seed/site --catalogue /seed/profiles --profile ci

      - name: Seed diagnostic on failure
        if: failure()
        # Same blind spot as ui-nightly's copy (#886): the row counts
        # could not say whether postgres was killed, crashed or restarted.
        # studio-a only here, so no dogfood profile.
        uses: ./.github/actions/seed-forensics
        with:
          services: postgres

      - name: Install Playwright + browsers
        working-directory: scripts/dogfood/ui
        run: |
          npm install --no-audit
          npx playwright install --with-deps chromium

      # Let the render queue drain before the suite starts (#768).
      #
      # `aa seed --previews` (the default) ENQUEUES preview jobs and
      # returns; the app's worker pool renders them. Nothing here used
      # to wait for that, and it did not need to: the 14-minute full
      # seed enqueued incrementally, so the workers had the whole seed
      # to drain and the queue was near-empty by the time Playwright
      # ran.
      #
      # Shrinking the seed did not remove that work, it moved the tests
      # into it. The coverage profile keeps 157 assets but necessarily
      # keeps all four huge videos (the only .mkv, the only .mov, both
      # .avi — 2.65 of the 3.09 GiB), and sprite generation is the most
      # CPU-costly job in the set. Measured against this profile: one
      # second after `aa seed` exits 53 jobs are still outstanding, and
      # at t+137s every other preview type has finished while
      # preview.video still has 12 pending + 2 running. The tail IS the
      # videos. On the PR run it landed on the first ~2.5 minutes of the
      # suite — four timeouts, then every remaining spec under a second.
      #
      # Scoped to preview jobs deliberately. The recurring coordinators
      # (email.digest, audit.retention, soft_delete.gc,
      # scheduled_actions.reap, saved_search.notify) sit `pending` with
      # a future `scheduled_for` for the life of the stack, so a wait on
      # "all outstanding jobs" would never reach zero and would burn the
      # full cap on every single run.
      #
      # And scoped to a NAMED LIST of preview kinds rather than
      # `type LIKE 'preview.%'` (#877). The wildcard also waited on
      # `preview.3d`, which is both the slowest kind by a wide margin
      # and the one kind no standalone spec consumes:
      #
      #   - the CI profile enqueues ~31 3D renders against a
      #     type_concurrency cap of 2, so they ARE the drain. A healthy
      #     run measured 141s total with 31 preview.3d + 4 preview.video
      #     outstanding at t=0; a single heavy model on a slow runner hit
      #     533.1s and blew the 480s cap, failing PR #874 before one test
      #     ran. A re-run of the identical commit passed.
      #   - no spec asserts on 3D output. The only two mentions of
      #     3d/glb/gltf/obj/fbx across tests/standalone/*.spec.ts are
      #     comments, and ui-30-collection-asset-permalink.spec.ts says
      #     it outright: it picks a ready RASTER asset because "arbitrary
      #     Postgres order — often a 3D/failed/non-preview asset" flaked
      #     it. Every spec that touches rendered bytes
      #     (ui-12-iiif-smoke, ui-13-iiif-mirador-dogfood, ui-30) is on
      #     an image path.
      #
      # An allow-list, not `type <> 'preview.3d'`, so a future slow kind
      # cannot silently re-introduce this: it fails toward "we only wait
      # for what we named". Adding a kind to the list is the deliberate
      # act. Add one if a spec starts reading its output, or if it is
      # expensive enough that leaving it running would starve the app
      # during the suite (that is why preview.video is here — it is 74%
      # of render CPU and was the whole of #768/#777).
      #
      # preview.3d is still RENDERED, just not waited for; it finishes
      # alongside the suite at concurrency 2. The step still prints the
      # ungated kinds so the log says what it chose not to wait for.
      #
      # BOUNDED, and on expiry it FAILS the step (#777). Letting the
      # suite run against a still-draining queue was the whole flake:
      # the video renders that make up the tail saturate the worker
      # pool enough that the app can't answer setup's 5s health probe,
      # so the suite dies at `app not ready after 30000ms` — a
      # load-dependent coin flip indistinguishable from a real hang.
      # Failing loudly with the outstanding count + slowest job turns
      # that into a legible, deterministic signal. The cap is set well
      # above a normal drain (a clean run finishes far inside it, with
      # ~8 min of the 20-min job budget still unused), so the failure
      # only ever fires on genuine trouble, never a healthy tail.
      #
      # Placed AFTER the Playwright install on purpose: that step takes
      # ~15s and the workers are draining throughout it, so the wait
      # only ever pays for the tail the install did not already cover.
      - name: Wait for the preview render queue to drain
        env:
          DRAIN_TIMEOUT_SECONDS: "480"
        run: |
          q() {
            docker compose exec -T postgres psql -U artist_alley \
              -d artist_alley -tAc "$1" 2>/dev/null || echo ""
          }
          # The preview kinds this gate waits on. Every per-asset render
          # kind EXCEPT preview.3d — see the note above for why 3D is
          # out and what earns a place in here.
          gated_kinds="'preview.raster','preview.gif','preview.vector',
                       'preview.psd','preview.eps','preview.pdf',
                       'preview.comic','preview.ebook','preview.text',
                       'preview.font','preview.archive','preview.audio',
                       'preview.video','preview.video.poster',
                       'preview.thumbhash_backfill'"
          pending="status IN ('pending','running') AND type IN (${gated_kinds})"
          ungated="status IN ('pending','running') AND type LIKE 'preview.%'
                     AND type NOT IN (${gated_kinds})"
          outstanding="SELECT count(*) FROM jobs WHERE ${pending};"
          breakdown="SELECT '  ' || type || ' ' || status || ' x' || count(*)
                       FROM jobs WHERE ${pending} GROUP BY type, status ORDER BY 1;"
          # Same shape, over the kinds we deliberately do NOT wait for,
          # so the log still shows the whole preview queue (#877).
          skipped="SELECT '  (not gated) ' || type || ' ' || status || ' x' || count(*)
                     FROM jobs WHERE ${ungated} GROUP BY type, status ORDER BY 1;"

          start=$(date +%s)
          echo "preview queue after seed: $(q "$outstanding") gated job(s) outstanding"
          q "$breakdown"
          q "$skipped"

          while :; do
            left=$(q "$outstanding")
            elapsed=$(( $(date +%s) - start ))
            if [ "${left:-1}" = "0" ]; then
              echo "preview queue drained after ${elapsed}s"
              break
            fi
            if [ "${elapsed}" -ge "${DRAIN_TIMEOUT_SECONDS}" ]; then
              slowest=$(q "SELECT type || ' ' ||
                                  round(extract(epoch from (now() - started_at))::numeric, 1) || 's'
                             FROM jobs WHERE ${pending} AND started_at IS NOT NULL
                             ORDER BY (now() - started_at) DESC LIMIT 1;")
              echo "::error::preview queue did not drain: ${left} gated job(s) outstanding" \
                   "after ${elapsed}s (cap ${DRAIN_TIMEOUT_SECONDS}s; slowest: ${slowest:-none})"
              q "$breakdown"
              q "$skipped"
              exit 1
            fi
            sleep 5
          done

          # Slowest finished jobs, so the log says what the wait bought
          # even on a clean drain.
          q "SELECT '  slowest: ' || type || ' ' ||
                    round(extract(epoch from (finished_at - started_at))::numeric, 1) || 's'
               FROM jobs WHERE finished_at IS NOT NULL
               ORDER BY (finished_at - started_at) DESC LIMIT 5;"

      - name: Run UI standalone suite
        env:
          # Playwright drives Chromium which auto-upgrades dotless
          # hostnames to HTTPS — `http://app:8080` fails with
          # ERR_SSL_PROTOCOL_ERROR. The CI compose override adds
          # `app.aa` as a network alias so the SPA URL has a TLD.
          STUDIO_A_HOST: http://app.aa:8080
          CI: "1"
        run: ./scripts/dogfood/run-ui.sh standalone

      # Same two settings, same reasoning, as ui-nightly's upload (#956):
      # upload-artifact@v4 excludes hidden files by default and every
      # path here is dot-prefixed, so this step has been reporting a
      # one-second success and uploading nothing on every red PR run.
      # `include-hidden-files: true` makes it collect the report;
      # `if-no-files-found: error` makes a future empty upload announce
      # itself instead of passing as coverage. The dead
      # `apply-state-*.json` glob is dropped — nothing writes it.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pw-report-standalone-${{ github.run_id }}
          # The negation drops Playwright's storageState, which carries
          # the suite's live admin session cookie — see the nightly's
          # copy of this step for the reasoning.
          path: |
            scripts/dogfood/ui/.pw-report/
            scripts/dogfood/ui/.pw-results/
            !scripts/dogfood/ui/.pw-results/admin-state.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

      # Job-queue state on failure (#768). `docker compose logs
      # --tail=200` is the wrong instrument for "was the worker busy
      # while the suite ran": the app logs a line per HTTP request, so
      # on the run that raised this question 200 lines covered ONE
      # SECOND, two and a half minutes after the last failure. The jobs
      # table answers it directly and in a few rows, so ask it first.
      - name: Job queue state on failure
        if: failure()
        run: |
          docker compose exec -T postgres psql -U artist_alley -d artist_alley -c \
            "SELECT type, status, count(*),
                    min(started_at) AS first_start, max(finished_at) AS last_finish,
                    round(max(extract(epoch from (finished_at - started_at)))::numeric, 1)
                      AS slowest_s
               FROM jobs GROUP BY type, status ORDER BY type, status;" || true

      - name: Container logs on failure
        if: failure()
        # Shared action (#956) so "captured nothing" reds the step
        # instead of passing silently. No dogfood profile here — ui-pr
        # runs studio-a only.
        uses: ./.github/actions/container-logs
        with:
          tail: "200"

      - name: Detach runner from the compose network
        if: always()
        # Don't leave stale network attachments on the runner
        # container across runs (matters for the next workflow if
        # this run was force-cancelled).
        run: |
          docker network disconnect "${COMPOSE_PROJECT_NAME}_default" "$(hostname)" 2>/dev/null || true

      - name: Stop the stack
        # always(): a failed Playwright run built the same image a passing
        # one did, so it must reclaim it too.
        if: always()
        uses: ./.github/actions/compose-cleanup
