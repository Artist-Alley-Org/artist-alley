# Dependabot — keeps deps current across the four ecosystems we ship.
# All PRs target `dev` so CI gates them and the manual dev → main
# merge stays the promotion path.

version: 2

updates:
  # Go modules (single module under app/)
  - package-ecosystem: gomod
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    target-branch: dev
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - deps
      - go
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # SvelteKit + Tailwind + everything else under web/
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    target-branch: dev
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - deps
      - npm
    # Group minor + patch bumps into a single PR per week to keep the
    # review queue manageable; majors stay separate so they get the
    # attention they deserve.
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # GitHub Actions — pin updates land alongside the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    commit-message:
      prefix: "chore(ci)"
    labels:
      - deps
      - ci
    groups:
      actions:
        patterns: ["*"]

  # Production Dockerfile base images.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    commit-message:
      prefix: "chore(docker)"
    labels:
      - deps
      - docker
