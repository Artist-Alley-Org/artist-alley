# Dependabot — keeps deps current across the four ecosystems we ship.
# All PRs target `dev` so CI gates them and the manual dev → main
# merge stays the promotion path.

version: 2

updates:
  # Go modules (single module under app/)
  - package-ecosystem: gomod
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    target-branch: dev
    # Two open PRs max: the grouped minor+patch one and the grouped
    # majors one below. A weekly wake used to open up to 5 per
    # ecosystem (1 grouped + 4 individual majors), and each one runs
    # the full self-hosted compose stack — a batch queued the v0.3.1
    # release ~47min behind it (#396).
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - deps
      - go
    # Two groups, split by update-type on purpose (#396). Bundling
    # majors into the routine group would collapse everything to one
    # PR, but dependabot/fetch-metadata reports a grouped PR's
    # update-type as the HIGHEST bump in it — so a single major would
    # flag the whole PR `major-review` and the auto-merge workflow
    # (minor/patch only) would hold every routine bump behind it. That
    # is the exact regression #353 fixed for github-actions. Keeping
    # majors in their own group means the minor+patch PR stays
    # auto-mergeable, and the majors collapse into ONE review PR
    # instead of one per dependency.
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      majors:
        patterns: ["*"]
        update-types: [major]

  # SvelteKit + Tailwind + everything else under web/
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    target-branch: dev
    # Same two-PR cap as gomod above (#396).
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - deps
      - npm
    # Group minor + patch into one weekly PR that auto-merges on green,
    # and collapse majors into a second PR for manual review. See the
    # gomod block above for why majors are NOT folded into the routine
    # group (it would block auto-merge on every routine bump).
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      majors:
        patterns: ["*"]
        update-types: [major]

  # GitHub Actions — pin updates land alongside the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    commit-message:
      prefix: "chore(ci)"
    labels:
      - deps
      - ci
    groups:
      # Split minor+patch from major, same shape as the npm/gomod
      # ecosystems above (#353). dependabot/fetch-metadata reports a
      # grouped PR's update-type as the HIGHEST bump in the group, so
      # the old catch-all `patterns: ["*"]` group meant a single major
      # action bump flipped the whole grouped PR to semver-major — and
      # the dependabot-automerge workflow (which auto-merges only
      # minor/patch) then held every routine action bump for manual
      # review. Grouping only minor+patch keeps routine bumps
      # auto-mergeable; majors fall outside the group into individual
      # PRs, each correctly flagged major-review.
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Production Dockerfile base images.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    commit-message:
      prefix: "chore(docker)"
    labels:
      - deps
      - docker
