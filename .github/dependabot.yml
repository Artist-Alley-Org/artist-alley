# Dependabot — keeps deps current across every ecosystem in the tree.
# Most of them ship; the two `pip` entries do not (see their block).
# All PRs target `dev` so CI gates them and the manual dev → main
# merge stays the promotion path.
#
# One entry per ECOSYSTEM PER DIRECTORY: dependabot does not recurse, so a
# manifest in an unlisted directory is invisible to it no matter how many
# entries of that ecosystem already exist. That is how three `ip-address`
# CVEs rode into the runtime image via scripts/threejs (#905). When you add
# a package.json, go.mod or Dockerfile anywhere in the tree, add it here too.

version: 2

updates:
  # Go modules (single module under app/)
  - package-ecosystem: gomod
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    target-branch: dev
    # Two open PRs max: the grouped minor+patch one and the grouped
    # majors one below. A weekly wake used to open up to 5 per
    # ecosystem (1 grouped + 4 individual majors), and each one runs
    # the full self-hosted compose stack — a batch queued the v0.3.1
    # release ~47min behind it (#396).
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - deps
      - go
    # Two groups, split by update-type on purpose (#396). Bundling
    # majors into the routine group would collapse everything to one
    # PR, but dependabot/fetch-metadata reports a grouped PR's
    # update-type as the HIGHEST bump in it — so a single major would
    # flag the whole PR `major-review` and the auto-merge workflow
    # (minor/patch only) would hold every routine bump behind it. That
    # is the exact regression #353 fixed for github-actions. Keeping
    # majors in their own group means the minor+patch PR stays
    # auto-mergeable, and the majors collapse into ONE review PR
    # instead of one per dependency.
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      majors:
        patterns: ["*"]
        update-types: [major]
    ignore:
      # Our own vendored mscrnt/* forks are pinned deliberately. mviewer
      # is a v2-without-a-/v2-module-path fork, so Go resolves it as
      # `v2.1.2+incompatible` and dependabot's isolated updater cannot
      # resolve the package, failing every /app run with
      # `dependency_file_not_resolvable` (and emailing on each failure).
      # We never want dependabot bumping our forks anyway.
      - dependency-name: "github.com/mscrnt/*"

  # SvelteKit + Tailwind + everything else under web/
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    target-branch: dev
    # Same two-PR cap as gomod above (#396).
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - deps
      - npm
    # Group minor + patch into one weekly PR that auto-merges on green,
    # and collapse majors into a second PR for manual review. See the
    # gomod block above for why majors are NOT folded into the routine
    # group (it would block auto-merge on every routine bump).
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      majors:
        patterns: ["*"]
        update-types: [major]
    ignore:
      # TypeScript 7 (the new native/Go compiler) is ahead of the toolchain:
      # SvelteKit 2.70's peer range is `^5.3.3 || ^6.0.0`, so a TS-major bump
      # fails `npm ci` (ERESOLVE) and fast-fails every build/test check
      # deterministically (#454, closed). Hold TS at 5.x until SvelteKit (and
      # @scalar/* / svelte-check) widen their peer ranges to `^7`; remove this
      # entry then. Non-major TS + all other majors (e.g. @types/node) still flow.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Headless three.js preview renderer (#498, ADR 0069). NOT dev-only: the
  # `threejs-deps` stage in BOTH Dockerfiles installs from this lockfile and
  # copies node_modules into the runtime image, so anything vulnerable here
  # ships in the published artifact. It was watched by nothing until #905,
  # which is why three `ip-address` alerts (one high) sat open — dependabot
  # raises security ALERTS for any lockfile in the repo, but only opens
  # security-update PRs for directories listed here. Same shape as the /web
  # block above; no `ignore` block, because the typescript hold there is
  # specific to SvelteKit's peer range and does not apply to this tree.
  - package-ecosystem: npm
    directory: /scripts/threejs
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    target-branch: dev
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - deps
      - npm
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      majors:
        patterns: ["*"]
        update-types: [major]

  # Playwright-driven UI dogfood suite. Dev/CI-only — never shipped — but it
  # is the gate that catches API↔UI contract drift, so a silently-stale
  # @playwright/test is a real hole. Found by the #905 sweep.
  - package-ecosystem: npm
    directory: /scripts/dogfood/ui
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    target-branch: dev
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - deps
      - npm
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      majors:
        patterns: ["*"]
        update-types: [major]

  # Seed-dataset image tooling (#604) — sharp/libvips. Dev-only, but sharp
  # wraps a native image codec stack, which is exactly the kind of dependency
  # that accrues CVEs unattended. Found by the #905 sweep.
  - package-ecosystem: npm
    directory: /seed/scripts
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    target-branch: dev
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - deps
      - npm
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      majors:
        patterns: ["*"]
        update-types: [major]

  # ── Python sidecar tools (#928). Two of them, each with its own
  # pyproject.toml + Dockerfile, and `pip` does not recurse any more
  # than `docker` or `npm` do — so both need their own entry:
  #   tools/aa-clip-visual-local  — CLIP visual encoder sidecar
  #   tools/comfyui-mcp-bridge    — MCP bridge for ComfyUI
  #
  # NEITHER SHIPS IN THE RUNTIME IMAGE. They build into their own
  # optional sidecar images that an operator runs (or doesn't) beside
  # the app, so this is hygiene, not the supply-chain hole that #905
  # was: nothing here rides into the published artifact. Sized to
  # match — monthly, one PR at a time, grouped.
  #
  # ── Range-only, deliberately: there is no lockfile and we are not
  # adding one.
  #
  # Dependabot therefore updates the DECLARED RANGES in pyproject.toml
  # and nothing else, which means two builds of the same commit can
  # resolve different transitive versions. That is a real cost and it
  # is accepted here rather than overlooked:
  #
  #   - Both Dockerfiles `pip install` from pyproject.toml (build a
  #     wheel, install the wheel). A uv.lock or a compiled
  #     requirements.txt would be installed by nothing, so it would
  #     drift from what the images actually contain — a lockfile that
  #     no build consumes is decoration, and decoration rots.
  #   - The reproducible artifact for these tools is the IMAGE, which
  #     is built deliberately and pinned by digest where it is used.
  #   - aa-clip-visual-local's dependency floors were already chosen
  #     against this exact model — read its `torch>=2.13` comment: the
  #     floor is set to exclude an advisory's affected range precisely
  #     because Dependabot evaluates the declared range with no
  #     lockfile. Adding a lockfile now would not make that reasoning
  #     redundant, it would give it a second, divergent source.
  #
  # What would change the answer: either tool becoming part of the
  # runtime image, or getting published to an index. At that point add
  # a compiled requirements.txt AND make the Dockerfile install from
  # it, in one change — not the lockfile alone.
  #
  # `versioning-strategy` is left at the ecosystem default on purpose;
  # the defaults raise the declared floor, which is the behaviour those
  # advisory-driven floors depend on.
  - package-ecosystem: pip
    directory: /tools/aa-clip-visual-local
    schedule:
      interval: monthly
    target-branch: dev
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - deps
      - python
    # Same minor+patch / majors split as every other ecosystem here
    # (#353): fetch-metadata reports a grouped PR's update-type as the
    # HIGHEST bump in it, so folding majors into the routine group
    # would flag the whole PR major-review and stall the routine bumps.
    #
    # Note what auto-merge means for these two: CI does not exercise
    # either tool (no workflow builds or tests tools/**), so a green
    # check on one of these PRs says the Go + web suites still pass,
    # not that the sidecar still works. That is tolerable only because
    # neither is in the runtime path. If either ever gets a CI job,
    # revisit this comment, not just the workflow.
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      majors:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: pip
    directory: /tools/comfyui-mcp-bridge
    schedule:
      interval: monthly
    target-branch: dev
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - deps
      - python
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      majors:
        patterns: ["*"]
        update-types: [major]

  # GitHub Actions — pin updates land alongside the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    commit-message:
      prefix: "chore(ci)"
    labels:
      - deps
      - ci
    groups:
      # Split minor+patch from major, same shape as the npm/gomod
      # ecosystems above (#353). dependabot/fetch-metadata reports a
      # grouped PR's update-type as the HIGHEST bump in the group, so
      # the old catch-all `patterns: ["*"]` group meant a single major
      # action bump flipped the whole grouped PR to semver-major — and
      # the dependabot-automerge workflow (which auto-merges only
      # minor/patch) then held every routine action bump for manual
      # review. Grouping only minor+patch keeps routine bumps
      # auto-mergeable; majors fall outside the group into individual
      # PRs, each correctly flagged major-review.
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Production Dockerfile base images.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    commit-message:
      prefix: "chore(docker)"
    labels:
      - deps
      - docker

  # Local-compose app image. The docker ecosystem does NOT recurse, so
  # `directory: /` above covers the root Dockerfile and nothing else — this
  # one was unwatched (#905 sweep). It declares its runtime stage
  # independently of the root Dockerfile, and ci.yml already has a parity
  # gate over the two ("3D renderer present in both Dockerfiles"), so
  # letting only one of them get base-image bumps is drift the CI job will
  # eventually fail on.
  - package-ecosystem: docker
    directory: /infra/docker/app
    schedule:
      interval: monthly
    target-branch: dev
    commit-message:
      prefix: "chore(docker)"
    labels:
      - deps
      - docker

  # Local-compose web (Vite dev server) image — same recursion gap.
  - package-ecosystem: docker
    directory: /infra/docker/web
    schedule:
      interval: monthly
    target-branch: dev
    commit-message:
      prefix: "chore(docker)"
    labels:
      - deps
      - docker
