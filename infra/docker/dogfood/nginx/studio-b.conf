# artist-alley dogfood — nginx for studio-b. Mirror of studio-a.conf
# with the studio-b hostname + port (9443) + certs.

upstream app_upstream {
    server app-b:8080;
    keepalive 16;
}

server {
    listen 9443 ssl;
    listen [::]:9443 ssl;
    http2 on;
    server_name studio-b.local;

    ssl_certificate     /etc/nginx/certs/studio-b.local.pem;
    ssl_certificate_key /etc/nginx/certs/studio-b.local-key.pem;

    charset utf-8;
    client_max_body_size 5000m;
    sendfile off;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    location ~ /\.(?!well-known) {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        proxy_pass         http://app_upstream;
        proxy_http_version 1.1;
        # `$http_host` (exact header value with port) — NOT `$host`
        # (port-stripped). Federation HTTP-Sig signs the Host header
        # verbatim; the port must survive proxying or signature
        # verification on the receiver fails with sig_invalid.
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering    off;
    }
}
