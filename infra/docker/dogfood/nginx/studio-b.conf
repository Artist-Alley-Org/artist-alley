# artist-alley dogfood — nginx for studio-b. Mirror of studio-a.conf
# with the studio-b hostname + port (9443) + certs.

# No `upstream` block, and `proxy_pass` goes through a variable, so that
# nginx re-resolves `app-b` per request instead of pinning its bridge IP
# at config load. See infra/nginx/default.conf for the full reasoning
# (#756) — this instance is the one that got *served* in the original
# incident, which is exactly why it matters that both sides follow the
# name rather than a cached address.
resolver         127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 9443 ssl;
    listen [::]:9443 ssl;
    http2 on;
    server_name studio-b.local;

    ssl_certificate     /etc/nginx/certs/studio-b.local.pem;
    ssl_certificate_key /etc/nginx/certs/studio-b.local-key.pem;

    charset utf-8;
    client_max_body_size 5000m;
    sendfile off;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    location ~ /\.(?!well-known) {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        # Bare scheme://host:port in the variable — no path component, no
        # `$request_uri`. See default.conf: that combination re-resolves
        # per request while forwarding the request URI byte-for-byte as
        # the literal upstream did.
        set                $app_upstream http://app-b:8080;
        proxy_pass         $app_upstream;
        proxy_http_version 1.1;
        # `$http_host` (exact header value with port) — NOT `$host`
        # (port-stripped). Federation HTTP-Sig signs the Host header
        # verbatim; the port must survive proxying or signature
        # verification on the receiver fails with sig_invalid.
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering    off;
    }
}
