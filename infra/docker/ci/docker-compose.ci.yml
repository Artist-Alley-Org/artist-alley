# Compose override for the CI UI workflows (ui-pr + ui-nightly).
#
# Swaps the dev `app` service for the production image (root
# Dockerfile, built with `-tags embed_web`). The Go binary serves
# both the API and the SvelteKit SPA on a single port, so the dev
# `web` (Vite) container isn't part of the stack at all — see the
# `web` service at the bottom of this file.
#
# Use — layer onto COMPOSE_FILE rather than passing -f, since -f
# REPLACES the env var wholesale and scripts/dogfood/up.sh appends
# the dogfood override to it (#363):
#
#   COMPOSE_FILE=docker-compose.yml:infra/docker/ci/docker-compose.ci.yml
#
# ui-pr starts `app postgres` only. ui-nightly layers the dogfood
# override on top for the studio-a + studio-b federation pair; the
# two compose cleanly — `app` ends up as the prod image WITH the
# mkcert CA mount, and `nginx` keeps its `studio-a.local` alias.
#
# Why the prod image instead of the dev image:
#   1. Cuts a ~5 min Vite cold-start out of every run. `vite dev`
#      first-boot bundles ~600 Svelte modules against an empty
#      .vite/deps/ cache; CI's `compose down -v` between runs
#      guarantees cold every run.
#   2. The artifact tested IS what ships. Catches `embed_web`-
#      only issues (build flags, embed asset paths, prod-only env
#      handling) the dev path would skip.
#   3. Single hop. No nginx → Vite proxy chain to debug when a
#      test fails.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ci-${GITHUB_SHA:-dev}
    # No host port is published, deliberately (#360). This used to
    # publish ${NGINX_HTTP_PORT:-8080}, and since no workflow ever set
    # that var it defaulted to 8080 — a port an unrelated service owns
    # permanently on the shared runner box, so the stack could never
    # come up. Nothing needs it either: the runner attaches to the
    # compose network and Playwright reaches the app by DNS via the
    # `app.aa` alias below. A hardcoded default that assumes a free
    # port on a shared box is never safe; if a step ever genuinely
    # needs one, publish an ephemeral port and read it back with
    # `docker compose port app 8080`.
    # Chromium auto-upgrades single-label hostnames to HTTPS as
    # part of its dotless-host policy — `http://app:8080/login`
    # therefore fails with ERR_SSL_PROTOCOL_ERROR. Adding a
    # dotted alias on the compose network gives Playwright a
    # name it'll accept verbatim. apply.py talks plain `app` —
    # requests + python urllib don't carry the same policy.
    networks:
      default:
        aliases:
          - app.aa

  # The Vite dev server is not part of a prod-image stack (#365).
  #
  # Compose has no "delete a service" directive, so park `web` in a
  # profile nothing enables. `docker compose up` without
  # `--profile vite` skips it entirely; nothing depends_on it. Local
  # dev never loads this file, so `web` still starts by default there.
  #
  # This is a removal, not a workaround for the EACCES that exposed
  # it. `web` bind-mounts ./web:/app and runs as ${UID:-1000}, but
  # Actions checks out as root on the self-hosted runner — so Vite
  # died on `mkdir /app/.svelte-kit` and took ui-nightly down with
  # it for 25 nights. Matching uid/gid would have fixed the symptom
  # and kept a dev server in the one suite where prod-shape matters
  # most. The stack these workflows test now has no bind mount, no
  # uid to match, no 6-minute cold boot, and no .svelte-kit scratch
  # dir to write.
  web:
    profiles: ["vite"]
