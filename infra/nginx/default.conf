# artist-alley — nginx config
#
# Serves the ResourceSpace PHP application (forked at repo root) via FastCGI
# to the `php` service. The `services/`, `web/`, `infra/`, `scripts/`, and
# `docs/` directories at the repo root are NOT part of the served webroot;
# we deny them explicitly as a safety belt against accidental exposure.

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html;
    index index.php index.html;
    charset utf-8;

    client_max_body_size 5000m;
    sendfile off;

    access_log off;
    error_log /var/log/nginx/error.log warn;

    # --- Belt-and-braces: deny access to non-RS source dirs ---
    location ~ ^/(services|web|infra|scripts|docs|tests|upgrade|dbstruct)(/|$) {
        return 404;
    }

    # --- Hide common dotfiles ---
    location ~ /\.(?!well-known) {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # --- Asset storage (mounted from `filestore` named volume) ---
    location /filestore/ {
        alias /var/www/html/filestore/;
        autoindex off;
        try_files $uri $uri/ =404;
    }

    # --- TUS resumable uploads for large files ---
    # RS exposes a TUS endpoint at /pages/upload_batch.php/files for chunked,
    # resumable uploads of multi-gigabyte assets. Buffering must be off so
    # nginx streams chunks straight to PHP.
    location ~ ^/pages/upload_batch\.php/files {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/pages/upload_batch.php;
        fastcgi_param REQUEST_METHOD   $request_method;
        fastcgi_param HTTP_TUS_RESUMABLE  $http_tus_resumable;
        fastcgi_param HTTP_UPLOAD_OFFSET  $http_upload_offset;
        fastcgi_param HTTP_UPLOAD_METADATA $http_upload_metadata;

        fastcgi_request_buffering off;
    }

    # --- PHP front controller ---
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_intercept_errors off;
    }
}
