# artist-alley — nginx config (post strangler-fig)
#
# Routing is trivial now that the PHP backend is gone:
#   - Everything proxies to the Go `app` upstream.
#   - The Go binary serves /api/v1/* (REST), /healthz, /readyz, and
#     the embedded SvelteKit SPA (everything else).
#
# In dev, the `web` container runs Vite on :5173 directly and nginx
# is bypassed — `docker compose --profile web up` exposes Vite to the
# host. nginx fronts the Go binary on the default profile, which is
# what production-shaped smoke tests + the compose health checks use.

# --- Why there is no `upstream` block here (#756) ---------------------
#
# nginx resolves a hostname in `server app:8080;` exactly once, when the
# config is loaded, and caches that address for the life of the worker
# process. It never re-resolves. A container that is recreated gets a new
# bridge IP, and nginx keeps proxying to the old one.
#
# On 2026-07-30 a host crash brought the containers back in a different
# order. nginx held studio-a's pre-crash address, which docker had since
# handed to `app-b` — so studio-a's proxy served studio-b's backend, and
# every diagnostic below the proxy (nginx.conf, app→postgres, row scans)
# looked healthy, because they were. The tell was that rebuilding `app`
# did nothing and restarting `nginx` fixed it.
#
# A `resolver` does NOT change this: it has no effect on `server` entries
# inside an `upstream` block. (The `resolve` parameter that would fix it
# is NGINX Plus only.) In open-source nginx the only way to re-resolve is
# to put the upstream in a *variable*, which forces per-request lookup —
# so `upstream app_upstream { ... }` is gone and `proxy_pass` below goes
# through `$app_upstream`.
#
# Cost of the fix: the `keepalive 16` connection pool goes with the
# upstream block — nginx cannot pool connections it re-resolves. Over the
# docker bridge a fresh TCP handshake is sub-millisecond, which is a
# price worth paying to never silently serve another instance's data.
# `proxy_set_header Connection ""` went with it: it existed only to let
# the pooled connections stay open, and leaving it would imply pooling
# that no longer happens.
#
# 127.0.0.11 is docker's embedded DNS. Both nginx containers in this repo
# run inside a compose-managed network, so it is always present; nothing
# ships this file to a host-level nginx (operators front the published
# port with their own config). Revisit if that stops being true.
resolver         127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 80 default_server;
    server_name _;

    charset utf-8;
    client_max_body_size 5000m;
    sendfile off;

    access_log off;
    error_log /var/log/nginx/error.log warn;

    # Hide common dotfiles. The well-known prefix stays accessible
    # for ACME / federation discovery.
    location ~ /\.(?!well-known) {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Everything routes to the Go app. The binary picks /api/v1
    # routes off the chi mux + falls through to the embedded
    # SvelteKit static handler for SPA + page navigations.
    location / {
        # Variable, not a literal — that is what makes nginx re-resolve
        # `app` per request instead of pinning it at config load (#756).
        #
        # The variable holds a bare scheme://host:port with no path, and
        # no `$request_uri` is appended. A variable `proxy_pass` only
        # rewrites the request URI when the evaluated URL *has* a path
        # component; without one nginx forwards the client's URI exactly
        # as the literal form did. Verified rather than assumed: 23 URI
        # shapes (args, `//double//slash`, `%2F`, `/../` dot segments via
        # `curl --path-as-is`, unicode, `%22`) produce byte-identical
        # $uri/$args/$request_uri at the backend before and after.
        #
        # Adding `$request_uri` here measured identical too, so it is not
        # a hazard at this location — but it is also not needed, and it
        # would matter if this location ever became a regex or started
        # stripping a prefix. Re-verify if the location block changes.
        set                $app_upstream http://app:8080;
        proxy_pass         $app_upstream;
        proxy_http_version 1.1;
        # `$http_host` (exact header value with port) — NOT `$host`
        # (port-stripped). Federation HTTP-Sig signs the Host header
        # verbatim; stripping the port breaks signature verification
        # on the receiving side (sender sends `studio-b.local:9443`,
        # receiver reconstructs `studio-b.local` → sig_invalid).
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
