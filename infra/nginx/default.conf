# artist-alley — nginx config (post strangler-fig)
#
# Routing is trivial now that the PHP backend is gone:
#   - Everything proxies to the Go `app` upstream.
#   - The Go binary serves /api/v1/* (REST), /healthz, /readyz, and
#     the embedded SvelteKit SPA (everything else).
#
# In dev, the `web` container runs Vite on :5173 directly and nginx
# is bypassed — `docker compose --profile web up` exposes Vite to the
# host. nginx fronts the Go binary on the default profile, which is
# what production-shaped smoke tests + the compose health checks use.

upstream app_upstream {
    server app:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    charset utf-8;
    client_max_body_size 5000m;
    sendfile off;

    access_log off;
    error_log /var/log/nginx/error.log warn;

    # Hide common dotfiles. The well-known prefix stays accessible
    # for ACME / federation discovery.
    location ~ /\.(?!well-known) {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # IIIF Presentation API 3.0 + Content Search 2.0 (Phase 1.54.B) +
    # IIIF Image API 3.0 (Phase 1.54.A) — external URL alias. Phase
    # 1.54.C.
    #
    # 1.54.A + 1.54.B handlers mount inside `r.Route("/api/v1", ...)`
    # in app/internal/http/server.go but emit URLs via
    # `publicBaseURL(r) + "/iiif/3/..."` without the /api/v1 prefix.
    # External IIIF viewers (Mirador, UniversalViewer, OpenSeadragon
    # embeds) fetch the emitted URL directly + hit the SPA fallthrough
    # 404 without this rewrite. See #188 for full bug history.
    #
    # break (not last) — deterministic single-block forwarding; last
    # would re-scan location blocks and could match the SPA fallback.
    location /iiif/3/ {
        rewrite ^/iiif/3/(.*)$ /api/v1/iiif/3/$1 break;
        proxy_pass         http://app_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # IIIF Image API 2.0 → 3.0 URL rewrites (Phase 1.54.B redirect
    # handler). Same rewrite pattern; the 2.0 handler emits 301 with
    # a Location header pointing back at external /iiif/3/... which
    # the rewrite above handles on the next request.
    location /iiif/2/ {
        rewrite ^/iiif/2/(.*)$ /api/v1/iiif/2/$1 break;
        proxy_pass         http://app_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Everything routes to the Go app. The binary picks /api/v1
    # routes off the chi mux + falls through to the embedded
    # SvelteKit static handler for SPA + page navigations.
    location / {
        proxy_pass         http://app_upstream;
        proxy_http_version 1.1;
        # `$http_host` (exact header value with port) — NOT `$host`
        # (port-stripped). Federation HTTP-Sig signs the Host header
        # verbatim; stripping the port breaks signature verification
        # on the receiving side (sender sends `studio-b.local:9443`,
        # receiver reconstructs `studio-b.local` → sig_invalid).
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
