# artist-alley — nginx config
#
# Phase 1.0+ routing:
#   - Paths handled by the Go server (`app`) are listed explicitly below
#     and proxied via HTTP.
#   - Everything else falls through to the legacy PHP-FPM backend
#     (ResourceSpace fork). As Go ports more endpoints, we add their
#     paths to the `app` upstream and the PHP path shrinks.
#
# Source directories at the repo root (`app/`, `infra/`, `scripts/`,
# `docs/`, `tests/`, etc.) are not part of the served webroot and are
# denied explicitly as a safety belt.

upstream app_upstream {
    server app:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html;
    index index.php index.html;
    charset utf-8;

    client_max_body_size 5000m;
    sendfile off;

    access_log off;
    error_log /var/log/nginx/error.log warn;

    # --- Belt-and-braces: deny access to non-served source dirs ---
    location ~ ^/(app|services|web|infra|scripts|docs|tests|upgrade|dbstruct)(/|$) {
        return 404;
    }

    # --- Hide common dotfiles ---
    location ~ /\.(?!well-known) {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # --- Go-served endpoints (Phase 1.0+).
    # Add new prefixes here as features are ported off PHP onto `app`.
    location = /healthz {
        proxy_pass         http://app_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }
    location = /readyz {
        proxy_pass         http://app_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }
    # /api/v1/* — every Go-served REST endpoint lives here.
    location /api/v1/ {
        proxy_pass         http://app_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # --- Asset storage (mounted from `filestore` named volume) ---
    location /filestore/ {
        alias /var/www/html/filestore/;
        autoindex off;
        try_files $uri $uri/ =404;
    }

    # --- TUS resumable uploads for large files ---
    # RS exposes a TUS endpoint at /pages/upload_batch.php/files for chunked,
    # resumable uploads of multi-gigabyte assets. Buffering must be off so
    # nginx streams chunks straight to PHP.
    location ~ ^/pages/upload_batch\.php/files {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/pages/upload_batch.php;
        fastcgi_param REQUEST_METHOD   $request_method;
        fastcgi_param HTTP_TUS_RESUMABLE  $http_tus_resumable;
        fastcgi_param HTTP_UPLOAD_OFFSET  $http_upload_offset;
        fastcgi_param HTTP_UPLOAD_METADATA $http_upload_metadata;

        fastcgi_request_buffering off;
    }

    # --- Legacy PHP front controller (RS) ---
    # Falls through here for anything not claimed by the Go service above.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_intercept_errors off;
    }
}
