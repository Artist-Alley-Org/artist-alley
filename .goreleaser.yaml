# GoReleaser config — release-notes only.
#
# Docker is the sole v0.1.0 distribution channel. The actual multi-arch
# image build lives entirely in `.github/workflows/release.yml`'s docker
# job (docker/build-push-action + buildx + QEMU for arm64, Sigstore
# cosign signing, SBOM + provenance). This file exists solely to produce
# a curated GitHub Release page from the tag's commit history — the
# grouped auto-changelog (feat / fix / perf / refactor / docs) is nicer
# than GitHub's native categorization.
#
# Binary + package distribution (.tar.gz, .deb, .rpm, Homebrew) is
# deferred post-v0.1.0. See #238 for the CGO_ENABLED=0 vs mscrnt/webp
# conflict that gated the trim and the 4 candidate resolutions.
#
# Reference: https://goreleaser.com/customization/release/

version: 2

project_name: artist-alley

snapshot:
  version_template: "{{ .Tag }}-next"

# Changelog: keep curated. Group commits by conventional-commit type
# so the release notes read top-down (feat → fix → docs → chore).
changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^Merge "
      - "^chore\\(release\\):"
  groups:
    - title: Features
      regexp: '^.*?feat(\([^)]*\))?:'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([^)]*\))?:'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([^)]*\))?:'
      order: 2
    - title: Refactors
      regexp: '^.*?refactor(\([^)]*\))?:'
      order: 3
    - title: Docs
      regexp: '^.*?docs(\([^)]*\))?:'
      order: 4
    - title: Other
      order: 99

# GitHub Release — auto-publish with the grouped changelog.
release:
  github:
    owner: mscrnt
    name: artist-alley
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## artist-alley {{ .Tag }}

    Self-hosted art review and archival platform. See the
    [install guide](https://github.com/mscrnt/artist-alley/blob/main/docs/install/README.md)
    for the Docker install flow.
  footer: |
    ---
    **Full changelog**: https://github.com/mscrnt/artist-alley/compare/{{ .PreviousTag }}...{{ .Tag }}
