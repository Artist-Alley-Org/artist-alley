# artist-alley — local development stack
#
# Phase 1.0 topology:
#   nginx --routes prefix-by-prefix-->  app (Go)          [/healthz, /readyz, ...]
#                                       php-fpm (RS PHP)  [everything else, for now]
#                                       postgres (pgvector)
#
# As Go ports more endpoints, nginx routes shift to `app`. When the last
# PHP route is ported, the `php` service is deleted. Container count
# stays bounded at three (nginx, app, postgres) forever.

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - filestore:/var/www/html/filestore
    depends_on:
      - app
      - php
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: infra/docker/app/Dockerfile
      args:
        GO_VERSION: "1.26"
        BUILD_VERSION: ${AA_VERSION:-dev}
    expose:
      - "8080"
    environment:
      AA_HTTP_ADDR: ":8080"
      AA_DB_HOST: postgres
      AA_DB_PORT: "5432"
      AA_DB_USER: ${POSTGRES_USER:-artist_alley}
      AA_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      AA_DB_NAME: ${POSTGRES_DB:-artist_alley}
      AA_DB_SSLMODE: disable
      AA_LOG_LEVEL: ${AA_LOG_LEVEL:-info}
      AA_LOG_FORMAT: ${AA_LOG_FORMAT:-json}
      AA_LEGACY_PHP_ADDR: php:9000
      # Must match RS's scramble_key in include/config.php so
      # password hashes and PAT comparisons are byte-compatible.
      AA_SCRAMBLE_KEY: ${AA_SCRAMBLE_KEY:?AA_SCRAMBLE_KEY is required; copy scramble_key out of include/config.php into .env}
      TZ: ${TZ:-UTC}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: infra/docker/php-fpm/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        TZ: ${TZ:-UTC}
    expose:
      - "9000"
    volumes:
      - .:/var/www/html
      - filestore:/var/www/html/filestore
    environment:
      TZ: ${TZ:-UTC}
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_DB: ${POSTGRES_DB:-artist_alley}
      POSTGRES_USER: ${POSTGRES_USER:-artist_alley}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artist_alley} -d ${POSTGRES_DB:-artist_alley}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  filestore:
