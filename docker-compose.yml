# artist-alley — local development stack
#
# Production topology (and what compose runs by default):
#   nginx --proxies all-paths--> app (Go)          [REST + embedded SPA]
#                                postgres (pgvector)
#
# The legacy PHP-FPM service has been removed — the strangler-fig
# migration is complete and ResourceSpace is now reference-only. The
# Go binary serves both /api/v1/* and the embedded SvelteKit bundle
# in prod; in dev, the `web` profile exposes Vite HMR on :5173.

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: infra/docker/app/Dockerfile
      args:
        GO_VERSION: "1.26"
        BUILD_VERSION: ${AA_VERSION:-dev}
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    expose:
      - "8080"
    environment:
      AA_HTTP_ADDR: ":8080"
      AA_DB_HOST: postgres
      AA_DB_PORT: "5432"
      AA_DB_USER: ${POSTGRES_USER:-artist_alley}
      AA_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      AA_DB_NAME: ${POSTGRES_DB:-artist_alley}
      AA_DB_SSLMODE: disable
      AA_LOG_LEVEL: ${AA_LOG_LEVEL:-info}
      AA_LOG_FORMAT: ${AA_LOG_FORMAT:-json}
      # Required for compatibility with any password hashes that
      # carried over from an old ResourceSpace install. Fresh installs
      # can generate a random value via ./scripts/bootstrap.sh.
      AA_SCRAMBLE_KEY: ${AA_SCRAMBLE_KEY:?AA_SCRAMBLE_KEY is required; see scripts/bootstrap.sh}
      # Master key for at-rest encryption (AES-256-GCM). Used by
      # the federation instance identity (1.22.B-b) to wrap the
      # per-instance Ed25519 private key in the system_config row,
      # and by per-user encryption keys (1.22.A). Hex-encoded
      # 32 bytes; bootstrap.sh generates one if missing.
      AA_MASTER_KEY: ${AA_MASTER_KEY:?AA_MASTER_KEY is required; see scripts/bootstrap.sh}
      # Dev/demo: use the documented default admin
      # (admin/ArtistAlleyMogul) so the seed loader + manual
      # poking against the dev stack don't need to fish a
      # random password out of the boot log. PRODUCTION DEPLOYS
      # MUST OMIT THIS — see internal/bootstrap/bootstrap.go.
      AA_BOOTSTRAP_DEFAULT_ADMIN: ${AA_BOOTSTRAP_DEFAULT_ADMIN:-1}
      # Storage root for the fs backend. Mounted as a named volume below
      # so uploads survive container rebuilds. Operators pointing at s3
      # set AA_STORAGE_BACKEND=s3 and ignore this.
      AA_STORAGE_FS_ROOT: /var/lib/aa-storage
      TZ: ${TZ:-UTC}
    volumes:
      - aa-storage:/var/lib/aa-storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Runtime image (debian-slim) has curl but not wget — see
      # infra/docker/app/Dockerfile. Hit /healthz once the app
      # listens; the HTTP server is only started after migrations
      # apply, so a healthy app means the schema is in place.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s
    restart: unless-stopped

  # SvelteKit frontend, dev-only (Vite HMR on :5173).
  #
  # The CI / prod image runs `npm run build` and pipes the output into
  # the Go binary via //go:embed (see app/internal/http/static_embed.go).
  # At prod runtime there is NO `web` container — `app` alone serves
  # both /api/v1 and the SPA bundle, preserving the locked "one binary,
  # three containers" target architecture.
  #
  # Starts with the stack by default — the dev frontend at
  # http://localhost:5173 is the primary surface for iterating on
  # UI changes and the seed apply script proxies API calls through
  # Vite. Stop manually (`docker compose stop web`) when iterating
  # backend-only and not wanting Node in the loop.
  web:
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    ports:
      - "${VITE_HOST_PORT:-5173}:5173"
    volumes:
      # Bind-mount the whole web/ tree so file edits trigger Vite HMR.
      # node_modules is masked by an anonymous volume so the image's
      # baked-in modules are used (avoids host-Linux symlink + perms
      # quirks on Windows / macOS).
      - ./web:/app
      - /app/node_modules
      # The OpenAPI spec is the contract for the generated TS client.
      # Mounted OUTSIDE /app so it doesn't create a stub file inside
      # the bind-mounted web/ on the host.
      - ./app/api/openapi.yaml:/opt/openapi.yaml:ro
    environment:
      # Vite proxies /api/* to nginx, which forwards to the Go app.
      # Override when running Vite outside Docker (e.g. pointing
      # straight at an `aa` binary on localhost:8080).
      AA_API_PROXY_TARGET: http://nginx:80
      AA_OPENAPI_SPEC: /opt/openapi.yaml
    depends_on:
      - app
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_DB: ${POSTGRES_DB:-artist_alley}
      POSTGRES_USER: ${POSTGRES_USER:-artist_alley}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artist_alley} -d ${POSTGRES_DB:-artist_alley}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MinIO is opt-in: bring it up via `docker compose --profile storage-s3 up -d`,
  # or have scripts/test.sh start it for the s3 backend's integration tests.
  # Production installs that point at AWS S3 / R2 / Backblaze never need this.
  minio:
    image: minio/minio:latest
    profiles: ["storage-s3"]
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aaminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required when storage-s3 profile is active}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local 2>/dev/null || curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  aa-storage:
  minio-data:
