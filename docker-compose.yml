# artist-alley — local development stack
#
# Production topology (and what compose runs by default):
#   nginx --proxies all-paths--> app (Go)          [REST + embedded SPA]
#                                postgres (pgvector)
#
# The Go binary serves both /api/v1/* and the embedded SvelteKit
# bundle in prod; in dev, the `web` profile exposes Vite HMR on
# :5173.

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
        aliases:
          # Inside the docker bridge network, dialing
          # http://studio-a.local resolves to dev's nginx — used
          # by the dogfood profile so studio-b (when running) can
          # federate with dev under a canonical hostname. The
          # host browser still uses localhost:8080 / :5173; this
          # alias is container-internal only.
          - studio-a.local
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: infra/docker/app/Dockerfile
      args:
        GO_VERSION: "1.26"
        BUILD_VERSION: ${AA_VERSION:-dev}
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    expose:
      - "8080"
    environment:
      AA_HTTP_ADDR: ":8080"
      AA_DB_HOST: postgres
      AA_DB_PORT: "5432"
      AA_DB_USER: ${POSTGRES_USER:-artist_alley}
      AA_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      AA_DB_NAME: ${POSTGRES_DB:-artist_alley}
      AA_DB_SSLMODE: disable
      AA_LOG_LEVEL: ${AA_LOG_LEVEL:-info}
      AA_LOG_FORMAT: ${AA_LOG_FORMAT:-json}
      # Static per-install pepper mixed into bcrypt password hashes.
      # Fresh installs can generate a random value via
      # ./scripts/bootstrap.sh.
      AA_SCRAMBLE_KEY: ${AA_SCRAMBLE_KEY:?AA_SCRAMBLE_KEY is required; see scripts/bootstrap.sh}
      # Master key for at-rest encryption (AES-256-GCM). Used by
      # the federation instance identity (1.22.B-b) to wrap the
      # per-instance Ed25519 private key in the system_config row,
      # and by per-user encryption keys (1.22.A). Hex-encoded
      # 32 bytes; bootstrap.sh generates one if missing.
      AA_MASTER_KEY: ${AA_MASTER_KEY:?AA_MASTER_KEY is required; see scripts/bootstrap.sh}
      # Dev/demo: use the documented default admin
      # (admin/ArtistAlleyMogul) so the seed loader + manual
      # poking against the dev stack don't need to fish a
      # random password out of the boot log. PRODUCTION DEPLOYS
      # MUST OMIT THIS — see internal/bootstrap/bootstrap.go.
      AA_BOOTSTRAP_DEFAULT_ADMIN: ${AA_BOOTSTRAP_DEFAULT_ADMIN:-1}
      # Demo mode: advertise the shared demo credentials on the login
      # card + render a "read-only demo" banner once signed in. Off by
      # default (zero footprint); the public demo deployment sets
      # AA_DEMO_MODE=1. Write-blocking itself is enforced at the edge.
      AA_DEMO_MODE: ${AA_DEMO_MODE:-0}
      # Storage root for the fs backend. Mounted as a named volume below
      # so uploads survive container rebuilds. Operators pointing at s3
      # set AA_STORAGE_BACKEND=s3 and ignore this.
      AA_STORAGE_FS_ROOT: /var/lib/aa-storage
      # Fraction of the container ceiling below handed to GOMEMLIMIT.
      # Read by app/internal/memlimit at boot; forwarded here because a
      # value the Go process never sees is not a knob (#887).
      AA_GOMEMLIMIT_RATIO: ${AA_GOMEMLIMIT_RATIO:-0.8}
      # Memory instrumentation (#888). Forwarded explicitly for the
      # same reason the ratio above is: a value the Go process never
      # sees is not a knob. Defaults are ON — the evidence has to
      # already be collected when the container dies, and an opt-in
      # trail is one nobody switched on before the 03:00 OOM kill.
      AA_MEM_SAMPLE_INTERVAL: ${AA_MEM_SAMPLE_INTERVAL:-15s}
      AA_MEM_CAPTURE_THRESHOLD: ${AA_MEM_CAPTURE_THRESHOLD:-0.8}
      AA_MEM_CAPTURE_DIR: ${AA_MEM_CAPTURE_DIR:-/tmp/aa-memcapture}
      AA_MEM_CAPTURE_KEEP: ${AA_MEM_CAPTURE_KEEP:-5}
      AA_MEM_CAPTURE_MIN_INTERVAL: ${AA_MEM_CAPTURE_MIN_INTERVAL:-2m}
      TZ: ${TZ:-UTC}
    # Memory ceiling for the app container (#781).
    #
    # This is deliberately set on the BASE stack, not only under the CI
    # resource override. Previously CI capped the app at 4g and the
    # default/production stack capped it at nothing, and that silent
    # difference was the actual defect: the preview pipeline's unbounded
    # heap growth could only ever be observed in CI, where it showed up
    # as an OOM kill, while the same growth on an uncapped host just
    # expanded until the whole machine was under pressure — degrading
    # every other container instead of the one at fault.
    #
    # The Go side derives GOMEMLIMIT from whatever value lands here (see
    # app/internal/memlimit), so this number is the single place the
    # ceiling is stated. Raise it for an instance with a big catalogue
    # and heavy preview concurrency; the runtime follows automatically.
    #
    # 8g, not the original 4g (#887). A ~150-asset preview render storm
    # was measured at 5.39 GB of cgroup `anon` at peak — 3.31 GB of it
    # LIVE Go heap (concurrent decode buffers held by running jobs, which
    # no amount of GC pacing can shrink), ~1.0 GB non-Go anon from the
    # ffmpeg/ghostscript/node+chromium children that share this cgroup.
    # A 4g ceiling cannot hold that peak at all, so any instance that
    # renders previews was living on the kernel's mercy.
    mem_limit: ${AA_APP_MEM_LIMIT:-8g}
    volumes:
      - aa-storage:/var/lib/aa-storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Runtime image (debian-slim) has curl but not wget — see
      # infra/docker/app/Dockerfile. Hit /healthz once the app
      # listens; the HTTP server is only started after migrations
      # apply, so a healthy app means the schema is in place.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s
    restart: unless-stopped

  # SvelteKit frontend, dev-only (Vite HMR on :5173).
  #
  # The CI / prod image runs `npm run build` and pipes the output into
  # the Go binary via //go:embed (see app/internal/http/static_embed.go).
  # At prod runtime there is NO `web` container — `app` alone serves
  # both /api/v1 and the SPA bundle, preserving the locked "one binary,
  # three containers" target architecture.
  #
  # Starts with the stack by default — the dev frontend at
  # http://localhost:5173 is the primary surface for iterating on
  # UI changes and the seed apply script proxies API calls through
  # Vite. Stop manually (`docker compose stop web`) when iterating
  # backend-only and not wanting Node in the loop.
  web:
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    ports:
      - "${VITE_HOST_PORT:-5173}:5173"
    networks:
      default:
        aliases:
          # Dotted alias so Chromium-driven tests on the compose
          # network can reach Vite without tripping Chromium's
          # single-label-host policy (which auto-upgrades `web` to
          # HTTPS and breaks `http://web:5173/...` with
          # ERR_SSL_PROTOCOL_ERROR). Same pattern as the `app.aa`
          # alias the CI override on ui-pr.yml uses for the prod
          # image. Local dev uses localhost:5173 via the published
          # port and ignores this.
          - vite.aa
    volumes:
      # Bind-mount the whole web/ tree so host edits reach the dev
      # server without a rebuild. The change *events* do not come for
      # free though: Vite documents that filesystem watching is broken
      # under WSL2 (and under Docker with a WSL2 backend) when the
      # project sits on a Windows filesystem, which is where this
      # checkout lives. inotify never crosses the mount, so
      # web/vite.config.ts turns on watcher polling — see
      # `server.watch` there for the measured cost. Without it Vite
      # never learns a file changed and even a full page reload
      # serves the stale module it cached on first request (#993).
      # node_modules is masked by an anonymous volume so the image's
      # baked-in modules are used (avoids host-Linux symlink + perms
      # quirks on Windows / macOS).
      - ./web:/app
      - /app/node_modules
      # The OpenAPI spec is the contract for the generated TS client.
      # Mounted OUTSIDE /app so it doesn't create a stub file inside
      # the bind-mounted web/ on the host.
      - ./app/api/openapi.yaml:/opt/openapi.yaml:ro
    environment:
      # Vite proxies /api/* to nginx, which forwards to the Go app.
      # Override when running Vite outside Docker (e.g. pointing
      # straight at an `aa` binary on localhost:8080).
      AA_API_PROXY_TARGET: http://nginx:80
      AA_OPENAPI_SPEC: /opt/openapi.yaml
    depends_on:
      - app
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_DB: ${POSTGRES_DB:-artist_alley}
      POSTGRES_USER: ${POSTGRES_USER:-artist_alley}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artist_alley} -d ${POSTGRES_DB:-artist_alley}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MinIO is opt-in: bring it up via `docker compose --profile storage-s3 up -d`,
  # or have scripts/test.sh start it for the s3 backend's integration tests.
  # Production installs that point at AWS S3 / R2 / Backblaze never need this.
  minio:
    image: minio/minio:latest
    profiles: ["storage-s3"]
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aaminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required when storage-s3 profile is active}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local 2>/dev/null || curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Dogfood profile (Phase 1.22.I-a, issue #98)
  #
  # Spawns a SECOND artist-alley instance alongside the default dev
  # stack so federation scenarios can run end-to-end against two real
  # peers. The dev stack plays studio-a (browse at the usual
  # http://localhost:8080); studio-b lives at https://studio-b.local:9443
  # with mkcert TLS.
  #
  # Opt in via the helper: `./scripts/dogfood/up.sh`. That script also
  # provisions the mkcert CA + writes the /etc/hosts entry idempotently
  # — direct `docker compose --profile dogfood up -d` works too but the
  # browser will see a TLS warning until the CA is installed.
  #
  # studio-b ships WITHOUT a pre-seeded dataset. Operators supply their
  # own via `./scripts/dogfood/seed.sh --site <path>`; the demo-safe
  # site_a stays the source of truth for studio-a's data.
  # ---------------------------------------------------------------------

  postgres-b:
    image: pgvector/pgvector:pg16
    profiles: ["dogfood"]
    environment:
      POSTGRES_USER: artist_alley
      POSTGRES_PASSWORD: dogfood_studio_b
      POSTGRES_DB: artist_alley
    volumes:
      - postgres-b-data:/var/lib/postgresql/data
    ports:
      - "${STUDIO_B_PG_PORT:-25433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artist_alley -d artist_alley"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  app-b:
    profiles: ["dogfood"]
    image: artist-alley-app:latest  # built by the default-profile `app` service
    build:
      context: .
      dockerfile: infra/docker/app/Dockerfile
      args:
        GO_VERSION: "1.26"
        BUILD_VERSION: ${AA_VERSION:-dev}
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    expose:
      - "8080"
    environment:
      AA_HTTP_ADDR: ":8080"
      AA_DB_HOST: postgres-b
      AA_DB_PORT: "5432"
      AA_DB_USER: artist_alley
      AA_DB_PASSWORD: dogfood_studio_b
      AA_DB_NAME: artist_alley
      AA_DB_SSLMODE: disable
      AA_LOG_LEVEL: ${AA_LOG_LEVEL:-info}
      AA_LOG_FORMAT: json
      # studio-b runs against the SAME at-rest + scramble keys as
      # the dev stack so a single .env materialises both. Fine for
      # dogfood; never for prod.
      AA_SCRAMBLE_KEY: ${AA_SCRAMBLE_KEY:?AA_SCRAMBLE_KEY is required; see scripts/bootstrap.sh}
      AA_MASTER_KEY: ${AA_MASTER_KEY:?AA_MASTER_KEY is required; see scripts/bootstrap.sh}
      AA_BOOTSTRAP_DEFAULT_ADMIN: "1"
      AA_STORAGE_FS_ROOT: /var/lib/aa-storage
      AA_GOMEMLIMIT_RATIO: ${AA_GOMEMLIMIT_RATIO:-0.8}
      # Memory instrumentation (#888). Forwarded explicitly for the
      # same reason the ratio above is: a value the Go process never
      # sees is not a knob. Defaults are ON — the evidence has to
      # already be collected when the container dies, and an opt-in
      # trail is one nobody switched on before the 03:00 OOM kill.
      AA_MEM_SAMPLE_INTERVAL: ${AA_MEM_SAMPLE_INTERVAL:-15s}
      AA_MEM_CAPTURE_THRESHOLD: ${AA_MEM_CAPTURE_THRESHOLD:-0.8}
      AA_MEM_CAPTURE_DIR: ${AA_MEM_CAPTURE_DIR:-/tmp/aa-memcapture}
      AA_MEM_CAPTURE_KEEP: ${AA_MEM_CAPTURE_KEEP:-5}
      AA_MEM_CAPTURE_MIN_INTERVAL: ${AA_MEM_CAPTURE_MIN_INTERVAL:-2m}
      TZ: ${TZ:-UTC}
    # Same ceiling as `app` — this runs the identical binary and the
    # identical preview pipeline, so leaving it uncapped would recreate
    # exactly the asymmetry #781 removes.
    mem_limit: ${AA_APP_MEM_LIMIT:-8g}
    volumes:
      - aa-storage-b:/var/lib/aa-storage
    depends_on:
      postgres-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s
    restart: unless-stopped

  nginx-b:
    image: nginx:1.27-alpine
    profiles: ["dogfood"]
    ports:
      - "${STUDIO_B_HTTPS_PORT:-9443}:9443"
    volumes:
      - ./infra/docker/dogfood/nginx/studio-b.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/docker/dogfood/certs:/etc/nginx/certs:ro
    networks:
      default:
        aliases:
          # Container-internal DNS for studio-b → nginx-b.
          # The host browser hits the same hostname:port via
          # /etc/hosts (managed by scripts/dogfood/up.sh).
          - studio-b.local
    depends_on:
      - app-b
    restart: unless-stopped

volumes:
  postgres-data:
  aa-storage:
  minio-data:
  postgres-b-data:
  aa-storage-b:
