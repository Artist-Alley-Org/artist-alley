# artist-alley — local development stack
#
# Phase 0: nginx + php-fpm (RS) + mysql (RS) + postgres+pgvector (adjunct).
# Later phases add: redis (job queue), ai-gateway, review-sessions,
# video-pipeline, embeddings, web (SvelteKit).
#
# Run:   docker compose up --build
# Stop:  docker compose down

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - filestore:/var/www/html/filestore
    depends_on:
      - php
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: infra/docker/php-fpm/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        TZ: ${TZ:-UTC}
    expose:
      - "9000"
    volumes:
      - .:/var/www/html
      - filestore:/var/www/html/filestore
    environment:
      TZ: ${TZ:-UTC}
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_DB: ${POSTGRES_DB:-artist_alley}
      POSTGRES_USER: ${POSTGRES_USER:-artist_alley}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artist_alley} -d ${POSTGRES_DB:-artist_alley}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  filestore:
