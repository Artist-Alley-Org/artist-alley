# artist-alley — local development stack
#
# Phase 1.0 topology:
#   nginx --routes prefix-by-prefix-->  app (Go)          [/healthz, /readyz, ...]
#                                       php-fpm (RS PHP)  [everything else, for now]
#                                       postgres (pgvector)
#
# As Go ports more endpoints, nginx routes shift to `app`. When the last
# PHP route is ported, the `php` service is deleted. Container count
# stays bounded at three (nginx, app, postgres) forever.

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - filestore:/var/www/html/filestore
    depends_on:
      - app
      - php
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: infra/docker/app/Dockerfile
      args:
        GO_VERSION: "1.26"
        BUILD_VERSION: ${AA_VERSION:-dev}
    expose:
      - "8080"
    environment:
      AA_HTTP_ADDR: ":8080"
      AA_DB_HOST: postgres
      AA_DB_PORT: "5432"
      AA_DB_USER: ${POSTGRES_USER:-artist_alley}
      AA_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      AA_DB_NAME: ${POSTGRES_DB:-artist_alley}
      AA_DB_SSLMODE: disable
      AA_LOG_LEVEL: ${AA_LOG_LEVEL:-info}
      AA_LOG_FORMAT: ${AA_LOG_FORMAT:-json}
      AA_LEGACY_PHP_ADDR: php:9000
      # Must match RS's scramble_key in include/config.php so
      # password hashes and PAT comparisons are byte-compatible.
      AA_SCRAMBLE_KEY: ${AA_SCRAMBLE_KEY:?AA_SCRAMBLE_KEY is required; copy scramble_key out of include/config.php into .env}
      # Storage root for the fs backend. Mounted as a named volume below
      # so uploads survive container rebuilds. Operators pointing at s3
      # set AA_STORAGE_BACKEND=s3 and ignore this.
      AA_STORAGE_FS_ROOT: /var/lib/aa-storage
      TZ: ${TZ:-UTC}
    volumes:
      - aa-storage:/var/lib/aa-storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: infra/docker/php-fpm/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        TZ: ${TZ:-UTC}
    expose:
      - "9000"
    volumes:
      - .:/var/www/html
      - filestore:/var/www/html/filestore
    environment:
      TZ: ${TZ:-UTC}
    depends_on:
      - postgres
    restart: unless-stopped

  # SvelteKit frontend, dev-only (Vite HMR on :5173).
  #
  # The CI / prod image runs `npm run build` and pipes the output into
  # the Go binary via //go:embed (see app/internal/http/static_embed.go).
  # At prod runtime there is NO `web` container — `app` alone serves
  # both /api/v1 and the SPA bundle, preserving the locked "one binary,
  # three containers" target architecture.
  #
  # Opt-in via `docker compose --profile web up` (or run all services
  # with `docker compose --profile web up -d`). Defaults to off so
  # backend-only iterations don't need Node in the loop.
  web:
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    ports:
      - "${VITE_HOST_PORT:-5173}:5173"
    volumes:
      # Bind-mount the whole web/ tree so file edits trigger Vite HMR.
      # node_modules is masked by an anonymous volume so the image's
      # baked-in modules are used (avoids host-Linux symlink + perms
      # quirks on Windows / macOS).
      - ./web:/app
      - /app/node_modules
      # The OpenAPI spec is the contract for the generated TS client.
      # Mounted OUTSIDE /app so it doesn't create a stub file inside
      # the bind-mounted web/ on the host.
      - ./app/api/openapi.yaml:/opt/openapi.yaml:ro
    environment:
      # Vite proxies /api/* to nginx so the FastCGI split between
      # /api/v1/legacy/* (PHP) and /api/v1/* (Go) is handled in one
      # place. Override when running Vite outside Docker.
      AA_API_PROXY_TARGET: http://nginx:80
      AA_OPENAPI_SPEC: /opt/openapi.yaml
    profiles: ["web"]
    depends_on:
      - app
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_DB: ${POSTGRES_DB:-artist_alley}
      POSTGRES_USER: ${POSTGRES_USER:-artist_alley}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artist_alley} -d ${POSTGRES_DB:-artist_alley}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MinIO is opt-in: bring it up via `docker compose --profile storage-s3 up -d`,
  # or have scripts/test.sh start it for the s3 backend's integration tests.
  # Production installs that point at AWS S3 / R2 / Backblaze never need this.
  minio:
    image: minio/minio:latest
    profiles: ["storage-s3"]
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aaminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required when storage-s3 profile is active}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local 2>/dev/null || curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  filestore:
  aa-storage:
  minio-data:
