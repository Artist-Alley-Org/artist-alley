<!doctype html>
<!-- Production headless three.js preview renderer (#498, ADR 0069).      -->
<!-- Loaded by worker.mjs in a headless Chromium (SwiftShader software     -->
<!-- WebGL). Renders a turntable + poster + reference views in the fixed   -->
<!-- layout the Go ModelHandler's sprite/ladder fanning consumes as-is.    -->
<!--                                                                      -->
<!-- The model load path and the default lighting numbers are IMPORTED     -->
<!-- from the web app (/shared/*, served by worker.mjs), not reimplemented -->
<!-- here — that is what makes ADR 0069's WYSIWYG claim true. See #689:    -->
<!-- while this page had its own loader, it silently rendered every OBJ    -->
<!-- untextured and every unlit glTF as a flat silhouette.                 -->
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: transparent; }
  #stage { position: fixed; inset: 0; }
</style>
<div id="stage"></div>

<script type="importmap">
  {
    "imports": {
      "three": "/three/build/three.module.js",
      "three/addons/": "/three/examples/jsm/",
      "three/examples/jsm/": "/three/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
  // The shared load path — the SAME module the interactive viewer
  // (ModelView.svelte) imports. Loader dispatch, OBJ .mtl resolution and
  // material normalisation live there; nothing about them is duplicated
  // on this page. worker.mjs serves web/src/lib/3d/ at /shared/.
  import { loadModel, companionLoadingManager } from '/shared/modelLoader.js';
  import {
    DEFAULT_KEY_INTENSITY,
    DEFAULT_FILL_INTENSITY,
    DEFAULT_RIM_INTENSITY,
    DEFAULT_AMBIENT_INTENSITY,
    DEFAULT_ENV_ROUGHNESS,
    DEFAULT_TONE_MAPPING,
    DEFAULT_EXPOSURE,
  } from '/shared/defaultLighting.js';

  // Report the actual WebGL backend so the worker log can confirm we ran
  // on SwiftShader (software) vs a real GL.
  function glInfo() {
    try {
      const c = document.createElement('canvas');
      const gl = c.getContext('webgl2') || c.getContext('webgl');
      if (!gl) return { ok: false, renderer: 'NO_WEBGL' };
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      return {
        ok: true,
        version: gl.getParameter(gl.VERSION),
        renderer: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
        vendor: dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR),
      };
    } catch (e) {
      return { ok: false, renderer: 'ERR:' + e.message };
    }
  }
  window.__glInfo = glInfo;

  function countTris(obj) {
    let t = 0;
    obj.traverse((n) => {
      if (n.isMesh && n.geometry) {
        const g = n.geometry;
        t += g.index ? g.index.count / 3 : (g.attributes.position ? g.attributes.position.count / 3 : 0);
      }
    });
    return Math.round(t);
  }

  // Material/texture census of the loaded model, reported back in the
  // worker's JSON so "rendered but untextured" is diagnosable from a log
  // line instead of by eyeballing a PNG. A `map` whose image never
  // decoded (0×0, or missing entirely) is the signature of a texture
  // that 404'd or failed to decode — the exact class of bug #689 was.
  function materialCensus(obj) {
    const seen = new Set();
    const mats = [];
    let mapped = 0;
    const broken = [];
    obj.traverse((n) => {
      if (!n.isMesh) return;
      for (const m of (Array.isArray(n.material) ? n.material : [n.material])) {
        if (!m || seen.has(m.uuid)) continue;
        seen.add(m.uuid);
        const img = m.map?.image;
        const w = img?.width ?? 0;
        const h = img?.height ?? 0;
        const entry = { name: m.name || '', type: m.type, hasMap: !!m.map, mapWidth: w, mapHeight: h };
        if (m.map) {
          if (w > 0 && h > 0) mapped++;
          else broken.push(m.name || m.uuid);
        }
        mats.push(entry);
      }
    });
    return { materials: mats, mapped, broken };
  }

  const FOV_V = 2 * Math.atan(18 / 35) * 180 / Math.PI; // 35mm lens / 36mm sensor ≈ 54.43°
  const FOV_RAD = FOV_V * Math.PI / 180;
  const TILT = 20 * Math.PI / 180;
  const PADDING = 1.2;

  // fit-to-frame ground distance for a square frame given a vertical +
  // horizontal extent.
  function fitDistance(vExt, hExt) {
    const dV = (vExt * PADDING) / (2 * Math.tan(FOV_RAD / 2));
    const dH = (hExt * PADDING) / (2 * Math.tan(FOV_RAD / 2));
    return Math.max(dV, dH, 0.1);
  }

  // __renderAll loads the model ONCE and produces every output the
  // preview.model pipeline needs:
  //   turntable: `frames` PNG data URLs at res×res, 20° tilt, 360/frames°
  //   poster:    one PNG at posterRes (frame-0 angle) — the raster-ladder
  //              source; three.js renders it textured first-pass so no
  //              workbench-magenta / iso re-fan dance is needed
  //   top/bottom: orthographic-style reference views at res×res
  // All transparent RGBA PNGs.
  //
  // opts.companions is [{ path, url }] for the model's staged sidecars —
  // worker.mjs enumerates the work dir. OBJ needs it to find its .mtl;
  // everything else resolves relatively against the served work dir.
  window.__renderAll = async function (url, ext, opts) {
    const frames = opts.frames ?? 36;
    const res = opts.res ?? 512;
    const posterRes = opts.posterRes ?? 2048;
    const companions = opts.companions ?? [];
    const t0 = performance.now();

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(res, res, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    // DEFAULT_TONE_MAPPING is the viewer's session default; the id →
    // THREE constant mapping lives in the viewer's environments.ts,
    // which this page can't import (TypeScript, and it pulls the whole
    // preset machinery). Assert rather than silently diverge.
    if (DEFAULT_TONE_MAPPING !== 'aces') {
      throw new Error(`tone-mapping drift: defaultLighting says ${DEFAULT_TONE_MAPPING}, render.html does ACES`);
    }
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = DEFAULT_EXPOSURE;
    renderer.setClearColor(0x000000, 0);
    document.getElementById('stage').appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), DEFAULT_ENV_ROUGHNESS).texture;

    // Three-point rig mirroring ModelView's key/fill/rim. The
    // intensities, the ambient floor and the tone curve are imported
    // from the viewer's source of truth (defaultLighting.js), so the
    // thumbnail and a freshly-opened viewer cannot drift (#509).
    const key = new THREE.DirectionalLight(0xffffff, DEFAULT_KEY_INTENSITY);
    key.position.set(3, 4, 5); scene.add(key);
    const fill = new THREE.DirectionalLight(0xffffff, DEFAULT_FILL_INTENSITY);
    fill.position.set(-4, 1, 2); scene.add(fill);
    const rim = new THREE.DirectionalLight(0xffffff, DEFAULT_RIM_INTENSITY);
    rim.position.set(0, 3, -5); scene.add(rim);
    scene.add(new THREE.AmbientLight(0xffffff, DEFAULT_AMBIENT_INTENSITY));

    // Same companion-aware manager the viewer uses. Plain relative
    // resolution against the work dir is NOT enough for every format:
    // three.js's FBXLoader reduces `Textures\barrel.png` to its basename
    // before requesting it (`images[id].split('\\').pop()`), so it asks
    // the work dir for `barrel.png` while the companion is staged at
    // `Textures/barrel.png` — a 404 and an untextured thumbnail (#753).
    // The manager's basename fallback bridges that; for GLB and OBJ,
    // whose loaders ask for the full relative path, it resolves to the
    // same URL relative resolution already found.
    const { object: model } = await loadModel({
      url, ext, companions, manager: companionLoadingManager(companions),
    });
    const loadedAt = performance.now();
    const census = materialCensus(model);
    if (census.broken.length > 0) {
      console.error('[render] materials whose texture never decoded: ' + census.broken.join(', '));
    }

    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    model.position.sub(center);
    const pivot = new THREE.Group();
    pivot.add(model);
    scene.add(pivot);

    const maxDim = Math.max(size.x, size.y, size.z) || 1;

    // Turntable camera: 20° tilt, fit-to-frame. three is Y-up (vertical =
    // size.y, depth-toward-camera = size.z, width = size.x).
    const cam = new THREE.PerspectiveCamera(FOV_V, 1, maxDim / 1000, maxDim * 100);
    const vExt = size.y * Math.cos(TILT) + size.z * Math.sin(TILT);
    const hExt = Math.max(size.x, size.z);
    const dist = fitDistance(vExt, hExt);
    cam.position.set(0, dist * Math.tan(TILT), dist);
    cam.lookAt(0, 0, 0);

    // Compile up front: a shader/texture-upload failure then throws here
    // rather than silently producing an untextured first frame.
    renderer.compile(scene, cam);

    const render = () => {
      renderer.render(scene, cam);
      return renderer.domElement.toDataURL('image/png');
    };

    // Turntable frames.
    const turntable = [];
    for (let i = 0; i < frames; i++) {
      pivot.rotation.y = (i / frames) * Math.PI * 2;
      turntable.push(render());
    }

    // Poster: frame-0 angle at posterRes (bigger canvas, same square
    // camera → identical framing, more pixels for the upper ladder rungs).
    pivot.rotation.y = 0;
    renderer.setSize(posterRes, posterRes, false);
    const poster = render();
    renderer.setSize(res, res, false); // back to turntable res for the views

    // Top + bottom reference views. Footprint is the X-Z extent; add half
    // the height as clearance so the camera clears a tall model.
    const footprint = Math.max(size.x, size.z);
    const viewDist = fitDistance(footprint, footprint) + size.y / 2;
    const vcam = new THREE.PerspectiveCamera(FOV_V, 1, maxDim / 1000, maxDim * 100);
    pivot.rotation.y = 0;

    vcam.up.set(0, 0, -1);
    vcam.position.set(0, viewDist, 0);
    vcam.lookAt(0, 0, 0);
    renderer.render(scene, vcam);
    const top = renderer.domElement.toDataURL('image/png');

    vcam.up.set(0, 0, 1);
    vcam.position.set(0, -viewDist, 0);
    vcam.lookAt(0, 0, 0);
    renderer.render(scene, vcam);
    const bottom = renderer.domElement.toDataURL('image/png');

    const doneAt = performance.now();
    return {
      turntable, poster, top, bottom,
      timings: {
        load_ms: Math.round(loadedAt - t0),
        render_ms: Math.round(doneAt - loadedAt),
        total_ms: Math.round(doneAt - t0),
      },
      meta: {
        maxDim, frames, res, posterRes,
        triangles: countTris(model),
        materials: census.materials,
        texturedMaterials: census.mapped,
        brokenTextures: census.broken,
      },
    };
  };

  window.__ready = true;
</script>
