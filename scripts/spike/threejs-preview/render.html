<!doctype html>
<!-- #497 spike — headless three.js turntable renderer. EXPERIMENTAL. -->
<!-- Loaded by worker.mjs in a headless Chromium (SwiftShader WebGL).   -->
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: transparent; }
  #stage { position: fixed; inset: 0; }
</style>
<div id="stage"></div>

<script type="importmap">
  {
    "imports": {
      "three": "/three/build/three.module.js",
      "three/addons/": "/three/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
  import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

  // Report the actual WebGL backend so the note can state whether we ran
  // on SwiftShader (software) or a real GL — the whole fidelity/perf
  // question turns on this.
  function glInfo() {
    try {
      const c = document.createElement('canvas');
      const gl = c.getContext('webgl2') || c.getContext('webgl');
      if (!gl) return { ok: false, renderer: 'NO_WEBGL' };
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      return {
        ok: true,
        version: gl.getParameter(gl.VERSION),
        renderer: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
        vendor: dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR),
      };
    } catch (e) {
      return { ok: false, renderer: 'ERR:' + e.message };
    }
  }
  window.__glInfo = glInfo;

  async function loadModel(url, ext) {
    const e = ext.toLowerCase().replace(/^\./, '');
    if (e === 'glb' || e === 'gltf') {
      const g = await new Promise((res, rej) => new GLTFLoader().load(url, res, undefined, rej));
      return g.scene;
    }
    if (e === 'fbx') {
      return await new Promise((res, rej) => new FBXLoader().load(url, res, undefined, rej));
    }
    if (e === 'obj') {
      return await new Promise((res, rej) => new OBJLoader().load(url, res, undefined, rej));
    }
    throw new Error('unsupported ext: ' + e);
  }

  // Renders a `frames`-step turntable at res×res. Rotates the MODEL about
  // its vertical axis in equal steps (matching the Blender turntable's
  // 360/frames° per step). Returns an array of PNG data URLs (RGBA,
  // transparent background — like Blender's PNG frames).
  window.__renderTurntable = async function (url, ext, opts) {
    const frames = opts.frames ?? 36;
    const res = opts.res ?? 512;
    const t0 = performance.now();

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(res, res, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.setClearColor(0x000000, 0); // transparent
    document.getElementById('stage').appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    // Neutral IBL so PBR (glTF) materials read correctly — the viewer
    // uses a real env preset; RoomEnvironment is the standard headless
    // stand-in. Background stays transparent.
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    // Three-point rig, mirroring ModelView's key/fill/rim.
    const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3, 4, 5); scene.add(key);
    const fill = new THREE.DirectionalLight(0xffffff, 0.8); fill.position.set(-4, 1, 2); scene.add(fill);
    const rim = new THREE.DirectionalLight(0xffffff, 1.0); rim.position.set(0, 3, -5); scene.add(rim);
    scene.add(new THREE.AmbientLight(0xffffff, 0.25));

    const model = await loadModel(url, ext);
    const loadedAt = performance.now();

    // Center at origin, then frame to MATCH Blender's turntable.py
    // (scripts/blender/turntable.py) so the output is a drop-in for the
    // preview.model render step — NOT ModelView's orbit-camera distance
    // (maxDim*2.2, which is tuned for a zoomable interactive view and
    // frames a thumbnail ~2× too small).
    //
    // Blender's turntable: 20° elevation, 35mm lens on a 36mm sensor
    // (→ 54.4° FOV), fit-to-frame with 1.2 padding. three is Y-up vs
    // Blender's Z-up: vertical = size.y, depth-toward-camera = size.z,
    // width = size.x.
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    model.position.sub(center);
    const pivot = new THREE.Group();
    pivot.add(model);
    scene.add(pivot);

    const TILT = 20 * Math.PI / 180;
    const FOV_V = 2 * Math.atan(18 / 35) * 180 / Math.PI; // 35mm/36mm ≈ 54.43°
    const maxDim = Math.max(size.x, size.y, size.z) || 1;
    const cam = new THREE.PerspectiveCamera(FOV_V, 1, maxDim / 1000, maxDim * 100);
    const fovV = FOV_V * Math.PI / 180, fovH = fovV; // square aspect
    const vExt = size.y * Math.cos(TILT) + size.z * Math.sin(TILT);
    const hExt = Math.max(size.x, size.z);
    const padding = 1.2;
    const dV = (vExt * padding) / (2 * Math.tan(fovV / 2));
    const dH = (hExt * padding) / (2 * Math.tan(fovH / 2));
    const dist = Math.max(dV, dH, 0.1); // ground-plane distance (as Blender uses it)
    cam.position.set(0, dist * Math.tan(TILT), dist);
    cam.lookAt(0, 0, 0);

    const urls = [];
    for (let i = 0; i < frames; i++) {
      pivot.rotation.y = (i / frames) * Math.PI * 2; // full 360 over `frames`
      renderer.render(scene, cam);
      urls.push(renderer.domElement.toDataURL('image/png'));
    }
    const doneAt = performance.now();

    return {
      urls,
      timings: {
        load_ms: Math.round(loadedAt - t0),
        render_ms: Math.round(doneAt - loadedAt),
        total_ms: Math.round(doneAt - t0),
      },
      meta: { maxDim, frames, res, triangles: countTris(model) },
    };
  };

  function countTris(obj) {
    let t = 0;
    obj.traverse((n) => {
      if (n.isMesh && n.geometry) {
        const g = n.geometry;
        t += g.index ? g.index.count / 3 : (g.attributes.position ? g.attributes.position.count / 3 : 0);
      }
    });
    return Math.round(t);
  }

  window.__ready = true;
</script>
