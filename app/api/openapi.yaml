  /posts:
    get:
      operationId: listPosts
      summary: List posts (paginated feed)
      description: |
        The browse-page feed. Public posts visible to authenticated
        callers; the author's own posts of any visibility are also
        returned. Phase 1.13.G adds anonymous access when the system
        config allows it.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: author_ref
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: visibility
          in: query
          required: false
          schema:
            type: string
            enum: [private, followers, public]
        - name: q
          in: query
          required: false
          description: |
            Plain-text search over the post's TSVECTOR. Phase 1.12
            (search DSL) replaces this with the full query language.
          schema: { type: string, maxLength: 200 }
        - name: tag
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A page of posts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createPost
      summary: Publish a new post
      description: |
        Wraps 1+ existing assets into a Post. The asset bytes are
        already in storage (POST /storage/objects) and the asset
        entities are already created (POST /assets); this endpoint
        ties them together with the descriptive metadata.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostCreate" }
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /posts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getPost
      summary: Fetch a post with its members + tags
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePost
      summary: Partial update of a post
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deletePost
      summary: Soft-delete a post
      description: |
        Removes the post from feed views. Member assets are not
        deleted (an asset may belong to multiple posts; storage pins
        are owned at the asset layer).
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/acls:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listPostAcls
      summary: List ACL entries on a post
      description: |
        Returns every ACL row attached to this post. ACL rows are
        additive grants on top of the post's visibility and the
        role / team-scope checks. Requires read access to the post.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: ACL entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AclEntry" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addPostAcl
      summary: Grant a permission on a post to a principal
      description: |
        Inserts one ACL row. The same principal can hold multiple
        permission levels (e.g. read AND write) — that's two POSTs.
        Requires write access to the post (owner / posts.admin /
        system.admin) so a contributor can't grant access beyond
        their own ability to mutate.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AclCreate" }
      responses:
        "204":
          description: ACL row added
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/acls/{principal_type}/{principal_id}/{permission}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: principal_type
        in: path
        required: true
        schema:
          type: string
          enum: [user, role, team]
      - name: principal_id
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
      - name: permission
        in: path
        required: true
        schema:
          type: string
          enum: [read, write, admin]
    delete:
      operationId: removePostAcl
      summary: Revoke a specific permission row from a principal
      description: |
        Removes the exact (principal_type, principal_id, permission)
        tuple. Other permission levels for the same principal stay
        in place. 404 if the row doesn't exist.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/like:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getPostLike
      summary: Whether the current caller has liked this post
      description: |
        Used by the post modal on open to decide whether the Like
        button shows the active state. Returns {liked: bool}.
        Anonymous callers get 401.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Like state for the caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostLikeState" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: likePost
      summary: Like a post
      description: |
        Idempotent — re-liking a post the caller already liked is a
        no-op (counter doesn't bump twice). Requires `posts.like`
        capability (granted to Base by default).
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Liked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: unlikePost
      summary: Remove the caller's like on a post
      description: |
        404 if the caller hadn't liked the post (the optimistic-update
        client uses this signal to revert its local state). Counter
        is maintained by the 00020 trigger; we never decrement to
        below zero.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Unliked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/comments:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listPostComments
      summary: List the comment thread on a post
      description: |
        Returns LIVE comments (deleted_at IS NULL), grouped by root,
        within each root sorted depth-then-time so replies appear
        under their parent. Threads ordered newest-root-first.
        Cursor pagination advances by root.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A page of comments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createPostComment
      summary: Post a comment (or reply) on a post
      description: |
        Top-level comment when `parent_id` is omitted; reply when set.
        Depth and root_id are computed server-side from the parent's
        row. Requires `posts.comment` capability (Base default).
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentCreate" }
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /comments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deleteComment
      summary: Soft-delete a comment
      description: |
        Authors can always delete their own (requires
        `comments.delete.own`, Base default). Moderators can delete
        any comment (requires `comments.delete.any`, Admin only).
        Soft-deletes via deleted_at + empties body/body_html; the
        counter trigger decrements posts.comment_count.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/assets:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: addPostAsset
      summary: Attach an existing asset to a post
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostAssetWrite" }
      responses:
        "204":
          description: Member added
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/assets/{asset_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: asset_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: removePostAsset
      summary: Remove an asset from a post
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /collections:
    get:
      operationId: listCollections
      summary: List collections (filterable, paginated)
      description: |
        Returns collections ordered by `created_at DESC, id DESC` so
        the newest entries are first. Filters and cursor pagination
        match the assets list contract — pass back `next_cursor`
        opaquely as `cursor` to retrieve the following page.
      tags: [collections]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: owner_ref
          in: query
          required: false
          description: Filter to collections owned by this RS user_ref.
          schema: { type: integer, format: int64 }
        - name: visibility
          in: query
          required: false
          schema:
            type: string
            enum: [private, shared, public]
        - name: featured
          in: query
          required: false
          schema: { type: boolean }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A page of collections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createCollection
      summary: Create a new collection
      description: |
        Creates a manual-membership collection owned by the caller.
        Query-membership and hybrid modes ship in 1.11.B; for now
        only `membership=manual` is accepted.
      tags: [collections]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionCreate" }
      responses:
        "201":
          description: Collection created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /collections/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getCollection
      summary: Fetch a single collection by id
      tags: [collections]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The collection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCollection
      summary: Partial update of a collection
      description: |
        Only fields present in the body are touched. Pass
        `expires_at: null` to remove the TTL; omit the field to keep
