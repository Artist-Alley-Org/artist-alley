              schema:
                type: array
                items: { $ref: "#/components/schemas/Comment" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createAssetTextAnnotation
      summary: Create a text-range annotation on a doc asset
      description: |
        Persists a highlight / strikethrough / underline / comment /
        note as a top-level `comments` row with
        `annotation_type='text-range'`. `body` carries the user's
        commentary (empty string is fine for a pure highlight).

        Requires `posts.comment` capability — annotations are
        comments at the storage layer, so the same gate applies.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TextAnnotationCreate" }
      responses:
        "201":
          description: Annotation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /text-annotations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateTextAnnotation
      summary: Update a text-range annotation
      description: |
        Mutates `body` (the commentary text) and/or `annotation_data`
        (style / color / range / resolved). The annotation must
        already exist with `annotation_type='text-range'`. Only the
