  /posts:
    get:
      operationId: listPosts
      summary: List posts (paginated feed)
      description: |
        The browse-page feed. Public posts visible to authenticated
        callers; the author's own posts of any visibility are also
        returned. Anonymous access to this feed is not yet
        implemented.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: author_ref
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: liked_by
          in: query
          required: false
          description: |
            Restrict the page to posts this user ref has LIKED (#1106) —
            the profile's Likes tab.

            It is a filter on this feed rather than an endpoint of its
            own because a likes listing is a DERIVED listing: its rows
            are chosen by one user's actions and read by another, so the
            only question that matters is whose read rule decides what
            appears. Here the answer is structural — the caller's own
            read rule is ANDed onto the result exactly as it is for
            every other filter, so a post the caller may not read is
            ABSENT from the page whoever liked it, and the count on the
            page is the count of what they may read.

            NARROWING, never widening. The `likes` table is written by
            third parties, so liking a post can never put it in front of
            somebody the author did not admit.
          schema: { type: integer, format: int64 }
        - name: visibility
          in: query
          required: false
          schema:
            type: string
            enum: [private, org-only, followers, explicit-share]
        - name: q
          in: query
          required: false
          description: |
            Plain-text search over the post's TSVECTOR. A future
            search DSL will replace this with a full query language.
          schema: { type: string, maxLength: 200 }
        - name: tag
          in: query
          required: false
          schema: { type: string }
        - name: team_id
          in: query
          required: false
          description: |
            Scope the feed to one team's posts — the team page (#684).

            NARROWING ONLY, like every other filter on this operation.
            The read rule is ANDed onto the result rather than ORed
            into it, and it never consults `team_id`, so this parameter
            can only remove posts from the page the caller would
            otherwise have received. Membership of the team confers
            nothing here.

            Not a team-existence probe: an unknown team, a soft-deleted
            team and a team with no readable posts are one answer, an
            empty page.
          schema: { type: string, format: uuid }
        - name: feed
          in: query
          required: false
          description: |
            Pre-baked feed selector. When set, applies
            a viewer-anchored filter on top of the other query params.
            - `following` — restrict to what the caller follows
              (browse-page "Following" tab): posts by an author they
              follow, OR posts belonging to a team they follow. One
              filter over both follow graphs, because the page offers
              one control and its rail lists the teams you follow.
              Still NARROWING — the read rule is ANDed on after it and
              consults neither follow table, so following a studio
              reveals nothing of its work you could not already see.
              Returns an empty page for callers who follow nothing.
            - `latest` (default) — no extra filter; same shape as
              omitting the param.
          schema:
            type: string
            enum: [latest, following]
        - name: dir
          in: query
          required: false
          description: |
            Sort direction over the feed's `(posted_at, id)` key.

            - `desc` (default) — newest first.
            - `asc` — oldest first.

            It moves the KEYSET COMPARISON as well as the `ORDER BY`,
            because a cursor is only meaningful relative to the order
            that produced it. A `desc` cursor replayed against an `asc`
            page would ask for "older than X" while the page walks
            forward, which skips rows and then repeats them.

            A cursor therefore belongs to ONE direction. Flipping `dir`
            mid-scroll means starting a new scan: send no `cursor` on
            the first request after the flip. The browse page already
            works this way — its result-set identity key includes the
            direction, so changing it resets the accumulated pages.
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: include_deleted
          in: query
          required: false
          description: |
            Admin-only. When `true`, soft-deleted posts appear
            alongside live rows. Non-admin callers ignored.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: A page of posts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createPost
      summary: Publish a new post
      description: |
        Wraps 1+ existing assets into a Post. The asset bytes are
        already in storage (POST /storage/objects) and the asset
        entities are already created (POST /assets); this endpoint
        ties them together with the descriptive metadata.

        Every asset named in `members` must be one the caller can
        actually read — the same two-plane rule
        `addCollectionResource` applies (#922, #882, ADR 0064). An
        asset the caller cannot read answers `404` with the identical
        body a nonexistent UUID gets, so the endpoint is not a
        UUID-existence probe. Nothing is written when a member is
        refused: the gate runs before the transaction opens.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostCreate" }
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /posts/by-asset/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getPostsByAsset
      summary: Posts that feature an asset (post-by-asset lookup)
      description: |
        The visibility-filtered list of posts whose members include the
        given asset (#478 slice-2, ADR 0070). An asset is a many-to-many
        member of ≥0 posts, so this returns 0..N. Anonymous-visible under
        public mode (ADR 0063), returning only public posts; authenticated
        callers see the walled-garden tier — the SAME gating as the feed,
        no new enforcement plane. The client redirects when exactly one
        post is visible and lists when several.
      tags: [posts]
      security: []
      responses:
        "200":
          description: Visible posts featuring the asset (possibly empty)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostList" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /posts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getPost
      summary: Fetch a post with its members + tags
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePost
      summary: Partial update of a post
      description: |
        Optimistic concurrency: pass the post's last-
        known `updated_at` as `if_unchanged_since`; 409 if the
        row has been edited since.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Edited by someone else after `if_unchanged_since`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditConflict" }
    delete:
      operationId: deletePost
      summary: Soft-delete a post
      description: |
        Removes the post from feed views. Member assets are not
        deleted (an asset may belong to multiple posts; storage pins
        are owned at the asset layer).

        Accepts optional `{reason}` body captured
        into `deleted_reason` for the admin recovery-window audit.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SoftDeleteRequest" }
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/posts/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: restorePost
      summary: Restore a soft-deleted post
      description: |
        Clears `deleted_at` + `deleted_reason` on the post row and
        fires an `admin.post.restored` audit event.

        AUTHORISATION is the same rule as
        `POST /admin/assets/{id}/restore`: you may undo your own
        delete, `system.admin` may undo any, and a NULL
        `deleted_by_user_ref` is restorable by `system.admin` only
        (#931).

        Returns 404 if the post is already live (or doesn't exist);
        403 when the caller did not delete it.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Restored
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/acls:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listPostAcls
      summary: List ACL entries on a post
      description: |
        Returns every ACL row attached to this post. ACL rows are
        additive grants on top of the post's visibility and the
        role / team-scope checks.

        Requires WRITE access to the post — author, `posts.admin` or
        `system.admin` — not merely read access (#876). Who a post is
        shared with, who granted it and when it expires is management
        information about the post, not part of the post's content:
        being able to read something must not disclose the rest of its
        guest list.

        `listCollectionAcls` applies the same rule. It used to diverge
        — it additionally admitted any authenticated caller when the
        collection was `public` — and #933 closed that.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: ACL entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AclEntry" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addPostAcl
      summary: Grant a permission on a post to a principal
      description: |
        Inserts one ACL row. The same principal can hold multiple
        permission levels (e.g. read AND write) — that's two POSTs.
        Requires write access to the post (owner / posts.admin /
        system.admin) so a contributor can't grant access beyond
        their own ability to mutate.

        A `user` grant also emits a `post_shared_with_me` notification
        to the grantee (#875), so a share is not silent. `role` and
        `team` grants name no single recipient and notify nobody.
        Notification delivery is best-effort and runs after the row is
        written: the grant stands whether or not the notification does.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AclCreate" }
      responses:
        "204":
          description: ACL row added
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/acls/{principal_type}/{principal_id}/{permission}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: principal_type
        in: path
        required: true
        schema:
          type: string
          enum: [user, role, team]
      - name: principal_id
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
      - name: permission
        in: path
        required: true
        schema:
          type: string
          enum: [read, write, admin]
    delete:
      operationId: removePostAcl
      summary: Revoke a specific permission row from a principal
      description: |
        Removes the exact (principal_type, principal_id, permission)
        tuple. Other permission levels for the same principal stay
        in place. 404 if the row doesn't exist.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/like:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getPostLike
      summary: Whether the current caller has liked this post
      description: |
        Used by the post modal on open to decide whether the Like
        button shows the active state. Returns {liked: bool}.
        Anonymous callers get 401.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Like state for the caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostLikeState" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: likePost
      summary: Like a post
      description: |
        Idempotent — re-liking a post the caller already liked is a
        no-op (counter doesn't bump twice). Requires `posts.like`
        capability (granted to Base by default).
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Liked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: unlikePost
      summary: Remove the caller's like on a post
      description: |
        404 if the caller hadn't liked the post (the optimistic-update
        client uses this signal to revert its local state). Counter
        is maintained by the 00020 trigger; we never decrement to
        below zero.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Unliked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/comments:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listPostComments
      summary: List the comment thread on a post
      description: |
        Returns LIVE comments (deleted_at IS NULL), grouped by root,
        within each root sorted depth-then-time so replies appear
        under their parent. Threads ordered newest-root-first.
        Cursor pagination advances by root.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A page of comments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createPostComment
      summary: Post a comment (or reply) on a post
      description: |
        Top-level comment when `parent_id` is omitted; reply when set.
        Depth and root_id are computed server-side from the parent's
        row. Requires `posts.comment` capability (Base default).
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentCreate" }
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/whiteboards:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listPostWhiteboards
      summary: List whiteboard sketches on a post
      description: |
        Whiteboards are free-form brush sketches anchored to a post —
        brainstorm sessions, sketch passes, off-asset notes.
        Storage-wise they're top-level `comments` rows with
        `annotation_type='whiteboard'`; the partial index
        `comments_whiteboards_idx` makes this query cheap.

        Replies to a whiteboard are normal comments threaded under it
        and surface via the regular comment thread query, not this
        list.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Whiteboards for the post (newest first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Comment" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createPostWhiteboard
      summary: Save a whiteboard sketch on a post
      description: |
        Persists a brush-sketch as a top-level comment with
        `annotation_type='whiteboard'`. The `content` payload carries
        the strokes (vector source of truth — perfect-freehand input
        points + per-layer arrangement) plus the source canvas
        dimensions so the viewer can re-render proportionally
        regardless of viewport size.

        Requires `posts.comment` capability (Base default) — same
        gate as posting a regular comment, since whiteboards ARE
        comments at the storage layer. Future phases can split the
        capability if finer governance is needed.

        `title` is optional. If omitted the sidebar list shows
        "Untitled sketch" with the author + timestamp.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WhiteboardCreate" }
      responses:
        "201":
          description: Whiteboard saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/lint:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: lintAsset
      summary: Run syntax checks against a doc asset's source
      description: |
        Dispatches to a language-aware syntax checker based on the
        asset's file extension and returns a flat diagnostic list.

        First cut ships three Go-native checkers (JSON / YAML /
        Markdown). For any other extension the response carries
        `skipped: true` so the UI can render "no linter configured
        for this language" instead of "0 issues".

        Future iterations slot in subprocess-based linters
        (`py_compile`, `node --check`, `luac -p`, `shellcheck`, ...)
        behind the same shape; the client doesn't need to know which
        producer generated a diagnostic — it just renders the line /
        col / severity / message.

        Synchronous: every Go-native checker runs in single-digit
        milliseconds on a typical doc.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Lint result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LintResult" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/text-annotations:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listAssetTextAnnotations
      summary: List text-range annotations on a doc asset
      description: |
        Doc-viewer review tools. Each entry is a
        top-level `comments` row with `annotation_type='text-range'`;
        its `annotation_data` carries `{style, color, start_line,
        start_col, end_line, end_col, resolved}`. `body` is the
        user's commentary text (empty for pure highlights).

        Replies on annotations live in the regular comment thread
        and surface via `GET /assets/{id}/comments`, not here.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Annotations on the asset
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Comment" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createAssetTextAnnotation
      summary: Create a text-range annotation on a doc asset
      description: |
        Persists a highlight / strikethrough / underline / comment /
        note as a top-level `comments` row with
        `annotation_type='text-range'`. `body` carries the user's
        commentary (empty string is fine for a pure highlight).

        Requires `posts.comment` capability — annotations are
        comments at the storage layer, so the same gate applies.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TextAnnotationCreate" }
      responses:
        "201":
          description: Annotation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /text-annotations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateTextAnnotation
      summary: Update a text-range annotation
      description: |
        Mutates `body` (the commentary text) and/or `annotation_data`
        (style / color / range / resolved). The annotation must
        already exist with `annotation_type='text-range'`. Only the
        annotation's author or a moderator can update.

        For deletion, use `DELETE /comments/{id}` — annotations are
        comments at the storage layer.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TextAnnotationPatch" }
      responses:
        "200":
          description: Updated annotation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /comments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deleteComment
      summary: Soft-delete a comment
      description: |
        Authors can always delete their own (requires
        `comments.delete.own`, Base default). Moderators can delete
        any comment (requires `comments.delete.any`, Admin only).
        Soft-deletes via deleted_at + empties body/body_html; the
        counter trigger decrements posts.comment_count.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/assets:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: addPostAsset
      summary: Attach an existing asset to a post
      description: |
        Two independent gates apply (#922). Write access to the POST —
        author, `posts.admin` or `system.admin` — answers "may you
        change this container", and read access to the ASSET answers
        "may you reach the thing being put in it". Both are required.

        The asset gate is the same two-plane rule `createPost` and
        `addCollectionResource` apply (ADR 0064). An asset the caller
        cannot read answers `404` with the identical body a nonexistent
        UUID gets.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostAssetWrite" }
      responses:
        "204":
          description: Member added
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/assets/{asset_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: asset_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: removePostAsset
      summary: Remove an asset from a post
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /collections:
    get:
      operationId: listCollections
      summary: List collections (filterable, paginated)
      description: |
        Returns collections ordered by `created_at DESC, id DESC` so
        the newest entries are first. Filters and cursor pagination
        match the assets list contract — pass back `next_cursor`
        opaquely as `cursor` to retrieve the following page.
      tags: [collections]
      # Anonymous-readable (#415). Documentary only — the handler
      # guard enforces access, not this block: /search has served
      # anonymous traffic without it.
      security: []
      parameters:
        - name: owner_ref
          in: query
          required: false
          description: Filter to collections owned by this user_ref.
          schema: { type: integer, format: int64 }
        - name: visibility
          in: query
          required: false
          schema:
            type: string
            enum: [private, org-only, followers, explicit-share]
        - name: featured
          in: query
          required: false
          description: |
            Filters on whether the collection has a placement in
            `featured_items` THIS CALLER CAN SEE (ADR 0065) — `public`
            placements for everyone, plus `org` placements once signed
            in. Not "ORG-scoped": #1104 split the scope, and the filter
            follows the caller rather than pinning one value.

            Featuring is a placement, not a property of the collection,
            so this asks "is it featured to me", not "is its featured
            flag set" — the flag no longer exists.

            IT NEVER WIDENS ACCESS. The placement filter is ANDed onto
            the ordinary collection read predicate, so a collection the
            caller may not read is absent whether it is featured or not.
          schema: { type: boolean }
        - name: tab
          in: query
          required: false
          description: |
            Pre-canned filter for the collections hub:
            - `mine` — collections owned by the caller (any visibility)
            - `featured` — featured to this caller AND readable by them.
              NO TIER PIN (#1121): this tab means "featured collections
              I may see", so it is the placement filter ANDed onto the
              ordinary read predicate and nothing else. It used to also
              pin `visibility=public`, which made it disagree with the
              rail (`GET /featured`) — an admin could feature an
              `org-only` collection, see it on the rail, and never see
              it here. Removing the pin cannot widen access: featuring
              is a placement, not a grant, and the read predicate it is
              ANDed onto is unchanged.
            - `public` — visibility=public (every install-public
              collection). This tab KEEPS its tier pin, because there
              the tier is the tab's contract rather than an extra
              conjunct on top of one.
            - `shared` — collections the caller has ACL access to but doesn't own
            - `all` — every collection the caller is allowed to see (default)
            `tab` is mutually-exclusive with `owner_ref`/`visibility`/`featured`
            — when set it overrides those.
          schema:
            type: string
            enum: [mine, featured, public, shared, all]
        - name: q
          in: query
          required: false
          description: Free-text filter on `name` (case-insensitive substring).
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: include_deleted
          in: query
          required: false
          description: |
            Admin-only. When `true`, soft-deleted collections appear
            alongside live rows. Non-admin callers ignored.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: A page of collections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createCollection
      summary: Create a new collection
      description: |
        Creates a manual-membership collection owned by the caller.
        Query-membership and hybrid modes ship in 1.11.B; for now
        only `membership=manual` is accepted.
      tags: [collections]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionCreate" }
      responses:
        "201":
          description: Collection created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: |
            A required collection-scoped field (see
            `field_definition.subject_kind = 'collection'` +
            `required = true`) is missing from the request body.
            This gate is enforced on CREATE only; subsequent
            UPDATEs don't re-validate.
          content:
            application/json:
              schema:
                type: object
                required: [error, reason]
                properties:
                  error: { type: string }
                  reason:
                    type: string
                    enum: [required_collection_field_missing]
                  field_code: { type: string }
                  field_label: { type: string }
        "500":
          $ref: "#/components/responses/InternalError"

  /collections/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getCollection
      summary: Fetch a single collection by id
      tags: [collections]
      # Anonymous-readable (#415). Documentary only — the handler
      # guard enforces access, not this block: /search has served
      # anonymous traffic without it.
      security: []
      responses:
        "200":
          description: The collection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCollection
      summary: Partial update of a collection
      description: |
        Only fields present in the body are touched; omit a field to
        keep its current value. Send `clear_expires_at: true` to remove
        the TTL — sending `expires_at: null` does NOT, because null is
        already "leave alone" for every property here.

        Optimistic concurrency: pass the collection's
        last-known `updated_at` as `if_unchanged_since`; 409 if
        the row has been edited since.
      tags: [collections]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Edited by someone else after `if_unchanged_since`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditConflict" }
    delete:
      operationId: deleteCollection
      summary: Soft-delete a collection
      description: |
        Soft-delete. Sets `deleted_at = NOW()` +
        `deleted_reason` from the optional body; the row remains for
        the operator recovery window (default 30 days per
        `sysconfig.soft_delete.collection_retention_days`) before the
        nightly gc coordinator hard-deletes it. Cascades to
        `collection_resources` fire on the eventual hard delete.

        Prior behaviour was HARD delete; the flip is unconditional
        (no grace flag) per pre-release practices.
      tags: [collections]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SoftDeleteRequest" }
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/collections/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: restoreCollection
      summary: Restore a soft-deleted collection
      description: |
        Clears `deleted_at` + `deleted_reason` on the collection row
        and fires an `admin.collection.restored` audit event.

        AUTHORISATION is the same rule as
        `POST /admin/assets/{id}/restore`: you may undo your own
        delete, `system.admin` may undo any, and a NULL
        `deleted_by_user_ref` is restorable by `system.admin` only
        (#931).

        Returns 404 if already live (or doesn't exist); 403 when the
        caller did not delete it.
      tags: [collections]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Restored
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /collections/{id}/resources:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listCollectionResources
      summary: List the assets pinned in a collection
      description: |
        Returns assets currently pinned in this collection (excludes
        rows where the per-membership `expires_at` has passed), in
        `sort_order ASC, added_at ASC` order so the list matches the
        admin-arranged sequence. Joined onto assets for thumb/title
        without an N+1.
      tags: [collections]
      # Anonymous-readable (#438). Documentary only — the handler
      # guard enforces access, not this block.
      security: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A page of resources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionResourceList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addCollectionResource
      summary: Add (or re-pin) an asset in a collection
      description: |
        Idempotent on `(collection_id, asset_id)`. Re-adding an
        existing membership updates `sort_order`, `pinned`, and
        `expires_at` but keeps `added_at` fixed.

        You may only collect what you can actually see. The asset must
        be readable by the caller on both planes — it must exist and
        not be soft-deleted, AND the caller must be entitled to its
        content under the sensitivity tier (ADR 0064). An asset the
        caller cannot read is reported exactly as one that does not
        exist: `404` with `asset not found`, so this endpoint cannot
        be used to probe whether a UUID exists.
      tags: [collections]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionResourceWrite" }
      responses:
        "204":
          description: Resource added
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /collections/{id}/resources/{asset_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: asset_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: removeCollectionResource
      summary: Remove an asset from a collection
      tags: [collections]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Removed (or was already absent)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /collections/{id}/posts:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listCollectionPosts
      summary: List the posts pinned in a collection
      description: |
        Returns posts currently pinned in this collection (excludes
        rows where the per-membership `expires_at` has passed), in
        `sort_order ASC, added_at ASC` order so the list matches the
        curator's arranged sequence.

        TWO gates apply and both are required. The PARENT collection
        must be visible to the caller, and each POST is filtered by the
        one post read rule — the same expression `GET /posts` and
        `GET /posts/{id}` use. A collection may contain posts its
        curator can read and you cannot (that is what #882 makes
        possible), so membership never widens a post: a post you may
        not read is simply not in this list.

        That is deliberately NOT the placeholder shape
        `GET /collections/{id}/resources` uses for assets. An asset
        placeholder exists so the reader can see that a restriction is
        there and ask for access (#881/#883); a post carries its
        author's title and description in the row itself, and the post
        surface has no request-access flow to attach to. Absence is the
        honest answer here.
      tags: [collections]
      # Anonymous-readable, same as the resources listing (#438).
      # Documentary only — the handler guard enforces access.
      security: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: A page of posts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostList" }
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addCollectionPost
      summary: Add (or re-pin) an existing post in a collection
      description: |
        Adds a REFERENCE, never a copy (#882). The post keeps its
        author, its visibility and its lifecycle; the collection holds
        a pointer. If the author deletes the post it disappears from
        every collection that referenced it
        (`collection_posts_post_id_fkey … ON DELETE CASCADE`), which is
        the point: "the owner can still delete it from everywhere".

        Idempotent on `(collection_id, post_id)`. Re-adding an existing
        membership updates `sort_order`, `pinned` and `expires_at` but
        keeps `added_at` fixed.

        You may only collect what you can actually read. The post must
        pass the same read rule `GET /posts/{id}` applies — so anyone
        can pin an org-only post, only a follower can pin a
        followers-tier one, and a stranger's private post cannot be
        pinned at all. A post the caller may not read is reported
        exactly as one that does not exist: `404` with `post not
        found`, so this endpoint cannot be used to probe whether a UUID
        exists.

        The collection must be one the caller may mutate. An absent
        collection, a soft-deleted one and someone else's are all
        `404` here — unlike the asset route, which grandfathers a
        distinguishable `403`.
      tags: [collections]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionPostWrite" }
      responses:
        "204":
          description: Post added
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /collections/{id}/posts/{post_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: post_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: removeCollectionPost
      summary: Remove a post from a collection
      description: |
        Un-pins the reference. It does NOT delete the post, and it does
        not touch any other collection that references the same post —
        removing from your collection is yours alone (#882).

        Not gated on readability, deliberately, for the same reason the
        asset route is not: a post whose visibility was narrowed after
        it was pinned would otherwise be permanently stranded in a
        collection its curator can no longer remove it from.
      tags: [collections]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Removed (or was already absent)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /collections/{id}/acls:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listCollectionAcls
      summary: List ACL entries on a collection
      description: |
        Returns every ACL row attached to this collection. ACLs are
        additive grants on top of the collection's visibility +
        collection_grant rows.

        Requires WRITE access to the collection — owner,
        `collections.admin` or `system.admin` — not merely read access
        (#933). Who else was granted what, by whom, and until when is
        management information about the collection rather than part of
        its content, so the grant disjunct that the row-visibility
        predicate carries is deliberately dropped here (#661).

        A `public` collection is no exception, and that is the #933
        change. `visibility: public` says the collection's CONTENTS are
        public; it says nothing about who the owner individually shared
        it with. Admitting every authenticated caller to the grant list
        disclosed each grantee's principal and permission level to
        anyone with an account and no connection to the collection.

        This is now the same rule `listPostAcls` applies (#876). The
        two surfaces no longer diverge.
      tags: [collections]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: ACL entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AclEntry" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addCollectionAcl
      summary: Grant a permission on a collection to a principal
      description: |
        Inserts one ACL row. Requires write access to the collection
        (owner / collections.admin / system.admin).
      tags: [collections]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AclCreate" }
      responses:
        "204":
          description: ACL row added
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /collections/{id}/acls/{principal_type}/{principal_id}/{permission}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: principal_type
        in: path
        required: true
        schema:
          type: string
          enum: [user, role, team]
      - name: principal_id
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
      - name: permission
        in: path
        required: true
        schema:
          type: string
          enum: [read, write, admin]
    delete:
      operationId: removeCollectionAcl
      summary: Revoke a specific permission row from a principal
      tags: [collections]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /asset_types:
    get:
      operationId: listAssetTypes
      summary: List all asset types
      description: |
        Returns every asset type configured in the system, ordered by
        display order (`order_by`) then by primary key. Anonymous
        callers see every unrestricted type; authenticated callers
        additionally see restricted types they hold a `read` (or
        higher) ACL row on. Admins (system.admin) see everything.
      tags: [asset_types]
      security:
        - cookieAuth: []
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: List of asset types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetType"
        "500":
          $ref: "#/components/responses/InternalError"

  /asset_types/{ref}/acls:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: listAssetTypeAcls
      summary: List ACL rows attached to an asset_type (admin)
      description: |
        Returns every ACL row attached to this asset_type (Phase
        1.17.F-bis). When the response is empty the type is
        unrestricted — every caller can access it. When at least one
        row is present the type is restricted to its grantees + admins.
      tags: [asset_types]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["system.asset_types.admin"]
      responses:
        "200":
          description: ACL entries (possibly empty).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AclEntry" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addAssetTypeAcl
      summary: Grant a permission on an asset_type to a principal
      description: |
        Inserts one ACL row. Re-granting the same tuple refreshes
        granted_at / granted_by / expires_at — idempotent. The first
        row inserted flips the type from "open" to "restricted" for
        non-admin callers.
      tags: [asset_types]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["system.asset_types.admin"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AclCreate" }
      responses:
        "204":
          description: ACL row added.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /asset_types/{ref}/acls/{principal_type}/{principal_id}/{permission}:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: principal_type
        in: path
        required: true
        schema:
          type: string
          enum: [user, role, team]
      - name: principal_id
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
      - name: permission
        in: path
        required: true
        schema:
          type: string
          enum: [read, write, admin]
    delete:
      operationId: removeAssetTypeAcl
      summary: Revoke a specific permission row from a principal
      description: |
        Removes the exact (principal_type, principal_id, permission)
        tuple. Other permission levels for the same principal stay
        intact. Removing the last row on a type flips it back to
        "open" for every caller. 404 if the row doesn't exist.
      tags: [asset_types]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["system.asset_types.admin"]
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams:
    get:
      operationId: listTeams
      summary: List teams (paginated; optional ancestor filter)
      description: |
        Returns every team the caller can see, ordered by name. When
        `ancestor` is supplied, returns only that team and every team
        in its closure (descendants), which lets the upload modal
        scope a picker to "teams under Aurora R&D" without N+1.
        Requires `teams.read`.
      tags: [teams]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: ancestor
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A page of teams
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createTeam
      summary: Create a team
      description: |
        Requires `teams.create`. The optional `parent_ids` array
        attaches the new team as a child of each listed parent (the
        DAG case — a team can report to multiple parents). Cycle
        rejection is enforced by the team_parents trigger.
      tags: [teams]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamCreate" }
      responses:
        "201":
          description: Team created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /teams/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getTeam
      summary: Fetch a team with its direct parents
      tags: [teams]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The team
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateTeam
      summary: Rename or re-describe a team
      description: |
        Patches `name` and/or `description`. Re-parenting goes through
        the dedicated /teams/{id}/parents endpoints to keep the
        closure-maintenance triggers' contract clear.
      tags: [teams]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteTeam
      summary: Soft-delete a team
      description: |
        Marks the team `deleted_at`; preserves closure rows for
        historic audit. Cascading sweeps fire (ACL rows referencing
        the team go via the 00017 trigger; user_roles rows go via
        the FK CASCADE) only when the row is hard-deleted via admin
        action, not via soft delete.
      tags: [teams]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/hero:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: setTeamHero
      summary: Choose or clear the team's hero picture
      description: |
        Points the team at an ordinary asset to use as its picture
        (#982), or clears the pointer so the team falls back to its
        initials tile.

        # Why this is not part of `updateTeam`

        The gate is different. Renaming a team is a global `teams.admin`
        act; choosing its picture is one a team's OWN admin should be
        able to do, so this endpoint accepts `teams.admin` scoped to
        this team. Folding it into the PATCH would mean one operation
        answering to two different authorisation rules depending on
        which field the body happened to carry, which is how a gate ends
        up being widened by accident.

        # What the server will accept

        The asset must be `sensitivity: public` AND carry this team's
        `team_id`. Both halves are required: `public` alone would let a
        team pin any public asset in the install onto itself, and
        ownership alone would paint a `team`- or `restricted`-
        sensitivity picture into a strip anonymous readers can see.

        An asset that fails either half is refused with the same 400
        given for an id that does not exist — telling the two apart
        would make this an existence oracle for assets the caller
        cannot see.

        A just-uploaded asset is accepted before its `col` rendition
        exists; the team simply keeps painting initials until the
        rendition lands. Refusing it would be an error the admin cannot
        act on.

        Passing the check is not a promise the picture keeps rendering.
        The read path re-checks the same rule on every read, so an asset
        later set to `restricted` drops out of the payload and the team
        reverts to initials.
      tags: [teams]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamHeroUpdate" }
      responses:
        "200":
          description: The team, carrying its new hero (or none)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/parents:
