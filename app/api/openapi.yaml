        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Current appearance config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppearanceConfig" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: updateAppearanceConfig
      summary: Update the per-install appearance configuration
      description: |
        Persists the brand / display / body / mono font slot IDs.
        Empty string in any field means "use the slot default".
        Requires the `system.appearance.write` capability (auto-granted
        to admins).
      tags: [system]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppearanceConfig" }
      responses:
        "200":
          description: Updated appearance config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppearanceConfig" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/system/appearance/logo:
    post:
      operationId: uploadInstanceLogo
      summary: Upload the instance logo
      description: |
        Replaces the operator-set instance logo with the uploaded
        image and returns the updated appearance config.

        The body is the raw image. Unlike `/storage/objects`, this
        endpoint ignores any client-declared content type and derives
        the stored one by decoding the bytes: the logo is served back
        on a public, unauthenticated path, so the type it is served
        with must never be attacker-chosen.

        Accepts **raster images only** — PNG, JPEG, GIF or WebP — at
        most 2 MiB and between 16 and 1024 pixels on each edge. SVG is
        rejected: it is an executable document format, and safely
        accepting one needs a sanitiser this endpoint does not have.

        The bytes go into content-addressed storage under the
        `appearance:logo` pin; the appearance config records only the
        resulting hash. Uploading the same image twice dedups to one
        object.

        The upload becomes the active logo and is pushed onto the front
        of the recent-logo list (`logo_history`, most-recently-used
        first, capped at 5). If that pushes a sixth entry off the end,
        the evicted logo's storage pin is released and its bytes become
        eligible for the normal garbage-collection lifecycle.

        Requires the `system.appearance.write` capability.
      tags: [system]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Logo stored; updated appearance config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppearanceConfig" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: deleteInstanceLogo
      summary: Revert to the shipped default logo
      description: |
        Deselects the operator's logo so the install shows the shipped
        default mark again. Idempotent — doing this on an install that
        is already on the default succeeds.

        This does **not** delete anything. The previously active logo
        stays in `logo_history` and stays pinned, so the operator can
        select it again; that recoverability is the whole point of the
        list. Bytes are only released when an entry is evicted from the
        tail of the history by later uploads.

        Requires the `system.appearance.write` capability.
      tags: [system]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Reverted to the default; updated appearance config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppearanceConfig" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/system/appearance/logo/select:
    post:
      operationId: selectInstanceLogo
      summary: Re-activate a logo from the recent list
      description: |
        Makes an already-uploaded logo the active one again and moves
        it to the front of `logo_history`. This is the recovery path:
        an operator who changed their mind, or who lost the original
        file, can pick a previous mark back up without re-uploading it.

        The hash **must already be in `logo_history`**. Selecting an
        arbitrary hash is refused, and that refusal is deliberate: the
        logo is served on a public unauthenticated route, so if this
        endpoint accepted any hash an admin could aim it at any object
        on the install — someone else's private asset included.
        Membership in the list is proof the server itself decoded and
        approved those exact bytes.

        Moving an entry to the front reorders the list but does not
        change its membership, so nothing is evicted and no storage pin
        changes. To go back to the shipped default, use `DELETE` on
        `/admin/system/appearance/logo` instead.

        Requires the `system.appearance.write` capability.
      tags: [system]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hash]
              properties:
                hash:
                  type: string
                  pattern: "^[0-9a-f]{64}$"
                  description: |
                    Content hash of an entry currently in
                    `logo_history`.
      responses:
        "200":
          description: Logo re-activated; updated appearance config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppearanceConfig" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/system/public-mode:
    get:
      operationId: getPublicMode
      summary: Read whether the install serves anonymous visitors
      description: |
        Reports whether public mode is enabled. When disabled (the
        default, and the state of every install that has never set it),
        anonymous callers are refused the public read surface: assets,
        collections, search and IIIF. Authenticated access is unaffected
        in either state, and row-level visibility and content
        sensitivity rules still apply on top when it is enabled.
      tags: [system]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Current public-mode state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicModeConfig" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: updatePublicMode
      summary: Enable or disable anonymous access to the public surface
      description: |
        Turns anonymous access to the public read surface on or off.
        Requires the `system.config.write` capability. The change takes
        effect on the next request without a restart, and is recorded
        as an `admin.system.public_mode_updated` audit event.
      tags: [system]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicModeConfig" }
      responses:
        "200":
          description: Updated public-mode state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicModeConfig" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/system/browse-views:
    get:
      operationId: getBrowseViews
      summary: Read which browse layouts this install offers
      description: |
        The browse layouts (`grid`, `masonry`, `thumbnail`, `list`,
        `feed`) enabled for every user on this install, in the
        switcher's canonical order.

        An install that has never configured this reads back all five —
        the shipped default is the ABSENCE of a stored value, not a
        seeded row, so an install upgraded into this feature keeps
        exactly the behaviour it already had.

        This is the admin read. The public counterpart every client
        actually renders from is `GET /browse-views`.
      tags: [system]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The enabled layouts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowseViewsConfig" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: updateBrowseViews
      summary: Choose which browse layouts this install offers
      description: |
        Replaces the enabled set. Requires the `system.config.write`
        capability. The change takes effect on the next request without
        a restart, and is recorded as an
        `admin.system.browse_views_updated` audit event.

        AT LEAST ONE LAYOUT MUST STAY ENABLED. An empty array is
        refused with a 400 and nothing is persisted — the same shape as
        the last-admin invariant, and for the same reason: an install
        with no enabled layout has an unreachable browse page and no
        recovery path short of a database shell. Unknown layout names
        are refused too, rather than filtered out, so a typo cannot
        quietly save a smaller set than the operator chose.

        Disabling a layout somebody is already using is safe. Every
        rung that can name a mode — this device's stored choice, the
        account default, the coarse-pointer default — is filtered
        through the enabled set at resolve time, so those users land on
        an enabled layout instead of an empty page.
      tags: [system]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrowseViewsConfig" }
      responses:
        "200":
          description: The updated enabled layouts, in canonical order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowseViewsConfig" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/system/mature-content:
    get:
      operationId: getMatureContentConfig
      summary: Read whether this install allows mature content
      description: |
        The operator's install-wide mature-content switch (#1116, epic
        #1114, ADR 0090 §2).

        An install that has never configured this reads back
        `allowed: true`, and that default is deliberate: an install
        upgraded into this feature has consented to nothing, and the
        only safe reading of "no row" is the behaviour it already had —
        which is one with no mature machinery at all, i.e. one where
        nothing is filtered. The reading that *seems* safer (absent
        means disallowed) is the one that breaks an upgrade, by making
        every existing install refuse mature publication on the day it
        upgraded, for a flag none of their assets carry.

        Note what allowing does NOT do: it shows nothing to anybody on
        its own. A viewer still has to be signed in AND opted in, and
        the opt-in defaults OFF. This switch is permissive about the
        OPERATOR's intent, never about a reader's.

        There is no public counterpart to this endpoint. Every consumer
        of the answer — the upload self-label, the operator override,
        the account opt-in — is behind authentication, so the value
        rides the session response as `CurrentUser.mature_content_allowed`
        instead of being published to anonymous callers.
      tags: [system]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The install's mature-content switch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatureContentConfig" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: updateMatureContentConfig
      summary: Allow or disallow mature content on this install
      description: |
        Sets the switch. Requires the `system.config.write` capability
        and is recorded as an `admin.system.mature_content_updated`
        audit event.

        ⚠️ SWITCHING IT OFF CLEARS NOTHING. Flags already set survive,
        so switching it back on restores the library exactly. The switch
        governs ENFORCEMENT and PUBLICATION, never storage — turning it
        off would otherwise be a destructive operation disguised as a
        display preference, and an operator who flipped it to see what
        happened could not undo it.

        With it off:

          * nobody qualifies for mature content except an asset's OWNER
            and a `system.admin` (ADR 0090 §2 — an artist must not lose
            access to their own work because an operator flipped a
            display switch, and an admin has to be able to moderate what
            the switch hid);
          * setting a `mature` flag on an asset is REFUSED with a 400
            rather than accepted-and-ignored. Clearing one is still
            accepted, so an operator who has just switched the feature
            off can unmark what was marked while it was on.

        The change takes effect on the next request without a restart:
        the read is deliberately uncached, because a stale `true` would
        keep serving mature content on an install whose operator has
        just switched it off.
      tags: [system]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatureContentConfig" }
      responses:
        "200":
          description: The updated switch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatureContentConfig" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /site-text:
    get:
      operationId: getSiteText
      summary: Operator overrides of shipped UI strings
      description: |
        Every override the operator has written, as `language → i18n key
        → replacement string` (#794, ADR 0081 §1). The frontend fetches
        this once at boot and resolves each override over its bundled
        catalogue at render time.

        ANONYMOUS-READABLE, deliberately. This is the wording of the UI
        itself — the navbar a logged-out visitor reads is the same
        navbar everyone else reads, and gating it would mean the
        operator's copy only appeared after sign-in. There is nothing
        here a caller could not already read off the rendered page.

        Every language is returned in one response rather than behind a
        `?language=` filter: the map is small (operators override a
        handful of strings), it is cached as a single entry, and the
        client switches locale at runtime — a filtered read would force
        a refetch on every locale change.

        Values are PLAIN TEXT. They flow through the client's `{var}`
        interpolation and are never rendered as HTML (ADR 0085 keeps
        rich text the only HTML surface).
      tags: [i18n]
      security: []
      responses:
        "200":
          description: The override map. Empty object when nothing is overridden.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteTextOverrides" }

  /site-text/{key}:
    put:
      operationId: setSiteText
      summary: Override one shipped string for one language
      description: |
        Upserts the override for `(key, language)`.

        THE KEY MUST EXIST IN THE SHIPPED CATALOGUE. A key the frontend
        never renders is refused with 422 naming the key, rather than
        stored to no effect — ADR 0081 §1's fail-loud rule. The check is
        enforced here, not only in the admin UI, because a caller
        holding `system.config.write` can reach this endpoint directly.

        Requires `system.config.write`: rewriting the site's wording is
        the same kind of act as renaming the site (#718).
      tags: [i18n]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          description: The dotted i18n key, e.g. `nav.collections`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteTextWrite" }
      responses:
        "200":
          description: The stored override
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteTextEntry" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deleteSiteText
      summary: Revert one string to what ships
      description: |
        Removes the override for `(key, language)`; the shipped string
        renders again on the next read. 404 when nothing was overridden
        — reverting a string that was never changed is a mistake worth
        reporting rather than a silent success.
      tags: [i18n]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          description: The dotted i18n key, e.g. `nav.collections`.
          schema: { type: string }
        - name: language
          in: query
          required: true
          description: Locale code the override was written for.
          schema: { type: string }
      responses:
        "204":
          description: Override removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /email-templates:
    get:
      operationId: getEmailTemplates
      summary: Operator-authored email templates
      description: |
        Every email the instance can send, each with its shipped body,
        any operator override, and the finite set of fields available to
        a template for that event (#795, ADR 0081 §2 as amended).

        Requires `system.config.read`. Unlike site text this is NOT
        anonymous: the shipped mail bodies are an operator concern, not
        UI wording a logged-out visitor already sees.
      tags: [i18n]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The template catalogue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailTemplateCatalogue" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /email-templates/{template}/{part}:
    put:
      operationId: setEmailTemplate
      summary: Override one face of one email template
      description: |
        Upserts the override for `(template, part)`. `part` is one of
        subject, text, or html.

        THE BODY MUST PARSE AND MUST REFERENCE ONLY THE EVENT'S
        DOCUMENTED FIELDS. It is executed against a sample context with
        `missingkey=error` at save time, so a reference to a field
        outside the view-model is refused with 422 naming the field
        rather than rendering to nothing at send time — ADR 0081 §2's
        fail-loud rule. The check is enforced here, not only in the admin
        UI, because a caller holding `system.config.write` can reach this
        endpoint directly.

        Requires `system.config.write`.
      tags: [i18n]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: template
          in: path
          required: true
          description: The template name, e.g. admin_test.
          schema: { type: string }
        - name: part
          in: path
          required: true
          description: subject, text, or html.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailTemplateWrite" }
      responses:
        "200":
          description: The stored override.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailTemplateOverride" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deleteEmailTemplate
      summary: Revert one face of one email template to what ships
      description: |
        Removes the override for `(template, part)`; the shipped body
        renders again on the next send. 404 when nothing was overridden.

        Requires `system.config.write`.
      tags: [i18n]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: template
          in: path
          required: true
          schema: { type: string }
        - name: part
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Override removed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /featured:
    get:
      operationId: getPublicFeaturedRail
      summary: The public featured rail
      description: |
        Admin-curated placements at `scope = 'public'` (ADR 0065),
        in display order.

        FEATURING NEVER WIDENS ACCESS. A placement renders only if the
        caller can already see its subject under the visibility rules
        that govern every other read; a placement pointing at content
        the caller may not see returns nothing at all, rather than an
        entry with a blank title. Per-asset sensitivity still applies:
        a non-public asset carries no thumbnail hint.

        Anonymous-readable, and gated by the install's public-mode
        setting like the rest of the public surface.
      tags: [featured]
      security: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        "200":
          description: Featured placements the caller may see, in order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/FeaturedItem" }

  /featured/promo:
    get:
      operationId: getPromoBand
      summary: The operator promo band for the browse feed (GitHub #1118)
      description: |
        The full-width strip the browse feed renders BETWEEN pages, or
        nothing.

        THE COLLAPSE IS DECIDED HERE, NOT BY THE CLIENT. The response is
        `{}` — no `band` key at all — when the install has no band, when
        the band is disabled, when it has no headline, or when every one
        of its cards filtered away for this caller. Answering with an
        empty band and letting the page decide would put the rule in
        every client that ever renders one; answering with nothing puts
        it beside the filter that produced the emptiness. See
        `PromoBand` for why collapse (ADR 0030) rather than substitution
        (ADR 0079 §2, which is scoped to in-grid sized slots).

        FEATURING NEVER WIDENS ACCESS, and the band is not an exception.
        Every card resolves through the same query the featured rail
        uses: the caller's ADR 0063 predicate is spliced into the JOIN
        that resolves each subject, per-asset sensitivity still
        suppresses the thumbnail hints (ADR 0020), and the ADR 0090
        mature conjunct drops a mature item for a reader who has not
        opted in. A card pointing at content the caller may not see
        produces no row, not a blank tile.

        Anonymous-readable, and gated by the install's public-mode
        setting exactly like `GET /featured` — the `/featured` prefix is
        one entry in `auth.PublicSurfaceRoutes`, so both move together.
        Whether an anonymous visitor sees a band at all is then the
        BAND's own `scope`: `public` shows to everyone, `org` to
        signed-in readers only.
      tags: [featured]
      security: []
      responses:
        "200":
          description: |
            The band this caller may see, or an empty object when there
            is nothing to render.
          content:
            application/json:
              schema:
                type: object
                properties:
                  band: { $ref: "#/components/schemas/PromoBand" }

  /featured/teams:
    get:
      operationId: listFeaturedTeams
      summary: Operator-curated teams for the teams rail (GitHub #1084)
      description: |
        The `featured_items` placements with `subject_kind = 'team'` at
        `scope = 'org'`, in curation order — the slot that runs first in
        the teams rail.

        `org` rather than `public` is deliberate and it is what the write
        endpoint already produces: `POST /admin/featured` writes
        `scope = 'org'`, and ADR 0065 defines `org` as the internal,
        signed-in audience — which is exactly this rail's audience, since
        it renders only for a signed-in reader holding `teams.read`. A
        `public` placement is a separate audience with a separate surface
        (`GET /featured`) and is not read here.

        **A placement is not a grant.** Featuring a team makes nothing
        visible that was not already: the join drops any team that is not
        live, the endpoint holds the same `teams.read` gate as the rest
        of the teams rail, and each team's picture goes through the
        render-time hero re-check (#982) rather than the stored pointer,
        so a hero whose asset stopped being public falls back to initials
        here exactly as it does everywhere else.

        Sits under `/featured` rather than `/teams/featured` so the path
        cannot be confused with `/teams/{id}` by a router or a reader.
      tags: [featured, teams]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Featured teams the caller may see, in curation order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Team" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /appearance:
    get:
      operationId: getPublicAppearance
      summary: Read the appearance configuration for the frontend boot path
      description: |
        Unauthenticated read of the brand / display / body / mono font
        slot IDs. The frontend calls this at boot to know which fonts
        to load before the user has signed in. Returns the same shape
        as the admin endpoint — there are no admin-only fields in
        AppearanceConfig.
      tags: [system]
      security: []
      responses:
        "200":
          description: Current appearance config (public)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppearanceConfig" }

  /appearance/logo:
    get:
      operationId: getPublicInstanceLogo
      summary: Fetch the operator-uploaded instance logo
      description: |
        Streams the operator-set logo image, or **404** when none is
        set — a 404 here is the normal, expected state of a default
        install and means "render the shipped default mark", not an
        error.

        Unauthenticated for the same reason `/appearance` is: the logo
        is chrome on the sign-in page, so an install that refused it
        anonymously could not draw its own login card. Nothing is
        disclosed by serving it — an operator who uploads an instance
        logo is by definition publishing their branding.

        `Content-Type` is the type derived when the image was decoded
        at upload, never a client-supplied string. The response also
        carries `X-Content-Type-Options: nosniff` and a lockdown
        `Content-Security-Policy`, so a file that somehow got past
        validation still cannot be rendered as an active document.

        Callers should request the URL published as `logo_url` on
        `/appearance`, which carries the content hash as `v`. Responses
        are immutable for a given `v`, so the URL changing IS the cache
        invalidation.
      tags: [system]
      security: []
      parameters:
        - name: v
          in: query
          required: false
          description: |
            Content hash of the logo to serve. Omit to get whichever
            logo is currently active.

            This doubles as the cache-buster and as the addressing
            scheme for the admin picker, which renders a thumbnail per
            entry in `logo_history`. The hash is resolved **only**
            against that list — an unlisted hash is a 404, so this
            cannot be used to read arbitrary objects out of storage.
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
      responses:
        "200":
          description: The logo image
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  /previews:
    get:
      operationId: getPublicPreviewLadder
      summary: Read the configured preview variant ladder
      description: |
        The rungs the operator has configured — the key, fit and
        longest-edge of every preview variant this install generates.

        This is the companion to `ladder_available` (#591). That flag
        says a given asset HAS the whole ladder; this says what the
        ladder IS. A client needs both to build a responsive `srcset`:
        the keys become `/assets/{id}/variants/{key}` URLs and `max_dim`
        becomes the `Nw` width descriptor. Without this endpoint a client
        would have to hardcode the four default keys, which is exactly
        the assumption the flag exists to remove — an install that tuned
        its ladder would serve 404s.

        GOVERNED BY PUBLIC MODE (#445), like `/assets` and
        `/collections`: anonymous on a public install, **401 on a private
        one**. It is NOT open to anonymous callers unconditionally, and
        it is deliberately NOT excused the way `/appearance` is. The
        difference is what each endpoint is for — fonts render the login
        card, so an install that refused them anonymously could not draw
        its own sign-in page, whereas nothing before sign-in needs image
        rungs. The first consumer is the browse grid, which on a private
        install is already behind auth. So this endpoint follows the
        content it describes rather than being treated as boot-critical
        when it is not.

        The registration and the full reasoning live in
        `auth.PublicSurfaceRoutes` — that table, not this description, is
        what the gate actually reads.

        What it exposes on a PUBLIC install is the install's own
        image-pipeline configuration: no asset, no user, no access
        decision.
      tags: [system]
      # Governed by public mode, exactly like listAssets / listCollections
      # above. Documentary only — auth.PublicSurfaceRoutes enforces the
      # gate, not this block, and on a private install this endpoint
      # returns 401. Do not read `security: []` here as "ungated".
      security: []
      responses:
        "200":
          description: The configured ladder, in the operator's order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreviewLadder" }

  /browse-views:
    get:
      operationId: getPublicBrowseViews
      summary: Read the browse layouts this install offers
      description: |
        The layouts the operator has enabled, in the switcher's
        canonical order. The frontend fetches this once at boot and
        renders only these buttons — and, more importantly, filters
        every rung that can name a layout through this set: the
        device's stored choice, the signed-in account's default, and
        the coarse-pointer default. A user whose browser still
        remembers a layout the operator has since disabled therefore
        lands on one that is offered rather than on an empty page.

        Read separately from the admin `GET /admin/system/browse-views`
        rather than folded into it because the caller is every visitor,
        not the operator: this one carries no capability check and is
        cached as a single install-wide entry.

        An install that has never configured this returns all five. The
        set is never empty — the write endpoint refuses that, and this
        endpoint falls back to all five if it somehow reads one anyway,
        because an empty answer here would mean a browse page with no
        way to look at anything.

        GOVERNED BY PUBLIC MODE (#445), like `/previews`: anonymous on a
        public install, **401 on a private one**. It is deliberately NOT
        excused the way `/appearance` and `/site-text` are — those two
        render the login card, so an install that refused them
        anonymously could not draw its own sign-in page, whereas the
        first consumer of this is the browse switcher, which on a
        private install is already behind auth. A logged-out visitor
        browses only where anonymous browse exists, and that is exactly
        where this answers. The registration and the full reasoning live
        in `auth.PublicSurfaceRoutes` — that table, not this
        description, is what the gate actually reads.

        What it exposes on a public install is which layout buttons the
        install draws: no asset, no user, no access decision, and
        nothing a caller could not read off the rendered switcher.
      tags: [system]
      # Governed by public mode, exactly like /previews above.
      # Documentary only — auth.PublicSurfaceRoutes enforces the gate,
      # not this block. Do not read `security: []` here as "ungated".
      security: []
      responses:
        "200":
          description: The enabled layouts, in canonical order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowseViewsConfig" }

  /brush-packs:
    get:
      operationId: listBrushPacks
      summary: List the caller's imported brush packs
      description: |
        Returns every brush pack owned by the authenticated user,
        most-recent first. Each pack carries its stamp manifest
        (id, dimensions, dynamics) — the actual stamp bitmaps are
        fetched on demand via `/brush-packs/stamps/{stampId}`.
        Built-in stamps shipped with the frontend are NOT listed
        here; the frontend registers those locally.
      tags: [brushpacks]
      responses:
        "200":
          description: Brush pack list
          content:
            application/json:
              schema:
                type: object
                required: [packs]
                properties:
                  packs:
                    type: array
                    items: { $ref: "#/components/schemas/BrushPack" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: importBrushPack
      summary: Import a Photoshop .abr brush pack
      description: |
        Accepts a binary `.abr` upload, parses it, writes every
        decoded brush stamp to object storage, and registers the
        pack under the caller's ownership. Returns the freshly
        created pack manifest so the frontend can immediately add
        the stamps to its brush picker.
      tags: [brushpacks]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                name:
                  type: string
                  description: Display name; defaults to the filename when omitted.
                file:
                  type: string
                  format: binary
                  description: The .abr pack bytes.
      responses:
        "201":
          description: Pack imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrushPack" }
        "400":
          description: Malformed file or unsupported ABR version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /brush-packs/{packId}:
    parameters:
      - name: packId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getBrushPack
      summary: Get a brush pack + stamp manifest
      tags: [brushpacks]
      responses:
        "200":
          description: Pack manifest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrushPack" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteBrushPack
      summary: Delete a brush pack
      description: |
        Drops the pack + stamp manifest rows. The stamp bitmaps in
        object storage are NOT immediately deleted — content-
        addressed storage means the same bitmap may be referenced
        by other packs. A future GC pass cleans orphans.
      tags: [brushpacks]
      responses:
        "204":
          description: Pack deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /brush-packs/stamps/{stampId}:
    parameters:
      - name: stampId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getBrushPackStamp
      summary: Stream a brush stamp bitmap
      description: |
        Returns the raw PNG bytes of one stamp. The frontend renderer
        fetches this URL on first use of the stamp + caches the
        decoded Image element in memory. Owner-scoped — stamps in
        another user's pack 404 (no existence-leak).
      tags: [brushpacks]
      responses:
        "200":
          description: Stamp PNG bytes
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/metadata-extraction/failures:
    get:
      operationId: listMetadataExtractionFailures
      summary: List pending metadata-extraction failures
      description: |
        Returns paginated pending (not-yet-dismissed) rows from
        extraction_failure. Filterable by error_kind + format.
        Gated on `system.admin`.

        Pending count for the admin nav badge is returned alongside
        the page so the UI can render the badge from one round-trip.
      tags: [admin, metadata]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: error_kind
          in: query
          required: false
          description: |
            Filter by failure kind (unsupported_format / malformed_file /
            library_panic / validation). Omit for all kinds.
          schema: { type: string }
        - name: format
          in: query
          required: false
          description: Filter by source MIME type (e.g. image/jpeg).
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Pending failure rows + the total pending count.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtractionFailureList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/metadata-extraction/failures/{id}/dismiss:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: dismissMetadataExtractionFailure
      summary: Soft-dismiss one extraction failure
      description: |
        Marks the row dismissed (keeps it for audit). Idempotent —
        re-dismissing an already-dismissed row returns 204 without
        complaint. 404 if the row never existed.

        Gated on `system.admin`.
      tags: [admin, metadata]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Dismissed (or already-dismissed).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/metadata-extraction/backfills:
    get:
      operationId: listMetadataExtractionBackfills
      summary: List recent metadata-extraction backfill runs
      description: |
        Returns up to `limit` most-recently-started backfill runs
        (default 20, cap 50). Gated on `system.admin`. Powers the
        operator-history table on the backfill admin page.
      tags: [admin, metadata]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Backfill runs newest-first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetadataBackfillRunList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: startMetadataExtractionBackfill
      summary: Start a new metadata-extraction backfill run
      description: |
        Inserts a metadata_backfill_run row + enqueues the
        coordinator job. The job walks every active image asset
        matching the scope + enqueues one metadata.extract child
        per asset. Returns the new run row; progress polls land
        via GET …/backfills/{id}. Gated on `system.admin`.

        Empty scope = all active image assets. Optional
        asset_type_ref narrows to one asset type's population.
      tags: [admin, metadata]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MetadataBackfillStart" }
      responses:
        "200":
          description: Run inserted + coordinator job enqueued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetadataBackfillRun" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/metadata-extraction/backfills/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getMetadataExtractionBackfill
      summary: Get one backfill run by id (progress poll)
      description: |
        Returns the current row state — processed / succeeded /
        failed counters move with each coordinator-job batch
        boundary. Gated on `system.admin`.
      tags: [admin, metadata]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Current run state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetadataBackfillRun" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/metadata-extraction/backfills/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: cancelMetadataExtractionBackfill
      summary: Cancel an in-flight backfill run
      description: |
        Flips cancelled_at to NOW(). The running coordinator job
        observes the flag on the next batch boundary + exits
        cleanly. Already-cancelled / already-completed runs are
        no-ops (returns 204). 404 if the id never existed.

        Gated on `system.admin`.
      tags: [admin, metadata]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Cancellation accepted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/storage/usage:
    get:
      operationId: getStorageUsage
      summary: Install-wide storage usage rollup
      description: |
        Read-only admin view of what storage holds (#402): distinct
        objects, variant rows, total bytes on disk, the
        originals-vs-derivatives split, and breakdowns by content type
        and backend.

        `total_bytes` is DEDUPLICATED on-disk bytes — storage is
        content-addressed, so a byte counted once is a byte stored
        once. It is summed from `storage_variants` alone: that table
        already carries one row per object under `variant_key`
        `original` mirroring the object's size, so adding
        `storage_objects` on top would double-count every original.

        Aggregates only, so no paging. Gated on `system.storage.read`
        (or `system.admin`). No write path.
      tags: [admin, storage]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Storage usage rollup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageUsage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/storage/sweeps:
    get:
      operationId: listStorageSweeps
      summary: Recent storage integrity sweep runs
      description: |
        Read-only list of sweep runs, newest first (#403), optionally
        filtered by kind. Gated on `system.storage.read` (or
        `system.admin`).
      tags: [admin, storage]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          required: false
          description: Filter by sweep kind (orphan_scan / checksum_verify).
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Sweep runs, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageSweepList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: triggerStorageSweep
      summary: Start a storage integrity sweep
      description: |
        Opens a sweep run and enqueues the first batch (#403). The job
        re-enqueues itself with an advancing cursor until the scan
        completes, so this returns as soon as the work is queued — the
        run shows up in the jobs admin queue while it works.

        A MUTATION in the sense that it creates work, so it is gated on
        `system.admin`, mirroring the jobs requeue/cancel split. The
        sweeps themselves are read-only against storage: they record
        findings and never delete.
      tags: [admin, storage]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TriggerSweep" }
      responses:
        "202":
          description: Sweep queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageSweep" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/storage/sweeps/{id}/findings:
    get:
      operationId: listStorageSweepFindings
      summary: Findings recorded by one sweep run
      description: |
        Paginated findings for a run (#403), optionally filtered by
        finding type. Gated on `system.storage.read` (or
        `system.admin`).

        Findings are advisory and reflect scan time, not now — anything
        acting on one must re-verify first.
      tags: [admin, storage]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: finding
          in: query
          required: false
          description: Filter by finding type (missing_object / orphan_object / checksum_mismatch / size_mismatch).
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: A page of findings plus the total.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageSweepFindingList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/storage/variants:
    get:
      operationId: listStorageVariantFamilies
      summary: Per-family variant inventory
      description: |
        Read-only inventory of derivative families (#402), largest
        first.

        Rows are grouped by variant FAMILY — the segment of
        `variant_key` before the first `/` (`turntable/0028.png` →
        `turntable`), or the whole key when it has none (`original`,
        `hires`). `variant_key` itself is high-cardinality (one key per
        HLS segment and per turntable frame — 2090 distinct on a dev
        install), so a raw per-key listing would be thousands of
        unreadable rows; the family grain is roughly a dozen.
        `distinct_keys` reports how many raw keys each family covers.

        Small result set, so no paging. Gated on `system.storage.read`
        (or `system.admin`). No write path.
      tags: [admin, storage]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Variant families, largest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageVariantFamilyList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/jobs:
    get:
      operationId: listJobs
      summary: List jobs by status and type
      description: |
        Read-only admin view of the job queue (#400). Paginated, ordered
        priority ASC then enqueued_at ASC (the run order). Optional
        `status` + `type` filters. Each row carries `age_seconds`
        (NOW() - enqueued_at) so the UI needn't trust a client clock.
        Gated on `system.jobs.read` (or `system.admin`). No write path.
      tags: [admin, jobs]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by status (pending/running/done/failed/cancelled). Omit for all.
          schema: { type: string }
        - name: type
          in: query
          required: false
          description: Filter by job type (e.g. preview.raster). Omit for all.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: A page of jobs + the total under the same filter.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/jobs/workers:
    get:
      operationId: listJobWorkers
      summary: List active workers and the job each holds
      description: |
        One entry per running job = one busy worker (#400). Carries the
        worker id (`claimed_by`), the held job, and lease state
        (`lease_expires_at`, `lease_stale`). Gated on `system.jobs.read`
        (or `system.admin`).
      tags: [admin, jobs]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Active workers with their held jobs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobWorkerList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/jobs/status-counts:
    get:
      operationId: listJobStatusCounts
      summary: Live per-type per-status job counts
      description: |
        Aggregate counts grouped by (type, status) for the live queue
        dashboard. The UI polls this on an interval; there is no
        server-sent-events stream. Gated on `system.jobs.read` (or
        `system.admin`).
      tags: [admin, jobs]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Per-(type, status) counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobStatusCountList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/jobs/{id}/requeue:
    post:
      operationId: requeueJob
      summary: Requeue a failed or cancelled job
      description: |
        Admin action (#401): send a dead job back to the pending pool —
        attempts reset, claim/lease/error cleared. Guarded on the source
        status: a running job is never touched (409). Gated on
        `system.admin` (mutations are admin-only; reads use
        `system.jobs.read`).
      tags: [admin, jobs]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Job requeued.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/jobs/{id}/cancel:
    post:
      operationId: cancelJob
      summary: Cancel a pending or failed job
      description: |
        Admin action: move a pending or failed job to `cancelled`.
        Cancelling a job that is already running is not supported and
        returns 409. Gated on `system.admin`.
      tags: [admin, jobs]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Job cancelled.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/jobs/scheduled:
    get:
      operationId: listScheduledJobs
      summary: List future-dated pending jobs
      description: |
        Read-only view of pending jobs with a `scheduled_for` in the
        future (#401). There is no cron subsystem — these are jobs a
        producer enqueued to run later (e.g. the digest coordinator's
        self-reschedule). Soonest first. Gated on `system.jobs.read`.
      tags: [admin, jobs]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Scheduled jobs + total.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduledJobList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/jobs/concurrency:
    get:
      operationId: listJobConcurrency
      summary: Per-type worker concurrency caps
      description: |
        Every registered job type with its current concurrency cap
        (`0` = uncapped). Caps live in system_config and are loaded by
        the worker Pool at BOOT, so `applies_on_restart` is true — an
        edit takes effect on the next restart. Gated on
        `system.jobs.read`.
      tags: [admin, jobs]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Type caps.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobConcurrencyList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/jobs/concurrency/{type}:
    put:
      operationId: setJobConcurrency
      summary: Set a job type's concurrency cap
      description: |
        Upsert one per-type cap (#401). `cap` of 0 clears it (uncapped).
        Takes effect on the next restart (the Pool loads caps at boot).
        Gated on `system.admin`.
      tags: [admin, jobs]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          description: The job type, e.g. preview.video.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetJobConcurrency" }
      responses:
        "204":
          description: Cap saved.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: user
      description: |
        PHP-compatible session cookie issued by `/auth/login`. The
        cookie name `user` is the one RS reads (include/authenticate.php),
        which is why we keep it for now; rename happens once PHP is
        fully retired.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: aa_pat
      description: |
        Personal Access Token, format `aa_pat_<32 chars>`. Issued via
        `POST /auth/tokens`. Send as `Authorization: Bearer aa_pat_...`.
  schemas:
    AssetType:
      type: object
      required: [ref]
      properties:
        ref:
          type: integer
          format: int64
          description: Primary key
          example: 1
        name:
          type: string
          nullable: true
          example: Photo
        allowed_extensions:
          type: string
          nullable: true
          description: |
            Comma-separated list of file extensions accepted for this
            resource type. Null means "use the system default."
          example: jpg,jpeg,png,gif
        order_by:
          type: integer
          format: int64
          nullable: true
          description: Display order, ascending. Null sorts last.
        icon:
          type: string
          nullable: true
          description: Lucide icon name shown in UI
          example: image
        colour:
          type: integer
          format: int64
          nullable: true
        tab:
          type: integer
          format: int64
          nullable: true
          description: Resource-type tab grouping in the admin UI
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error summary
          example: the request could not be completed
    BrushPackStamp:
      type: object
      required: [id, width, height, spacing, align_to_path]
      description: |
        One brush stamp in a pack. The bitmap itself is fetched via
        `/brush-packs/stamps/{id}` — this schema is the metadata the
        frontend renderer needs to know how to draw with it.
      properties:
        id:
          type: string
          format: uuid
          description: Stable per-stamp identifier.
        label:
          type: string
          nullable: true
          description: Optional human-readable name (from the ABR descriptor).
        width:
          type: integer
          description: Stamp bitmap width in source pixels.
        height:
          type: integer
          description: Stamp bitmap height in source pixels.
        spacing:
          type: number
          format: double
          minimum: 0
          maximum: 10
          description: |
            Step between successive stamps as a fraction of the
            effective stamp diameter. GIMP / Photoshop convention:
            0.1 = smooth (default), 1.0 = stamps just touch, >1 =
            sparse stippling.
        align_to_path:
          type: boolean
          description: When true, the stamp rotates to follow the stroke tangent.
        size_jitter:
          type: number
          format: double
          nullable: true
          description: 0..1 random size perturbation per stamp.
        opacity_jitter:
          type: number
          format: double
          nullable: true
        angle_jitter:
          type: number
          format: double
          nullable: true
          description: 0..360 degrees random angle perturbation.
    BrushPack:
      type: object
      required: [id, name, created_at, stamps]
      description: |
        Imported or authored brush pack owned by the caller. Includes
        the full stamp manifest so the frontend has everything it
        needs in one request.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        source_file:
          type: string
          nullable: true
          description: Original .abr filename, when imported.
        created_at:
          type: string
          format: date-time
        stamps:
          type: array
          items: { $ref: "#/components/schemas/BrushPackStamp" }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          format: password
        provider:
          type: string
          description: |
            Name of the identity provider to authenticate against.
            Defaults to "password" (the built-in flow). Enterprise
            installs can name a registered LDAP provider ("ldap" or
            a per-server alias like "ldap-engineering"). Requests
            naming an unregistered provider get 401 — same shape as
            a bad password, so a probing client can't enumerate
            which enterprise providers are active.
          example: password
        totp_code:
          type: string
          description: |
            TOTP code (6 digits) or recovery code
            (10 chars + optional hyphen) for users with 2FA
            confirmed. When 2FA is enabled and this field is
            missing or wrong the server returns 401 with
            `error: "2fa_required"` (no totp_code on the request)
            or `error: "invalid_2fa_code"` (wrong code) so the
            frontend can re-prompt.
    IdentityProviderSummary:
      type: object
      description: |
        Public projection of a registered identity provider — what
        the login screen renders. No license-feature flag is
        surfaced here; the mere presence of an entry implies the
        install holds the matching feature.
      required: [name, display_name, kind, supports_password]
      properties:
        name:
          type: string
          description: Stable registry identifier (POST /auth/login `provider` field).
        display_name:
          type: string
          description: Human-readable label rendered on the login screen.
        kind:
          type: string
          description: |
            Provider kind — "password", "ldap", or "saml". Determines
            which login UI the frontend renders (form vs. redirect
            button).
          enum: [password, ldap, saml]
        supports_password:
          type: boolean
          description: |
            True when the provider accepts username + password via
            POST /auth/login. False for redirect-flow providers
            (SAML) — those use kind-specific endpoints.
    IdentityProviderList:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: "#/components/schemas/IdentityProviderSummary" }
    BuildInfo:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: Server version — the git tag baked in at build time, or "dev".
          example: "0.3.1"
    SetupStatus:
      type: object
      required: [needs_setup, deployment, defaults, public_mode, self_registration_enabled]
      properties:
        needs_setup:
          type: boolean
          description: True when no user with the `system.admin` capability exists.
        deployment:
          $ref: "#/components/schemas/SetupDeploymentInfo"
        defaults:
          $ref: "#/components/schemas/SetupDefaults"
        public_mode:
          type: boolean
          description: |
            True when the install serves its public read surface to
            anonymous visitors. The frontend reads this to decide
            whether a signed-out visitor may stay on a public route or
            must be sent to the sign-in page; the server enforces the
            same setting independently, so this field is a rendering
            hint and never the access decision.

            It rides on this endpoint because the frontend already
            calls it first on every navigation, before it knows whether
            a session exists — so the flag is available at the moment
            the routing decision is made, without a second request.
        self_registration_enabled:
          type: boolean
          description: |
            True when the install accepts self-service signups. The
            frontend reads this to decide whether a signed-out visitor
            may reach `/register` and whether the sign-in page offers a
            "create an account" link; `POST /auth/register` enforces the
            same setting itself and refuses with 403 when it is off, so
            this field is a rendering hint and never the access
            decision.

            Rides on this endpoint for the same reason `public_mode`
            does — the routing decision is made before a session is
            known to exist.

            This is the ONLY part of the self-registration settings
            exposed here. This endpoint is unauthenticated, so the rest
            of the knob set (the email-verification requirement, the
            default role) stays on the admin-only auth settings
            surface.
    SetupDeploymentInfo:
      type: object
      required: [db_host, db_port, db_name, storage_backend]
      description: |
        Read-only view of how the running process was configured at
        boot. Shown on the setup page so the admin can confirm the
        installation target before creating an admin account.
      properties:
        db_host: { type: string, example: postgres }
        db_port: { type: integer, example: 5432 }
        db_name: { type: string, example: artist_alley }
        storage_backend: { type: string, example: fs, description: "fs | s3" }
    SetupDefaults:
      type: object
      description: |
        Prefills harvested from `AA_SETUP_DEFAULT_*` env vars at boot.
        Empty strings mean "no prefill"; the form leaves those fields
        blank.
      required:
        [admin_username, admin_email, admin_fullname,
         site_name, site_base_url,
         smtp_host, smtp_port, smtp_encryption, smtp_username, smtp_from_address]
      properties:
        admin_username: { type: string }
        admin_email: { type: string }
        admin_fullname: { type: string }
        site_name: { type: string, example: artist-alley }
        site_base_url: { type: string }
        smtp_host: { type: string }
        smtp_port: { type: integer, example: 587 }
        smtp_encryption: { type: string, enum: [none, starttls, tls], example: starttls }
        smtp_username: { type: string }
        smtp_from_address: { type: string }
    SetupCompleteRequest:
      type: object
      required: [admin, site]
      properties:
        admin: { $ref: "#/components/schemas/InitialAdminRequest" }
        site: { $ref: "#/components/schemas/SiteConfig" }
        smtp:
          nullable: true
          allOf: [ { $ref: "#/components/schemas/SMTPConfig" } ]
    InitialAdminRequest:
      type: object
      required: [username, password, email]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 50
          example: admin
        password:
          type: string
          format: password
          minLength: 8
        email:
          type: string
          format: email
          example: admin@example.com
        fullname:
          type: string
          nullable: true
          example: Site Administrator
    SiteConfig:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Acme Art Reviews
        base_url:
          type: string
          description: |
            Absolute URL the site is reachable at. Used to build
            outgoing links (e.g., password-reset emails). May be empty
            at install time and filled in later.
          example: https://art.example.com
    SiteTextOverrides:
      type: object
      required: [overrides]
      description: |
        Operator overrides of shipped UI strings (#794), nested
        language → i18n key → replacement.

        Language first because that is the axis every consumer selects
        on: a client resolves its active locale once and then does key
        lookups inside it. A language with no overrides is simply
        absent — there are no empty sub-objects to skip.
      properties:
        overrides:
          type: object
          additionalProperties:
            type: object
            additionalProperties: { type: string }
          example:
            en:
              nav.collections: Libraries
    SiteTextEntry:
      type: object
      required: [key, language, value]
      properties:
        key:
          type: string
          description: The dotted i18n key this override replaces.
          example: nav.collections
        language:
          type: string
          description: Locale code the override applies to.
          example: en
        value:
          type: string
          description: |
            The replacement string. Plain text — it flows through the
            client's `{var}` interpolation and is never rendered as
            HTML.
          example: Libraries
        updated_at:
          type: string
          format: date-time
          readOnly: true
    SiteTextWrite:
      type: object
      required: [language, value]
      description: PUT body for /site-text/{key}. The key rides the path.
      properties:
        language:
          type: string
          minLength: 1
          example: en
        value:
          type: string
          description: |
            Replacement string. May be empty — an operator blanking a
            label is a legitimate edit, and is distinct from reverting
            (DELETE), which restores the shipped text.
          example: Libraries
    EmailTemplateCatalogue:
      type: object
      required: [templates]
      description: |
        Every email an instance can send, each with its shipped text,
        any operator override, and the finite set of fields available to
        a template for that event (#795, ADR 0081 §2). The editor needs
        all three: the shipped body to show alongside, the override to
        edit, and the field list so an operator does not have to guess
        what is in scope.
      properties:
        templates:
          type: array
          items: { $ref: "#/components/schemas/EmailTemplateEvent" }
    EmailTemplateEvent:
      type: object
      required: [name, description, parts, fields]
      properties:
        name:
          type: string
          description: The stable template name, e.g. admin_test.
          example: admin_test
        description:
          type: string
          description: Plain-word summary of when this mail is sent.
        parts:
          type: array
          description: The faces of this template — subject, text, and (when it has one) html.
          items: { $ref: "#/components/schemas/EmailTemplatePart" }
        fields: { $ref: "#/components/schemas/EmailTemplateFields" }
    EmailTemplatePart:
      type: object
      required: [part, shipped, overridden]
      properties:
        part:
          type: string
          description: subject, text, or html.
        shipped:
          type: string
          description: The body this face ships with, from the embedded binary.
        overridden:
          type: boolean
          description: True when an operator override replaces the shipped body.
        body:
          type: string
          description: The operator override, present only when overridden.
        updated_at:
          type: string
          format: date-time
          readOnly: true
    EmailTemplateFields:
      type: object
      required: [scalars, collections]
      description: |
        The documented view-model for one event — the ONLY fields a
        template may reference. This set is the security boundary: a
        template naming anything outside it is refused at save.
      properties:
        scalars:
          type: array
          items: { $ref: "#/components/schemas/EmailTemplateField" }
        collections:
          type: array
          description: |
            Repeated groups an operator loops over with
            {{range .name}}…{{end}}; each row exposes its own fields.
          items: { $ref: "#/components/schemas/EmailTemplateCollection" }
    EmailTemplateField:
      type: object
      required: [name, kind, description]
      properties:
        name:
          type: string
          example: site_name
        kind:
          type: string
          description: string or number.
        description:
          type: string
    EmailTemplateCollection:
      type: object
      required: [name, description, fields]
      properties:
        name:
          type: string
          example: hits
        description:
          type: string
        fields:
          type: array
          items: { $ref: "#/components/schemas/EmailTemplateField" }
    EmailTemplateWrite:
      type: object
      required: [body]
      description: PUT body for /email-templates/{template}/{part}. The template + part ride the path.
      properties:
        body:
          type: string
          minLength: 1
          description: |
            The replacement template body, in Go text/template syntax
            (html/template for the html part). It must reference only the
            event's documented fields — a reference to anything else is
            refused with 422 naming the field.
    EmailTemplateOverride:
      type: object
      required: [template, part, body]
      properties:
        template:
          type: string
          example: admin_test
        part:
          type: string
          description: subject, text, or html.
        body:
          type: string
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PublicModeConfig:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: |
            When true, anonymous callers may reach the public read
            surface (assets, collections, search, IIIF). When false —
            the default, and the state of any install that has never
            set it — those routes return 401 to anonymous callers.
          example: false
    BrowseViewsConfig:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: array
          description: |
            The browse layouts this install offers, in the switcher's
            canonical order. The server reorders whatever it is sent
            into that order and drops duplicates, so layout order stays
            a frontend decision and only availability is the operator's.

            MUST NOT BE EMPTY. A write enabling nothing is refused with
            a 400 and nothing is persisted — an install offering no
            layout has an unreachable browse page, and the recovery path
            would be a database shell.

            An install that has never configured this reads back all
            five. That is the shipped default expressed as the absence
            of a stored value, not as a seeded row.
          minItems: 1
          items:
            type: string
            enum: [grid, masonry, thumbnail, list, feed]
          example: [grid, list, feed]
    MatureContentConfig:
      type: object
      required: [allowed]
      description: |
        The install-wide mature-content switch (#1116, ADR 0090 §2).

        ⚠️ THE WIRE FIELD IS NAMED FOR THE PERMISSIVE DIRECTION AND THE
        STORED ONE IS NOT, and the difference is not an oversight. The
        stored struct's field is `disallowed`, so its ZERO VALUE — an
        empty blob, a partial decode, an install that has never
        configured this — reads as the permissive upgrade default. The
        wire field is `allowed`, because that is the question an
        operator is answering, and it is REQUIRED so no zero value is
        ever in play on this side: a body that omits it is a 400, not a
        silent switch-off.
      properties:
        allowed:
          type: boolean
          description: |
            Whether this install permits mature content at all. `true`
            for an install that has never configured it.

            Allowing shows nothing to anybody by itself — the viewer
            still has to be signed in and opted in, and the opt-in
            defaults off. DISallowing is absolute: it outranks an
            opted-in reader's own preference, because the operator's
            answer is about the install and the reader's is about
            themselves.
    SMTPConfig:
      type: object
      required: [host, port, encryption, from_address]
      properties:
        host: { type: string, example: smtp.example.com }
        port: { type: integer, example: 587 }
        encryption:
          type: string
          enum: [none, starttls, tls]
          example: starttls
        username: { type: string }
        password:
          type: string
          format: password
          writeOnly: true
          description: |
            Write-only. Provide to set or rotate the SMTP password;
            omit (or send empty string) on PATCH to keep the current
            value. The response never echoes this field — read
            `password_set` instead to check whether one is on file.
            Stored at rest encrypted via the AA_MASTER_KEY-backed
            atrest package; never sent back to clients.
        password_set:
          type: boolean
          readOnly: true
          description: |
            True when a password is currently stored. Set by the
            server on GET responses; ignored if sent on PATCH.
        from_address:
          type: string
          example: "ArtSite <noreply@example.com>"
    SMTPTestRequest:
      type: object
      properties:
        to:
          type: string
          format: email
          description: |
            Recipient override. When omitted, the server uses the
            calling admin's email on file. Useful for diagnosing
            relay-side routing (e.g. send to an external Gmail
            account to verify deliverability).

    SMTPTestResult:
      type: object
      required: [sent, mode, recipient]
      properties:
        sent:
          type: boolean
          description: True when the Sender accepted the message.
        mode:
          type: string
          enum: [smtp, capture, disabled]
          description: The boot-time Sender mode (informational).
        recipient:
          type: string
          description: The email the test was sent to.
        message:
          type: string
          description: Human-readable summary (e.g. "captured locally; not delivered").

    AuthConfig:
      type: object
      description: |
        Authentication + SSO configuration. Persisted under the
        sysconfig key `auth`. The password policy applies only to
        local accounts; SSO logins are validated by the upstream
        identity provider. SSO providers are STORED here but not yet
        USED at login time — enforcement lands in a follow-up phase.
      required: [password_policy, sso_providers]
      properties:
        password_policy:
          type: object
          required: [min_length, require_upper, require_number, require_symbol, disallow_common, max_age_days]
          properties:
            min_length: { type: integer, minimum: 0, maximum: 256, default: 0 }
            require_upper: { type: boolean, default: false }
            require_number: { type: boolean, default: false }
            require_symbol: { type: boolean, default: false }
            disallow_common:
              type: boolean
              default: false
              description: Reject common-password list ("password", "123456", ...).
            max_age_days:
              type: integer
              minimum: 0
              maximum: 36500
              default: 0
              description: 0 = passwords never expire.
        sso_providers:
          type: array
          items:
            type: object
            required: [kind, enabled, display_name]
            properties:
              id:
                type: string
                description: |
                  Stable identifier assigned by the admin UI on create.
                  Empty on a freshly-added provider; the handler fills
                  it in. Used as OAuth `state` and as the row key for
                  later edits.
              kind:
                type: string
                enum: [ldap, saml, google, github, x]
              enabled: { type: boolean }
              display_name: { type: string }
              config:
                $ref: '#/components/schemas/SSOProviderConfig'
        self_registration:
          type: object
          description: |
            Self-service signup tunables. Default
            zero-valued (disabled, verification on, role "Base") so
            installs upgrading without opting in stay closed.
          properties:
            enabled:
              type: boolean
              description: Master switch. /auth/register returns 403 when false.
            require_email_verification:
              type: boolean
              description: |
                When true (recommended), new accounts must click a
                verification link before they can sign in. Disable
                only for closed-network installs where outbound
                SMTP isn't available.
            default_role:
              type: string
              description: |
                Role name assigned to fresh signups. Default "Base".
                Operators can point this at a more restricted role
                for moderated communities.
    SSOProviderConfig:
      type: object
      additionalProperties: false
      description: |
        Per-kind configuration for one SSO provider. Every field is
        optional and which subset applies is decided by the provider's
        `kind` — OAuth fields for `google`/`github`/`x`, the LDAP block
        for `ldap`, the SAML block for `saml`.

        This schema is CLOSED (`additionalProperties: false`) on
        purpose (#718). It used to be a free-form map, which meant the
        read path handed every stored bind password, client secret and
        SP private key to anyone holding `system.config.read`. Naming
        each field is what lets the three secrets be marked write-only;
        a free-form remainder would put the leak straight back, because
        the server cannot know which unknown key holds a credential.

        Nothing consumes these values at login time yet — SSO
        enforcement lands in a later phase. The names follow the
        upstream protocol vocabulary (RFC 6749 for OAuth, RFC 4511 for
        LDAP, SAML 2.0 core/bindings) so the integration code inherits
        them rather than renaming them.
      properties:
        # --- OAuth 2.0 / OIDC: kind = google | github | x ---
        client_id:
          type: string
          description: |
            OAuth client identifier issued by the provider. Public by
            definition (it travels in the authorization URL), so it is
            returned on read.
        client_secret:
          type: string
          format: password
          writeOnly: true
          description: |
            Write-only. Provide to set or rotate this provider's OAuth
            client secret; omit (or send an empty string) on PATCH to
            keep the current value. The response NEVER echoes this
            field — read `client_secret_set` instead to check whether
            one is on file. A stored credential has no read-back
            workflow, so it is not returned to any capability,
            `system.admin` included (#718).
        client_secret_set:
          type: boolean
          readOnly: true
          description: |
            True when an OAuth client secret is currently stored for
            this provider. Set by the server on GET responses; ignored
            if sent on PATCH.
        redirect_uri:
          type: string
          description: |
            Absolute callback URL registered with the provider. Blank
            means "derive it from the site base URL".
        scopes:
          type: array
          items: { type: string }
          description: |
            Scopes requested at authorization time. Blank means the
            integration's per-kind default.
        # --- LDAP: kind = ldap ---
        server_url:
          type: string
          description: 'LDAP server URL, e.g. `ldaps://ldap.example.org:636`.'
        start_tls:
          type: boolean
          description: |
            Issue StartTLS on a plain `ldap://` connection. Ignored for
            `ldaps://`, which is already wrapped.
        base_dn:
          type: string
          description: 'Search base for user lookups, e.g. `ou=people,dc=example,dc=org`.'
        bind_dn:
          type: string
          description: |
            DN the server binds as to perform user searches. A DN is an
            identifier, not a credential — returned on read. Its
            password is `bind_password`.
        bind_password:
          type: string
          format: password
          writeOnly: true
          description: |
            Write-only. Password for `bind_dn`. Provide to set or
            rotate; omit (or send an empty string) on PATCH to keep the
            current value. The response NEVER echoes this field — read
            `bind_password_set` instead. Not returned to any
            capability, `system.admin` included (#718).
        bind_password_set:
          type: boolean
          readOnly: true
          description: |
            True when a bind password is currently stored. Set by the
            server on GET responses; ignored if sent on PATCH.
        user_search_filter:
          type: string
          description: |
            LDAP filter template for locating a user, e.g.
            `(&(objectClass=person)(uid=%s))`. Blank means the
            integration's default.
        # --- SAML 2.0: kind = saml ---
        idp_metadata_url:
          type: string
          description: |
            URL of the identity provider's SAML metadata document.
            Preferred over pasting the entity ID and certificate by
            hand — the integration refreshes from it.
        idp_entity_id:
          type: string
          description: IdP entity ID, when metadata is configured by hand.
        idp_certificate:
          type: string
          description: |
            IdP signing certificate (PEM). A certificate is public
            material — it is published in the IdP's own metadata — so
            it is returned on read. The service provider's PRIVATE key
            is `sp_private_key`, which is not.
        sp_entity_id:
          type: string
          description: This service provider's entity ID as registered with the IdP.
        sp_acs_url:
          type: string
          description: |
            Assertion Consumer Service URL the IdP posts to. Blank
            means "derive it from the site base URL".
        sp_private_key:
          type: string
          format: password
          writeOnly: true
          description: |
            Write-only. PEM private key this service provider signs
            SAML requests with. Provide to set or rotate; omit (or send
            an empty string) on PATCH to keep the current value. The
            response NEVER echoes this field — read
            `sp_private_key_set` instead. Not returned to any
            capability, `system.admin` included (#718).
        sp_private_key_set:
          type: boolean
          readOnly: true
          description: |
            True when an SP private key is currently stored. Set by the
            server on GET responses; ignored if sent on PATCH.
    AIInferenceConfig:
      type: object
      description: |
        AI inference subsystem snapshot. Returned by
        GET /admin/ai/config; writable via PUT with the
        AIInferenceConfigWrite shape (the read shape carries
        findings + computed defaults that the write shape doesn't
        include).
      required: [enabled, routing, fallback_chains, privacy, default_budget]
      properties:
        enabled:
          type: boolean
          description: Master switch. Defaults to false on fresh install (operator opts in).
        routing:
          type: object
          additionalProperties:
            type: string
          description: |
            Per-task default provider. Keys are concern names
            (complete | embed | transcribe | tag | caption); values
            are provider names registered via /admin/system/ai.
        fallback_chains:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: |
            Ordered fallback list per concern. The router walks
            transient + rate-limit failures down the chain;
            permanent/budget/privacy errors short-circuit.
        privacy:
          $ref: "#/components/schemas/AIPrivacyPolicy"
        default_budget:
          $ref: "#/components/schemas/AIBudgetDefaults"
        findings:
          type: array
          description: |
            Validator findings against the current config (e.g.
            routing references a provider that isn't registered).
            Empty when the config is clean.
          items: { $ref: "#/components/schemas/AIConfigFinding" }
    AIInferenceConfigWrite:
      type: object
      description: PUT body for /admin/ai/config. Same shape as the read minus the validator-computed `findings`.
      required: [enabled, routing, fallback_chains, privacy, default_budget]
      properties:
        enabled: { type: boolean }
        routing:
          type: object
          additionalProperties: { type: string }
        fallback_chains:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        privacy:
          $ref: "#/components/schemas/AIPrivacyPolicy"
        default_budget:
          $ref: "#/components/schemas/AIBudgetDefaults"
    AIPrivacyPolicy:
      type: object
      required: [lock_sensitive_to_local, local_providers]
      properties:
        lock_sensitive_to_local:
          type: boolean
          description: |
            When true, assets at sensitivity tier `restricted` or
            `embargo` route to local providers only. Defaults to
            true on fresh install.
        local_providers:
          type: array
          items: { type: string }
          description: Provider names considered "local" for the gate above.
    AIBudgetDefaults:
      type: object
      required: [soft_warning_usd, hard_cap_usd]
      properties:
        soft_warning_usd:
          type: integer
          format: int64
          description: USD threshold at which a soft-warn audit event fires.
        hard_cap_usd:
          type: integer
          format: int64
          description: |
            USD ceiling beyond which CheckBudgetBefore rejects calls
            with `ai_budget_exhausted`. Zero (the fresh-install
            default) fails-closed with `cloud_budget_not_configured`
            on the very first call until the operator raises it.
    AIConfigFinding:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable identifier (`routing_missing_concern`,
            `privacy_lock_with_empty_local_list`,
            `routing_undefined_provider`, etc.) the admin UI uses
            to render a localised message.
        concern:
          type: string
          enum: [complete, embed, transcribe, tag, caption]
          description: Empty when the finding isn't concern-specific.
        message:
          type: string
          description: Operator-readable English fallback message.
    MCPServer:
      type: object
      description: |
        One registered MCP server. Each registration becomes one
        ai.Provider in the router; the operator-chosen `name` is
        the audit-dashboard identifier and the dispatcher slot key.
      required: [id, name, url, transport, auth_kind, auth_secret_set,
                 privacy_class, enabled,
                 rate_limit_per_second, rate_limit_per_minute,
                 health_check_interval_s, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 128 }
        url: { type: string, minLength: 1 }
        transport: { type: string, enum: [http, stdio] }
        auth_kind: { type: string, enum: [none, bearer, header, mtls] }
        auth_secret_set:
          type: boolean
          readOnly: true
          description: |
            True when an auth secret is currently stored for this
            server. The secret itself is NEVER returned — despite the
            `_ref` name on the write side it holds the live bearer
            token / header value, and a stored credential has no
            read-back workflow, so no capability reads it back
            (#711). Set it via POST / PATCH `auth_secret_ref`.
        auth_header_name: { type: string, nullable: true }
        privacy_class: { type: string, enum: [local, cloud] }
        enabled: { type: boolean }
        rate_limit_per_second: { type: integer, minimum: 1 }
        rate_limit_per_minute: { type: integer, minimum: 1 }
        health_check_interval_s: { type: integer, minimum: 1 }
        last_health_check_at: { type: string, format: date-time, nullable: true }
        last_health_status:
          type: string
          nullable: true
          enum: [healthy, degraded, unreachable, null]
        last_health_error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MCPServerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MCPServer" }
    MCPServerCreate:
      type: object
      required: [name, url]
      description: Create payload for POST /admin/ai/mcp-clients.
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        url: { type: string, minLength: 1 }
        transport: { type: string, enum: [http, stdio], default: http }
        auth_kind: { type: string, enum: [none, bearer, header, mtls], default: none }
        auth_secret_ref:
          type: string
          format: password
          writeOnly: true
          description: |
            Write-only. The bearer token / header value used to
            authenticate to this server. Never returned on any read —
            responses carry `auth_secret_set` instead (#711).
        auth_header_name: { type: string }
        privacy_class: { type: string, enum: [local, cloud], default: cloud }
        enabled: { type: boolean, default: false }
        rate_limit_per_second: { type: integer, minimum: 1, default: 2 }
        rate_limit_per_minute: { type: integer, minimum: 1, default: 60 }
        health_check_interval_s: { type: integer, minimum: 1, default: 60 }
    MCPServerUpdate:
      type: object
      description: |
        Partial-update payload for PATCH /admin/ai/mcp-clients/{id}.
        Omitted fields keep their existing value. Health-check fields
        are owned by the per-server poller and not editable here.
      properties:
        url: { type: string, minLength: 1 }
        transport: { type: string, enum: [http, stdio] }
        auth_kind: { type: string, enum: [none, bearer, header, mtls] }
        auth_secret_ref:
          type: string
          format: password
          writeOnly: true
          description: |
            Write-only. Provide to set or rotate the stored auth
            secret; omit (or send an empty string) to keep the
            current value. Never returned on any read — responses
            carry `auth_secret_set` instead (#711).
        auth_header_name: { type: string }
        privacy_class: { type: string, enum: [local, cloud] }
        enabled: { type: boolean }
        rate_limit_per_second: { type: integer, minimum: 1 }
        rate_limit_per_minute: { type: integer, minimum: 1 }
        health_check_interval_s: { type: integer, minimum: 1 }
    MCPServerToolGrant:
      type: object
      required: [server_id, tool_name, cost_estimate_micros, enabled]
      description: |
        One whitelisted tool on an MCP server. Per-tool capability
        is the gate ON TOP of the umbrella mcp.client.use; empty
        means "umbrella cap is sufficient". Cost estimate is the
        operator-declared per-call cost in USD micros (0 for free /
        local tools).
      properties:
        server_id: { type: string, format: uuid }
        tool_name: { type: string, minLength: 1, maxLength: 128 }
        additional_capability: { type: string, nullable: true }
        cost_estimate_micros: { type: integer, format: int64, minimum: 0 }
        enabled: { type: boolean }
    MCPServerToolGrantUpsert:
      type: object
      required: [cost_estimate_micros, enabled]
      description: PUT payload for /admin/ai/mcp-clients/{id}/tools/{tool}.
      properties:
        additional_capability: { type: string }
        cost_estimate_micros: { type: integer, format: int64, minimum: 0 }
        enabled: { type: boolean }
    AIUsageReport:
      type: object
      required: [billing_period, total_cost_usd_micros, providers]
      properties:
        billing_period:
          type: string
          description: YYYY-MM the report covers.
        total_cost_usd_micros:
          type: integer
          format: int64
          description: Sum across all providers. Divide by 1_000_000 for USD.
        providers:
          type: array
          items: { $ref: "#/components/schemas/AIUsageProviderRow" }
    AIUsageProviderRow:
      type: object
      required: [provider, call_count, cost_usd_micros, status_counts]
      properties:
        provider: { type: string }
        call_count: { type: integer, format: int64 }
        cost_usd_micros: { type: integer, format: int64 }
        status_counts:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: |
            Per-status row count (success / rate_limited /
            transient_error / permanent_error / budget_blocked /
            privacy_blocked) so the operator can spot providers
            that are mostly failing.
    AIConfig:
      type: object
      description: |
        AI provider configuration. Persisted under the sysconfig key
        `ai`. API keys are stored as plain strings for now (admin-
        only table; never federated); a secrets-backend migration is
        planned. Keys are write-only on this surface — see
        `providers[*].api_key` / `providers[*].api_key_set`.
      required: [providers]
      properties:
        default_provider_id:
          type: string
          description: |
            Picks the `providers[*].id` used when nothing else
            specifies. Empty = no default (callers must choose, or
            AI features stay disabled).
        providers:
          type: array
          items:
            type: object
            required: [kind, enabled, display_name]
            properties:
              id: { type: string }
              kind:
                type: string
                enum: [openai, anthropic, google, local]
              enabled: { type: boolean }
              display_name: { type: string }
              model: { type: string, description: "e.g. gpt-4o, claude-sonnet-4-6" }
              base_url:
                type: string
                description: Override for self-hosted / proxied endpoints.
              api_key:
                type: string
                format: password
                writeOnly: true
                description: |
                  Write-only. Provide to set or rotate this provider's
                  API key; omit (or send an empty string) on PATCH to
                  keep the current value. The response NEVER echoes
                  this field — read `api_key_set` instead to check
                  whether one is on file. A stored credential has no
                  read-back workflow, so it is not returned to any
                  capability, `system.admin` included (#711).
              api_key_set:
                type: boolean
                readOnly: true
                description: |
                  True when an API key is currently stored for this
                  provider. Set by the server on GET responses;
                  ignored if sent on PATCH.
              config:
                $ref: '#/components/schemas/AIProviderConfig'
    AIProviderConfig:
      type: object
      additionalProperties: false
      description: |
        Per-provider inference defaults. Closed schema, for the same
        reason as SSOProviderConfig (#718): a free-form map on a
        provider record is where credentials end up, and the read path
        cannot tell an unknown key holding a rate limit from one
        holding a token. Every field here is a tuning knob; the
        provider's one credential is `api_key`, which is write-only.
      properties:
        temperature:
          type: number
          minimum: 0
          maximum: 2
          description: Sampling temperature. Unset = the model's own default.
        top_p:
          type: number
          minimum: 0
          maximum: 1
          description: Nucleus-sampling cutoff. Unset = the model's own default.
        max_output_tokens:
          type: integer
          minimum: 0
          description: Cap on generated tokens per request. 0 = no override.
        system_prompt:
          type: string
          description: Prepended to every request routed to this provider.
        request_timeout_seconds:
          type: integer
          minimum: 0
          description: Per-request timeout. 0 = the client default.
        rate_limit_rpm:
          type: integer
          minimum: 0
          description: Client-side requests-per-minute ceiling. 0 = unthrottled.
    AIEditConfig:
      type: object
      description: |
        AI image-edit subsystem configuration. One field today; the
        typed surface (per-op MCP server overrides, default workflow
        selection, ...) may expand later.
      properties:
        image_edit_server:
          type: string
          description: |
            Name of an operator-registered MCP server (see
            /admin/ai/mcp-clients) the aiedit dispatcher routes
            image-edit calls to. Must match a row in
            mcp_server_registration.name exactly. Empty = feature
            disabled (viewer hides the Generate variation button +
            the runtime endpoint returns 409).
    Img2ImgRequest:
      type: object
      description: |
        Payload for POST
        /assets/{id}/edit/img2img. Zero-value knobs (denoise_strength,
        steps, seed) tell the bridge to apply its own defaults; the
        operator's workflow defaults stay authoritative unless the
        caller explicitly overrides.
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            Steers the variation. Required even when empty-like
            (e.g. ".") to keep the operator's audit trail
            human-readable.
        denoise_strength:
          type: number
          minimum: 0
          maximum: 1
          description: |
            0 = no change from source; 1 = ignore source entirely
            (effectively txt2img). Bridge default is 0.7.
        steps:
          type: integer
          minimum: 1
          maximum: 100
          description: |
            Inference step count. Bridge default is 20.
        seed:
          type: integer
          description: |
            0 (or omitted) = random; the response carries the
            actual seed used.
    AssetEditJobAccepted:
      type: object
      description: |
        The 202 response for the enqueue endpoints.
        Caller polls /jobs/{job_id} for status; on completion the
        job result carries the new derivative asset id.
      required: [job_id, source_asset_id]
      properties:
        job_id:
          type: string
          format: uuid
          description: The enqueued jobs.* row id.
        source_asset_id:
          type: string
          format: uuid
          description: |
            The asset the variation derives from. Echoed for
            caller-side correlation.
    PreviewLadder:
      type: object
      description: |
        The preview variants this install generates, in configured
        order. See `getPublicPreviewLadder`.
      required: [variants]
      properties:
        variants:
          type: array
          items: { $ref: "#/components/schemas/PreviewLadderRung" }
    PreviewLadderRung:
      type: object
      required: [key, fit, max_dim]
      properties:
        key:
          type: string
          description: |
            Variant key — the `{key}` in `/assets/{id}/variants/{key}`.
            Operator-defined, so do NOT assume the default set
            (col / preview / screen / hires).
        fit:
          type: string
          enum: [cover, contain]
          description: |
            `cover` CROPS to a square of max_dim; `contain` preserves
            aspect ratio within max_dim. The distinction is load-bearing
            for layout: the default `col` rung is a 320x320 COVER crop,
            so a client wanting the true aspect ratio must use a
            `contain` rung, not `col`.
        max_dim:
          type: integer
          description: |
            Longest edge in pixels. Doubles as the `Nw` width descriptor
            in a `srcset` for `contain` rungs.
        format:
          type: string
          enum: [webp, jpeg, png]
    AppearanceConfig:
      type: object
      description: |
        Per-install brand and typography choices. Each field holds a
        font catalogue ID (e.g. `limelight`, `inter-variable`,
        `system-sans`); the frontend resolves the ID to an
        `@font-face` declaration at boot. Empty string means the slot
        uses the frontend's default.
      properties:
        brand_font:
          type: string
          description: |
            Logo / hero font slot. Recommended for display faces
            (Limelight, Bebas Neue, Playfair Display); body text never
            uses this slot.
        display_font:
          type: string
          description: |
            H1–H3 heading slot. Falls back to the body font when empty.
        body_font:
          type: string
          description: |
            Body / UI text slot. Falls back to the system sans-serif
            stack when empty.
        mono_font:
          type: string
          description: |
            Code / tabular numerics slot. Falls back to the system
            monospace stack when empty.
        site_name:
          type: string
          readOnly: true
          description: |
            Display name of this install. Read-only here — it is owned
            and edited via the Site config (`/admin/system/site`); it is
            surfaced on this public boot path so the wordmark, login
            card, and document titles can render the configured name
            before the user has signed in. Defaults to "Artist Alley"
            when the operator hasn't set one.
          example: Artist Alley
        demo_mode:
          type: boolean
          readOnly: true
          description: |
            True when this install runs in demo mode (env
            `AA_DEMO_MODE=1`). Surfaced on the public boot path so the
            login card can advertise the shared demo credentials and a
            read-only banner can render once signed in. Absent/false in
            a normal install — zero footprint when off.
          example: false
        visual_search_enabled:
          type: boolean
          readOnly: true
          description: |
            True when this install can answer a reverse-image search —
            i.e. `search.visual.enabled` is on AND the CLIP visual
            encoder sidecar was reachable when the process booted.

            It is the RESOLVED capability, not the config flag, and the
            difference is the whole point (#1163): an install whose
            sidecar was unreachable at boot has `enabled: true` in
            sysconfig and still serves **501 sidecar_not_installed** on
            `POST /search/by-image`, so publishing the config value
            would advertise an arm that cannot work. Read it as "the
            by-image endpoint will do something".

            Surfaced here, on the boot path the frontend already reads,
            so the reverse-image dropzone can be absent on an install
            without the channel instead of being discovered by dropping
            an image and getting an error. Absent/false on a default
            install — the feature is off unless an operator turns it on.
          example: false
        logo_url:
          type: string
          readOnly: true
          description: |
            URL of the operator-uploaded instance logo, or **absent**
            when none is set — absent means "render the shipped default
            mark", exactly as an empty font slot means "use the slot
            default".

            Read-only here. The logo is written only by
            `POST /admin/system/appearance/logo`, which validates the
            image bytes, and cleared only by the matching `DELETE`.
            It is deliberately NOT settable through this object: if a
            PATCH could name the underlying storage object, an admin
            could point the public, unauthenticated logo route at any
            hash on the install — including someone's private asset.

            Carries a `v` content-hash parameter, so the URL changes
            whenever the logo does and the response can be cached
            immutably.
          example: /api/v1/appearance/logo?v=9f2b1c4d5e6a
        logo_width:
          type: integer
          readOnly: true
          description: |
            Intrinsic width in pixels of the uploaded logo. Published so
            a client can reserve layout space and avoid a reflow when
            the image lands. Absent when no logo is set.
          example: 512
        logo_height:
          type: integer
          readOnly: true
          description: |
            Intrinsic height in pixels of the uploaded logo. Absent when
            no logo is set.
          example: 512
        logo_history:
          type: array
          readOnly: true
          description: |
            The operator's recent logos, most-recently-used first,
            capped at 5, so a previous mark can be picked back up
            without re-uploading it.

            **Admin surface only.** Populated on
            `GET /admin/system/appearance` and on the logo write
            responses; deliberately absent from the public `/appearance`
            boot payload, which needs only the active logo and must not
            pay for the per-entry availability check on every anonymous
            page load.

            The shipped default is NOT an entry here — it is always
            available and is represented by `logo_url` being absent.
          items: { $ref: "#/components/schemas/InstanceLogo" }
    InstanceLogo:
      type: object
      description: |
        One entry in the operator's recent-logo list. A reference to
        stored bytes plus what the server proved about them when they
        were uploaded — never the image data itself.
      required: [hash, url, content_type, width, height, size_bytes, available, active]
      properties:
        hash:
          type: string
          description: |
            Content hash of the image. Pass this to
            `POST /admin/system/appearance/logo/select` to re-activate
            the entry, or as `v` on `/appearance/logo` to fetch it.
          example: 9f2b1c4d5e6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c
        url:
          type: string
          description: Ready-made URL for rendering this entry's thumbnail.
          example: /api/v1/appearance/logo?v=9f2b1c4d5e6a
        content_type:
          type: string
          description: |
            MIME type derived by decoding the image at upload time.
          example: image/png
        width:
          type: integer
          example: 512
        height:
          type: integer
          example: 512
        size_bytes:
          type: integer
          format: int64
          example: 18244
        available:
          type: boolean
          description: |
            Whether the bytes are still readable from the storage
            backend right now.

            Listed entries are pinned, so this is normally `true`. It
            can be `false` when the blob was lost outside the pin
            system — a restored database pointed at a fresh bucket,
            manual deletion, backend corruption. Clients MUST render
            an unavailable entry as explicitly unavailable rather than
            as a broken image, and MUST NOT offer it for selection:
            "the file is gone" is exactly the situation this list
            exists to help an operator through, so it has to be legible
            rather than silently broken.
          example: true
        active:
          type: boolean
          description: Whether this entry is the currently applied logo.
          example: false

    CurrentUser:
      type: object
      required: [ref, username, auth_method, capabilities_status, mature_content_allowed]
      properties:
        ref:
          type: integer
          format: int64
        username:
          type: string
        fullname:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        usergroup:
          type: integer
          format: int64
          nullable: true
        auth_method:
          type: string
          enum: [session, token]
          description: How the caller was authenticated for this request.
        language:
          type: string
          description: |
            User's language pref (BCP47). Empty string = follow system /
            browser. Joined from user_profiles at /auth/me time so the
            frontend can hydrate the language store on first paint
            without a separate round-trip.
        theme:
          type: string
          enum: ['', 'light', 'dark', 'system']
          description: |
            User's theme pref. `system` follows the OS; empty string
            means the account has NO stored preference and the device
            falls back to the app default (dark, #590). The two are
            deliberately distinct — collapsing them made an explicit
            "follow my OS" indistinguishable from "never chose", so it
            could not travel to a second device (#677). Same "join on
            /auth/me" rationale as `language`.
        default_views:
          allOf:
            - $ref: "#/components/schemas/UserPreferencesViews"
          description: |
            The account's default-view selections, joined from
            user_preferences at /auth/me time (#706).

            Same rationale as `language` and `theme`, and the same
            timing guarantee, which is the point: the root layout's
            load awaits /auth/me before any page renders, so the browse
            store can consult these synchronously in its `init()`
            rather than seeding itself from a second round-trip that
            lands after the grid has already painted.
        feed_filters:
          allOf:
            - $ref: "#/components/schemas/UserPreferencesFeedFilters"
          description: |
            The account's browse-feed content filters (#891), joined
            from user_preferences at /auth/me time.

            The filtering itself is the SERVER's — `GET /posts` reads
            this preference and applies it, so no client can forget to
            and no client can turn it off. What rides the session is the
            fact that it is ON, because a feed that is quietly shorter
            than it would otherwise be has to say so on the same paint
            that renders it. Learning it from a second round-trip means
            the browse page renders a thinner grid with no explanation
            and then pops a banner in afterwards — the same first-paint
            race #867 and #872 closed for `default_views`, `theme` and
            `capabilities`, arriving at the same surface.

            OMITTED when every filter is off, which is every account
            that has not opted in — so this changes no existing session
            response.
        browse_rail:
          allOf:
            - $ref: "#/components/schemas/UserPreferencesBrowseRail"
          description: |
            The account's browse-rail curation — team chips (#1113) and
            followed-tag chips (#1123) — joined from user_preferences at
            /auth/me time.

            Here rather than behind a second fetch because these lists
            decide WHAT THE RAIL DRAWS. Learning them after first paint
            means the rail paints the uncurated list and then rearranges
            itself in front of the reader — the layout shift the rail's
            single `loaded` gate exists to avoid, reintroduced one level
            up. Same first-paint argument as `default_views` (#706).

            OMITTED when every list is empty, which is every account
            that has not curated its rail — so this changes no existing
            session response.
        mature_content:
          allOf:
            - $ref: "#/components/schemas/UserPreferencesMatureContent"
          description: |
            The account's mature-content consent, joined from
            user_preferences at /auth/me time (#1115).

            Here rather than behind a second fetch for the same
            first-paint reason as `feed_filters`: it decides what the
            feed CONTAINS, and a page that learns it after paint renders
            one library and then swaps it. #706 is the precedent.

            ⚠️ IT IS ONE OF THREE CONJUNCTS, NOT THE ANSWER. The reader
            also has to be signed in (they are, if they are reading
            this) and the INSTANCE has to allow mature content — that
            third conjunct is `mature_content_allowed` below. A client
            rendering "mature content is on for you" from THIS field
            alone will be wrong on an instance that has switched the
            feature off.

            OMITTED when the opt-in is off, which is every account that
            has not opted in — so this changes no existing session
            response.
        mature_content_allowed:
          type: boolean
          description: |
            Whether this INSTANCE allows mature content at all (#1116,
            ADR 0090 §2) — the operator's switch, not this account's.

            ⚠️ REQUIRED, unlike `mature_content` above, and the asymmetry
            is the point. `mature_content` may be omitted because absent
            and `false` mean the same thing there (not opted in). Here
            they do NOT: the unconfigured default is `true`, so a client
            that read an absent field as `false` would hide the opt-in
            control on every install that has never touched the setting —
            which is all of them. Declared required so the guess is
            impossible to need: every producer of this schema must answer,
            and the compiler says so.

            It rides the session response rather than getting a public
            endpoint because every consumer is behind authentication:
            the upload self-label, the operator's per-asset override,
            and the account opt-in are all signed-in surfaces, and an
            anonymous viewer can never opt in (there is nowhere to store
            the answer). The operator's read/write pair is
            `/admin/system/mature-content`.

            What a client does with it: when `false`, the account's
            mature opt-in control is not rendered AT ALL — not rendered
            disabled — because a toggle the server will not honour is a
            control that lies. Server-side nothing depends on the
            client obeying: the same switch is ANDed into the
            qualification predicate on every request.
        capabilities:
          type: array
          items:
            type: string
          description: |
            The caller's resolved GLOBAL capability codes — the same set
            GET /auth/me/capabilities reports in its `capabilities`
            field, after role inheritance, per-user grants and revokes
            have all been applied. Team-scoped capabilities are NOT
            included; ask the scoped endpoints for those.

            Rides the session response for the same reason `theme` and
            `default_views` do, and for a sharper one (#871): the client
            marks its auth store "ready" the instant this response
            lands, and every capability-gated surface reads the store at
            that moment. A capability set that arrives on a SECOND
            round-trip therefore arrives after the gate has already
            decided, which rendered a "you don't have permission" panel
            at real admins until the follow-up landed. One response, one
            decision, no window.

            OMITTED when `capabilities_status` is `unavailable`. Read
            that field first: this one is only meaningful when the
            lookup succeeded.
        capabilities_status:
          type: string
          enum: [resolved, unavailable]
          description: |
            Whether `capabilities` above could be determined for this
            session. THREE outcomes, not two, and the difference between
            the last two is the whole point of this field (#956):

              * `resolved` + a non-empty list — the caller holds those
                codes.
              * `resolved` + an empty list — the lookup succeeded and
                the account genuinely holds nothing.
              * `unavailable` — the lookup FAILED. `capabilities` is
                omitted and says nothing whatsoever about what this
                account holds.

            Before this field existed, the second and third collapsed
            into one wire shape, and the SPA rendered "You don't have
            permission to view this page." for both. That panel is
            correct for a powerless account and a lie for a resolver
            blip, and neither the operator reading it nor a test
            asserting on it could tell which had happened — which is
            exactly how #956's nightly failure survived four triage
            passes.

            Clients MUST fail closed on `unavailable`: grant nothing,
            render no gated control. What they MUST NOT do is describe
            it as a permission decision. It is the absence of one, and
            the honest surface is an error with a retry.

            This is a status, not a permission: `unavailable` never
            widens what a caller may do, and every action is enforced
            server-side against a freshly resolved set regardless of
            what any session response said.

            Required, and deliberately so. Making it optional and
            treating absent as "unknown" was the smaller diff and the
            wrong one: `capabilities` is ALREADY legitimately absent
            from POST /setup/complete, whose response omits it while
            the admin's role is committed. Overloading absence would
            have made that response assert a degraded state that is not
            true, and would have let any future producer that forgets a
            field silently emit an error state on a healthy session. A
            required enum makes every producer answer the question.
        impersonated_by:
          type: object
          nullable: true
          description: |
            Non-null when the session was minted via
            POST /admin/users/{ref}/impersonate.
            Carries the acting admin's ref + username so the
            persistent "you are acting as @target" banner can
            render without a separate round-trip.
          required: [ref, username]
          properties:
            ref:
              type: integer
              format: int64
            username:
              type: string
    ApiTokenSummary:
      type: object
      required: [id, name, created_at, scopes]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
    ApiTokenCreated:
      allOf:
        - $ref: "#/components/schemas/ApiTokenSummary"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: |
                The plaintext token. Save it — it is never returned again.
              example: aa_pat_K7eHs0bdQ9XR8h0g7y4mR0aZ2lY1pX5N
    Capability:
      type: object
      required: [code, description]
      properties:
        code:
          type: string
          description: Atomic capability identifier (e.g., "users.read").
          example: users.read
        description:
          type: string
    Role:
      type: object
      required: [id, name, description, capabilities]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: Single-inheritance parent role; null for root roles.
        capabilities:
          type: array
          items:
            type: string
          description: |
            Capability codes attached directly to this role. Does NOT
            include inherited capabilities — chase parent_id to get the
            full set, or call `/auth/me/capabilities` for the resolved
            view of the current user.
    EffectiveCapabilities:
      type: object
      required: [user_ref, capabilities]
      properties:
        user_ref:
          type: integer
          format: int64
        role:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Role"
        capabilities:
          type: array
          items:
            type: string
          description: |
            The resolved capability set: (role chain capabilities)
            UNION (explicit grants) EXCEPT (explicit revokes). What
            middleware checks against when enforcing
            x-required-capabilities.
        grants:
          type: array
          items:
            type: string
          description: Capabilities granted explicitly to this user.
        revokes:
          type: array
          items:
            type: string
          description: Capabilities revoked explicitly from this user.
    SetUserRoleRequest:
      type: object
      required: [role_id]
      properties:
        role_id:
          type: string
          format: uuid
    FieldDefinition:
      type: object
      required: [id, code, label, type, required, searchable, applies_to, display_order, display_group, status, subject_kind, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, description: "Federation-stable slug. Globally unique." }
        label: { type: string }
        description: { type: string }
        type:
          type: string
          enum: [text, longtext, rich_text, number, boolean, date, datetime, select, multi_select, tree, reference]
        subject_kind:
          type: string
          enum: [asset, collection]
          description: |
            What the field describes. `asset` definitions apply to
            individual assets; `collection` definitions apply to whole
            collections. One row is one or the other — operators who
            want a field on both kinds create two rows.
        options:
          type: object
          additionalProperties: true
          description: |
            Type-dependent constraints / values. Shape per ADR 0012.
            For `select` / `multi_select` / `tree`: `{"values": [...]}`
            where each entry is a bare slug string, or an object
            `{value, label?, status?, replaced_by?, children?}`.
            An entry with no `status` is `active`. Entries that are
            `deprecated` or `archived` must not be offered for new
            values; `deprecated` ones still resolve and display on
            assets that already carry them.

            `children` nests the vocabulary and is what makes a field
            of type `tree` hierarchical. Slugs must be unique across
            the WHOLE tree, not merely within a level — the server
            rejects a duplicate at any depth — which is what lets a
            stored value be a single leaf slug rather than a path.
        open_vocabulary:
          type: boolean
          description: |
            When true, a value naming a term this field does not have
            CREATES the term instead of being refused: the text becomes
            the label and its slugified form becomes the stored value.
            When false (the default) an unknown term is a 422.

            Matching before creating is on slug OR label,
            case-insensitive and whitespace-trimmed, so `Character`,
            `character` and ` character ` all name one term rather than
            three.

            Honoured for `multi_select` only. The flag is legal on any
            type and inert on the rest — opening `select` or `tree` is a
            later decision, and `tree` additionally has to say WHERE in
            the hierarchy a new term lands.
        required: { type: boolean }
        searchable: { type: boolean }
        applies_to:
          type: array
          items: { type: integer, format: int64 }
          description: "Resource type refs this field applies to. Empty = all. Ignored when subject_kind = 'collection'."
        read_capability: { type: string, nullable: true }
        write_capability: { type: string, nullable: true }
        display_order: { type: integer }
        display_group: { type: string }
        extraction_source:
          type: string
          description: |
            CanonicalField the metadata-extraction pipeline writes
            into this field. Empty = no extraction (the field stays
            operator-managed). Edited via the
            dedicated PUT …/extraction endpoint.
        extraction_mode:
          type: string
          enum: ["", skip_if_set, replace, append, prepend]
          description: |
            Write behaviour when extraction has a value. Empty =
            default (skip_if_set).
        show_on_card:
          type: boolean
          description: |
            Render this field at a glance on an asset card (#552).

            A DISPLAY HINT, in the same class as `display_order` and
            `display_group`: nothing may gate access, filtering or
            correctness on it, and a client that ignores it entirely
            must still be correct, merely plainer. With no field
            marked, a card falls back to its own default.

            It FEDERATES with the definition. ADR 0083 leaves a
            property out of a schema envelope when it "names something
            that exists only on the sender"; this names the field, not
            the server, so a peer's fields render the way that peer
            meant them to.

            Refused on a field carrying a `read_capability`. A card is
            rendered on browse, for a page of assets, where the server
            has evaluated no per-field capability — so the combination
            is a 400 rather than a setting that silently does nothing.
            The refusal holds in both directions: a field already on
            the card cannot acquire a read capability either.
        mirrors_column:
          type: string
          nullable: true
          readOnly: true
          description: |
            When set, this field is a VIEW onto that column of the
            `assets` row rather than storage of its own (#822): reading
            it projects the column, writing it updates the column, and
            it can hold no value of its own — so the field and the
            column cannot disagree. `title` and `description` ship this
            way; `null` (the default) is an ordinary field.

            Two consequences for a client:

            * A write to a mirrored field is a write to the ASSET and
              is gated as one — the caller needs the same authority a
              `PATCH /assets/{id}` would demand, not merely a session.
            * A surface that already renders the column with a
              first-class control (the upload form's title box, an
              asset header) should skip the mirrored field rather than
              offer a second editor for the same value.

            Read-only over the API, deliberately: which columns are
            mirrorable is a schema decision enforced by a CHECK
            constraint, not something an operator can retarget at a
            column that may not exist. It is also LOCAL — it names a
            column of this server's schema — so per ADR 0083's
            exclusion criterion it does not travel in a federated
            field-schema envelope.
        status:
          type: string
          enum: [active, deprecated, archived]
        deprecated_replacement_id: { type: string, format: uuid, nullable: true }
        default_value:
          allOf:
            - $ref: "#/components/schemas/FieldDefault"
          nullable: true
          description: |
            Applied when an asset is created and this field would
            otherwise be empty. `null` = no default. Federates with the
            field definition; per-team overrides live at
            `/fields/{id}/default-overrides` and do not.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FieldDefault:
      type: object
      required: [kind]
      description: |
        A declarative upload default (ADR 0081 §3). Exactly one of two
        shapes, discriminated by `kind`, and never an expression:

          * `literal` — a value in whichever `value_*` member this
            field's type uses (the same mapping `AssetFieldValueWrite`
            documents). Populating any other member is a 400: the value
            would land in a column nothing reads.
          * `context` — a name from a closed set the server resolves at
            creation time. The operator picks from a menu; nothing they
            write is evaluated.

        For `select` / `multi_select` / `tree`, a literal slug must
        exist in the field's `options` and be `active`. A `deprecated`
        or `archived` term is rejected on write, because a default is
        the fastest way to spread a term you have just retired.

        When a value must genuinely be COMPUTED rather than chosen, that
        is what `extraction_source` / `extraction_mode` are for. A
        default answers "what should this be when nothing else says".
      properties:
        kind:
          type: string
          enum: [literal, context]
        value_text: { type: string, nullable: true }
        value_num: { type: number, nullable: true }
        value_date: { type: string, format: date-time, nullable: true }
        value_options:
          type: array
          items: { type: string }
          nullable: true
        value_ref: { type: string, format: uuid, nullable: true }
        context:
          type: string
          enum: [uploading_user, uploading_team, current_date]
          description: |
            Required when `kind` is `context`, forbidden otherwise.

              * `uploading_user` — the uploader's display name. Text
                types only.
              * `uploading_team` — the name of the team the upload
                belongs to. Text types only. Not applied when the
                uploader belongs to no team, or to more than one.
              * `current_date` — creation time. Date types only; a
                `date` field gets the day, a `datetime` the instant.

            The set is closed. It carries no "target collection"
            because `POST /assets` has no collection in scope — see the
            2026-07-31 defaults amendment to ADR 0081.
    FieldDefaultOverride:
      type: object
      required: [field_id, team_id, team_slug, team_name, default_value, created_at, updated_at]
      description: "One team's override of a field's upload default."
      properties:
        field_id: { type: string, format: uuid }
        team_id: { type: string, format: uuid }
        team_slug: { type: string }
        team_name: { type: string }
        default_value: { $ref: "#/components/schemas/FieldDefault" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        updated_by_user_ref: { type: integer, format: int64, nullable: true }
    FieldDefinitionCreate:
      type: object
      required: [code, label, type]
      properties:
        code: { type: string, minLength: 1, maxLength: 64, pattern: "^[a-z][a-z0-9_]*$" }
        label: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string }
        type:
          type: string
          enum: [text, longtext, rich_text, number, boolean, date, datetime, select, multi_select, tree, reference]
        subject_kind:
          type: string
          enum: [asset, collection]
          default: asset
          description: "What the field describes. Defaults to asset for backwards compatibility."
        options: { type: object, additionalProperties: true }
        open_vocabulary:
          type: boolean
          default: false
          description: |
            Let values create terms this field does not have yet. See
            FieldDefinition.open_vocabulary — honoured for
            `multi_select` only, inert elsewhere.
        required: { type: boolean, default: false }
        searchable: { type: boolean, default: true }
        applies_to:
          type: array
          items: { type: integer, format: int64 }
        read_capability: { type: string, nullable: true }
        write_capability: { type: string, nullable: true }
        display_order: { type: integer, default: 100 }
        display_group: { type: string, default: general }
        default_value:
          allOf:
            - $ref: "#/components/schemas/FieldDefault"
          nullable: true
          description: "Upload default. Validated against `type` and `options` on write."
    FieldExtractionConfig:
      type: object
      description: |
        Per-field extraction wiring. Empty source clears extraction;
        the operator can then re-attach it later without losing the
        field-definition's other settings.
      required: [source]
      properties:
        source:
          type: string
          description: |
            Canonical field name the extractor produces (e.g.
            capture_datetime, camera_make, gps_coordinates). Empty
            disables extraction for this field.
        mode:
          type: string
          enum: ["", skip_if_set, replace, append, prepend]
          description: |
            Apply behaviour. Empty defaults to skip_if_set — the
            conservative choice that never clobbers operator work.

    FieldDefinitionUpdate:
      type: object
      description: "Partial update; only present fields are touched."
      properties:
        if_unchanged_since:
          type: string
          format: date-time
          description: |
            Optimistic-concurrency guard (ADR 0012). When set, the
            server returns 409 EditConflict and writes nothing if the
            field's `updated_at` has moved past this value. Omit to
            opt out of the check (legacy behaviour).
        label: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string }
        options:
          type: object
          additionalProperties: true
          description: |
            Type-dependent constraints. For `select` / `multi_select` /
            `tree` this is `{"values": [...]}` where each entry is
            either a bare slug string or an object
            `{value, label?, status?, replaced_by?, children?}`.
            `status` is one of active | deprecated | archived and
            defaults to `active` when absent; `replaced_by` must name
            another slug in the same field. Entries carrying nothing
            beyond their slug serialise back as bare strings, so
            documents written before options had a lifecycle
            round-trip unchanged. Options are never hard-deleted —
            retire them with `deprecated` or `archived`.
        open_vocabulary:
          type: boolean
          description: |
            Let values create terms this field does not have yet. See
            FieldDefinition.open_vocabulary — honoured for
            `multi_select` only, inert elsewhere.
        show_on_card:
          type: boolean
          description: |
            Show this field at a glance on an asset card. See
            FieldDefinition.show_on_card. Refused with 400 on a field
            carrying a `read_capability`, and refused in the same way
            when this request would give a carded field one.
        required: { type: boolean }
        searchable: { type: boolean }
        applies_to:
          type: array
          items: { type: integer, format: int64 }
        read_capability: { type: string, nullable: true }
        write_capability: { type: string, nullable: true }
        display_order: { type: integer }
        display_group: { type: string }
        status:
          type: string
          enum: [active, deprecated, archived]
        deprecated_replacement_id: { type: string, format: uuid, nullable: true }
        default_value:
          allOf:
            - $ref: "#/components/schemas/FieldDefault"
          nullable: true
          description: |
            Sets this field's upload default. Omit to leave it alone.
            Use `clear_default: true` to remove it — a partial update
            cannot express "remove" by sending null, because null is
            already "leave alone" for every other property here.
        clear_default:
          type: boolean
          description: "Remove this field's upload default. Mutually exclusive with `default_value`."
    AssetFieldValue:
      type: object
      required: [field_id, field_code, type, set_by, set_at]
      description: "One field value as seen on an asset."
      properties:
        field_id: { type: string, format: uuid }
        field_code: { type: string }
        field_label: { type: string }
        type:
          type: string
          enum: [text, longtext, rich_text, number, boolean, date, datetime, select, multi_select, tree, reference]
        value_text: { type: string, nullable: true }
        value_num: { type: number, nullable: true }
        value_date: { type: string, format: date-time, nullable: true }
        value_options:
          type: array
          items: { type: string }
          nullable: true
        value_ref: { type: string, format: uuid, nullable: true }
        set_by:
          type: string
          enum: [manual, exif, iptc, xmp, api, import, computed, default, mirror]
          description: |
            Where this value came from. `default` means an upload
            default put it here and nothing has improved on it since —
            extraction is free to overwrite it, and a human editing the
            field replaces it with `manual`. It is the one provenance a
            client cannot claim: `AssetFieldValueWrite.set_by` has no
            `default` member, because a value a caller chose to send is
            by definition not one nobody chose.

            `mirror` means the field declares `mirrors_column` and this
            value IS the asset column — nothing was stored under the
            field. It is not a claim about who last edited it, because
            the column carries no such record; `set_at` is the asset's
            `updated_at` and `set_by_user_ref` is always null. Like
            `default` it is server-only: a caller cannot send it.
        set_at: { type: string, format: date-time }
        set_by_user_ref: { type: integer, format: int64, nullable: true }
        resolved_options:
          type: object
          nullable: true
          additionalProperties:
            $ref: '#/components/schemas/ResolvedOption'
          description: |
            Display data for the vocabulary slugs this value holds,
            keyed by slug. Present only for select / multi_select /
            tree, and only for slugs that resolve against the field's
            options document — a slug with no entry (the vocabulary
            dropped it, or the value predates it) is simply absent, and
            callers must fall back to rendering the slug itself.

            asset_field_value stores the slug and never the label (ADR
            0012) precisely so relabelling a term rewrites nothing. The
            cost of that indirection is that a reader has to resolve;
            this map is where the server pays it, once, for every
            consumer, so no display surface has to hold the field
            definition just to print a value.
        resolved_reference:
          $ref: '#/components/schemas/ResolvedReference'
    ResolvedReference:
      type: object
      required: [id, title]
      description: |
        The asset a `reference` value points at, as a reader needs to
        see it. Present only for `reference` values whose `value_ref`
        resolves to an asset this caller may see.

        **Absent is meaningful and load-bearing**: it means the target
        did not resolve — soft-deleted, or a dangling ref to a row that
        no longer exists. A client MUST fall back to rendering the bare
        `value_ref` UUID and MUST NOT treat the absence as an error.
        Degrading to the id keeps the panel intact and leaks nothing:
        the id was already on the record the caller is reading.

        This mirrors `resolved_options` exactly, and for the same
        reason (#775): the row carrying the value already joins the row
        carrying the display text, so the server pays the resolution
        once for every consumer rather than letting each display
        surface print a raw UUID.
      properties:
        id:
          type: string
          format: uuid
          description: |
            The target asset's id. Equal to the enclosing value's
            `value_ref` — repeated here so a client holding a
            `resolved_reference` never has to reach back out of it to
            build the `/assets/{id}` link.
        title:
          type: string
          description: |
            The target asset's title. May be the empty string —
            `assets.title` defaults to `''` and nothing requires an
            uploader to set one — so a client renders the id when this
            is blank rather than an empty link.
    ResolvedOption:
      type: object
      required: [label, status]
      description: |
        One controlled-vocabulary term as a reader needs to see it.
        Note there is no `value` — the map key is the slug.
      properties:
        label:
          type: string
          description: |
            Display text. Equal to the slug when the term carries no
            explicit label, which is the case for every option written
            in the bare-string form (see ADR 0012's 2026-07-30
            correction) — so a caller can always render this directly.
        status:
          type: string
          enum: [active, deprecated, archived]
          description: |
            The term's lifecycle state. A reader should mark anything
            other than active, so a value stops looking current the
            moment an operator retires the term behind it.
        path:
          type: array
          nullable: true
          items: { type: string }
          description: |
            Ancestor labels from the root of the field's vocabulary down
            to and including this term — what a `tree` value needs in
            order to display as "Europe / United Kingdom / London" when
            the stored value is nothing but `london`.

            Absent for any term that sits at the top level, which is
            every term in a flat select / multi_select vocabulary: a
            one-element path would say nothing `label` does not. So a
            caller renders `path.join(...)` when it is present and
            `label` when it is not.
    AssetFieldValueWrite:
      type: object
      description: |
        Pass whichever value_* field matches the target field's type.
        The handler validates against field_definition.type and
        rejects mismatches with 400.

        The mapping is: text / longtext / rich_text / select / tree →
        `value_text`; number / boolean → `value_num`; date / datetime →
        `value_date`; multi_select → `value_options`; reference →
        `value_ref`.

        A `tree` value is ONE option slug in `value_text` — the node
        being selected — not a path string and not an array. Slugs are
        unique across the whole option tree, so the node's own slug
        addresses it; the server reassembles the ancestor labels into
        `resolved_options[slug].path` on read. See the 2026-07-31
        tree-storage amendment to ADR 0012.

        A `boolean` value is the number 1 or 0 in `value_num`; any
        other number is rejected. Not the strings "true" / "false" in
        `value_text` — that shape was what the collection path and
        every display surface used until #791, and it was never what
        this endpoint accepted.
      properties:
        value_text: { type: string, nullable: true }
        value_num: { type: number, nullable: true }
        value_date: { type: string, format: date-time, nullable: true }
        value_options:
          type: array
          items: { type: string }
          nullable: true
        value_ref: { type: string, format: uuid, nullable: true }
        set_by:
          type: string
          enum: [manual, exif, iptc, xmp, api, import, computed]
          default: manual
    FieldValueHistoryEntry:
      type: object
      required: [id, asset_id, field_id, changed_at, set_by]
      properties:
        id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        field_id: { type: string, format: uuid }
        old_value: { type: object, additionalProperties: true, nullable: true }
        new_value: { type: object, additionalProperties: true, nullable: true }
        changed_at: { type: string, format: date-time }
        changed_by_user_ref: { type: integer, format: int64, nullable: true }
        set_by: { type: string }
    CollectionFieldValue:
      type: object
      required: [field_id, field_code, type, set_by, set_at]
      description: |
        One field value as seen on a collection. Mirrors
        AssetFieldValue but for the collection subject_kind; the
        `set_by` vocabulary is narrower (no exif/iptc/xmp — collections
        aren't files).
      properties:
        field_id: { type: string, format: uuid }
        field_code: { type: string }
        field_label: { type: string }
        type:
          type: string
          enum: [text, longtext, rich_text, number, boolean, date, datetime, select, multi_select, tree, reference]
        value_text: { type: string, nullable: true }
        value_num: { type: number, nullable: true }
        value_date: { type: string, format: date-time, nullable: true }
        value_options:
          type: array
          items: { type: string }
          nullable: true
        value_ref: { type: string, format: uuid, nullable: true }
        set_by:
          type: string
          enum: [manual, api, import, computed]
        set_at: { type: string, format: date-time }
        set_by_user_ref: { type: integer, format: int64, nullable: true }
        resolved_options:
          type: object
          nullable: true
          additionalProperties:
            $ref: '#/components/schemas/ResolvedOption'
          description: |
            Display data for the vocabulary slugs this value holds,
            keyed by slug. Present only for select / multi_select /
            tree, and only for slugs that resolve against the field's
            options document — a slug with no entry is absent and the
            caller falls back to the slug itself. Mirrors
            AssetFieldValue.resolved_options exactly (#840): collection
            metadata resolves the same way asset metadata does, so a
            select value renders its label and not its raw slug.
        resolved_reference:
          $ref: '#/components/schemas/ResolvedReference'
    FieldValueUnprocessable:
      type: object
      description: |
        Why a well-formed field-value write could not be stored.

        ONE body shared by the asset and the collection writers (both
        return it via the FieldValueUnprocessable response), so the two
        cannot drift into describing the same refusal differently.
        `field` is the field's code and `option` the slug that was
        refused, so a client can point at the offending term without
        parsing `error`.
      required: [error, reason]
      properties:
        error: { type: string }
        reason:
          type: string
          description: |
            - `field_not_for_collection` — the field is asset-scoped and
              cannot be written on a collection.
            - `value_type_mismatch` — the value arrived in the wrong
              value_* member for the field's declared type.
            - `unknown_option` — `select` / `multi_select` / `tree`
              only: the slug is not a term in the field's controlled
              vocabulary. For `tree` the whole option tree is searched,
              not just the top level, and a branch slug is as valid as
              a leaf.
            - `option_not_offerable` — the slug names a deprecated or
              archived term that the record did not already hold.
              Options are never hard-deleted, so a record already
              carrying a since-retired term keeps saving; only
              *changing* to one is refused.
            - `dangling_reference` — `reference` only: `value_ref` names
              an asset that does not resolve (never existed, or has been
              deleted). Refused on WRITE so a value cannot be pointed at
              a nonexistent asset. Note the asymmetry with READ: a value
              that resolved when written and whose target is deleted
              *later* still reads fine, degrading to the bare id
              (`resolved_reference` simply absent) — the write gate does
              not retroactively invalidate it.
          enum:
            - field_not_for_collection
            - value_type_mismatch
            - unknown_option
            - option_not_offerable
            - dangling_reference
        field:
          type: string
          nullable: true
          description: The `code` of the field that refused the value.
        option:
          type: string
          nullable: true
          description: |
            The offending slug, for the two vocabulary reasons. Null
            otherwise.
    CollectionFieldValueWrite:
      type: object
      description: |
        Pass whichever value_* field matches the target field's type.
        Mismatches return **422** with `value_type_mismatch` — this
        description said 400 until #778, but the operation has only
        ever declared (and only ever returned) 422. The asset-side
        equivalent does return 400; the two paths differ.

        The mapping matches AssetFieldValueWrite's exactly — every
        type, `boolean` and `tree` included, stores in the same column
        with the same encoding on both sides.

        `boolean` collection values were the strings "true" / "false"
        in `value_text` until #791, where the asset path had always
        used 0 / 1 in `value_num`. This path now takes `value_num` and
        rejects anything but 0 or 1, the same contract the asset side
        enforces.

        A `tree` value is ONE option slug in `value_text`. Until the
        2026-07-31 tree-storage amendment to ADR 0012 this path wrote
        `value_options` while the asset path wrote `value_text`, so the
        two sides put the same field's value in different columns.
      properties:
        value_text: { type: string, nullable: true }
        value_num: { type: number, nullable: true }
        value_date: { type: string, format: date-time, nullable: true }
        value_options:
          type: array
          items: { type: string }
          nullable: true
        value_ref: { type: string, format: uuid, nullable: true }
        set_by:
          type: string
          enum: [manual, api, import, computed]
          default: manual
    CollectionFieldValueHistoryEntry:
      type: object
      required: [id, collection_id, field_id, changed_at, set_by]
      properties:
        id: { type: string, format: uuid }
        collection_id: { type: string, format: uuid }
        field_id: { type: string, format: uuid }
        old_value: { type: object, additionalProperties: true, nullable: true }
        new_value: { type: object, additionalProperties: true, nullable: true }
        changed_at: { type: string, format: date-time }
        changed_by_user_ref: { type: integer, format: int64, nullable: true }
        set_by: { type: string }
    Collection:
      type: object
      description: |
        A user-owned collection of assets, per ADR 0009. UUID-keyed,
        federation-prepared (`origin_server_id`), with three
        orthogonal axes: visibility, membership, and lifecycle.
      required:
        [id, owner_user_ref, name, description, visibility, membership,
         created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        owner_user_ref: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        visibility:
          type: string
          enum: [private, org-only, followers, explicit-share]
        membership:
          type: string
          enum: [manual, query, hybrid]
          description: |
            `manual` only for 1.11.A. `query` and `hybrid` ship in
            1.11.B once the search DSL (ADR 0010) lands.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: TTL. Null = permanent.
        purpose:
          type: string
          nullable: true
          description: |
            Free-form admin-set hint ("for_review", "for_proofing", …).
            Replaces RS's single-purpose `archived` flag.
        origin_server_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Federation home server. Null = local. Populated when
            collections sync in from a peer in a later phase.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Soft-delete timestamp. Non-null only on rows surfaced by
            the admin `include_deleted=true` listing (the trash view);
            null on live rows.
        deleted_reason:
          type: string
          nullable: true
          description: Optional reason captured at soft-delete time.
        cover_asset_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The curator's CHOSEN cover picture (#1027), or null to
            compose the derived mosaic from members instead.

            ANY asset the curator could picture when they set it — not
            necessarily a member of this collection. That is what makes
            it survive the member being removed, which is the failure a
            member-only pointer has. "Upload a dedicated banner" is
            still available: upload it as an ordinary asset, then pick
            it. One extra step, no separate upload machinery, and one
            representation for a cover instead of two.

            THIS IS THE CURATOR'S SETTING, NOT THE RENDER ANSWER. Read
            `covers` to know what to paint; read this to populate the
            edit form's picker. They disagree on purpose whenever the
            reader may not picture the chosen asset — see `covers`.

            It does NOT federate. A local asset id names something that
            exists only on this server, which is ADR 0083's exclusion
            criterion; a peer composes its own mosaic from the members
            it holds.
        covers:
          type: array
          items: { $ref: "#/components/schemas/CollectionCover" }
          description: |
            What to PAINT for this collection's tile — the curator's
            chosen cover if there is a renderable one (#1027), else up
            to four members whose picture this caller may render, the
            derived mosaic (#1026).

            A COVER THIS READER MAY NOT PICTURE FALLS BACK TO THE
            MOSAIC; it never yields a blank tile, and it never leaks the
            withheld picture either. The choice is the curator's, but
            whether it renders is still decided per reader, so two
            readers of the same collection can correctly get different
            answers here. A client cannot tell an overridden cover from
            a one-member mosaic, and does not need to.

            BOTH MEMBER KINDS CONTRIBUTE. `collection_resources` supply
            their asset directly, and `collection_posts` supply
            `cover_thumbnail_asset_id ?? cover_asset_id` — the same
            preference a feed card uses. #882 made a post-only
            collection an ordinary thing to own ("save someone else's
            post"), and until #1026 such a collection had no cover
            source at all and rendered as an empty folder.

            ORDER is the curator's, `added_at` ascending, INTERLEAVED
            across both kinds: the arrangement is the curation, and the
            two membership tables are one shelf.

            EACH ASSET APPEARS AT MOST ONCE, at its earliest position.
            One asset can be reached by several routes — pinned
            directly AND carried as a post's cover, or shared as the
            cover of two posts — and the same picture twice summarises
            nothing. Clients may therefore key a list on `asset_id`.

            WITHHELD MEMBERS ARE SKIPPED, NOT SLOTTED. Only members
            passing the caller's picture plane (ADR 0064) and having a
            `col` rendition appear, so a restricted member never
            occupies a slot a renderable one behind it could fill.
            That is deliberately NOT the placeholder shape
            `GET /collections/{id}/resources` uses: a placeholder there
            exists so the reader can see a restriction and ask for
            access (#881/#883), whereas a blank quarter of a mosaic
            says nothing and costs a picture.

            ABSENT means "not composed on this surface", never "no
            members" — an empty array is the honest "nothing to show".
    CollectionCover:
      type: object
      description: |
        One tile of a collection's composed mosaic cover (#1026). An
        entry exists only if this caller may render the asset, so
        clients paint every entry unconditionally — there is no
        `preview_available` to branch on and no placeholder rung.
      required: [asset_id]
      properties:
        asset_id:
          type: string
          format: uuid
          description: |
            Fetch the picture from
            `/assets/{asset_id}/variants/col`. Guaranteed to have that
            rendition — an asset without one is not a cover candidate.
    CollectionCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string }
        visibility:
          type: string
          enum: [private, org-only, followers, explicit-share]
          default: private
        membership:
          type: string
          enum: [manual, query, hybrid]
          default: manual
          description: |
            Only `manual` is accepted in 1.11.A; passing `query` or
            `hybrid` returns 400 until 1.11.B ships.
        expires_at:
          type: string
          format: date-time
          nullable: true
        purpose:
          type: string
          nullable: true
        field_values:
          type: array
          description: |
            Initial values for collection-scoped custom
            fields. The handler validates that every `required=true`
            collection field is present; missing required fields
            return 422 with `required_collection_field_missing`.
          items:
            type: object
            required: [field_id]
            properties:
              field_id: { type: string, format: uuid }
              value_text: { type: string, nullable: true }
              value_num: { type: number, nullable: true }
              value_date: { type: string, format: date-time, nullable: true }
              value_options:
                type: array
                items: { type: string }
                nullable: true
              value_ref: { type: string, format: uuid, nullable: true }
    CollectionUpdate:
      type: object
      description: |
        Partial update; only present fields are touched. A null is
        "leave alone", not "clear" — removing a value that is already
        set is an explicit flag (`clear_expires_at`, `clear_cover`).
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string }
        visibility:
          type: string
          enum: [private, org-only, followers, explicit-share]
        membership:
          type: string
          enum: [manual, query, hybrid]
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Set this collection's expiry. Send `clear_expires_at: true`
            to remove an existing TTL — sending `null` here does not
            clear it, for the same reason it does not for
            `cover_asset_id`: null already means "leave alone".
        clear_expires_at:
          type: boolean
          description: |
            Remove this collection's TTL, so it no longer expires (#1073).
            Mutually exclusive with `expires_at` — sending both is a 400,
            rather than the server picking one and silently discarding
            the other.
        purpose:
          type: string
          nullable: true
        cover_asset_id:
          type: string
          format: uuid
          description: |
            Choose this collection's cover picture (#1027). Any asset
            you may PICTURE — it does not have to be a member of this
            collection.

            The server refuses an asset you may not picture, with the
            same 400 it gives for an id that does not exist: telling the
            two apart would make this endpoint an existence oracle for
            assets you cannot see.

            Send `clear_cover: true` to go back to the derived mosaic —
            a partial update cannot express "remove" by sending null,
            because null is already "leave alone" for every other
            property here. Same reasoning, and the same shape, as
            `clear_default` on FieldDefinitionUpdate.

            EDIT-ONLY, deliberately absent from CollectionCreate. #914
            took a question off the new-collection dialog because the
            API already had a sensible default; a cover is a curation
            act performed on a collection that already has members, not
            a decision anyone can make while naming an empty one.
        clear_cover:
          type: boolean
          description: |
            Remove the chosen cover, reverting this collection to the
            derived mosaic composed from its members. Mutually exclusive
            with `cover_asset_id` — sending both is a 400, rather than
            the server picking one and silently discarding the other.
        if_unchanged_since:
          type: string
          format: date-time
          description: |
            Optimistic-concurrency guard. When set, the
            server returns 409 EditConflict if the collection's
            `updated_at` has advanced past this value. Omit to
            opt out of the check (legacy behaviour).
    CollectionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Collection" }
        next_cursor:
          type: string
          nullable: true
          description: |
            Opaque token for the next page; omitted on the final page.
            Pass back unchanged as the `cursor` query parameter.
    CollectionResource:
      type: object
      description: |
        One asset's membership in a collection, joined with the
        asset's identifying columns so the UI can render without a
        follow-up fetch.

        RESTRICTED MEMBERS (#883) — identical contract to PostMember, see
        there for the reasoning. When the caller fails
        `visibility.FieldsReadable` this row degrades to a placeholder:
        `restricted` is true and EVERY joined-in `assets` column below
        (title, asset_type, status, file_hash, file_extension, thumbhash,
        pixel_width, pixel_height, asset_created_at, and the three
        availability flags) is ABSENT — not empty-string, not zero, not
        null — so a client cannot distinguish "withheld" from "genuinely
        empty" and infer from the difference.

        That is why those fields moved out of `required`. The permitted
        key set on a restricted row is exactly the `collection_resources`
        row's own columns — collection_id, asset_id, sort_order, pinned,
        expires_at, added_at — plus `restricted` and
        `owner_display_name`. No column of `assets` crosses the boundary,
        so a column added to that table later is withheld by
        construction.

        On a NON-restricted row every one of those fields is still sent,
        unchanged and unconditionally; #595's argument for keeping the
        card-critical ones non-optional (a surface that hand-maps a
        narrower object silently loses video badges and sprite-scrub)
        still holds, and the allow-list test in
        `collections/member_allowlist_test.go` is what now pins it,
        because `required` no longer can.
      required:
        [collection_id, asset_id, sort_order, pinned, added_at, restricted]
      properties:
        collection_id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        sort_order: { type: integer }
        pinned: { type: boolean }
        expires_at:
          type: string
          format: date-time
          nullable: true
        added_at: { type: string, format: date-time }
        restricted:
          type: boolean
          description: |
            True when the caller may not see this member. Every
            asset-derived field is then absent and the client renders a
            placeholder tile (#883).
        owner_display_name:
          type: string
          description: |
            Set only when `restricted` is true: the display name of the
            asset's owner. Absent — not empty — when unresolvable.
        title: { type: string }
        asset_type: { type: integer, format: int64 }
        status: { type: string, enum: [draft, active, archived] }
        file_hash:
          type: string
          nullable: true
        file_extension:
          type: string
          nullable: true
          description: |
            REQUIRED (nullable), same as Asset.file_extension. A member
            tile is rendered by the same CardThumb as every other
            surface, and CardThumb derives the media TYPE from this
            field alone — video / 3D badge and the sprite-scrub hover
            preview both key off it. Omitting it renders a collection
            member as an untyped still (#595).
        thumbhash:
          type: string
          nullable: true
          description: |
            REQUIRED (nullable), same as Asset.thumbhash — the member
            tile's blur-up placeholder. See file_extension above for why
            the card-critical fields are required rather than optional.
        preview_available:
          type: boolean
          description: |
            True iff a servable `col` variant exists for this asset AND
            the caller passes the content plane (ADR 0064). Same contract
            + 0064-safety as Asset.preview_available — the tile renders a
            thumbnail only when true, else a placeholder with no byte
            request (#471).
        ladder_available:
          type: boolean
          description: |
            True iff every variant in the operator's CONFIGURED preview
            ladder exists for this member asset AND the caller passes the
            content plane. Identical contract to Asset.ladder_available —
            see there for why this is computed from config rather than
            from the default rung list.
        scrub_available:
          type: boolean
          description: |
            True iff a servable `sprites.vtt` cue file exists for this
            member asset AND the caller passes the content plane.
            Identical contract to Asset.scrub_available — a collection
            member renders through the same CardThumb as every other
            surface, so it needs the same hover-scrub gate (#835).
        pixel_width:
          type: integer
          format: int32
          nullable: true
          description: |
            REQUIRED (nullable), same contract as Asset.pixel_width — a
            member tile is laid out by the same CardThumb as every other
            surface, and in masonry that frame sizes itself from this
            ratio (#640). Null when the install has no recorded
            dimensions for the asset; see Asset.pixel_width for when
            that happens.
        pixel_height:
          type: integer
          format: int32
          nullable: true
          description: |
            REQUIRED (nullable), same as Asset.pixel_height. Projected
            as a PAIR with `pixel_width` — never one without the other.
        asset_created_at: { type: string, format: date-time }
        card_fields:
          type: array
          items: { $ref: '#/components/schemas/CardField' }
          description: |
            The values of the fields an operator marked `show_on_card`,
            already resolved to display strings and in the order the
            field definitions declare — identical contract to
            Asset.card_fields, see there.

            #1133: this key was missing, and with it the flag had never
            worked on the member grid. A collection member renders
            through the same card as a browse tile, so "at a glance"
            meant one thing on browse and nothing here. The values are
            resolved by the same projection the browse page uses
            (metadata.CardFieldsForAssets), not by a second one.

            Absent on a `restricted` placeholder, like every other
            asset-derived key above — the withheld row's permitted key
            set is unchanged by this addition.
    CollectionResourceWrite:
      type: object
      required: [asset_id]
      properties:
        asset_id: { type: string, format: uuid }
        sort_order: { type: integer, default: 0 }
        pinned: { type: boolean, default: true }
        expires_at:
          type: string
          format: date-time
          nullable: true
    CollectionResourceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CollectionResource" }
        next_cursor:
          type: string
          nullable: true
    CollectionPostWrite:
      type: object
      description: |
        The body of `POST /collections/{id}/posts` (#882). Mirrors
        CollectionResourceWrite field for field, because
        `collection_posts` and `collection_resources` carry the same
        membership columns — a reference plus the curator's ordering.

        There is no post-side counterpart of `CollectionResource`: the
        listing returns whole `Post` objects, so the collection page
        renders the same PostCard as browse rather than a second,
        narrower post shape that would drift from it.
      required: [post_id]
      properties:
        post_id: { type: string, format: uuid }
        sort_order: { type: integer, default: 0 }
        pinned: { type: boolean, default: true }
        expires_at:
          type: string
          format: date-time
          nullable: true
    Asset:
      type: object
      description: |
        WITHHELD ASSETS (#899). An asset you cannot OPEN must not hand
        you its metadata. When the caller fails
        `visibility.FieldsReadable` — the conjunction of the row plane
        and the ADR 0064 content plane — this object degrades to a
        placeholder: `restricted` flips to true and the ONLY other keys
        present are `id` and `owner_display_name`.

        The placeholder is deliberately PRESENT rather than 404. ADR 0064
        holds that sensitivity gates content, not rows, so the row stays
        visible; a reader is meant to be able to tell that something is
        there they cannot see, because that is what makes "request
        access" (#881) mean anything.

        ALLOW-LIST, not deny-list. The permitted key set on a withheld
        asset is exactly `id`, `restricted`, `owner_display_name` — an
        identifier the caller already holds, a marker, and the one
        asset-derived value the owner permitted ("the placeholder should
        never leak info. Not even title. Only the owner's name.").
        Everything else is ABSENT, not blanked, so a client cannot tell
        "withheld" from "genuinely empty" and infer from the difference.
        A field added to this schema later is therefore withheld by
        construction rather than by remembering to add it to a list of
        known-sensitive names.

        That key set is the SAME one `PostMember`'s placeholder carries,
        and deliberately so: the field set on this surface must never be
        wider than the field set for the same asset reached through a
        container, or membership becomes the narrower path and the three
        surfaces drift apart again.

        WHY `required` IS SHORT. It used to name sixteen fields, on the
        #595 reasoning that `field?: T` in the frontend types let a
        surface hand-map a narrower object and silently drop the three
        CardThumb needs. That reasoning still holds for a readable
        asset — and it is exactly why absence has to be expressible for
        an unreadable one. A contract that DEMANDS `title` and
        `file_hash` cannot express a payload that withholds them. So
        `required` is now the two keys every asset payload carries at
        every tier, and the client branches on `restricted` (which is
        required, and therefore always present to branch on) before
        reading anything else.
      required: [id, restricted]
      properties:
        id: { type: string, format: uuid }
        restricted:
          type: boolean
          description: |
            True when the caller may not see this asset's columns. Every
            other key except `id` and `owner_display_name` is then
            absent, and the client renders a placeholder tile.

            REQUIRED, so it is always present to branch on: an optional
            marker would read as `undefined` on a withheld payload from
            an older server and fall through to "not restricted", which
            is the wrong default for a security marker.
        owner_display_name:
          type: string
          description: |
            Set only when `restricted` is true: the display name of the
            asset's owner, so the placeholder can say whose work it is
            and #881 can address the request. Absent — not empty — when
            the owner has no resolvable name or the asset is unowned, so
            a client cannot tell "withheld" from "genuinely empty".

            Not carried on a readable asset, which has `owner_user_ref`
            and can resolve the profile itself. `owner_user_ref` is NOT
            carried on a withheld one: the placeholder's allow-list is
            the owner's NAME, and a ref is a second way to ask.
        title: { type: string }
        description: { type: string }
        asset_type: { type: integer, format: int64 }
        owner_user_ref: { type: integer, format: int64, nullable: true }
        status: { type: string, enum: [draft, active, archived] }
        mature:
          type: boolean
          description: |
            This asset carries a MATURE rating (#1115, epic #1114, ADR
            0090).

            ⚠️ A RATING IS NOT A CLEARANCE. `sensitivity` answers who is
            ALLOWED to see this; `mature` answers who has OPTED IN. They
            are orthogonal — a `public` artwork can be mature, and a
            `restricted` one need not be — and a client that treats one
            as a level of the other will get both wrong.

            Whether a disqualified viewer receives this row at all, and
            whether its preview is blurred, are the server's decisions
            (ADR 0090 §3). The flag is here so a client can LABEL what it
            was given, never so it can decide what to hide.
        file_hash: { type: string, nullable: true, description: sha256 of the linked storage object }
        file_extension: { type: string, nullable: true }
        file_size_bytes: { type: integer, format: int64, nullable: true }
        tags:
          type: array
          items: { type: string }
          description: |
            Flat tag value list — backwards-compatible projection
            that pre-1.14.B consumers depend on. New consumers
            prefer `tag_details` below which carries per-tag source
            + confidence + provenance.
        tag_details:
          type: array
          description: |
            Per-tag source/confidence/provenance.
            Same set of tags as `tags`, ordered the same way; this
            field is the typed projection the frontend
            AssetTagBadge renders.
          items:
            $ref: "#/components/schemas/AssetTagDetail"
        metadata:
          type: object
          additionalProperties: true
          description: Free-form JSONB metadata blob (EXIF, custom fields, etc.).
        state_id:
          type: string
          format: uuid
          nullable: true
          description: Optional workflow state (domain = 'asset').
        team_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The team this asset is scoped to, or absent when it has
            none — which is the common case. Set at create time via
            `AssetCreate.team_id` (#953) and not changeable afterwards.

            It is on the FIELD plane, so a withheld asset does not
            carry it: which studio holds a file you may not open is a
            fact about that file.
        processing_status:
          type: string
          enum: [pending, ready, failed]
          description: |
            Post-upload processing pipeline state. `pending` means
            background jobs (variant generation, EXIF extraction,
            etc.) are still in flight — the original file at /file
            is always available, but `/variants/{key}` URLs may
            404 until processing completes. `ready` is the steady
            state. `failed` surfaces in the UI as a retry affordance.
        preview_available:
          type: boolean
          description: |
            True iff a servable `col` thumbnail variant exists for this
            asset AND the caller passes the content plane
            (visibility.CanReadContent, ADR 0064). The client renders the
            thumbnail only when this is true and otherwise shows a
            placeholder WITHOUT requesting bytes — so a content-gated or
            preview-less asset never fires a `/variants/col` (or `/file`)
            request that would 404 and spam the console (#471). A
            restricted asset the caller may not read reads identically to
            "no preview" (false), so this never confirms `restricted`
            (0064-safe).
        ladder_available:
          type: boolean
          description: |
            True iff EVERY variant in the operator's CONFIGURED preview
            ladder exists for this asset AND the caller passes the
            content plane. Same ADR 0064 contract as
            `preview_available`: a restricted asset reports false rather
            than 403, so the flag never confirms `restricted`.

            This is the signal a responsive `srcset` needs.
            `preview_available` promises only `col` — a 320x320 COVER
            crop — so a client that inferred the wider `preview` /
            `screen` / `hires` rungs from it would request bytes that may
            not exist, which is exactly the 404 class #471 removed. With
            no way to ask, the frontend disabled responsive images
            entirely and every card serves a 320px square regardless of
            viewport. This flag is how the client stops guessing.

            THE LADDER IS OPERATOR-CONFIGURABLE, so this is NOT "the four
            default rungs exist". It is computed against
            `sysconfig.GetPreviews`, whose defaults (col/preview/screen/
            hires) are a default and not the contract. An install that
            drops or adds a rung changes what this flag means, which is
            the intent — clients should read the ladder from
            `GET /previews` rather than assuming the default keys.

            Deliberately NOT an alias for `preview_available`. On a
            healthy install the raster pass writes the whole ladder or
            none of it, so today the two are nearly co-extensive; they
            diverge exactly where it matters — assets whose raster pass
            partly failed, and any future partial-ladder state.
        scrub_available:
          type: boolean
          description: |
            True iff a servable `sprites.vtt` cue file exists for this
            asset AND the caller passes the content plane. Same ADR 0064
            contract as `preview_available` — a restricted asset reports
            false rather than 403.

            This is the hover-scrub gate (#835). The card's scrub used to
            be licensed by FILE EXTENSION — "this is an mp4, therefore it
            has a sheet" — which is a guess about storage made from a
            filename. It is wrong in both directions: a video whose
            expensive `preview.video` job has not drained yet has a `col`
            (the cheap poster job, #818) and no sheet, and the card
            requested one anyway and 404'd; and a format that DOES have a
            sheet but was not on the hardcoded list — an animated GIF
            since #832 — could never scrub no matter what was in storage.

            `sprites.vtt` and not `sprites.jpg` because the cue file is
            what the client actually reads: it declares how many cells
            the sheet really contains, which is not cols×rows for a clip
            too short to fill the grid. Both are written together by
            every producer (`preview.video`, `preview.3d`,
            `preview.gif`), so either would answer "is there a sheet",
            but only one answers "can I drive from it".
        thumbhash:
          type: string
          nullable: true
          description: |
            Base64-encoded thumbhash (~30 bytes decoded) for instant
            blurred placeholder rendering on feed cards. Computed
            synchronously at upload for image assets. NULL for
            non-image resources.
        pixel_width:
          type: integer
          format: int32
          nullable: true
          description: |
            Recorded pixel width of the SOURCE image, or null when the
            install has never measured one.

            REQUIRED-but-nullable for the same reason as `thumbhash`
            above: it is a field the card frame reads to decide what a
            tile IS. Masonry sizes each tile from this ratio so the
            space is reserved before the image loads and the wall does
            not reflow as 72 images arrive (#640).

            Not a column on `assets` — the value lives in
            `asset_field_value` under the `pixel_width` field definition
            seeded for #618, and is projected here.

            The quantity is the shape of the image the preview ladder's
            contain rungs are built from, NOT the source file's pixels
            (ADR 0071 §6). For a raster the two coincide with one
            deliberate refinement: the ladder source is the
            EXIF-ROTATED image, so an orientation=6 phone photo reports
            the portrait shape a viewer sees rather than the landscape
            grid stored on disk. For everything with no source pixels at
            all — a 3D model, a font, an audio file, a plain-text
            document — it is the shape of the one image that kind
            produces on its way through the pipeline: a turntable frame,
            a glyph specimen, a waveform, a rendered plate. A 2048x384
            waveform is a 5.33:1 tile and nothing in the `.ogg` says so.

            Null therefore means only "no preview render has recorded a
            shape for this asset yet" — a draft (the render selects
            `status = 'active'`), a kind no preview handler can render
            at all, or an asset whose preview predates #757 and has not
            been re-rendered. The client falls back to measuring the
            image once it loads.
        pixel_height:
          type: integer
          format: int32
          nullable: true
          description: |
            Recorded pixel height of the source image, or null. See
            `pixel_width` — the two are projected as a PAIR, so a
            consumer never has to handle one without the other.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Soft-delete timestamp. Non-null only on rows surfaced by
            the admin `include_deleted=true` listing (the trash view);
            null on live rows.
        deleted_reason:
          type: string
          nullable: true
          description: Optional reason captured at soft-delete time.
        subtitle_tracks:
          type: array
          items: { $ref: '#/components/schemas/SubtitleTrack' }
          description: |
            WebVTT subtitle / caption tracks
            attached to this asset. Empty array when none, or when
            the asset's renderable kind doesn't support subtitles
            (image, 3D, document, etc.). Tracks ride along with the
            asset; they do NOT appear in asset-count queries and do
            NOT federate as standalone activities.
        card_fields:
          type: array
          items: { $ref: '#/components/schemas/CardField' }
          description: |
            The values of the fields an operator marked
            `show_on_card`, already resolved to display strings and in
            the order the field definitions declare (#552).

            Absent or empty when nothing is marked, when this asset
            carries no value for any of them, or on a `restricted`
            placeholder — a card MUST fall back to its own default
            rather than render an empty strip. That fallback is what
            makes the flag a hint: a client that never reads this key
            is plainer, not wrong.

            Only ungated fields can appear, structurally: the schema
            refuses `show_on_card` on a field carrying a
            `read_capability`, so this array cannot become a side door
            around a per-field gate.
        origin:
          allOf:
            - $ref: '#/components/schemas/ContentOrigin'
          nullable: true
          description: |
            The peer this asset came from, or absent/null when it is
            ours. Present so a surface can answer "whose is this?"
            without making remote work look lesser — federated content
            uses the same card, the same viewer and the same display
            hints; what it must not do is arrive unattributed.
        owner:
          allOf:
            - $ref: '#/components/schemas/PostAuthor'
          nullable: true
          description: |
            The renderable identity behind `owner_user_ref` — the
            artist block on an asset card (#1047).

            THE SAME SHAPE AND THE SAME RESOLUTION AS A POST'S AUTHOR,
            because it is literally the same code: `users.LookupAuthors`,
            batched once per page. An asset card that resolved the
            owner client-side would be an N+1 per tile, and worse, it
            would re-derive the display-name ladder in the browser —
            which is how the anonymous rung gets skipped (#1023).

            ABSENT MEANS "NOT DISCLOSED", NOT "NO OWNER". A ref is
            omitted from the lookup when the owner set
            `hide_from_anonymous` and the reader is anonymous (ADR 0024
            / ADR 0070 §3), or when the account is gone. There is no
            redacted entry and no placeholder identity: the card draws
            no artist block at all. Deliberately not a sentinel —
            "someone who opted out owns this" still discloses that they
            own it.

            Absent on a `restricted` placeholder too, which carries
            `owner_display_name` instead: that surface has its own
            allow-list and its own name rule
            (`users.PlaceholderOwnerName`), and a second, wider
            identity object riding the same row would defeat it.
    CardField:
      type: object
      description: |
        One at-a-glance field value on a card (#552). Deliberately a
        DISPLAY shape and not a second AssetFieldValue: the card shows
        one line per field, so the server resolves the vocabulary slug
        to its label here rather than shipping the slug plus a
        resolution map to every tile on a browse page.
      required: [code, label, value]
      properties:
        code: { type: string, description: "The field definition's federation-stable slug." }
        label: { type: string, description: "The operator-facing name, for the caption." }
        value:
          type: string
          description: |
            The value as one line. Never empty — a field with nothing
            on this asset is omitted from the array rather than sent
            blank.
    ContentOrigin:
      type: object
      description: |
        Attribution for content that came from a federated peer.
        `display_name` is the name the operator gave that peer at
        handshake; `instance_url` is where it lives. Never a bare UUID:
        answering "whose is this?" with an identifier answers nothing.
      required: [peer_id, display_name]
      properties:
        peer_id: { type: string, format: uuid }
        display_name: { type: string }
        instance_url: { type: string }
    FeaturedItem:
      type: object
      description: |
        GitHub #341 — one admin-curated featured entry pointing at an
        asset, a collection or a team, with an explicit ordering
        position and the resolved subject title. Assets and collections
        carry thumbnail hints so a tile can render a cover: assets from
        themselves, collections via ADR 0027's hero-card fallback
        (#559). A `team` subject (#1084) resolves its NAME only and
        carries no hints — a team's picture is admissible solely through
        the render-time hero re-check (#982), and resolving it here
        would be a second copy of that rule inside a query whose gates
        are deliberately weaker than the public rail's.
      required: [id, subject_kind, subject_id, position, title, subtitle, preview_available, created_at, ladder_available]
      properties:
        id:
          type: string
          format: uuid
          description: The featured_items row id (used for remove/reorder).
        subject_kind:
          type: string
          description: |
            Must list every value `FeaturedItemInput.subject_kind`
            accepts. It is a separate schema and was the place this was
            nearly missed in #1084: the server would have gone on
            serialising `team` (Go emits the string it holds), while the
            generated client's type narrowed it away and a strict
            response validator rejected the row — a placement the
            operator could see in the database and not in the UI.
          enum: [asset, collection, team]
        subject_id:
          type: string
          format: uuid
        position:
          type: integer
          description: 0-based display order.
        title:
          type: string
          description: |
            Resolved subject title (asset title or collection name).
            Empty when the subject was deleted out from under the row.
        subtitle:
          type: string
          description: |
            The wide card's second line (#1110): the COLLECTION's own
            `description`, empty when it has none — and empty for every
            other subject kind.

            WITHHELD EXACTLY WHEN `title` IS, structurally rather than
            by a second rule. It is selected from the same `c` join
            that produces `title` for a collection subject, and that
            join carries the caller's ADR 0063 collection predicate in
            its ON clause: a collection this caller may not see fails
            to join, contributes neither name nor description, and the
            placement row is then dropped entirely. There is no
            arrangement in which a description arrives without the name
            it belongs to.

            ASSET SUBJECTS CARRY NO SUBTITLE, deliberately. ADR 0020
            makes a non-public asset title-only on this surface — the
            rail already suppresses its thumbnail hints for exactly
            that reason — so sourcing this from `assets.description`
            would widen an embargo tile from "title" to "title and the
            author's notes". #1110 specifies the collection's
            description; the asset half of that widening is not a
            rendering choice this field gets to make.
        item_count:
          type: integer
          nullable: true
          description: |
            How many members of a COLLECTION subject THIS CALLER can
            see — the wide card's subtitle fallback when `subtitle` is
            empty (#1110). Null for every non-collection subject.

            Caller-scoped, not a raw `COUNT(*)`. The membership is the
            same one the mosaic composes from (pinned, unexpired, over
            both `collection_posts` and `collection_resources`), with
            each half gated by the caller's own read predicate — the
            post rule for posts, the asset predicate for resources. A
            bare count would publish the SIZE of the withheld part of a
            public collection, which is the derived-copy leak class
            #902 closed for search text and #1066 closed for
            embeddings, arriving through a subtitle.
        cover_asset_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The asset whose `col` variant renders this tile (#559).

            For an asset subject this is the subject itself. For a
            COLLECTION it is the hero-card fallback of ADR 0027 — the
            most-recent post's cover asset — which is why the id is
            needed separately: `subject_id` is the collection, and the
            variant endpoint is keyed by asset.

            Null when nothing is servable to this caller, in which case
            the tile is title-only. Subject to the same gating as
            `asset_file_hash`, so it never names an asset the caller
            cannot see.
        asset_file_hash:
          type: string
          nullable: true
          description: |
            Thumbnail hint for the tile's cover asset; null when there
            is nothing servable for this caller. Populated for
            collection subjects too since #559.
        preview_available:
          type: boolean
          description: |
            True iff a servable `col` variant exists for the tile's
            cover asset AND the caller passes the content plane (ADR
            0064). The rail renders a thumbnail only when true, else a
            title-only tile with no byte request (#471). Computed from
            live variant existence rather than from a stored flag, which
            is what makes it trustworthy — the `asset_has_image` field
            that used to sit beside this one was the projection of a
            column nothing wrote, and was removed with it in #579.
            Populated for collection subjects too since #559.
        ladder_available:
          type: boolean
          description: |
            True iff every variant in the operator's CONFIGURED preview
            ladder exists for the tile's cover asset AND the caller
            passes the content plane. Identical contract to
            Asset.ladder_available — see there for why this is computed
            from config rather than from the default rung list.
        author:
          $ref: "#/components/schemas/PostAuthor"
          description: |
            The subject's owner, as the promo band's card chip draws it
            (#1118) — the asset's owner for an asset subject, the
            collection's for a collection.

            POPULATED ONLY BY `GET /featured/promo`, and the absence
            elsewhere is a statement rather than an oversight. The
            featured rail's card prints a subtitle, not an author
            (#1110), and a value nothing consumes is a value nothing
            tests; the admin curation list identifies a row by its
            subject id, which is what an operator needs to prune it.

            The name inside is resolved by `users.ResolveDisplayName`
            through `users.LookupAuthors` — the one home of the
            display-name ladder, with its authenticated rung and its
            anonymous arm. It is NOT re-derived per surface: #1023
            exists because that ladder had been transcribed four times
            and three copies were wrong.

            ABSENT — not redacted — for an author who took ADR 0024's
            opt-out and for a hard-deleted account, exactly as on a post
            card. "No author object" means "no name to show", never
            "look it up another way".
        created_at:
          type: string
          format: date-time

    PromoBand:
      type: object
      description: |
        An operator-authored full-width promo strip rendered BETWEEN
        pages of the browse feed (#1118): a headline, a blurb, an
        optional call-to-action, and an ordered row of curated cards.

        THE CARDS ARE ORDINARY PLACEMENTS. They are `featured_items`
        rows carrying this band's id, resolved through the same query,
        the same ADR 0063 predicate splices and the same ADR 0020
        sensitivity and ADR 0090 mature gates as the featured rail — so
        a card pointing at content this caller may not see produces
        nothing at all, and a band is never a way to surface something.

        THE COLLAPSE IS DECIDED SERVER-SIDE. `GET /featured/promo`
        answers with NO band object at all when the install has none,
        when the band is disabled, when it has no headline, or when
        every card filtered away for this reader. That is ADR 0030's
        rule for a banner between content, which is the geometry a
        full-width band has; ADR 0079 §2's "an unfilled slot becomes
        ordinary content" is scoped to IN-GRID sized slots, where
        collapsing would leave a hole in the middle of a wall. Between
        two walls there is no hole to leave.
      required: [id, title, blurb, cta_label, cta_url, enabled, after_page, scope, items]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: |
            The strip's headline. A band with an empty one does not
            render — a button and a blurb with no headline is an
            unfinished draft, not a banner.
        blurb:
          type: string
          description: The short line under the headline. May be empty.
        cta_label:
          type: string
          description: |
            The call-to-action button's text. Empty means the band has
            no button; `cta_label` and `cta_url` are written and
            validated as a PAIR, so one is never present without the
            other.
        cta_url:
          type: string
          description: |
            Where the button goes. Restricted to an absolute `http(s)`
            URL or a site-relative path beginning with a single `/`.

            THIS IS A SECURITY CONSTRAINT, not a formatting one. The
            value becomes an `href` on the browse page of every reader
            the band is shown to, and a `javascript:` URL there is
            stored XSS. A scheme-relative `//host/x` is refused too — a
            reader cannot tell it from a local link. Enforced by the
            handler (a 400) and by a CHECK constraint in migration
            00053 (the backstop).
        enabled:
          type: boolean
          description: |
            The operator's switch. A disabled band is invisible to
            readers — it is filtered out by the query, not returned with
            a flag for a client to honour.
        after_page:
          type: integer
          minimum: 1
          description: |
            Where the band falls, counted in whole feed pages: 1 renders
            it after the first page.

            The PAGE SIZE is the client's (browse requests 36 posts at a
            time), so this is a position in the reader's scroll rather
            than a row count — deliberately, because "after the first
            page" is something an operator can predict without knowing
            the API's limit.
        scope:
          type: string
          enum: [public, org]
          description: |
            THE WHOLE BAND'S AUDIENCE (ADR 0065's placement scopes,
            narrowed to the two a band can hold). `public` includes
            anonymous visitors on an install that has opened its public
            surface; `org` is the signed-in audience.

            It lives on the BAND and not on each card. A band is one
            authored unit with a headline and a button, and "half these
            cards are for logged-out visitors" is not a state an
            operator can hold in their head — nor one worth a
            denormalised copy of a visibility input on every card row.
            A card's own `scope` column is left at its default and is
            never read.
        items:
          type: array
          description: |
            The cards, in curation order, filtered to what THIS caller
            may see. Never empty in a response: a band whose cards all
            filtered away is not returned at all.
          items: { $ref: "#/components/schemas/FeaturedItem" }
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PromoBandInput:
      type: object
      description: |
        The band definition an operator saves (#1118). Every field the
        form owns is written on every save — this is a REPLACE, not a
        PATCH, because a partial write would make "clear the blurb"
        indistinguishable from "leave the blurb alone".
      required: [title]
      properties:
        title: { type: string }
        blurb: { type: string, default: "" }
        cta_label: { type: string, default: "" }
        cta_url:
          type: string
          default: ""
          description: |
            Absolute `http(s)` URL or a site-relative path. See
            `PromoBand.cta_url` — the restriction is a security
            constraint and a `javascript:` value is refused with a 400.
        enabled: { type: boolean, default: false }
        after_page: { type: integer, minimum: 1, default: 1 }
        scope:
          type: string
          enum: [public, org]
          default: org
          description: |
            The band's audience. `org` — the signed-in audience — is the
            default for the same reason `POST /admin/featured` defaults
            to it: publishing to anonymous visitors is a deliberate act,
            not the shape you get by leaving a field out.

    PromoBandItemInput:
      type: object
      description: |
        A card to add to the band (#1118).

        NO `scope`, deliberately. A band card takes its audience from
        its band, and accepting one here would store a value that looks
        authoritative and is never read — an operator setting a card to
        `public`, seeing it stored, and believing they had widened the
        band. `POST /admin/featured` refuses the combination for the
        same reason.

        NO `team` kind either. A team tile belongs to the signed-in
        teams rail (`GET /featured/teams`), whose render-time hero
        re-check (#982) is the only admissible route to a team's
        picture; the band renders covers, so it takes the two subject
        kinds that resolve one.
      required: [subject_kind, subject_id]
      properties:
        subject_kind:
          type: string
          enum: [asset, collection]
        subject_id:
          type: string
          format: uuid

    FeaturedItemInput:
      type: object
      description: |
        GitHub #341 — payload to feature an asset, a collection or a
        team.
      required: [subject_kind, subject_id]
      properties:
        subject_kind:
          type: string
          description: |
            `team` was added by #1084. The admissible list is restated in
            the handler's validation and in the
            `featured_items_subject_kind_check` database constraint
            (migration 00048); all three move together, because a value
            missing here is one the generated client will not send at
            all.
          enum: [asset, collection, team]
        subject_id:
          type: string
          format: uuid
        position:
          type: integer
          nullable: true
          description: |
            Optional insertion position. Omit / null to append to the
            end of the list.
        scope:
          type: string
          enum: [org, public]
          default: org
          description: |
            The placement's AUDIENCE (#1104). `scope` decides who may
            see the featuring; it does not decide which surface renders
            it. A reader shows every audience its viewer qualifies for:
            signed-in readers see `org` and `public`, anonymous readers
            see `public` only.

            Omit for `org`, the internal signed-in audience and the
            audience every write produced before this property existed.
            `public` includes anonymous visitors and is the deliberate
            act; both are gated on `system.admin`, which is the
            capability the whole endpoint already requires.

            `team` is a valid value of the underlying column and is
            deliberately not offered here: a team placement also needs a
            team id, which this payload has no way to name, and no
            reader consumes that audience yet.

    ResourceRequest:
      type: object
      description: |
        A resource_request row. The state machine
        is pending → granted / denied (admin decision); granted
        → expired (CapabilitySweeper cascade). Terminal states
        admit no further transitions.
      required: [id, requester_user_ref, target_kind, target_id, requested_capability, state, requested_at]
      properties:
        id:
          type: string
          format: uuid
        requester_user_ref:
          type: integer
          format: int64
        target_kind:
          type: string
          enum: [asset, post, collection]
          description: |
            Which table `target_id` refers to. Access requests (#881)
            are always `asset`; restoration appeals (#931) may name any
            of the three soft-deletable kinds.
        target_id:
          type: string
          format: uuid
          description: |
            The requested object, in the table named by `target_kind`.
            Called `target_asset_id` before #931, when the workflow
            could only ever name an asset.
        requested_capability:
          type: string
          description: |
            The capability code this request names. Two of them are
            inert markers that confer nothing and exist only to TYPE
            the row for its decide gate:

            * `content.access.request` — "may I see this asset" (#881).
              Decidable by the asset's owner, `share.grant`, or
              `system.admin`.
            * `content.restore.request` — "please undo this delete"
              (#931). Decidable ONLY by whoever deleted the target, or
              by `system.admin`. `share.grant` does not qualify:
              authority over sharing is not authority over moderation.
              Granting one performs the restore; it writes no
              capability grant.
        decidable_by_caller:
          type: boolean
          description: |
            True when THIS caller may decide THIS row right now,
            computed by the same gate the decide endpoint applies.
            Populated on the queue listings (`/admin/requests`,
            `/account/requests/incoming`) and absent elsewhere.

            It exists because the two queues have different gates and
            the admin queue is readable by people who cannot act on
            every row it contains: `share.grant` sees restoration
            appeals but may not decide them. Rendering a decide control
            from row presence alone would offer a button that 403s.
        reason:
          type: string
        state:
          type: string
          enum: [pending, granted, denied, expired]
        decided_at:
          type: string
          format: date-time
          nullable: true
        decided_by_user_ref:
          type: integer
          format: int64
          nullable: true
        decision_reason:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: |
            On granted requests, the linked grant's auto-expiry.
            Null means permanent.
        requested_at:
          type: string
          format: date-time

    SubtitleTrack:
      type: object
      required: [lang, file_hash, source_format, confidence]
      description: |
        One WebVTT subtitle track attached to an
        asset. NOT a first-class asset; rides along with its parent
        in the Asset.subtitle_tracks array. Tracks are uniquely
        identified by (asset_id, lang) — re-uploading the same lang
        replaces the existing row rather than creating a duplicate.
      properties:
        lang:
          type: string
          description: |
            RFC 5646 / BCP 47 language tag (e.g. "en", "en-US",
            "ja", "fr-CA"). The sentinel value "und" is reserved
            for sidecar files that matched by basename but had no
            inferrable language segment.
        label:
          type: string
          description: |
            Optional human-readable label ("English (US)",
            "Forced", "Director's commentary"). Empty string when
            not provided; never null.
        file_hash:
          type: string
          description: CAS hash of the stored WebVTT file.
        source_format:
          type: string
          enum: [vtt, srt, ssa, ass, sub, idx]
          description: |
            The format the track was uploaded in. The conversion
            worker stores WebVTT regardless; tracking the source
            lets operators re-convert if a converter bug surfaces.
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: |
            1.0 for text-based sources (deterministic conversion).
            <1.0 for OCR'd bitmap sources like IDX (DVD subtitles).
            UI MAY surface a warning banner below 0.8.
        created_at:
          type: string
          format: date-time

    AssetWithDedup:
      type: object
      description: |
        Asset payload extended with
        a `duplicate_warning` field. Returned from POST /assets
        with HTTP 200 when the operator's `upload.dedup_behavior`
        is `warn` and a duplicate hash was detected: the EXISTING
        asset row is returned (no new asset created), and the
        field signals the UI to surface a "this file was already
        uploaded as X" dialog.
      allOf:
        - $ref: "#/components/schemas/Asset"
        - type: object
          required: [duplicate_warning]
          properties:
            duplicate_warning:
              type: object
              required: [existing_asset_id, message]
              properties:
                existing_asset_id:
                  type: string
                  format: uuid
                  description: |
                    The asset id the caller is being redirected
                    to (same as `id` at the top level — duplicated
                    here so client code can branch on the
                    presence of `duplicate_warning` without
                    re-reading the top-level id).
                message:
                  type: string
                  description: |
                    Human-readable warning surfaced in the UI
                    dedup dialog.

    UploadConflict:
      type: object
      description: |
        409 response shape returned
        from POST /assets when `upload.dedup_behavior` is `block`
        and a duplicate hash was detected. The caller is expected
        to either navigate to the existing asset or change their
        upload.
      required: [error, existing_asset_id]
      properties:
        error:
          type: string
          description: Human-readable error message.
        existing_asset_id:
          type: string
          format: uuid
          description: |
            The asset id the duplicate hash already maps to.

    AssetCreate:
      type: object
      required: [title, asset_type]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string }
        asset_type: { type: integer, format: int64 }
        status:
          type: string
          enum: [draft, active, archived]
          default: active
        mature:
          type: boolean
          description: |
            Self-label this asset as MATURE (#1115, ADR 0090). One
            checkbox, default `false` — the minimal-friction bar the
            upload flow is held to.

            ⚠️ REFUSED WITH 400 WHEN THE INSTANCE DISALLOWS MATURE
            CONTENT. Not accepted-and-ignored: an accepted-but-inert
            write is how a library fills with flags nothing enforces,
            and the uploader would have no way to learn their label did
            not take. Sending `false` is always accepted, on any
            instance — refusing a write that asserts nothing would break
            every client that sends the whole object.

            Orthogonal to `sensitivity`, which answers a different
            question; setting one says nothing about the other.
        file_hash:
          type: string
          nullable: true
          description: |
            sha256 of a previously uploaded storage object. When set,
            the storage layer is re-pinned under `asset:<new-id>` and
            the caller's `user:` pin (from the prior upload) is
            dropped.
        file_extension: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string, minLength: 1, maxLength: 64 }
        metadata:
          type: object
          additionalProperties: true
        state_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Optional workflow state. Must reference a row in
            `workflow_state` whose `domain = 'asset'`. When omitted,
            the asset is placed in the `asset` domain's initial state
            (or NULL if the domain has none).
        team_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Optional — scope the asset to a team (#953). Mirrors
            `PostCreate.team_id`, and is gated by the same rule: you
            may assign to a team you are a DIRECT MEMBER of, one you
            hold a team-scoped `assets.admin` over (closure-expanded,
            so a grant on a parent team reaches its descendants), or
            any team if you hold `system.admin`.

            `team_id` is an authorization input, not a label. It is the
            scope a team-scoped `assets.admin` grant matches against,
            and at `sensitivity = 'team'` it is what makes the asset
            readable by that team — so assigning is a disclosure act.

            A team you may not assign to answers **404 `team not
            found`**, byte-identical to a team that does not exist, so
            this endpoint cannot be used to enumerate the instance's
            teams. Reassignment after creation is deliberately NOT
            offered: `AssetUpdate` carries no `team_id`.
    AssetUpdate:
      type: object
      description: |
        Partial update; only fields present are touched. Tag arrays
        REPLACE the full tag set when supplied (use the /tags
        sub-resource for additive ops).
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string }
        status:
          type: string
          enum: [draft, active, archived]
        mature:
          type: boolean
          description: |
            Set or clear this asset's MATURE rating (#1115, ADR 0090).
            PATCH semantics: absent leaves the flag as it is, which is
            what makes the operator override and the artist's own edit
            the same field on the same endpoint.

            ⚠️ Setting it to `true` is REFUSED WITH 400 when the
            instance disallows mature content — see AssetCreate for why
            the refusal is loud. Clearing it (`false`) is always
            accepted, including on a disallowing instance: an operator
            who has just switched the feature off must still be able to
            unmark what was marked while it was on.
        tags:
          type: array
          items: { type: string, minLength: 1, maxLength: 64 }
        metadata:
          type: object
          additionalProperties: true
        if_unchanged_since:
          type: string
          format: date-time
          description: |
            Optimistic-concurrency guard. When set, the
            server returns 409 Conflict if the asset's `updated_at`
            timestamp has advanced past this value (i.e. someone
            else edited the row between your GET and your PATCH).
            Omit to opt out of the check (legacy behaviour: last
            write wins).

    EditConflict:
      type: object
      description: |
        Returned with HTTP 409 when an optimistic-concurrency check
        fails. Carries the row's current `updated_at` so the
        client can decide whether to reload + retry or surface a
        diff UI.
      required: [error, updated_at]
      properties:
        error:
          type: string
          description: Human-readable summary (e.g. "asset was edited by someone else").
        updated_at:
          type: string
          format: date-time
          description: The current `updated_at` on the row (server-authoritative).
    SoftDeleteRequest:
      type: object
      description: |
        Optional body on DELETE endpoints that soft-delete an entity.
        The `reason` free-text string is captured verbatim into the
        entity's `deleted_reason` column so admin recovery-window
        audits carry operator context.

        The body itself is optional — a bare DELETE with no body is
        still valid + writes `deleted_reason` = NULL. When present,
        an empty-string `reason` is treated the same as missing.
      properties:
        reason:
          type: string
          maxLength: 500
          description: |
            Free-text explanation of why the entity was deleted.
            Max 500 characters; validated at the handler.
    AssetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Asset" }
        next_cursor:
          type: string
          nullable: true
          description: |
            Pass back as the `cursor` query param to fetch the next
            page. null when the current page is the last.
    AssetTagDetail:
      type: object
      required: [value, source]
      description: |
        One tag with full source/confidence/provenance metadata.
        Backs the per-source UI badge.
      properties:
        value:
          type: string
          description: The tag value itself (e.g. "kittens").
        source:
          type: string
          enum: [manual, ai, import]
          description: |
            Where the tag came from. `manual` = operator typed it
            in the UI; `ai` = generated by an AI tag job;
            `import` = bulk CSV / EXIF / upstream system. AI runs
            never overwrite manual or import rows.
        confidence:
          type: number
          format: double
          nullable: true
          description: |
            Provider-supplied confidence in [0, 1] when source='ai';
            null for manual and import tags. UI filter threshold
            lives in ai.tag.confidence_threshold (default 0.5).
        created_by_provider:
          type: string
          nullable: true
          description: Provider slug (openai / claude / ollama) for source='ai'.
        created_by_model:
          type: string
          nullable: true
          description: Model identifier (gpt-4o / claude-3-5-sonnet) for source='ai'.
    SimilarAsset:
      type: object
      required: [asset, distance]
      description: |
        One nearest-neighbour from /assets/{id}/similar.
        `asset` is the standard Asset projection; `distance` is the
        cosine distance to the anchor — lower = more similar.
      properties:
        asset: { $ref: "#/components/schemas/Asset" }
        distance:
          type: number
          format: double
          description: |
            Cosine distance in [0, 2]. 0 = identical vector,
            1 = orthogonal, 2 = opposite. Frontend typically clamps
            visible suggestions to distance < 1.0.
    SimilarAssets:
      type: object
      required: [results, anchor_has_embedding]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/SimilarAsset" }
        anchor_has_embedding:
          type: boolean
          description: |
            False when the anchor asset hasn't been embedded yet
            (ai.embed job hasn't run or asset has no embeddable
            text). UI uses this to disambiguate the empty `results`
            array: "embedding pending" vs "no similar assets exist".
    Post:
      type: object
      description: |
        Feed entity. Wraps 1+ assets with descriptive metadata. The
        `members` array is the ordered list of assets in the post;
        `cover_asset_id` is the one shown in feed/grid cards.
      required:
        [id, author_user_ref, title, description, visibility,
         posted_at, like_count, comment_count, tags, members,
         created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        author_user_ref: { type: integer, format: int64 }
        author:
          allOf: [{ $ref: "#/components/schemas/PostAuthor" }]
          nullable: true
          description: |
            The renderable identity behind `author_user_ref` (#557).

            WHY IT IS ON THE POST. A feed card carries an author
            header, and a page is ~20 cards. Resolving each one
            through `GET /users/{ref}` is twenty profile round trips
            per page — a permanent tax on the hottest surface in the
            app, and there is no batch user endpoint outside admin.
            So the identity travels WITH the post, resolved once per
            page for the distinct set of authors on it.

            ABSENT MEANS "NOT DISCLOSED", NOT "NO AUTHOR". Every post
            has an author — `author_user_ref` is required and always
            present. This object is omitted when the caller is not
            entitled to the identity behind that ref:

              * the author set `hide_from_anonymous` and the caller is
                anonymous (ADR 0070 §3 / ADR 0024's opt-out). The
                author's own profile 404s for this caller, so putting
                their name and face on a card would be that opt-out
                defeated by a JOIN.
              * the `user` row is gone (a hard-deleted account).

            There is deliberately NO placeholder identity. "Someone
            who opted out posted this" still discloses that they
            posted; the card renders with no author header instead.

            PER-CALLER, THEREFORE NOT CACHED. Like
            `members[].preview_available` (#471) and `restricted`
            (#883), this is derived per request from the caller's
            identity and never written into the cross-caller post
            cache. See posts.enrichAuthors.
        title: { type: string }
        description: { type: string }
        visibility:
          type: string
          enum: [private, org-only, followers, explicit-share]
        cover_asset_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Pointer to one of `members[].asset_id` — the chosen cover.
            Defaults to `members[0].asset_id` when not set explicitly.
        cover_thumbnail_asset_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Optional standalone thumbnail asset, NOT a member of the
            post. Used when the uploader wants a different image as
            the feed thumbnail than any of the post's assets (e.g. a
            cropped detail or an entirely separate cover image). When
            set, the feed card prefers this asset's variants over
            `cover_asset_id`.
        state_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Optional workflow state. Must reference a row in
            `workflow_state` whose `domain = 'post'`. NULL = no
            workflow tracking on this post.
        posted_at: { type: string, format: date-time }
        like_count: { type: integer, format: int64 }
        liked:
          type: boolean
          description: |
            Whether THIS caller has liked this post. Always false for
            an anonymous caller, who has no identity to have liked
            with.

            Shipped with the feed card (#557) for the same reason
            `author` is, and it is the same round-trip arithmetic:
            `GET /posts/{id}/like` answers this for one post, and a
            feed card needs it for twenty. Without it the heart on
            every card is drawn unfilled until clicked — a control
            that lies about the reader's own state — or the page
            issues one request per card to find out.

            PER-CALLER, therefore derived after the post cache and
            never written into it. See posts.enrichLiked.
        comment_count: { type: integer, format: int64 }
        comments_preview:
          type: array
          items: { $ref: "#/components/schemas/PostCommentPreview" }
          description: |
            The head of this post's thread — the newest `N` TOP-LEVEL
            comments, newest first, where N is small and fixed
            (posts.TopCommentsPerPost). The feed card prints them under
            the description and links to the post for the rest (#1047).

            THE HEAD OF THE THREAD, not a summary of it. The ordering
            and the predicates are the ones `GET /posts/{id}/comments`
            already applies to its thread roots — newest first, no
            replies, no soft-deleted rows — so the preview is literally
            the top of what opening the post shows, and there is no
            second notion of "which comments matter" to keep in step.

            Absent or empty when the post has no comments. A client that
            ignores it renders the card it rendered before, with the
            comment COUNT it always had.

            VISIBILITY. This rides a post the caller has already been
            granted by `postReadableExpr` — the list query's own gate —
            so the preview inherits it and adds nothing. It is
            deliberately NOT built by calling the comments endpoint per
            post: that would be an N+1, and (see #1047's handoff) that
            endpoint's own gate is weaker than the feed's.

            The commenter's identity is resolved by
            `users.LookupAuthors`, the same expression the post's own
            `author` uses, so the ADR 0024 opt-out holds here too: a
            commenter who hid from anonymous readers has NO `author`
            object on their preview entry for an anonymous caller. Their
            words still appear, exactly as an opted-out author's POST
            still appears — the opt-out is about the identity, not the
            content, and treating it otherwise would silently delete
            people's comments from the feed.
        tags:
          type: array
          items: { type: string }
        members:
          type: array
          items: { $ref: "#/components/schemas/PostMember" }
        origin_server_id:
          type: string
          format: uuid
          nullable: true
        origin:
          allOf: [{ $ref: "#/components/schemas/ContentOrigin" }]
          nullable: true
          description: |
            The peer this post came from, or absent when it is ours —
            the post-level twin of `Asset.origin` (#552), added with
            the feed card (#557).

            `origin_server_id` has always been on this schema and is
            not enough on its own: it is a bare UUID, and answering
            "whose is this?" with an identifier answers nothing. A
            feed card attributes remote work by the name the operator
            gave the peer at handshake, in the same card and the same
            layout local work uses. Federated content is not lesser;
            what it must not be is unattributed.
        team_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Optional team scope (ADR 0010 Layer 5). When set, team-
            scoped capability checks apply: callers who hold
            `posts.read` scoped to this team or any ancestor team
            can see the post regardless of visibility. NULL = no
            team scope; only visibility / role / ACL gates apply.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Soft-delete timestamp. Non-null only on rows surfaced by
            the admin `include_deleted=true` listing (the trash view);
            null on live rows.
        deleted_reason:
          type: string
          nullable: true
          description: Optional reason captured at soft-delete time.
    PostCommentPreview:
      type: object
      description: |
        One comment as a feed card shows it (#1047) — a name, a line of
        text, and when.

        ALLOW-LIST, NOT A TRIMMED `Comment`. The server BUILDS this
        object from four named columns rather than building the full
        comment and deleting fields from it, so a column added to
        `comments` later — a moderation note, an annotation payload, an
        actor URI — is withheld from the feed because it was never
        fetched. Same discipline as `PostAuthor` and `PostMember`'s
        placeholder.

        Notably ABSENT, and deliberately: `body_html`, `like_count`,
        `parent_id` / `root_id` / `depth`, `edited_at`,
        `annotation_type` / `annotation_data`. A preview is two lines
        under a picture; threading, reactions and review annotations are
        what opening the post is for.

        `body` and not `body_html`: the card clamps this to a couple of
        lines of plain text, and shipping server-rendered markup to be
        truncated by CSS would mean either rendering HTML in a card that
        has no business rendering it, or clipping mid-tag.
      required: [id, body, created_at]
      properties:
        id: { type: string, format: uuid }
        body:
          type: string
          description: |
            The comment's plain text, as written. Untruncated — the card
            clamps it, because how many lines fit is a question about
            the card and not about the comment.
        created_at: { type: string, format: date-time }
        author:
          allOf: [{ $ref: "#/components/schemas/PostAuthor" }]
          nullable: true
          description: |
            The commenter, when they are disclosed to this caller.

            ABSENT MEANS "NOT DISCLOSED", NOT "NO COMMENTER", and the
            three ways it happens are all correct as an absence: the
            commenter set `hide_from_anonymous` and the reader is
            anonymous (ADR 0024 / ADR 0070 §3), the account is gone, or
            the comment came from a FEDERATION PEER and has no local
            user at all — see `remote_display_name`.
        remote_display_name:
          type: string
          nullable: true
          description: |
            For a comment that arrived from a paired peer: the remote
            actor's cached display name, resolved from
            `federation_remote_actors` exactly as the thread endpoint
            resolves it. Absent on locally-authored comments, which
            carry `author` instead.

            May be empty when the peer has shipped no display hints
            yet — the same caveat `Comment.display_name` carries — in
            which case the card prints no name rather than inventing
            one from the actor URI.
    PostAuthor:
      type: object
      description: |
        The renderable identity of a post's author (#557) — exactly
        what a feed card's author header draws and nothing else.

        ALLOW-LIST, NOT DENY-LIST. This is a purpose-built shape, not
        a trimmed `UserPublic`, and that is the point: the server
        BUILDS the permitted object rather than building the full one
        and deleting fields from it. A field added to the user or
        profile row later is therefore withheld by construction
        instead of by someone remembering to strip it — the same
        discipline `PostMember`'s restricted placeholder and
        `ActivityEvent` apply.

        Notably ABSENT, and deliberately: `fullname`, `bio`,
        `location`, `website_url`, `social_links`, `language`,
        `theme`, `member_since`, `post_count`. A card header needs a
        face, a name and somewhere to click. Everything else is what
        the profile page is for, and that page answers with its own
        gate.
      required: [ref, username, display_name]
      properties:
        ref: { type: integer, format: int64 }
        username:
          type: string
          description: |
            The handle. Also the profile link target
            (`/users/by-username/{username}`).
        display_name:
          type: string
          description: |
            Resolved display string ready to render — never empty.

            RESOLUTION IS CALLER-DEPENDENT and matches `UserPublic`'s
            exactly, because it is literally the same expression
            (`users.ResolveDisplayName`):

              authenticated: profile.display_name → user.fullname → username
              anonymous:     profile.display_name → username

            The anonymous rung skips `fullname` on purpose. Real name
            is authenticated-only (ADR 0070 §3), and a display-name
            fallback that reaches it would be that rule defeated by a
            COALESCE.
        avatar_url:
          type: string
          nullable: true
          description: |
            Null for users with no uploaded avatar; the card renders
            a generated initials disc in that case.
    PostMember:
      type: object
      description: |
        An asset attached to a post, with its sort_order in the
        carousel and the asset payload joined-in to avoid an N+1.

        RESTRICTED MEMBERS (#883). A post's author can attach an asset
        that the *reader* is not entitled to — their own restricted
        work, or (once #882 lands) someone else's. Membership must never
        WIDEN an item, so when the reader fails
        `visibility.FieldsReadable` this object degrades to a
        placeholder: `restricted` flips to true, `asset` is ABSENT, and
        the only thing carried across from the asset row is
        `owner_display_name`.

        The placeholder is deliberately PRESENT rather than dropped from
        the array. A reader is meant to be able to tell that something is
        there they cannot see — that is what makes "request access"
        (#881) meaningful, and silently omitting the member would hide
        the restriction instead of stating it.

        ALLOW-LIST, not deny-list. The permitted key set on a restricted
        member is exactly `asset_id`, `sort_order`, `restricted`,
        `owner_display_name` — the `post_assets` row's own columns plus a
        marker plus the one asset-derived value the owner permitted. NO
        column of `assets` crosses this boundary. A field added to
        `Asset` later is therefore withheld by construction rather than
        by remembering to add it to a list of known-sensitive names.
      required: [asset_id, sort_order, restricted]
      properties:
        asset_id: { type: string, format: uuid }
        sort_order: { type: integer }
        restricted:
          type: boolean
          description: |
            True when the caller may not see this member. `asset` is then
            absent and the client renders a placeholder tile.
        owner_display_name:
          type: string
          description: |
            Set only when `restricted` is true: the display name of the
            asset's owner, so the placeholder can say whose work it is
            and #881 can address the request. Absent — not empty — when
            the owner has no resolvable name or the asset is unowned, so
            a client cannot tell "withheld" from "genuinely empty".
        asset:
          allOf: [{ $ref: "#/components/schemas/Asset" }]
          description: |
            ABSENT when `restricted` is true. Present, and complete, in
            every other case.
    PostCreate:
      type: object
      required: [members]
      properties:
        title: { type: string, maxLength: 500 }
        description: { type: string }
        visibility:
          type: string
          enum: [private, org-only, followers, explicit-share]
          default: public
        cover_asset_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Defaults to members[0].asset_id when omitted.
        cover_thumbnail_asset_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Optional standalone thumbnail asset (not a post member).
            Useful for "upload a custom cover" UX in the upload modal.
        state_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Optional workflow state, domain = 'post'. When omitted the
            post is placed in the post domain's initial state, or NULL
            if no initial state is configured.
        members:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PostAssetWrite" }
        tags:
          type: array
          items: { type: string, minLength: 1, maxLength: 64 }
        collection_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Optional — when set, the new post is added to this
            collection at create time. Used by the context-aware
            upload modal: dropping into /collections/{id} sets this.
        team_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Optional — scope the post to a team. The upload modal
            will set this to the user's currently-selected team
            when one is active.
    PostUpdate:
      type: object
      description: Partial update; only present fields are touched.
      properties:
        title: { type: string, maxLength: 500 }
        description: { type: string }
        visibility:
          type: string
          enum: [private, org-only, followers, explicit-share]
        cover_asset_id:
          type: string
          format: uuid
          nullable: true
        cover_thumbnail_asset_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Standalone cover thumbnail (not a post member). Gated on
            content-readability exactly as `cover_asset_id` is: an
            asset the caller cannot read is refused with the SAME 404
            a nonexistent one gets, so this field cannot be used to
            probe which asset UUIDs exist.

            Before #946 this property was declared here and silently
            dropped by the handler — the request answered 200 and the
            column was unchanged.
        state_id:
          type: string
          format: uuid
          nullable: true
        tags:
          type: array
          items: { type: string, minLength: 1, maxLength: 64 }
        if_unchanged_since:
          type: string
          format: date-time
          description: |
            Optimistic-concurrency guard. When set, the
            server returns 409 EditConflict if the post's
            `updated_at` has advanced past this value. Omit to
            opt out of the check (legacy behaviour).
    PostAssetWrite:
      type: object
      required: [asset_id]
      properties:
        asset_id: { type: string, format: uuid }
        sort_order: { type: integer, default: 0 }
    PostList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Post" }
        next_cursor:
          type: string
          nullable: true

    # ── Background-job queue schemas.
    Job:
      type: object
      required:
        [id, type, status, priority, attempts, max_attempts,
         enqueued_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, example: preview.raster }
        payload:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [pending, running, done, failed, cancelled]
        priority: { type: integer }
        attempts: { type: integer }
        max_attempts: { type: integer }
        claimed_by: { type: string, nullable: true }
        claimed_at: { type: string, format: date-time, nullable: true }
        lease_expires_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, nullable: true }
        result:
          type: object
          additionalProperties: true
          nullable: true
        origin_server_id:
          type: string
          format: uuid
          nullable: true
        scheduled_for: { type: string, format: date-time, nullable: true }
        enqueued_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
    JobClaim:
      type: object
      required: [id, type, payload, attempts, max_attempts, lease_seconds]
      description: |
        Trimmed view of a Job that workers actually need to execute
        the work. `lease_seconds` tells the worker how often to
        heartbeat before the watchdog reclaims the job.
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        payload:
          type: object
          additionalProperties: true
        attempts: { type: integer }
        max_attempts: { type: integer }
        lease_seconds: { type: integer }
    JobClaimRequest:
      type: object
      description: |
        Body for POST /jobs/claim. `types` is the allowlist of job
        types this worker is willing to run; omit to claim any.
        `worker_id` is a stable string the server records in
        `claimed_by` for diagnostic tracing.
      properties:
        types:
          type: array
          items: { type: string }
        limit:
          type: integer
          minimum: 1
          maximum: 25
          default: 1
        worker_id:
          type: string
          minLength: 1
          maxLength: 200
    JobClaimResponse:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items: { $ref: "#/components/schemas/JobClaim" }
    WorkerIdentity:
      type: object
      required: [worker_id]
      description: Body for heartbeat; identifies the worker holding the lease.
      properties:
        worker_id:
          type: string
          minLength: 1
          maxLength: 200
    JobCompleteRequest:
      type: object
      required: [worker_id]
      properties:
        worker_id:
          type: string
          minLength: 1
          maxLength: 200
        result:
          type: object
          additionalProperties: true
          nullable: true
    JobFailRequest:
      type: object
      required: [worker_id, error]
      properties:
        worker_id:
          type: string
          minLength: 1
          maxLength: 200
        error:
          type: string
        terminal:
          type: boolean
          default: false

    Team:
      type: object
      required: [id, slug, name, description, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        slug:
          type: string
          description: |
            URL-friendly identifier, unique per origin server. Used in
            display and (eventually) federation actor URIs.
          maxLength: 80
          example: aurora-rnd
        name:
          type: string
          maxLength: 200
          example: Aurora R&D
        description:
          type: string
          maxLength: 500
        origin_server_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Set on rows mirroring a federated team. NULL = locally
            owned.
        hero_asset_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The team's picture (#982) — fetch it from
            `/assets/{hero_asset_id}/variants/col`. NULL means the
            client falls back to the team's initials tile.

            THIS IS THE RENDER ANSWER, NOT THE STORED SETTING. The
            server re-derives it on every read, and it is absent
            whenever the chosen asset no longer qualifies: set to
            `restricted`, moved to another team, soft-deleted, or still
            missing its `col` rendition. The stored pointer survives all
            of those, so restoring the asset brings the picture back
            without an admin re-picking it — but until then the wire
            says "no hero" and the client paints initials.

            One field rather than the setting/render pair `Collection`
            carries, because the two cannot disagree PER READER here.
            ADR 0088 gates a representative image per viewer; #982
            narrows that for a team, because the followed-teams rail is
            a navigation strip and a strip that shows some teams'
            pictures and not others depending on who is looking is noise
            rather than security. A team hero is admissible only if it
            is `public` AND owned by that team — visible to everyone or
            to no one — so a single field cannot be misread.

            It does NOT federate: a local asset id names something that
            exists only on this server.
        parents:
          type: array
          description: |
            Direct parent teams (single hop). Empty for root teams.
            Closure-walked ancestors live behind the listTeams
            `ancestor` filter; this field is just the edges out of
            the current node.
          items: { $ref: "#/components/schemas/TeamParentLink" }
        member_count:
          type: integer
          format: int64
          description: |
            Direct memberships. Present on `listTeams` — the directory
            card shows it (#684) — and ABSENT from `getTeam`.

            The asymmetry is deliberate and is about staleness, not
            taste. `getTeam` reads through an LRU that only the
            team-row and parent-edge endpoints invalidate; adding a
            membership does not, and never needed to, because nothing
            membership-shaped was cached. A count served from that
            entry would go stale the first time somebody joined. The
            list path is uncached, so it can carry the number honestly.

            A team page that wants the count reads
            `GET /teams/{id}/members`, which it already fetches for the
            member strip.
        content_count:
          type: integer
          format: int64
          description: |
            Live (non-soft-deleted) assets carrying this team_id — the
            directory card's "how much is in here" hint (#684). Present
            on `listTeams` only, for the same caching reason as
            `member_count`.

            NOT visibility-filtered, deliberately. It counts assets
            whose fields the caller may not read. That discloses
            nothing new: this operation needs `teams.read`, so the
            caller is signed in, and the authenticated asset predicate
            already hands them restricted rows as placeholders — the
            same number is reachable by paging
            `/assets?team_id=X`. Filtering it would make the card
            disagree with the page it links to.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TeamParentLink:
      type: object
      required: [parent_id]
      properties:
        parent_id: { type: string, format: uuid }
        parent_slug: { type: string }
        parent_name: { type: string }

    TeamCreate:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 80
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 500
        parent_ids:
          type: array
          items: { type: string, format: uuid }
          description: |
            Optional list of teams to link as parents. Each insert
            fires the cycle-rejection trigger; the first one that
            would close a cycle returns 409.

    TeamUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 500

    TeamHeroUpdate:
      type: object
      description: |
        Choose or clear a team's hero picture (#982). Exactly one of the
        two properties must be present — an empty body is a 400 rather
        than a no-op, because a request that says nothing about a
        single-valued endpoint is a client bug, not an instruction.
      properties:
        asset_id:
          type: string
          format: uuid
          description: |
            The asset to use as this team's picture. Must be
            `sensitivity: public` AND carry this team's `team_id`; any
            other asset — including one that does not exist — is
            refused with the same 400.

            Not `nullable`: sending null to mean "remove" is exactly the
            shape that stops working the moment the Go field is a
            pointer with `omitempty`, because absent and null collapse
            before the handler sees them. Removal is `clear_hero`.
        clear_hero:
          type: boolean
          description: |
            Remove the chosen picture, reverting the team to its
            initials tile. Mutually exclusive with `asset_id` — sending
            both is a 400, rather than the server picking one and
            silently discarding the other.

            Same shape, and the same reasoning, as `clear_cover` on
            `CollectionUpdate` and `clear_expires_at` before it.

    TeamList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Team" }
        next_cursor:
          type: string
          nullable: true

    AdminUser:
      type: object
      description: |
        Admin-projection of a user row. Carries everything the
        admin list table needs — username, email, status, last
        activity, primary role — without surfacing password-bearing
        columns. `status` maps to the underlying user.approved
        column (1=active, 0=pending, 2=disabled per the lifecycle
        state machine). `primary_role` is the user's
        alphabetically-first global role assignment; per-team
        assignments live on the user detail page.
      required: [ref, username, display_name, status, created_at]
      properties:
        ref: { type: integer, format: int64 }
        username: { type: string }
        fullname:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        display_name:
          type: string
          description: Resolved display string (profile.display_name → fullname → username).
        avatar_url:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, pending, disabled, archived]
        primary_role:
          type: string
          description: Empty when the user has no global role assigned.
        created_at:
          type: string
          format: date-time
        last_active:
          type: string
          format: date-time
          nullable: true
        account_expires:
          type: string
          format: date-time
          nullable: true
          description: Hard expiry enforced at login; null = no expiry.
        lockout_until:
          type: string
          format: date-time
          nullable: true
          description: |
            Per-username lockout deadline. Null when the
            account has never been locked OR the last lockout has
            been cleared. Values in the past are semantically
            "unlocked" (auto-clear happens at read time; the stale
            timestamp stays until the next failed login OR admin
            unlock). The frontend renders the "Locked (auto-clears
            at HH:MM)" badge when this > now().
        failed_login_count:
          type: integer
          format: int32
          description: |
            Running count of consecutive failed
            login attempts. Zero on a fresh row + after any
            successful login. Threshold-crossing triggers lockout.
            Surfaced here so admins can see who's under attack
            without waiting for a full lockout.
        auth_origin:
          type: string
          nullable: true
          description: |
            Login provider for this user — empty / null = native, else
            'simpleldap' / 'simplesaml' / etc. for the enterprise SSO
            surfaces. Surfaced here so the admin
            list can show the auth-source badge.
        profile_origin_server_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Federation origin (when the profile row came from a peer
            instance). Null = home instance. See ADR 0007.

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          description: The caller's current password — verified before the change is accepted.
        new_password:
          type: string
          description: The new password. Must satisfy the system password policy.
        revoke_other_sessions:
          type: boolean
          description: |
            When true, every session belonging to the caller EXCEPT
            the one authenticating this request is revoked. Defensive
            default for "I think someone got my password" recovery
            flows. Defaults to true client-side; the server doesn't
            assume either way (omitting the field = false).

    ChangePasswordResult:
      type: object
      required: [changed_at]
      properties:
        changed_at:
          type: string
          format: date-time
        sessions_revoked:
          type: integer
          description: Count of other sessions ended as part of this change.

    UserPreferencesViews:
      type: object
      description: |
        Default-view selections — the SEED for a device that has no
        local choice of its own, never an override of one. The browse
        store reads these once at hydration and only for the keys
        `localStorage` does not already hold, so picking masonry on
        one laptop survives a reload even when the account default
        says grid.

        Every value set below is a closed enum, and each member is a
        state the app can actually reach: `home_tab` mirrors the `feed`
        enum on `GET /posts`, `browse_layout` mirrors the browse
        store's `ViewMode`, and `browse_sort` carries only the two
        orderings the client can produce. Widening one of these means
        first building the thing it names (#736) — a value here that
        nothing can serve is a promise the UI breaks silently.
      properties:
        home_tab:
          type: string
          description: |
            Which feed segment browse lands on. Empty/unset falls back
            to `latest`. `trending` and `for_you` were removed in
            #736: neither existed in the `feed` enum, so choosing one
            put the plain latest feed under a label promising
            otherwise. They come back when a ranking model does.
          enum: ["", latest, following]
        browse_layout:
          type: string
          description: |
            Default browse-feed layout. Empty/unset falls back to the
            per-device default (`feed` on a coarse pointer, `grid`
            otherwise). `feed` is selectable here as of #706 — it was
            already a mode a phone could land on but not one a user
            could ask for.
          enum: ["", grid, masonry, thumbnail, list, feed]
        browse_sort:
          type: string
          description: |
            Default browse ordering: `newest` (posted_at descending,
            the built-in) or `oldest`. Empty/unset falls back to
            `newest`. `popular` and `trending` were removed in #706 —
            `GET /posts` has no ranking parameter and no ranking
            model, so both were labels over the default order.
          enum: ["", newest, oldest]

    FollowedTag:
      type: object
      description: |
        One tag the caller follows (#1123).

        An object rather than a bare string, even though `tag` is the
        only field the rail draws. `followed_at` is what the server
        orders by, and a client that receives the order but not the key
        it was sorted on cannot merge a newly-followed tag into the list
        without a refetch — which is exactly what the rail's optimistic
        follow does. There is deliberately no follower count and no post
        count: both are per-caller-visibility questions this endpoint
        would have to answer against the read rule, and neither is drawn.
      required: [tag, followed_at]
      properties:
        tag:
          type: string
          description: |
            The tag, exactly as stored — trimmed, case preserved. This
            is the value to pass as `?tag=` to `GET /posts`; the two
            match exactly, which is the point.
        followed_at:
          type: string
          format: date-time
          description: When the caller followed it.

    UserPreferencesBrowseRail:
      type: object
      description: |
        The browse page's rail curation — team chips (#1113) and
        followed-tag chips (#1123).

        ONE BAG FOR ONE PIECE OF FURNITURE. The rail is a single strip
        with a single manage panel and a single save; a team chip and a
        `#fantasy` chip differ in what they filter by (`?team=` /
        `?tag=`), which is a difference between two rows of one list,
        not between two concerns. A sibling `tag_rail` object would have
        split one save across two bags with nothing but convention
        keeping them consistent, and would have foreclosed a future
        single order interleaving both kinds. (This object was
        `team_rail` until #1123; migration 00051 renamed the column and
        carries the full argument.)

        The rail lists every team the caller can see, followed-first
        then name order, plus the tags the caller follows. This object
        is the READER'S EDIT of that list: which chips they took out,
        and which ones they pulled to the front. Every member is a list
        whose EMPTY value is the build's default rail — the same "the
        zero value is what this build does by default" contract
        `feed_filters` states for its booleans, applied to lists.

        CLIENT-APPLIED, and that is the load-bearing difference from
        `feed_filters`. Feed filters are read by `GET /posts` and remove
        rows before they reach the browser. Nothing here is ever
        consulted to decide which POSTS a caller sees: hiding a team or
        a tag from your rail must not hide that team's or tag's work
        from your feed. The rail is navigation furniture; the feed is
        content. Anything that starts reading this object server-side to
        shape a result set has crossed that line.

        Entries are NOT validated on write, in either notation. A team
        can be deleted or leave the caller's visibility, and a tag can
        be unfollowed, between a save and the next read; refusing the
        write would strand the reader in a rail they cannot edit.
        Unknown entries are inert — the rail intersects these lists with
        what the server returned, so a dead one is dropped at render.
      properties:
        hidden_team_ids:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Teams the reader removed from their rail. Empty = nothing
            hidden.

            A hide-list rather than a show-list, deliberately: an empty
            allow-list would have to mean "show everything", which is
            the opposite of what an empty allow-list says, and the first
            partial write would blank the rail.
        team_order:
          type: array
          items:
            type: string
            format: uuid
          description: |
            The reader's explicit ordering, applied to the FOLLOWED
            group (the manage panel's drag-reorder). Empty = the
            server's order.

            PARTIAL LISTS ARE LEGAL and are the normal case: the ids
            named here lead, in this order, and everything else keeps
            its previous relative position behind them. That is what
            lets "drag one team to the top" persist one id rather than a
            full snapshot that the next follow would immediately make
            stale.
        hidden_tags:
          type: array
          items:
            type: string
          description: |
            Followed tags whose chip the reader removed from their rail
            (#1123). Empty = nothing hidden.

            HIDING IS NOT UNFOLLOWING, and the two verbs sit next to
            each other in the manage panel precisely so the difference
            is visible. Unfollowing drops the `tag_follows` row and
            changes what the Following feed CONTAINS. Hiding only takes
            the chip off the strip; the tag's posts keep reaching the
            feed exactly as before.
        tag_order:
          type: array
          items:
            type: string
          description: |
            The reader's explicit ordering of their followed-tag chips.
            Empty = the server's order (most recently followed first).

            Partial lists are legal and normal, exactly as `team_order`.

    UserPreferencesFeedFilters:
      type: object
      description: |
        What the browse feed shows this account beyond the read rule's
        own output (#891, default inverted by #921).

        Sibling to `default_views`, and deliberately not a key inside
        it: `default_views` rearranges the same set of posts, these
        change which posts are in it. Every member is a boolean whose
        default is `false`, and each is NAMED so that `false` is the
        build's default experience — so an account that has never touched
        this object gets the same feed as every other default account,
        and an absent key never means the opposite of what its name says.

        #921 is why that naming rule is stated rather than assumed. Its
        one member used to be `hide_restricted`, default `false`; hiding
        became the default, and the key was RENAMED rather than having
        its default flipped, because `hide_restricted: true`-by-default
        would have made an absent key assert the reverse of its own name.

        SUBTRACTIVE ONLY. Nothing here is ever consulted to decide what
        a caller MAY read — the post read rule and
        `visibility.FieldsReadable` have both already run by the time
        these apply. A filter that could ADD a row would be a second
        expression of the read rule, and each of the two we have unpicked
        (#892, #904) cost a sprint. Inverting the default did not weaken
        this: the ceiling is still exactly what the rule returned, and
        these keys only choose how much of it is drawn.
      properties:
        show_restricted:
          type: boolean
          default: false
          description: |
            Keep the restricted-member placeholders (#883) in
            `GET /posts` instead of subtracting them.

            **Default `false` — the feed hides them (#921).** #891
            shipped this machinery as an opt-in on the theory that the
            placeholder is the more informative answer. Measured against
            the stock seed dataset, a reader with no capabilities got 82
            posts of which 27 were entirely placeholders: a third of the
            grid was locked doors. The principle the default now encodes
            is that a placeholder belongs where the reader ASKED A
            QUESTION or OPENED A CONTAINER, not where they were handed a
            feed.

            With the default (`false`), three rules, and the third is the
            one that matters:

            1. A member the caller cannot read is OMITTED from
               `members` rather than sent as a `restricted: true`
               placeholder.
            2. A post left with NO visible members — one that HAD
               members and none survived — is omitted from the page.
               A post with no members at all (an article, ADR 0073) is
               unaffected: it was never showing you anything you
               couldn't see.
            3. A post the CALLER AUTHORED is never omitted, however
               restricted its members are. An author's post can carry
               other people's assets, so rule 2 alone would make your
               own work vanish from your own feed over a display
               default.

            Set it `true` and `GET /posts` returns the pre-#921 payload
            exactly: every placeholder present, every all-restricted post
            back in the page.

            Applies to `GET /posts` and stops there. `GET /posts/{id}` is
            an explicit request for one post and answers with the
            placeholders intact whatever this is set to, which is not an
            inconsistency: rule 2 exists BECAUSE an all-restricted post
            rendering as an empty card is worse than the placeholder it
            replaced, and filtering members on the single-post read would
            rebuild that empty card on the one surface rule 2 could not
            protect. Collection contents render placeholders for the same
            reason — an opened container should say what is in it.

            It also keeps the ask alive. #913's "Request access" button
            lives on the placeholder, so it survives wherever the
            placeholder does: the post page and collections. The trade
            the DEFAULT makes — no placeholders in the feed means no
            Request access in the feed — is stated in the setting's own
            help text rather than left to be discovered.

    UserPreferencesMatureContent:
      type: object
      description: |
        This account's answer on the MATURE axis (#1115, epic #1114,
        ADR 0090).

        A sibling of `feed_filters`, not a key inside it, and the
        difference is not filing. `feed_filters` decides what the browse
        FEED draws for content the reader is entitled to either way;
        this decides whether the reader has consented to be shown a
        class of content at all, and that answer is composed on the
        picture plane too — an item reached by deep link renders blurred
        and its bytes are refused.

        NOT SUFFICIENT ON ITS OWN. Opting in qualifies a reader only if
        they are signed in AND the instance allows mature content. The
        server ANDs all three; a client that renders "you have opted in"
        as "you will see it" will be wrong on an instance whose operator
        has switched the feature off.

        Same naming rule as `feed_filters`: the key is named for the
        PERMISSIVE direction so its absence means the restrictive
        default. An account that has never touched this object does not
        see mature content.
      properties:
        show:
          type: boolean
          description: |
            Opt in to being shown mature content. Absent or `false` —
            the default for every account — hides it.
      additionalProperties: false

    UserPreferencesRequest:
      type: object
      description: |
        PATCH-time payload for the per-user preferences row. Wire
        contract is full-object replacement; field-level merge is
        NOT supported. Both fields are optional — an absent
        `notification_channels` clears the user's overrides, an
        absent `default_views` clears the view selections.
      properties:
        notification_channels:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: |
            Map from event-type key to channel list. Unknown event
            types or unknown channel names trigger a 400. An empty
            array MEANS "deliver nothing for this event" and
            overrides the system default; an absent key means
            "use system default."
        email_cadence:
          type: object
          additionalProperties: { type: string }
          description: |
            Map from event-type key to email delivery cadence
            (`immediate` | `hourly` | `daily` | `weekly`). Absent key =
            immediate (send-now). "off" is not a cadence value — mute
            email by dropping `email` from `notification_channels`.
            Unknown event types or cadence values trigger a 400.
        default_views:
          $ref: "#/components/schemas/UserPreferencesViews"
        feed_filters:
          allOf:
            - $ref: "#/components/schemas/UserPreferencesFeedFilters"
          description: |
            Browse-feed content filters. Absent object, or an absent key
            inside it, means the filter is OFF — there is no third state
            for a boolean to fall back to, so this follows the
            full-object-replacement contract like everything else here.
        browse_rail:
          allOf:
            - $ref: "#/components/schemas/UserPreferencesBrowseRail"
          description: |
            Browse-rail curation (teams + followed tags). Full-object
            replacement like everything else on this endpoint: an absent
            object clears the curation back to the default rail, and an
            absent list inside it clears that list. The manage panel
            always sends all four, which is what makes "unhide the last
            hidden chip" expressible.
        mature_content:
          allOf:
            - $ref: "#/components/schemas/UserPreferencesMatureContent"
          description: |
            ⚠️ FULL-OBJECT REPLACEMENT, like every other member of this
            request. An absent object resets the opt-in to `false`, and
            so does an absent `show` inside a present object. A client
            that PATCHes one preference must GET, merge and send the
            whole document — sending `{"default_views": {...}}` alone
            silently opts the account back out of mature content.

    UserPreferencesResponse:
      type: object
      description: |
        GET / PATCH response for per-user preferences.
        Includes the build's known event-type + channel catalogs so
        the UI renders toggle grids without hard-coding the lists
        client-side. Per-event system defaults are surfaced so the UI
        can show "follows system default — in_app only" hints
        alongside each toggle.
      required:
        - notification_channels
        - default_views
        - feed_filters
        - browse_rail
        - mature_content
        - known_event_types
        - known_channels
        - default_channels_by_event
      properties:
        notification_channels:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        email_cadence:
          type: object
          additionalProperties: { type: string }
          description: |
            Per-event-type email cadence. Absent key =
            immediate. Values: immediate | hourly | daily | weekly.
        default_views:
          $ref: "#/components/schemas/UserPreferencesViews"
        feed_filters:
          allOf:
            - $ref: "#/components/schemas/UserPreferencesFeedFilters"
          description: |
            Browse-feed content filters, always present with every key
            populated — unlike `default_views`, where "unset" and "the
            default" are different states the UI renders differently, a
            boolean filter has no third value, so omitting it would only
            make the client guess `false` rather than read it.
        browse_rail:
          allOf:
            - $ref: "#/components/schemas/UserPreferencesBrowseRail"
          description: |
            Browse-rail curation, always present with every list
            materialised even when empty. Same argument as
            `feed_filters` above, for the list case: "no curation" and
            "an empty curation" are the same rail, so omitting it would
            only make the client re-derive `[]`.
        mature_content:
          allOf:
            - $ref: "#/components/schemas/UserPreferencesMatureContent"
          description: |
            This account's mature-content consent, always present with
            `show` populated. Same argument as `feed_filters`: a boolean
            has no third state, so omitting it would only make the
            client guess.
        known_event_types:
          type: array
          items: { type: string }
          description: |
            Canonical ordered list of notification event types this
            build knows about. Order is the recommended rendering
            order in the UI.
        known_channels:
          type: array
          items: { type: string }
          description: |
            Canonical channel names this build supports
            (`in_app`, `email`, future: `sms`, `push`, `webhook`).
        default_channels_by_event:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: |
            Per-event-type system default channel list. Applied at
            notification-write time when the user's
            `notification_channels` doesn't have that key.

    AdminPasswordResetRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          description: |
            Admin-supplied justification recorded in the audit log.
            Encouraged but not required — an empty reason still
            produces an audit row.

    AdminPasswordResetResult:
      type: object
      required: [temporary_password, generated_at]
      properties:
        temporary_password:
          type: string
          description: |
            Plaintext one-shot password — returned ONCE so the admin
            can share it with the user. The server stores only the
            hash; this value is never reachable again from any API.
            Generators must use a cryptographically strong RNG; this
            response should be considered as sensitive as the
            hash-bearing original.
        generated_at:
          type: string
          format: date-time

    AdminImpersonateRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          description: |
            Admin-supplied justification (ticket number, brief
            context). Recorded in the impersonation.started audit
            event. Encouraged but not required.

    AdminImpersonateResult:
      type: object
      required: [target_user_ref, target_username, expires_at, session_id]
      description: |
        Returned by POST /admin/users/{ref}/impersonate when the
        impersonation session has been minted + the cookie set.
        The frontend uses this to render the persistent "you are
        acting as @target" banner without an immediate reload.
      properties:
        target_user_ref:
          type: integer
          format: int64
        target_username:
          type: string
        session_id:
          type: string
          format: uuid
          description: The newly-minted impersonation session's id.
        expires_at:
          type: string
          format: date-time
          description: |
            When the impersonation session hard-expires (default
            30 min from start). The admin can end earlier via the
            "End impersonation" button.

    AdminUnlockAccountResult:
      type: object
      required: [user_ref, unlocked, prior_failed_count]
      description: |
        Returned by POST /admin/users/{ref}/unlock-account. Reports
        whether the call actually unlocked (unlocked=true) or found
        the user already-unlocked (unlocked=false — idempotent no-op).
      properties:
        user_ref:
          type: integer
          format: int64
        unlocked:
          type: boolean
          description: |
            true when the call cleared existing lockout state
            (audit fired); false when the user was already
            unlocked (no state change; no audit).
        prior_failed_count:
          type: integer
          format: int32
          description: |
            The failed_login_count value BEFORE the unlock cleared it.
            Zero when unlocked=false.

    EndImpersonationResult:
      type: object
      required: [admin_user_ref, admin_username]
      properties:
        admin_user_ref:
          type: integer
          format: int64
          description: The original admin's ref — confirms who the
            caller is now signed in as after the rotation.
        admin_username:
          type: string

    RegisterRequest:
      type: object
      required: [username, email, password]
      description: |
        Self-registration payload. Validation is
        server-side authoritative; the frontend mirrors the same
        regexes for early UX feedback.
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[a-zA-Z0-9_-]+$"
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          description: Must satisfy the install's sysconfig password policy.
        fullname:
          type: string
          maxLength: 200
          description: Optional display name; defaults to the username when empty.

    RegisterPendingResult:
      type: object
      required: [user_ref, email, message]
      description: |
        202 response when require_email_verification is on. The
        caller is not signed in yet; the verification link they
        receive by email completes the flow.
      properties:
        user_ref:
          type: integer
          format: int64
        email:
          type: string
          format: email
        message:
          type: string
          description: Human-readable next-step prompt.

    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Plaintext token from the email link.

    VerifyEmailResult:
      type: object
      required: [user_ref, username, email]
      properties:
        user_ref:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
          format: email

    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    TOTPStatus:
      type: object
      required: [enrolled, confirmed, recovery_codes_remaining]
      description: |
        Caller-facing 2FA enrollment status.
      properties:
        enrolled:
          type: boolean
          description: True when any user_totp row exists for the caller.
        confirmed:
          type: boolean
          description: |
            True when the enrollment is past the confirm step.
            Only confirmed enrollments gate the login flow.
        enrolled_at:
          type: string
          format: date-time
          nullable: true
        confirmed_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        recovery_codes_remaining:
          type: integer
          description: |
            Number of unused single-use backup codes. Drops as
            the user redeems them; regenerate via the dedicated
            endpoint when low.

    TOTPEnrollResult:
      type: object
      required: [secret_base32, otpauth_url]
      properties:
        secret_base32:
          type: string
          description: |
            The shared secret as RFC 4648 base32 (no padding).
            Authenticator apps that can't scan QR fall back to
            manual paste.
        otpauth_url:
          type: string
          description: |
            otpauth://totp/<issuer>:<account>?secret=...&issuer=...
            URI. Frontend renders as a QR code via client-side
            JS — no QR-generation Go dep needed.

    TOTPConfirmRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 6-digit TOTP code from the authenticator app.

    TOTPConfirmResult:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          description: |
            Single-use backup codes — shown ONCE. Plaintext;
            never reachable again from any API. The server only
            persists sha256(normalize(code)).
          items: { type: string }

    TOTPDisableRequest:
      type: object
      required: [current_password]
      description: |
        Body for the disable + regenerate-recovery surfaces.
        Re-asks for the current password so a stolen-session
        attacker can't kill 2FA + lock the owner out in one move.
      properties:
        current_password:
          type: string
          format: password

    TOTPRecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items: { type: string }

    SessionRow:
      type: object
      description: |
        One active session. The user-agent is best-effort
        observability captured at login and can be null behind a proxy
        that strips it. `current` is true only on the self-service
        endpoint for the row that's authenticating the request — the
        UI uses it to hide its own revoke button.
      required: [id, created_at, last_used_at]
      properties:
        id: { type: string, format: uuid }
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        ip:
          type: string
          nullable: true
          description: |
            Client IP recorded at login — PERSONAL DATA, and returned
            ONLY on the admin view (`GET /admin/users/{ref}/sessions`),
            where locating a suspicious session is the point, and there
            only to callers holding `users.pii.read` on top of the
            `users.read` that admits them to the list at all (#573).

            That is the same shape audit uses for actor IPs —
            `system.audit.pii.read` on top of `system.audit.read`
            (#425). Raw IPs are one data class with one bar, gated
            `<area>.pii.read` additive to `<area>.read` (ADR 0072).

            Never returned by `GET /account/sessions` (#567). That
            endpoint is self-scoped, and on a shared-account install
            "self" is every visitor — so the raw address is omitted
            unconditionally rather than gated, per the data-
            minimisation posture of ADR 0024.

            Omitted from the JSON entirely, not blanked — the same
            convention AuditRow.ip uses (#425) — so an absent value
            always means "not returned to you" and never "no IP
            recorded".
        user_agent:
          type: string
          nullable: true
        current:
          type: boolean
          description: |
            True only on /account/sessions for the session that
            authenticated the request. Omitted on the admin
            equivalent.

    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SessionRow" }

    AdminUserStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, pending, disabled, archived]
        reason:
          type: string
          maxLength: 500
          description: |
            Free-text justification recorded in the audit log alongside
            the before/after pair. Encouraged but not required — an
            empty reason still produces an audit row.

    AdminUserStatusResult:
      type: object
      required: [ref, status, changed]
      properties:
        ref:
          type: integer
          format: int64
        status:
          type: string
          enum: [active, pending, disabled, archived]
        previous_status:
          type: string
          enum: [active, pending, disabled, archived]
        changed:
          type: boolean
          description: |
            False when the target status equals the current status (the
            handler short-circuits the write but still returns 200 so
            idempotent automation doesn't trip on a no-op).

    AdminUserList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminUser" }
        total:
          type: integer
          format: int64
          description: Total rows matching the q + status filter (cursor-independent).
        next_cursor:
          type: string
          nullable: true
          description: |
            Opaque pagination token. Pass back as the next request's
            `cursor` param to fetch the following page. Null when this
            response is the final page.

    UserCapabilityOverride:
      type: object
      description: |
        One row from either `user_capability_grants` or
        `user_capability_revokes`. `team_id` is null for global
        overrides, set for team-scoped ones. `note` is the
        admin-supplied justification recorded at grant/revoke time.

        `expires_at` is the optional time-bound
        expiry. NULL means permanent (the existing default behavior);
        non-null rows get reaped by the background capability
        sweeper once NOW() passes the expiry.
      required: [capability, granted_at]
      properties:
        capability:
          type: string
        team_id:
          type: string
          format: uuid
          nullable: true
        note:
          type: string
          description: Free-text justification — empty when none was supplied.
        granted_by:
          type: integer
          format: int64
          nullable: true
          description: |
            Acting admin's user_ref at time of grant/revoke. Null
            when the row predates actor recording or was inserted
            by seed migration.
        granted_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Optional auto-expiry timestamp. Null
            means permanent. Reaped by the background sweeper.

    UserCapabilityOverrides:
      type: object
      description: |
        Per-user explicit GRANT + REVOKE override lists. Role-derived
        capabilities are NOT included — admins manage those through
        the role editor; this surface only exposes the additive /
        subtractive deltas attached directly to the user.
      required: [grants, revokes]
      properties:
        grants:
          type: array
          items: { $ref: "#/components/schemas/UserCapabilityOverride" }
        revokes:
          type: array
          items: { $ref: "#/components/schemas/UserCapabilityOverride" }

    UserCapabilityOverrideRequest:
      type: object
      description: |
        Body shared by POST /admin/users/{ref}/grants and POST
        /admin/users/{ref}/revokes. Pass `team_id` to scope the
        override to a team — omit / null for a global override.

        `expires_at` is optional. When set, the
        grant or revoke auto-expires at that time and is reaped by
        the background sweeper. Past values are rejected with 400
        (operator must explicitly choose to delete an already-
        expired override rather than land it pre-stale).
      required: [capability]
      properties:
        capability:
          type: string
          description: Capability code (e.g. `assets.read`, `users.write`).
        team_id:
          type: string
          format: uuid
          nullable: true
        note:
          type: string
          maxLength: 500
          description: Optional admin-supplied justification recorded with the row.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Optional auto-expiry. NULL / omitted =
            permanent. Past values rejected with 400.

    LicenseStatus:
      type: object
      description: |
        License snapshot returned by GET /admin/license/status.
        `loaded: false` means no .lic file is
        installed and the artist-alley app is running in community
        mode — community defaults apply, no license-server
        interaction needed.

        `days_until_expiry` is derived (0 in community mode;
        negative when expired). Nullable cap fields (`seats`,
        `asset_cap`) → null = unlimited. Nullable temporal /
        identity fields are simply omitted in community mode.
      required: [loaded, tier, features, days_until_expiry, org_binding_required, org_bound]
      properties:
        loaded:
          type: boolean
          description: True when a real .lic file is mounted + verified. False = community mode.
        tier:
          type: string
          description: |
            "community" (unlicensed default) | "pro" | "enterprise" |
            "complementary" | "plugin" | "custom".
        features:
          type: array
          items: { type: string }
        owner:
          type: string
          description: License owner email — surfaced for support routing.
        org:
          type: string
          description: Organization slug — same value across federated peers.
        lid:
          type: string
          description: License id (ULID); surface in support tickets.
        seats:
          type: integer
          format: int64
          nullable: true
          description: Max concurrent active seats; null = unlimited.
        seat_window_days:
          type: integer
          description: Rolling window for "active seat" counting.
        asset_cap:
          type: integer
          format: int64
          nullable: true
          description: Asset cap (primary assets only); null = unlimited.
        nbf:
          type: string
          format: date-time
          description: Not-before timestamp (RFC3339).
        exp:
          type: string
          format: date-time
          description: Expiry timestamp.
        iat:
          type: string
          format: date-time
          description: Issued-at timestamp.
        days_until_expiry:
          type: integer
          description: |
            Whole days until license expires. Negative when expired.
            Zero in community mode (no expiry).
        last_error:
          type: string
          description: |
            Last verification error if the loaded license failed
            (e.g. expired, wrong issuer). Surfaced verbatim in the
            admin UI so operators can react.
        iss:
          type: string
          description: |
            Issuer string baked into the license — admins can
            confirm the .lic came from the canonical authority.
        path:
          type: string
          description: |
            Filesystem path the verifier loaded the .lic from.
            Useful for diagnostics + support.
        org_binding_required:
          type: boolean
          description: |
            True when the loaded license declares an `org_pubkey`
            claim — the customer must hold the matching org.key
            seed file on disk for the license to activate. False for
            community / trial / dev licenses that opted out of
            cross-binding at issuance time.
        org_bound:
          type: boolean
          description: |
            True when the install satisfies cross-binding — either
            because `org_binding_required` is false (no binding to
            satisfy), or because the on-disk org.key derives to a
            public key matching the license's `org_pubkey`. The
            cap-enforcement layer only treats the license as active
            when this is true.
        org_binding_error:
          type: string
          description: |
            Human-readable reason cross-binding failed when
            `org_binding_required` is true and `org_bound` is false.
            One of: "org.key missing", "org.key malformed", "org.key
            does not match license org_pubkey".
        org_key_path:
          type: string
          description: |
            Filesystem path the verifier consults for the org.key
            seed. Echoed back to the admin UI so operators see
            exactly where to drop the file when cross-binding fails.

    LicenseUploadRequest:
      type: object
      description: |
        Payload for POST /admin/license/validate and
        POST /admin/license/upload. Carries the
        verbatim .lic envelope text — BEGIN/END markers, key:
        value fields, signature field — exactly as the customer
        downloaded it.
      required: [license_text]
      properties:
        license_text:
          type: string
          minLength: 32
          maxLength: 65536
          description: |
            Full .lic file body including the BEGIN/END markers.
            Whitespace + line wrapping are tolerated by the
            verifier.

    LicenseValidateError:
      type: object
      description: |
        Structured 400 response from /admin/license/validate +
        /admin/license/upload. `code` is a stable machine-readable
        token the UI can switch on for i18n; `message` is the raw
        verifier error string for diagnostics.
      required: [error, code, message]
      properties:
        error:
          type: string
          description: Human-readable summary (constant "license validation failed").
        code:
          type: string
          description: |
            Stable token for UI branching. One of:
            `bad_envelope`, `bad_signature`, `expired`,
            `not_yet_valid`, `unknown_publisher_key`,
            `wrong_issuer`, `chain_expired`, `chain_bad_signature`,
            `chain_scope`, `chain_kid_mismatch`,
            `org_key_missing`, `org_key_bad_format`,
            `org_key_mismatch`, `unknown`.
        message:
          type: string
          description: Raw verifier error string for diagnostics.

    AuditEvent:
      type: object
      description: |
        One row from audit_events. `metadata` is the
        typed JSONB blob whose shape varies per event_type — see
        app/internal/audit/events.go for the per-type schemas. The
        UI renders well-known event types as structured changesets
        ("active → disabled", etc.) and falls back to JSON dump for
        the rest.
      required: [id, event_type, occurred_at, metadata]
      properties:
        id:
          type: string
          format: uuid
        event_type:
          type: string
        occurred_at:
          type: string
          format: date-time
        subject_user_ref:
          type: integer
          format: int64
          nullable: true
        actor_user_ref:
          type: integer
          format: int64
          nullable: true
        ip:
          type: string
          nullable: true
          description: |
            Actor IP address — PERSONAL DATA, and returned only to
            callers holding `system.audit.pii.read` on top of
            `system.audit.read` (#425).

            Absent from the response entirely for callers without that
            capability, rather than blanked, so an empty value always
            means "no IP recorded" and never "you may not see it".
            Consumers must already tolerate absence: the field has
            always been optional and nullable, since not every event
            carries an address.
        user_agent:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          description: Typed per event_type — see audit/events.go.

    AuditEventList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        total:
          type: integer
          format: int64
          description: Total rows matching the filter (cursor-independent).
        next_cursor:
          type: string
          nullable: true

    ScheduledAction:
      type: object
      description: |
        One row of the scheduled_actions table (ADR 0020) — a declarative
        future action executed by the reaper through the jobs queue.
      required: [id, action, target_kind, target_id, scheduled_for, state, created_at]
      properties:
        id: { type: string, format: uuid }
        action:
          type: string
          enum: [restrict, delete, change_state, change_sensitivity, notify]
        target_kind:
          type: string
          enum: [asset, post, collection, user]
        target_id:
          type: string
          description: |
            The target's id as text. A UUID for asset/post/collection, a
            user ref for user — the column is polymorphic across both.
        params:
          type: object
          additionalProperties: true
          description: >-
            Per-action parameters. For change_sensitivity, a `to` field
            naming the target tier; for change_state, a `to_state` code;
            for delete, an optional `reason`.
        scheduled_for: { type: string, format: date-time }
        state:
          type: string
          enum: [pending, done, cancelled, failed]
        error:
          type: string
          nullable: true
          description: Failure message when state is `failed`; null otherwise.
        created_by:
          type: integer
          format: int64
          nullable: true
          description: User who scheduled it; null for system-scheduled actions.
        created_at: { type: string, format: date-time }
        executed_at:
          type: string
          format: date-time
          nullable: true
          description: When the reaper ran it; null while pending or cancelled.

    ScheduledActionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ScheduledAction" }
        next_cursor:
          type: string
          nullable: true

    SelfEditGates:
      type: object
      description: |
        Per-field self-edit gates. Each flag
        controls whether users may edit that field on their own
        profile. Operators set these via PATCH /admin/system/users;
        users read them via GET /account/selfedit-gates to render
        disabled inputs. Missing system_config rows default to
        `true` (fail-open).
      required: [display_name, bio, avatar_url, location, website_url]
      properties:
        display_name: { type: boolean }
        bio: { type: boolean }
        avatar_url: { type: boolean }
        location: { type: boolean }
        website_url: { type: boolean }

    UserPublic:
      type: object
      description: |
        Merged user + profile view. `display_name` is the resolved
        display string, first non-empty of:

          authenticated: profile.display_name → user.fullname → username
          anonymous:     profile.display_name → username

        The anonymous ladder skips `fullname`, and has since #478 —
        real name is authenticated-only (ADR 0070 §3), so a fallback
        that reached it would defeat that rule silently, for exactly
        the users who never set a display name. This sentence used to
        describe only the authenticated ladder, which made the schema
        the stale source; the rule itself is one Go expression
        (`users.ResolveDisplayName`), shared with `PostAuthor`.

        `avatar_url` is null for users without an uploaded avatar; the
        frontend renders a generated initials disc in that case.
      required:
        [ref, username, display_name, member_since, post_count]
      properties:
        ref: { type: integer, format: int64 }
        username: { type: string }
        fullname:
          type: string
          nullable: true
          description: |
            The raw user.fullname value, for the rare case a caller
            needs the unresolved string (account settings page). Most
            UI surfaces should use display_name instead.
        display_name:
          type: string
          description: |
            Resolved display string ready to render — never empty.
        bio: { type: string }
        avatar_url:
          type: string
          nullable: true
        location: { type: string }
        website_url:
          type: string
          format: uri
          nullable: true
        social_links:
          type: object
          additionalProperties: { type: string }
          description: |
            Free-form platform → handle map. Frontend renders known
            platforms (twitter, instagram, artstation, ...) as icon
            links; unknown keys are ignored.
        language:
          type: string
          description: |
            IETF BCP47 language tag (e.g. "en", "es-AR"). Empty string
            = "use system / browser default". Drives the i18n
            switcher in the user menu.
        theme:
          type: string
          enum: ['', 'light', 'dark', 'system']
          description: |
            UI theme preference. `system` follows the OS; empty string
            = no stored preference. Persisted alongside the profile so
            it follows the user across browsers (#677).
        member_since: { type: string, format: date-time }
        post_count:
          type: integer
          format: int64
          description: Total live posts authored by this user.
        origin_server_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Set on profiles mirroring a remote site's user. NULL =
            locally-owned account.

    UserProfileUpdate:
      type: object
      description: |
        PATCH semantics — only present fields are updated, but the
        schema treats each field as the new full value (no JSON
        Merge Patch nested ops). Clearing a field is sending an
        empty string (for text) or null (for nullable URLs).
      properties:
        display_name:
          type: string
          nullable: true
          maxLength: 100
        bio:
          type: string
          maxLength: 1000
        avatar_url:
          type: string
          nullable: true
          maxLength: 1024
        location:
          type: string
          maxLength: 100
        website_url:
          type: string
          nullable: true
          format: uri
          maxLength: 500
        social_links:
          type: object
          additionalProperties:
            type: string
            maxLength: 100
        language:
          type: string
          maxLength: 35
          description: |
            BCP47 tag, or empty string to reset to "system default".
            Validated only loosely server-side — frontend constrains
            the picker to a known list.
        theme:
          type: string
          enum: ['', 'light', 'dark', 'system']
          description: |
            `system` follows the OS. Empty string CLEARS the account's
            preference, which is not the same thing — a cleared account
            leaves each device on the app default, an account set to
            `system` makes every device follow its own OS.
        hide_from_anonymous:
          type: boolean
          description: |
            Owner opt-out from anonymous profile exposure (ADR 0070 →
            ADR 0024). Default false. When true, the owner's public
            profile page (/users/by-username, /users/by-ref) returns 404
            to anonymous viewers even with public mode on. Authenticated
            viewers and the content-visibility gating are unaffected.

    PostLikeState:
      type: object
      required: [liked]
      properties:
        liked: { type: boolean }

    SocialUserSummary:
      type: object
      description: |
        Compact user-card projection used by the follow/follower
        lists. Smaller than UserPublic — only the fields the card
        renders.
      required: [ref, username]
      properties:
        ref: { type: integer, format: int64 }
        username: { type: string }
        display_name: { type: string, nullable: true }
        avatar_url: { type: string, nullable: true }
        since:
          type: string
          format: date-time
          description: |
            When this edge was created. For follower lists, when the
            user started following the subject. For block lists, when
            the block was recorded.

    SocialUserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/SocialUserSummary" }

    UserRelationship:
      type: object
      description: |
        Caller's relationship with the target user.
        Profile pages consume this in one round-trip to decide which
        Follow/Unfollow/Block/Unblock button(s) to render. `is_self`
        short-circuits all the other flags.
      required:
        - is_self
        - is_following
        - is_followed_by
        - is_blocked_by_me
        - is_blocked_by_them
      properties:
        is_self:
          type: boolean
          description: True when the caller IS the target — UI hides social buttons.
        is_following:
          type: boolean
          description: Caller follows target.
        is_followed_by:
          type: boolean
          description: Target follows caller.
        is_blocked_by_me:
          type: boolean
          description: Caller has blocked target. Implies social hide on both sides.
        is_blocked_by_them:
          type: boolean
          description: Target has blocked caller. Implies social hide on both sides.

    BlockUserRequest:
      type: object
      description: Optional reason recorded with the block.
      properties:
        reason:
          type: string
          maxLength: 500
          description: |
            Private note visible only to the blocker in
            /account/blocked. Surfaced verbatim. Empty/omitted is
            fine — most blocks don't carry a reason.

    BlockedUserSummary:
      type: object
      required: [ref, username, since]
      properties:
        ref: { type: integer, format: int64 }
        username: { type: string }
        display_name: { type: string, nullable: true }
        avatar_url: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        since:
          type: string
          format: date-time

    BlockedUserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/BlockedUserSummary" }

    Notification:
      type: object
      description: |
        One row from the per-user notifications feed.
        verb matches one of the userprefs.KnownEventTypes strings.
        target_kind + target_id form a polymorphic reference into
        whatever entity the notification is about (e.g. target_kind=
        "post", target_id=<uuid>); the frontend renderer keys on verb
        + target_kind to build the right card.
      required:
        - id
        - verb
        - delivered_at
        - created_at
      properties:
        id: { type: string, format: uuid }
        actor_user_ref:
          type: integer
          format: int64
          nullable: true
          description: |
            User whose action triggered the notification. NULL for
            system-generated events (license expiry, broadcast).
        actor_username:
          type: string
          nullable: true
          description: Denormalized for inbox render — no second round-trip.
        actor_display_name:
          type: string
          nullable: true
        actor_avatar_url:
          type: string
          nullable: true
        verb:
          type: string
          description: |
            Event-type identifier. One of userprefs.KnownEventTypes.
            Frontend i18n keys are `notifications.verb_<verb>`.
        target_kind:
          type: string
          nullable: true
          description: |
            Type discriminator for the polymorphic target (post,
            comment, asset, user, collection, license, request).
        target_id:
          type: string
          nullable: true
          description: |
            ID of the target entity. UUID-typed entities stringify;
            BIGINT-typed entities stringify too. Frontend resolves
            via target_kind.
        payload:
          type: object
          additionalProperties: true
          description: |
            Per-verb extra context (comment excerpt, license kid,
            request reason, etc.). Schema documented per-verb in
            app/internal/notifications/events.go.
        read_at:
          type: string
          format: date-time
          nullable: true
          description: NULL = unread.
        delivered_at:
          type: string
          format: date-time
          description: When the row landed (in-app delivery time).
        created_at:
          type: string
          format: date-time

    NotificationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        next_cursor:
          type: string
          nullable: true

    FederationShare:
      type: object
      description: |
        One federation_shares row per the 1.22.C design proposal.
        Pairing alone shares nothing; each row here is an
        explicit per-object grant.
      required:
        - id
        - grantor_user_ref
        - object_kind
        - object_id
        - peer_id
        - scope
        - notes
        - granted_activity_id
        - granted_at
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        grantor_user_ref: { type: integer, format: int64 }
        object_kind:
          type: string
          enum: [asset, post, collection, workspace, brand_kit, user]
        object_id: { type: string, format: uuid }
        peer_id: { type: string, format: uuid }
        target_user_url:
          type: string
          nullable: true
          description: 'NULL = broadcast within peer; non-null = specific user actor URL'
        scope:
          type: string
          enum: [view, comment, annotate, remix]
        expires_at:
          type: string
          format: date-time
          nullable: true
        notes: { type: string }
        granted_activity_id: { type: string, format: uuid }
        granted_at: { type: string, format: date-time }
        revoked_at:
          type: string
          format: date-time
          nullable: true
        revoked_activity_id:
          type: string
          format: uuid
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    FederationDefederationPreview:
      type: object
      description: |
        Cascade-preview summary returned by
        GET /admin/federation/peers/{id}/defederation-preview
        per the 1.22.C design proposal §8.5. The admin UI
        renders this in the confirm-defederation modal so the
        operator sees exact impact before clicking through.
      required:
        - peer_id
        - peer_display_name
        - peer_url
        - total_active_shares
        - shares_by_kind
        - pending_handshakes
        - cached_suggestions
      properties:
        peer_id: { type: string, format: uuid }
        peer_display_name: { type: string }
        peer_url: { type: string }
        total_active_shares:
          type: integer
          format: int64
          description: |
            Sum across all object kinds. The cascade emits one
            aa:Unshare per row (best-effort delivery via the
            outbox) before deleting the peer.
        shares_by_kind:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: |
            Per-object-kind breakdown so the modal renders
            "12 posts, 23 collections, 8 assets, …". Keys are
            from the federation.ShareObjectKind closed catalogue;
            kinds with zero active shares may be omitted.
        pending_handshakes:
          type: integer
          description: Number of pending_outbound + pending_inbound rows for this peer.
        cached_suggestions:
          type: integer
          description: federation_peer_suggestions rows sourced from this peer that would be dropped.

    FederationShareList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FederationShare" }

    FederationOutbox:
      type: object
      description: |
        One row in the per-recipient federation_outbox queue
        . Derived from the activities ledger by
        the dispatcher per design §3.1; delivered by the worker
        per §3.3. The admin UI surfaces queued / sent / failed /
        cancelled rows for operator visibility into outbound
        federation traffic.
      required:
        [id, activity_id, peer_id, status, attempts,
         next_attempt_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        activity_id: { type: string, format: uuid }
        peer_id: { type: string, format: uuid }
        target_user_url:
          type: string
          nullable: true
          description: Per-recipient actor URL within the peer; null = broadcast.
        status:
          type: string
          enum: [queued, sent, failed, cancelled]
        attempts:
          type: integer
          description: Delivery attempt count (caps at 5 before terminal-fail).
        next_attempt_at:
          type: string
          format: date-time
          description: Wall-clock time of the next attempt per the §3.4 backoff schedule.
        last_attempt_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
          description: |
            Failure detail captured on the most recent attempt.
            For failed rows, may carry a §12.1 reject reason
            from the receiver — the admin UI maps these to
            retriable / non-retriable warnings on the re-queue
            confirmation prompt.
        sent_at:
          type: string
          format: date-time
          nullable: true
        delivered_with_key_id:
          type: string
          nullable: true
          description: HTTP-Sig keyId used on the successful delivery (forensics).
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    FederationOutboxList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FederationOutbox" }
        next_cursor:
          type: string
          nullable: true

    FederationInboxRow:
      type: object
      description: |
        One row in federation_inbox. Captures
        what arrived from a peer + how the inbox + dispatcher
        chain treated it (pending / processed / rejected /
        failed). Read-only via the admin UI — the activity_uri
        UNIQUE constraint means re-delivery is idempotent on
        the existing row.
      required:
        [id, activity_uri, peer_id, actor_uri, activity_type,
         status, dispatch_attempts, received_at]
      properties:
        id: { type: string, format: uuid }
        activity_uri: { type: string }
        peer_id: { type: string, format: uuid }
        actor_uri: { type: string }
        activity_type: { type: string }
        object_kind:
          type: string
          nullable: true
        object_id:
          type: string
          format: uuid
          nullable: true
        http_sig_key: { type: string }
        status:
          type: string
          enum: [pending, processed, rejected, failed]
        reject_reason:
          type: string
          nullable: true
          description: §12.1 reject reason when status=rejected.
        dispatch_attempts:
          type: integer
        last_attempt_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
          nullable: true
        received_at:
          type: string
          format: date-time
        processed_at:
          type: string
          format: date-time
          nullable: true
        correlation_activity_id:
          type: string
          format: uuid
          nullable: true
          description: Local activities row the dispatcher created for this inbound envelope.

    FederationInboxList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FederationInboxRow" }
        next_cursor:
          type: string
          nullable: true

    CascadeCancelResult:
      type: object
      required: [peer_id, cancelled_count]
      properties:
        peer_id: { type: string, format: uuid }
        cancelled_count:
          type: integer
          description: Number of outbox rows transitioned from queued to cancelled.

    SeedTimestampsItem:
      type: object
      required: [kind, id, created_at]
      properties:
        kind:
          type: string
          enum: [asset, post, comment]
          description: Domain table to UPDATE.
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Defaults to created_at when omitted.

    SeedTimestampsRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/SeedTimestampsItem" }

    SeedTimestampsResult:
      type: object
      required: [asset_updated, post_updated, comment_updated, skipped_unknown_id]
      properties:
        asset_updated: { type: integer }
        post_updated: { type: integer }
        comment_updated: { type: integer }
        skipped_unknown_id:
          type: integer
          description: |
            Items whose `id` didn't match any existing row.
            Apply scripts treat this as a soft failure
            (operator log + continue).

    SeedUserRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 50
          description: |
            Stable identifier across apply-script re-runs.
            UNIQUE in the `user` table — duplicate request
            returns 200 with the existing row instead of 409.
        fullname:
          type: string
          maxLength: 100
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        password:
          type: string
          nullable: true
          description: |
            Optional plaintext password to hash + persist. When
            omitted, the user is created with no password (the
            `password` column is NULL) so they can't log in —
            useful for fictional seed users who exist as actors
            on posts/comments but never sign in.
        usergroup:
          type: integer
          format: int64
          nullable: true
          description: |
            Legacy permission group. Defaults to 2 (regular
            user) when omitted. Set to 3 only for admin-tier
            seed users; the seed loader uses 2 for everything
            else by convention.
        approved:
          type: boolean
          default: true
          description: |
            When true, the user is approved at create time
            (matching the regular CreateUser path). Seed users
            should almost always be approved; pending-approval
            state is a normal signup-flow concern, not a seed
            concern.
        created_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Optional creation timestamp. Defaults to NOW() when
            omitted. The seed loader uses this to align user
            "joined" dates with the 14-month interlaced timeline.

    SeedUserResult:
      type: object
      required: [ref, username, already_existed]
      properties:
        ref:
          type: integer
          format: int64
          description: Server-assigned `user.ref` PK.
        username: { type: string }
        already_existed:
          type: boolean
          description: |
            true on idempotent re-run (response status 200),
            false on fresh insert (response status 201).

    SeedCommentRequest:
      type: object
      required: [target_kind, target_id, author_user_ref, body]
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: |
            Optional stable UUID for idempotent re-runs. When
            omitted the server generates one.
        target_kind:
          type: string
          enum: [post, asset, collection]
        target_id: { type: string, format: uuid }
        author_user_ref:
          type: integer
          format: int64
          description: |
            Forged author. Must reference an existing
            `user.ref`. The seed loader uses this to attribute
            comments to per-post reviewer voices distinct from
            the operator running apply.
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Optional parent comment. When set, depth +
            root_id are derived from the parent (same logic
            as the public CreateComment path).
        body: { type: string, minLength: 1 }
        body_html:
          type: string
          nullable: true
          description: |
            Defaults to empty (matches the local CreateComment
            path; the frontend renders `body` directly with
            whitespace-pre-wrap).
        annotation_type:
          type: string
          enum: [point, rect, timestamp, frame, whiteboard, text-range]
          nullable: true
        annotation_data:
          type: object
          additionalProperties: true
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Optional creation timestamp. Defaults to NOW()
            when omitted. The seed loader uses this to align
            comment timeline with the 14-month interlaced feed.

    FederationShareCreate:
      type: object
      required: [object_kind, object_id, peer_id, scope]
      properties:
        object_kind:
          type: string
          enum: [asset, post, collection, workspace, brand_kit]
          description: |
            'user' is excluded from the operator-facing API —
            user/follower shares are server-internal
            (Accept(Follow) creates them).
        object_id: { type: string, format: uuid }
        peer_id: { type: string, format: uuid }
        target_user_url:
          type: string
          description: |
            Recipient's actor URL on the peer. Omit for a
            broadcast share (any user on the peer). REQUIRED
            for restricted/embargo objects (server validates).
        scope:
          type: string
          enum: [view, comment, annotate, remix]
        expires_at:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          maxLength: 2000

    FederationPeer:
      type: object
      description: |
        One row from the federation_peers registry (Phase
        1.22.B-a + ADR 0043 §"Trust model"). Pairing alone shares
        no content — see federation_shares (1.22.C) for the
        access-control layer.
      required:
        - id
        - instance_url
        - display_name
        - instance_public_key
        - trust_tier
        - encryption_policy
        - enabled
        - status
        - handshake_at
        - handshake_by_user_ref
        - notes
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        instance_url:
          type: string
          description: 'https://peer.example (no trailing slash, no path)'
        display_name: { type: string }
        instance_public_key:
          type: string
          description: |
            PEM-wrapped Ed25519 public key (RFC 8410). May be the
            placeholder string `PENDING-HANDSHAKE-RESPONSE` while
            status is `pending_outbound` — the peer's real key
            replaces it when the confirm envelope arrives.
        trust_tier:
          type: string
          enum: [connected, directory-listed, auto-sync]
        encryption_policy:
          type: string
          enum: [plaintext, e2e-encrypted]
        enabled: { type: boolean }
        status:
          type: string
          enum: [pending_outbound, pending_inbound, connected]
          description: |
            Handshake state machine (migration 00052 + v1.md §11).
            Outbound delivery (1.22.D) gates on connected only.
        handshake_at: { type: string, format: date-time }
        handshake_by_user_ref: { type: integer, format: int64 }
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        notes: { type: string }
        share_in_visible_list:
          type: boolean
          description: |
            Per-peer opt-in for peer-of-peer discovery (Phase
            1.22.B-d). When true, this peer appears in
            GET /federation/peers/visible — other peers can
            then surface it as a discovery suggestion. Default
            false; explicit opt-in.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    FederationVisiblePeer:
      type: object
      description: |
        Minimal projection of a peer for /federation/peers/visible.
        Public — no auth required to fetch. Excludes operator-
        private fields like notes or trust_tier.
      required: [instance_url, display_name, instance_public_key, fingerprint]
      properties:
        instance_url: { type: string }
        display_name: { type: string }
        instance_public_key: { type: string }
        fingerprint: { type: string }

    FederationVisiblePeerList:
      type: object
      required: [peers]
      properties:
        peers:
          type: array
          items: { $ref: "#/components/schemas/FederationVisiblePeer" }

    FederationPeerSuggestion:
      type: object
      required:
        - id
        - source_peer_id
        - source_display_name
        - source_url
        - suggested_url
        - suggested_display_name
        - suggested_public_key
        - suggested_fingerprint
        - cached_at
      properties:
        id: { type: string, format: uuid }
        source_peer_id: { type: string, format: uuid }
        source_display_name: { type: string }
        source_url: { type: string }
        suggested_url: { type: string }
        suggested_display_name: { type: string }
        suggested_public_key: { type: string }
        suggested_fingerprint: { type: string }
        cached_at: { type: string, format: date-time }

    FederationPeerSuggestionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FederationPeerSuggestion" }

    FederationPeerSuggestionRefreshResult:
      type: object
      required: [outcomes]
      properties:
        outcomes:
          type: array
          items:
            type: object
            required: [source_peer_id, source_display_name, source_url, count]
            properties:
              source_peer_id: { type: string, format: uuid }
              source_display_name: { type: string }
              source_url: { type: string }
              count: { type: integer }
              error: { type: string }

    FederationDirectory:
      type: object
      description: |
        One subscribed federation directory.
        Pairing alone shares no content; directories are
        discovery aids per docs/spec/federation-directory/v1.md.
      required:
        - id
        - directory_url
        - operator_name
        - operator_public_key
        - operator_fingerprint
        - subscribed_at
        - subscribed_by_user_ref
        - enabled
        - last_poll_status
        - last_poll_error
        - poll_interval_seconds
        - notes
      properties:
        id: { type: string, format: uuid }
        directory_url: { type: string }
        operator_name: { type: string }
        operator_public_key:
          type: string
          description: PEM-wrapped Ed25519 directory operator pubkey (pinned at subscribe time).
        operator_fingerprint: { type: string }
        operator_contact: { type: string }
        subscribed_at: { type: string, format: date-time }
        subscribed_by_user_ref: { type: integer, format: int64 }
        enabled: { type: boolean }
        last_polled_at:
          type: string
          format: date-time
          nullable: true
        last_poll_status:
          type: string
          enum: [never_polled, ok, unreachable, signature_failed, malformed, spec_version_mismatch]
        last_poll_error: { type: string }
        poll_interval_seconds: { type: integer }
        notes: { type: string }
        publish_status:
          type: string
          enum: [not_published, pending_dns, pending_register, listed, failed]
        publish_pending_token: { type: string }
        publish_token_expires_at:
          type: string
          format: date-time
          nullable: true
        publish_record_name: { type: string }
        publish_record_value: { type: string }
        publish_listing_id: { type: string }
        publish_last_attempt_at:
          type: string
          format: date-time
          nullable: true
        publish_last_error: { type: string }
        publish_display_name: { type: string }
        publish_region: { type: string }
        publish_description: { type: string }
        publish_tags:
          type: array
          items: { type: string }

    FederationDirectoryPublishMetadata:
      type: object
      required: [display_name]
      description: |
        Operator-chosen entry metadata for /v1/register. Saved on
        the directory row so it pre-fills the form next time.
      properties:
        display_name: { type: string, minLength: 1, maxLength: 200 }
        region: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
        tags:
          type: array
          items: { type: string, maxLength: 50 }
          maxItems: 20

    FederationDirectoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FederationDirectory" }

    FederationDirectorySubscribe:
      type: object
      required: [directory_url]
      properties:
        directory_url:
          type: string
          description: 'Directory base URL (https, no path, no trailing slash).'
        notes:
          type: string

    FederationDirectoryEntry:
      type: object
      required:
        - id
        - directory_id
        - instance_url
        - display_name
        - instance_public_key
        - fingerprint
        - verified_at
        - verified_via
        - cached_at
      properties:
        id: { type: string, format: uuid }
        directory_id: { type: string, format: uuid }
        instance_url: { type: string }
        display_name: { type: string }
        instance_public_key: { type: string }
        fingerprint: { type: string }
        region: { type: string }
        description: { type: string }
        tags:
          type: array
          items: { type: string }
        verified_at: { type: string, format: date-time }
        verified_via: { type: string }
        listing_id: { type: string }
        cached_at: { type: string, format: date-time }

    FederationDirectoryEntryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FederationDirectoryEntry" }

    FederationDirectoryPollResult:
      type: object
      required: [directory, entry_count]
      properties:
        directory:
          $ref: "#/components/schemas/FederationDirectory"
        entry_count: { type: integer }

    FederationInstanceDoc:
      type: object
      description: |
        This instance's federation identity — peers fetch this
        to verify signed envelopes from us. Stable shape per
        docs/spec/federation/v1.md §10.
      required: [instance_url, display_name, public_key_pem, fingerprint, protocol_version]
      properties:
        instance_url:
          type: string
          description: This instance's canonical https URL.
        display_name:
          type: string
          description: Operator-set display name (from sysconfig.site_name).
        public_key_pem:
          type: string
          description: PEM-wrapped Ed25519 instance public key.
        fingerprint:
          type: string
          description: Lowercase hex SHA-256 of the raw public key for out-of-band verification.
        protocol_version:
          type: string
          description: Always `aa-fed/v1` for this release.

    HandshakeEnvelopeInner:
      type: object
      description: |
        Inner payload of a handshake envelope per v1.md §11.
        Signed using RFC-8785-canonical JSON.
      required:
        - protocol
        - type
        - from
        - from_display_name
        - from_public_key_pem
        - to
        - nonce
        - timestamp
      properties:
        protocol: { type: string, description: 'Always `aa-handshake/v1`' }
        type:
          type: string
          enum: [offer, confirm]
        from: { type: string }
        from_display_name: { type: string }
        from_public_key_pem: { type: string }
        to: { type: string }
        nonce: { type: string }
        timestamp: { type: string, format: date-time }

    HandshakeEnvelope:
      type: object
      required: [envelope, signature]
      properties:
        envelope:
          $ref: "#/components/schemas/HandshakeEnvelopeInner"
        signature:
          type: string
          description: Base64-std Ed25519 signature over the canonical envelope.

    HandshakeAccepted:
      type: object
      required: [status, peer_id]
      properties:
        status:
          type: string
          enum: [accepted_pending, completed, ignored_duplicate]
          description: |
            `accepted_pending`: we created a pending_inbound row; admin must accept.
            `completed`: handshake finished (either confirm landed, or cross-handshake auto-merged).
            `ignored_duplicate`: we already had this row in a terminal state.
        peer_id:
          type: string
          format: uuid

    FederationHandshakeInitiate:
      type: object
      required: [instance_url]
      properties:
        instance_url:
          type: string
          description: Peer's instance URL (https, no path, no trailing slash).
        display_name:
          type: string
          description: |
            Optional; defaults to the URL host. Operator can rename
            later from the peer detail page.

    FederationPeerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FederationPeer" }

    FederationPeerCreate:
      type: object
      required: [instance_url, display_name, instance_public_key]
      properties:
        instance_url:
          type: string
          description: 'Must be https://, no trailing slash, no path component.'
        display_name: { type: string, minLength: 1, maxLength: 200 }
        instance_public_key:
          type: string
          description: PEM-wrapped Ed25519 public key. Validated server-side.
        trust_tier:
          type: string
          enum: [connected, directory-listed, auto-sync]
          default: connected
        encryption_policy:
          type: string
          enum: [plaintext, e2e-encrypted]
          default: plaintext
        enabled: { type: boolean, default: true }
        notes: { type: string }

    FederationPeerUpdate:
      type: object
      description: |
        PATCH shape — every field optional. Omitting a field
        leaves it unchanged. instance_url and instance_public_key
        are NOT editable; defederate + re-pair to change them.
      properties:
        display_name: { type: string, minLength: 1, maxLength: 200 }
        trust_tier:
          type: string
          enum: [connected, directory-listed, auto-sync]
        encryption_policy:
          type: string
          enum: [plaintext, e2e-encrypted]
        enabled: { type: boolean }
        notes: { type: string }
        share_in_visible_list:
          type: boolean
          description: |
            Per-peer opt-in for peer-of-peer discovery (Phase
            1.22.B-d). Toggle this to expose the peer in our
            /federation/peers/visible response so other peers
            can surface it as a suggestion.

    UserKeyRotationResult:
      type: object
      description: |
        Response from the rotation endpoints
        (/account/security/rotate-federation-keys and
        /admin/federation/users/{ref}/rotate-keys). The new public
        key is base64-encoded for transport; clients render it as
        a verification fingerprint or pass it along to the
        federation actor profile.
      required: [user_ref, new_version, new_public_key_b64, algorithm]
      properties:
        user_ref:
          type: integer
          format: int64
          description: Subject user whose key was rotated.
        new_version:
          type: integer
          format: int32
          description: Version of the freshly-minted current key. Equals previous_version + 1, or 1 if no prior key existed.
        previous_version:
          type: integer
          format: int32
          description: |
            Version of the key just demoted to retained state. 0
            when no prior current key existed (defensive — shouldn't
            happen post-I-b but documented for completeness).
        new_public_key_b64:
          type: string
          description: Base64-encoded 32-byte X25519 public key for the new version.
        algorithm:
          type: string
          description: Always `naclbox-x25519-v1` today; recorded for forward-compat.
        retained_until_days:
          type: integer
          format: int32
          description: |
            Grace window applied to the demoted previous key. Read
            from sysconfig at rotation time; pass-through so the UI
            can render "your previous key is reapable on YYYY-MM-DD."

    FederationKeyHealth:
      type: object
      description: |
        Aggregate counts feeding the
        /admin/federation/key-health dashboard. Five counts in
        one round-trip; drill-down endpoints (
        ListUsersMissingKeypair, ListRecentRotations) cover the
        per-row detail when the operator follows a tile.
      required:
        - users_total
        - users_missing_keypair
        - remote_actors_missing_enc_key
        - peers_missing_capabilities
        - retained_keys_near_expiry
      properties:
        users_total:
          type: integer
          format: int64
          description: Total approved users on this instance.
        users_missing_keypair:
          type: integer
          format: int64
          description: |
            Approved users with no current federation_user_keys
            row. Healthy steady state = 0; non-zero surfaces the
            I-b boot backfill gap.
        remote_actors_missing_enc_key:
          type: integer
          format: int64
          description: |
            federation_remote_actors rows whose
            encryption_public_key is NULL. Pre-I-c peers OR a
            peer who hasn't yet emitted an inbound activity
            carrying their key.
        peers_missing_capabilities:
          type: integer
          format: int64
          description: |
            federation_peers rows that haven't completed I-d
            capability negotiation. Surfaces the "needs re-pair"
            cohort.
        retained_keys_near_expiry:
          type: integer
          format: int64
          description: |
            Retained federation_user_keys rows whose
            retained_until trips in the next 7 days. Preview of
            what the sweeper will reap soon.
        recent_rotations:
          type: array
          description: |
            Last 50 rotations across all users; ordered newest
            first. Surfaced inline so the dashboard renders
            without a separate round-trip.
          items: { $ref: "#/components/schemas/FederationKeyRotationEvent" }
        users_missing_keypair_sample:
          type: array
          description: |
            Per-user drill-down on the "users missing keypair"
            tile. Up to 100 rows; oldest-account-first so the
            operator can prioritise long-standing gaps.
          items: { $ref: "#/components/schemas/UserMissingKeypair" }

    FederationKeyRotationEvent:
      type: object
      description: |
        Audit-style projection of a single
        rotation. Pulled from federation_user_keys.rotated_at +
        rotated_by_user_ref so the dashboard renders without
        joining audit_events.
      required: [user_ref, version, rotated_at]
      properties:
        user_ref:
          type: integer
          format: int64
        version:
          type: integer
          format: int32
        rotated_at:
          type: string
          format: date-time
        rotated_by_user_ref:
          type: integer
          format: int64
          nullable: true
          description: |
            user.ref of whoever triggered the rotation. NULL when
            the original triggering admin has since been deleted
            (the FK is ON DELETE SET NULL). Equals user_ref for
            self-rotation; differs for admin-initiated recovery.

    UserMissingKeypair:
      type: object
      description: |
        Drill-down row for the "users missing
        keypair" tile on the admin federation health dashboard.
      required: [ref, username]
      properties:
        ref:
          type: integer
          format: int64
        username:
          type: string
          nullable: true
        created:
          type: string
          format: date-time
          nullable: true
          description: When the user record was created. Old creation date + no keypair = the I-b boot backfill missed them across reboots.

    AdminActivity:
      type: object
      description: |
        One row from the activities ledger (ADR 0044). Surfaces the full AP envelope payload + the
        operator-facing metadata the admin audit UI renders. See
        [docs/spec/federation/v1.md §3](../../docs/spec/federation/v1.md)
        for the wire-format contract this projection mirrors.
      required:
        - id
        - activity_uri
        - activity_type
        - actor_uri
        - source
        - published_at
        - created_at
      properties:
        id: { type: string, format: uuid }
        activity_uri: { type: string }
        activity_type: { type: string }
        actor_uri: { type: string }
        actor_user_ref:
          type: integer
          format: int64
          nullable: true
          description: NULL for peer-sourced activities (we don't have a local ref for the remote actor).
        object_uri:
          type: string
          nullable: true
        object_kind:
          type: string
          nullable: true
        object_local_id:
          type: string
          nullable: true
        target_uri:
          type: string
          nullable: true
        to:
          type: array
          items: { type: string }
        cc:
          type: array
          items: { type: string }
        payload:
          type: object
          additionalProperties: true
        signature_value:
          type: string
          nullable: true
        signature_pubkey:
          type: string
          nullable: true
        source:
          type: string
          description: '`local` or peer instance URL.'
        published_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    AdminActivityList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminActivity" }
        next_cursor:
          type: string
          nullable: true

    NotificationUnreadCount:
      type: object
      required: [count]
      properties:
        count: { type: integer, format: int64 }

    NotificationMarkAllResult:
      type: object
      required: [marked_count]
      properties:
        marked_count: { type: integer, format: int64 }

    DirectMessage:
      type: object
      description: One DM between two users.
      required: [id, sender_user_ref, recipient_user_ref, body, sent_at]
      properties:
        id: { type: string, format: uuid }
        sender_user_ref: { type: integer, format: int64 }
        recipient_user_ref: { type: integer, format: int64 }
        body: { type: string }
        sent_at: { type: string, format: date-time }
        read_at:
          type: string
          format: date-time
          nullable: true
          description: NULL = unread by recipient.

    DirectMessageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DirectMessage" }
        next_cursor:
          type: string
          nullable: true

    DirectMessageThread:
      type: object
      description: |
        Inbox row — one per peer the caller has DM'd. Denormalized
        peer identity + the most recent message excerpt + this
        peer's unread count so the inbox renders without N+1
        round-trips.
      required:
        - peer_user_ref
        - peer_username
        - last_message_id
        - last_sender_user_ref
        - last_body
        - last_sent_at
        - unread_count
      properties:
        peer_user_ref: { type: integer, format: int64 }
        peer_username: { type: string }
        peer_display_name: { type: string, nullable: true }
        peer_avatar_url: { type: string, nullable: true }
        last_message_id: { type: string, format: uuid }
        last_sender_user_ref:
          type: integer
          format: int64
          description: |
            Which side authored the most recent message in this
            thread. Lets the inbox card render "You: ..." vs
            "PeerName: ..." prefixes.
        last_body: { type: string }
        last_sent_at: { type: string, format: date-time }
        last_read_at:
          type: string
          format: date-time
          nullable: true
        unread_count:
          type: integer
          format: int64
          description: |
            Count of unread messages from this peer in this thread.
            Sum across all threads matches the envelope-pill total.

    DirectMessageThreadList:
      type: object
      required: [threads]
      properties:
        threads:
          type: array
          items: { $ref: "#/components/schemas/DirectMessageThread" }

    DirectMessageUnreadCount:
      type: object
      required: [count]
      properties:
        count: { type: integer, format: int64 }

    SendDirectMessageRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000

    DirectMessageMarkReadResult:
      type: object
      required: [marked_count]
      properties:
        marked_count: { type: integer, format: int64 }

    Comment:
      type: object
      description: |
        A single comment in a thread. Threading is via parent_id +
        root_id + depth (caller renders nested replies indented by
        depth). annotation_* fields are NULL for plain comments; the
        review-mode feature reuses the same row shape.

        Federation: exactly one of {author_user_ref} XOR
        {peer_id + actor_uri} is set per row. Local-authored
        comments have author_user_ref set + peer_id NULL.
        Remote-authored comments (from a paired peer per
        ADR 0043 / phase 1.22.D) have author_user_ref NULL +
        peer_id + actor_uri + display_name populated. Clients
        render "<display_name> @ <peer's host>" for remote rows.
      required:
        [id, target_kind, target_id, root_id, depth,
         body, body_html, like_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        target_kind:
          type: string
          enum: [post, asset, collection]
        target_id: { type: string, format: uuid }
        parent_id:
          type: string
          format: uuid
          nullable: true
        root_id: { type: string, format: uuid }
        depth: { type: integer }
        author_user_ref:
          type: integer
          format: int64
          nullable: true
          description: Local author user.ref. NULL for remote-authored comments (see peer_id / actor_uri).
        body: { type: string }
        body_html:
          type: string
          description: Server-rendered safe HTML; clients should render this rather than reformatting `body`.
        annotation_type:
          type: string
          enum: [point, rect, timestamp, frame, whiteboard, text-range]
          nullable: true
        annotation_data:
          type: object
          additionalProperties: true
          nullable: true
        like_count: { type: integer, format: int64 }
        edited_at:
          type: string
          format: date-time
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        peer_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The federation peer that originated this comment. NULL
            for local-authored rows. Set in tandem with actor_uri
            + display_name when the comment came in via the
            federation inbox.
        actor_uri:
          type: string
          nullable: true
          description: |
            The remote actor's URI on their home instance (e.g.
            https://studio-b.example/users/bob). NULL for
            local-authored rows.
        display_name:
          type: string
          nullable: true
          description: |
            Display name resolved from federation_remote_actors
            cache for remote-authored comments. May be empty if
            the remote instance hasn't shipped display hints yet;
            clients should fall back to the actor_uri's host +
            local-part when this is empty.

    CommentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Comment" }
        next_cursor:
          type: string
          nullable: true

    CommentCreate:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: |
            When set, the new comment is a reply to this parent.
            Depth and root_id are computed server-side from the
            parent row.

    WhiteboardContent:
      type: object
      required: [layers, source_w, source_h]
      description: |
        Vector source of truth for a whiteboard / annotation sketch.
        The frontend renders from this; OCR / AI ingestion later can
        consume it directly without going through the raster snapshot.
      properties:
        source_w:
          type: integer
          minimum: 1
          description: |
            Width of the source canvas in CSS pixels at save time.
            Used to scale the drawing proportionally when re-rendered
            in a different viewport size — strokes are stored in
            source-canvas coordinates, not viewport pixels.
        source_h:
          type: integer
          minimum: 1
        image_hash:
          type: string
          nullable: true
          description: |
            Optional content-addressed hash of a rasterized PNG
            snapshot in object storage. Convenience output for OCR /
            AI / PDF export later. Null on save means strokes are
            authoritative and the snapshot will be lazily rendered.
        canvas_color:
          type: string
          description: |
            Canvas background color (C-1.18). Hex string painted
            behind every layer before items render. Defaults to
            '#ffffff' when missing so saves from C-1.0..C-1.17
            render identically.
        layers:
          type: array
          minItems: 1
          maxItems: 32
          description: |
            Ordered bottom-to-top. Each layer carries its own visible
            / opacity / lock / items payload — same shape Photoshop /
            Procreate use. Capped at 32 to keep payloads bounded.
          items:
            type: object
            required: [id, items]
            properties:
              id: { type: string, description: "Stable per-layer identifier (UUIDv4 from the client)." }
              name: { type: string }
              visible: { type: boolean, default: true }
              opacity: { type: number, minimum: 0, maximum: 1, default: 1 }
              locked:
                type: boolean
                default: false
                description: "When true the layer is read-only; visibility stays toggleable."
              items:
                type: array
                description: |
                  Polymorphic items on this layer. `kind` is the
                  discriminator: stroke (free-form brush), shape
                  (line / arrow / rect / ellipse), text (inline
                  label), or image (pasted/dropped bitmap, stored
                  inline as a base64 data: URL for now).
                items:
                  type: object
                  required: [kind]
                  properties:
                    kind:
                      type: string
                      enum: [stroke, shape, text, image]
                    # Stroke fields
                    tool:
                      type: string
                      enum: [pen, marker, highlighter, eraser, line, arrow, rect, rounded-rect, ellipse, triangle, right-triangle, diamond, pentagon, hexagon, star, heart, callout-rect, callout-oval]
                    color: { type: string, description: "Legacy single color (still set on shape items for back-compat). Stroke + text items use this exclusively; shape items prefer strokeColor / fillColor when present." }
                    strokeColor: { type: string, description: "Shape outline color (C-1.17). Falls back to `color` when missing." }
                    fillColor: { type: string, description: "Shape fill color (C-1.17). Falls back to `color` when missing." }
                    width: { type: number, minimum: 0, maximum: 200 }
                    opacity: { type: number, minimum: 0, maximum: 1, default: 1 }
                    points:
                      type: array
                      items:
                        type: array
                        minItems: 2
                        maxItems: 3
                        items: { type: number }
                    # Shape / Text / Image bbox
                    x: { type: number }
                    y: { type: number }
                    w: { type: number }
                    h: { type: number }
                    fill: { type: number, minimum: 0, maximum: 1, description: "Shape fill opacity. 0 = outline only, 1 = solid fill." }
                    # Text fields
                    body: { type: string, maxLength: 10000 }
                    fontSize: { type: number, minimum: 8, maximum: 256 }
                    align: { type: string, enum: [left, center, right], default: left }
                    bold: { type: boolean, default: false }
                    italic: { type: boolean, default: false }
                    # Image fields
                    src:
                      type: string
                      description: |
                        Base64 data: URL OR remote URL. Pasted images
                        are embedded as data URLs (5 MB cap enforced
                        client-side); content-addressed `image_hash`
                        reference lands in a later phase.
                    rotation: { type: number, default: 0 }

    LintDiagnostic:
      type: object
      required: [line, col, severity, message, source]
      properties:
        line:
          type: integer
          minimum: 1
          description: 1-based line number.
        col:
          type: integer
          minimum: 1
          description: 1-based column.
        end_line:
          type: integer
          minimum: 1
          nullable: true
        end_col:
          type: integer
          minimum: 1
          nullable: true
        severity:
          type: string
          enum: [info, warning, error]
        message:
          type: string
        source:
          type: string
          description: |
            The linter that produced this diagnostic
            (`json` / `yaml` / `markdown` for the first cut).
            Frontend renders it as a small badge next to each row.

    LintResult:
      type: object
      required: [linter, skipped]
      properties:
        linter:
          type: string
          description: |
            Producer name, or `"none"` when no linter is wired for
            the asset's extension.
        skipped:
          type: boolean
          description: |
            `true` when no linter ran (unsupported extension or
            empty source). The diagnostics array is omitted or
            empty in that case.
        diagnostics:
          type: array
          items: { $ref: "#/components/schemas/LintDiagnostic" }

    WhiteboardCreate:
      type: object
      required: [content]
      properties:
        title:
          type: string
          maxLength: 200
          description: Optional title for the sidebar list.
        content:
          $ref: "#/components/schemas/WhiteboardContent"

    TextAnnotationAnchor:
      type: object
      description: |
        Range anchor for a doc-viewer annotation. Lines are 1-based;
        columns are 0-based (CodeMirror convention). The range may
        be empty (`start == end`) for a sticky note at a position.
      required: [style, color, start_line, start_col, end_line, end_col]
      properties:
        style:
          type: string
          enum: [highlight, strikethrough, underline, comment, note]
          description: |
            Visual treatment the editor's decoration extension applies.
            `comment` + `note` carry user text in the parent comment's
            `body`; `highlight` / `strikethrough` / `underline` typically
            have empty bodies but the field is free to set.
        color:
          type: string
          description: |
            Hex color (`#fef08a` etc.). The default swatch palette is
            five highlighter colors, but any hex string is accepted so
            the future "custom color" picker works without a schema
            change.
          maxLength: 16
        start_line:
          type: integer
          minimum: 1
        start_col:
          type: integer
          minimum: 0
        end_line:
          type: integer
          minimum: 1
        end_col:
          type: integer
          minimum: 0
        resolved:
          type: boolean
          default: false
          description: |
            Review-flow flag — the panel can filter resolved annotations
            out of the active list. Resolution does not delete; the
            anchor stays anchored for audit.

    TextAnnotationCreate:
      type: object
      required: [anchor]
      properties:
        body:
          type: string
          description: User commentary (Markdown later; plain text now).
          maxLength: 8000
        anchor:
          $ref: "#/components/schemas/TextAnnotationAnchor"

    TextAnnotationPatch:
      type: object
      description: |
        Field-by-field PATCH. Pass only what changed. Pass the full
        `anchor` when changing any range/style/color field — the
        server replaces the whole anchor blob (no partial JSON merge).
      properties:
        body:
          type: string
          maxLength: 8000
        anchor:
          $ref: "#/components/schemas/TextAnnotationAnchor"

    AclEntry:
      type: object
      required: [principal_type, principal_id, permission, granted_at]
      properties:
        principal_type:
          type: string
          enum: [user, role, team]
        principal_id:
          type: string
          description: |
            BIGINT user.ref for principal_type=user; UUID for role/team.
            Stored as text so the polymorphic column fits all three.
          maxLength: 64
        permission:
          type: string
          enum: [read, write, admin]
        granted_at: { type: string, format: date-time }
        granted_by_user_ref:
          type: integer
          format: int64
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Time-boxed grant. NULL = permanent. The handler-side check
            ignores rows whose expires_at < NOW().

    AclCreate:
      type: object
      required: [principal_type, principal_id, permission]
      properties:
        principal_type:
          type: string
          enum: [user, role, team]
        principal_id:
          type: string
          maxLength: 64
          pattern: "^([0-9]+|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$"
          description: |
            A REFERENCE, not a name. BIGINT `user.ref` when
            principal_type=user; the row's UUID when it is role or team.

            The pattern admits the union of both forms because one
            schema serves all three principal types; the handler
            enforces the type-specific half and rejects a mismatch with
            400. Passing a username here used to be accepted and stored,
            producing a grant that no read rule could ever match (#916).

            Which principal types actually CONFER access depends on the
            surface. `asset_type_acls` honours all three. `post_acls`
            and `collection_acls` honour `user` only — their read rules
            gate on `principal_type = 'user'` because role/team scoping
            on content is ADR 0010 Layer 5 and unimplemented — so those
            two endpoints reject role and team with 400 rather than
            storing a grant that does nothing.
        permission:
          type: string
          enum: [read, write, admin]
        expires_at:
          type: string
          format: date-time
          nullable: true

    TeamMember:
      type: object
      required: [team_id, user_ref, added_at]
      properties:
        team_id: { type: string, format: uuid }
        user_ref: { type: integer, format: int64 }
        added_at: { type: string, format: date-time }
        added_by_user_ref:
          type: integer
          format: int64
          nullable: true
        username:
          type: string
          description: |
            The member's username. Added for the team page's member
            strip (#684) — without it a client can only render the ref,
            and resolving names would be one request per member.
        display_name:
          type: string
          nullable: true
          description: |
            The member's profile display name, or null when they have
            no profile row. A client should fall back to `username`.

    EpubSpineEntry:
      type: object
      description: |
        One chapter entry from an EPUB's spine (reading order).
        Returned by GET /assets/{id}/epub/spine; consumed by the
        frontend reader to render the TOC + chapter picker.
      required: [idx, label, href, media_type]
      properties:
        idx:
          type: integer
          minimum: 0
          description: Zero-based spine position; pass to /chapters/{idx}.
        label:
          type: string
          description: Display label — NCX/TOC label, else manifest id, else "Chapter N".
        href:
          type: string
          description: Original manifest href (debugging / federation parity).
        media_type:
          type: string
          example: application/xhtml+xml

    EpubSearchHit:
      type: object
      description: |
        One match returned by the EPUB full-text search endpoint.
        Multiple hits per chapter are possible (capped at 5).
      required: [chapter_idx, chapter_label, snippet, char_offset]
      properties:
        chapter_idx:
          type: integer
          minimum: 0
        chapter_label:
          type: string
        snippet:
          type: string
          description: ~120 char excerpt centred on the match.
        char_offset:
          type: integer
          description: Char offset of the match in the plain-text chapter body.

    AssetCompanion:
      type: object
      description: |
        A sidecar file (texture, MTL, .bin, etc.) attached to a 3D
        model asset under a relative path. The viewer's LoadingManager
        rewrites the model's relative resource references through
        these entries so external resources resolve to the right
        content-addressed blob.
      required: [id, asset_id, path, content_type, size_bytes, created_at]
      properties:
        id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
        path:
          type: string
          description: |
            Relative path the model file references this companion at
            — e.g. 'character.mtl' for an OBJ's sibling .mtl, or
            'textures/foo.png' for a glTF texture in a subdirectory.
          example: textures/character-a.png
        content_type:
          type: string
          example: image/png
        size_bytes:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time

    AssetAlternate:
      type: object
      description: |
        A sibling-version variant of an asset (palette swap, transcode,
        thumbnail, authored variant). Where companions are sidecars the
        primary asset references, alternates stand on their own and can
        be downloaded individually.
      required: [id, asset_id, label, kind, content_type, size_bytes, created_at, metadata, created_by_user_ref]
      properties:
        id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
        label:
          type: string
          description: Human label shown in alt-file lists; unique per asset.
          example: walk — team-green palette
        kind:
          type: string
          description: |
            Provenance tag — palette_swap | thumbnail | low_res |
            authored | transcode. Open-ended.
          example: palette_swap
        content_type:
          type: string
          example: image/png
        size_bytes:
          type: integer
          format: int64
        origin_server_id:
          type: string
          format: uuid
          nullable: true
        created_by_user_ref:
          type: integer
          format: int64
          nullable: true
        created_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
          description: Kind-specific JSON. Sprite tool palette swaps store the colour remap here.

    UploadResult:
      type: object
      required: [hash, size, content_type, deduped, pin_subject_type, pin_subject_id]
      properties:
        hash:
          type: string
          description: lowercase hex sha256 of the uploaded bytes
          example: a1b2c3d4e5f6...0123
        size:
          type: integer
          format: int64
          description: Byte count
        content_type:
          type: string
          example: image/jpeg
        deduped:
          type: boolean
          description: |
            true if the hash was already present on this server and
            the bytes were NOT re-uploaded to the backend. A new pin
            was still added for the caller.
        pin_subject_type:
          type: string
          example: user
        pin_subject_id:
          type: string
          example: "9"
    CreateApiTokenRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: CI deploy bot
        expires_at:
          type: string
          format: date-time
          nullable: true
        scopes:
          type: array
          items:
            type: string
          description: |
            Capability codes this token may exercise. Empty array means
            the token can do whatever the user can do. (Token scopes
            are recorded but not yet enforced.)
    WorkflowState:
      type: object
      description: |
        One node in a workflow state machine. States are scoped to a
        domain (post, asset). Initial / terminal flags are read-only —
        the underlying `workflow_state` table is seeded, not edited
        from the API.
      required:
        [id, domain, code, label, sort_order, is_initial, is_terminal,
         icon, color, requires_note]
      properties:
        id: { type: string, format: uuid }
        domain:
          type: string
          description: domain key (e.g. `post`, `asset:1`)
        code:
          type: string
          description: stable machine identifier (e.g. `draft`)
        label:
          type: string
          description: human label (e.g. `Draft`)
        sort_order: { type: integer, format: int32 }
        is_initial: { type: boolean }
        is_terminal: { type: boolean }
        icon:
          type: string
          description: |
            Short token (e.g. "check", "clock", "x-circle") the
            frontend maps to an SVG in its iconset. Empty string =
            no icon override (frontend picks a default).
        color:
          type: string
          description: |
            Hex color (e.g. `#16a34a`) for the state badge background.
            Empty string = frontend falls back to a neutral tone.
        requires_note:
          type: boolean
          description: |
            When true, `workflow.Service.Transition` rejects calls
            that move INTO this state with an empty note. Useful for
            rejection / needs-work states where the reason matters
            for audit and the originating user.

    ExtractionFailure:
      type: object
      description: |
        One row in the metadata extraction_failure queue (Phase
        1.18.A-2). Represents a single per-asset failure the
        operator should review — unsupported MIME, malformed file,
        validator-rejected field value, or a recovered library
        panic. Dismissal is soft so the row stays for audit.
      required:
        [id, asset_id, format, error_kind, message, occurred_at]
      properties:
        id: { type: string, format: uuid }
        asset_id: { type: string, format: uuid }
        format:
          type: string
          description: Source MIME type at the time the failure occurred.
        error_kind:
          type: string
          description: |
            One of: `unsupported_format`, `malformed_file`,
            `library_panic`, `validation`.
        message: { type: string }
        field_key:
          type: string
          description: |
            CanonicalField for validation failures (empty for
            whole-file errors). Example: `camera_model`.
        raw_value:
          description: |
            Operator-displayable raw value the extractor produced,
            JSONB. Empty / null for whole-file failures.
        occurred_at: { type: string, format: date-time }
        dismissed_at:
          type: string
          format: date-time
          nullable: true
          description: NULL while pending; set by the dismiss endpoint.

    ExtractionFailureList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ExtractionFailure" }
        total:
          type: integer
          format: int64
          description: |
            Total pending (not-yet-dismissed) failure rows ignoring
            limit/offset but obeying the error_kind + format filters.
            Powers the admin nav badge.

    JobSummary:
      type: object
      required: [id, type, status, priority, attempts, max_attempts, age_seconds]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        status:
          type: string
          enum: [pending, running, done, failed, cancelled]
        priority: { type: integer }
        attempts: { type: integer }
        max_attempts: { type: integer }
        claimed_by: { type: string, nullable: true }
        claimed_at: { type: string, format: date-time, nullable: true }
        lease_expires_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, nullable: true }
        origin_server_id: { type: string, format: uuid, nullable: true }
        scheduled_for: { type: string, format: date-time, nullable: true }
        enqueued_at: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        age_seconds:
          type: integer
          format: int64
          description: Seconds since the job was enqueued (server-computed).
    TriggerSweep:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [orphan_scan, checksum_verify]
          description: Which sweep to run.
    StorageSweep:
      type: object
      required: [id, kind, status, objects_scanned, findings_count]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, example: "orphan_scan" }
        status: { type: string, enum: [running, completed, failed] }
        objects_scanned: { type: integer, format: int64 }
        findings_count: { type: integer, format: int64 }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true }
    StorageSweepList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StorageSweep" }
    StorageSweepFinding:
      type: object
      required: [id, finding, object_hash, variant_key, detail]
      properties:
        id: { type: string, format: uuid }
        finding:
          type: string
          enum: [missing_object, orphan_object, checksum_mismatch, size_mismatch]
        object_hash: { type: string }
        variant_key: { type: string }
        detail: { type: string, description: Human-readable specifics (expected vs actual). }
        detected_at: { type: string, format: date-time, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
    StorageSweepFindingList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StorageSweepFinding" }
        total: { type: integer, format: int64 }
    StorageUsage:
      type: object
      required: [object_count, variant_count, total_bytes, original_bytes, derivative_bytes, by_content_type, by_backend]
      properties:
        object_count:
          type: integer
          format: int64
          description: Distinct content-addressed objects.
        variant_count:
          type: integer
          format: int64
          description: Total variant rows (every rendition of every object, including the original).
        total_bytes:
          type: integer
          format: int64
          description: Deduplicated bytes on disk. Summed from storage_variants alone — see the endpoint description.
        original_bytes:
          type: integer
          format: int64
          description: Bytes held by the `original` variant of every object.
        derivative_bytes:
          type: integer
          format: int64
          description: Bytes held by every non-original variant (previews, turntables, HLS segments, ...).
        by_content_type:
          type: array
          items: { $ref: "#/components/schemas/StorageContentTypeBucket" }
        by_backend:
          type: array
          items: { $ref: "#/components/schemas/StorageBackendBucket" }
    StorageContentTypeBucket:
      type: object
      required: [content_type, variant_count, total_bytes]
      properties:
        content_type: { type: string, example: "image/png" }
        variant_count: { type: integer, format: int64 }
        total_bytes: { type: integer, format: int64 }
    StorageBackendBucket:
      type: object
      required: [backend, object_count]
      properties:
        backend: { type: string, example: "fs" }
        object_count: { type: integer, format: int64 }
    StorageVariantFamily:
      type: object
      required: [family, variant_count, distinct_keys, object_count, total_bytes]
      properties:
        family:
          type: string
          description: variant_key up to the first '/', or the whole key when it has none.
          example: "turntable"
        variant_count:
          type: integer
          format: int64
          description: Variant rows in this family.
        distinct_keys:
          type: integer
          format: int64
          description: How many distinct raw variant_keys the family covers.
        object_count:
          type: integer
          format: int64
          description: Distinct objects that have at least one variant in this family.
        total_bytes: { type: integer, format: int64 }
        newest_at:
          type: string
          format: date-time
          nullable: true
          description: created_at of the most recent variant in the family.
    StorageVariantFamilyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StorageVariantFamily" }
    JobList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/JobSummary" }
        total:
          type: integer
          format: int64
          description: Total jobs under the same status+type filter, ignoring limit/offset.
    JobWorker:
      type: object
      required: [claimed_by, job_id, type, priority, attempts, lease_stale]
      properties:
        claimed_by: { type: string, description: Worker id holding the job. }
        job_id: { type: string, format: uuid }
        type: { type: string }
        priority: { type: integer }
        attempts: { type: integer }
        claimed_at: { type: string, format: date-time, nullable: true }
        lease_expires_at: { type: string, format: date-time, nullable: true }
        lease_stale:
          type: boolean
          description: True when the lease has lapsed (RequeueStuckJobs will reclaim it).
    JobWorkerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/JobWorker" }
    JobStatusCount:
      type: object
      required: [type, status, count]
      properties:
        type: { type: string }
        status: { type: string }
        count: { type: integer, format: int64 }
    JobStatusCountList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/JobStatusCount" }
    ScheduledJob:
      type: object
      required: [id, type, status, priority, attempts, max_attempts, due_in_seconds]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        status: { type: string }
        priority: { type: integer }
        attempts: { type: integer }
        max_attempts: { type: integer }
        scheduled_for: { type: string, format: date-time, nullable: true }
        enqueued_at: { type: string, format: date-time, nullable: true }
        due_in_seconds:
          type: integer
          format: int64
          description: Seconds until scheduled_for (server-computed).
    ScheduledJobList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ScheduledJob" }
        total: { type: integer, format: int64 }
    JobConcurrency:
      type: object
      required: [type, cap]
      properties:
        type: { type: string }
        cap:
          type: integer
          description: Max concurrent jobs of this type; 0 means uncapped.
    JobConcurrencyList:
      type: object
      required: [items, applies_on_restart]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/JobConcurrency" }
        applies_on_restart:
          type: boolean
          description: |
            True — the worker Pool loads caps at boot, so an edit takes
            effect on the next restart, not live. The UI surfaces this.
    SetJobConcurrency:
      type: object
      required: [cap]
      properties:
        cap:
          type: integer
          minimum: 0
          maximum: 64
          description: Max concurrent; 0 clears the cap (uncapped).
    MetadataBackfillStart:
      type: object
      description: |
        Operator-facing input to start a new backfill run. All
        fields optional — empty body = "all active image assets".

        Filters compose with AND. `asset_type_ref` (singleton) and
        `asset_type_refs` (multi-select) are merged into one IN-list
        — populating both is equivalent to passing the singleton's
        value inside the array.

        The `file_extensions` and `include_non_image` fields let
        operators target raws / PDFs without spilling the
        backfill over their entire image catalogue.
      properties:
        asset_type_ref:
          type: integer
          format: int64
          nullable: true
          description: |
            Narrow to one asset type. Null / omitted = every type.
        asset_type_refs:
          type: array
          items:
            type: integer
            format: int64
          description: |
            Multi-select asset-type filter.
            Empty / omitted = no asset-type filter from this field;
            singleton `asset_type_ref` still applies if set.
        file_extensions:
          type: array
          items:
            type: string
          description: |
            Lowercase file extensions (no leading dot) to include.
            Empty / omitted = no extension filter. Typical Phase
            1.18.A-3.B uses: `["cr2","nef","dng","arw","rw2"]` to
            backfill raw embedded previews, or `["pdf"]` to backfill
            PDF /Info metadata + page counts.
        include_non_image:
          type: boolean
          description: |
            Open the population to non-image assets (PDFs today;
            comics + ebooks later). Defaults to false so older
            callers keep the original image-only scope.

    MetadataBackfillRun:
      type: object
      description: |
        One backfill-coordinator run row. Counters move as the
        coordinator job walks the population.
      required: [id, total, processed, succeeded, failed, started_at]
      properties:
        id: { type: string, format: uuid }
        asset_type_ref:
          type: integer
          format: int64
          nullable: true
        total:
          type: integer
          format: int64
          description: |
            Unknown at start (0). Reserved for a future "count first"
            pre-walk pass; current implementation leaves at 0 and
            the UI shows "—" when zero + not-yet-completed.
        processed: { type: integer, format: int64 }
        succeeded: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        started_at: { type: string, format: date-time }
        completed_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        started_by_user_ref:
          type: integer
          format: int64
          nullable: true

    MetadataBackfillRunList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MetadataBackfillRun" }

    ActivityEvent:
      type: object
      description: |
        One audit row that names the caller, projected for the caller
        rather than for an auditor (#600). See `GET /account/activity`
        for why each omission is an omission.
      required: [id, event_type, occurred_at, role]
      properties:
        id:
          type: string
          format: uuid
          description: |
            The audit row id. Carried so the page can key rows and so a
            support conversation can name one exactly; it is not a
            handle to anything the caller can fetch.
        event_type:
          type: string
          description: |
            The raw dotted event type (`user.password_changed`,
            `admin.asset.soft_deleted`, ...). Sent raw, not as a
            pre-rendered sentence, because the client already owns the
            translations and a server-side sentence would be one
            language baked into an API. Clients MUST render an unknown
            type as a readable fallback rather than a raw payload —
            new types land continuously and a page that only knows
            today's list must not degrade to a JSON dump.
        occurred_at:
          type: string
          format: date-time
        role:
          type: string
          enum: [by_me, on_my_account]
          description: |
            `by_me` — the caller is the actor. `on_my_account` — the
            caller is the subject and somebody (or something) else
            acted.

            A row where the caller is BOTH actor and subject is
            `by_me`: changing your own password is an act, not
            something that happened to you, and reporting it as the
            latter would make a self-service change read like an
            intrusion.

            Rows with no actor at all (a system sweep, an expiry)
            reach the caller only as subject, so they are
            `on_my_account` — which is the honest reading: nobody the
            caller can ask did it.
        metadata:
          type: object
          additionalProperties: true
          description: |
            The event's payload — PRESENT ONLY ON `by_me` ROWS, where
            it is a record of the caller's own action. Absent, not
            empty, on `on_my_account` rows: an empty object would
            claim the event had no detail, when the truth is that its
            detail belongs to whoever acted. See the endpoint
            description.

            Shapes are per-event-type and are not part of this
            contract; clients read the keys they recognise and ignore
            the rest.
    ActivityList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ActivityEvent" }
        next_cursor:
          type: string
          nullable: true
          description: |
            Opaque token for the next page; omitted on the final page.
            Pass back unchanged as the `cursor` query parameter.
    TrashItem:
      type: object
      description: |
        One soft-deleted thing the caller owns (#937). Deliberately a
        thin projection rather than the entity itself: trash needs to
        identify an item and offer to undo, and shipping the full
        Asset/Post/Collection here would make three read contracts
        reachable through a fourth door with a different gate.
      required: [kind, id, title, deleted_at, restorable_by_caller, restore_requested]
      properties:
        kind:
          type: string
          enum: [asset, post, collection]
          description: |
            Which entity this is, and therefore which restore endpoint
            applies: `/admin/assets/{id}/restore`,
            `/admin/posts/{id}/restore` or
            `/admin/collections/{id}/restore`. (Those routes live under
            `/admin` for historical reasons; since #936 they admit the
            deleter as well as `system.admin`.)
        id:
          type: string
          format: uuid
        title:
          type: string
          description: |
            The item's title — `collections.name` for a collection.
            May be empty: assets and posts both default `title` to ''.
        deleted_at:
          type: string
          format: date-time
        restorable_by_caller:
          type: boolean
          description: |
            True when this caller may restore this item right now.
            False means an administrator or another user with mutation
            rights deleted it, or no deleter was recorded — either way
            the owner must ask (#931). Renders the difference between a
            Restore button and an explanation; never a button that 403s.
        deleted_reason:
          type: string
          nullable: true
          description: |
            The reason the deleter typed, if any (#985). Null when none
            was given.

            Disclosed in BOTH scopes, for different reasons. In
            `owned_by_me` it is the promise the delete dialog already
            makes to whoever writes it — "you don't own this, so the
            owner will be shown what you write here" — and until #931
            the field was not projected, so that promise was never
            kept. In `deleted_by_me` it is simply the caller's own
            words read back.
        restore_requested:
          type: boolean
          description: |
            True when this caller already has a `pending` restoration
            appeal filed against this row (#931), so the UI shows a
            quiet "requested" state instead of an Appeal button that
            would coalesce onto the existing row and look like nothing
            happened.

            Only ever about the CALLER's own request. It is not a count
            and does not disclose that anyone else has appealed.
        purge_after:
          type: string
          format: date-time
          nullable: true
          description: |
            When the retention GC becomes eligible to hard-delete this
            item: `deleted_at` plus the configured retention window for
            its kind (`soft_delete.{asset,post,collection}_retention_days`,
            default 30). Advisory, not a guarantee — the GC wakes once a
            day and works in batches, so the real purge lands at or
            after this instant. Absent only if the window could not be
            read.
    TrashList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TrashItem" }
        next_cursor:
          type: string
          nullable: true
          description: |
            Opaque token for the next page; omitted on the final page.
            Pass back unchanged as the `cursor` query parameter.
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required, missing, or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "authentication required: sign in and retry with a valid session or API token"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: Request shape is valid but the action doesn't apply (e.g. subtitles on a non-video/audio asset).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    FieldValueUnprocessable:
      description: |
        The request is well-formed but the value cannot be stored.

        ONE response shared by the asset and the collection field-value
        writers, so the two cannot drift into describing the same
        refusal differently. `field` is the field's code and `option`
        the slug that was refused, so a client can point at the
        offending term without parsing `error`.

        - `field_not_for_collection` — the field is asset-scoped.
        - `value_type_mismatch` — the value is in the wrong member for
          the field's declared type.
        - `unknown_option` — `select` / `multi_select` / `tree` only:
          the slug is not in the field's controlled vocabulary.
        - `option_not_offerable` — the slug names a deprecated or
          archived term the record did not already hold. Terms are
          never hard-deleted, so a value already carrying a retired
          slug keeps saving; only *changing* to one is refused.
        - `dangling_reference` — `reference` only: `value_ref` names an
          asset that does not resolve. Refused on write; a value whose
          target is deleted after a valid write still reads (bare id).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FieldValueUnprocessable"
    Forbidden:
      description: Authenticated but missing required capabilities
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflict (slug taken, would create cycle, etc.)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate-limited; retry after a brief pause.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
