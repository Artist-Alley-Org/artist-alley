      summary: List teams (paginated; optional ancestor filter)
      description: |
        Returns every team the caller can see, ordered by name. When
        `ancestor` is supplied, returns only that team and every team
        in its closure (descendants), which lets the upload modal
        scope a picker to "teams under Aurora R&D" without N+1.
        Requires `teams.read`.
      tags: [teams]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: ancestor
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A page of teams
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createTeam
      summary: Create a team
      description: |
        Requires `teams.create`. The optional `parent_ids` array
