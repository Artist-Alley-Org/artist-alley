      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: followUser
      summary: Follow this user
      description: |
        Directional follow. Idempotent: re-following
        someone you already follow returns 204 too. Self-follow is
        rejected with 400. Cross-block-edge follow (either party has
        blocked the other) is rejected with 403 — modern platforms
        treat blocks as a hard interaction stop.

        Wires the long-parked `posts.visibility='followers'` gate.
        The browse-feed "Following" tab also
        activates the moment any follow row exists.
      tags: [social]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Now following (or was already).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: unfollowUser
      summary: Stop following this user
      description: |
        Idempotent unfollow. Returns 204 whether
        the edge existed or not. Symmetric to followUser; never
        affects the reverse follow (if the target also follows you,
        they continue to follow you).
      tags: [social]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: No longer following (or never was).
        "401":
          $ref: "#/components/responses/Unauthorized"

