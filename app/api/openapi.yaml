      description: |
        Doc-viewer review tools (Phase 1.18.D-B). Each entry is a
        top-level `comments` row with `annotation_type='text-range'`;
        its `annotation_data` carries `{style, color, start_line,
        start_col, end_line, end_col, resolved}`. `body` is the
        user's commentary text (empty for pure highlights).

        Replies on annotations live in the regular comment thread
        and surface via `GET /assets/{id}/comments`, not here.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
