  /posts:
    get:
      operationId: listPosts
      summary: List posts (paginated feed)
      description: |
        The browse-page feed. Public posts visible to authenticated
        callers; the author's own posts of any visibility are also
        returned. Anonymous access to this feed is not yet
        implemented.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: author_ref
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: visibility
          in: query
          required: false
          schema:
            type: string
            enum: [private, org-only, followers, explicit-share]
        - name: q
          in: query
          required: false
          description: |
            Plain-text search over the post's TSVECTOR. A future
            search DSL will replace this with a full query language.
          schema: { type: string, maxLength: 200 }
        - name: tag
          in: query
          required: false
          schema: { type: string }
        - name: feed
          in: query
          required: false
          description: |
            Pre-baked feed selector. When set, applies
            a viewer-anchored filter on top of the other query params.
            - `following` — restrict to authors the caller follows
              (browse-page "Following" tab). Returns an empty page for
              callers who don't follow anyone yet.
            - `latest` (default) — no extra filter; same shape as
              omitting the param.
          schema:
            type: string
            enum: [latest, following]
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: include_deleted
          in: query
          required: false
          description: |
            Admin-only. When `true`, soft-deleted posts appear
            alongside live rows. Non-admin callers ignored.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: A page of posts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createPost
      summary: Publish a new post
      description: |
        Wraps 1+ existing assets into a Post. The asset bytes are
        already in storage (POST /storage/objects) and the asset
        entities are already created (POST /assets); this endpoint
        ties them together with the descriptive metadata.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostCreate" }
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /posts/by-asset/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getPostsByAsset
      summary: Posts that feature an asset (post-by-asset lookup)
      description: |
        The visibility-filtered list of posts whose members include the
        given asset (#478 slice-2, ADR 0070). An asset is a many-to-many
        member of ≥0 posts, so this returns 0..N. Anonymous-visible under
        public mode (ADR 0063), returning only public posts; authenticated
        callers see the walled-garden tier — the SAME gating as the feed,
        no new enforcement plane. The client redirects when exactly one
        post is visible and lists when several.
      tags: [posts]
      security: []
      responses:
        "200":
          description: Visible posts featuring the asset (possibly empty)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostList" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /posts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getPost
      summary: Fetch a post with its members + tags
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePost
      summary: Partial update of a post
      description: |
        Optimistic concurrency: pass the post's last-
        known `updated_at` as `if_unchanged_since`; 409 if the
        row has been edited since.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Edited by someone else after `if_unchanged_since`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditConflict" }
    delete:
      operationId: deletePost
      summary: Soft-delete a post
      description: |
        Removes the post from feed views. Member assets are not
        deleted (an asset may belong to multiple posts; storage pins
        are owned at the asset layer).

        Accepts optional `{reason}` body captured
        into `deleted_reason` for the admin recovery-window audit.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SoftDeleteRequest" }
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/posts/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: restorePost
      summary: Restore a soft-deleted post
      description: |
        Admin-only. Clears `deleted_at` + `deleted_reason` on the
        post row and fires an `admin.post.restored` audit event.
        Returns 404 if the post is already live (or doesn't exist).
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Restored
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/acls:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listPostAcls
      summary: List ACL entries on a post
      description: |
        Returns every ACL row attached to this post. ACL rows are
        additive grants on top of the post's visibility and the
        role / team-scope checks. Requires read access to the post.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: ACL entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AclEntry" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addPostAcl
      summary: Grant a permission on a post to a principal
      description: |
        Inserts one ACL row. The same principal can hold multiple
        permission levels (e.g. read AND write) — that's two POSTs.
        Requires write access to the post (owner / posts.admin /
        system.admin) so a contributor can't grant access beyond
        their own ability to mutate.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AclCreate" }
      responses:
        "204":
          description: ACL row added
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/acls/{principal_type}/{principal_id}/{permission}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: principal_type
        in: path
        required: true
        schema:
          type: string
          enum: [user, role, team]
      - name: principal_id
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
      - name: permission
        in: path
        required: true
        schema:
          type: string
          enum: [read, write, admin]
    delete:
      operationId: removePostAcl
      summary: Revoke a specific permission row from a principal
      description: |
        Removes the exact (principal_type, principal_id, permission)
        tuple. Other permission levels for the same principal stay
        in place. 404 if the row doesn't exist.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/like:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getPostLike
      summary: Whether the current caller has liked this post
      description: |
        Used by the post modal on open to decide whether the Like
        button shows the active state. Returns {liked: bool}.
        Anonymous callers get 401.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Like state for the caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostLikeState" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: likePost
      summary: Like a post
      description: |
        Idempotent — re-liking a post the caller already liked is a
        no-op (counter doesn't bump twice). Requires `posts.like`
        capability (granted to Base by default).
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Liked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: unlikePost
      summary: Remove the caller's like on a post
      description: |
        404 if the caller hadn't liked the post (the optimistic-update
        client uses this signal to revert its local state). Counter
        is maintained by the 00020 trigger; we never decrement to
        below zero.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Unliked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/comments:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listPostComments
      summary: List the comment thread on a post
      description: |
        Returns LIVE comments (deleted_at IS NULL), grouped by root,
        within each root sorted depth-then-time so replies appear
        under their parent. Threads ordered newest-root-first.
        Cursor pagination advances by root.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A page of comments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createPostComment
      summary: Post a comment (or reply) on a post
      description: |
        Top-level comment when `parent_id` is omitted; reply when set.
        Depth and root_id are computed server-side from the parent's
        row. Requires `posts.comment` capability (Base default).
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentCreate" }
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/whiteboards:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listPostWhiteboards
      summary: List whiteboard sketches on a post
      description: |
        Whiteboards are free-form brush sketches anchored to a post —
        brainstorm sessions, sketch passes, off-asset notes.
        Storage-wise they're top-level `comments` rows with
        `annotation_type='whiteboard'`; the partial index
        `comments_whiteboards_idx` makes this query cheap.

        Replies to a whiteboard are normal comments threaded under it
        and surface via the regular comment thread query, not this
        list.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Whiteboards for the post (newest first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Comment" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createPostWhiteboard
      summary: Save a whiteboard sketch on a post
      description: |
        Persists a brush-sketch as a top-level comment with
        `annotation_type='whiteboard'`. The `content` payload carries
        the strokes (vector source of truth — perfect-freehand input
        points + per-layer arrangement) plus the source canvas
        dimensions so the viewer can re-render proportionally
        regardless of viewport size.

        Requires `posts.comment` capability (Base default) — same
        gate as posting a regular comment, since whiteboards ARE
        comments at the storage layer. Future phases can split the
        capability if finer governance is needed.

        `title` is optional. If omitted the sidebar list shows
        "Untitled sketch" with the author + timestamp.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WhiteboardCreate" }
      responses:
        "201":
          description: Whiteboard saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/lint:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: lintAsset
      summary: Run syntax checks against a doc asset's source
      description: |
        Dispatches to a language-aware syntax checker based on the
        asset's file extension and returns a flat diagnostic list.

        First cut ships three Go-native checkers (JSON / YAML /
        Markdown). For any other extension the response carries
        `skipped: true` so the UI can render "no linter configured
        for this language" instead of "0 issues".

        Future iterations slot in subprocess-based linters
        (`py_compile`, `node --check`, `luac -p`, `shellcheck`, ...)
        behind the same shape; the client doesn't need to know which
        producer generated a diagnostic — it just renders the line /
        col / severity / message.

        Synchronous: every Go-native checker runs in single-digit
        milliseconds on a typical doc.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Lint result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LintResult" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/text-annotations:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listAssetTextAnnotations
      summary: List text-range annotations on a doc asset
      description: |
        Doc-viewer review tools. Each entry is a
        top-level `comments` row with `annotation_type='text-range'`;
        its `annotation_data` carries `{style, color, start_line,
        start_col, end_line, end_col, resolved}`. `body` is the
        user's commentary text (empty for pure highlights).

        Replies on annotations live in the regular comment thread
        and surface via `GET /assets/{id}/comments`, not here.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Annotations on the asset
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Comment" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createAssetTextAnnotation
      summary: Create a text-range annotation on a doc asset
      description: |
        Persists a highlight / strikethrough / underline / comment /
        note as a top-level `comments` row with
        `annotation_type='text-range'`. `body` carries the user's
        commentary (empty string is fine for a pure highlight).

        Requires `posts.comment` capability — annotations are
        comments at the storage layer, so the same gate applies.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TextAnnotationCreate" }
      responses:
        "201":
          description: Annotation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /text-annotations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateTextAnnotation
      summary: Update a text-range annotation
      description: |
        Mutates `body` (the commentary text) and/or `annotation_data`
        (style / color / range / resolved). The annotation must
        already exist with `annotation_type='text-range'`. Only the
        annotation's author or a moderator can update.

        For deletion, use `DELETE /comments/{id}` — annotations are
        comments at the storage layer.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TextAnnotationPatch" }
      responses:
        "200":
          description: Updated annotation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /comments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deleteComment
      summary: Soft-delete a comment
      description: |
        Authors can always delete their own (requires
        `comments.delete.own`, Base default). Moderators can delete
        any comment (requires `comments.delete.any`, Admin only).
        Soft-deletes via deleted_at + empties body/body_html; the
        counter trigger decrements posts.comment_count.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/assets:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: addPostAsset
      summary: Attach an existing asset to a post
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostAssetWrite" }
      responses:
        "204":
          description: Member added
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/assets/{asset_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: asset_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: removePostAsset
      summary: Remove an asset from a post
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
