  /posts:
    get:
      operationId: listPosts
      summary: List posts (paginated feed)
      description: |
        The browse-page feed. Public posts visible to authenticated
        callers; the author's own posts of any visibility are also
        returned. Phase 1.13.G adds anonymous access when the system
        config allows it.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: author_ref
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: visibility
          in: query
          required: false
          schema:
            type: string
            enum: [private, followers, public]
        - name: q
          in: query
          required: false
          description: |
            Plain-text search over the post's TSVECTOR. Phase 1.12
            (search DSL) replaces this with the full query language.
          schema: { type: string, maxLength: 200 }
        - name: tag
          in: query
          required: false
          schema: { type: string }
