  /teams/{id}/follow:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: followTeam
      summary: Follow a team (bookmark it into your teams rail)
      description: |
        Adds the caller to `team_follows` (#577). Requires `teams.read`
        — the same capability that lets you see the team at all.

        ## A follow is a BOOKMARK, not a relationship

        It grants nothing. It does not touch `team_memberships`, it is
        never read by any authorization rule, and following a studio
        does not widen one row of what you can see of its work — the
        visibility planes decide that and do not consult this table.
        All it does is put the team in your teams rail.

        There is deliberately no unread model and no notification
        fanout behind it; a follow is a bookmark, not a subscription.

        ## Idempotent

        Following a team you already follow is a no-op `204`, not a
        `409`. The insert is `ON CONFLICT DO NOTHING`, so a
        double-tapped button and a retried request are the same
        request.

        ## Refusals are indistinguishable

        A nonexistent team and a soft-deleted team both answer `404`
        with the same body, because the FK cannot see `teams.deleted_at`
        and an explicit liveness probe therefore runs first. The two
        MUST stay indistinguishable: any difference between them turns
        this endpoint into a team-existence oracle over every studio on
        the instance, which is the discipline
        `visibility.CanAssignToTeam` carries for the same reason.
      tags: [teams]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Followed (or already following)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: unfollowTeam
      summary: Unfollow a team
      description: |
        Removes the caller's `team_follows` row (#577). Idempotent:
        unfollowing a team you do not follow is a `204`, not a `404`.

        No liveness probe and no `404` branch at all, on purpose. The
        `POST` needs one because it writes a row that must point at a
        live team; a DELETE only ever removes the caller's own row, and
        a row pointing at a since-deleted team is exactly the row a
        user would most want to be able to drop. Refusing to let them
        would strand it in their rail forever.
      tags: [teams]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Unfollowed (or was not following)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/me/followed-teams:
    get:
      operationId: getMyFollowedTeams
      summary: Teams the caller follows (the teams rail)
      description: |
        The caller's `team_follows` rows, resolved to teams and ordered
        by name (#577). Soft-deleted teams are filtered out, so a
        studio that is deleted simply leaves the rail.

        Distinct from `GET /auth/me/teams`, which returns MEMBERSHIPS.
        The two lists overlap only by coincidence: you can follow a
        team you are not in, and being in a team does not put it here.
        Keeping them separate endpoints is what keeps a bookmark from
        being mistaken for an authorization fact.
      tags: [teams, auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Teams the caller follows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Team" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /tags/{tag}/follow:
    parameters:
      - name: tag
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 200 }
        description: |
          The tag itself, URL-encoded. Tags are a CORPUS rather than an
          entity — `post_tags` has no id to address one by — so the
          string is the identifier.

          Matching against the corpus is EXACT, because `GET /posts`'s
          `tag` filter is exact. The server trims surrounding whitespace
          (the same normalisation `post_tags` writes apply) and does
          nothing else: folding case here would give the reader a rail
          chip whose `?tag=` filter finds nothing while their Following
          feed fills with differently-cased posts. Unifying case across
          the corpus is the #789 vocabulary arc's decision.
    post:
      operationId: followTag
      summary: Follow a tag (bookmark it into your browse rail)
      description: |
        Adds the caller to `tag_follows` (#1123). Authentication is the
        only gate.

        ## A follow is a BOOKMARK, not a grant

        It grants nothing. It is never read by any authorization rule,
        and following a tag does not widen one row of what you can see.
        What it does is put a `#` chip in your browse rail and add a
        third source to the Following feed — posts carrying a tag you
        follow, INTERSECTED with what you could already read, never
        unioned with it.

        That distinction is sharper for tags than for teams and users,
        because a tag's other side is written by whoever authored the
        post: anyone may tag their own restricted post `fantasy`. The
        Following filter is therefore ANDed beside the post read rule
        rather than ORed into it, so a restricted post carrying a tag
        you follow stays exactly as invisible as it was.

        ## No capability, and no existence check

        Team follows require `teams.read` because that is what lets you
        see a team at all. A tag needs no such gate: it is a free
        string, and the feed it feeds is already gated by the post read
        rule.

        There is deliberately no "does this tag exist" probe either —
        following a tag nobody has used is legal and inert until
        somebody uses it. A probe would have to answer from a corpus
        spanning posts the caller cannot read, which would make this
        endpoint an oracle enumerating the tags of private work one
        guess at a time.

        ## Idempotent

        Following a tag you already follow is a no-op `204`, not a
        `409`.
      tags: [tags]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Followed (or already following)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: unfollowTag
      summary: Unfollow a tag
      description: |
        Removes the caller's `tag_follows` row (#1123). Idempotent:
        unfollowing a tag you do not follow is a `204`, not a `404`.

        The tag is trimmed on the way in exactly as it is on the write
        path, so a follow and its unfollow normalise to the same key. No
        length refusal here, unlike `POST`: an over-long tag cannot be
        in the table, so the delete simply matches nothing — which is
        the right answer to "make sure I am not following this".
      tags: [tags]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Unfollowed (or was not following)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/me/followed-tags:
    get:
      operationId: getMyFollowedTags
      summary: Tags the caller follows (the rail's # chips)
      description: |
        The caller's `tag_follows` rows (#1123), most recently followed
        first.

        Recency rather than alphabetical, unlike
        `GET /auth/me/followed-teams`. A team chip carries an avatar and
        a name the reader recognises by shape, so alphabetical order is
        findable; a row of `#` chips is visually uniform, and recency is
        the only ordering that puts a reader's newest interest where
        they will look for it. The reader's own `tag_order` preference
        is a partial override of this order.

        No liveness filter, because a tag has no liveness: one with no
        posts left matches nothing and the chip stays until the reader
        removes it. Returns `[]`, never `null`.
      tags: [tags, auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Tags the caller follows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FollowedTag" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

