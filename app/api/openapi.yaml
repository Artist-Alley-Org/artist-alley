openapi: 3.0.3
info:
  title: artist-alley API
  version: 0.1.0
  description: |
    The artist-alley REST API.

    This file is the **contract**: server types and handler interfaces are
    generated from it by `oapi-codegen` (see `app/api/oapi-codegen.yaml`).
    Frontend code (SvelteKit, eventually) will generate its TypeScript
    types from the same source. Edits to this file are the only way to
    change the public API surface — handlers will fail to compile if the
    Go signatures drift from the spec.

    Generate: `cd app && docker run --rm -v $PWD:/src -w /src/api \
      ghcr.io/oapi-codegen/oapi-codegen:latest -config oapi-codegen.yaml \
      openapi.yaml`

servers:
  - url: /api/v1
    description: Local development behind nginx (port 8088 by default)

tags:
  - name: auth
    description: |
      Authentication and identity. The login endpoint accepts username +
      password and sets an `rs_session` cookie (PHP-compatible) so the
      same session works against both the Go API and the legacy RS PHP
      pages. API tokens (`aa_pat_*`, 32 random bytes) are an alternate
      auth method for programmatic clients — issued via this same set
      of endpoints, presented via `Authorization: Bearer <token>`.
  - name: assets
    description: |
      Upload, download, and pin management for asset bytes. Storage is
      content-addressed: every blob is keyed by sha256(contents), so
      identical uploads dedup automatically and federated peers can
      verify transfers by hash. See ADR 0008.
  - name: asset_types
    description: Configurable categories applied to every uploaded asset
      (Photo, Document, Video, Audio, custom types, etc.)
  - name: posts
    description: |
      Feed entity. A Post wraps 1+ Assets with descriptive metadata
      (title, description, tags, visibility) and carries
      like/comment counters. Browse-page reads from /posts; assets
      are the file-bearing members beneath. Single-asset uploads
      still become Posts (a Post with one member) so the shape is
      uniform end-to-end. Phase 1.13.D-2.
  - name: collections
    description: |
      User-owned groupings of assets, per ADR 0009. UUID-keyed,
      federation-prepared. Three orthogonal axes — visibility
      (private/shared/public), membership (manual/query/hybrid), and
      lifecycle (permanent vs `expires_at`). Phase 1.11.A ships
      manual membership; query and grants land in 1.11.B/C.
  - name: teams
    description: |
      Organisational units with a DAG hierarchy. A team can have
      multiple parents (Diablo R&D Character Art reports to Diablo R&D
      AND Cross-Studio Art Review). Capability grants scoped to a team
      apply to that team and all descendants via the materialised
      `team_closure`. ADR 0010 Layer 4.
  - name: users
    description: |
      Public-facing user profiles. The RS `user` table holds auth-bearing
      data we never expose; `user_profiles` (Phase 1.13.D-4) holds the
      display-layer fields (display_name, bio, avatar_url, social_links).
      Reads merge both tables and substitute defaults when no profile
      row exists. Federation: the profile is the unit that gets
      mirrored to peer sites.

paths:
  /auth/login:
    post:
      operationId: login
      summary: Sign in with username and password
      description: |
        Verifies credentials against the RS `user` table using the same
        HMAC-then-bcrypt hashing scheme RS uses (so PHP-created users
        log in unchanged). On success: writes a new session token to
        `user.session` and sets the `rs_session` cookie.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated. Returns the current user; an
            `rs_session` cookie is set in the response headers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          description: |
            Identity provider was registered (license includes its
            feature flag) but the credential-verification impl has
            not yet landed in this binary. Distinct from 401 so the
            admin UI can render "build pending" vs "wrong password".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/providers:
    get:
      operationId: listIdentityProviders
      summary: Enumerate the identity providers active on this install
      description: |
        Returns the set of identity providers the login surface can
        dispatch to. The built-in password provider is always
        present. Enterprise providers (LDAP, SAML, etc.) appear only
        when the install's license includes the matching feature
        flag (`sso_ldap`, `sso_saml`).

        Used by the login page to render the right buttons + by the
        admin UI to surface which enterprise gates have been
        activated. Anonymous endpoint — the list is intentionally
        public so unauthenticated users see the SSO buttons they
        need to click.
      tags: [auth]
      responses:
        "200":
          description: Active provider list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProviderList"

  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      description: |
        Clears `user.session` for the calling user and expires the
        `rs_session` cookie. Safe to call when unauthenticated
        (returns 204 either way).
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Logged out (or wasn't logged in).

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Return information about the caller
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/tokens:
    get:
      operationId: listApiTokens
      summary: List the caller's API tokens
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: List of tokens (without the token values).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiTokenSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createApiToken
      summary: Issue a new API token
      description: |
        Creates a Personal Access Token bound to the caller. The token
        value is returned in the response **once and only once** — it
        is hashed in the database and cannot be recovered later. Lose
        it, revoke and re-issue.

        Token creation is restricted to cookie-authenticated callers,
        so a stolen token cannot mint further tokens.
      tags: [auth]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiTokenRequest"
      responses:
        "201":
          description: Token issued. The plaintext token is in the
            `token` field of the response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/capabilities:
    get:
      operationId: listCapabilities
      summary: List every capability the server knows about
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["caps.read"]
      responses:
        "200":
          description: List of capabilities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Capability"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/roles:
    get:
      operationId: listRoles
      summary: List roles and the capabilities attached to each
      description: |
        Includes parent_id but does NOT recurse — each role's
        `capabilities` array is just the direct attachments. Effective
        capabilities for a user (role chain + grants - revokes) are
        exposed via `/auth/me/capabilities`.
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["roles.read"]
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/me/capabilities:
    get:
      operationId: getMyCapabilities
      summary: Effective capabilities for the current user
      description: |
        Returns the fully resolved capability set: role-chain capabilities
        unioned with explicit grants, minus explicit revokes. This is
        what middleware uses for enforcement.
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Effective capability set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveCapabilities"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/users/{ref}/role:
    put:
      operationId: setUserRole
      summary: Assign a role to a user (admin)
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["users.write"]
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserRoleRequest"
      responses:
        "204":
          description: Role assigned
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{ref}/capabilities:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: listAdminUserCapabilities
      summary: List a user's explicit grants + revokes (admin)
      description: |
        Phase 1.17.F — returns the per-user GRANT and REVOKE override
        lists. Role-derived capabilities are not included (they're
        already returned by GET /auth/me/capabilities and the role
        editor surface). This list is the additive/subtractive
        delta admins manage by hand.
      tags: [users]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["users.read"]
      responses:
        "200":
          description: Per-user grant + revoke override lists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCapabilityOverrides"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{ref}/grants:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: addAdminUserGrant
      summary: Add a capability grant to a user (admin)
      tags: [users]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["users.write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCapabilityOverrideRequest"
      responses:
        "204":
          description: Grant inserted (or refreshed if it already existed).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{ref}/grants/{capability}:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: capability
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: removeAdminUserGrant
      summary: Remove a capability grant from a user (admin)
      description: |
        Pass `team_id` query param to scope to a team-scoped grant;
        omit for the global grant. Returns 404 when no matching grant
        exists (composite key, not by ID — there is no ID).
      tags: [users]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["users.write"]
      parameters:
        - name: team_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Grant removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{ref}/revokes:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: addAdminUserRevoke
      summary: Add a capability revoke to a user (admin)
      tags: [users]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["users.write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCapabilityOverrideRequest"
      responses:
        "204":
          description: Revoke inserted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{ref}/revokes/{capability}:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: capability
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: removeAdminUserRevoke
      summary: Remove a capability revoke from a user (admin)
      tags: [users]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["users.write"]
      parameters:
        - name: team_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Revoke removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/federation/directories:
    get:
      operationId: listFederationDirectories
      summary: List subscribed federation directories (Phase 1.22.B-c)
      description: |
        All directories we've subscribed to, newest-first. Each
        row carries the pinned operator pubkey + the last poll
        status. Gated on `system.admin`.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: List of directories.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationDirectoryList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: subscribeFederationDirectory
      summary: Subscribe to a federation directory
      description: |
        Fetches /v1/operator from the directory URL, captures the
        operator pubkey + fingerprint, and persists the
        subscription. The admin should review the returned
        fingerprint out-of-band before relying on the directory.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FederationDirectorySubscribe" }
      responses:
        "201":
          description: Subscription created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationDirectory" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Already subscribed to this directory URL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/federation/directories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: unsubscribeFederationDirectory
      summary: Unsubscribe from a directory (cascades cached entries)
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Unsubscribed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/federation/directories/{id}/poll:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: pollFederationDirectory
      summary: Force an immediate poll of one directory
      description: |
        Bypasses the background poller's cadence — useful when
        an admin just subscribed or wants to refresh manually.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Poll result (status + count).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationDirectoryPollResult" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/federation/directories/{id}/publish/challenge:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: requestFederationDirectoryPublishChallenge
      summary: Request a DNS-TXT challenge to publish this instance to a directory
      description: |
        POSTs /v1/challenge to the directory and persists the
        issued token + the DNS record the operator must publish.
        Flips status to `pending_dns`.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Challenge issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationDirectory" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Directory unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/federation/directories/{id}/publish/register:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: registerFederationDirectoryPublishListing
      summary: Submit /v1/register with the previously-issued token
      description: |
        Persists the operator-supplied display_name + region +
        description + tags, then POSTs /v1/register with the
        pending token. Caller MUST have completed the DNS step.
        On success flips status to `listed`; on failure stays
        `pending_dns` so the operator can retry once DNS
        propagates.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FederationDirectoryPublishMetadata" }
      responses:
        "200":
          description: Result of the register call.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationDirectory" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/federation/directories/{id}/entries:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listFederationDirectoryEntries
      summary: Browse cached entries from one directory
      description: |
        Returns the locally cached snapshot of the directory's
        listings — survives directory outages per the spec's
        local-caching rule.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: Cached entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationDirectoryEntryList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /federation/instance:
    get:
      operationId: getFederationInstance
      summary: This instance's federation actor doc
      description: |
        Public unauthenticated endpoint — returns the per-
        instance Ed25519 public key, the canonical instance URL,
        and the display name. This is what peers fetch when
        verifying inbound handshakes or HTTP-Sig'd requests
        (the latter ships in Phase 1.22.D).
      tags: [federation]
      responses:
        "200":
          description: Instance actor doc.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationInstanceDoc" }
        "503":
          description: Instance identity not yet generated (first-boot race).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /federation/peers/visible:
    get:
      operationId: getFederationPeersVisible
      summary: Peer-of-peer discovery — list of peers we've opted to share (Phase 1.22.B-d)
      description: |
        Public unauthenticated endpoint. Returns the subset of our
        connected+enabled peers that have `share_in_visible_list`
        toggled on. Other instances poll this to build their
        "Suggested peers (via this instance)" feed per ADR 0043.

        Per the spec these are advisory ONLY — a listed peer is
        a discovery hint, not a trust endorsement. Pairing still
        goes through the handshake from 1.22.B-b.
      tags: [federation]
      responses:
        "200":
          description: List of visible peers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationVisiblePeerList" }

  /federation/peers/handshake:
    post:
      operationId: postFederationHandshake
      summary: Peer-to-peer handshake endpoint (1.22.B-b)
      description: |
        Public unauthenticated endpoint — accepts signed
        handshake envelopes from peer instances per
        docs/spec/federation/v1.md §11. The envelope is signed
        by the offered Ed25519 public key (payload-signature
        only — transport HTTP-Sig is for established peers).
      tags: [federation]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HandshakeEnvelope" }
      responses:
        "200":
          description: Envelope accepted; result indicates resulting state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HandshakeAccepted" }
        "400":
          description: Malformed or unverifiable envelope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Instance identity not yet generated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/federation/peers/initiate:
    post:
      operationId: initiateFederationHandshake
      summary: Initiate an outbound handshake (1.22.B-b)
      description: |
        Admin "Pair by URL" entry. Creates a local
        pending_outbound row + sends a signed offer envelope to
        the peer. Idempotent on instance_url.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FederationHandshakeInitiate" }
      responses:
        "201":
          description: Local pending_outbound row created (offer POST may have failed; check notes).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationPeer" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/federation/peers/pending-inbound:
    get:
      operationId: listFederationPendingInbound
      summary: List pending inbound handshake requests
      description: |
        Admin "requests awaiting your approval" feed. Backed by
        the partial index federation_peers_pending_inbound_idx.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Pending inbound requests.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationPeerList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/federation/peers/{id}/accept:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: acceptFederationPeer
      summary: Accept a pending inbound handshake
      description: |
        Admin clicks "Accept" on a pending_inbound row. Flips
        local status to connected + sends a confirm envelope
        back to the peer.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Accepted; row is now connected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationPeer" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/federation/suggestions:
    get:
      operationId: listFederationPeerSuggestions
      summary: List cached peer-of-peer suggestions (Phase 1.22.B-d)
      description: |
        Returns suggestions from all sources, deduped against our
        own federation_peers (URLs we already federate with are
        hidden). Each suggestion carries provenance — which of
        OUR peers contributed it.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: List of suggestions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationPeerSuggestionList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/federation/suggestions/refresh:
    post:
      operationId: refreshFederationPeerSuggestions
      summary: Force a sweep of all connected peers for fresh suggestions
      description: |
        Iterates every connected+enabled peer, fetches their
        /federation/peers/visible response, and persists the
        results. Returns per-source feedback (count or error).
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Per-source refresh outcomes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationPeerSuggestionRefreshResult" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/federation/shares:
    get:
      operationId: listFederationShares
      summary: List federation shares (Phase 1.22.C-c)
      description: |
        Mutually-exclusive filter via query params:
        - `object_kind`+`object_id`: "who has access to this object?"
        - `peer_id`: "what am I sharing with this peer?"
        - `grantor_user_ref`: "what shares did this user grant?"
        Returns only ACTIVE shares. Gated on `system.admin`.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: object_kind
          in: query
          required: false
          schema:
            type: string
            enum: [asset, post, collection, workspace, brand_kit, user]
        - name: object_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: peer_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: grantor_user_ref
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Active shares matching the filter.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationShareList" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: grantFederationShare
      summary: Grant a federation share (write-ahead audit)
      description: |
        Creates federation_shares row + emits aa:Share activity +
        writes federation.share.granted audit event — all in one
        transaction per the design proposal §7.2 write-ahead
        invariant. Idempotent: duplicate POST on the active-row
        tuple (grantor, object, peer, target_user) returns 409
        with the existing share.

        Permission: caller must own the object OR have
        system.admin. Restricted objects require target_user_url
        (NaCl envelope wrap needs a key).
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FederationShareCreate" }
      responses:
        "201":
          description: Share granted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationShare" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Object or peer not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Active share already exists for this tuple.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationShare" }

  /admin/federation/shares/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeFederationShare
      summary: Revoke a federation share (aa:Unshare + audit, atomic)
      description: |
        Marks revoked_at + emits aa:Unshare activity + writes
        federation.share.revoked audit event — atomically.
        Recipient's local cache purges per design §4.2; their
        own derivative work (comments/annotations) is preserved
        per §4.3.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Share already revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationShare" }

  /admin/federation/outbox:
    get:
      operationId: listFederationOutbox
      summary: List federation outbox rows (Phase 1.22.D-c)
      description: |
        Returns per-recipient queued / sent / failed / cancelled
        rows from federation_outbox. Filterable by peer + status
        + activity type + date range; paginated. Gated on
        `system.admin`.

        Each row carries the activity_id back-reference so the
        admin UI can render the originating envelope alongside
        the delivery state.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: peer_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [queued, sent, failed, cancelled]
        - name: activity_type
          in: query
          required: false
          description: Filter by the originating activity's verb (Like / Create / aa:Share etc.).
          schema: { type: string }
        - name: since
          in: query
          required: false
          description: RFC3339 timestamp; only rows created at or after this.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: cursor
          in: query
          required: false
          description: Pagination cursor from a prior response (opaque).
          schema: { type: string }
      responses:
        "200":
          description: Outbox rows matching the filter.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationOutboxList" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/federation/outbox/{id}/requeue:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: requeueFederationOutbox
      summary: Re-queue a failed outbox row (Phase 1.22.D-c)
      description: |
        Resets a failed row to status=queued + attempts=0 + next_
        attempt_at=NOW(). The delivery worker picks it up on the
        next LISTEN/NOTIFY wake (sub-100ms in the happy path).

        Refuses (409) if the row is NOT in status=failed — re-
        queuing a queued row is a no-op race; re-queuing a sent
        row would duplicate-deliver. The admin UI's confirmation
        prompt SHOULD warn before re-queueing rows whose
        last_error references a non-retriable §12.1 reason
        (unknown_object, sig_invalid, encryption_required, etc.)
        since those will fail again — see the design proposal
        §3.4 retriable-flag mapping.

        Emits federation.outbox.requeued audit event.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Row re-queued; the updated outbox state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationOutbox" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Outbox row not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Row not in status=failed (idempotency guard).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/federation/inbox:
    get:
      operationId: listFederationInbox
      summary: List federation inbox rows (Phase 1.22.D-c)
      description: |
        Returns inbound activities from federation_inbox in their
        landed state (pending / processed / rejected / failed).
        Filterable by peer + status + activity type + date range;
        paginated. Gated on `system.admin`.

        Read-only — inbox rows can't be re-queued in the same
        way as outbox rows; the activity_uri UNIQUE constraint
        means a re-delivered envelope just lands on the existing
        row idempotently. Admins investigating rejections need
        to coordinate with the sender's outbox queue instead.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: peer_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, processed, rejected, failed]
        - name: activity_type
          in: query
          required: false
          schema: { type: string }
        - name: since
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Inbox rows matching the filter.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationInboxList" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/federation/peers/{id}/cancel-pending:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: cancelFederationPeerPending
      summary: Cancel all queued outbox rows for a peer (Phase 1.22.D-c)
      description: |
        Defederation-cascade hook. Marks every queued
        federation_outbox row for the peer as status=cancelled
        + last_error='peer defederation cascade' in ONE
        transaction. Emits a SINGLE
        federation.peer.cascade_cancelled audit event carrying
        the total cancellation count — NOT N audit events per
        the design proposal §7.4 single-audit invariant.

        Caller MUST also disable the peer separately (this
        endpoint does NOT alter the federation_peers row) —
        cancelling queued rows on an active peer would just race
        the new ones the dispatcher enqueues. The admin UI
        sequences disable → cancel-pending in one click.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Cascade complete; count of cancelled rows in body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CascadeCancelResult" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Peer not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/federation/peers:
    get:
      operationId: listFederationPeers
      summary: List federation peers (Phase 1.22.B-a)
      description: |
        All paired instances, newest-handshake-first. Gated on
        `system.admin`. Per ADR 0043 §"Trust model" the rows here
        are just the trusted-channel registry — content shares
        are managed separately via federation_shares (Phase
        1.22.C).
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        "200":
          description: A page of peers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationPeerList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createFederationPeer
      summary: Manually add a federation peer (1.22.B-a)
      description: |
        Manual peer entry — the operator pastes the peer's
        instance URL + display name + the PEM-encoded Ed25519
        instance public key (out-of-band coordination between
        operators). The automated handshake protocol lands in
        1.22.B-b and uses the same row shape.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FederationPeerCreate" }
      responses:
        "201":
          description: Peer created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationPeer" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Peer with this instance_url already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/federation/peers/{id}/defederation-preview:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: previewFederationPeerDefederation
      summary: Preview what defederation will cascade (Phase 1.22.C-d)
      description: |
        Backs the cascade-preview modal per the 1.22.C design
        proposal §8.5. Returns:
          - total_active_shares + per-object-kind breakdown
          - pending_handshakes (handshakes in flight that would
            be cancelled)
          - cached_suggestions (peer-of-peer suggestions
            contributed by this peer that would be dropped)
          - peer summary (display_name + URL for the modal
            header)
        Gated on `system.admin`.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Cascade impact summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationDefederationPreview" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/federation/peers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getFederationPeer
      summary: Get one federation peer
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Peer detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationPeer" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateFederationPeer
      summary: Edit a federation peer (tier / encryption_policy / enabled / notes / display_name)
      description: |
        Cannot change instance_url or instance_public_key — those
        require defederate + re-pair (the public_key change in
        particular signals re-handshake).
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FederationPeerUpdate" }
      responses:
        "200":
          description: Updated peer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationPeer" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteFederationPeer
      summary: Defederate a peer
      description: |
        Removes the peer row. Per ADR 0043 §"Trust model" the
        Phase 1.22.C federation_shares table cascades on this
        delete and Phase 1.22.D emits the final aa:Unshare
        activity to the peer so they purge their local cache.
        Cascade + activity emission happen automatically when
        those phases ship; this endpoint is the entry point.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Peer removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/activities:
    get:
      operationId: listAdminActivities
      summary: Admin audit view of the activities ledger
      description: |
        Cursor-paginated list of activity rows with optional
        filters (type, source, actor, object kind, since). Gated
        on `system.admin` capability per ADR 0044 — surfaces full
        payloads + addressing for the operator to audit federation
        activity.

        Hot-path notes: this endpoint is NOT cached at the writer
        layer because the filter-combination space is unbounded.
        The underlying SELECT is covered by per-dimension partial
        indexes (`activities_type_recent_idx`,
        `activities_actor_outbox_idx`,
        `activities_source_recent_idx`) so unfiltered + per-filter
        access patterns both hit indexed paths.
      tags: [admin, activities]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: activity_type
          in: query
          required: false
          description: |
            Filter to one activity type — e.g. `Like`, `Follow`,
            `Create`, `aa:Share`. See
            [activities.activity_type CHECK](../db/migrations/00049_activities_ledger.sql)
            for the closed set.
          schema: { type: string }
        - name: source
          in: query
          required: false
          description: |
            `local` for activities emitted by this instance, or a
            peer instance URL (e.g. `https://studio-b.example`) to
            filter to peer-received activities from one peer.
          schema: { type: string }
        - name: actor_user_ref
          in: query
          required: false
          description: |
            Filter to activities emitted by a single local actor.
            For peer-sourced activities (actor_user_ref is NULL),
            use the `source` filter instead.
          schema: { type: integer, format: int64 }
        - name: object_kind
          in: query
          required: false
          description: |
            Filter to activities about one object kind — e.g.
            `post`, `comment`, `asset`, `user`, `collection`.
          schema: { type: string }
        - name: since
          in: query
          required: false
          description: RFC 3339 timestamp; activities at or after this time only.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor from a prior response.
          schema: { type: string }
      responses:
        "200":
          description: A page of activity rows.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminActivityList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/license/status:
    get:
      operationId: getAdminLicenseStatus
      summary: Current license status (Phase 1.17.O)
      description: |
        Returns the cached, verified-at-boot snapshot of this
        install's license — tier, features, caps, expiry, etc. When
        no `.lic` file is installed, returns a synthetic
        "community" status (tier: community, features: community
        defaults, days_until_expiry: 0).

        The artist-alley app NEVER calls the license server at
        verification time. This endpoint just reads the in-memory
        cache populated at startup (and refreshed on
        POST /admin/license/upload — Phase 1.17.O-2).
      tags: [licensing]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["system.admin"]
      responses:
        "200":
          description: License snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/license/validate:
    post:
      operationId: validateAdminLicense
      summary: Dry-run verify a license envelope (Phase 1.17.O-2)
      description: |
        Verifies the supplied `.lic` text against the embedded
        publisher catalog without persisting anything. Used by the
        admin UI to preview a license before clicking "Install".

        On success the response carries the same `LicenseStatus`
        shape the GET endpoint returns, with `loaded: true` and the
        Status fields populated from the candidate envelope. The
        currently installed license is NOT touched.

        On verifier failure (`bad signature`, `expired`, `unknown
        publisher key`, etc.) the response is a structured
        `LicenseValidateError` describing the failure so the UI can
        render an actionable message instead of a generic 400.
      tags: [licensing]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["system.admin"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LicenseUploadRequest"
      responses:
        "200":
          description: Envelope verified successfully (not installed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseStatus"
        "400":
          description: Envelope rejected by the verifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseValidateError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/license/upload:
    post:
      operationId: uploadAdminLicense
      summary: Install a new license envelope (Phase 1.17.O-2)
      description: |
        Verifies the supplied `.lic` text and, on success, writes it
        to the configured `LicensePath` and atomically swaps the
        cached license state. The new status is returned in the
        same shape as `GET /admin/license/status`.

        Verification runs BEFORE the write — a bad envelope can never
        overwrite a working file on disk. On verifier failure the
        on-disk file and cached state are unchanged and the response
        is a structured `LicenseValidateError`.

        Returns 409 when the server has no LicensePath configured
        (the admin must set `AA_LICENSE_PATH` before uploading).
      tags: [licensing]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["system.admin"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LicenseUploadRequest"
      responses:
        "200":
          description: License installed; new status returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseStatus"
        "400":
          description: Envelope rejected by the verifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseValidateError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Server has no LicensePath configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Verified but write-to-disk failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/audit:
    get:
      operationId: listAdminAuditEvents
      summary: Admin audit log viewer (Phase 1.17.K)
      description: |
        Cursor-paginated read of the system-wide audit event log.
        Every filter is optional; combining them narrows the result.
        Returns the rows ordered newest-first along with the total
        count (cursor-independent) so the UI can render a "X events
        matched" header and a next-page button.

        `next_cursor` is an opaque base64-url token wrapping the last
        row's (occurred_at, id) pair. Pass it back as the `cursor`
        query param to fetch the next page. Null when the response
        is the final page.
      tags: [audit]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["system.audit.read"]
      parameters:
        - name: event_type
          in: query
          required: false
          schema: { type: string }
        - name: actor_user_ref
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: subject_user_ref
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: since
          in: query
          required: false
          description: ISO-8601 lower bound on occurred_at (inclusive).
          schema: { type: string, format: date-time }
        - name: until
          in: query
          required: false
          description: ISO-8601 upper bound on occurred_at (inclusive).
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Page of audit events + total count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/audit/event_types:
    get:
      operationId: listAdminAuditEventTypes
      summary: Distinct event_type values present in the audit log
      description: |
        Used to populate the type-filter dropdown in the audit viewer
        — distinct event_type values from the audit_events table,
        alphabetically. Cheap query (small result set, indexed).
      tags: [audit]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["system.audit.read"]
      responses:
        "200":
          description: Distinct event_type values.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/seed/timestamps:
    post:
      operationId: seedBackfillTimestamps
      summary: Bulk-backfill created_at / updated_at for seeded entities
      description: |
        Operator-tooling endpoint for the demo-seed loader
        (see `seed/SEED_INSTRUCTIONS.md`). NOT for general
        operator use — gated on `system.admin`; not surfaced
        in the admin UI.

        Accepts an array of (kind, id, created_at, updated_at,
        last_reviewed_at?) tuples and bulk-updates the
        corresponding rows in `assets` / `posts` / `comments`.
        Idempotent: re-running the same payload produces the
        same end state (UPDATE stamps the same value twice).

        Cap: 1,000 items per request. Larger seeds split into
        multiple calls.

        Emits ONE `admin.seed.timestamps_backfilled` audit
        event per call summarising per-kind counts.
      tags: [admin]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeedTimestampsRequest" }
      responses:
        "200":
          description: Backfill applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedTimestampsResult" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/seed/comments:
    post:
      operationId: seedCreateComment
      summary: Create a comment with forged author + optional created_at
      description: |
        Operator-tooling endpoint for the demo-seed loader.
        NOT for general operator use — gated on `system.admin`;
        not surfaced in the admin UI.

        Creates a single comment with author_user_ref forged to
        the supplied user (the regular `POST /posts/{id}/comments`
        stamps the caller as author, which is wrong for seeding
        per-post reviewer voices).

        Idempotent when the caller supplies a stable `id`: a
        re-run with the same id returns 200 with the existing
        row instead of 409 — apply scripts can re-run safely.

        Emits one `admin.seed.comment_created` audit per call.
      tags: [admin]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeedCommentRequest" }
      responses:
        "201":
          description: Comment created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "200":
          description: |
            Idempotent re-run — the supplied `id` already
            exists; the existing row is returned unchanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            Either the target object (post / asset / collection)
            or the supplied author user does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /account/password:
    put:
      operationId: changeMyPassword
      summary: Change my password
      description: |
        Phase 1.17.D — self-service password change. Verifies the
        current password, applies the policy (min length / complexity
        from system_config.auth.password_policy), rejects reuse of
        the last 5 passwords, and (optionally) revokes every other
        session belonging to the caller as a defensive default.
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePasswordResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /account/preferences:
    get:
      operationId: getAccountPreferences
      summary: Get my notification + view preferences
      description: |
        Phase 1.17.G — per-user application-behavior preferences:
        which channels (in_app, email) the user wants each notification
        event delivered through, plus default-view selections (home
        tab, browse layout, browse sort) that apply to the user's
        next page load.

        First-visit callers (no row yet) get a zero-value response —
        empty `notification_channels`, empty `default_views`, but the
        canonical `known_event_types`, `known_channels`, and per-event
        `default_channels_by_event` are always populated so the UI can
        render the toggle grid without hard-coding the catalog.

        Channel resolution at notification-write time falls back to
        `default_channels_by_event` for any event the user hasn't
        explicitly set. An explicit empty array MEANS "deliver
        nothing for this event" and overrides the default.
      tags: [account]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: User preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferencesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: patchAccountPreferences
      summary: Replace my notification + view preferences
      description: |
        Phase 1.17.G — upserts the caller's preferences. The wire
        contract is full-object replacement: the client sends the
        entire resolved object, the server validates against the
        build's `known_event_types` + `known_channels` catalogs, and
        rejects unknown values rather than silently persisting them.

        There is no per-field PATCH verb. To "remove a channel from
        an event," send the full `notification_channels` object with
        that channel omitted from the array. To "fall back to system
        default for an event," omit the event key entirely from the
        map.
      tags: [account]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferencesRequest"
      responses:
        "200":
          description: Preferences saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferencesResponse"
        "400":
          description: Validation failure (unknown event / channel / duplicate).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/users/{ref}/password-reset:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: adminResetUserPassword
      summary: Issue a one-shot password for a user (admin helpdesk)
      description: |
        Phase 1.17.D — admin/helpdesk password reset. Generates a
        cryptographically random temporary password, stores its hash,
        and returns the plaintext ONCE in the response so the admin
        can share it with the user out-of-band (chat / SMS / call).
        The user is expected to change it on next login; enforcement
        of "must change on first login" lands with the email-token
        reset flow in a follow-up phase. Audit captures the actor +
        reason; the plaintext password is never logged.
      tags: [users]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["users.password.reset"]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPasswordResetRequest"
      responses:
        "200":
          description: One-shot password generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPasswordResetResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /account/sessions:
    get:
      operationId: listMySessions
      summary: List my active sessions (multi-device)
      description: |
        Phase 1.17.C — surfaces the caller's own active sessions for
        the /account/sessions self-service page. The row that's
        authenticating this request carries `current: true` so the
        UI can hide its own revoke button.
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: List of the caller's active sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /account/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeMySession
      summary: Revoke one of my sessions
      description: |
        Ownership-checked: revokes only when the session id belongs
        to the caller. 404 covers both "wrong owner" and "no such
        session" so existence can't be probed.
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{ref}/sessions:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: listAdminUserSessions
      summary: List a user's active sessions (admin)
      description: |
        Phase 1.17.C — admin view of a specific user's sessions for
        the per-user admin detail page. Same row shape as the
        self-service endpoint; `current` is omitted (admins are
        viewing someone else's sessions, not their own).
      tags: [users]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["users.read"]
      responses:
        "200":
          description: The user's active sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{ref}/sessions/{id}:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeAdminUserSession
      summary: Revoke a user's session (admin)
      tags: [users]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["users.write"]
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users:
    get:
      operationId: listAdminUsers
      summary: List users (admin)
      description: |
        Paginated admin user list (Phase 1.17.A). Newest accounts first.
        Filters: `q` runs a case-insensitive substring match across
        username / fullname / email; `status` narrows to active /
        pending / disabled (mapping to the underlying user.approved
        flag, see 1.17.B for the lifecycle state machine). Cursor
        pagination via opaque `cursor` token; `total` is the
        unfiltered-by-cursor count for the badge in the chrome.
      tags: [users]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["users.read"]
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive substring match across username, fullname, email.
          schema: { type: string, maxLength: 200 }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, pending, disabled]
        - name: cursor
          in: query
          required: false
          description: Opaque token from a previous response's `next_cursor`.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: A page of admin user rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/users/{ref}/status:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      operationId: setAdminUserStatus
      summary: Change a user's lifecycle status (admin)
      description: |
        Phase 1.17.B — admin-only lifecycle transition. Moves a user
        through pending / active / disabled. The audit log records
        the before / after / reason tuple.
      tags: [users]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["users.approve"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserStatusUpdate"
      responses:
        "200":
          description: New status (after the transition).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserStatusResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/tokens/{id}:
    delete:
      operationId: revokeApiToken
      summary: Revoke an API token by ID
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked.
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Background-job queue (Phase 1.18.A). The same HTTP surface
  # serves three worker shapes: in-process workers (used by the local
  # app), external render farms (BARTS-style — claim a batch, execute
  # on big iron, post results back), and federated peer instances
  # that opt in to help us drain our queue.
  /jobs/claim:
    post:
      operationId: claimJobs
      summary: Atomically claim a batch of pending jobs
      description: |
        Pulls up to `limit` pending jobs whose `type` is in the
        `types` allowlist (omit `types` to claim any type the caller
        is authorised to run). Each claimed job is marked `running`
        with a lease — the worker must call `/jobs/{id}/heartbeat`
        before the lease expires or the watchdog will requeue it.

        Auth: any authenticated caller for now. A future phase adds a
        `worker` token kind that scopes claim/complete/fail without
        granting any read access elsewhere.
      tags: [jobs]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobClaimRequest" }
      responses:
        "200":
          description: Claimed jobs (possibly an empty array)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobClaimResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getJob
      summary: Fetch a job's current state
      tags: [jobs]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /jobs/{id}/heartbeat:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: heartbeatJob
      summary: Extend the lease on a running job
      description: |
        Workers should call this faster than the lease window
        (default 5 minutes). Returns 409 if the lease was already
        taken by another worker.
      tags: [jobs]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerIdentity" }
      responses:
        "204": { description: Lease extended }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: Lease lost — another worker took the job }

  /jobs/{id}/complete:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: completeJob
      summary: Mark a running job as done
      tags: [jobs]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobCompleteRequest" }
      responses:
        "204": { description: Marked done }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: Lease lost }

  /jobs/{id}/fail:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: failJob
      summary: Record a failure on a running job
      description: |
        If `terminal=true` the job goes straight to status=failed and
        will not be retried. Otherwise the job returns to `pending`
        unless its attempts count reached `max_attempts`.
      tags: [jobs]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobFailRequest" }
      responses:
        "204": { description: Failure recorded }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: Lease lost }

  /storage/objects:
    post:
      operationId: uploadStorageObject
      summary: Upload a raw byte stream
      description: |
        Streams the request body to storage, computing sha256 in the
        same pass. If the resulting hash already exists, the bytes are
        not re-uploaded — only a new pin is added so the caller's user
        keeps the object alive. The response includes a `deduped` flag
        so clients can show "already uploaded" UX.

        The pin subject for this endpoint is always `user:<caller-ref>`.
        Asset entity creation (`POST /assets`) issues `asset:<uuid>`
        pins and removes the `user:` pin once the entity owns the bytes.
      tags: [storage]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      parameters:
        - name: X-Content-Type
          in: header
          required: false
          description: |
            Original content type of the upload. Defaults to
            application/octet-stream when omitted. Recorded as the
            original variant's content_type so download responses can
            set the right Content-Type header.
          schema:
            type: string
      responses:
        "201":
          description: Upload accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /storage/objects/{hash}:
    get:
      operationId: downloadStorageObject
      summary: Download a raw byte stream by content hash (original variant)
      description: |
        Returns the bytes of the `original` variant. Supports HTTP
        Range requests for partial downloads (video scrub, resumable
        downloads). 404 when the hash isn't known to this server.
      tags: [storage]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: hash
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
        - name: Range
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Full body
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial body (Range request honoured)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /storage/objects/{hash}/variants/{variant}:
    get:
      operationId: downloadStorageObjectVariant
      summary: Download a specific variant of a stored object
      description: |
        Same semantics as the original download but for any named
        variant key (e.g. "preview_2048", "thumb_512",
        "hls/seg00001.ts").
      tags: [storage]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: hash
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
        - name: variant
          in: path
          required: true
          schema:
            type: string
        - name: Range
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Full body
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial body (Range request honoured)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets:
    post:
      operationId: createAsset
      summary: Create an asset entity
      description: |
        Creates a new asset, optionally linking it to a previously
        uploaded byte stream via `file_hash`. If `file_hash` is set,
        the storage layer is re-pinned under
        `asset:<new-asset-id>` and the caller's prior `user:` pin
        for that hash is dropped (the bytes are now owned by the
        asset, not the uploader).
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetCreate"
      responses:
        "201":
          description: Asset created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listAssets
      summary: List assets (paginated)
      description: |
        Returns assets visible to the caller, newest first. Supports
        cursor pagination plus simple filters; richer search lands
        with ADR 0010.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: owner_ref
          in: query
          required: false
          description: Filter to a single owner's assets.
          schema: { type: integer, format: int64 }
        - name: asset_type
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, active, archived]
        - name: tag
          in: query
          required: false
          description: Single-tag filter (intersection with other filters).
          schema: { type: string }
        - name: q
          in: query
          required: false
          description: |
            Plain-text search. Matched against the search_text TSVECTOR
            on each asset (built from title + description + tags + the
            searchable field-value text by the Phase 1.9 metadata
            trigger). Whitespace-separated tokens AND together via
            plainto_tsquery. Ignored when `tag` is also provided.
            Phase 1.12 will replace this with the full search DSL (ADR
            0010).
          schema: { type: string, maxLength: 200 }
        - name: cursor
          in: query
          required: false
          description: Opaque pagination token from a previous response.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: A page of assets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /assets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getAsset
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAsset
      description: |
        Partial update. Only fields present in the request body are
        modified. Use `tags` (array) to replace the full tag set; use
        `POST /assets/{id}/tags` for additive changes.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUpdate"
      responses:
        "200":
          description: Updated asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAsset
      summary: Soft-delete an asset
      description: |
        Marks the asset deleted (sets `deleted_at`). The storage pin
        is removed; the GC sweeper later collects bytes that are no
        longer pinned by anyone.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/file:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: Range
        in: header
        required: false
        schema: { type: string }
    get:
      operationId: downloadAssetFile
      summary: Download the asset's primary file (original variant)
      description: |
        Proxies to `/storage/objects/{file_hash}` for the asset's
        linked storage object. 404 when the asset has no file_hash
        set yet (e.g. a draft created without an upload).
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Full body
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: Partial body (Range honoured)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/variants/{variant}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: variant
        in: path
        required: true
        schema: { type: string }
      - name: Range
        in: header
        required: false
        schema: { type: string }
    get:
      operationId: downloadAssetVariant
      summary: Download a named variant of the asset (thumb / preview / etc.)
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Full body
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: Partial body (Range honoured)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/companions:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listAssetCompanions
      summary: List sidecar files attached to a 3D model asset
      description: |
        Returns the set of companion files attached to this asset, in
        path order. The viewer fetches this list before mounting a 3D
        body and uses it to rewrite relative resource references
        (textures, MTL, .bin) through a LoadingManager URL modifier.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: List of companions (may be empty)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AssetCompanion" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addAssetCompanion
      summary: Attach a sidecar file to a 3D model asset
      description: |
        Streams the file body content-addressed into storage, then
        attaches it to the asset at the given relative path. If a
        companion already exists at that path it is replaced (the old
        pin is removed; the storage object lives on if other pins
        reference it).
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: X-Companion-Path
          in: header
          required: true
          description: |
            Relative path the model file references this companion at.
            Slashes are allowed for subdirectory layouts
            ('textures/foo.png'). Limited to 512 chars.
          schema: { type: string, minLength: 1, maxLength: 512 }
        - name: X-Content-Type
          in: header
          required: false
          description: |
            MIME type of the companion bytes. If absent we default to
            application/octet-stream.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Companion attached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetCompanion" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /assets/{id}/alternates:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listAssetAlternates
      summary: List variant files (palette swaps, transcodes, thumbnails) for an asset
      description: |
        Returns the sibling-version variants attached to this asset,
        most-recently-created first. Where companions are sidecars the
        primary asset references, alternates are variants of the asset
        itself — a palette-swapped sprite sheet, a web-res thumbnail,
        a transcoded proxy. Each alternate stands on its own and can
        be downloaded directly.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: List of alternates (may be empty)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AssetAlternate" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addAssetAlternate
      summary: Attach a variant file to an asset
      description: |
        Streams the variant body content-addressed into storage, then
        attaches it as a sibling alternate. Replaces any existing
        alternate with the same label (the old pin is removed). Pass
        the kind tag in X-Alternate-Kind so the UI can group + filter;
        kind-specific metadata travels as JSON in X-Alternate-Metadata.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: X-Alternate-Label
          in: header
          required: true
          description: |
            Human label shown in alt-file lists. Unique per asset; an
            upload with an existing label replaces the previous variant.
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: X-Alternate-Kind
          in: header
          required: false
          description: |
            Provenance tag — palette_swap | thumbnail | low_res |
            authored | transcode. Free-form so new generators don't
            need a backend change; defaults to "authored".
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: X-Alternate-Metadata
          in: header
          required: false
          description: |
            JSON-encoded per-kind metadata. The sprite tool's palette
            swap encodes its "from → to" colour map here; thumbnail
            workers encode dimensions. Opaque to the backend.
          schema: { type: string, maxLength: 8192 }
        - name: X-Content-Type
          in: header
          required: false
          description: MIME type of the alternate bytes.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Alternate attached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetAlternate" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /assets/{id}/alternates/{alternate_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: alternate_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: downloadAssetAlternate
      summary: Download an alternate's bytes
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Alternate body
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removeAssetAlternate
      summary: Detach an alternate from an asset
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Alternate removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/epub/spine:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getEpubSpine
      summary: List the chapters of an EPUB asset (reading order)
      description: |
        Returns the ordered list of chapters from the default
        rendition's spine. Each entry carries the chapter's
        manifest id, a display label (NCX/TOC label when
        available, else the manifest id, else "Chapter N"), and
        the original href + media type for debugging. The
        frontend reader uses this to populate the table of
        contents + chapter picker.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Ordered spine entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EpubSpineEntry" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /assets/{id}/epub/chapters/{idx}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: idx
        in: path
        required: true
        description: Zero-based spine index.
        schema: { type: integer, minimum: 0 }
    get:
      operationId: getEpubChapter
      summary: Read one EPUB chapter as HTML with rewritten resource refs
      description: |
        Streams the chapter's XHTML body with every relative
        href / src / srcset rewritten to point at
        /assets/{id}/epub/resources/{path}. The frontend reader
        injects this directly into an iframe srcdoc; resources
        resolve through us so auth cookies travel + CORS isn't
        a concern.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Chapter HTML
          content:
            text/html:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /assets/{id}/epub/search:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: q
        in: query
        required: true
        description: |
          Query string. Case-insensitive substring match against
          each chapter's stripped-text body. Queries shorter than
          two characters return an empty list (avoids degenerate
          single-character spam).
        schema: { type: string, minLength: 1 }
    get:
      operationId: searchEpub
      summary: Full-text search across an EPUB's chapters
      description: |
        Scans every spine chapter for the query (case-insensitive),
        returning up to 5 hits per chapter and 200 hits total.
        Each hit carries the chapter idx (jump target), a label
        (display), a snippet (~60 chars on each side of the match),
        and the character offset inside the plain-text chapter
        body (future use when EpubView grows in-page anchor jump).
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Search hits (may be empty)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EpubSearchHit" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /assets/{id}/epub/resources/{path}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: path
        in: path
        required: true
        description: |
          Zip-internal absolute path of the resource (image, CSS,
          font, etc.). Resolved from the chapter's relative ref
          during chapter rewriting; the frontend never constructs
          these by hand.
        schema: { type: string }
    get:
      operationId: getEpubResource
      summary: Stream an EPUB-internal resource (image, CSS, font, …)
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Resource bytes
          headers:
            Content-Type:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /assets/{id}/companions/{companion_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: companion_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: downloadAssetCompanion
      summary: Download a companion file's bytes
      description: |
        Returns the raw bytes for a single companion. The frontend
        viewer calls this through a LoadingManager URL modifier when
        the model loader asks for a resource at a known relative path.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Companion body
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removeAssetCompanion
      summary: Detach a companion file from an asset
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Companion removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/tags:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: addAssetTags
      summary: Add tags to an asset (bulk, idempotent)
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags:
                  type: array
                  items: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "204":
          description: Tags merged in
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/preview:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: recreateAssetPreview
      summary: Re-enqueue this asset's preview job
      description: |
        Inserts a fresh job of the preview kind that matches the
        asset's file extension (preview.raster / preview.video /
        preview.3d / preview.audio / preview.pdf / preview.font /
        preview.ebook / preview.eps / preview.psd / preview.comic /
        preview.text) at PriorityHigh. The worker picks it up within
        a tick and overwrites the existing variants when its
        idempotency-skip logic doesn't bail.

        Useful after attaching new companions (so a 3D model can
        re-render with its textures) or after a worker bug-fix
        landed and the user wants the existing rendered output
        regenerated against the new code.

        Returns the freshly-enqueued job id so callers can poll
        /jobs/{id}/status if they want a progress UI.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "202":
          description: Job enqueued
          content:
            application/json:
              schema:
                type: object
                required: [job_id, job_type]
                properties:
                  job_id:   { type: string, format: uuid }
                  job_type: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /assets/{id}/tags/{tag}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: tag
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: removeAssetTag
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Tag removed (idempotent)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /fields:
    get:
      operationId: listFields
      summary: List field definitions (the metadata schema)
      description: |
        Returns all field definitions, ordered by display group and
        display order. Filter by status to see active / deprecated /
        archived only. The result is the schema admins build through
        the field-management UI.
      tags: [metadata]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, deprecated, archived]
        - name: asset_type
          in: query
          required: false
          description: |
            When set, only fields whose `applies_to` is empty (=all)
            or contains this asset_type ref are returned. Used by
            the asset edit form to figure out which fields to show.
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: List of field definitions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FieldDefinition" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createField
      summary: Create a new field definition (admin)
      tags: [metadata]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FieldDefinitionCreate" }
      responses:
        "201":
          description: Field created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldDefinition" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /fields/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getField
      tags: [metadata]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The field definition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldDefinition" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateField
      summary: Update a field definition (admin)
      tags: [metadata]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
