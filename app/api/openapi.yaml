  /admin/system/smtp/test:
    post:
      operationId: sendSMTPTestEmail
      summary: Send a test email through the configured SMTP relay
      description: |
        Renders the admin_test template + sends it via the currently
        configured Sender (SMTP / capture / disabled per the boot
        mode). The recipient defaults to the calling admin's own
        email; an explicit `to` overrides for diagnosing relay-side
        routing issues.

        Synchronous — the response carries the outcome (sent +
        delivery mode) so the operator sees the failure immediately
        instead of digging in the job queue.

        Gated on `system.config.write` (same gate as the SMTP
        config-write surface).
      tags: [system]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SMTPTestRequest" }
      responses:
        "200":
          description: Test email accepted by the configured Sender.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SMTPTestResult" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: SMTP not configured (relay host empty).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/system/auth:
