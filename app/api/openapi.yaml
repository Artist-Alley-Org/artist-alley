openapi: 3.0.3
info:
  title: artist-alley API
  version: 0.10.0
  description: |
    The Artist Alley REST API. Every endpoint lives under the `/api/v1`
    base path and speaks JSON.

    ## Authenticating

    Most endpoints need a signed-in caller. There are two ways:

    - **Session cookie** — `POST /auth/login` with a username and password
      sets a `user` session cookie. Browser clients use this automatically.
    - **API token** — from a signed-in session, `POST /auth/tokens` mints a
      personal access token that looks like `aa_pat_…`. Send it on every
      request: `Authorization: Bearer aa_pat_…`. Tokens carry scopes and an
      optional expiry, so you can limit a script to just the endpoints it
      needs.

    ## A first request

    ```bash
    curl https://your-instance/api/v1/me \
      -H "Authorization: Bearer aa_pat_your_token_here"
    ```

    ## Errors

    An error returns the matching HTTP status — 400 (bad request), 401
    (not signed in), 403 (missing capability), 404 (not found), 409
    (conflict), 422 (unprocessable), 429 (rate-limited), 500 (server
    error) — with a JSON body of the shape `{ "error": "…" }`, a short
    human-readable summary. Each endpoint page lists the statuses it can
    return.

servers:
  - url: /api/v1
    description: Local development behind nginx (port 8088 by default)

tags:
  - name: auth
    description: |
      Authentication and identity. `POST /auth/login` takes a username and
      password and sets a `user` session cookie. API tokens (`aa_pat_…`) are
      the alternative for scripts and programmatic clients — mint one with
      `POST /auth/tokens` and send it as `Authorization: Bearer aa_pat_…`.
  - name: assets
    description: |
      Upload, download, and pin management for asset bytes. Storage is
      content-addressed: every blob is keyed by sha256(contents), so
      identical uploads dedup automatically and federated peers can
      verify transfers by hash. See ADR 0008.
  - name: asset_types
    description: Configurable categories applied to every uploaded asset
      (Photo, Document, Video, Audio, custom types, etc.)
  - name: posts
    description: |
      Feed entity. A Post wraps 1+ Assets with descriptive metadata
      (title, description, tags, visibility) and carries
      like/comment counters. Browse-page reads from /posts; assets
      are the file-bearing members beneath. Single-asset uploads
      still become Posts (a Post with one member) so the shape is
      uniform end-to-end.
  - name: collections
    description: |
      User-owned groupings of assets, per ADR 0009. UUID-keyed,
      federation-prepared. Three orthogonal axes — visibility
      (private/shared/public), membership (manual/query/hybrid), and
      lifecycle (permanent vs `expires_at`). Manual membership is
      available today; query and grant-based membership are not yet
      implemented.
  - name: teams
    description: |
      Organisational units with a DAG hierarchy. A team can have
      multiple parents (Aurora R&D Character Art reports to Aurora R&D
      AND Cross-Studio Art Review). Capability grants scoped to a team
      apply to that team and all descendants via the materialised
      `team_closure`. ADR 0010 Layer 4.
  - name: users
    description: |
      Public-facing user profiles. The RS `user` table holds auth-bearing
      data we never expose; `user_profiles` holds the
      display-layer fields (display_name, bio, avatar_url, social_links).
      Reads merge both tables and substitute defaults when no profile
      row exists. Federation: the profile is the unit that gets
      mirrored to peer sites.

paths:
  /auth/login:
    post:
      operationId: login
      summary: Sign in with username and password
      description: |
        Verifies credentials against the RS `user` table using the same
        HMAC-then-bcrypt hashing scheme RS uses (so PHP-created users
        log in unchanged). On success: writes a new session token to
        `user.session` and sets the `rs_session` cookie.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated. Returns the current user; an
            `rs_session` cookie is set in the response headers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          description: |
            Identity provider was registered (license includes its
            feature flag) but the credential-verification impl has
            not yet landed in this binary. Distinct from 401 so the
            admin UI can render "build pending" vs "wrong password".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/providers:
    get:
      operationId: listIdentityProviders
      summary: Enumerate the identity providers active on this install
      description: |
        Returns the set of identity providers the login surface can
        dispatch to. The built-in password provider is always
        present. Enterprise providers (LDAP, SAML, etc.) appear only
        when the install's license includes the matching feature
        flag (`sso_ldap`, `sso_saml`).

        Used by the login page to render the right buttons + by the
        admin UI to surface which enterprise gates have been
        activated. Anonymous endpoint — the list is intentionally
        public so unauthenticated users see the SSO buttons they
        need to click.
      tags: [auth]
      responses:
        "200":
          description: Active provider list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProviderList"

  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      description: |
        Clears `user.session` for the calling user and expires the
        `rs_session` cookie. Safe to call when unauthenticated
        (returns 204 either way).
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Logged out (or wasn't logged in).

  /auth/register:
    post:
      operationId: register
      summary: Self-service account creation
      description: |
        Anonymous endpoint. Creates a new local account when
        sysconfig `auth.self_registration.enabled` is true,
        otherwise returns 403. Username must match
        `^[a-zA-Z0-9_-]{3,32}$` + be globally unique. Password
        must satisfy the policy block. Email is required.

        When `auth.self_registration.require_email_verification`
        is true (the default), the user is created with
        `email_verified_at IS NULL` and the response is 202 —
        they cannot sign in until they click the verification
        link in the email we send. With verification off, the
        response is 200 + a session cookie.

        Rate-limited by both IP and attempted email so spam
        clients can't enumerate.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "200":
          description: Account created + signed in (verification disabled).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "202":
          description: Account created; verification email sent. Caller must verify before login.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterPendingResult" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Self-registration is disabled on this install.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Username or email already in use.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Consume a verification token
      description: |
        Single-use. The link the user receives carries a
        plaintext token that hashes to a stored row. On match:
        flips email_verified_at + consumes the token + returns
        the verified user shape (no cookie set — caller must
        sign in normally on the next page).
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        "200":
          description: Email verified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyEmailResult" }
        "400":
          description: Token missing / malformed / expired / already used.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/resend-verification:
    post:
      operationId: resendVerificationEmail
      summary: Re-issue a verification email
      description: |
        Anonymous. Takes the email the user signed up with;
        when it matches a still-unverified account, mints a
        fresh token + sends the email. Returns 202 ALWAYS,
        regardless of whether the email is known — anti-
        enumeration measure.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResendVerificationRequest" }
      responses:
        "202":
          description: Acknowledged. The email is sent when applicable; the response is the same when the address is unknown to prevent enumeration.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Return information about the caller
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/tokens:
    get:
      operationId: listApiTokens
      summary: List the caller's API tokens
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: List of tokens (without the token values).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiTokenSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createApiToken
      summary: Issue a new API token
      description: |
        Creates a Personal Access Token bound to the caller. The token
        value is returned in the response **once and only once** — it
        is hashed in the database and cannot be recovered later. Lose
        it, revoke and re-issue.

        Token creation is restricted to cookie-authenticated callers,
        so a stolen token cannot mint further tokens.
      tags: [auth]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiTokenRequest"
      responses:
        "201":
          description: Token issued. The plaintext token is in the
            `token` field of the response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/capabilities:
    get:
      operationId: listCapabilities
      summary: List every capability the server knows about
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["caps.read"]
      responses:
        "200":
          description: List of capabilities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Capability"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/roles:
    get:
      operationId: listRoles
      summary: List roles and the capabilities attached to each
      description: |
        Includes parent_id but does NOT recurse — each role's
        `capabilities` array is just the direct attachments. Effective
        capabilities for a user (role chain + grants - revokes) are
        exposed via `/auth/me/capabilities`.
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["roles.read"]
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/me/capabilities:
    get:
      operationId: getMyCapabilities
      summary: Effective capabilities for the current user
      description: |
        Returns the fully resolved capability set: role-chain capabilities
        unioned with explicit grants, minus explicit revokes. This is
        what middleware uses for enforcement.
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Effective capability set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveCapabilities"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/users/{ref}/role:
    put:
      operationId: setUserRole
      summary: Assign a role to a user (admin)
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["users.write"]
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserRoleRequest"
      responses:
        "204":
          description: Role assigned
        "400":
          description: |
            Role change refused — would leave the system with
            zero users holding `system.admin` (last-admin
            invariant guard). Grant the capability to another
            user first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{ref}/capabilities:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: listAdminUserCapabilities
      summary: List a user's explicit grants + revokes (admin)
      description: |
        Returns the per-user GRANT and REVOKE override
        lists. Role-derived capabilities are not included (they're
        already returned by GET /auth/me/capabilities and the role
        editor surface). This list is the additive/subtractive
        delta admins manage by hand.
      tags: [users]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["users.read"]
      responses:
        "200":
          description: Per-user grant + revoke override lists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCapabilityOverrides"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{ref}/grants:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: addAdminUserGrant
      summary: Add a capability grant to a user (admin)
      tags: [users]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["users.write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCapabilityOverrideRequest"
      responses:
        "204":
          description: Grant inserted (or refreshed if it already existed).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{ref}/grants/{capability}:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: capability
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: removeAdminUserGrant
      summary: Remove a capability grant from a user (admin)
      description: |
        Pass `team_id` query param to scope to a team-scoped grant;
        omit for the global grant. Returns 404 when no matching grant
        exists (composite key, not by ID — there is no ID).
      tags: [users]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["users.write"]
      parameters:
        - name: team_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Grant removed.
        "400":
          description: |
            Grant removal refused — would leave the system with
            zero users holding `system.admin` (last-admin
            invariant guard). Applies to global system.admin
            grants only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{ref}/revokes:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: addAdminUserRevoke
      summary: Add a capability revoke to a user (admin)
      tags: [users]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["users.write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCapabilityOverrideRequest"
      responses:
        "204":
          description: Revoke inserted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{ref}/revokes/{capability}:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: capability
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: removeAdminUserRevoke
      summary: Remove a capability revoke from a user (admin)
      tags: [users]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["users.write"]
      parameters:
        - name: team_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Revoke removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/federation/directories:
    get:
      operationId: listFederationDirectories
      summary: List subscribed federation directories
      description: |
        All directories we've subscribed to, newest-first. Each
        row carries the pinned operator pubkey + the last poll
        status. Gated on `system.admin`.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: List of directories.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationDirectoryList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: subscribeFederationDirectory
      summary: Subscribe to a federation directory
      description: |
        Fetches /v1/operator from the directory URL, captures the
        operator pubkey + fingerprint, and persists the
        subscription. The admin should review the returned
        fingerprint out-of-band before relying on the directory.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FederationDirectorySubscribe" }
      responses:
        "201":
          description: Subscription created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationDirectory" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Already subscribed to this directory URL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/federation/directories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: unsubscribeFederationDirectory
      summary: Unsubscribe from a directory (cascades cached entries)
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Unsubscribed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/federation/directories/{id}/poll:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: pollFederationDirectory
      summary: Force an immediate poll of one directory
      description: |
        Bypasses the background poller's cadence — useful when
        an admin just subscribed or wants to refresh manually.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Poll result (status + count).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationDirectoryPollResult" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/federation/directories/{id}/publish/challenge:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: requestFederationDirectoryPublishChallenge
      summary: Request a DNS-TXT challenge to publish this instance to a directory
      description: |
        POSTs /v1/challenge to the directory and persists the
        issued token + the DNS record the operator must publish.
        Flips status to `pending_dns`.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Challenge issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationDirectory" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Directory unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/federation/directories/{id}/publish/register:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: registerFederationDirectoryPublishListing
      summary: Submit /v1/register with the previously-issued token
      description: |
        Persists the operator-supplied display_name + region +
        description + tags, then POSTs /v1/register with the
        pending token. Caller MUST have completed the DNS step.
        On success flips status to `listed`; on failure stays
        `pending_dns` so the operator can retry once DNS
        propagates.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FederationDirectoryPublishMetadata" }
      responses:
        "200":
          description: Result of the register call.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationDirectory" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/federation/directories/{id}/entries:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listFederationDirectoryEntries
      summary: Browse cached entries from one directory
      description: |
        Returns the locally cached snapshot of the directory's
        listings — survives directory outages per the spec's
        local-caching rule.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: Cached entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationDirectoryEntryList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /federation/instance:
    get:
      operationId: getFederationInstance
      summary: This instance's federation actor doc
      description: |
        Public unauthenticated endpoint — returns the per-
        instance Ed25519 public key, the canonical instance URL,
        and the display name. This is what peers fetch when
        verifying inbound handshakes or HTTP-Sig'd requests
        (HTTP-Signature verification is enforced on the inbox).
      tags: [federation]
      responses:
        "200":
          description: Instance actor doc.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationInstanceDoc" }
        "503":
          description: Instance identity not yet generated (first-boot race).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /federation/peers/visible:
    get:
      operationId: getFederationPeersVisible
      summary: Peer-of-peer discovery — list of peers we've opted to share
      description: |
        Public unauthenticated endpoint. Returns the subset of our
        connected+enabled peers that have `share_in_visible_list`
        toggled on. Other instances poll this to build their
        "Suggested peers (via this instance)" feed per ADR 0043.

        Per the spec these are advisory ONLY — a listed peer is
        a discovery hint, not a trust endorsement. Pairing still
        goes through the handshake from 1.22.B-b.
      tags: [federation]
      responses:
        "200":
          description: List of visible peers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationVisiblePeerList" }

  /federation/peers/handshake:
    post:
      operationId: postFederationHandshake
      summary: Peer-to-peer handshake endpoint
      description: |
        Public unauthenticated endpoint — accepts signed
        handshake envelopes from peer instances per
        docs/spec/federation/v1.md §11. The envelope is signed
        by the offered Ed25519 public key (payload-signature
        only — transport HTTP-Sig is for established peers).
      tags: [federation]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HandshakeEnvelope" }
      responses:
        "200":
          description: Envelope accepted; result indicates resulting state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HandshakeAccepted" }
        "400":
          description: Malformed or unverifiable envelope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Instance identity not yet generated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/federation/peers/initiate:
    post:
      operationId: initiateFederationHandshake
      summary: Initiate an outbound handshake
      description: |
        Admin "Pair by URL" entry. Creates a local
        pending_outbound row + sends a signed offer envelope to
        the peer. Idempotent on instance_url.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FederationHandshakeInitiate" }
      responses:
        "201":
          description: Local pending_outbound row created (offer POST may have failed; check notes).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationPeer" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/federation/peers/pending-inbound:
    get:
      operationId: listFederationPendingInbound
      summary: List pending inbound handshake requests
      description: |
        Admin "requests awaiting your approval" feed. Backed by
        the partial index federation_peers_pending_inbound_idx.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Pending inbound requests.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationPeerList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/federation/peers/{id}/accept:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: acceptFederationPeer
      summary: Accept a pending inbound handshake
      description: |
        Admin clicks "Accept" on a pending_inbound row. Flips
        local status to connected + sends a confirm envelope
        back to the peer.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Accepted; row is now connected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationPeer" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/federation/suggestions:
    get:
      operationId: listFederationPeerSuggestions
      summary: List cached peer-of-peer suggestions
      description: |
        Returns suggestions from all sources, deduped against our
        own federation_peers (URLs we already federate with are
        hidden). Each suggestion carries provenance — which of
        OUR peers contributed it.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: List of suggestions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationPeerSuggestionList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/federation/suggestions/refresh:
    post:
      operationId: refreshFederationPeerSuggestions
      summary: Force a sweep of all connected peers for fresh suggestions
      description: |
        Iterates every connected+enabled peer, fetches their
        /federation/peers/visible response, and persists the
        results. Returns per-source feedback (count or error).
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Per-source refresh outcomes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationPeerSuggestionRefreshResult" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/federation/shares:
    get:
      operationId: listFederationShares
      summary: List federation shares
      description: |
        Mutually-exclusive filter via query params:
        - `object_kind`+`object_id`: "who has access to this object?"
        - `peer_id`: "what am I sharing with this peer?"
        - `grantor_user_ref`: "what shares did this user grant?"
        Returns only ACTIVE shares. Gated on `system.admin`.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: object_kind
          in: query
          required: false
          schema:
            type: string
            enum: [asset, post, collection, workspace, brand_kit, user]
        - name: object_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: peer_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: grantor_user_ref
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Active shares matching the filter.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationShareList" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: grantFederationShare
      summary: Grant a federation share (write-ahead audit)
      description: |
        Creates federation_shares row + emits aa:Share activity +
        writes federation.share.granted audit event — all in one
        transaction per the design proposal §7.2 write-ahead
        invariant. Idempotent: duplicate POST on the active-row
        tuple (grantor, object, peer, target_user) returns 409
        with the existing share.

        Permission: caller must own the object OR have
        system.admin. Restricted objects require target_user_url
        (NaCl envelope wrap needs a key).
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FederationShareCreate" }
      responses:
        "201":
          description: Share granted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationShare" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Object or peer not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Active share already exists for this tuple.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationShare" }

  /admin/federation/shares/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeFederationShare
      summary: Revoke a federation share (aa:Unshare + audit, atomic)
      description: |
        Marks revoked_at + emits aa:Unshare activity + writes
        federation.share.revoked audit event — atomically.
        Recipient's local cache purges per design §4.2; their
        own derivative work (comments/annotations) is preserved
        per §4.3.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Share already revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationShare" }

  /admin/federation/outbox:
    get:
      operationId: listFederationOutbox
      summary: List federation outbox rows
      description: |
        Returns per-recipient queued / sent / failed / cancelled
        rows from federation_outbox. Filterable by peer + status
        + activity type + date range; paginated. Gated on
        `system.admin`.

        Each row carries the activity_id back-reference so the
        admin UI can render the originating envelope alongside
        the delivery state.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: peer_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [queued, sent, failed, cancelled]
        - name: activity_type
          in: query
          required: false
          description: Filter by the originating activity's verb (Like / Create / aa:Share etc.).
          schema: { type: string }
        - name: since
          in: query
          required: false
          description: RFC3339 timestamp; only rows created at or after this.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: cursor
          in: query
          required: false
          description: Pagination cursor from a prior response (opaque).
          schema: { type: string }
      responses:
        "200":
          description: Outbox rows matching the filter.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationOutboxList" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/federation/outbox/{id}/requeue:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: requeueFederationOutbox
      summary: Re-queue a failed outbox row
      description: |
        Resets a failed row to status=queued + attempts=0 + next_
        attempt_at=NOW(). The delivery worker picks it up on the
        next LISTEN/NOTIFY wake (sub-100ms in the happy path).

        Refuses (409) if the row is NOT in status=failed — re-
        queuing a queued row is a no-op race; re-queuing a sent
        row would duplicate-deliver. The admin UI's confirmation
        prompt SHOULD warn before re-queueing rows whose
        last_error references a non-retriable §12.1 reason
        (unknown_object, sig_invalid, encryption_required, etc.)
        since those will fail again — see the design proposal
        §3.4 retriable-flag mapping.

        Emits federation.outbox.requeued audit event.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Row re-queued; the updated outbox state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationOutbox" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Outbox row not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Row not in status=failed (idempotency guard).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/federation/inbox:
    get:
      operationId: listFederationInbox
      summary: List federation inbox rows
      description: |
        Returns inbound activities from federation_inbox in their
        landed state (pending / processed / rejected / failed).
        Filterable by peer + status + activity type + date range;
        paginated. Gated on `system.admin`.

        Read-only — inbox rows can't be re-queued in the same
        way as outbox rows; the activity_uri UNIQUE constraint
        means a re-delivered envelope just lands on the existing
        row idempotently. Admins investigating rejections need
        to coordinate with the sender's outbox queue instead.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: peer_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, processed, rejected, failed]
        - name: activity_type
          in: query
          required: false
          schema: { type: string }
        - name: since
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Inbox rows matching the filter.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationInboxList" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/federation/peers/{id}/cancel-pending:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: cancelFederationPeerPending
      summary: Cancel all queued outbox rows for a peer
      description: |
        Defederation-cascade hook. Marks every queued
        federation_outbox row for the peer as status=cancelled
        + last_error='peer defederation cascade' in ONE
        transaction. Emits a SINGLE
        federation.peer.cascade_cancelled audit event carrying
        the total cancellation count — NOT N audit events per
        the design proposal §7.4 single-audit invariant.

        Caller MUST also disable the peer separately (this
        endpoint does NOT alter the federation_peers row) —
        cancelling queued rows on an active peer would just race
        the new ones the dispatcher enqueues. The admin UI
        sequences disable → cancel-pending in one click.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Cascade complete; count of cancelled rows in body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CascadeCancelResult" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Peer not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/federation/peers:
    get:
      operationId: listFederationPeers
      summary: List federation peers
      description: |
        All paired instances, newest-handshake-first. Gated on
        `system.admin`. Per ADR 0043 §"Trust model" the rows here
        are just the trusted-channel registry — content shares
        are managed separately via federation_shares (Phase
        1.22.C).
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        "200":
          description: A page of peers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationPeerList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createFederationPeer
      summary: Manually add a federation peer
      description: |
        Manual peer entry — the operator pastes the peer's
        instance URL + display name + the PEM-encoded Ed25519
        instance public key (out-of-band coordination between
        operators). The automated handshake protocol lands in
        1.22.B-b and uses the same row shape.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FederationPeerCreate" }
      responses:
        "201":
          description: Peer created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationPeer" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Peer with this instance_url already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/federation/peers/{id}/defederation-preview:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: previewFederationPeerDefederation
      summary: Preview what defederation will cascade
      description: |
        Backs the cascade-preview modal per the 1.22.C design
        proposal §8.5. Returns:
          - total_active_shares + per-object-kind breakdown
          - pending_handshakes (handshakes in flight that would
            be cancelled)
          - cached_suggestions (peer-of-peer suggestions
            contributed by this peer that would be dropped)
          - peer summary (display_name + URL for the modal
            header)
        Gated on `system.admin`.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Cascade impact summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationDefederationPreview" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/federation/peers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getFederationPeer
      summary: Get one federation peer
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Peer detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationPeer" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateFederationPeer
      summary: Edit a federation peer (tier / encryption_policy / enabled / notes / display_name)
      description: |
        Cannot change instance_url or instance_public_key — those
        require defederate + re-pair (the public_key change in
        particular signals re-handshake).
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FederationPeerUpdate" }
      responses:
        "200":
          description: Updated peer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationPeer" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteFederationPeer
      summary: Defederate a peer
      description: |
        Removes the peer row. Per ADR 0043 §"Trust model" the
        federation_shares table cascades on this delete and the
        server emits the final aa:Unshare activity to the peer so
        they purge their local cache.
        Cascade + activity emission happen automatically when
        those phases ship; this endpoint is the entry point.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Peer removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/federation/key-health:
    get:
      operationId: getFederationKeyHealth
      summary: Aggregate federation key + capability health
      description: |
        Admin observability surface. One round-trip
        feeds the /admin/federation/key-health dashboard's five
        tiles: users without keypair (I-b backfill gap), remote
        actors missing encryption keys (I-c cache miss), peers
        without capabilities (I-d negotiation miss), retained
        keys near expiry (sweeper preview), and the total
        approved-user count for denominator context. Drill-down
        rows for "users missing keypair" + "recent rotations"
        ride along so the page renders without separate calls.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Aggregate health counts + drill-downs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FederationKeyHealth" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/federation/users/{ref}/rotate-keys:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
        description: Subject user.ref whose federation keypair the admin is rotating.
    post:
      operationId: rotateUserFederationKeysAsAdmin
      summary: Admin-initiated rotation on behalf of a user
      description: |
        Compromised-key recovery path. Forces
        rotation for the named user; the new federation_user_keys
        row + the demoted previous row both record
        rotated_by_user_ref = the admin's ref. Distinct from
        self-rotation (subject == rotated_by) at the audit row
        level so operator-initiated recoveries are greppable.
      tags: [admin, federation]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Rotation complete.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserKeyRotationResult" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /account/security/rotate-federation-keys:
    post:
      operationId: rotateOwnFederationKeys
      summary: Rotate my own X25519 federation keypair
      description: |
        User self-rotation. Generates a fresh
        X25519 keypair, demotes the previous current key to
        retained state with the configured grace window
        (federation.user_keys.retained_until_days, default 30d),
        and returns the new key version + public bytes for the UI
        to render verification feedback. The previous key
        remains decrypt-capable until the sweeper reaps it
        post-grace.
      tags: [account]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Rotation complete.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserKeyRotationResult" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/activities:
    get:
      operationId: listAdminActivities
      summary: Admin audit view of the activities ledger
      description: |
        Cursor-paginated list of activity rows with optional
        filters (type, source, actor, object kind, since). Gated
        on `system.admin` capability per ADR 0044 — surfaces full
        payloads + addressing for the operator to audit federation
        activity.

        Hot-path notes: this endpoint is NOT cached at the writer
        layer because the filter-combination space is unbounded.
        The underlying SELECT is covered by per-dimension partial
        indexes (`activities_type_recent_idx`,
        `activities_actor_outbox_idx`,
        `activities_source_recent_idx`) so unfiltered + per-filter
        access patterns both hit indexed paths.
      tags: [admin, activities]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: activity_type
          in: query
          required: false
          description: |
            Filter to one activity type — e.g. `Like`, `Follow`,
            `Create`, `aa:Share`. See
            [activities.activity_type CHECK](../db/migrations/00049_activities_ledger.sql)
            for the closed set.
          schema: { type: string }
        - name: source
          in: query
          required: false
          description: |
            `local` for activities emitted by this instance, or a
            peer instance URL (e.g. `https://studio-b.example`) to
            filter to peer-received activities from one peer.
          schema: { type: string }
        - name: actor_user_ref
          in: query
          required: false
          description: |
            Filter to activities emitted by a single local actor.
            For peer-sourced activities (actor_user_ref is NULL),
            use the `source` filter instead.
          schema: { type: integer, format: int64 }
        - name: object_kind
          in: query
          required: false
          description: |
            Filter to activities about one object kind — e.g.
            `post`, `comment`, `asset`, `user`, `collection`.
          schema: { type: string }
        - name: since
          in: query
          required: false
          description: RFC 3339 timestamp; activities at or after this time only.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor from a prior response.
          schema: { type: string }
      responses:
        "200":
          description: A page of activity rows.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminActivityList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/license/status:
    get:
      operationId: getAdminLicenseStatus
      summary: Current license status
      description: |
        Returns the cached, verified-at-boot snapshot of this
        install's license — tier, features, caps, expiry, etc. When
        no `.lic` file is installed, returns a synthetic
        "community" status (tier: community, features: community
        defaults, days_until_expiry: 0).

        The artist-alley app NEVER calls the license server at
        verification time. This endpoint just reads the in-memory
        cache populated at startup (and refreshed on
        POST /admin/license/upload).
      tags: [licensing]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["system.admin"]
      responses:
        "200":
          description: License snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/license/validate:
    post:
      operationId: validateAdminLicense
      summary: Dry-run verify a license envelope
      description: |
        Verifies the supplied `.lic` text against the embedded
        publisher catalog without persisting anything. Used by the
        admin UI to preview a license before clicking "Install".

        On success the response carries the same `LicenseStatus`
        shape the GET endpoint returns, with `loaded: true` and the
        Status fields populated from the candidate envelope. The
        currently installed license is NOT touched.

        On verifier failure (`bad signature`, `expired`, `unknown
        publisher key`, etc.) the response is a structured
        `LicenseValidateError` describing the failure so the UI can
        render an actionable message instead of a generic 400.
      tags: [licensing]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["system.admin"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LicenseUploadRequest"
      responses:
        "200":
          description: Envelope verified successfully (not installed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseStatus"
        "400":
          description: Envelope rejected by the verifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseValidateError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/license/upload:
    post:
      operationId: uploadAdminLicense
      summary: Install a new license envelope
      description: |
        Verifies the supplied `.lic` text and, on success, writes it
        to the configured `LicensePath` and atomically swaps the
        cached license state. The new status is returned in the
        same shape as `GET /admin/license/status`.

        Verification runs BEFORE the write — a bad envelope can never
        overwrite a working file on disk. On verifier failure the
        on-disk file and cached state are unchanged and the response
        is a structured `LicenseValidateError`.

        Returns 409 when the server has no LicensePath configured
        (the admin must set `AA_LICENSE_PATH` before uploading).
      tags: [licensing]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["system.admin"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LicenseUploadRequest"
      responses:
        "200":
          description: License installed; new status returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseStatus"
        "400":
          description: Envelope rejected by the verifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseValidateError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Server has no LicensePath configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Verified but write-to-disk failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/audit:
    get:
      operationId: listAdminAuditEvents
      summary: Admin audit log viewer
      description: |
        Cursor-paginated read of the system-wide audit event log.
        Every filter is optional; combining them narrows the result.
        Returns the rows ordered newest-first along with the total
        count (cursor-independent) so the UI can render a "X events
        matched" header and a next-page button.

        `next_cursor` is an opaque base64-url token wrapping the last
        row's (occurred_at, id) pair. Pass it back as the `cursor`
        query param to fetch the next page. Null when the response
        is the final page.
      tags: [audit]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["system.audit.read"]
      parameters:
        - name: event_type
          in: query
          required: false
          schema: { type: string }
        - name: actor_user_ref
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: subject_user_ref
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: since
          in: query
          required: false
          description: ISO-8601 lower bound on occurred_at (inclusive).
          schema: { type: string, format: date-time }
        - name: until
          in: query
          required: false
          description: ISO-8601 upper bound on occurred_at (inclusive).
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Page of audit events + total count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/audit/event_types:
    get:
      operationId: listAdminAuditEventTypes
      summary: Distinct event_type values present in the audit log
      description: |
        Used to populate the type-filter dropdown in the audit viewer
        — distinct event_type values from the audit_events table,
        alphabetically. Cheap query (small result set, indexed).
      tags: [audit]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["system.audit.read"]
      responses:
        "200":
          description: Distinct event_type values.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/audit/export:
    get:
      operationId: exportAuditEvents
      summary: Export the audit log (streamed CSV or JSON)
      description: |
        Streams the audit log over a date range as CSV or NDJSON
        (newline-delimited JSON, `format=json`), with an
        operator-picked column subset (ADR 0032 §Export). The response
        is streamed from a keyset cursor, never buffered, so a
        multi-million-row export runs in bounded memory.

        Gated on `system.audit.read`. Actor IP is redacted for callers
        without `system.audit.pii.read`, exactly as the /admin/audit
        list view redacts it (#425) — the export must not leak what the
        list withholds. Requesting the `ip` column without that
        capability yields an empty ip field, not a 403, so the column
        layout stays stable.
      tags: [audit]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["system.audit.read"]
      parameters:
        - name: format
          in: query
          required: false
          description: Output format. Defaults to csv.
          schema:
            type: string
            enum: [csv, json]
            default: csv
        - name: columns
          in: query
          required: false
          description: >-
            Comma-separated column subset, in order. Defaults to all
            columns. Recognised: id, event_type, occurred_at,
            actor_user_ref, subject_user_ref, ip, user_agent, metadata,
            legal_hold. Unknown names are ignored.
          schema: { type: string }
        - name: since
          in: query
          required: false
          description: ISO-8601 lower bound on occurred_at (inclusive).
          schema: { type: string, format: date-time }
        - name: until
          in: query
          required: false
          description: ISO-8601 upper bound on occurred_at (inclusive).
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: The streamed export.
          content:
            text/csv:
              schema: { type: string, format: binary }
            application/x-ndjson:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/scheduled-actions:
    get:
      operationId: listScheduledActions
      summary: List scheduled actions
      description: |
        The "Scheduled actions" admin surface (ADR 0020). Lists every
        scheduled action — pending, done, cancelled and failed —
        newest first, so an operator can see what is queued to fire,
        cancel it before it does, and review what already ran. Filter
        by `state` to narrow to a single lifecycle bucket.
      tags: [scheduled-actions]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["system.admin"]
      parameters:
        - name: state
          in: query
          required: false
          description: Narrow to one lifecycle state.
          schema:
            type: string
            enum: [pending, done, cancelled, failed]
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          description: Opaque next-page token from a prior response.
          schema: { type: string }
      responses:
        "200":
          description: A page of scheduled actions, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduledActionList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/scheduled-actions/{id}/cancel:
    post:
      operationId: cancelScheduledAction
      summary: Cancel a pending scheduled action
      description: |
        Cancels a scheduled action before it fires (ADR 0020). Only a
        `pending` action can be cancelled; a done / failed / already-
        cancelled one is terminal and returns 409. This is the reason
        scheduled actions are a durable table rather than raw enqueued
        jobs: a subscription-expiry action must be cancellable if the
        subscription renews.
      tags: [scheduled-actions]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["system.admin"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The action after cancellation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduledAction" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The action is not pending and cannot be cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/seed/timestamps:
    post:
      operationId: seedBackfillTimestamps
      summary: Bulk-backfill created_at / updated_at for seeded entities
      description: |
        Operator-tooling endpoint for the demo-seed loader
        (see `seed/SEED_INSTRUCTIONS.md`). NOT for general
        operator use — gated on `system.admin`; not surfaced
        in the admin UI.

        Accepts an array of (kind, id, created_at, updated_at,
        last_reviewed_at?) tuples and bulk-updates the
        corresponding rows in `assets` / `posts` / `comments`.
        Idempotent: re-running the same payload produces the
        same end state (UPDATE stamps the same value twice).

        Cap: 1,000 items per request. Larger seeds split into
        multiple calls.

        Emits ONE `admin.seed.timestamps_backfilled` audit
        event per call summarising per-kind counts.
      tags: [admin]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeedTimestampsRequest" }
      responses:
        "200":
          description: Backfill applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedTimestampsResult" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/seed/users:
    post:
      operationId: seedCreateUser
      summary: Create a user with optional password + created_at
      description: |
        Operator-tooling endpoint for the demo-seed loader.
        NOT for general operator use — gated on `system.admin`;
        not surfaced in the admin UI.

        Creates a single user. Idempotency key is the supplied
        `username` (UNIQUE in the user table) — a re-run with
        the same username returns 200 with the existing row
        instead of 409, so apply scripts can re-run safely
        without first checking for prior state.

        Apply scripts build a local username→ref map from the
        returned `ref` and use it when seeding posts /
        collections / comments that reference users by ref.

        Emits one `admin.seed.user_created` audit per actual
        insert (re-runs skip the audit — same pattern as
        `/admin/seed/comments`).
      tags: [admin]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeedUserRequest" }
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedUserResult" }
        "200":
          description: |
            Idempotent re-run — the supplied `username` already
            exists; the existing row's ref is returned
            unchanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedUserResult" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/seed/comments:
    post:
      operationId: seedCreateComment
      summary: Create a comment with forged author + optional created_at
      description: |
        Operator-tooling endpoint for the demo-seed loader.
        NOT for general operator use — gated on `system.admin`;
        not surfaced in the admin UI.

        Creates a single comment with author_user_ref forged to
        the supplied user (the regular `POST /posts/{id}/comments`
        stamps the caller as author, which is wrong for seeding
        per-post reviewer voices).

        Idempotent when the caller supplies a stable `id`: a
        re-run with the same id returns 200 with the existing
        row instead of 409 — apply scripts can re-run safely.

        Emits one `admin.seed.comment_created` audit per call.
      tags: [admin]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeedCommentRequest" }
      responses:
        "201":
          description: Comment created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "200":
          description: |
            Idempotent re-run — the supplied `id` already
            exists; the existing row is returned unchanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            Either the target object (post / asset / collection)
            or the supplied author user does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /account/password:
    put:
      operationId: changeMyPassword
      summary: Change my password
      description: |
        Self-service password change. Verifies the
        current password, applies the policy (min length / complexity
        from system_config.auth.password_policy), rejects reuse of
        the last 5 passwords, and (optionally) revokes every other
        session belonging to the caller as a defensive default.
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePasswordResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /account/preferences:
    get:
      operationId: getAccountPreferences
      summary: Get my notification + view preferences
      description: |
        Per-user application-behavior preferences:
        which channels (in_app, email) the user wants each notification
        event delivered through, plus default-view selections (home
        tab, browse layout, browse sort) that apply to the user's
        next page load.

        First-visit callers (no row yet) get a zero-value response —
        empty `notification_channels`, empty `default_views`, but the
        canonical `known_event_types`, `known_channels`, and per-event
        `default_channels_by_event` are always populated so the UI can
        render the toggle grid without hard-coding the catalog.

        Channel resolution at notification-write time falls back to
        `default_channels_by_event` for any event the user hasn't
        explicitly set. An explicit empty array MEANS "deliver
        nothing for this event" and overrides the default.
      tags: [account]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: User preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferencesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: patchAccountPreferences
      summary: Replace my notification + view preferences
      description: |
        Upserts the caller's preferences. The wire
        contract is full-object replacement: the client sends the
        entire resolved object, the server validates against the
        build's `known_event_types` + `known_channels` catalogs, and
        rejects unknown values rather than silently persisting them.

        There is no per-field PATCH verb. To "remove a channel from
        an event," send the full `notification_channels` object with
        that channel omitted from the array. To "fall back to system
        default for an event," omit the event key entirely from the
        map.
      tags: [account]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferencesRequest"
      responses:
        "200":
          description: Preferences saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferencesResponse"
        "400":
          description: Validation failure (unknown event / channel / duplicate).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/users/{ref}/password-reset:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: adminResetUserPassword
      summary: Issue a one-shot password for a user (admin helpdesk)
      description: |
        Admin/helpdesk password reset. Generates a
        cryptographically random temporary password, stores its hash,
        and returns the plaintext ONCE in the response so the admin
        can share it with the user out-of-band (chat / SMS / call).
        The user is expected to change it on next login; enforcement
        of "must change on first login" lands with the email-token
        reset flow in a follow-up phase. Audit captures the actor +
        reason; the plaintext password is never logged.
      tags: [users]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["users.password.reset"]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPasswordResetRequest"
      responses:
        "200":
          description: One-shot password generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPasswordResetResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/users/{ref}/impersonate:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: adminImpersonateUser
      summary: Start an admin-impersonation session for a target user
      description: |
        Issues a NEW session bound to the target user but
        attributed to the calling admin via
        sessions.impersonated_by_user_ref. Sets the session
        cookie on the response so the very next request runs
        under the target's identity. The admin's prior session
        is NOT revoked — ending impersonation issues a fresh
        admin session via /auth/impersonation/end.

        Gated on `auth.impersonate` (admin-only by seed).
        Refusals (defense-in-depth):
          - 400 — self-impersonation (admin impersonating themself).
          - 400 — chain attempt (admin tries to impersonate while
            already impersonating).
          - 403 — target holds `system.admin` (no privilege-
            escalation by chaining; admins must coordinate
            out-of-band to impersonate each other).
          - 404 — target user not found.

        Audit emits admin.impersonation.started with subject =
        target, actor = admin, metadata.session_id + reason.
      tags: [admin, users]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminImpersonateRequest"
      responses:
        "200":
          description: Impersonation session minted + cookie set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminImpersonateResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{ref}/unlock-account:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: adminUnlockAccount
      summary: Clear failed_login_count + lockout_until for a user
      description: |
        Manually clears the per-username lockout state a user has
        accumulated. Called by admins for legitimate users who got
        stuck (typo cascades, retrying a forgotten password).

        Gated on `auth.unlock` (admin-only by seed). Idempotent:
        calling on an already-unlocked user returns 200 with
        unlocked=false; no audit fires for the no-op case.

        Audit emits auth.lockout.cleared with subject = target
        user_ref, actor = admin.user_ref, metadata.source="admin"
        + metadata.prior_failed_count.
      tags: [admin, users]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Unlock attempted (see body for effect).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUnlockAccountResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/impersonation/end:
    post:
      operationId: endImpersonation
      summary: End the current admin-impersonation session
      description: |
        Revokes the current impersonation session + issues a
        fresh session for the original admin so the response
        leaves the caller signed in as themselves. No-op (400)
        when the current session is not an impersonation.

        Audit emits admin.impersonation.ended with subject =
        target, actor = admin.
      tags: [auth]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Impersonation ended + admin session restored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EndImpersonationResult" }
        "400":
          description: Current session is not an impersonation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /account/security/2fa:
    get:
      operationId: getMyTOTP
      summary: Read the caller's 2FA enrollment status
      description: |
        Returns whether the caller has enrolled, whether the
        enrollment is confirmed, when it was last used, and how
        many unused recovery codes remain. Used by the /account/
        security page to render the "enroll" vs "manage" branch.
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Caller's TOTP status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TOTPStatus" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: enrollMyTOTP
      summary: Begin TOTP enrollment
      description: |
        Generates a fresh shared secret + returns the base32 form
        plus the otpauth:// URI for QR rendering. The row is
        persisted UNCONFIRMED — login flow is NOT yet gated.
        Caller must POST /account/security/2fa/confirm with a
        valid code to flip the enrollment to active + receive
        backup codes.

        Re-calling overwrites any prior unconfirmed enrollment;
        a CONFIRMED enrollment is left in place (caller must
        DELETE first to re-enroll — that surfaces a "you're
        about to disable 2FA" confirmation in the UI).
      tags: [auth]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Enrollment in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TOTPEnrollResult" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: 2FA already confirmed; disable first to re-enroll.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: disableMyTOTP
      summary: Disable 2FA on the caller's account
      description: |
        Requires the caller's current password to prevent a
        stolen-session attacker from disabling 2FA. Cascades the
        recovery codes via FK.
      tags: [auth]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TOTPDisableRequest" }
      responses:
        "204":
          description: 2FA disabled.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /account/security/2fa/confirm:
    post:
      operationId: confirmMyTOTP
      summary: Confirm TOTP enrollment by submitting a valid code
      description: |
        On first valid code: flips confirmed_at, mints + returns
        N single-use recovery codes (plaintext, shown ONCE).
        After this call the login flow refuses password-only.
      tags: [auth]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TOTPConfirmRequest" }
      responses:
        "200":
          description: Enrollment confirmed; recovery codes shown ONCE.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TOTPConfirmResult" }
        "400":
          description: No pending enrollment or wrong code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /account/security/2fa/recovery/regenerate:
    post:
      operationId: regenerateMyRecoveryCodes
      summary: Mint a fresh batch of recovery codes
      description: |
        Invalidates the prior batch (even unused codes) +
        returns N new plaintext codes shown ONCE. Requires the
        caller's current password.
      tags: [auth]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TOTPDisableRequest" }
      responses:
        "200":
          description: New recovery codes shown ONCE.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TOTPRecoveryCodes" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /account/sessions:
    get:
      operationId: listMySessions
      summary: List my active sessions (multi-device)
      description: |
        Surfaces the caller's own active sessions for
        the /account/sessions self-service page. The row that's
        authenticating this request carries `current: true` so the
        UI can hide its own revoke button.

        Never returns `ip` — see SessionRow.ip (#567). Devices are
        identified by user-agent.

        In demo mode (`AA_DEMO_MODE=1`) every visitor shares one
        account, so this returns ONLY the session authenticating the
        request rather than every visitor's.
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: List of the caller's active sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /account/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeMySession
      summary: Revoke one of my sessions
      description: |
        Ownership-checked: revokes only when the session id belongs
        to the caller. 404 covers both "wrong owner" and "no such
        session" so existence can't be probed.

        In demo mode (`AA_DEMO_MODE=1`) every visitor shares one
        account, so the caller's "other" sessions belong to other
        people. Only the session authenticating the request may be
        revoked; anything else is 403 (#567).
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{ref}/sessions:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: listAdminUserSessions
      summary: List a user's active sessions (admin)
      description: |
        Admin view of a specific user's sessions for
        the per-user admin detail page. Same row shape as the
        self-service endpoint; `current` is omitted (admins are
        viewing someone else's sessions, not their own).

        Gated on `users.read`. The session `ip` is omitted for callers
        without `users.pii.read` on top of it (#573), exactly as
        /admin/audit withholds actor IPs from callers lacking
        `system.audit.pii.read` (#425) — one data class, one bar. The
        rest of the row is unaffected, so a support role can still
        label and revoke devices without holding the addresses.
      tags: [users]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["users.read"]
      responses:
        "200":
          description: The user's active sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{ref}/sessions/{id}:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeAdminUserSession
      summary: Revoke a user's session (admin)
      tags: [users]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["users.write"]
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===========================================================================
  # Resource requests
  # ===========================================================================

  /assets/{id}/request-access:
    post:
      operationId: requestAssetAccess
      summary: Submit a resource request for an asset
      description: |
        Creates a `pending` resource_request for the calling user
        against the target asset. Any authenticated user may submit
        a request; the asset's owner — or an approver — decides.
        Owners see their queue at GET /account/requests/incoming.

        Repeating an ask you already have pending returns **200** with
        the existing request, unchanged. One ask is
        (requester, asset, capability); asking twice is the same
        question, not a second one. A DECIDED request does not block a
        new ask — `denied` is terminal for the row, not for the person.

        Granting a request does **not** currently unlock the asset.
        `user_capability_grants` has no per-object scope, so there is no
        capability meaning "you may view this one asset"; a grant here
        records that the owner agreed. Per-asset unlocking is tracked
        separately (#912) and ADR 0064 documents the deferral. Clients
        must not tell the user that approval will reveal the asset.

        When the approver grants the request, a row lands in
        user_capability_grants with `request_ref` populated — the
        CapabilitySweeper reaps both the grant and the linked
        request together at expires_at.
      tags: [requests]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                capability:
                  type: string
                  description: |
                    Capability code being requested. **Optional**, and
                    the request-access UI never sends one: it defaults
                    to `content.access.request`, an inert marker code
                    that confers no access on its own.

                    The field is requester-controlled input, so a
                    request naming any other code — including
                    `system.admin` — is decidable only by a holder of
                    `share.grant` or `system.admin`, never by the
                    asset's owner.

                    `content.restore.request` is **refused** here with
                    400. That marker's gate is about a soft-deleted
                    row's owner and its deleter, and none of those
                    checks run on this path — see
                    `POST /account/trash/{kind}/{id}/request-restore`.
                reason:
                  type: string
                  maxLength: 1000
                  description: Optional free-text justification.
      responses:
        "200":
          description: |
            An identical ask was already pending. The existing request
            is returned unchanged; nothing was created and nobody was
            notified again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceRequest" }
        "201":
          description: Request created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceRequest" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /account/requests:
    get:
      operationId: listOwnRequests
      summary: List the caller's own resource requests
      description: |
        Returns the caller's resource requests, newest first.
        Limit defaults to 50 + caps at 200.
      tags: [requests]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ResourceRequest" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /account/requests/incoming:
    get:
      operationId: listIncomingRequests
      summary: List pending requests the caller is the one to decide
      description: |
        The non-operator decision queue: pending requests this caller
        can act on without holding any capability, oldest first.

        No capability is required and none would help — the gate is a
        join, not a check. This exists because /admin/requests is gated
        on `requests.read` / `share.grant`, capabilities an artist has
        no reason to hold, which left the people with the strongest
        claim to decide unable to reach the queue.

        Two disjoint sets, joined on two different facts:

        * **Access requests** against assets the caller OWNS (#881),
          joined on `assets.owner_user_ref`. Live assets only — an
          owner has no decision to make about access to something they
          deleted.
        * **Restoration appeals** against items the caller DELETED
          (#931), joined on the target's `deleted_by_user_ref` across
          all three soft-deletable kinds. Keyed to the deleter rather
          than the owner because the owner IS the requester here, and
          `auth.CanRestoreDeleted` gives the undo to whoever performed
          the delete.

        They cannot overlap: the first requires a live asset, the
        second a soft-deleted target.

        Decisions go to POST /admin/requests/{id}/decide, whose gate is
        the authority here — `decidable_by_caller` on each row is that
        same gate, computed rather than restated.
      tags: [requests]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Pending requests against the caller's own assets.
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ResourceRequest" }
                  total:
                    type: integer
                    format: int64
                    description: Total pending count against the caller's assets.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/requests:
    get:
      operationId: listAdminRequests
      summary: List pending resource requests (approver-facing)
      description: |
        Returns the pending resource_request rows, oldest first.
        Requires `share.grant` capability OR `system.admin`.
        Per-approver capability scoping (filtering by which team the
        approver actually controls) is a polish-phase follow-up.
      tags: [requests]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Pending requests
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ResourceRequest" }
                  total:
                    type: integer
                    format: int64
                    description: Total pending count (badge value).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/requests/{id}/decide:
    post:
      operationId: decideAdminRequest
      summary: Grant or deny a pending resource request
      description: |
        Atomic CAS — only pending requests transition. Re-deciding
        an already-decided request returns 409.

        There are two kinds of request behind this one endpoint, and
        `requested_capability` — not the caller's rank — decides which
        gate and which consequence apply.

        ## Access requests (anything except `content.restore.request`)

        Requires `share.grant` OR `system.admin` — **or** ownership of
        the requested asset, for requests naming
        `content.access.request` only. The owner disjunct is narrower on
        purpose: `requested_capability` is requester-controlled, so an
        owner who could decide any request could be induced to grant
        `system.admin` from a panel about their own artwork.

        On grant, a user_capability_grants row is inserted in the
        same tx as the resource_request CAS. expires_at on the
        grant is the same value the operator supplied here; the
        CapabilitySweeper reaps both together when it fires.

        A grant does **not** unlock the asset's bytes. There is no
        per-object capability scope, so approval records agreement, not
        access — see #912 and ADR 0064.

        ## Restoration appeals (`content.restore.request`, #931)

        Decidable ONLY by a caller who passes `auth.CanRestoreDeleted`
        against the TARGET's deleter: the person who deleted it, or
        `system.admin`. `share.grant` alone does **not** qualify —
        authority over sharing is not authority over moderation — and
        neither does ownership, so a requester can never decide their
        own appeal.

        On grant the server performs the restore and writes **no**
        `user_capability_grants` row. The marker confers nothing and
        there is nothing to confer: what was asked for is a state change
        on the item, not a standing right. This is also what keeps the
        #881 escalation surface closed — the grant path that copies
        `requested_capability` verbatim into a capability grant is not
        reached on this branch at all.

        `expires_at` on a restore grant is **400**. A performed restore
        cannot expire, and silently ignoring the field would let an
        operator believe they had set a deadline.

        If someone else already restored the target, the grant still
        succeeds: the requested end-state holds, and the decision reason
        records that it was already live.

        ## Failure shape

        A caller who is neither an approver nor the owner gets 403 for
        every failure, including a request id that does not exist: a 404
        here would let a non-approver probe for request ids and read off
        which capability each names.
      tags: [requests]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [granted, denied]
                reason:
                  type: string
                  maxLength: 1000
                  description: Operator-supplied decision reason.
                expires_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: |
                    On grant: optional auto-expiry. Past values
                    rejected. Omit / null for a permanent grant.
                    Ignored on deny.
      responses:
        "200":
          description: Decided.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceRequest" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Already decided.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/featured:
    get:
      operationId: listFeaturedItems
      summary: List admin-curated featured items (GitHub #341)
      description: |
        Returns the featured curation list in display order (position
        ascending, then created_at). Each entry resolves its subject's
        display title, plus thumbnail hints for asset subjects.
        Requires `system.admin`.
      tags: [featured]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Featured items in order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/FeaturedItem" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: addFeaturedItem
      summary: Add an asset or collection to the featured list
      description: |
        Appends a subject to the curation list, or inserts it at the
        given position. Re-adding an already-featured subject returns
        409. Requires `system.admin`.
      tags: [featured]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeaturedItemInput" }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeaturedItem" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Subject already featured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/featured/order:
    put:
      operationId: reorderFeaturedItems
      summary: Reorder the featured list
      description: |
        Replaces the ordering with the supplied id sequence — each id
        is assigned its 0-based array index as its new position, in one
        transaction. Ids not present in the list are left untouched.
        Requires `system.admin`.
      tags: [featured]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "204":
          description: Reordered.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/featured/{id}:
    delete:
      operationId: removeFeaturedItem
      summary: Remove an entry from the featured list
      description: |
        Deletes one curation entry by its featured_items id (not the
        subject id). Requires `system.admin`.
      tags: [featured]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/featured/promo:
    get:
      operationId: getAdminPromoBand
      summary: The operator promo band, for editing (GitHub #1118)
      description: |
        The band definition and its cards, with NO audience gate and no
        collapse: a disabled band, a band with no cards and a band whose
        cards are all above the tier this operator would read on the
        public surface all come back in full. This is the page an
        operator uses to BUILD the band, so it has to show what is
        there.

        Returns 404 when the install has no band at all. The
        distinction from "an empty band" is real and the client needs
        it: one offers "create", the other offers "add a card".

        `items` here resolves through the same list as the rail's admin
        curation list, which is deliberately gated more weakly than the
        public read (see `listFeaturedItems`).

        Read takes `featured.read` so a read-only auditor can see what
        is published; every write below stays `system.admin`.
      tags: [featured]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The band and its cards.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromoBand" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: savePromoBand
      summary: Create or replace the operator promo band (GitHub #1118)
      description: |
        Upserts THE band. v1 renders one band, so this is a singleton
        write rather than an id-addressed create — the table admits
        several (ADR 0030's slot inventory is plural) and the reader
        takes the enabled one with the lowest `after_page`, but the API
        does not pretend to a plurality the release does not ship.

        A REPLACE, not a PATCH: every field the form owns is written on
        every save, so clearing the blurb is expressible.

        The read that decides insert-vs-update runs in the same
        transaction as the write, so two operators saving at once cannot
        both find no band and both create one.

        400 for a `cta_label`/`cta_url` supplied without its partner,
        for an `after_page` below 1, and for a `cta_url` that is not an
        absolute http(s) URL or a site-relative path — see
        `PromoBand.cta_url` for why that last one is a security check.
      tags: [featured]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromoBandInput" }
      responses:
        "200":
          description: The saved band and its cards.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromoBand" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: deletePromoBand
      summary: Delete the operator promo band (GitHub #1118)
      description: |
        Removes the band. Its cards go with it, through the
        `featured_items.band_id` cascade — they are NOT orphaned onto
        the featured rail, which is the anonymous landing page and not a
        surface the operator chose for them.

        Disabling (`enabled: false`) is the reversible alternative and
        is what an operator normally wants; this exists so a band can be
        actually removed rather than left switched off forever.
      tags: [featured]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/featured/promo/items:
    post:
      operationId: addPromoBandItem
      summary: Add a card to the operator promo band (GitHub #1118)
      description: |
        Appends one asset or collection to the band, at the end of its
        own ordering — band positions are computed WITHIN the band, so
        adding a card never reads or writes a rail position.

        Removal and reordering are the EXISTING endpoints:
        `DELETE /admin/featured/{id}` takes any placement id, band card
        or rail entry, and `PUT /admin/featured/order` assigns positions
        by id. Minting band-only twins of two operations that already do
        exactly the right thing would have been two more places for the
        next change to miss.

        409 when the subject is already a card in this band. The same
        subject may still be on the rail, and may be in another band —
        those are different placements on different surfaces, which is
        what the widened uniqueness key in migration 00053 exists to
        allow.

        404 when the install has no band to add to.
      tags: [featured]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromoBandItemInput" }
      responses:
        "201":
          description: The created placement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeaturedItem" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: That subject is already a card in this band.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/users:
    get:
      operationId: listAdminUsers
      summary: List users (admin)
      description: |
        Paginated admin user list. Newest accounts first.
        Filters: `q` runs a case-insensitive substring match across
        username / fullname / email; `status` narrows to active /
        pending / disabled (mapping to the underlying user.approved
        flag, see 1.17.B for the lifecycle state machine). Cursor
        pagination via opaque `cursor` token; `total` is the
        unfiltered-by-cursor count for the badge in the chrome.
      tags: [users]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["users.read"]
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive substring match across username, fullname, email.
          schema: { type: string, maxLength: 200 }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, pending, disabled, archived]
        - name: cursor
          in: query
          required: false
          description: Opaque token from a previous response's `next_cursor`.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: A page of admin user rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/users/{ref}/status:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      operationId: setAdminUserStatus
      summary: Change a user's lifecycle status (admin)
      description: |
        Admin-only lifecycle transition. Moves a user
        through pending / active / disabled. The audit log records
        the before / after / reason tuple.
      tags: [users]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["users.approve"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserStatusUpdate"
      responses:
        "200":
          description: New status (after the transition).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserStatusResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/tokens/{id}:
    delete:
      operationId: revokeApiToken
      summary: Revoke an API token by ID
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked.
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Background-job queue. The same HTTP surface
  # serves three worker shapes: in-process workers (used by the local
  # app), external render farms (claim a batch, execute
  # on big iron, post results back), and federated peer instances
  # that opt in to help us drain our queue.
  /jobs/claim:
    post:
      operationId: claimJobs
      summary: Atomically claim a batch of pending jobs
      description: |
        Pulls up to `limit` pending jobs whose `type` is in the
        `types` allowlist (omit `types` to claim any type the caller
        is authorised to run). Each claimed job is marked `running`
        with a lease — the worker must call `/jobs/{id}/heartbeat`
        before the lease expires or the watchdog will requeue it.

        Auth: any authenticated caller for now. A future phase adds a
        `worker` token kind that scopes claim/complete/fail without
        granting any read access elsewhere.
      tags: [jobs]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobClaimRequest" }
      responses:
        "200":
          description: Claimed jobs (possibly an empty array)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobClaimResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getJob
      summary: Fetch a job's current state
      tags: [jobs]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /jobs/{id}/heartbeat:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: heartbeatJob
      summary: Extend the lease on a running job
      description: |
        Workers should call this faster than the lease window
        (default 5 minutes). Returns 409 if the lease was already
        taken by another worker.
      tags: [jobs]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerIdentity" }
      responses:
        "204": { description: Lease extended }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: Lease lost — another worker took the job }

  /jobs/{id}/complete:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: completeJob
      summary: Mark a running job as done
      tags: [jobs]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobCompleteRequest" }
      responses:
        "204": { description: Marked done }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: Lease lost }

  /jobs/{id}/fail:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: failJob
      summary: Record a failure on a running job
      description: |
        If `terminal=true` the job goes straight to status=failed and
        will not be retried. Otherwise the job returns to `pending`
        unless its attempts count reached `max_attempts`.
      tags: [jobs]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobFailRequest" }
      responses:
        "204": { description: Failure recorded }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: Lease lost }

  /storage/objects:
    post:
      operationId: uploadStorageObject
      summary: Upload a raw byte stream
      description: |
        Streams the request body to storage, computing sha256 in the
        same pass. If the resulting hash already exists, the bytes are
        not re-uploaded — only a new pin is added so the caller's user
        keeps the object alive. The response includes a `deduped` flag
        so clients can show "already uploaded" UX.

        The pin subject for this endpoint is always `user:<caller-ref>`.
        Asset entity creation (`POST /assets`) issues `asset:<uuid>`
        pins and removes the `user:` pin once the entity owns the bytes.
      tags: [storage]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      parameters:
        - name: X-Content-Type
          in: header
          required: false
          description: |
            Original content type of the upload. Defaults to
            application/octet-stream when omitted. Recorded as the
            original variant's content_type so download responses can
            set the right Content-Type header.
          schema:
            type: string
      responses:
        "201":
          description: Upload accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /storage/objects/{hash}:
    get:
      operationId: downloadStorageObject
      summary: Download a raw byte stream by content hash (original variant)
      description: |
        Returns the bytes of the `original` variant. Supports HTTP
        Range requests for partial downloads (video scrub, resumable
        downloads). 404 when the hash isn't known to this server.
      tags: [storage]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: hash
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
        - name: Range
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Full body
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial body (Range request honoured)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /storage/objects/{hash}/variants/{variant}:
    get:
      operationId: downloadStorageObjectVariant
      summary: Download a specific variant of a stored object
      description: |
        Same semantics as the original download but for any named
        variant key (e.g. "preview_2048", "thumb_512",
        "hls/seg00001.ts").
      tags: [storage]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: hash
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
        - name: variant
          in: path
          required: true
          schema:
            type: string
        - name: Range
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Full body
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial body (Range request honoured)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets:
    post:
      operationId: createAsset
      summary: Create an asset entity
      description: |
        Creates a new asset, optionally linking it to a previously
        uploaded byte stream via `file_hash`. If `file_hash` is set,
        the storage layer is re-pinned under
        `asset:<new-asset-id>` and the caller's prior `user:` pin
        for that hash is dropped (the bytes are now owned by the
        asset, not the uploader).

        Answers **404** when `team_id` names a team that does not
        exist OR one this caller may not assign to — the two are
        deliberately the same response, so this endpoint cannot be
        used to enumerate the instance's teams. See
        `AssetCreate.team_id`.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetCreate"
      responses:
        "200":
          description: |
            Asset already exists with the same content hash and
            the operator's `upload.dedup_behavior` is `warn` —
            returns the EXISTING asset (no new row created) with
            a `duplicate_warning` field set so the UI surfaces a
            dialog. See `AssetWithDedup.duplicate_warning`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetWithDedup"
        "201":
          description: Asset created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Asset with the same content hash already exists in the
            user's library and the operator's
            `upload.dedup_behavior` is `block`. Response carries
            the existing asset id under `existing_asset_id` so
            the UI can navigate there.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadConflict"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listAssets
      summary: List assets (paginated)
      description: |
        Returns assets visible to the caller, newest first. Supports
        cursor pagination plus simple filters; richer search lands
        with ADR 0010.
      tags: [assets]
      # Anonymous-readable (#415). Documentary only — the handler
      # guard enforces access, not this block: /search has served
      # anonymous traffic without it.
      security: []
      parameters:
        - name: owner_ref
          in: query
          required: false
          description: Filter to a single owner's assets.
          schema: { type: integer, format: int64 }
        - name: liked_by
          in: query
          required: false
          description: |
            Restrict the page to assets this user ref has LIKED (#1106).
            Same contract as `liked_by` on `GET /posts` — see there.

            ONE DIFFERENCE, and it is deliberate. Unfiltered browse
            returns an asset the caller may not read as a `restricted`
            PLACEHOLDER (ADR 0064; #881's request-access flow attaches to
            it). With `liked_by` set the row is ABSENT instead: the page
            is then a statement about one person's ACTIONS, and a
            placeholder on it would disclose that they liked something
            this viewer cannot see — a fact about a third party attached
            to a row they do not own. The filter is
            `visibility.FieldsReadableSQL`, the sanctioned SQL twin of
            the per-row decision that would otherwise have redacted it,
            so "survives the filter" and "renders unredacted" are the
            same answer.
          schema: { type: integer, format: int64 }
        - name: asset_type
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, active, archived]
        - name: tag
          in: query
          required: false
          description: Single-tag filter (intersection with other filters).
          schema: { type: string }
        - name: team_id
          in: query
          required: false
          description: |
            Scope the page to one team's assets — the assets tab on a
            team page (#684).

            NARROWING ONLY. It is a filter, never a grant: asking for a
            team's page does not make you a member of it. The visibility
            predicate still selects the rows and the field plane still
            decides which arrive as placeholders, so a non-member sees
            that team's public work plus a placeholder for each of its
            restricted assets — the same rows unfiltered browse would
            have shown them, minus every other team's.

            Not a team-existence probe: an unknown team, a soft-deleted
            team and a team with no assets all answer with an empty page.
          schema: { type: string, format: uuid }
        - name: q
          in: query
          required: false
          description: |
            Plain-text search. Matched against the search_text TSVECTOR
            on each asset (built from title + description + tags + the
            searchable field-value text by the metadata
            trigger). Whitespace-separated tokens AND together via
            plainto_tsquery. Composes with `tag`: both narrow the same
            page (before #657 the by-tag branch was a separate query
            with no search_text column, so `q` was silently dropped).
            A future search DSL (ADR 0010) will replace this.
          schema: { type: string, maxLength: 200 }
        - name: cursor
          in: query
          required: false
          description: Opaque pagination token from a previous response.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: include_deleted
          in: query
          required: false
          description: |
            Admin-only. When `true`, soft-deleted assets appear in
            the result set alongside live rows. Non-admin callers
            are ignored (soft-deleted rows stay hidden). Default
            `false`.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: A page of assets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /assets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getAsset
      tags: [assets]
      # Anonymous-readable (#415). Documentary only — the handler
      # guard enforces access, not this block: /search has served
      # anonymous traffic without it.
      security: []
      responses:
        "200":
          description: The asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAsset
      description: |
        Partial update. Only fields present in the request body are
        modified. Use `tags` (array) to replace the full tag set; use
        `POST /assets/{id}/tags` for additive changes.

        Optimistic concurrency: pass the asset's last-
        known `updated_at` value as `if_unchanged_since` in the
        body; if the row has been edited since, the server returns
        409 with the current `updated_at` so the client can reload.

        AUTHORISATION. The asset's owner, a holder of `assets.admin`
        (globally, or scoped to the asset's team or any ancestor of
        it), or `system.admin`. Anyone else gets 403 and the row is
        not touched. Until #930 this checked only that the caller was
        signed in, so any account could rewrite any asset.

        `status` is held to a NARROWER gate than the rest of the body:
        the owner or `system.admin` only. Publication decides who can
        REACH the asset — an anonymous reader requires
        `status = 'active'` — so it is a disclosure decision rather
        than content management, and `assets.admin` does not confer it.
        A non-owner sending the status the asset already has is fine;
        only a CHANGE is refused.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUpdate"
      responses:
        "200":
          description: Updated asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Asset was edited by someone else after the timestamp
            in `if_unchanged_since`. Reload the asset + try again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditConflict" }
    delete:
      operationId: deleteAsset
      summary: Soft-delete an asset
      description: |
        Marks the asset deleted (sets `deleted_at`). The storage pin
        is removed; the GC sweeper later collects bytes that are no
        longer pinned by anyone.

        Accepts optional `{reason}` body captured
        into `deleted_reason` for the admin recovery-window audit.

        AUTHORISATION is the same gate as `PATCH /assets/{id}`: the
        owner, a holder of `assets.admin` (global or scoped to the
        asset's team or an ancestor of it), or `system.admin`. Anyone
        else gets 403 and the row is not touched. Until #930 this
        checked only that the caller was signed in, so any account
        could delete any asset while only `system.admin` could restore.

        The caller is recorded in `deleted_by_user_ref`, which is what
        `POST /admin/assets/{id}/restore` then lets them undo.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SoftDeleteRequest" }
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/assets/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: restoreAsset
      summary: Restore a soft-deleted asset
      description: |
        Clears `deleted_at` + `deleted_reason` on the asset row and
        fires an `admin.asset.restored` audit event carrying the prior
        reason + how long the asset had been soft-deleted.

        AUTHORISATION turns on WHO DELETED IT, not on the caller's
        standing authority (#931): you may undo your own delete, and
        `system.admin` may undo any. Nothing else. That keeps restore
        authority matched to delete authority — whoever passed the
        delete gate can reverse themselves — while an administrator's
        removal is not silently undone by the owner the moment it
        lands; the owner asks for restoration instead.

        A row whose `deleted_by_user_ref` is NULL — deleted before this
        was recorded, or removed by a system-scheduled retention
        action — is restorable by `system.admin` only.

        Returns 404 if the asset is already live (or doesn't
        exist). Returns 401 for anonymous callers; 403 when the caller
        did not delete it.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Restored
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/file:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: Range
        in: header
        required: false
        schema: { type: string }
    get:
      operationId: downloadAssetFile
      summary: Download the asset's primary file (original variant)
      description: |
        Proxies to `/storage/objects/{file_hash}` for the asset's
        linked storage object. 404 when the asset has no file_hash
        set yet (e.g. a draft created without an upload).
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Full body
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: Partial body (Range honoured)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/variants/{variant}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: variant
        in: path
        required: true
        schema: { type: string }
      - name: Range
        in: header
        required: false
        schema: { type: string }
    get:
      operationId: downloadAssetVariant
      summary: Download a named variant of the asset (thumb / preview / etc.)
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Full body
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: Partial body (Range honoured)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/companions:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listAssetCompanions
      summary: List sidecar files attached to a 3D model asset
      description: |
        Returns the set of companion files attached to this asset, in
        path order. The viewer fetches this list before mounting a 3D
        body and uses it to rewrite relative resource references
        (textures, MTL, .bin) through a LoadingManager URL modifier.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: List of companions (may be empty)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AssetCompanion" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addAssetCompanion
      summary: Attach a sidecar file to a 3D model asset
      description: |
        Streams the file body content-addressed into storage, then
        attaches it to the asset at the given relative path. If a
        companion already exists at that path it is replaced (the old
        pin is removed; the storage object lives on if other pins
        reference it).
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: X-Companion-Path
          in: header
          required: true
          description: |
            Relative path the model file references this companion at.
            Slashes are allowed for subdirectory layouts
            ('textures/foo.png'). Limited to 512 chars.
          schema: { type: string, minLength: 1, maxLength: 512 }
        - name: X-Content-Type
          in: header
          required: false
          description: |
            MIME type of the companion bytes. If absent we default to
            application/octet-stream.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Companion attached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetCompanion" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /assets/{id}/alternates:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listAssetAlternates
      summary: List variant files (palette swaps, transcodes, thumbnails) for an asset
      description: |
        Returns the sibling-version variants attached to this asset,
        most-recently-created first. Where companions are sidecars the
        primary asset references, alternates are variants of the asset
        itself — a palette-swapped sprite sheet, a web-res thumbnail,
        a transcoded proxy. Each alternate stands on its own and can
        be downloaded directly.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: List of alternates (may be empty)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AssetAlternate" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addAssetAlternate
      summary: Attach a variant file to an asset
      description: |
        Streams the variant body content-addressed into storage, then
        attaches it as a sibling alternate. Replaces any existing
        alternate with the same label (the old pin is removed). Pass
        the kind tag in X-Alternate-Kind so the UI can group + filter;
        kind-specific metadata travels as JSON in X-Alternate-Metadata.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: X-Alternate-Label
          in: header
          required: true
          description: |
            Human label shown in alt-file lists. Unique per asset; an
            upload with an existing label replaces the previous variant.
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: X-Alternate-Kind
          in: header
          required: false
          description: |
            Provenance tag — palette_swap | thumbnail | low_res |
            authored | transcode. Free-form so new generators don't
            need a backend change; defaults to "authored".
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: X-Alternate-Metadata
          in: header
          required: false
          description: |
            JSON-encoded per-kind metadata. The sprite tool's palette
            swap encodes its "from → to" colour map here; thumbnail
            workers encode dimensions. Opaque to the backend.
          schema: { type: string, maxLength: 8192 }
        - name: X-Content-Type
          in: header
          required: false
          description: MIME type of the alternate bytes.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Alternate attached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetAlternate" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /assets/{id}/alternates/{alternate_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: alternate_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: downloadAssetAlternate
      summary: Download an alternate's bytes
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Alternate body
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removeAssetAlternate
      summary: Detach an alternate from an asset
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Alternate removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/subtitle-tracks:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listSubtitleTracks
      summary: List subtitle tracks for an asset
      description: |
        Returns the WebVTT subtitle / caption tracks attached to
        this asset. Returns 422 when the asset's renderable kind
        doesn't support subtitles (image / 3D / document / etc.) —
        the body's `error` field carries the "subtitles not
        applicable" message so frontend clients can render a
        helpful disabled-state message instead of treating the 422
        as a generic server error.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Subtitle tracks (possibly empty).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SubtitleTrack" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    post:
      operationId: uploadSubtitleTrack
      summary: Upload a subtitle / caption track
      description: |
        Upload a subtitle file (SRT / SSA / ASS / SUB / VTT) for
        this asset. The conversion worker normalises the file to
        WebVTT and inserts an asset_subtitle_tracks row. Returns
        202 immediately; the track appears in the list endpoint
        when the conversion job completes (typically <1 second
        for text-based sources).

        IDX (DVD bitmap) uploads return 501 Not Implemented —
        bitmap OCR requires a capability add-on not present in
        the standard runtime.

        Returns 422 when the asset's renderable kind doesn't
        support subtitles.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lang, source_format, content]
              properties:
                lang:
                  type: string
                  description: RFC 5646 language tag (e.g. "en", "en-US"). "und" accepted for sidecar files with no inferable language.
                label:
                  type: string
                  description: Optional human-readable label. Empty string default.
                source_format:
                  type: string
                  enum: [vtt, srt, ssa, ass, sub, idx]
                content:
                  type: string
                  description: Subtitle file contents (UTF-8 text for vtt/srt/ssa/ass/sub).
      responses:
        "202":
          description: Track conversion queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubtitleTrack" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "501":
          description: Format requires a capability add-on not present.

  /assets/{id}/subtitle-tracks/{lang}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: lang
        in: path
        required: true
        schema: { type: string }
        description: RFC 5646 language tag of the track to delete.
    delete:
      operationId: deleteSubtitleTrack
      summary: Remove a subtitle track
      description: |
        Deletes the (asset, lang) subtitle track. The underlying
        WebVTT file in CAS stays (storage GC is a separate process).

        Returns 422 when the asset's renderable kind doesn't support
        subtitles — the policy gate fires BEFORE the row lookup, so
        a Delete on an image asset returns "not applicable" (422)
        rather than "not found" (404).
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Track deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /assets/{id}/burn-subtitles:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: burnSubtitleTrack
      summary: Bake a subtitle track into the video
      description: |
        Enqueues a `subtitle.burn` job that re-encodes the source
        video with the named track baked into the pixel grid. The
        result is a new asset linked back to the source via
        `metadata.video.burned_from`. Use this for exports to
        platforms that don't honour `<track kind="subtitles">`
        (Twitter / IG uploads, embedded video on non-HTML5
        surfaces).

        This endpoint is a stub: it enqueues the job and returns 202
        with the job id, but the worker surfaces a TerminalError
        because the ffmpeg integration is not implemented yet. When
        it is, the job result will carry the new asset id.

        422 when the asset's renderable kind isn't audio/video
        (image / 3D / document assets reject up-front).
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lang]
              properties:
                lang:
                  type: string
                  description: |
                    The (asset, lang) track to bake in. Must match
                    an existing track on the asset.
      responses:
        "202":
          description: Burn job enqueued.
          content:
            application/json:
              schema:
                type: object
                required: [job_id]
                properties:
                  job_id:
                    type: string
                    format: uuid
                    description: The enqueued jobs.* row id. Poll /jobs/{id} for status.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /assets/{id}/edit/img2img:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: generateImg2ImgVariation
      summary: Generate an AI image variation of the source asset
      description: |
        Enqueues an `aiedit.img2img` job that dispatches a prompt +
        the source image's bytes to the operator-configured MCP
        image-edit server (see /admin/system/aiedit). The job runs
        async (ComfyUI generation can take seconds-to-minutes);
        endpoint returns 202 + the job id. Poll /jobs/{id} for
        status; on completion the job result carries the new
        derivative asset id. A creative_lineage row links the
        derivative back to the source for the asset detail panel.

        Requires capabilities `mcp.client.use` (umbrella) plus the
        per-tool capability operator pinned on the img2img grant
        (typically `mcp.client.images.write`).

        Errors:
        - 400 if the request body is missing / malformed.
        - 401 if the caller is unauthenticated.
        - 403 if the caller lacks the required capabilities.
        - 404 if the source asset doesn't exist.
        - 409 if no MCP image-edit server is configured.
        - 422 if the source asset is not an image (audio / video /
          doc / archive — img2img only applies to images).
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Img2ImgRequest" }
      responses:
        "202":
          description: img2img job enqueued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetEditJobAccepted" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /assets/{id}/epub/spine:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getEpubSpine
      summary: List the chapters of an EPUB asset (reading order)
      description: |
        Returns the ordered list of chapters from the default
        rendition's spine. Each entry carries the chapter's
        manifest id, a display label (NCX/TOC label when
        available, else the manifest id, else "Chapter N"), and
        the original href + media type for debugging. The
        frontend reader uses this to populate the table of
        contents + chapter picker.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Ordered spine entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EpubSpineEntry" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /assets/{id}/epub/chapters/{idx}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: idx
        in: path
        required: true
        description: Zero-based spine index.
        schema: { type: integer, minimum: 0 }
    get:
      operationId: getEpubChapter
      summary: Read one EPUB chapter as HTML with rewritten resource refs
      description: |
        Streams the chapter's XHTML body with every relative
        href / src / srcset rewritten to point at
        /assets/{id}/epub/resources/{path}. The frontend reader
        injects this directly into an iframe srcdoc; resources
        resolve through us so auth cookies travel + CORS isn't
        a concern.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Chapter HTML
          content:
            text/html:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /assets/{id}/epub/search:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: q
        in: query
        required: true
        description: |
          Query string. Case-insensitive substring match against
          each chapter's stripped-text body. Queries shorter than
          two characters return an empty list (avoids degenerate
          single-character spam).
        schema: { type: string, minLength: 1 }
    get:
      operationId: searchEpub
      summary: Full-text search across an EPUB's chapters
      description: |
        Scans every spine chapter for the query (case-insensitive),
        returning up to 5 hits per chapter and 200 hits total.
        Each hit carries the chapter idx (jump target), a label
        (display), a snippet (~60 chars on each side of the match),
        and the character offset inside the plain-text chapter
        body (future use when EpubView grows in-page anchor jump).
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Search hits (may be empty)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EpubSearchHit" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /assets/{id}/epub/resources/{path}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: path
        in: path
        required: true
        description: |
          Zip-internal absolute path of the resource (image, CSS,
