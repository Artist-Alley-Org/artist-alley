  /assets/{id}/similar:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listSimilarAssets
      summary: Find assets nearest to this one by vector similarity
      description: |
        Returns up to `limit` other assets whose embeddings sit
        closest to this asset's embedding in cosine space. The
        anchor asset itself is excluded from the result set.

        Lookup uses the embedding row for the configured default
        model (`system_config.ai.embedding.default_model`). If the
        anchor has no embedding yet (job hasn't run / asset has no
        embeddable text), the response is `200` with an empty
        `results` array — the caller can treat this as "no
        recommendations yet" rather than an error.

        Cosine `distance` is in `[0, 2]`; lower = more similar
        (0 = identical vector, 1 = orthogonal). The UI typically
        clamps the visible set at `distance < 1.0` to avoid
        random-looking suggestions for sparse catalogues.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
            description: |
              Max neighbours to return. Default 12 matches the asset
              detail panel's 4-col grid (3 rows visible without
              scroll). Server-side cap is 50.
      responses:
        "200":
          description: Ranked nearest neighbours (anchor excluded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimilarAssets"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/preview:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: recreateAssetPreview
      summary: Re-enqueue this asset's preview job
      description: |
        Inserts a fresh job of the preview kind that matches the
        asset's file extension (preview.raster / preview.video /
        preview.3d / preview.audio / preview.pdf / preview.font /
        preview.ebook / preview.eps / preview.psd / preview.comic /
        preview.text) at PriorityHigh. The worker picks it up within
        a tick.

        By default the job is enqueued with `force=true`, which
        re-renders variants that already exist. Without it this
        endpoint could not do the thing it is named for: every
        handler skips outputs already present in storage, so the job
        completed successfully having written nothing and the
        thumbnail never changed.

        Each rung is overwritten in place by an atomic backend
        write — nothing is deleted first, so an interrupted
        re-render leaves the previous preview intact rather than an
        asset with none.

        Useful after attaching new companions (so a 3D model can
        re-render with its textures) or after a worker bug-fix
        landed and the user wants the existing rendered output
        regenerated against the new code.

        Returns the freshly-enqueued job id so callers can poll
        /jobs/{id}/status if they want a progress UI.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: force
          in: query
          required: false
          schema:
            type: boolean
            default: true
            description: |
              `true` (the default) re-renders every output, ignoring
              what is already in storage. `false` is the cheap
              gap-filling pass: outputs already present are left
              alone, which is what makes a re-queue of an
              up-to-date asset nearly free.
      responses:
        "202":
          description: Job enqueued
          content:
            application/json:
              schema:
                type: object
                required: [job_id, job_type, force]
                properties:
                  job_id: { type: string, format: uuid }
                  job_type: { type: string }
                  force:
                    type: boolean
                    description: |
                      Whether the enqueued job will re-render
                      existing variants. Echoed back so a caller
                      can tell a real re-render from a
                      gap-filling pass without decoding the job
                      payload.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /assets/{id}/tags/{tag}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: tag
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: removeAssetTag
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Tag removed (idempotent)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /fields:
    get:
      operationId: listFields
      summary: List field definitions (the metadata schema)
      description: |
        Returns field definitions, ordered by display group and display
        order. The result is the schema admins build through the
        field-management UI.

        By default, archived (soft-deleted) fields are excluded — the
        list is the live schema. Pass an explicit `status` to filter to
        exactly one status; `status=archived` surfaces the tombstones
        for anyone who needs them.
      tags: [metadata]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, deprecated, archived]
        - name: asset_type
          in: query
          required: false
          description: |
            When set, only fields whose `applies_to` is empty (=all)
            or contains this asset_type ref are returned. Used by
            the asset edit form to figure out which fields to show.
            Implies `subject_kind=asset` — collection fields aren't
            applies_to-scoped.
          schema: { type: integer, format: int64 }
        - name: subject_kind
          in: query
          required: false
          description: |
            Filter by subject kind. `asset` returns only asset-side
            definitions (default behaviour for callers that don't
            specify); `collection` returns only collection-side
            definitions. Omit to return both kinds.
          schema:
            type: string
            enum: [asset, collection]
      responses:
        "200":
          description: List of field definitions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FieldDefinition" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createField
      summary: Create a new field definition (admin)
      tags: [metadata]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FieldDefinitionCreate" }
      responses:
        "201":
          description: Field created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldDefinition" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /fields/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getField
      tags: [metadata]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The field definition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldDefinition" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateField
      summary: Update a field definition (admin)
      description: |
        Partial update. Optimistic concurrency: pass the field's
        last-known `updated_at` as `if_unchanged_since`; 409 if the
        row has been edited since. Required in spirit for the options
        editor per ADR 0012 — editing one term rewrites the whole
        `options` document, so an unguarded write silently discards a
        concurrent editor's curation. Omit to opt out (legacy
        last-write-wins).
      tags: [metadata]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FieldDefinitionUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldDefinition" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Edited by someone else after `if_unchanged_since`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditConflict" }
    delete:
      operationId: archiveField
      summary: Archive (soft-delete) a field definition (admin)
      description: |
        Sets status='archived'. Field values are NOT deleted — they
        stay in `asset_field_value` and remain visible in
        per-asset history. Re-create the field by code to restore.
      tags: [metadata]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Archived
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /fields/{id}/extraction:
