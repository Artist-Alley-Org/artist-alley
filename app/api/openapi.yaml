  /collections:
    get:
      operationId: listCollections
      summary: List collections (filterable, paginated)
      description: |
        Returns collections ordered by `created_at DESC, id DESC` so
        the newest entries are first. Filters and cursor pagination
        match the assets list contract — pass back `next_cursor`
        opaquely as `cursor` to retrieve the following page.
      tags: [collections]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: owner_ref
          in: query
          required: false
          description: Filter to collections owned by this RS user_ref.
          schema: { type: integer, format: int64 }
        - name: visibility
          in: query
          required: false
          schema:
            type: string
            enum: [private, org-only, followers, explicit-share]
        - name: featured
          in: query
          required: false
          schema: { type: boolean }
        - name: tab
          in: query
          required: false
          description: |
            Pre-canned filter for the collections hub:
            - `mine` — collections owned by the caller (any visibility)
            - `featured` — visibility=public AND featured=true
            - `public` — visibility=public (every install-public collection)
            - `shared` — collections the caller has ACL access to but doesn't own
            - `all` — every collection the caller is allowed to see (default)
            `tab` is mutually-exclusive with `owner_ref`/`visibility`/`featured`
            — when set it overrides those.
          schema:
            type: string
            enum: [mine, featured, public, shared, all]
        - name: q
          in: query
          required: false
          description: Free-text filter on `name` (case-insensitive substring).
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A page of collections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createCollection
      summary: Create a new collection
      description: |
        Creates a manual-membership collection owned by the caller.
        Query-membership and hybrid modes ship in 1.11.B; for now
        only `membership=manual` is accepted.
      tags: [collections]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionCreate" }
      responses:
        "201":
          description: Collection created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /collections/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getCollection
      summary: Fetch a single collection by id
      tags: [collections]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The collection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCollection
      summary: Partial update of a collection
      description: |
        Only fields present in the body are touched. Pass
        `expires_at: null` to remove the TTL; omit the field to keep
        the current value.
      tags: [collections]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteCollection
      summary: Hard-delete a collection
      description: |
        Drops the collection row; cascades to `collection_resources`
        via the FK. The underlying assets are untouched.
      tags: [collections]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /collections/{id}/resources:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listCollectionResources
      summary: List the assets pinned in a collection
      description: |
        Returns assets currently pinned in this collection (excludes
        rows where the per-membership `expires_at` has passed), in
        `sort_order ASC, added_at ASC` order so the list matches the
        admin-arranged sequence. Joined onto assets for thumb/title
        without an N+1.
      tags: [collections]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A page of resources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionResourceList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addCollectionResource
      summary: Add (or re-pin) an asset in a collection
      description: |
        Idempotent on `(collection_id, asset_id)`. Re-adding an
        existing membership updates `sort_order`, `pinned`, and
        `expires_at` but keeps `added_at` fixed.
      tags: [collections]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionResourceWrite" }
      responses:
        "204":
          description: Resource added
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /collections/{id}/resources/{asset_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: asset_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: removeCollectionResource
      summary: Remove an asset from a collection
      tags: [collections]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Removed (or was already absent)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /collections/{id}/acls:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listCollectionAcls
      summary: List ACL entries on a collection
      description: |
        Returns every ACL row attached to this collection. ACLs are
        additive grants on top of the collection's visibility +
        collection_grant rows. Requires read access to the
        collection.
      tags: [collections]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: ACL entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AclEntry" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addCollectionAcl
      summary: Grant a permission on a collection to a principal
      description: |
        Inserts one ACL row. Requires write access to the collection
        (owner / collections.admin / system.admin).
      tags: [collections]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AclCreate" }
      responses:
        "204":
          description: ACL row added
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /collections/{id}/acls/{principal_type}/{principal_id}/{permission}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: principal_type
        in: path
        required: true
        schema:
          type: string
          enum: [user, role, team]
      - name: principal_id
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
      - name: permission
        in: path
        required: true
        schema:
          type: string
          enum: [read, write, admin]
    delete:
      operationId: removeCollectionAcl
      summary: Revoke a specific permission row from a principal
      tags: [collections]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /asset_types:
    get:
      operationId: listAssetTypes
      summary: List all asset types
      description: |
        Returns every asset type configured in the system, ordered by
        display order (`order_by`) then by primary key. Anonymous
        callers see every unrestricted type; authenticated callers
        additionally see restricted types they hold a `read` (or
        higher) ACL row on. Admins (system.admin) see everything.
      tags: [asset_types]
      security:
        - cookieAuth: []
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: List of asset types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetType"
        "500":
          $ref: "#/components/responses/InternalError"

  /asset_types/{ref}/acls:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: listAssetTypeAcls
      summary: List ACL rows attached to an asset_type (admin)
      description: |
        Returns every ACL row attached to this asset_type (Phase
        1.17.F-bis). When the response is empty the type is
        unrestricted — every caller can access it. When at least one
        row is present the type is restricted to its grantees + admins.
      tags: [asset_types]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["system.asset_types.admin"]
      responses:
        "200":
          description: ACL entries (possibly empty).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AclEntry" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addAssetTypeAcl
      summary: Grant a permission on an asset_type to a principal
      description: |
        Inserts one ACL row. Re-granting the same tuple refreshes
        granted_at / granted_by / expires_at — idempotent. The first
        row inserted flips the type from "open" to "restricted" for
        non-admin callers.
      tags: [asset_types]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["system.asset_types.admin"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AclCreate" }
      responses:
        "204":
          description: ACL row added.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /asset_types/{ref}/acls/{principal_type}/{principal_id}/{permission}:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: principal_type
        in: path
        required: true
        schema:
          type: string
          enum: [user, role, team]
      - name: principal_id
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
      - name: permission
        in: path
        required: true
        schema:
          type: string
          enum: [read, write, admin]
    delete:
      operationId: removeAssetTypeAcl
      summary: Revoke a specific permission row from a principal
      description: |
        Removes the exact (principal_type, principal_id, permission)
        tuple. Other permission levels for the same principal stay
        intact. Removing the last row on a type flips it back to
        "open" for every caller. 404 if the row doesn't exist.
      tags: [asset_types]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["system.asset_types.admin"]
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams:
    get:
      operationId: listTeams
      summary: List teams (paginated; optional ancestor filter)
      description: |
        Returns every team the caller can see, ordered by name. When
        `ancestor` is supplied, returns only that team and every team
        in its closure (descendants), which lets the upload modal
        scope a picker to "teams under Diablo R&D" without N+1.
        Requires `teams.read`.
      tags: [teams]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: ancestor
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A page of teams
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createTeam
      summary: Create a team
      description: |
        Requires `teams.create`. The optional `parent_ids` array
        attaches the new team as a child of each listed parent (the
        DAG case — a team can report to multiple parents). Cycle
        rejection is enforced by the team_parents trigger.
      tags: [teams]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamCreate" }
      responses:
        "201":
          description: Team created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /teams/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getTeam
      summary: Fetch a team with its direct parents
      tags: [teams]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The team
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateTeam
      summary: Rename or re-describe a team
      description: |
        Patches `name` and/or `description`. Re-parenting goes through
        the dedicated /teams/{id}/parents endpoints to keep the
        closure-maintenance triggers' contract clear.
      tags: [teams]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteTeam
      summary: Soft-delete a team
      description: |
        Marks the team `deleted_at`; preserves closure rows for
        historic audit. Cascading sweeps fire (ACL rows referencing
        the team go via the 00017 trigger; user_roles rows go via
        the FK CASCADE) only when the row is hard-deleted via admin
        action, not via soft delete.
      tags: [teams]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/parents:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listTeamParents
      summary: List the team's direct parents
      tags: [teams]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Direct parent teams
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Team" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addTeamParent
      summary: Add a parent edge (creates a DAG link)
      description: |
        Inserts `(parent_id, child_id)` into team_parents. The cycle-
        rejection trigger returns 409 if the link would close a cycle.
        Requires `teams.admin`.
      tags: [teams]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parent_id]
              properties:
                parent_id: { type: string, format: uuid }
      responses:
        "204":
          description: Linked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /teams/{id}/parents/{parent_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: parent_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: removeTeamParent
      summary: Sever a parent edge
      description: |
        Removes the direct edge. The closure-rebuild trigger
        recomputes ancestry, dropping any pair only reachable via
        the removed edge. Requires `teams.admin`.
      tags: [teams]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Unlinked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listTeamMembers
      summary: List a team's members
      description: |
        Returns rows from team_memberships. Membership does NOT
        propagate to descendants — each member-of-a-team is an
        explicit join.
      tags: [teams]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Members of this team
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TeamMember" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addTeamMember
      summary: Add a user to a team
      description: |
        Requires `teams.admin`. Idempotent — adding an existing
        member is a no-op.
      tags: [teams]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rs_user_id]
              properties:
                rs_user_id: { type: integer, format: int64 }
      responses:
        "204":
          description: Added
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{id}/members/{rs_user_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: rs_user_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: removeTeamMember
      summary: Remove a user from a team
      tags: [teams]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{ref}:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getUserPublicByRef
      summary: Public profile for a user (by RS ref)
      description: |
        Returns the merged user + user_profile view used to render
        author headers in the post modal, the /@username profile page,
        and federation actor representations. Profile-less users
        render fine with substituted defaults.
      tags: [users]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Public profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPublic" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateUserProfile
      summary: Edit a user's profile (self or moderator)
      description: |
        Self-edit always allowed; editing other users requires the
        `users.profile.edit.any` capability (Admin by default).
      tags: [users]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserProfileUpdate" }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPublic" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/by-username/{username}:
    parameters:
      - name: username
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
    get:
      operationId: getUserPublicByUsername
      summary: Public profile by username (used by /@username URLs)
      tags: [users]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Public profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPublic" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{ref}/follow:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: followUser
      summary: Follow this user
      description: |
        Phase 1.17.G2 — directional follow. Idempotent: re-following
        someone you already follow returns 204 too. Self-follow is
        rejected with 400. Cross-block-edge follow (either party has
        blocked the other) is rejected with 403 — modern platforms
        treat blocks as a hard interaction stop.

        Wires the long-parked `posts.visibility='followers'` gate
        from Phase 1.13. The browse-feed "Following" tab also
        activates the moment any follow row exists.
      tags: [social]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Now following (or was already).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: unfollowUser
      summary: Stop following this user
      description: |
        Phase 1.17.G2 — idempotent unfollow. Returns 204 whether
        the edge existed or not. Symmetric to followUser; never
        affects the reverse follow (if the target also follows you,
        they continue to follow you).
      tags: [social]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: No longer following (or never was).
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/{ref}/followers:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: limit
        in: query
        required: false
        schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    get:
      operationId: listUserFollowers
      summary: Paginated list of users following this user
      tags: [social]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Followers list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialUserList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{ref}/following:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: limit
        in: query
        required: false
        schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    get:
      operationId: listUserFollowing
      summary: Paginated list of users this user follows
      tags: [social]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Following list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialUserList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{ref}/relationship:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getUserRelationship
      summary: Caller's social-graph relationship with this user
      description: |
        Phase 1.17.G2 — the single round-trip the profile page
        consumes to decide which "Follow/Unfollow/Blocked/Block"
        button to render. Reports both directions of follow + the
        bidirectional block bit. Anonymous callers receive an
        all-false response (still 200) since the relationship is
        anchored on the caller; client code can short-circuit
        rendering on `is_self`.
      tags: [social]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Relationship snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserRelationship" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{ref}/block:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: blockUser
      summary: Block this user
      description: |
        Phase 1.17.G2 — directional block. Auto-unfollows BOTH
        directions before persisting the block (per Twitter /
        Mastodon / ArtStation convention — blocking + continuing to
        follow is a contradictory state). The optional `reason` is
        private to the blocker, surfaced only in /account/blocked.
      tags: [social]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockUserRequest" }
      responses:
        "204":
          description: Block recorded (or already in place).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: unblockUser
      summary: Stop blocking this user
      description: |
        Phase 1.17.G2 — idempotent unblock. Does NOT re-establish
        any prior follow edges (the original block auto-unfollowed
        them); callers wanting to follow again must do so explicitly.
      tags: [social]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: No longer blocked (or never was).
        "401":
          $ref: "#/components/responses/Unauthorized"

  /account/messages:
    get:
      operationId: listMyDirectMessageThreads
      summary: My DM inbox — one entry per peer (Phase 1.17.I-a)
      description: |
        Lists every peer the caller has exchanged DMs with, paired
        with the most recent message in that thread + the count of
        unread messages from that peer. Newest-first. Wires the
        envelope-icon dropdown + the /account/messages full inbox.
      tags: [messages, account]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: List of threads.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectMessageThreadList" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /account/messages/unread-count:
    get:
      operationId: getMyUnreadDirectMessageCount
      summary: My unread DM badge count
      description: |
        Backs the navbar envelope pill on every authenticated page
        render. Cache-backed (per-recipient LRU + cache.Registry
        NOTIFY broadcast on every write/mark-read).
      tags: [messages, account]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Unread-DM count.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectMessageUnreadCount" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /account/messages/{peer_ref}:
    parameters:
      - name: peer_ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: listDirectMessageThread
      summary: All DMs between me and a specific peer
      description: |
        Cursor-paginated newest-first. Caller must be one of the
        two participants (gate enforced by the WHERE clause — no
        separate "is this thread mine?" check needed). 404 when
        the peer doesn't exist.
      tags: [messages, account]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A page of messages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectMessageList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: sendDirectMessage
      summary: Send a DM to a peer
      description: |
        Send a DM to the user at {peer_ref}. Self-DM rejected with
        400. A block edge in either direction rejects with 403 —
        the same gate the FollowUser path enforces.

        On success, a `direct_message_received` notification fires
        to the recipient via the Phase 1.17.I2 notifications writer
        (which independently re-runs the block + channel-pref
        gates, so a user who muted the verb still gets the DM in
        their inbox but no bell ping).
      tags: [messages, account]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendDirectMessageRequest" }
      responses:
        "201":
          description: Message sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectMessage" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /account/messages/{peer_ref}/read:
    parameters:
      - name: peer_ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: markDirectMessageThreadRead
      summary: Mark every unread DM from this peer as read
      description: |
        Idempotent. Called when the caller opens the thread.
        Returns count of rows newly-flipped so the envelope pill
        can decrement deterministically.
      tags: [messages, account]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: How many were just marked read.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectMessageMarkReadResult" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /account/notifications:
    get:
      operationId: listMyNotifications
      summary: My notification feed (Phase 1.17.I2)
      description: |
        Cursor-paginated notification feed for the caller. Newest-
        first; `only_unread=true` restricts to the unread tail
        (the inbox's "Unread" tab). Each notification carries a
        verb (matching userprefs.KnownEventTypes), an optional
        actor, an optional polymorphic target reference
        (target_kind + target_id), and a JSONB payload with per-
        verb extra context the frontend renderer reads.
      tags: [notifications, account]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: only_unread
          in: query
          required: false
          schema: { type: boolean }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A page of notifications.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationList" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /account/notifications/unread-count:
    get:
      operationId: getMyUnreadNotificationCount
      summary: My unread badge count
      description: |
        The hot read behind the navbar bell on every authenticated
        page render. Backed by a partial index (`WHERE read_at IS
        NULL`) so the working set stays bounded even as the
        lifetime notifications table grows. Per-user cached via
        cache.Registry — invalidates on every write to this user's
        rows.
      tags: [notifications, account]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Unread count snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationUnreadCount" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /account/notifications/{id}/read:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: markNotificationRead
      summary: Mark a single notification as read
      description: |
        Idempotent: 204 whether the row was unread or already read.
        Only the recipient can mark — the row's recipient column
        gates the update so cross-user calls 404 silently.
      tags: [notifications, account]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Marked read (or was already).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /account/notifications/read-all:
    post:
      operationId: markAllMyNotificationsRead
      summary: Mark every unread notification as read
      description: |
        Inbox header "Mark all read". Returns the count of rows
        newly-flipped so the UI can render a "Marked 12 as read"
        confirmation. Idempotent — running twice in a row returns
        0 the second time.
      tags: [notifications, account]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: How many rows were just marked read.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationMarkAllResult" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /account/blocked:
    get:
      operationId: listMyBlocked
      summary: My block list (private to the caller)
      description: |
        Phase 1.17.G2 — paginated list of users the caller has
        blocked, with the optional private reason. The reverse
        direction ("who blocked me") is deliberately NOT exposed
        per platform convention — it's the blocker's privacy.
      tags: [social, account]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Blocked-users list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockedUserList" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me/teams:
    get:
      operationId: getMyTeams
      summary: Teams the caller is a member of (direct memberships)
      description: |
        Returns rows from team_memberships for the caller's
        rs_user_id. Use this in the upload modal to render a team
        picker. Includes only direct memberships; the closure-walk
        for capability resolution happens server-side.
      tags: [teams, auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Caller's teams
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Team" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /setup/status:
    get:
      operationId: getSetupStatus
      summary: First-run setup status + admin-form prefills
      description: |
        Returns whether the system still needs first-run setup, plus
        read-only deployment info (DB host/port, storage backend) and
        any prefill values the admin's deploy environment provided via
        `AA_SETUP_DEFAULT_*` env vars. Anonymous access — this is the
        first thing a brand-new install renders.
      tags: [setup]
      security: []
      responses:
        "200":
          description: Setup status + defaults
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
        "500":
          $ref: "#/components/responses/InternalError"

  /setup/complete:
    post:
      operationId: completeSetup
      summary: Finalize first-run setup (admin + site + SMTP)
      description: |
        One-shot transactional endpoint that creates the first admin
        user, writes site identity (display name, base URL), and
        optionally writes SMTP credentials. Only callable while no
        `system.admin` user exists; subsequent calls return 409.

        SMTP is optional — pass `null` for the `smtp` field if email
        is not configured yet. The admin UI surfaces email-dependent
        features (password reset, notifications) as disabled until
        SMTP is filled in later.
      tags: [setup]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupCompleteRequest"
      responses:
        "201":
          description: Setup complete; first admin is now active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: System already has an administrator; setup is not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /workflow/states:
    get:
      operationId: listWorkflowStates
      summary: List workflow states for a domain
      description: |
        Returns every state in the requested domain (post, asset, ...)
        ordered by `sort_order`. Used by the upload modal's "set
        initial state" dropdown and any management surface that needs
        to render state pickers. The set of domains and states is
        seeded at install time; this endpoint is read-only.
      tags: [workflow]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: domain
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
            example: post
          description: |
            Domain key as stored in `workflow_states.domain`. Common
            values: `post` (all posts), `asset:1` (assets of resource
            type 1 — Photo), `asset:3` (Video), etc.
      responses:
        "200":
          description: States in the requested domain
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkflowState" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /i18n/locales:
    get:
      operationId: listLocales
      summary: List supported UI locales
      description: |
        Returns the locales the frontend has a catalogue for. Used by
        the language picker in the user menu and on the account
        preferences page. Static per server build; the response is
        derived from the bundled frontend catalogues plus a small
        completion-pct hint.
      tags: [i18n]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: List of supported locales
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Locale" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/system/site:
    get:
      operationId: getSiteConfig
      summary: Read the site configuration (name, base URL)
      tags: [system]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Current site config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteConfig" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: updateSiteConfig
      summary: Update the site configuration
      tags: [system]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteConfig" }
      responses:
        "200":
          description: Updated site config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteConfig" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/system/smtp:
    get:
      operationId: getSMTPConfig
      summary: Read the SMTP configuration
      tags: [system]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Current SMTP config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SMTPConfig" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: updateSMTPConfig
      summary: Update the SMTP configuration
      tags: [system]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SMTPConfig" }
      responses:
        "200":
          description: Updated SMTP config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SMTPConfig" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/system/auth:
    get:
      operationId: getAuthConfig
      summary: Read the auth (password policy + SSO providers) configuration
      tags: [system]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Current auth config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: updateAuthConfig
      summary: Update the auth configuration
      description: |
        Persists the password policy and SSO provider list. The
        providers are stored but NOT enforced for login yet —
        enforcement (LDAP/SAML/OAuth login flows) is its own future
        phase. Per-provider config (`config` map) is opaque here;
        the integration code validates the shape at use time.
      tags: [system]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthConfig" }
      responses:
        "200":
          description: Updated auth config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/system/ai:
    get:
      operationId: getAIConfig
      summary: Read the AI provider configuration
      tags: [system]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Current AI config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIConfig" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: updateAIConfig
      summary: Update the AI provider configuration
      description: |
        Persists the AI provider list and default-provider selection.
        Providers are stored but NOT yet used for inference — the
        AI auto-tagging / search phase wires the providers into a
        real client. API keys are stored as plain strings for now
        (admin-only table); a secrets-backend migration is planned.
      tags: [system]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIConfig" }
      responses:
        "200":
          description: Updated AI config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIConfig" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/system/appearance:
    get:
      operationId: getAppearanceConfig
      summary: Read the per-install appearance configuration
      description: |
        Returns the admin-chosen font slots (brand / display / body /
        mono). Each slot holds a font catalogue ID; empty means the
        slot uses the frontend default.
      tags: [system]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Current appearance config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppearanceConfig" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: updateAppearanceConfig
      summary: Update the per-install appearance configuration
      description: |
        Persists the brand / display / body / mono font slot IDs.
        Empty string in any field means "use the slot default".
        Requires the `system.appearance.write` capability (auto-granted
        to admins).
      tags: [system]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppearanceConfig" }
      responses:
        "200":
          description: Updated appearance config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppearanceConfig" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /appearance:
    get:
      operationId: getPublicAppearance
      summary: Read the appearance configuration for the frontend boot path
      description: |
        Unauthenticated read of the brand / display / body / mono font
        slot IDs. The frontend calls this at boot to know which fonts
        to load before the user has signed in. Returns the same shape
        as the admin endpoint — there are no admin-only fields in
        AppearanceConfig.
      tags: [system]
      security: []
      responses:
        "200":
          description: Current appearance config (public)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppearanceConfig" }

  /brush-packs:
    get:
      operationId: listBrushPacks
      summary: List the caller's imported brush packs
      description: |
        Returns every brush pack owned by the authenticated user,
        most-recent first. Each pack carries its stamp manifest
        (id, dimensions, dynamics) — the actual stamp bitmaps are
        fetched on demand via `/brush-packs/stamps/{stampId}`.
        Built-in stamps shipped with the frontend are NOT listed
        here; the frontend registers those locally.
      tags: [brushpacks]
      responses:
        "200":
          description: Brush pack list
          content:
            application/json:
              schema:
                type: object
                required: [packs]
                properties:
                  packs:
                    type: array
                    items: { $ref: "#/components/schemas/BrushPack" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: importBrushPack
      summary: Import a Photoshop .abr brush pack
      description: |
        Accepts a binary `.abr` upload, parses it, writes every
        decoded brush stamp to object storage, and registers the
        pack under the caller's ownership. Returns the freshly
        created pack manifest so the frontend can immediately add
        the stamps to its brush picker.
      tags: [brushpacks]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                name:
                  type: string
                  description: Display name; defaults to the filename when omitted.
                file:
                  type: string
                  format: binary
                  description: The .abr pack bytes.
      responses:
        "201":
          description: Pack imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrushPack" }
        "400":
          description: Malformed file or unsupported ABR version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /brush-packs/{packId}:
    parameters:
      - name: packId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getBrushPack
      summary: Get a brush pack + stamp manifest
      tags: [brushpacks]
      responses:
        "200":
          description: Pack manifest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrushPack" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteBrushPack
      summary: Delete a brush pack
      description: |
        Drops the pack + stamp manifest rows. The stamp bitmaps in
        object storage are NOT immediately deleted — content-
        addressed storage means the same bitmap may be referenced
        by other packs. A future GC pass cleans orphans.
      tags: [brushpacks]
      responses:
        "204":
          description: Pack deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /brush-packs/stamps/{stampId}:
    parameters:
      - name: stampId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getBrushPackStamp
      summary: Stream a brush stamp bitmap
      description: |
        Returns the raw PNG bytes of one stamp. The frontend renderer
        fetches this URL on first use of the stamp + caches the
        decoded Image element in memory. Owner-scoped — stamps in
        another user's pack 404 (no existence-leak).
      tags: [brushpacks]
      responses:
        "200":
          description: Stamp PNG bytes
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: user
      description: |
        PHP-compatible session cookie issued by `/auth/login`. The
        cookie name `user` is the one RS reads (include/authenticate.php),
        which is why we keep it for now; rename happens once PHP is
        fully retired.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: aa_pat
      description: |
        Personal Access Token, format `aa_pat_<32 chars>`. Issued via
        `POST /auth/tokens`. Send as `Authorization: Bearer aa_pat_...`.
  schemas:
    AssetType:
      type: object
      required: [ref]
      properties:
        ref:
          type: integer
          format: int64
          description: Primary key
          example: 1
        name:
          type: string
          nullable: true
          example: Photo
        allowed_extensions:
          type: string
          nullable: true
          description: |
            Comma-separated list of file extensions accepted for this
            resource type. Null means "use the system default."
          example: jpg,jpeg,png,gif
        order_by:
          type: integer
          format: int64
          nullable: true
          description: Display order, ascending. Null sorts last.
        icon:
          type: string
          nullable: true
          description: Lucide icon name shown in UI
          example: image
        colour:
          type: integer
          format: int64
          nullable: true
        tab:
          type: integer
          format: int64
          nullable: true
          description: Resource-type tab grouping in the admin UI
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error summary
          example: could not list resource types
    BrushPackStamp:
      type: object
      required: [id, width, height, spacing, align_to_path]
      description: |
        One brush stamp in a pack. The bitmap itself is fetched via
        `/brush-packs/stamps/{id}` — this schema is the metadata the
        frontend renderer needs to know how to draw with it.
      properties:
        id:
          type: string
          format: uuid
          description: Stable per-stamp identifier.
        label:
          type: string
          nullable: true
          description: Optional human-readable name (from the ABR descriptor).
        width:
          type: integer
          description: Stamp bitmap width in source pixels.
        height:
          type: integer
          description: Stamp bitmap height in source pixels.
        spacing:
          type: number
          format: double
          minimum: 0
          maximum: 10
          description: |
            Step between successive stamps as a fraction of the
            effective stamp diameter. GIMP / Photoshop convention:
            0.1 = smooth (default), 1.0 = stamps just touch, >1 =
            sparse stippling.
        align_to_path:
          type: boolean
          description: When true, the stamp rotates to follow the stroke tangent.
        size_jitter:
          type: number
          format: double
          nullable: true
          description: 0..1 random size perturbation per stamp.
        opacity_jitter:
          type: number
          format: double
          nullable: true
        angle_jitter:
          type: number
          format: double
          nullable: true
          description: 0..360 degrees random angle perturbation.
    BrushPack:
      type: object
      required: [id, name, created_at, stamps]
      description: |
        Imported or authored brush pack owned by the caller. Includes
        the full stamp manifest so the frontend has everything it
        needs in one request.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        source_file:
          type: string
          nullable: true
          description: Original .abr filename, when imported.
        created_at:
          type: string
          format: date-time
        stamps:
          type: array
          items: { $ref: "#/components/schemas/BrushPackStamp" }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          format: password
        provider:
          type: string
          description: |
            Name of the identity provider to authenticate against.
            Defaults to "password" (the built-in flow). Enterprise
            installs can name a registered LDAP provider ("ldap" or
            a per-server alias like "ldap-engineering"). Requests
            naming an unregistered provider get 401 — same shape as
            a bad password, so a probing client can't enumerate
            which enterprise providers are active.
          example: password
    IdentityProviderSummary:
      type: object
      description: |
        Public projection of a registered identity provider — what
        the login screen renders. No license-feature flag is
        surfaced here; the mere presence of an entry implies the
        install holds the matching feature.
      required: [name, display_name, kind, supports_password]
      properties:
        name:
          type: string
          description: Stable registry identifier (POST /auth/login `provider` field).
        display_name:
          type: string
          description: Human-readable label rendered on the login screen.
        kind:
          type: string
          description: |
            Provider kind — "password", "ldap", or "saml". Determines
            which login UI the frontend renders (form vs. redirect
            button).
          enum: [password, ldap, saml]
        supports_password:
          type: boolean
          description: |
            True when the provider accepts username + password via
            POST /auth/login. False for redirect-flow providers
            (SAML) — those use kind-specific endpoints.
    IdentityProviderList:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: "#/components/schemas/IdentityProviderSummary" }
    SetupStatus:
      type: object
      required: [needs_setup, deployment, defaults]
      properties:
        needs_setup:
          type: boolean
          description: True when no user with the `system.admin` capability exists.
        deployment:
          $ref: "#/components/schemas/SetupDeploymentInfo"
        defaults:
          $ref: "#/components/schemas/SetupDefaults"
    SetupDeploymentInfo:
      type: object
      required: [db_host, db_port, db_name, storage_backend]
      description: |
        Read-only view of how the running process was configured at
        boot. Shown on the setup page so the admin can confirm the
        installation target before creating an admin account.
      properties:
        db_host:        { type: string, example: postgres }
        db_port:        { type: integer, example: 5432 }
        db_name:        { type: string, example: artist_alley }
        storage_backend: { type: string, example: fs, description: "fs | s3" }
    SetupDefaults:
      type: object
      description: |
        Prefills harvested from `AA_SETUP_DEFAULT_*` env vars at boot.
        Empty strings mean "no prefill"; the form leaves those fields
        blank.
      required:
        [admin_username, admin_email, admin_fullname,
         site_name, site_base_url,
         smtp_host, smtp_port, smtp_encryption, smtp_username, smtp_from_address]
      properties:
        admin_username:  { type: string }
        admin_email:     { type: string }
        admin_fullname:  { type: string }
        site_name:       { type: string, example: artist-alley }
        site_base_url:   { type: string }
        smtp_host:       { type: string }
        smtp_port:       { type: integer, example: 587 }
        smtp_encryption: { type: string, enum: [none, starttls, tls], example: starttls }
        smtp_username:   { type: string }
        smtp_from_address: { type: string }
    SetupCompleteRequest:
      type: object
      required: [admin, site]
      properties:
        admin: { $ref: "#/components/schemas/InitialAdminRequest" }
        site:  { $ref: "#/components/schemas/SiteConfig" }
        smtp:
          nullable: true
          allOf: [ { $ref: "#/components/schemas/SMTPConfig" } ]
    InitialAdminRequest:
      type: object
      required: [username, password, email]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 50
          example: admin
        password:
          type: string
          format: password
          minLength: 8
        email:
          type: string
          format: email
          example: admin@example.com
        fullname:
          type: string
          nullable: true
          example: Site Administrator
    SiteConfig:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Acme Art Reviews
        base_url:
          type: string
          description: |
            Absolute URL the site is reachable at. Used to build
            outgoing links (e.g., password-reset emails). May be empty
            at install time and filled in later.
          example: https://art.example.com
    SMTPConfig:
      type: object
      required: [host, port, encryption, from_address]
      properties:
        host: { type: string, example: smtp.example.com }
        port: { type: integer, example: 587 }
        encryption:
          type: string
          enum: [none, starttls, tls]
          example: starttls
        username: { type: string }
        password: { type: string, format: password }
        from_address:
          type: string
          example: "ArtSite <noreply@example.com>"
    AuthConfig:
      type: object
      description: |
        Authentication + SSO configuration. Persisted under the
        sysconfig key `auth`. The password policy applies only to
        local accounts; SSO logins are validated by the upstream
        identity provider. SSO providers are STORED here but not yet
        USED at login time — enforcement lands in a follow-up phase.
      required: [password_policy, sso_providers]
      properties:
        password_policy:
          type: object
          required: [min_length, require_upper, require_number, require_symbol, disallow_common, max_age_days]
          properties:
            min_length:     { type: integer, minimum: 0, maximum: 256, default: 0 }
            require_upper:  { type: boolean, default: false }
            require_number: { type: boolean, default: false }
            require_symbol: { type: boolean, default: false }
            disallow_common:
              type: boolean
              default: false
              description: Reject common-password list ("password", "123456", ...).
            max_age_days:
              type: integer
              minimum: 0
              maximum: 36500
              default: 0
              description: 0 = passwords never expire.
        sso_providers:
          type: array
          items:
            type: object
            required: [kind, enabled, display_name]
            properties:
              id:
                type: string
                description: |
                  Stable identifier assigned by the admin UI on create.
                  Empty on a freshly-added provider; the handler fills
                  it in. Used as OAuth `state` and as the row key for
                  later edits.
              kind:
                type: string
                enum: [ldap, saml, google, github, x]
              enabled:     { type: boolean }
              display_name: { type: string }
              config:
                type: object
                additionalProperties: true
                description: |
                  Per-kind opaque config. For LDAP: server URL, base
                  DN, bind credentials, search filter. For SAML: IdP
                  metadata URL, SP entity ID, certs. For OAuth
                  (Google/GitHub/X): client_id, client_secret,
                  redirect_uri, scopes. Validated at use time by the
                  integration code, not by this endpoint.
    AIConfig:
      type: object
      description: |
        AI provider configuration. Persisted under the sysconfig key
        `ai`. API keys are stored as plain strings for now (admin-
        only table; never federated); a secrets-backend migration is
        planned.
      required: [providers]
      properties:
        default_provider_id:
          type: string
          description: |
            Picks the `providers[*].id` used when nothing else
            specifies. Empty = no default (callers must choose, or
            AI features stay disabled).
        providers:
          type: array
          items:
            type: object
            required: [kind, enabled, display_name]
            properties:
              id:           { type: string }
              kind:
                type: string
                enum: [openai, anthropic, google, local]
              enabled:      { type: boolean }
              display_name: { type: string }
              model:        { type: string, description: "e.g. gpt-4o, claude-sonnet-4-6" }
              base_url:
                type: string
                description: Override for self-hosted / proxied endpoints.
              api_key:
                type: string
                description: |
                  Raw API key (interim — will move to a secrets
                  backend reference). Sent and stored as-is.
              config:
                type: object
                additionalProperties: true
                description: |
                  Per-kind opaque config (temperature defaults,
                  system prompts, rate limits, ...). Integration code
                  owns the schema.
    AppearanceConfig:
      type: object
      description: |
        Per-install brand and typography choices. Each field holds a
        font catalogue ID (e.g. `limelight`, `inter-variable`,
        `system-sans`); the frontend resolves the ID to an
        `@font-face` declaration at boot. Empty string means the slot
        uses the frontend's default.
      properties:
        brand_font:
          type: string
          description: |
            Logo / hero font slot. Recommended for display faces
            (Limelight, Bebas Neue, Playfair Display); body text never
            uses this slot.
        display_font:
          type: string
          description: |
            H1–H3 heading slot. Falls back to the body font when empty.
        body_font:
          type: string
          description: |
            Body / UI text slot. Falls back to the system sans-serif
            stack when empty.
        mono_font:
          type: string
          description: |
            Code / tabular numerics slot. Falls back to the system
            monospace stack when empty.
    Locale:
      type: object
      description: |
        One UI locale the frontend has a catalogue for. Used by the
        language picker. `completion_pct` is the share of source-of-
        truth (en) keys translated — useful for showing "(70%)"
        beside a locale name so users know it's incomplete.
      required: [code, name, native_name, completion_pct]
      properties:
        code:
          type: string
          description: IETF BCP47 tag (e.g. "en", "es-AR").
        name:
          type: string
          description: English name (e.g. "Spanish (Argentina)").
        native_name:
          type: string
          description: Endonym (e.g. "Español (Argentina)").
        region:
          type: string
          description: Optional regional sub-tag (e.g. "AR").
        completion_pct:
          type: integer
          minimum: 0
          maximum: 100
          description: 0..100 — share of en keys this catalogue translates.
    CurrentUser:
      type: object
      required: [ref, username, auth_method]
      properties:
        ref:
          type: integer
          format: int64
        username:
          type: string
        fullname:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        usergroup:
          type: integer
          format: int64
          nullable: true
        auth_method:
          type: string
          enum: [session, token]
          description: How the caller was authenticated for this request.
        language:
          type: string
          description: |
            User's language pref (BCP47). Empty string = follow system /
            browser. Joined from user_profiles at /auth/me time so the
            frontend can hydrate the language store on first paint
            without a separate round-trip.
        theme:
          type: string
          enum: ['', 'light', 'dark']
          description: |
            User's theme pref. Empty string = follow system. Same
            "join on /auth/me" rationale as `language`.
    ApiTokenSummary:
      type: object
      required: [id, name, created_at, scopes]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
    ApiTokenCreated:
      allOf:
        - $ref: "#/components/schemas/ApiTokenSummary"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: |
                The plaintext token. Save it — it is never returned again.
              example: aa_pat_K7eHs0bdQ9XR8h0g7y4mR0aZ2lY1pX5N
    Capability:
      type: object
      required: [code, description]
      properties:
        code:
          type: string
          description: Atomic capability identifier (e.g., "users.read").
          example: users.read
        description:
          type: string
    Role:
      type: object
      required: [id, name, description, capabilities]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: Single-inheritance parent role; null for root roles.
        capabilities:
          type: array
          items:
            type: string
          description: |
            Capability codes attached directly to this role. Does NOT
            include inherited capabilities — chase parent_id to get the
            full set, or call `/auth/me/capabilities` for the resolved
            view of the current user.
    EffectiveCapabilities:
      type: object
      required: [user_ref, capabilities]
      properties:
        user_ref:
          type: integer
          format: int64
        role:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Role"
        capabilities:
          type: array
          items:
            type: string
          description: |
            The resolved capability set: (role chain capabilities)
            UNION (explicit grants) EXCEPT (explicit revokes). What
            middleware checks against when enforcing
            x-required-capabilities.
        grants:
          type: array
          items:
            type: string
          description: Capabilities granted explicitly to this user.
        revokes:
          type: array
          items:
            type: string
          description: Capabilities revoked explicitly from this user.
    SetUserRoleRequest:
      type: object
      required: [role_id]
      properties:
        role_id:
          type: string
          format: uuid
    FieldDefinition:
      type: object
      required: [id, code, label, type, required, searchable, applies_to, display_order, display_group, status, created_at, updated_at]
      properties:
        id:           { type: string, format: uuid }
        code:         { type: string, description: "Federation-stable slug. Globally unique." }
        label:        { type: string }
        description:  { type: string }
        type:
          type: string
          enum: [text, longtext, rich_text, number, boolean, date, datetime, select, multi_select, tree, reference]
        options:
          type: object
          additionalProperties: true
          description: "Type-dependent constraints / values. Shape per ADR 0012."
        required:     { type: boolean }
        searchable:   { type: boolean }
        applies_to:
          type: array
          items: { type: integer, format: int64 }
          description: "Resource type refs this field applies to. Empty = all."
        field_set_id:    { type: string, format: uuid, nullable: true }
        read_capability: { type: string, nullable: true }
        write_capability: { type: string, nullable: true }
        display_order:   { type: integer }
        display_group:   { type: string }
        source:
          type: object
          additionalProperties: true
          nullable: true
          description: "Auto-extraction source, e.g. {\"type\":\"exif\",\"tag\":\"DateTimeOriginal\"}."
        status:
          type: string
          enum: [active, deprecated, archived]
        deprecated_replacement_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FieldDefinitionCreate:
      type: object
      required: [code, label, type]
      properties:
        code:          { type: string, minLength: 1, maxLength: 64, pattern: "^[a-z][a-z0-9_]*$" }
        label:         { type: string, minLength: 1, maxLength: 200 }
        description:   { type: string }
        type:
          type: string
          enum: [text, longtext, rich_text, number, boolean, date, datetime, select, multi_select, tree, reference]
        options:       { type: object, additionalProperties: true }
        required:      { type: boolean, default: false }
        searchable:    { type: boolean, default: true }
        applies_to:
          type: array
          items: { type: integer, format: int64 }
        field_set_id:    { type: string, format: uuid, nullable: true }
        read_capability: { type: string, nullable: true }
        write_capability: { type: string, nullable: true }
        display_order:   { type: integer, default: 100 }
        display_group:   { type: string, default: general }
        source:          { type: object, additionalProperties: true, nullable: true }
    FieldDefinitionUpdate:
      type: object
      description: "Partial update; only present fields are touched."
      properties:
        label:         { type: string, minLength: 1, maxLength: 200 }
        description:   { type: string }
        options:       { type: object, additionalProperties: true }
        required:      { type: boolean }
        searchable:    { type: boolean }
        applies_to:
          type: array
          items: { type: integer, format: int64 }
        field_set_id:    { type: string, format: uuid, nullable: true }
        read_capability: { type: string, nullable: true }
        write_capability: { type: string, nullable: true }
        display_order:   { type: integer }
        display_group:   { type: string }
        source:          { type: object, additionalProperties: true, nullable: true }
        status:
          type: string
          enum: [active, deprecated, archived]
        deprecated_replacement_id: { type: string, format: uuid, nullable: true }
    AssetFieldValue:
      type: object
      required: [field_id, field_code, type, set_by, set_at]
      description: "One field value as seen on an asset."
      properties:
        field_id:    { type: string, format: uuid }
        field_code:  { type: string }
        field_label: { type: string }
        type:
          type: string
          enum: [text, longtext, rich_text, number, boolean, date, datetime, select, multi_select, tree, reference]
        value_text:    { type: string, nullable: true }
        value_num:     { type: number, nullable: true }
        value_date:    { type: string, format: date-time, nullable: true }
        value_options:
          type: array
          items: { type: string }
          nullable: true
        value_ref:     { type: string, format: uuid, nullable: true }
        set_by:
          type: string
          enum: [manual, exif, iptc, xmp, api, import, computed]
        set_at:       { type: string, format: date-time }
        set_by_user_ref: { type: integer, format: int64, nullable: true }
    AssetFieldValueWrite:
      type: object
      description: |
        Pass whichever value_* field matches the target field's type.
        The handler validates against field_definition.type and
        rejects mismatches with 400.
      properties:
        value_text:    { type: string, nullable: true }
        value_num:     { type: number, nullable: true }
        value_date:    { type: string, format: date-time, nullable: true }
        value_options:
          type: array
          items: { type: string }
          nullable: true
        value_ref:     { type: string, format: uuid, nullable: true }
        set_by:
          type: string
          enum: [manual, exif, iptc, xmp, api, import, computed]
          default: manual
    FieldValueHistoryEntry:
      type: object
      required: [id, asset_id, field_id, changed_at, set_by]
      properties:
        id:                 { type: string, format: uuid }
        asset_id:           { type: string, format: uuid }
        field_id:           { type: string, format: uuid }
        old_value:          { type: object, additionalProperties: true, nullable: true }
        new_value:          { type: object, additionalProperties: true, nullable: true }
        changed_at:         { type: string, format: date-time }
        changed_by_user_ref: { type: integer, format: int64, nullable: true }
        set_by:             { type: string }
    Collection:
      type: object
      description: |
        A user-owned collection of assets, per ADR 0009. UUID-keyed,
        federation-prepared (`origin_server_id`), with three
        orthogonal axes: visibility, membership, and lifecycle.
      required:
        [id, owner_user_ref, name, description, visibility, membership,
         featured, created_at, updated_at]
      properties:
        id:               { type: string, format: uuid }
        owner_user_ref:   { type: integer, format: int64 }
        name:             { type: string }
        description:      { type: string }
        visibility:
          type: string
          enum: [private, org-only, followers, explicit-share]
        membership:
          type: string
          enum: [manual, query, hybrid]
          description: |
            `manual` only for 1.11.A. `query` and `hybrid` ship in
            1.11.B once the search DSL (ADR 0010) lands.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: TTL. Null = permanent.
        featured:         { type: boolean }
        purpose:
          type: string
          nullable: true
          description: |
            Free-form admin-set hint ("for_review", "for_proofing", …).
            Replaces RS's single-purpose `archived` flag.
        origin_server_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Federation home server. Null = local. Populated when
            collections sync in from a peer in a later phase.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CollectionCreate:
      type: object
      required: [name]
      properties:
        name:        { type: string, minLength: 1, maxLength: 200 }
        description: { type: string }
        visibility:
          type: string
          enum: [private, org-only, followers, explicit-share]
          default: private
        membership:
          type: string
          enum: [manual, query, hybrid]
          default: manual
          description: |
            Only `manual` is accepted in 1.11.A; passing `query` or
            `hybrid` returns 400 until 1.11.B ships.
        expires_at:
          type: string
          format: date-time
          nullable: true
        featured:    { type: boolean, default: false }
        purpose:
          type: string
          nullable: true
    CollectionUpdate:
      type: object
      description: |
        Partial update; only present fields are touched. Pass
        `expires_at: null` to clear the TTL.
      properties:
        name:        { type: string, minLength: 1, maxLength: 200 }
        description: { type: string }
        visibility:
          type: string
          enum: [private, org-only, followers, explicit-share]
        membership:
          type: string
          enum: [manual, query, hybrid]
        expires_at:
          type: string
          format: date-time
          nullable: true
        featured:    { type: boolean }
        purpose:
          type: string
          nullable: true
    CollectionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Collection" }
        next_cursor:
          type: string
          nullable: true
          description: |
            Opaque token for the next page; omitted on the final page.
            Pass back unchanged as the `cursor` query parameter.
    CollectionResource:
      type: object
      description: |
        One asset's membership in a collection, joined with the
        asset's identifying columns so the UI can render without a
        follow-up fetch.
      required:
        [collection_id, asset_id, sort_order, pinned, added_at,
         title, asset_type, status]
      properties:
        collection_id: { type: string, format: uuid }
        asset_id:      { type: string, format: uuid }
        sort_order:    { type: integer }
        pinned:        { type: boolean }
        expires_at:
          type: string
          format: date-time
          nullable: true
        added_at:      { type: string, format: date-time }
        title:         { type: string }
        asset_type: { type: integer, format: int64 }
        status:        { type: string, enum: [draft, active, archived] }
        file_hash:
          type: string
          nullable: true
        asset_created_at: { type: string, format: date-time }
    CollectionResourceWrite:
      type: object
      required: [asset_id]
      properties:
        asset_id:    { type: string, format: uuid }
        sort_order:  { type: integer, default: 0 }
        pinned:      { type: boolean, default: true }
        expires_at:
          type: string
          format: date-time
          nullable: true
    CollectionResourceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CollectionResource" }
        next_cursor:
          type: string
          nullable: true
    Asset:
      type: object
      required: [id, title, asset_type, status, processing_status, created_at, updated_at, tags]
      properties:
        id:             { type: string, format: uuid }
        title:          { type: string }
        description:    { type: string }
        asset_type:  { type: integer, format: int64 }
        owner_user_ref: { type: integer, format: int64, nullable: true }
        status:         { type: string, enum: [draft, active, archived] }
        file_hash:      { type: string, nullable: true, description: sha256 of the linked storage object }
        file_extension: { type: string, nullable: true }
        file_size_bytes: { type: integer, format: int64, nullable: true }
        tags:
          type: array
          items: { type: string }
        metadata:
          type: object
          additionalProperties: true
          description: Free-form JSONB metadata blob (EXIF, custom fields, etc.).
        state_id:
          type: string
          format: uuid
          nullable: true
          description: Optional workflow state (domain = 'asset').
        processing_status:
          type: string
          enum: [pending, ready, failed]
          description: |
            Post-upload processing pipeline state. `pending` means
            background jobs (variant generation, EXIF extraction,
            etc.) are still in flight — the original file at /file
            is always available, but `/variants/{key}` URLs may
            404 until processing completes. `ready` is the steady
            state. `failed` surfaces in the UI as a retry affordance.
        thumbhash:
          type: string
          nullable: true
          description: |
            Base64-encoded thumbhash (~30 bytes decoded) for instant
            blurred placeholder rendering on feed cards. Computed
            synchronously at upload for image assets. NULL for
            non-image resources.
        created_at:     { type: string, format: date-time }
        updated_at:     { type: string, format: date-time }
    AssetCreate:
      type: object
      required: [title, asset_type]
      properties:
        title:          { type: string, minLength: 1, maxLength: 500 }
        description:    { type: string }
        asset_type:  { type: integer, format: int64 }
        status:
          type: string
          enum: [draft, active, archived]
          default: active
        file_hash:
          type: string
          nullable: true
          description: |
            sha256 of a previously uploaded storage object. When set,
            the storage layer is re-pinned under `asset:<new-id>` and
            the caller's `user:` pin (from the prior upload) is
            dropped.
        file_extension: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string, minLength: 1, maxLength: 64 }
        metadata:
          type: object
          additionalProperties: true
        state_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Optional workflow state. Must reference a row in
            `workflow_state` whose `domain = 'asset'`. When omitted,
            the asset is placed in the `asset` domain's initial state
            (or NULL if the domain has none).
    AssetUpdate:
      type: object
      description: |
        Partial update; only fields present are touched. Tag arrays
        REPLACE the full tag set when supplied (use the /tags
        sub-resource for additive ops).
      properties:
        title:          { type: string, minLength: 1, maxLength: 500 }
        description:    { type: string }
        status:
          type: string
          enum: [draft, active, archived]
        tags:
          type: array
          items: { type: string, minLength: 1, maxLength: 64 }
        metadata:
          type: object
          additionalProperties: true
    AssetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Asset" }
        next_cursor:
          type: string
          nullable: true
          description: |
            Pass back as the `cursor` query param to fetch the next
            page. null when the current page is the last.
    Post:
      type: object
      description: |
        Feed entity. Wraps 1+ assets with descriptive metadata. The
        `members` array is the ordered list of assets in the post;
        `cover_asset_id` is the one shown in feed/grid cards.
      required:
        [id, author_user_ref, title, description, visibility,
         posted_at, like_count, comment_count, tags, members,
         created_at, updated_at]
      properties:
        id:               { type: string, format: uuid }
        author_user_ref:  { type: integer, format: int64 }
        title:            { type: string }
        description:      { type: string }
        visibility:
          type: string
          enum: [private, org-only, followers, explicit-share]
        cover_asset_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Pointer to one of `members[].asset_id` — the chosen cover.
            Defaults to `members[0].asset_id` when not set explicitly.
        cover_thumbnail_asset_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Optional standalone thumbnail asset, NOT a member of the
            post. Used when the uploader wants a different image as
            the feed thumbnail than any of the post's assets (e.g. a
            cropped detail or an entirely separate cover image). When
            set, the feed card prefers this asset's variants over
            `cover_asset_id`.
        state_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Optional workflow state. Must reference a row in
            `workflow_state` whose `domain = 'post'`. NULL = no
            workflow tracking on this post.
        posted_at:        { type: string, format: date-time }
        like_count:       { type: integer, format: int64 }
        comment_count:    { type: integer, format: int64 }
        tags:
          type: array
          items: { type: string }
        members:
          type: array
          items: { $ref: "#/components/schemas/PostMember" }
        origin_server_id:
          type: string
          format: uuid
          nullable: true
        team_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Optional team scope (ADR 0010 Layer 5). When set, team-
            scoped capability checks apply: callers who hold
            `posts.read` scoped to this team or any ancestor team
            can see the post regardless of visibility. NULL = no
            team scope; only visibility / role / ACL gates apply.
        created_at:       { type: string, format: date-time }
        updated_at:       { type: string, format: date-time }
    PostMember:
      type: object
      description: |
        An asset attached to a post, with its sort_order in the
        carousel and the asset payload joined-in to avoid an N+1.
      required: [asset_id, sort_order, asset]
      properties:
        asset_id:    { type: string, format: uuid }
        sort_order:  { type: integer }
        asset:       { $ref: "#/components/schemas/Asset" }
    PostCreate:
      type: object
      required: [members]
      properties:
        title:        { type: string, maxLength: 500 }
        description:  { type: string }
        visibility:
          type: string
          enum: [private, org-only, followers, explicit-share]
          default: public
        cover_asset_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Defaults to members[0].asset_id when omitted.
        cover_thumbnail_asset_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Optional standalone thumbnail asset (not a post member).
            Useful for "upload a custom cover" UX in the upload modal.
        state_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Optional workflow state, domain = 'post'. When omitted the
            post is placed in the post domain's initial state, or NULL
            if no initial state is configured.
        members:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PostAssetWrite" }
        tags:
          type: array
          items: { type: string, minLength: 1, maxLength: 64 }
        collection_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Optional — when set, the new post is added to this
            collection at create time. Used by the context-aware
            upload modal: dropping into /collections/{id} sets this.
        team_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Optional — scope the post to a team. The upload modal
            will set this to the user's currently-selected team
            when one is active.
    PostUpdate:
      type: object
      description: Partial update; only present fields are touched.
      properties:
        title:        { type: string, maxLength: 500 }
        description:  { type: string }
        visibility:
          type: string
          enum: [private, org-only, followers, explicit-share]
        cover_asset_id:
          type: string
          format: uuid
          nullable: true
        cover_thumbnail_asset_id:
          type: string
          format: uuid
          nullable: true
        state_id:
          type: string
          format: uuid
          nullable: true
        tags:
          type: array
          items: { type: string, minLength: 1, maxLength: 64 }
    PostAssetWrite:
      type: object
      required: [asset_id]
      properties:
        asset_id:    { type: string, format: uuid }
        sort_order:  { type: integer, default: 0 }
    PostList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Post" }
        next_cursor:
          type: string
          nullable: true

    # ── Background-job queue schemas (Phase 1.18.A).
    Job:
      type: object
      required:
        [id, type, status, priority, attempts, max_attempts,
         enqueued_at]
      properties:
        id:               { type: string, format: uuid }
        type:             { type: string, example: preview.raster }
        payload:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [pending, running, done, failed, cancelled]
        priority:         { type: integer }
        attempts:         { type: integer }
        max_attempts:     { type: integer }
        claimed_by:       { type: string, nullable: true }
        claimed_at:       { type: string, format: date-time, nullable: true }
        lease_expires_at: { type: string, format: date-time, nullable: true }
        last_error:       { type: string, nullable: true }
        result:
          type: object
          additionalProperties: true
          nullable: true
        origin_server_id:
          type: string
          format: uuid
          nullable: true
        scheduled_for:    { type: string, format: date-time, nullable: true }
        enqueued_at:      { type: string, format: date-time }
        started_at:       { type: string, format: date-time, nullable: true }
        finished_at:      { type: string, format: date-time, nullable: true }
    JobClaim:
      type: object
      required: [id, type, payload, attempts, max_attempts, lease_seconds]
      description: |
        Trimmed view of a Job that workers actually need to execute
        the work. `lease_seconds` tells the worker how often to
        heartbeat before the watchdog reclaims the job.
      properties:
        id:            { type: string, format: uuid }
        type:          { type: string }
        payload:
          type: object
          additionalProperties: true
        attempts:      { type: integer }
        max_attempts:  { type: integer }
        lease_seconds: { type: integer }
    JobClaimRequest:
      type: object
      description: |
        Body for POST /jobs/claim. `types` is the allowlist of job
        types this worker is willing to run; omit to claim any.
        `worker_id` is a stable string the server records in
        `claimed_by` for diagnostic tracing.
      properties:
        types:
          type: array
          items: { type: string }
        limit:
          type: integer
          minimum: 1
          maximum: 25
          default: 1
        worker_id:
          type: string
          minLength: 1
          maxLength: 200
    JobClaimResponse:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items: { $ref: "#/components/schemas/JobClaim" }
    WorkerIdentity:
      type: object
      required: [worker_id]
      description: Body for heartbeat; identifies the worker holding the lease.
      properties:
        worker_id:
          type: string
          minLength: 1
          maxLength: 200
    JobCompleteRequest:
      type: object
      required: [worker_id]
      properties:
        worker_id:
          type: string
          minLength: 1
          maxLength: 200
        result:
          type: object
          additionalProperties: true
          nullable: true
    JobFailRequest:
      type: object
      required: [worker_id, error]
      properties:
        worker_id:
          type: string
          minLength: 1
          maxLength: 200
        error:
          type: string
        terminal:
          type: boolean
          default: false

    Team:
      type: object
      required: [id, slug, name, description, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        slug:
          type: string
          description: |
            URL-friendly identifier, unique per origin server. Used in
            display and (eventually) federation actor URIs.
          maxLength: 80
          example: diablo-rnd
        name:
          type: string
          maxLength: 200
          example: Diablo R&D
        description:
          type: string
          maxLength: 500
        origin_server_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Set on rows mirroring a federated team. NULL = locally
            owned.
        parents:
          type: array
          description: |
            Direct parent teams (single hop). Empty for root teams.
            Closure-walked ancestors live behind the listTeams
            `ancestor` filter; this field is just the edges out of
            the current node.
          items: { $ref: "#/components/schemas/TeamParentLink" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TeamParentLink:
      type: object
      required: [parent_id]
      properties:
        parent_id: { type: string, format: uuid }
        parent_slug: { type: string }
        parent_name: { type: string }

    TeamCreate:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 80
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 500
        parent_ids:
          type: array
          items: { type: string, format: uuid }
          description: |
            Optional list of teams to link as parents. Each insert
            fires the cycle-rejection trigger; the first one that
            would close a cycle returns 409.

    TeamUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 500

    TeamList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Team" }
        next_cursor:
          type: string
          nullable: true

    AdminUser:
      type: object
      description: |
        Admin-projection of a user row. Carries everything the
        admin list table needs — username, email, status, last
        activity, primary role — without surfacing password-bearing
        columns. `status` maps to the underlying user.approved
        column (1=active, 0=pending, 2=disabled per Phase 1.17.B's
        lifecycle state machine). `primary_role` is the user's
        alphabetically-first global role assignment; per-team
        assignments live on the user detail page.
      required: [ref, username, display_name, status, created_at]
      properties:
        ref: { type: integer, format: int64 }
        username: { type: string }
        fullname:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        display_name:
          type: string
          description: Resolved display string (profile.display_name → fullname → username).
        avatar_url:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, pending, disabled]
        primary_role:
          type: string
          description: Empty when the user has no global role assigned.
        created_at:
          type: string
          format: date-time
        last_active:
          type: string
          format: date-time
          nullable: true
        account_expires:
          type: string
          format: date-time
          nullable: true
          description: Hard expiry enforced at login; null = no expiry.
        auth_origin:
          type: string
          nullable: true
          description: |
            Login provider for this user — empty / null = native, else
            'simpleldap' / 'simplesaml' / etc. once Phase 1.17.O wires
            the enterprise SSO surfaces. Surfaced here so the admin
            list can show the auth-source badge.
        profile_origin_server_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Federation origin (when the profile row came from a peer
            instance). Null = home instance. See ADR 0007.

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          description: The caller's current password — verified before the change is accepted.
        new_password:
          type: string
          description: The new password. Must satisfy the system password policy.
        revoke_other_sessions:
          type: boolean
          description: |
            When true, every session belonging to the caller EXCEPT
            the one authenticating this request is revoked. Defensive
            default for "I think someone got my password" recovery
            flows. Defaults to true client-side; the server doesn't
            assume either way (omitting the field = false).

    ChangePasswordResult:
      type: object
      required: [changed_at]
      properties:
        changed_at:
          type: string
          format: date-time
        sessions_revoked:
          type: integer
          description: Count of other sessions ended as part of this change.

    UserPreferencesViews:
      type: object
      description: |
        Default-view selections (Phase 1.17.G). Unset fields fall back
        to per-route defaults at render time. Adding a new view knob
        is a string-additive change; the valid value sets grow as new
        layouts ship in later phases.
      properties:
        home_tab:
          type: string
          description: |
            Which tab the home page lands on. Valid values today:
            `following`, `latest`, `trending`, `for_you`. Empty/unset
            falls back to `latest`.
        browse_layout:
          type: string
          description: |
            Default browse-feed layout. Valid values today: `grid`,
            `masonry`, `thumbnail`, `list`. Empty/unset falls back to
            the route's default.
        browse_sort:
          type: string
          description: |
            Default browse-feed sort. Valid values today: `newest`,
            `oldest`, `popular`, `trending`. Empty/unset falls back
            to the route's default.

    UserPreferencesRequest:
      type: object
      description: |
        PATCH-time payload for the per-user preferences row. Wire
        contract is full-object replacement; field-level merge is
        NOT supported. Both fields are optional — an absent
        `notification_channels` clears the user's overrides, an
        absent `default_views` clears the view selections.
      properties:
        notification_channels:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: |
            Map from event-type key to channel list. Unknown event
            types or unknown channel names trigger a 400. An empty
            array MEANS "deliver nothing for this event" and
            overrides the system default; an absent key means
            "use system default."
        default_views:
          $ref: "#/components/schemas/UserPreferencesViews"

    UserPreferencesResponse:
      type: object
      description: |
        GET / PATCH response for per-user preferences (Phase 1.17.G).
        Includes the build's known event-type + channel catalogs so
        the UI renders toggle grids without hard-coding the lists
        client-side. Per-event system defaults are surfaced so the UI
        can show "follows system default — in_app only" hints
        alongside each toggle.
      required:
        - notification_channels
        - default_views
        - known_event_types
        - known_channels
        - default_channels_by_event
      properties:
        notification_channels:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        default_views:
          $ref: "#/components/schemas/UserPreferencesViews"
        known_event_types:
          type: array
          items: { type: string }
          description: |
            Canonical ordered list of notification event types this
            build knows about. Order is the recommended rendering
            order in the UI.
        known_channels:
          type: array
          items: { type: string }
          description: |
            Canonical channel names this build supports
            (`in_app`, `email`, future: `sms`, `push`, `webhook`).
        default_channels_by_event:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: |
            Per-event-type system default channel list. Applied at
            notification-write time when the user's
            `notification_channels` doesn't have that key.

    AdminPasswordResetRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          description: |
            Admin-supplied justification recorded in the audit log.
            Encouraged but not required — an empty reason still
            produces an audit row.

    AdminPasswordResetResult:
      type: object
      required: [temporary_password, generated_at]
      properties:
        temporary_password:
          type: string
          description: |
            Plaintext one-shot password — returned ONCE so the admin
            can share it with the user. The server stores only the
            hash; this value is never reachable again from any API.
            Generators must use a cryptographically strong RNG; this
            response should be considered as sensitive as the
            hash-bearing original.
        generated_at:
          type: string
          format: date-time

    SessionRow:
      type: object
      description: |
        One active session (Phase 1.17.C). The IP + user-agent are
        best-effort observability captured at login; both can be null
        when behind a proxy that strips them. `current` is true only
        on the self-service endpoint for the row that's authenticating
        the request — the UI uses it to hide its own revoke button.
      required: [id, created_at, last_used_at]
      properties:
        id: { type: string, format: uuid }
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        ip:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        current:
          type: boolean
          description: |
            True only on /account/sessions for the session that
            authenticated the request. Omitted on the admin
            equivalent.

    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SessionRow" }

    AdminUserStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, pending, disabled]
        reason:
          type: string
          maxLength: 500
          description: |
            Free-text justification recorded in the audit log alongside
            the before/after pair. Encouraged but not required — an
            empty reason still produces an audit row.

    AdminUserStatusResult:
      type: object
      required: [ref, status, changed]
      properties:
        ref:
          type: integer
          format: int64
        status:
          type: string
          enum: [active, pending, disabled]
        previous_status:
          type: string
          enum: [active, pending, disabled]
        changed:
          type: boolean
          description: |
            False when the target status equals the current status (the
            handler short-circuits the write but still returns 200 so
            idempotent automation doesn't trip on a no-op).

    AdminUserList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminUser" }
        total:
          type: integer
          format: int64
          description: Total rows matching the q + status filter (cursor-independent).
        next_cursor:
          type: string
          nullable: true
          description: |
            Opaque pagination token. Pass back as the next request's
            `cursor` param to fetch the following page. Null when this
            response is the final page.

    UserCapabilityOverride:
      type: object
      description: |
        One row from either `user_capability_grants` or
        `user_capability_revokes` (Phase 1.17.F). `team_id` is null
        for global overrides, set for team-scoped ones. `note` is the
        admin-supplied justification recorded at grant/revoke time.
      required: [capability, granted_at]
      properties:
        capability:
          type: string
        team_id:
          type: string
          format: uuid
          nullable: true
        note:
          type: string
          description: Free-text justification — empty when none was supplied.
        granted_by:
          type: integer
          format: int64
          nullable: true
          description: |
            Acting admin's rs_user_id at time of grant/revoke. Null
            when the row predates Phase 1.17.F or was inserted by
            seed migration.
        granted_at:
          type: string
          format: date-time

    UserCapabilityOverrides:
      type: object
      description: |
        Per-user explicit GRANT + REVOKE override lists. Role-derived
        capabilities are NOT included — admins manage those through
        the role editor; this surface only exposes the additive /
        subtractive deltas attached directly to the user.
      required: [grants, revokes]
      properties:
        grants:
          type: array
          items: { $ref: "#/components/schemas/UserCapabilityOverride" }
        revokes:
          type: array
          items: { $ref: "#/components/schemas/UserCapabilityOverride" }

    UserCapabilityOverrideRequest:
      type: object
      description: |
        Body shared by POST /admin/users/{ref}/grants and POST
        /admin/users/{ref}/revokes. Pass `team_id` to scope the
        override to a team — omit / null for a global override.
      required: [capability]
      properties:
        capability:
          type: string
          description: Capability code (e.g. `assets.read`, `users.write`).
        team_id:
          type: string
          format: uuid
          nullable: true
        note:
          type: string
          maxLength: 500
          description: Optional admin-supplied justification recorded with the row.

    LicenseStatus:
      type: object
      description: |
        License snapshot returned by GET /admin/license/status
        (Phase 1.17.O). `loaded: false` means no .lic file is
        installed and the artist-alley app is running in community
        mode — community defaults apply, no license-server
        interaction needed.

        `days_until_expiry` is derived (0 in community mode;
        negative when expired). Nullable cap fields (`seats`,
        `asset_cap`) → null = unlimited. Nullable temporal /
        identity fields are simply omitted in community mode.
      required: [loaded, tier, features, days_until_expiry, org_binding_required, org_bound]
      properties:
        loaded:
          type: boolean
          description: True when a real .lic file is mounted + verified. False = community mode.
        tier:
          type: string
          description: |
            "community" (unlicensed default) | "pro" | "enterprise" |
            "complementary" | "plugin" | "custom".
        features:
          type: array
          items: { type: string }
        owner:
          type: string
          description: License owner email — surfaced for support routing.
        org:
          type: string
          description: Organization slug — same value across federated peers.
        lid:
          type: string
          description: License id (ULID); surface in support tickets.
        seats:
          type: integer
          format: int64
          nullable: true
          description: Max concurrent active seats; null = unlimited.
        seat_window_days:
          type: integer
          description: Rolling window for "active seat" counting.
        asset_cap:
          type: integer
          format: int64
          nullable: true
          description: Asset cap (primary assets only); null = unlimited.
        nbf:
          type: string
          format: date-time
          description: Not-before timestamp (RFC3339).
        exp:
          type: string
          format: date-time
          description: Expiry timestamp.
        iat:
          type: string
          format: date-time
          description: Issued-at timestamp.
        days_until_expiry:
          type: integer
          description: |
            Whole days until license expires. Negative when expired.
            Zero in community mode (no expiry).
        last_error:
          type: string
          description: |
            Last verification error if the loaded license failed
            (e.g. expired, wrong issuer). Surfaced verbatim in the
            admin UI so operators can react.
        iss:
          type: string
          description: |
            Issuer string baked into the license — admins can
            confirm the .lic came from the canonical authority.
        path:
          type: string
          description: |
            Filesystem path the verifier loaded the .lic from.
            Useful for diagnostics + support.
        org_binding_required:
          type: boolean
          description: |
            True when the loaded license declares an `org_pubkey`
            claim — the customer must hold the matching org.key
            seed file on disk for the license to activate. False for
            community / trial / dev licenses that opted out of
            cross-binding at issuance time.
        org_bound:
          type: boolean
          description: |
            True when the install satisfies cross-binding — either
            because `org_binding_required` is false (no binding to
            satisfy), or because the on-disk org.key derives to a
            public key matching the license's `org_pubkey`. The
            cap-enforcement layer only treats the license as active
            when this is true.
        org_binding_error:
          type: string
          description: |
            Human-readable reason cross-binding failed when
            `org_binding_required` is true and `org_bound` is false.
            One of: "org.key missing", "org.key malformed", "org.key
            does not match license org_pubkey".
        org_key_path:
          type: string
          description: |
            Filesystem path the verifier consults for the org.key
            seed. Echoed back to the admin UI so operators see
            exactly where to drop the file when cross-binding fails.

    LicenseUploadRequest:
      type: object
      description: |
        Payload for POST /admin/license/validate and
        POST /admin/license/upload (Phase 1.17.O-2). Carries the
        verbatim .lic envelope text — BEGIN/END markers, key:
        value fields, signature field — exactly as the customer
        downloaded it.
      required: [license_text]
      properties:
        license_text:
          type: string
          minLength: 32
          maxLength: 65536
          description: |
            Full .lic file body including the BEGIN/END markers.
            Whitespace + line wrapping are tolerated by the
            verifier.

    LicenseValidateError:
      type: object
      description: |
        Structured 400 response from /admin/license/validate +
        /admin/license/upload. `code` is a stable machine-readable
        token the UI can switch on for i18n; `message` is the raw
        verifier error string for diagnostics.
      required: [error, code, message]
      properties:
        error:
          type: string
          description: Human-readable summary (constant "license validation failed").
        code:
          type: string
          description: |
            Stable token for UI branching. One of:
            `bad_envelope`, `bad_signature`, `expired`,
            `not_yet_valid`, `unknown_publisher_key`,
            `wrong_issuer`, `chain_expired`, `chain_bad_signature`,
            `chain_scope`, `chain_kid_mismatch`,
            `org_key_missing`, `org_key_bad_format`,
            `org_key_mismatch`, `unknown`.
        message:
          type: string
          description: Raw verifier error string for diagnostics.

    AuditEvent:
      type: object
      description: |
        One row from audit_events (Phase 1.17.K). `metadata` is the
        typed JSONB blob whose shape varies per event_type — see
        app/internal/audit/events.go for the per-type schemas. The
        UI renders well-known event types as structured changesets
        ("active → disabled", etc.) and falls back to JSON dump for
        the rest.
      required: [id, event_type, occurred_at, metadata]
      properties:
        id:
          type: string
          format: uuid
        event_type:
          type: string
        occurred_at:
          type: string
          format: date-time
        subject_user_ref:
          type: integer
          format: int64
          nullable: true
        actor_user_ref:
          type: integer
          format: int64
          nullable: true
        ip:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          description: Typed per event_type — see audit/events.go.

    AuditEventList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        total:
          type: integer
          format: int64
          description: Total rows matching the filter (cursor-independent).
        next_cursor:
          type: string
          nullable: true

    UserPublic:
      type: object
      description: |
        Merged user + profile view. `display_name` is the resolved
        display string (profile.display_name → user.fullname →
        user.username, first non-empty). `avatar_url` is null for
        users without an uploaded avatar; the frontend renders a
        generated initials disc in that case.
      required:
        [ref, username, display_name, member_since, post_count]
      properties:
        ref: { type: integer, format: int64 }
        username: { type: string }
        fullname:
          type: string
          nullable: true
          description: |
            The raw user.fullname value, for the rare case a caller
            needs the unresolved string (account settings page). Most
            UI surfaces should use display_name instead.
        display_name:
          type: string
          description: |
            Resolved display string ready to render — never empty.
        bio: { type: string }
        avatar_url:
          type: string
          nullable: true
        location: { type: string }
        website_url:
          type: string
          format: uri
          nullable: true
        social_links:
          type: object
          additionalProperties: { type: string }
          description: |
            Free-form platform → handle map. Frontend renders known
            platforms (twitter, instagram, artstation, ...) as icon
            links; unknown keys are ignored.
        language:
          type: string
          description: |
            IETF BCP47 language tag (e.g. "en", "es-AR"). Empty string
            = "use system / browser default". Drives the i18n
            switcher in the user menu.
        theme:
          type: string
          enum: ['', 'light', 'dark']
          description: |
            UI theme preference. Empty string = follow system / OS.
            Persisted alongside the profile so it follows the user
            across browsers.
        member_since: { type: string, format: date-time }
        post_count:
          type: integer
          format: int64
          description: Total live posts authored by this user.
        origin_server_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Set on profiles mirroring a remote site's user. NULL =
            locally-owned account.

    UserProfileUpdate:
      type: object
      description: |
        PATCH semantics — only present fields are updated, but the
        schema treats each field as the new full value (no JSON
        Merge Patch nested ops). Clearing a field is sending an
        empty string (for text) or null (for nullable URLs).
      properties:
        display_name:
          type: string
          nullable: true
          maxLength: 100
        bio:
          type: string
          maxLength: 1000
        avatar_url:
          type: string
          nullable: true
          maxLength: 1024
        location:
          type: string
          maxLength: 100
        website_url:
          type: string
          nullable: true
          format: uri
          maxLength: 500
        social_links:
          type: object
          additionalProperties:
            type: string
            maxLength: 100
        language:
          type: string
          maxLength: 35
          description: |
            BCP47 tag, or empty string to reset to "system default".
            Validated only loosely server-side — frontend constrains
            the picker to a known list.
        theme:
          type: string
          enum: ['', 'light', 'dark']
          description: |
            Empty string resets the pref to "follow system".

    PostLikeState:
      type: object
      required: [liked]
      properties:
        liked: { type: boolean }

    SocialUserSummary:
      type: object
      description: |
        Compact user-card projection used by the follow/follower
        lists. Smaller than UserPublic — only the fields the card
        renders. Phase 1.17.G2.
      required: [ref, username]
      properties:
        ref: { type: integer, format: int64 }
        username: { type: string }
        display_name: { type: string, nullable: true }
        avatar_url: { type: string, nullable: true }
        since:
          type: string
          format: date-time
          description: |
            When this edge was created. For follower lists, when the
            user started following the subject. For block lists, when
            the block was recorded.

    SocialUserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/SocialUserSummary" }

    UserRelationship:
      type: object
      description: |
        Phase 1.17.G2 — caller's relationship with the target user.
        Profile pages consume this in one round-trip to decide which
        Follow/Unfollow/Block/Unblock button(s) to render. `is_self`
        short-circuits all the other flags.
      required:
        - is_self
        - is_following
        - is_followed_by
        - is_blocked_by_me
        - is_blocked_by_them
      properties:
        is_self:
          type: boolean
          description: True when the caller IS the target — UI hides social buttons.
        is_following:
          type: boolean
          description: Caller follows target.
        is_followed_by:
          type: boolean
          description: Target follows caller.
        is_blocked_by_me:
          type: boolean
          description: Caller has blocked target. Implies social hide on both sides.
        is_blocked_by_them:
          type: boolean
          description: Target has blocked caller. Implies social hide on both sides.

    BlockUserRequest:
      type: object
      description: Phase 1.17.G2 — optional reason recorded with the block.
      properties:
        reason:
          type: string
          maxLength: 500
          description: |
            Private note visible only to the blocker in
            /account/blocked. Surfaced verbatim. Empty/omitted is
            fine — most blocks don't carry a reason.

    BlockedUserSummary:
      type: object
      required: [ref, username, since]
      properties:
        ref: { type: integer, format: int64 }
        username: { type: string }
        display_name: { type: string, nullable: true }
        avatar_url: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        since:
          type: string
          format: date-time

    BlockedUserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/BlockedUserSummary" }

    Notification:
      type: object
      description: |
        One row from the per-user notifications feed (Phase 1.17.I2).
        verb matches one of the userprefs.KnownEventTypes strings.
        target_kind + target_id form a polymorphic reference into
        whatever entity the notification is about (e.g. target_kind=
        "post", target_id=<uuid>); the frontend renderer keys on verb
        + target_kind to build the right card.
      required:
        - id
        - verb
        - delivered_at
        - created_at
      properties:
        id: { type: string, format: uuid }
        actor_user_ref:
          type: integer
          format: int64
          nullable: true
          description: |
            User whose action triggered the notification. NULL for
            system-generated events (license expiry, broadcast).
        actor_username:
          type: string
          nullable: true
          description: Denormalized for inbox render — no second round-trip.
        actor_display_name:
          type: string
          nullable: true
        actor_avatar_url:
          type: string
          nullable: true
        verb:
          type: string
          description: |
            Event-type identifier. One of userprefs.KnownEventTypes.
            Frontend i18n keys are `notifications.verb_<verb>`.
        target_kind:
          type: string
          nullable: true
          description: |
            Type discriminator for the polymorphic target (post,
            comment, asset, user, collection, license, request).
        target_id:
          type: string
          nullable: true
          description: |
            ID of the target entity. UUID-typed entities stringify;
            BIGINT-typed entities stringify too. Frontend resolves
            via target_kind.
        payload:
          type: object
          additionalProperties: true
          description: |
            Per-verb extra context (comment excerpt, license kid,
            request reason, etc.). Schema documented per-verb in
            app/internal/notifications/events.go.
        read_at:
          type: string
          format: date-time
          nullable: true
          description: NULL = unread.
        delivered_at:
          type: string
          format: date-time
          description: When the row landed (in-app delivery time).
        created_at:
          type: string
          format: date-time

    NotificationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        next_cursor:
          type: string
          nullable: true

    FederationShare:
      type: object
      description: |
        One federation_shares row per the 1.22.C design proposal.
        Pairing alone shares nothing; each row here is an
        explicit per-object grant.
      required:
        - id
        - grantor_user_ref
        - object_kind
        - object_id
        - peer_id
        - scope
        - notes
        - granted_activity_id
        - granted_at
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        grantor_user_ref: { type: integer, format: int64 }
        object_kind:
          type: string
          enum: [asset, post, collection, workspace, brand_kit, user]
        object_id: { type: string, format: uuid }
        peer_id: { type: string, format: uuid }
        target_user_url:
          type: string
          nullable: true
          description: 'NULL = broadcast within peer; non-null = specific user actor URL'
        scope:
          type: string
          enum: [view, comment, annotate, remix]
        expires_at:
          type: string
          format: date-time
          nullable: true
        notes: { type: string }
        granted_activity_id: { type: string, format: uuid }
        granted_at: { type: string, format: date-time }
        revoked_at:
          type: string
          format: date-time
          nullable: true
        revoked_activity_id:
          type: string
          format: uuid
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    FederationDefederationPreview:
      type: object
      description: |
        Cascade-preview summary returned by
        GET /admin/federation/peers/{id}/defederation-preview
        per the 1.22.C design proposal §8.5. The admin UI
        renders this in the confirm-defederation modal so the
        operator sees exact impact before clicking through.
      required:
        - peer_id
        - peer_display_name
        - peer_url
        - total_active_shares
        - shares_by_kind
        - pending_handshakes
        - cached_suggestions
      properties:
        peer_id: { type: string, format: uuid }
        peer_display_name: { type: string }
        peer_url: { type: string }
        total_active_shares:
          type: integer
          format: int64
          description: |
            Sum across all object kinds. The cascade emits one
            aa:Unshare per row (best-effort delivery via the
            outbox) before deleting the peer.
        shares_by_kind:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: |
            Per-object-kind breakdown so the modal renders
            "12 posts, 23 collections, 8 assets, …". Keys are
            from the federation.ShareObjectKind closed catalogue;
            kinds with zero active shares may be omitted.
        pending_handshakes:
          type: integer
          description: Number of pending_outbound + pending_inbound rows for this peer.
        cached_suggestions:
          type: integer
          description: federation_peer_suggestions rows sourced from this peer that would be dropped.

    FederationShareList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FederationShare" }

    FederationOutbox:
      type: object
      description: |
        One row in the per-recipient federation_outbox queue
        (Phase 1.22.D-b). Derived from the activities ledger by
        the dispatcher per design §3.1; delivered by the worker
        per §3.3. The admin UI surfaces queued / sent / failed /
        cancelled rows for operator visibility into outbound
        federation traffic.
      required:
        [id, activity_id, peer_id, status, attempts,
         next_attempt_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        activity_id: { type: string, format: uuid }
        peer_id: { type: string, format: uuid }
        target_user_url:
          type: string
          nullable: true
          description: Per-recipient actor URL within the peer; null = broadcast.
        status:
          type: string
          enum: [queued, sent, failed, cancelled]
        attempts:
          type: integer
          description: Delivery attempt count (caps at 5 before terminal-fail).
        next_attempt_at:
          type: string
          format: date-time
          description: Wall-clock time of the next attempt per the §3.4 backoff schedule.
        last_attempt_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
          description: |
            Failure detail captured on the most recent attempt.
            For failed rows, may carry a §12.1 reject reason
            from the receiver — the admin UI maps these to
            retriable / non-retriable warnings on the re-queue
            confirmation prompt.
        sent_at:
          type: string
          format: date-time
          nullable: true
        delivered_with_key_id:
          type: string
          nullable: true
          description: HTTP-Sig keyId used on the successful delivery (forensics).
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    FederationOutboxList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FederationOutbox" }
        next_cursor:
          type: string
          nullable: true

    FederationInboxRow:
      type: object
      description: |
        One row in federation_inbox (Phase 1.22.D-a). Captures
        what arrived from a peer + how the inbox + dispatcher
        chain treated it (pending / processed / rejected /
        failed). Read-only via the admin UI — the activity_uri
        UNIQUE constraint means re-delivery is idempotent on
        the existing row.
      required:
        [id, activity_uri, peer_id, actor_uri, activity_type,
         status, dispatch_attempts, received_at]
      properties:
        id: { type: string, format: uuid }
        activity_uri: { type: string }
        peer_id: { type: string, format: uuid }
        actor_uri: { type: string }
        activity_type: { type: string }
        object_kind:
          type: string
          nullable: true
        object_id:
          type: string
          format: uuid
          nullable: true
        http_sig_key: { type: string }
        status:
          type: string
          enum: [pending, processed, rejected, failed]
        reject_reason:
          type: string
          nullable: true
          description: §12.1 reject reason when status=rejected.
        dispatch_attempts:
          type: integer
        last_attempt_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
          nullable: true
        received_at:
          type: string
          format: date-time
        processed_at:
          type: string
          format: date-time
          nullable: true
        correlation_activity_id:
          type: string
          format: uuid
          nullable: true
          description: Local activities row the dispatcher created for this inbound envelope.

    FederationInboxList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FederationInboxRow" }
        next_cursor:
          type: string
          nullable: true

    CascadeCancelResult:
      type: object
      required: [peer_id, cancelled_count]
      properties:
        peer_id: { type: string, format: uuid }
        cancelled_count:
          type: integer
          description: Number of outbox rows transitioned from queued to cancelled.

    SeedTimestampsItem:
      type: object
      required: [kind, id, created_at]
      properties:
        kind:
          type: string
          enum: [asset, post, comment]
          description: Domain table to UPDATE.
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Defaults to created_at when omitted.

    SeedTimestampsRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/SeedTimestampsItem" }

    SeedTimestampsResult:
      type: object
      required: [asset_updated, post_updated, comment_updated, skipped_unknown_id]
      properties:
        asset_updated: { type: integer }
        post_updated: { type: integer }
        comment_updated: { type: integer }
        skipped_unknown_id:
          type: integer
          description: |
            Items whose `id` didn't match any existing row.
            Apply scripts treat this as a soft failure
            (operator log + continue).

    SeedCommentRequest:
      type: object
      required: [target_kind, target_id, author_user_ref, body]
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: |
            Optional stable UUID for idempotent re-runs. When
            omitted the server generates one.
        target_kind:
          type: string
          enum: [post, asset, collection]
        target_id: { type: string, format: uuid }
        author_user_ref:
          type: integer
          format: int64
          description: |
            Forged author. Must reference an existing
            `user.ref`. The seed loader uses this to attribute
            comments to per-post reviewer voices distinct from
            the operator running apply.
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Optional parent comment. When set, depth +
            root_id are derived from the parent (same logic
            as the public CreateComment path).
        body: { type: string, minLength: 1 }
        body_html:
          type: string
          nullable: true
          description: |
            Defaults to empty (matches the local CreateComment
            path; the frontend renders `body` directly with
            whitespace-pre-wrap).
        annotation_type:
          type: string
          enum: [point, rect, timestamp, frame, whiteboard, text-range]
          nullable: true
        annotation_data:
          type: object
          additionalProperties: true
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Optional creation timestamp. Defaults to NOW()
            when omitted. The seed loader uses this to align
            comment timeline with the 14-month interlaced feed.

    FederationShareCreate:
      type: object
      required: [object_kind, object_id, peer_id, scope]
      properties:
        object_kind:
          type: string
          enum: [asset, post, collection, workspace, brand_kit]
          description: |
            'user' is excluded from the operator-facing API —
            user/follower shares are server-internal
            (Accept(Follow) creates them).
        object_id: { type: string, format: uuid }
        peer_id: { type: string, format: uuid }
        target_user_url:
          type: string
          description: |
            Recipient's actor URL on the peer. Omit for a
            broadcast share (any user on the peer). REQUIRED
            for restricted/embargo objects (server validates).
        scope:
          type: string
          enum: [view, comment, annotate, remix]
        expires_at:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          maxLength: 2000

    FederationPeer:
      type: object
      description: |
        One row from the federation_peers registry (Phase
        1.22.B-a + ADR 0043 §"Trust model"). Pairing alone shares
        no content — see federation_shares (1.22.C) for the
        access-control layer.
      required:
        - id
        - instance_url
        - display_name
        - instance_public_key
        - trust_tier
        - encryption_policy
        - enabled
        - status
        - handshake_at
        - handshake_by_user_ref
        - notes
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        instance_url:
          type: string
          description: 'https://peer.example (no trailing slash, no path)'
        display_name: { type: string }
        instance_public_key:
          type: string
          description: |
            PEM-wrapped Ed25519 public key (RFC 8410). May be the
            placeholder string `PENDING-HANDSHAKE-RESPONSE` while
            status is `pending_outbound` — the peer's real key
            replaces it when the confirm envelope arrives.
        trust_tier:
          type: string
          enum: [connected, directory-listed, auto-sync]
        encryption_policy:
          type: string
          enum: [plaintext, e2e-encrypted]
        enabled: { type: boolean }
        status:
          type: string
          enum: [pending_outbound, pending_inbound, connected]
          description: |
            Handshake state machine (migration 00052 + v1.md §11).
            Outbound delivery (1.22.D) gates on connected only.
        handshake_at: { type: string, format: date-time }
        handshake_by_user_ref: { type: integer, format: int64 }
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        notes: { type: string }
        share_in_visible_list:
          type: boolean
          description: |
            Per-peer opt-in for peer-of-peer discovery (Phase
            1.22.B-d). When true, this peer appears in
            GET /federation/peers/visible — other peers can
            then surface it as a discovery suggestion. Default
            false; explicit opt-in.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    FederationVisiblePeer:
      type: object
      description: |
        Minimal projection of a peer for /federation/peers/visible.
        Public — no auth required to fetch. Excludes operator-
        private fields like notes or trust_tier.
      required: [instance_url, display_name, instance_public_key, fingerprint]
      properties:
        instance_url: { type: string }
        display_name: { type: string }
        instance_public_key: { type: string }
        fingerprint: { type: string }

    FederationVisiblePeerList:
      type: object
      required: [peers]
      properties:
        peers:
          type: array
          items: { $ref: "#/components/schemas/FederationVisiblePeer" }

    FederationPeerSuggestion:
      type: object
      required:
        - id
        - source_peer_id
        - source_display_name
        - source_url
        - suggested_url
        - suggested_display_name
        - suggested_public_key
        - suggested_fingerprint
        - cached_at
      properties:
        id: { type: string, format: uuid }
        source_peer_id: { type: string, format: uuid }
        source_display_name: { type: string }
        source_url: { type: string }
        suggested_url: { type: string }
        suggested_display_name: { type: string }
        suggested_public_key: { type: string }
        suggested_fingerprint: { type: string }
        cached_at: { type: string, format: date-time }

    FederationPeerSuggestionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FederationPeerSuggestion" }

    FederationPeerSuggestionRefreshResult:
      type: object
      required: [outcomes]
      properties:
        outcomes:
          type: array
          items:
            type: object
            required: [source_peer_id, source_display_name, source_url, count]
            properties:
              source_peer_id: { type: string, format: uuid }
              source_display_name: { type: string }
              source_url: { type: string }
              count: { type: integer }
              error: { type: string }

    FederationDirectory:
      type: object
      description: |
        One subscribed federation directory (Phase 1.22.B-c).
        Pairing alone shares no content; directories are
        discovery aids per docs/spec/federation-directory/v1.md.
      required:
        - id
        - directory_url
        - operator_name
        - operator_public_key
        - operator_fingerprint
        - subscribed_at
        - subscribed_by_user_ref
        - enabled
        - last_poll_status
        - last_poll_error
        - poll_interval_seconds
        - notes
      properties:
        id: { type: string, format: uuid }
        directory_url: { type: string }
        operator_name: { type: string }
        operator_public_key:
          type: string
          description: PEM-wrapped Ed25519 directory operator pubkey (pinned at subscribe time).
        operator_fingerprint: { type: string }
        operator_contact: { type: string }
        subscribed_at: { type: string, format: date-time }
        subscribed_by_user_ref: { type: integer, format: int64 }
        enabled: { type: boolean }
        last_polled_at:
          type: string
          format: date-time
          nullable: true
        last_poll_status:
          type: string
          enum: [never_polled, ok, unreachable, signature_failed, malformed, spec_version_mismatch]
        last_poll_error: { type: string }
        poll_interval_seconds: { type: integer }
        notes: { type: string }
        publish_status:
          type: string
          enum: [not_published, pending_dns, pending_register, listed, failed]
        publish_pending_token: { type: string }
        publish_token_expires_at:
          type: string
          format: date-time
          nullable: true
        publish_record_name: { type: string }
        publish_record_value: { type: string }
        publish_listing_id: { type: string }
        publish_last_attempt_at:
          type: string
          format: date-time
          nullable: true
        publish_last_error: { type: string }
        publish_display_name: { type: string }
        publish_region: { type: string }
        publish_description: { type: string }
        publish_tags:
          type: array
          items: { type: string }

    FederationDirectoryPublishMetadata:
      type: object
      required: [display_name]
      description: |
        Operator-chosen entry metadata for /v1/register. Saved on
        the directory row so it pre-fills the form next time.
      properties:
        display_name: { type: string, minLength: 1, maxLength: 200 }
        region: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
        tags:
          type: array
          items: { type: string, maxLength: 50 }
          maxItems: 20

    FederationDirectoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FederationDirectory" }

    FederationDirectorySubscribe:
      type: object
      required: [directory_url]
      properties:
        directory_url:
          type: string
          description: 'Directory base URL (https, no path, no trailing slash).'
        notes:
          type: string

    FederationDirectoryEntry:
      type: object
      required:
        - id
        - directory_id
        - instance_url
        - display_name
        - instance_public_key
        - fingerprint
        - verified_at
        - verified_via
        - cached_at
      properties:
        id: { type: string, format: uuid }
        directory_id: { type: string, format: uuid }
        instance_url: { type: string }
        display_name: { type: string }
        instance_public_key: { type: string }
        fingerprint: { type: string }
        region: { type: string }
        description: { type: string }
        tags:
          type: array
          items: { type: string }
        verified_at: { type: string, format: date-time }
        verified_via: { type: string }
        listing_id: { type: string }
        cached_at: { type: string, format: date-time }

    FederationDirectoryEntryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FederationDirectoryEntry" }

    FederationDirectoryPollResult:
      type: object
      required: [directory, entry_count]
      properties:
        directory:
          $ref: "#/components/schemas/FederationDirectory"
        entry_count: { type: integer }

    FederationInstanceDoc:
      type: object
      description: |
        This instance's federation identity — peers fetch this
        to verify signed envelopes from us. Stable shape per
        docs/spec/federation/v1.md §10.
      required: [instance_url, display_name, public_key_pem, fingerprint, protocol_version]
      properties:
        instance_url:
          type: string
          description: This instance's canonical https URL.
        display_name:
          type: string
          description: Operator-set display name (from sysconfig.site_name).
        public_key_pem:
          type: string
          description: PEM-wrapped Ed25519 instance public key.
        fingerprint:
          type: string
          description: Lowercase hex SHA-256 of the raw public key for out-of-band verification.
        protocol_version:
          type: string
          description: Always `aa-fed/v1` for this release.

    HandshakeEnvelopeInner:
      type: object
      description: |
        Inner payload of a handshake envelope per v1.md §11.
        Signed using RFC-8785-canonical JSON.
      required:
        - protocol
        - type
        - from
        - from_display_name
        - from_public_key_pem
        - to
        - nonce
        - timestamp
      properties:
        protocol: { type: string, description: 'Always `aa-handshake/v1`' }
        type:
          type: string
          enum: [offer, confirm]
        from: { type: string }
        from_display_name: { type: string }
        from_public_key_pem: { type: string }
        to: { type: string }
        nonce: { type: string }
        timestamp: { type: string, format: date-time }

    HandshakeEnvelope:
      type: object
      required: [envelope, signature]
      properties:
        envelope:
          $ref: "#/components/schemas/HandshakeEnvelopeInner"
        signature:
          type: string
          description: Base64-std Ed25519 signature over the canonical envelope.

    HandshakeAccepted:
      type: object
      required: [status, peer_id]
      properties:
        status:
          type: string
          enum: [accepted_pending, completed, ignored_duplicate]
          description: |
            `accepted_pending`: we created a pending_inbound row; admin must accept.
            `completed`: handshake finished (either confirm landed, or cross-handshake auto-merged).
            `ignored_duplicate`: we already had this row in a terminal state.
        peer_id:
          type: string
          format: uuid

    FederationHandshakeInitiate:
      type: object
      required: [instance_url]
      properties:
        instance_url:
          type: string
          description: Peer's instance URL (https, no path, no trailing slash).
        display_name:
          type: string
          description: |
            Optional; defaults to the URL host. Operator can rename
            later from the peer detail page.

    FederationPeerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FederationPeer" }

    FederationPeerCreate:
      type: object
      required: [instance_url, display_name, instance_public_key]
      properties:
        instance_url:
          type: string
          description: 'Must be https://, no trailing slash, no path component.'
        display_name: { type: string, minLength: 1, maxLength: 200 }
        instance_public_key:
          type: string
          description: PEM-wrapped Ed25519 public key. Validated server-side.
        trust_tier:
          type: string
          enum: [connected, directory-listed, auto-sync]
          default: connected
        encryption_policy:
          type: string
          enum: [plaintext, e2e-encrypted]
          default: plaintext
        enabled: { type: boolean, default: true }
        notes: { type: string }

    FederationPeerUpdate:
      type: object
      description: |
        PATCH shape — every field optional. Omitting a field
        leaves it unchanged. instance_url and instance_public_key
        are NOT editable; defederate + re-pair to change them.
      properties:
        display_name: { type: string, minLength: 1, maxLength: 200 }
        trust_tier:
          type: string
          enum: [connected, directory-listed, auto-sync]
        encryption_policy:
          type: string
          enum: [plaintext, e2e-encrypted]
        enabled: { type: boolean }
        notes: { type: string }
        share_in_visible_list:
          type: boolean
          description: |
            Per-peer opt-in for peer-of-peer discovery (Phase
            1.22.B-d). Toggle this to expose the peer in our
            /federation/peers/visible response so other peers
            can surface it as a suggestion.

    AdminActivity:
      type: object
      description: |
        One row from the activities ledger (Phase 1.22.A-bis-1 +
        ADR 0044). Surfaces the full AP envelope payload + the
        operator-facing metadata the admin audit UI renders. See
        [docs/spec/federation/v1.md §3](../../docs/spec/federation/v1.md)
        for the wire-format contract this projection mirrors.
      required:
        - id
        - activity_uri
        - activity_type
        - actor_uri
        - source
        - published_at
        - created_at
      properties:
        id: { type: string, format: uuid }
        activity_uri: { type: string }
        activity_type: { type: string }
        actor_uri: { type: string }
        actor_user_ref:
          type: integer
          format: int64
          nullable: true
          description: NULL for peer-sourced activities (we don't have a local ref for the remote actor).
        object_uri:
          type: string
          nullable: true
        object_kind:
          type: string
          nullable: true
        object_local_id:
          type: string
          nullable: true
        target_uri:
          type: string
          nullable: true
        to:
          type: array
          items: { type: string }
        cc:
          type: array
          items: { type: string }
        payload:
          type: object
          additionalProperties: true
        signature_value:
          type: string
          nullable: true
        signature_pubkey:
          type: string
          nullable: true
        source:
          type: string
          description: '`local` or peer instance URL.'
        published_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    AdminActivityList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminActivity" }
        next_cursor:
          type: string
          nullable: true

    NotificationUnreadCount:
      type: object
      required: [count]
      properties:
        count: { type: integer, format: int64 }

    NotificationMarkAllResult:
      type: object
      required: [marked_count]
      properties:
        marked_count: { type: integer, format: int64 }

    DirectMessage:
      type: object
      description: One DM between two users (Phase 1.17.I-a).
      required: [id, sender_user_ref, recipient_user_ref, body, sent_at]
      properties:
        id: { type: string, format: uuid }
        sender_user_ref: { type: integer, format: int64 }
        recipient_user_ref: { type: integer, format: int64 }
        body: { type: string }
        sent_at: { type: string, format: date-time }
        read_at:
          type: string
          format: date-time
          nullable: true
          description: NULL = unread by recipient.

    DirectMessageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DirectMessage" }
        next_cursor:
          type: string
          nullable: true

    DirectMessageThread:
      type: object
      description: |
        Inbox row — one per peer the caller has DM'd. Denormalized
        peer identity + the most recent message excerpt + this
        peer's unread count so the inbox renders without N+1
        round-trips.
      required:
        - peer_user_ref
        - peer_username
        - last_message_id
        - last_sender_user_ref
        - last_body
        - last_sent_at
        - unread_count
      properties:
        peer_user_ref: { type: integer, format: int64 }
        peer_username: { type: string }
        peer_display_name: { type: string, nullable: true }
        peer_avatar_url: { type: string, nullable: true }
        last_message_id: { type: string, format: uuid }
        last_sender_user_ref:
          type: integer
          format: int64
          description: |
            Which side authored the most recent message in this
            thread. Lets the inbox card render "You: ..." vs
            "PeerName: ..." prefixes.
        last_body: { type: string }
        last_sent_at: { type: string, format: date-time }
        last_read_at:
          type: string
          format: date-time
          nullable: true
        unread_count:
          type: integer
          format: int64
          description: |
            Count of unread messages from this peer in this thread.
            Sum across all threads matches the envelope-pill total.

    DirectMessageThreadList:
      type: object
      required: [threads]
      properties:
        threads:
          type: array
          items: { $ref: "#/components/schemas/DirectMessageThread" }

    DirectMessageUnreadCount:
      type: object
      required: [count]
      properties:
        count: { type: integer, format: int64 }

    SendDirectMessageRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000

    DirectMessageMarkReadResult:
      type: object
      required: [marked_count]
      properties:
        marked_count: { type: integer, format: int64 }

    Comment:
      type: object
      description: |
        A single comment in a thread. Threading is via parent_id +
        root_id + depth (caller renders nested replies indented by
        depth). annotation_* fields are NULL for plain comments; the
        review-mode feature reuses the same row shape.

        Federation: exactly one of {author_user_ref} XOR
        {peer_id + actor_uri} is set per row. Local-authored
        comments have author_user_ref set + peer_id NULL.
        Remote-authored comments (from a paired peer per
        ADR 0043 / phase 1.22.D) have author_user_ref NULL +
        peer_id + actor_uri + display_name populated. Clients
        render "<display_name> @ <peer's host>" for remote rows.
      required:
        [id, target_kind, target_id, root_id, depth,
         body, body_html, like_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        target_kind:
          type: string
          enum: [post, asset, collection]
        target_id: { type: string, format: uuid }
        parent_id:
          type: string
          format: uuid
          nullable: true
        root_id: { type: string, format: uuid }
        depth: { type: integer }
        author_user_ref:
          type: integer
          format: int64
          nullable: true
          description: Local author user.ref. NULL for remote-authored comments (see peer_id / actor_uri).
        body: { type: string }
        body_html:
          type: string
          description: Server-rendered safe HTML; clients should render this rather than reformatting `body`.
        annotation_type:
          type: string
          enum: [point, rect, timestamp, frame, whiteboard, text-range]
          nullable: true
        annotation_data:
          type: object
          additionalProperties: true
          nullable: true
        like_count: { type: integer, format: int64 }
        edited_at:
          type: string
          format: date-time
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        peer_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The federation peer that originated this comment. NULL
            for local-authored rows. Set in tandem with actor_uri
            + display_name when the comment came in via the
            federation inbox (Phase 1.22.D).
        actor_uri:
          type: string
          nullable: true
          description: |
            The remote actor's URI on their home instance (e.g.
            https://studio-b.example/users/bob). NULL for
            local-authored rows.
        display_name:
          type: string
          nullable: true
          description: |
            Display name resolved from federation_remote_actors
            cache for remote-authored comments. May be empty if
            the remote instance hasn't shipped display hints yet;
            clients should fall back to the actor_uri's host +
            local-part when this is empty.

    CommentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Comment" }
        next_cursor:
          type: string
          nullable: true

    CommentCreate:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: |
            When set, the new comment is a reply to this parent.
            Depth and root_id are computed server-side from the
            parent row.

    WhiteboardContent:
      type: object
      required: [layers, source_w, source_h]
      description: |
        Vector source of truth for a whiteboard / annotation sketch.
        The frontend renders from this; OCR / AI ingestion later can
        consume it directly without going through the raster snapshot.
      properties:
        source_w:
          type: integer
          minimum: 1
          description: |
            Width of the source canvas in CSS pixels at save time.
            Used to scale the drawing proportionally when re-rendered
            in a different viewport size — strokes are stored in
            source-canvas coordinates, not viewport pixels.
        source_h:
          type: integer
          minimum: 1
        image_hash:
          type: string
          nullable: true
          description: |
            Optional content-addressed hash of a rasterized PNG
            snapshot in object storage. Convenience output for OCR /
            AI / PDF export later. Null on save means strokes are
            authoritative and the snapshot will be lazily rendered.
        canvas_color:
          type: string
          description: |
            Canvas background color (C-1.18). Hex string painted
            behind every layer before items render. Defaults to
            '#ffffff' when missing so saves from C-1.0..C-1.17
            render identically.
        layers:
          type: array
          minItems: 1
          maxItems: 32
          description: |
            Ordered bottom-to-top. Each layer carries its own visible
            / opacity / lock / items payload — same shape Photoshop /
            Procreate use. Capped at 32 to keep payloads bounded.
          items:
            type: object
            required: [id, items]
            properties:
              id: { type: string, description: "Stable per-layer identifier (UUIDv4 from the client)." }
              name: { type: string }
              visible: { type: boolean, default: true }
              opacity: { type: number, minimum: 0, maximum: 1, default: 1 }
              locked:
                type: boolean
                default: false
                description: "When true the layer is read-only; visibility stays toggleable."
              items:
                type: array
                description: |
                  Polymorphic items on this layer. `kind` is the
                  discriminator: stroke (free-form brush), shape
                  (line / arrow / rect / ellipse), text (inline
                  label), or image (pasted/dropped bitmap, stored
                  inline as a base64 data: URL for now).
                items:
                  type: object
                  required: [kind]
                  properties:
                    kind:
                      type: string
                      enum: [stroke, shape, text, image]
                    # Stroke fields
                    tool:
                      type: string
                      enum: [pen, marker, highlighter, eraser, line, arrow, rect, rounded-rect, ellipse, triangle, right-triangle, diamond, pentagon, hexagon, star, heart, callout-rect, callout-oval]
                    color: { type: string, description: "Legacy single color (still set on shape items for back-compat). Stroke + text items use this exclusively; shape items prefer strokeColor / fillColor when present." }
                    strokeColor: { type: string, description: "Shape outline color (C-1.17). Falls back to `color` when missing." }
                    fillColor: { type: string, description: "Shape fill color (C-1.17). Falls back to `color` when missing." }
                    width: { type: number, minimum: 0, maximum: 200 }
                    opacity: { type: number, minimum: 0, maximum: 1, default: 1 }
                    points:
                      type: array
                      items:
                        type: array
                        minItems: 2
                        maxItems: 3
                        items: { type: number }
                    # Shape / Text / Image bbox
                    x: { type: number }
                    y: { type: number }
                    w: { type: number }
                    h: { type: number }
                    fill: { type: number, minimum: 0, maximum: 1, description: "Shape fill opacity. 0 = outline only, 1 = solid fill." }
                    # Text fields
                    body: { type: string, maxLength: 10000 }
                    fontSize: { type: number, minimum: 8, maximum: 256 }
                    align: { type: string, enum: [left, center, right], default: left }
                    bold: { type: boolean, default: false }
                    italic: { type: boolean, default: false }
                    # Image fields
                    src:
                      type: string
                      description: |
                        Base64 data: URL OR remote URL. Pasted images
                        are embedded as data URLs (5 MB cap enforced
                        client-side); content-addressed `image_hash`
                        reference lands in a later phase.
                    rotation: { type: number, default: 0 }

    LintDiagnostic:
      type: object
      required: [line, col, severity, message, source]
      properties:
        line:
          type: integer
          minimum: 1
          description: 1-based line number.
        col:
          type: integer
          minimum: 1
          description: 1-based column.
        end_line:
          type: integer
          minimum: 1
          nullable: true
        end_col:
          type: integer
          minimum: 1
          nullable: true
        severity:
          type: string
          enum: [info, warning, error]
        message:
          type: string
        source:
          type: string
          description: |
            The linter that produced this diagnostic
            (`json` / `yaml` / `markdown` for the first cut).
            Frontend renders it as a small badge next to each row.

    LintResult:
      type: object
      required: [linter, skipped]
      properties:
        linter:
          type: string
          description: |
            Producer name, or `"none"` when no linter is wired for
            the asset's extension.
        skipped:
          type: boolean
          description: |
            `true` when no linter ran (unsupported extension or
            empty source). The diagnostics array is omitted or
            empty in that case.
        diagnostics:
          type: array
          items: { $ref: "#/components/schemas/LintDiagnostic" }

    WhiteboardCreate:
      type: object
      required: [content]
      properties:
        title:
          type: string
          maxLength: 200
          description: Optional title for the sidebar list.
        content:
          $ref: "#/components/schemas/WhiteboardContent"

    TextAnnotationAnchor:
      type: object
      description: |
        Range anchor for a doc-viewer annotation. Lines are 1-based;
        columns are 0-based (CodeMirror convention). The range may
        be empty (`start == end`) for a sticky note at a position.
      required: [style, color, start_line, start_col, end_line, end_col]
      properties:
        style:
          type: string
          enum: [highlight, strikethrough, underline, comment, note]
          description: |
            Visual treatment the editor's decoration extension applies.
            `comment` + `note` carry user text in the parent comment's
            `body`; `highlight` / `strikethrough` / `underline` typically
            have empty bodies but the field is free to set.
        color:
          type: string
          description: |
            Hex color (`#fef08a` etc.). The default swatch palette is
            five highlighter colors, but any hex string is accepted so
            the future "custom color" picker works without a schema
            change.
          maxLength: 16
        start_line:
          type: integer
          minimum: 1
        start_col:
          type: integer
          minimum: 0
        end_line:
          type: integer
          minimum: 1
        end_col:
          type: integer
          minimum: 0
        resolved:
          type: boolean
          default: false
          description: |
            Review-flow flag — the panel can filter resolved annotations
            out of the active list. Resolution does not delete; the
            anchor stays anchored for audit.

    TextAnnotationCreate:
      type: object
      required: [anchor]
      properties:
        body:
          type: string
          description: User commentary (Markdown later; plain text now).
          maxLength: 8000
        anchor:
          $ref: "#/components/schemas/TextAnnotationAnchor"

    TextAnnotationPatch:
      type: object
      description: |
        Field-by-field PATCH. Pass only what changed. Pass the full
        `anchor` when changing any range/style/color field — the
        server replaces the whole anchor blob (no partial JSON merge).
      properties:
        body:
          type: string
          maxLength: 8000
        anchor:
          $ref: "#/components/schemas/TextAnnotationAnchor"

    AclEntry:
      type: object
      required: [principal_type, principal_id, permission, granted_at]
      properties:
        principal_type:
          type: string
          enum: [user, role, team]
        principal_id:
          type: string
          description: |
            BIGINT user.ref for principal_type=user; UUID for role/team.
            Stored as text so the polymorphic column fits all three.
          maxLength: 64
        permission:
          type: string
          enum: [read, write, admin]
        granted_at: { type: string, format: date-time }
        granted_by_rs_user_id:
          type: integer
          format: int64
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Time-boxed grant. NULL = permanent. The handler-side check
            ignores rows whose expires_at < NOW().

    AclCreate:
      type: object
      required: [principal_type, principal_id, permission]
      properties:
        principal_type:
          type: string
          enum: [user, role, team]
        principal_id:
          type: string
          maxLength: 64
        permission:
          type: string
          enum: [read, write, admin]
        expires_at:
          type: string
          format: date-time
          nullable: true

    TeamMember:
      type: object
      required: [team_id, rs_user_id, added_at]
      properties:
        team_id: { type: string, format: uuid }
        rs_user_id: { type: integer, format: int64 }
        added_at: { type: string, format: date-time }
        added_by_rs_user_id:
          type: integer
          format: int64
          nullable: true

    EpubSpineEntry:
      type: object
      description: |
        One chapter entry from an EPUB's spine (reading order).
        Returned by GET /assets/{id}/epub/spine; consumed by the
        frontend reader to render the TOC + chapter picker.
      required: [idx, label, href, media_type]
      properties:
        idx:
          type: integer
          minimum: 0
          description: Zero-based spine position; pass to /chapters/{idx}.
        label:
          type: string
          description: Display label — NCX/TOC label, else manifest id, else "Chapter N".
        href:
          type: string
          description: Original manifest href (debugging / federation parity).
        media_type:
          type: string
          example: application/xhtml+xml

    EpubSearchHit:
      type: object
      description: |
        One match returned by the EPUB full-text search endpoint.
        Multiple hits per chapter are possible (capped at 5).
      required: [chapter_idx, chapter_label, snippet, char_offset]
      properties:
        chapter_idx:
          type: integer
          minimum: 0
        chapter_label:
          type: string
        snippet:
          type: string
          description: ~120 char excerpt centred on the match.
        char_offset:
          type: integer
          description: Char offset of the match in the plain-text chapter body.

    AssetCompanion:
      type: object
      description: |
        A sidecar file (texture, MTL, .bin, etc.) attached to a 3D
        model asset under a relative path. The viewer's LoadingManager
        rewrites the model's relative resource references through
        these entries so external resources resolve to the right
        content-addressed blob.
      required: [id, asset_id, path, content_type, size_bytes, created_at]
      properties:
        id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
        path:
          type: string
          description: |
            Relative path the model file references this companion at
            — e.g. 'character.mtl' for an OBJ's sibling .mtl, or
            'textures/foo.png' for a glTF texture in a subdirectory.
          example: textures/character-a.png
        content_type:
          type: string
          example: image/png
        size_bytes:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time

    AssetAlternate:
      type: object
      description: |
        A sibling-version variant of an asset (palette swap, transcode,
        thumbnail, authored variant). Where companions are sidecars the
        primary asset references, alternates stand on their own and can
        be downloaded individually.
      required: [id, asset_id, label, kind, content_type, size_bytes, created_at, metadata, created_by_user_ref]
      properties:
        id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
        label:
          type: string
          description: Human label shown in alt-file lists; unique per asset.
          example: walk — team-green palette
        kind:
          type: string
          description: |
            Provenance tag — palette_swap | thumbnail | low_res |
            authored | transcode. Open-ended.
          example: palette_swap
        content_type:
          type: string
          example: image/png
        size_bytes:
          type: integer
          format: int64
        origin_server_id:
          type: string
          format: uuid
          nullable: true
        created_by_user_ref:
          type: integer
          format: int64
          nullable: true
        created_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
          description: Kind-specific JSON. Sprite tool palette swaps store the colour remap here.

    UploadResult:
      type: object
      required: [hash, size, content_type, deduped, pin_subject_type, pin_subject_id]
      properties:
        hash:
          type: string
          description: lowercase hex sha256 of the uploaded bytes
          example: a1b2c3d4e5f6...0123
        size:
          type: integer
          format: int64
          description: Byte count
        content_type:
          type: string
          example: image/jpeg
        deduped:
          type: boolean
          description: |
            true if the hash was already present on this server and
            the bytes were NOT re-uploaded to the backend. A new pin
            was still added for the caller.
        pin_subject_type:
          type: string
          example: user
        pin_subject_id:
          type: string
          example: "9"
    CreateApiTokenRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: CI deploy bot
        expires_at:
          type: string
          format: date-time
          nullable: true
        scopes:
          type: array
          items:
            type: string
          description: |
            Capability codes this token may exercise. Empty array means
            the token can do whatever the user can do. (The
            capability/role model itself lands in Phase 1.3; for now
            scopes are recorded but not enforced.)
    WorkflowState:
      type: object
      description: |
        One node in a workflow state machine. States are scoped to a
        domain (post, asset). Initial / terminal flags are read-only —
        the underlying `workflow_state` table is seeded, not edited
        from the API.
      required:
        [id, domain, code, label, sort_order, is_initial, is_terminal,
         icon, color, requires_note]
      properties:
        id:           { type: string, format: uuid }
        domain:
          type: string
          description: domain key (e.g. `post`, `asset:1`)
        code:
          type: string
          description: stable machine identifier (e.g. `draft`)
        label:
          type: string
          description: human label (e.g. `Draft`)
        sort_order:   { type: integer, format: int32 }
        is_initial:   { type: boolean }
        is_terminal:  { type: boolean }
        icon:
          type: string
          description: |
            Short token (e.g. "check", "clock", "x-circle") the
            frontend maps to an SVG in its iconset. Empty string =
            no icon override (frontend picks a default).
        color:
          type: string
          description: |
            Hex color (e.g. `#16a34a`) for the state badge background.
            Empty string = frontend falls back to a neutral tone.
        requires_note:
          type: boolean
          description: |
            When true, `workflow.Service.Transition` rejects calls
            that move INTO this state with an empty note. Useful for
            rejection / needs-work states where the reason matters
            for audit and the originating user.
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required, missing, or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but missing required capabilities
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflict (slug taken, would create cycle, etc.)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
