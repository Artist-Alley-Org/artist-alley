  /posts:
    get:
      operationId: listPosts
      summary: List posts (paginated feed)
      description: |
        The browse-page feed. Public posts visible to authenticated
        callers; the author's own posts of any visibility are also
        returned. Phase 1.13.G adds anonymous access when the system
        config allows it.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: author_ref
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: visibility
          in: query
          required: false
          schema:
            type: string
            enum: [private, org-only, followers, explicit-share]
        - name: q
          in: query
          required: false
          description: |
            Plain-text search over the post's TSVECTOR. Phase 1.12
            (search DSL) replaces this with the full query language.
          schema: { type: string, maxLength: 200 }
        - name: tag
          in: query
          required: false
          schema: { type: string }
        - name: feed
          in: query
          required: false
          description: |
            Pre-baked feed selector (Phase 1.17.G2). When set, applies
            a viewer-anchored filter on top of the other query params.
            - `following` — restrict to authors the caller follows
              (browse-page "Following" tab). Returns an empty page for
              callers who don't follow anyone yet.
            - `latest` (default) — no extra filter; same shape as
              omitting the param.
          schema:
            type: string
            enum: [latest, following]
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A page of posts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createPost
      summary: Publish a new post
      description: |
        Wraps 1+ existing assets into a Post. The asset bytes are
        already in storage (POST /storage/objects) and the asset
        entities are already created (POST /assets); this endpoint
        ties them together with the descriptive metadata.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostCreate" }
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /posts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getPost
      summary: Fetch a post with its members + tags
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "401":
