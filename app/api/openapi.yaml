openapi: 3.0.3
info:
  title: artist-alley API
  version: 0.1.0
  description: |
    The artist-alley REST API.

    This file is the **contract**: server types and handler interfaces are
    generated from it by `oapi-codegen` (see `app/api/oapi-codegen.yaml`).
    Frontend code (SvelteKit, eventually) will generate its TypeScript
    types from the same source. Edits to this file are the only way to
    change the public API surface — handlers will fail to compile if the
    Go signatures drift from the spec.

    Generate: `cd app && docker run --rm -v $PWD:/src -w /src/api \
      ghcr.io/oapi-codegen/oapi-codegen:latest -config oapi-codegen.yaml \
      openapi.yaml`

servers:
  - url: /api/v1
    description: Local development behind nginx (port 8088 by default)

tags:
  - name: auth
    description: |
      Authentication and identity. The login endpoint accepts username +
      password and sets an `rs_session` cookie (PHP-compatible) so the
      same session works against both the Go API and the legacy RS PHP
      pages. API tokens (`aa_pat_*`, 32 random bytes) are an alternate
      auth method for programmatic clients — issued via this same set
      of endpoints, presented via `Authorization: Bearer <token>`.
  - name: assets
    description: |
      Upload, download, and pin management for asset bytes. Storage is
      content-addressed: every blob is keyed by sha256(contents), so
      identical uploads dedup automatically and federated peers can
      verify transfers by hash. See ADR 0008.
  - name: resource_types
    description: Configurable categories applied to every uploaded asset
      (Photo, Document, Video, Audio, custom types, etc.)

paths:
  /auth/login:
    post:
      operationId: login
      summary: Sign in with username and password
      description: |
        Verifies credentials against the RS `user` table using the same
        HMAC-then-bcrypt hashing scheme RS uses (so PHP-created users
        log in unchanged). On success: writes a new session token to
        `user.session` and sets the `rs_session` cookie.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated. Returns the current user; an
            `rs_session` cookie is set in the response headers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      description: |
        Clears `user.session` for the calling user and expires the
        `rs_session` cookie. Safe to call when unauthenticated
        (returns 204 either way).
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Logged out (or wasn't logged in).

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Return information about the caller
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/tokens:
    get:
      operationId: listApiTokens
      summary: List the caller's API tokens
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: List of tokens (without the token values).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiTokenSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createApiToken
      summary: Issue a new API token
      description: |
        Creates a Personal Access Token bound to the caller. The token
        value is returned in the response **once and only once** — it
        is hashed in the database and cannot be recovered later. Lose
        it, revoke and re-issue.

        Token creation is restricted to cookie-authenticated callers,
        so a stolen token cannot mint further tokens.
      tags: [auth]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiTokenRequest"
      responses:
        "201":
          description: Token issued. The plaintext token is in the
            `token` field of the response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/capabilities:
    get:
      operationId: listCapabilities
      summary: List every capability the server knows about
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["caps.read"]
      responses:
        "200":
          description: List of capabilities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Capability"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/roles:
    get:
      operationId: listRoles
      summary: List roles and the capabilities attached to each
      description: |
        Includes parent_id but does NOT recurse — each role's
        `capabilities` array is just the direct attachments. Effective
        capabilities for a user (role chain + grants - revokes) are
        exposed via `/auth/me/capabilities`.
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["roles.read"]
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/me/capabilities:
    get:
      operationId: getMyCapabilities
      summary: Effective capabilities for the current user
      description: |
        Returns the fully resolved capability set: role-chain capabilities
        unioned with explicit grants, minus explicit revokes. This is
        what middleware uses for enforcement.
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Effective capability set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveCapabilities"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/users/{ref}/role:
    put:
      operationId: setUserRole
      summary: Assign a role to a user (admin)
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-required-capabilities: ["users.write"]
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserRoleRequest"
      responses:
        "204":
          description: Role assigned
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/tokens/{id}:
    delete:
      operationId: revokeApiToken
      summary: Revoke an API token by ID
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked.
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /assets:
    post:
      operationId: uploadAsset
      summary: Upload a new asset blob
      description: |
        Streams the request body to storage, computing sha256 in the
        same pass. If the resulting hash already exists, the bytes are
        not re-uploaded — only a new pin is added so the caller's user
        keeps the object alive. The response includes a `deduped` flag
        so clients can show "already uploaded" UX.

        The pin subject for this endpoint is always `user:<caller-ref>`.
        When the resource model lands in a later phase, callers will
        be able to specify a richer subject (e.g., a resource id).
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      parameters:
        - name: X-Content-Type
          in: header
          required: false
          description: |
            Original content type of the upload. Defaults to
            application/octet-stream when omitted. Recorded as the
            original variant's content_type so download responses can
            set the right Content-Type header.
          schema:
            type: string
      responses:
        "201":
          description: Upload accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /assets/{hash}:
    get:
      operationId: downloadAssetOriginal
      summary: Download the original variant by content hash
      description: |
        Returns the bytes of the `original` variant. Supports HTTP
        Range requests for partial downloads (video scrub, resumable
        downloads). 404 when the hash isn't known to this server.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: hash
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
        - name: Range
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Full body
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial body (Range request honoured)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{hash}/{variant}:
    get:
      operationId: downloadAssetVariant
      summary: Download a specific variant of an asset
      description: |
        Same semantics as the original-variant download but for any
        named variant key (e.g. "preview_2048", "thumb_512",
        "hls/seg00001.ts").
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: hash
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
        - name: variant
          in: path
          required: true
          schema:
            type: string
        - name: Range
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Full body
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial body (Range request honoured)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /resource_types:
    get:
      operationId: listResourceTypes
      summary: List all resource types
      description: |
        Returns every resource type configured in the system, ordered by
        display order (`order_by`) then by primary key. Anonymous access.
      tags: [resource_types]
      responses:
        "200":
          description: List of resource types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResourceType"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: rs_session
      description: |
        PHP-compatible session cookie issued by `/auth/login`. Same
        cookie works against the RS PHP pages so users only sign in
        once.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: aa_pat
      description: |
        Personal Access Token, format `aa_pat_<32 chars>`. Issued via
        `POST /auth/tokens`. Send as `Authorization: Bearer aa_pat_...`.
  schemas:
    ResourceType:
      type: object
      required: [ref]
      properties:
        ref:
          type: integer
          format: int64
          description: Primary key
          example: 1
        name:
          type: string
          nullable: true
          example: Photo
        allowed_extensions:
          type: string
          nullable: true
          description: |
            Comma-separated list of file extensions accepted for this
            resource type. Null means "use the system default."
          example: jpg,jpeg,png,gif
        order_by:
          type: integer
          format: int64
          nullable: true
          description: Display order, ascending. Null sorts last.
        icon:
          type: string
          nullable: true
          description: Lucide icon name shown in UI
          example: image
        colour:
          type: integer
          format: int64
          nullable: true
        tab:
          type: integer
          format: int64
          nullable: true
          description: Resource-type tab grouping in the admin UI
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error summary
          example: could not list resource types
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          format: password
    CurrentUser:
      type: object
      required: [ref, username, auth_method]
      properties:
        ref:
          type: integer
          format: int64
        username:
          type: string
        fullname:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        usergroup:
          type: integer
          format: int64
          nullable: true
        auth_method:
          type: string
          enum: [session, token]
          description: How the caller was authenticated for this request.
    ApiTokenSummary:
      type: object
      required: [id, name, created_at, scopes]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
    ApiTokenCreated:
      allOf:
        - $ref: "#/components/schemas/ApiTokenSummary"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: |
                The plaintext token. Save it — it is never returned again.
              example: aa_pat_K7eHs0bdQ9XR8h0g7y4mR0aZ2lY1pX5N
    Capability:
      type: object
      required: [code, description]
      properties:
        code:
          type: string
          description: Atomic capability identifier (e.g., "users.read").
          example: users.read
        description:
          type: string
    Role:
      type: object
      required: [id, name, description, capabilities]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: Single-inheritance parent role; null for root roles.
        capabilities:
          type: array
          items:
            type: string
          description: |
            Capability codes attached directly to this role. Does NOT
            include inherited capabilities — chase parent_id to get the
            full set, or call `/auth/me/capabilities` for the resolved
            view of the current user.
    EffectiveCapabilities:
      type: object
      required: [user_ref, capabilities]
      properties:
        user_ref:
          type: integer
          format: int64
        role:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Role"
        capabilities:
          type: array
          items:
            type: string
          description: |
            The resolved capability set: (role chain capabilities)
            UNION (explicit grants) EXCEPT (explicit revokes). What
            middleware checks against when enforcing
            x-required-capabilities.
        grants:
          type: array
          items:
            type: string
          description: Capabilities granted explicitly to this user.
        revokes:
          type: array
          items:
            type: string
          description: Capabilities revoked explicitly from this user.
    SetUserRoleRequest:
      type: object
      required: [role_id]
      properties:
        role_id:
          type: string
          format: uuid
    UploadResult:
      type: object
      required: [hash, size, content_type, deduped, pin_subject_type, pin_subject_id]
      properties:
        hash:
          type: string
          description: lowercase hex sha256 of the uploaded bytes
          example: a1b2c3d4e5f6...0123
        size:
          type: integer
          format: int64
          description: Byte count
        content_type:
          type: string
          example: image/jpeg
        deduped:
          type: boolean
          description: |
            true if the hash was already present on this server and
            the bytes were NOT re-uploaded to the backend. A new pin
            was still added for the caller.
        pin_subject_type:
          type: string
          example: user
        pin_subject_id:
          type: string
          example: "9"
    CreateApiTokenRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: CI deploy bot
        expires_at:
          type: string
          format: date-time
          nullable: true
        scopes:
          type: array
          items:
            type: string
          description: |
            Capability codes this token may exercise. Empty array means
            the token can do whatever the user can do. (The
            capability/role model itself lands in Phase 1.3; for now
            scopes are recorded but not enforced.)
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required, missing, or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but missing required capabilities
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
