      responses:
        "200":
          description: Following list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialUserList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{ref}/relationship:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getUserRelationship
      summary: Caller's social-graph relationship with this user
      description: |
        The single round-trip the profile page
        consumes to decide which "Follow/Unfollow/Blocked/Block"
        button to render. Reports both directions of follow + the
        bidirectional block bit. Anonymous callers receive an
        all-false response (still 200) since the relationship is
        anchored on the caller; client code can short-circuit
        rendering on `is_self`.
      tags: [social]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Relationship snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserRelationship" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{ref}/block:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: blockUser
      summary: Block this user
      description: |
        Directional block. Auto-unfollows BOTH
        directions before persisting the block (continuing to
        follow a blocked user is a contradictory state, so the
        block implies a follower-graph cleanup). The optional
        `reason` is private to the blocker, surfaced only in
        /account/blocked.
      tags: [social]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockUserRequest" }
      responses:
        "204":
          description: Block recorded (or already in place).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: unblockUser
      summary: Stop blocking this user
      description: |
        Idempotent unblock. Does NOT re-establish
        any prior follow edges (the original block auto-unfollowed
        them); callers wanting to follow again must do so explicitly.
      tags: [social]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: No longer blocked (or never was).
        "401":
          $ref: "#/components/responses/Unauthorized"

  /account/messages:
    get:
      operationId: listMyDirectMessageThreads
      summary: My DM inbox — one entry per peer
      description: |
        Lists every peer the caller has exchanged DMs with, paired
        with the most recent message in that thread + the count of
        unread messages from that peer. Newest-first. Wires the
        envelope-icon dropdown + the /account/messages full inbox.
      tags: [messages, account]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: List of threads.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectMessageThreadList" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /account/messages/unread-count:
    get:
      operationId: getMyUnreadDirectMessageCount
      summary: My unread DM badge count
      description: |
        Backs the navbar envelope pill on every authenticated page
        render. Cache-backed (per-recipient LRU + cache.Registry
        NOTIFY broadcast on every write/mark-read).
      tags: [messages, account]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Unread-DM count.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectMessageUnreadCount" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /account/messages/{peer_ref}:
    parameters:
      - name: peer_ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: listDirectMessageThread
      summary: All DMs between me and a specific peer
      description: |
        Cursor-paginated newest-first. Caller must be one of the
        two participants (gate enforced by the WHERE clause — no
        separate "is this thread mine?" check needed). 404 when
        the peer doesn't exist.
      tags: [messages, account]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A page of messages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectMessageList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: sendDirectMessage
      summary: Send a DM to a peer
      description: |
        Send a DM to the user at {peer_ref}. Self-DM rejected with
        400. A block edge in either direction rejects with 403 —
        the same gate the FollowUser path enforces.

        On success, a `direct_message_received` notification fires
        to the recipient via the notifications writer
        (which independently re-runs the block + channel-pref
        gates, so a user who muted the verb still gets the DM in
        their inbox but no bell ping).
      tags: [messages, account]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendDirectMessageRequest" }
      responses:
        "201":
          description: Message sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectMessage" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /account/messages/{peer_ref}/read:
    parameters:
      - name: peer_ref
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: markDirectMessageThreadRead
      summary: Mark every unread DM from this peer as read
      description: |
        Idempotent. Called when the caller opens the thread.
        Returns count of rows newly-flipped so the envelope pill
        can decrement deterministically.
      tags: [messages, account]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: How many were just marked read.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectMessageMarkReadResult" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /account/shared-posts:
    get:
      operationId: listPostsSharedWithMe
      summary: Posts other people have explicitly shared with me
      description: |
        The "Shared with me" surface (#875). Returns the posts on
        which the caller holds a live `post_acls` grant — the same
        grant `POST /posts/{id}/acls` writes and the post read rule
        honours, evaluated by the same SQL fragment so the two can
        never disagree about what a grant means.

        This exists because the browse feed deliberately does NOT
        surface shares: `GET /posts` defaults to the `org-only` tier,
        and widening that default would put low-volume, high-salience
        content into the hottest query in the app. Shares are
        announced by a `post_shared_with_me` notification and
        accumulate here instead.

        Expiry and revocation are evaluated in SQL: a grant whose
        `expires_at` has passed, or whose row has been deleted,
        drops off this list immediately. Soft-deleted posts never
        appear. Newest-first, cursor-paginated on the same
        (posted_at, id) key as the feed.
      tags: [posts, account]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A page of posts shared with the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /account/activity:
    get:
      operationId: listMyActivity
      summary: My activity — what I did, and what was done to my account
      description: |
        One newest-first list of the audit rows that name the caller,
        on either side: `actor_user_ref = caller` (things the caller
        did) or `subject_user_ref = caller` (things done to the
        caller's account). The `role` discriminator says which.

        WHY THIS IS NOT THE ADMIN AUDIT VIEWER WITH A FILTER. The
        admin surface (`GET /admin/audit`) is a log reader: every
        column, arbitrary actor/subject filters, and `ip` behind
        `system.audit.pii.read` (#425). Handing an ordinary caller a
        pre-filtered version of it would ship them a projection built
        for an auditor. This one answers a narrower question — "what
        happened involving me" — and its projection is cut to that
        question rather than trimmed down from the other one.

        THE PROJECTION, AND WHY IT REFUSES WHAT IT REFUSES. It follows
        the `/account/trash` precedent: disclose the ACT, never the
        other party's details.

        `metadata` ships only on `by_me` rows. A `by_me` row is the
        caller's own action read back, so its payload is a record of
        something they did and already knew. An `on_my_account` row is
        somebody ELSE's action, and there the event type plus the time
        IS the disclosure: you are told that your account was disabled
        and when, which is the fact you need in order to ask about it.
        The metadata of an administrative action is that
        administrator's working note — the free-text `reason` on a
        status change, the `capability` and `team_id` on a grant — and
        volunteering it here would be widening by convenience, the
        same move the trash listing refuses when it declines to name
        the deleter.

        For the same reason `on_my_account` rows carry NO actor
        identity. The trash projection returns whether the caller may
        undo a delete and never who performed it; this returns that an
        event happened to the caller and never who caused it. Neither
        act disclosed the identity of the person who took it, and an
        account page is not the place to start.

        NO `ip` AND NO `user_agent`, IN EITHER ROLE. Not gated —
        absent. `/account/sessions` already owns "where has my account
        been signed in from", with its own shape and its own
        revocation controls, and #425's capability rule is an
        admin-side rule about reading OTHER people's personal data.
        Answering the same question a second way here would be a
        second surface to keep correct for no new answer.

        Ordering and pagination are the (`occurred_at`, `id`) keyset,
        DESC, with the id tiebreak carrying the same comparison as the
        timestamp — audit rows written by one request share a
        timestamp to the microsecond, so the tiebreak is the common
        case rather than the rare one.

        Rows are subject to the audit retention purge (ADR 0032), so
        this is a window on the log, not a permanent history.
      tags: [account]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          description: Opaque token from a previous response's `next_cursor`.
          schema: { type: string }
      responses:
        "200":
          description: A page of the caller's own activity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityList" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /account/trash:
    get:
      operationId: listMyTrash
      summary: My trash — the soft-deleted items I own, or the ones I deleted
      description: |
        One mixed, newest-deleted-first list of everything the caller
        OWNS that is currently soft-deleted, across all three
        soft-deletable entities. Each row carries the `kind` needed to
        pick the matching restore endpoint.

        `scope=deleted_by_me` answers the OTHER half of the same
        question (#981). `CanRestoreDeleted` grants the undo to whoever
        performed the delete, so a team lead who removes a colleague's
        asset may restore it — but the default scope is owner-scoped,
        so that item lists in the OWNER's trash (non-restorable for
        them, since they did not delete it) and in nobody's as
        restorable. The lead held a restore right they could not reach.
        This scope lists exactly the rows where
        `deleted_by_user_ref = caller AND owner IS DISTINCT FROM caller`
        — the caller's own deletions of other people's things — and
        every one of them comes back `restorable_by_caller: true` by
        the same predicate, because the deleter is the caller.

        IT IS NOT A PROBE. The two scopes disclose on different
        grounds, and this one's ground is the caller's own prior act:
        the delete already succeeded for this caller against this row,
        which means they could both see it and mutate it at that
        moment. The response therefore reveals nothing they did not
        already have. It also cannot be steered — there is no
        `user`/`owner` filter, only the caller's own ref taken from
        the session — so it lists a caller's history, never a search
        over someone else's content. The projection is byte-for-byte
        the one the owned scope returns; in particular it does NOT add
        the owner's identity, which would be a disclosure the delete
        itself never made.

        WHY THIS EXISTS SEPARATELY FROM `include_deleted=true` (#937).
        `GET /assets`, `GET /posts` and `GET /collections` all accept
        `include_deleted=true` and all silently drop it for anyone
        below `system.admin`. That is deliberate and stays: those
        listings are not owner-scoped, so honouring the flag for an
        ordinary caller would turn each of them into a probe for
        deleted rows that caller has no other way to observe. Self-
        service restore (#936) shipped nonetheless, which left the
        owner able to restore items but with no way to learn their
        ids. This endpoint closes that without touching the admin
        flag: it answers a strictly narrower question — "what of MINE
        is in the bin" — and so cannot disclose anything the caller
        did not already know existed.

        `restorable_by_caller` is the same decision the matching
        `POST /admin/{assets,posts,collections}/{id}/restore` will
        make, computed by the same predicate rather than by a second
        copy of the rule, so the button this list renders can never
        disagree with the endpoint it calls. It is FALSE when someone
        else deleted the item — an administrator moderating it, or a
        team-mate with mutation rights — and also false when the
        deleter was never recorded (rows predating migration 00037,
        and system-scheduled retention deletes), because both fail
        closed to `system.admin`. The identity of the deleter is NOT
        returned: the owner needs to know whether they may undo it,
        not who did it, and `deleted_by_user_ref` stays server-side.

        Ordering and pagination are the (`deleted_at`, `id`) keyset,
        DESC, with the id tiebreak carrying the same comparison as the
        timestamp — items deleted in one batch share a `deleted_at`
        almost exactly, so the tiebreak is the common case here, not
        the rare one.
      tags: [account]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: scope
          in: query
          required: false
          description: |
            `owned_by_me` (default) — soft-deleted items the caller
            owns, whoever deleted them. `deleted_by_me` — items the
            caller deleted that they do NOT own; always restorable by
            them. The two sets are disjoint by construction, so a
            client showing both as tabs never double-lists a row.
          schema:
            type: string
            enum: [owned_by_me, deleted_by_me]
            default: owned_by_me
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          description: Opaque token from a previous response's `next_cursor`.
          schema: { type: string }
      responses:
        "200":
          description: A page of the caller's own soft-deleted items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrashList" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /account/trash/{kind}/{id}/request-restore:
    post:
      operationId: requestRestore
      summary: Appeal a delete you cannot undo yourself
      description: |
        Files a `pending` resource_request asking whoever deleted this
        item to put it back (#931).

        This is the OTHER half of `auth.CanRestoreDeleted`. That rule
        gives the undo to the deleter, and to `system.admin` — so an
        owner whose work an administrator removed sees a trash row that
        says someone else deleted it and, before this endpoint, was
        offered nothing further. The row was a dead end.

        ## The capability is not an input

        The server writes `content.restore.request` and there is no
        field on this body to say otherwise. `requested_capability`
        feeds an authorisation decision, and ADR 0064 already names the
        hazard of taking it from the requester: "nothing stops a request
        naming system.admin". `/assets/{id}/request-access` still
        ACCEPTS an explicit code for admin tooling that predates the
        button; this endpoint accepts none at all, because there is no
        second thing an appeal could ask for.

        ## Who may file one

        The item's owner, and only while the item is soft-deleted.
        Someone who could restore it directly gets **409** rather than a
        request nobody needs to answer — the honest reply to "please ask
        them to undo it" when you may undo it yourself is "you can do
        that". Any other caller gets **404**: an appeal endpoint that
        distinguished "not yours" from "no such row" would be a probe
        for other people's deleted items.

        Repeating an appeal you already have pending returns **200**
        with the existing row, unchanged, matching
        `/assets/{id}/request-access`. One ask is
        (requester, kind, id, capability); asking twice is the same
        question, and a second row would make the decider deny one of
        them.

        ## What granting it does

        Performs the restore. The grant branch calls the same
        `softdelete` primitive the per-kind restore endpoints call and
        writes NO `user_capability_grants` row — the marker confers
        nothing and there is nothing to confer, because the outcome the
        requester asked for is a state change on the item, not a
        standing right. See `POST /admin/requests/{id}/decide`.
      tags: [account, requests]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: kind
          in: path
          required: true
          description: Which soft-deletable entity `id` names.
          schema:
            type: string
            enum: [asset, post, collection]
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 1000
                  description: |
                    Optional free text for the decider — why this
                    should come back.
      responses:
        "200":
          description: |
            An identical appeal was already pending. The existing
            request is returned unchanged; nothing was created and
            nobody was notified again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceRequest" }
        "201":
          description: Appeal filed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceRequest" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            No such soft-deleted row of that kind, or it is not the
            caller's. One response for both, deliberately.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            The caller may already restore this item directly (they
            deleted it, or they hold `system.admin`). Nothing to
            appeal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /account/notifications:
    get:
      operationId: listMyNotifications
      summary: My notification feed
      description: |
        Cursor-paginated notification feed for the caller. Newest-
        first; `only_unread=true` restricts to the unread tail
        (the inbox's "Unread" tab). Each notification carries a
        verb (matching userprefs.KnownEventTypes), an optional
        actor, an optional polymorphic target reference
        (target_kind + target_id), and a JSONB payload with per-
        verb extra context the frontend renderer reads.
      tags: [notifications, account]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: only_unread
          in: query
          required: false
          schema: { type: boolean }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A page of notifications.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationList" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /account/notifications/unread-count:
    get:
      operationId: getMyUnreadNotificationCount
      summary: My unread badge count
      description: |
        The hot read behind the navbar bell on every authenticated
        page render. Backed by a partial index (`WHERE read_at IS
        NULL`) so the working set stays bounded even as the
        lifetime notifications table grows. Per-user cached via
        cache.Registry — invalidates on every write to this user's
        rows.
      tags: [notifications, account]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Unread count snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationUnreadCount" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /account/notifications/{id}/read:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: markNotificationRead
      summary: Mark a single notification as read
      description: |
        Idempotent: 204 whether the row was unread or already read.
        Only the recipient can mark — the row's recipient column
        gates the update so cross-user calls 404 silently.
      tags: [notifications, account]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Marked read (or was already).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /account/notifications/read-all:
    post:
      operationId: markAllMyNotificationsRead
      summary: Mark every unread notification as read
      description: |
        Inbox header "Mark all read". Returns the count of rows
        newly-flipped so the UI can render a "Marked 12 as read"
        confirmation. Idempotent — running twice in a row returns
        0 the second time.
      tags: [notifications, account]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: How many rows were just marked read.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationMarkAllResult" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /account/blocked:
    get:
      operationId: listMyBlocked
      summary: My block list (private to the caller)
      description: |
        Paginated list of users the caller has
        blocked, with the optional private reason. The reverse
        direction ("who blocked me") is deliberately NOT exposed
        per platform convention — it's the blocker's privacy.
      tags: [social, account]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Blocked-users list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockedUserList" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me/teams:
    get:
      operationId: getMyTeams
      summary: Teams the caller is a member of (direct memberships)
      description: |
        Returns rows from team_memberships for the caller's
        user_ref. Use this in the upload modal to render a team
        picker. Includes only direct memberships; the closure-walk
        for capability resolution happens server-side.
      tags: [teams, auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Caller's teams
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Team" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /build-info:
    get:
      operationId: getBuildInfo
      summary: Server version / build info
      description: |
        Returns the running server's version string — the git tag baked
        in at build time via `-ldflags "-X main.Version=..."`, or `dev`
        on an untagged build. Anonymous: the version is not sensitive
        and is useful for support, federation handshakes, and the admin
        About page (which renders it instead of a hardcoded stub).
      tags: [setup]
      security: []
      responses:
        "200":
          description: Build info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildInfo"
        "500":
          $ref: "#/components/responses/InternalError"

  /setup/status:
    get:
      operationId: getSetupStatus
      summary: First-run setup status + admin-form prefills
      description: |
        Returns whether the system still needs first-run setup, plus
        read-only deployment info (DB host/port, storage backend) and
        any prefill values the admin's deploy environment provided via
        `AA_SETUP_DEFAULT_*` env vars. Anonymous access — this is the
        first thing a brand-new install renders.
      tags: [setup]
      security: []
      responses:
        "200":
          description: Setup status + defaults
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
        "500":
          $ref: "#/components/responses/InternalError"

  /setup/complete:
    post:
      operationId: completeSetup
      summary: Finalize first-run setup (admin + site + SMTP)
      description: |
        One-shot transactional endpoint that creates the first admin
        user, writes site identity (display name, base URL), and
        optionally writes SMTP credentials. Only callable while no
        `system.admin` user exists; subsequent calls return 409.

        SMTP is optional — pass `null` for the `smtp` field if email
        is not configured yet. The admin UI surfaces email-dependent
        features (password reset, notifications) as disabled until
        SMTP is filled in later.
      tags: [setup]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupCompleteRequest"
      responses:
        "201":
          description: Setup complete; first admin is now active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: System already has an administrator; setup is not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /workflow/states:
    get:
      operationId: listWorkflowStates
      summary: List workflow states for a domain
      description: |
        Returns every state in the requested domain (post, asset, ...)
        ordered by `sort_order`. Used by the upload modal's "set
        initial state" dropdown and any management surface that needs
        to render state pickers. The set of domains and states is
        seeded at install time; this endpoint is read-only.
      tags: [workflow]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: domain
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
            example: post
          description: |
            Domain key as stored in `workflow_states.domain`. Common
            values: `post` (all posts), `asset:1` (assets of resource
            type 1 — Photo), `asset:3` (Video), etc.
      responses:
        "200":
          description: States in the requested domain
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkflowState" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/system/site:
    get:
      operationId: getSiteConfig
      summary: Read the site configuration (name, base URL)
