        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/like:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getPostLike
      summary: Whether the current caller has liked this post
      description: |
        Used by the post modal on open to decide whether the Like
        button shows the active state. Returns {liked: bool}.
        Anonymous callers get 401.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Like state for the caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostLikeState" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: likePost
      summary: Like a post
      description: |
        Idempotent — re-liking a post the caller already liked is a
        no-op (counter doesn't bump twice). Requires `posts.like`
        capability (granted to Base by default).
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Liked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: unlikePost
      summary: Remove the caller's like on a post
      description: |
        404 if the caller hadn't liked the post (the optimistic-update
        client uses this signal to revert its local state). Counter
        is maintained by the 00020 trigger; we never decrement to
        below zero.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Unliked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/comments:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listPostComments
      summary: List the comment thread on a post
      description: |
        Returns LIVE comments (deleted_at IS NULL), grouped by root,
        within each root sorted depth-then-time so replies appear
        under their parent. Threads ordered newest-root-first.
        Cursor pagination advances by root.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: A page of comments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createPostComment
      summary: Post a comment (or reply) on a post
      description: |
        Top-level comment when `parent_id` is omitted; reply when set.
        Depth and root_id are computed server-side from the parent's
        row. Requires `posts.comment` capability (Base default).
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentCreate" }
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/whiteboards:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listPostWhiteboards
      summary: List whiteboard sketches on a post
      description: |
        Whiteboards are free-form brush sketches anchored to a post —
        brainstorm sessions, sketch passes, off-asset notes.
        Storage-wise they're top-level `comments` rows with
        `annotation_type='whiteboard'`; the partial index
        `comments_whiteboards_idx` makes this query cheap.

        Replies to a whiteboard are normal comments threaded under it
        and surface via the regular comment thread query, not this
        list.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Whiteboards for the post (newest first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Comment" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createPostWhiteboard
      summary: Save a whiteboard sketch on a post
      description: |
        Persists a brush-sketch as a top-level comment with
        `annotation_type='whiteboard'`. The `content` payload carries
        the strokes (vector source of truth — perfect-freehand input
        points + per-layer arrangement) plus the source canvas
        dimensions so the viewer can re-render proportionally
        regardless of viewport size.

        Requires `posts.comment` capability (Base default) — same
        gate as posting a regular comment, since whiteboards ARE
        comments at the storage layer. Future phases can split the
        capability if finer governance is needed.

        `title` is optional. If omitted the sidebar list shows
        "Untitled sketch" with the author + timestamp.
      tags: [posts]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WhiteboardCreate" }
      responses:
        "201":
          description: Whiteboard saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/lint:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: lintAsset
      summary: Run syntax checks against a doc asset's source
      description: |
        Dispatches to a language-aware syntax checker based on the
        asset's file extension and returns a flat diagnostic list.

        First cut ships three Go-native checkers (JSON / YAML /
        Markdown). For any other extension the response carries
        `skipped: true` so the UI can render "no linter configured
        for this language" instead of "0 issues".

        Future iterations slot in subprocess-based linters
        (`py_compile`, `node --check`, `luac -p`, `shellcheck`, ...)
        behind the same shape; the client doesn't need to know which
        producer generated a diagnostic — it just renders the line /
        col / severity / message.

        Synchronous: every Go-native checker runs in single-digit
        milliseconds on a typical doc.
      tags: [assets]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Lint result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LintResult" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/text-annotations:
    parameters:
