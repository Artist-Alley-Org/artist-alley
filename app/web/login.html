<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Sign in — artist-alley</title>
    <style>
        :root {
            color-scheme: dark light;
            --bg:        #0f1115;
            --fg:        #e7e9ec;
            --muted:     #8a8f9a;
            --field-bg:  #1a1d23;
            --field-bdr: #2a2e36;
            --accent:    #5cabff;
            --error:     #ff6b6b;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg:        #f7f7f8;
                --fg:        #16181d;
                --muted:     #5a606b;
                --field-bg:  #ffffff;
                --field-bdr: #d3d6dc;
                --accent:    #1a73e8;
                --error:     #c0392b;
            }
        }
        html, body { height: 100%; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
            display: grid;
            place-items: center;
        }
        .card {
            width: min(360px, calc(100vw - 32px));
            padding: 28px 28px 24px;
            background: color-mix(in srgb, var(--bg) 90%, white 4%);
            border: 1px solid var(--field-bdr);
            border-radius: 10px;
        }
        h1 {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 4px;
            letter-spacing: -0.01em;
        }
        .subtitle {
            color: var(--muted);
            font-size: 13px;
            margin: 0 0 22px;
        }
        label {
            display: block;
            font-size: 12px;
            color: var(--muted);
            margin: 14px 0 6px;
        }
        input[type=text], input[type=password] {
            width: 100%;
            box-sizing: border-box;
            padding: 9px 11px;
            font: inherit;
            color: var(--fg);
            background: var(--field-bg);
            border: 1px solid var(--field-bdr);
            border-radius: 6px;
            outline: none;
            transition: border-color 120ms ease;
        }
        input:focus { border-color: var(--accent); }
        button {
            width: 100%;
            margin-top: 18px;
            padding: 10px 12px;
            font: inherit;
            font-weight: 500;
            color: white;
            background: var(--accent);
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            transition: filter 100ms ease;
        }
        button:hover:not(:disabled) { filter: brightness(1.08); }
        button:disabled { opacity: 0.55; cursor: not-allowed; }
        .error {
            display: none;
            margin-top: 14px;
            padding: 10px 12px;
            color: var(--error);
            background: color-mix(in srgb, var(--error) 12%, transparent);
            border: 1px solid color-mix(in srgb, var(--error) 35%, transparent);
            border-radius: 6px;
            font-size: 13px;
        }
        .error.show { display: block; }
        footer {
            margin-top: 22px;
            color: var(--muted);
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Sign in</h1>
        <p class="subtitle">artist-alley</p>

        <form id="login-form" novalidate>
            <label for="username">Username or email</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button id="submit" type="submit">Sign in</button>
            <div id="error" class="error" role="alert"></div>
        </form>

        <footer>Self-hosted. No account creation here — ask an admin.</footer>
    </main>

    <script>
        (async function () {
            // If the user is already signed in, bounce to the home
            // landing — no point showing the form.
            try {
                const me = await fetch('/api/v1/auth/me', { credentials: 'same-origin' });
                if (me.ok) {
                    location.replace('/');
                    return;
                }
            } catch { /* fall through */ }

            // If the install is fresh, send the user to the setup
            // wizard instead of letting them stare at a login form
            // they can never satisfy.
            try {
                const r = await fetch('/api/v1/setup/status', { credentials: 'same-origin' });
                if (r.ok) {
                    const body = await r.json();
                    if (body.needs_setup) {
                        location.replace('/setup');
                        return;
                    }
                }
            } catch { /* fall through to the form */ }

            const form    = document.getElementById('login-form');
            const submit  = document.getElementById('submit');
            const errBox  = document.getElementById('error');

            function showError(msg) {
                errBox.textContent = msg;
                errBox.classList.add('show');
            }
            function clearError() {
                errBox.classList.remove('show');
                errBox.textContent = '';
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                clearError();
                submit.disabled = true;
                submit.textContent = 'Signing in…';

                const username = form.username.value.trim();
                const password = form.password.value;

                try {
                    const resp = await fetch('/api/v1/auth/login', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ username, password }),
                    });

                    if (resp.ok) {
                        // Respect ?url= param if present (matches the legacy login.php behaviour);
                        // fall back to "/" which the legacy stack serves via index.php.
                        const params = new URLSearchParams(location.search);
                        const next = params.get('url') || '/';
                        location.href = next.startsWith('/') ? next : '/';
                        return;
                    }

                    let body = {};
                    try { body = await resp.json(); } catch { /* non-JSON */ }
                    if (resp.status === 429) {
                        showError(body.error || 'Too many attempts. Try again shortly.');
                    } else if (resp.status === 401) {
                        showError(body.error || 'Invalid credentials.');
                    } else {
                        showError('Something went wrong. Please try again.');
                    }
                } catch (err) {
                    showError('Network error: ' + err.message);
                } finally {
                    submit.disabled = false;
                    submit.textContent = 'Sign in';
                }
            });
        })();
    </script>
</body>
</html>
