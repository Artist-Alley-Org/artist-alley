<!doctype html>
<html lang="en" %sveltekit.theme%>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <meta name="description" content="artist-alley — a self-hosted art review and archival tool." />
    <meta name="theme-color" content="#0a0a0a" />

    <!--
      Theme is set as early as possible to prevent flash-of-wrong-theme.
      Reads the aa_theme cookie and applies a class to <html> before any
      stylesheet loads.

      Resolution order (#590):
        1. explicit cookie 'light' | 'dark'  — always wins
        2. explicit cookie 'system'          — follow the OS
        3. no cookie                         — DARK, the app's identity

      Step 3 is the change. This comment always claimed dark was the
      default, but the code defaulted `pref` to 'system', so a visitor on
      a light-mode OS got light and dark only happened in the catch. Dark
      is the brand now, so a first-time visitor sees it regardless of
      their OS; `system` stays available as a deliberate choice for
      people who want OS-following.

      MUST stay in lockstep with theme.svelte.ts (readCookie + init) — if
      the two disagree the page repaints after hydration, which is the
      flash this script exists to prevent.
    -->
    <script>
      (function () {
        try {
          var cookie = document.cookie.split('; ').find(function (c) {
            return c.indexOf('aa_theme=') === 0;
          });
          var pref = cookie ? cookie.split('=')[1] : 'dark';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = pref === 'system' ? (prefersDark ? 'dark' : 'light') : pref;
          if (resolved !== 'light' && resolved !== 'dark') resolved = 'dark';
          document.documentElement.classList.add(resolved);
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <!--
      Language is resolved before paint for the same reason theme is,
      and for one extra reason theme does not have (#967).

      This is a static build: the page paints long before /auth/me
      answers, so a signed-in French account's language cannot be known
      at first paint. Without this script every cold load rendered
      English first and swapped after hydration. `lang.syncFromAccount()`
      writes the aa_lang cookie precisely so this script has something to
      read, and `auth.logout()` clears it so a shared machine never
      paints the previous account's language for the next visitor.

      It also sets the ATTRIBUTE, which nothing did before: `<html
      lang>` below is hardcoded `en`, and a fully French render used to
      announce itself as English to screen readers and to `:lang()`.

      Resolution order — identical to lang.init():
        1. aa_lang cookie, when non-empty
        2. navigator.language
        3. 'en'
      matched exactly ("fr"), then by language subtag ("fr-CA" -> "fr"),
      then defaulted.

      MUST stay in lockstep with locales.ts (SUPPORTED_LOCALES,
      DEFAULT_LOCALE, resolveLocale) and with lang.svelte.ts. The locale
      list is repeated here because this script runs before any module
      loads and cannot import it; langScript.test.ts parses this file and
      fails if the two lists diverge, so adding a catalogue without
      adding it here is caught rather than silently un-painted.
    -->
    <script>
      (function () {
        try {
          var supported = ['en', 'es', 'fr'];
          var fallback = 'en';
          var cookie = document.cookie.split('; ').find(function (c) {
            return c.indexOf('aa_lang=') === 0;
          });
          var pref = cookie ? decodeURIComponent(cookie.slice('aa_lang='.length)) : '';
          if (!pref) pref = navigator.language || fallback;
          var resolved = fallback;
          if (supported.indexOf(pref) !== -1) {
            resolved = pref;
          } else {
            var base = pref.split('-')[0];
            if (supported.indexOf(base) !== -1) resolved = base;
          }
          document.documentElement.setAttribute('lang', resolved);
        } catch (e) {
          document.documentElement.setAttribute('lang', 'en');
        }
      })();
    </script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-surface text-fg antialiased">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
